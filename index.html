<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOMADIA — 약국 QR 프로토타입 v2 (밀크 상세)</title>
<style>
  :root{
    --font-sans:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans Thai",-apple-system,BlinkMacSystemFont,sans-serif;
    --ink:#1c1a17; --ink-2:#57534d; --ink-3:#8b867e;
    --paper:#f2efe9; --panel:#ffffff; --line:#1c1c1c; --line-2:#1c1c1c;
    --milk:#dbe6ef; --milk-ink:#3f5468;
    --bubble:#f0e6cf; --bubble-ink:#7a6636;
    --wide:0.08em;
  }
  /* NOTE — 스타일 정리 원칙 (2026-07):
     1) 라운드(border-radius) 전면 제거 — 예외는 .device 하나 뿐(실물 폰 하드웨어 베젤 목업이라 "페이지 디자인"이 아니라서 유지).
     2) 폰트는 전부 Pretendard, weight는 500 이하만 사용(브랜드 가이드 §Weight 운용원칙). 숫자류는 tabular-nums 유지.
     3) 기본 본문 텍스트는 14px 기준 — 브랜드 가이드 자체 체크리스트는 모바일 본문 15px 이상을 권장하니, 엄격 준수가 필요하면 1px만 올리면 됨.
     4) 배경 위계 — 페이지 전체는 연한 미색(--paper), 리뷰·제품카드·통계 등 "카드"만 화이트(--panel)로 띄워 대비.
     5) 아웃라인 — 버튼(gate-pill·lang-btn·acc·modal button)과 뱃지(trust·chip·step 번호·soc)에만 유지. 카드·디바이더 등 나머지는 배경 대비/여백만으로 구분.
  */
  *{box-sizing:border-box;border-radius:0;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--font-sans);background:#d9d4cb;color:var(--ink);
    -webkit-font-smoothing:antialiased;font-weight:400;font-size:14px;
    display:flex;min-height:100%;justify-content:center;align-items:flex-start;padding:28px 16px 60px;}
  .stage{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap;justify-content:center;max-width:830px;}

  .device-col{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .device{width:334px;height:710px;background:var(--paper);border:1px solid #b8b2a7;border-radius:34px;
    position:relative;overflow:hidden;display:flex;flex-direction:column;}
  .statusbar{height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .statusbar .dot{width:54px;height:5px;background:#d7d1c6;}

  .gnb{height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;background:transparent;position:absolute;top:24px;left:0;right:0;z-index:15;
    transition:background .15s;}
  .gnb.solid{background:var(--panel);border-bottom:1px solid var(--line);}
  .gnb-side{display:flex;align-items:center;gap:2px;min-width:70px;}
  .gnb-side.right{justify-content:flex-end;}
  .gnb-btn{width:36px;height:36px;border:none;background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink);}
  .gnb-btn:hover{background:var(--paper);}
  .gnb-btn[disabled]{color:#d5cfc4;cursor:default;}
  .gnb-btn[disabled]:hover{background:none;}
  .wordmark{font-size:14px;font-weight:500;letter-spacing:0.14em;cursor:pointer;}
  .gnb-logo{height:19.5px;width:auto;display:block;}
  .lang-btn{border:1px solid var(--line-2);height:30px;padding:0 9px;background:none;
    font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:3px;}

  .viewport{flex:1;overflow-y:auto;position:relative;}
  .view{display:none;}
  .view.active{display:block;}
  .pad{padding:66px 16px 30px;}

  .label{font-size:12px;font-weight:500;letter-spacing:var(--wide);text-transform:uppercase;color:var(--ink-3);}
  .ph{background:repeating-linear-gradient(-45deg,#efece6,#efece6 6px,#e7e3db 6px,#e7e3db 12px);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-3);font-size:12px;text-align:center;}
  .bar{height:9px;background:#e7e3db;margin:7px 0;}
  .bar.w90{width:90%;}.bar.w70{width:70%;}

  /* gate */
  #gate{background:#646464;min-height:100%;}
  .gate-inner{height:100%;display:flex;flex-direction:column;justify-content:center;padding:34px 26px;}
  .gate-mark{text-align:center;margin-bottom:40px;}
  .gate-logo-full{width:180px;max-width:70%;height:auto;}
  .gate-q{text-align:center;font-size:18px;font-weight:500;margin-bottom:4px;color:#fff;}
  .gate-q-en{text-align:center;font-size:14px;color:#fff;margin-bottom:26px;}
  .gate-pill{width:100%;border:1px solid #fff;padding:15px;margin-bottom:9px;position:relative;
    background:#fff;font-family:inherit;font-size:15.5px;font-weight:500;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;text-align:center;}
  .gate-pill:hover{border-color:#fff;background:#ededed;}
  .gate-pill .rec-icon{position:absolute;right:15px;top:50%;transform:translateY(-50%);}

  /* list */
  #list{background:var(--panel);}
  .brandline{margin-bottom:20px;text-align:center;}
  .brandline .ko{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:5px;letter-spacing:0.03em;}
  .brandline .en{font-family:"EB Garamond",var(--font-sans);font-size:14.5px;font-style:italic;color:var(--ink-2);}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 12px;}
  .prod-list{display:flex;flex-direction:column;margin:0 -16px;}
  .prod-list .prod-card{background:none;padding:14px 16px;border-top:1px solid #e2ddd0;}
  .prod-list .prod-card:first-child{border-top-color:transparent;}
  .prod-card{border:1px solid transparent;cursor:pointer;display:flex;gap:12px;align-items:stretch;background:var(--panel);}
  .prod-card:hover{border-color:var(--ink);}
  .prod-list .prod-card:first-child:hover{border-top-color:var(--ink);}
  .prod-thumb{width:104px;aspect-ratio:4/5;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;text-align:center;line-height:1.3;}
  .prod-thumb-img{width:104px;aspect-ratio:4/5;flex-shrink:0;object-fit:cover;}
  .prod-thumb.milk{background:var(--milk);color:var(--milk-ink);}
  .prod-thumb.bubble{background:var(--bubble);color:var(--bubble-ink);}
  .prod-meta{flex:1;min-width:0;padding:14px 4px 14px 0;display:flex;flex-direction:column;justify-content:center;}
  .prod-name{font-size:15px;font-weight:500;line-height:1.35;margin-bottom:3px;}
  .prod-name-en{font-size:12.5px;color:var(--ink-3);line-height:1.35;}
  .prod-go{font-size:14px;color:var(--ink-3);flex-shrink:0;width:20px;display:flex;align-items:center;justify-content:center;}

  /* mentions (shared) */
  .mentions{padding:0 16px;margin:0 -16px;}
  .review-list{margin-top:10px;}
  .review-item{padding:14px 0;border-top:1px solid #e2ddd0;}
  .review-item:first-child{border-top:none;}
  .load-more{display:block;width:100%;margin-top:6px;padding:10px 0;background:none;border:none;
    font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:center;}

  .footer{margin-top:28px;text-align:center;}
  .copyr{font-size:11px;letter-spacing:0.1em;color:var(--ink-3);}

  /* brand intro (list page) */
  .brand-intro{margin:0 -16px;border-top:1px solid #e2ddd0;}
  .brand-intro-label{padding:18px 16px 12px;text-align:center;}
  .brand-intro-img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;}
  .brand-intro-img.brand-intro-logo{aspect-ratio:auto;object-fit:contain;}
  .brand-intro-second-img{display:block;width:100%;margin:0 0 16px;}
  .brand-intro-body{padding:14px 16px 4px;}
  .brand-intro-text{font-size:14px;line-height:1.7;color:var(--ink-2);margin:0 0 16px;}
  .brand-intro-text:last-of-type{margin-bottom:0;}
  .brand-emblem-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;margin:24px 0;}
  .brand-emblem-img{width:176px;height:176px;display:block;margin-bottom:14px;}
  .brand-emblem-caption{font-size:11px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-2);line-height:1.7;}
  .brand-emblem-divider{width:28px;height:1px;background:#c9c3b8;margin:10px 0;}
  .brand-emblem-tagline{font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3);line-height:1.7;}
  .brand-intro-disclosure{font-size:12.5px;color:var(--ink-3);text-align:center;line-height:1.6;}

  /* ===== DETAIL (milk) ===== */
  #detail{background:var(--panel);}
  .l10n-note{background:var(--bubble);color:var(--bubble-ink);font-size:12px;text-align:center;padding:7px;}
  .hero-wrap{position:relative;}
  .hero-gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
  .hero-gallery::-webkit-scrollbar{display:none;}
  .hero-slide{width:100%;flex-shrink:0;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:start;background:var(--milk);}
  .hero-dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:7px;}
  .hero-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);border:none;padding:0;cursor:pointer;}
  .hero-dot.active{background:#fff;}
  .d-head{padding:16px 16px 4px;}
  .d-name{font-size:22px;font-weight:500;line-height:1.28;letter-spacing:-0.01em;margin-bottom:4px;}
  .d-name-en{font-size:13px;color:var(--ink-3);margin-bottom:8px;}
  .d-tagline{font-size:14.5px;color:var(--ink-2);line-height:1.6;margin-bottom:9px;}
  .d-vol{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;}

  .tagrow{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;padding:14px 16px 4px;}
  .trust{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);}
  .trust .ck{color:#3f7a52;font-size:13px;flex-shrink:0;font-weight:500;}

  .sec{padding:24px 16px;}
  .sec-acc{border-top:1px solid #e2ddd0;}
  .sec-acc-close{border-top:1px solid #e2ddd0;}
  .sec-head-row{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .sec-title{font-size:16px;font-weight:700;margin:0;letter-spacing:0.03em;text-transform:uppercase;}
  .sec-plus{font-size:16px;font-weight:400;color:var(--ink-3);flex-shrink:0;}
  .sec-body{margin-top:15px;}
  .sec-banner{width:100%;aspect-ratio:1/1;object-fit:cover;margin-bottom:16px;}

  .benefit{display:flex;gap:12px;margin-bottom:18px;}
  .benefit:last-child{margin-bottom:0;}
  .b-ico{width:36px;height:36px;background:var(--milk);color:var(--milk-ink);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:17px;}
  .b-t{font-size:15.5px;font-weight:500;margin-bottom:4px;line-height:1.35;}
  .b-d{font-size:14px;color:var(--ink-2);line-height:1.6;}

  .note{font-size:11.5px;color:var(--ink-3);line-height:1.55;margin-top:9px;}

  .label.sub-label{display:block;margin-bottom:10px;}
  .ba-row{display:flex;gap:8px;margin-bottom:8px;}
  .ba-card{flex:1;aspect-ratio:4/5;font-size:11px;}
  .ba-fig{flex:1;margin:0;}
  .ba-img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;}
  .ba-cap{font-size:11px;color:var(--ink-3);text-align:center;margin-top:6px;letter-spacing:0.04em;text-transform:uppercase;}
  .stats{display:flex;gap:8px;}
  .stat{flex:1;background:var(--panel);padding:14px 8px;text-align:center;}
  .stat .v{font-size:27px;font-weight:500;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1;}
  .stat .l{font-size:12px;color:var(--ink-2);line-height:1.45;margin-top:8px;}

  .survey-box{background:none;padding:0;}
  .survey-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;}
  .survey-row .v{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;flex-shrink:0;}
  .survey-row .l{font-size:13.5px;color:var(--ink-2);text-align:right;line-height:1.4;}

  .video-embed{margin-bottom:18px;}

  .step{display:flex;gap:10px;align-items:baseline;margin-bottom:16px;}
  .step:last-child{margin-bottom:0;}
  .step .n{width:16px;flex-shrink:0;font-size:14px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;}
  .step .s{font-size:14px;color:var(--ink-2);line-height:1.55;}

  .ingr{display:flex;gap:11px;padding:15px 0;}
  .ingr .dot{width:7px;height:7px;background:var(--milk-ink);margin-top:6px;flex-shrink:0;}
  .ingr .n{font-size:14.5px;font-weight:500;margin-bottom:3px;}
  .ingr .d{font-size:13.5px;color:var(--ink-2);line-height:1.55;}
  .acc{margin-top:13px;padding:6px 0;font-size:14px;
    font-weight:500;display:flex;justify-content:center;align-items:center;gap:3px;cursor:pointer;color:var(--ink);}
  .acc .label-txt{text-decoration:underline;text-underline-offset:3px;}
  .acc .plus{color:var(--ink-3);font-weight:400;text-decoration:none;}
  .full-inci{display:none;padding:14px 2px 2px;font-size:12.5px;color:var(--ink-2);line-height:1.75;}
  .full-inci.show{display:block;}


  .buy{margin-top:6px;background:var(--panel);
    padding:15px;text-align:center;font-size:14.5px;font-weight:500;color:var(--ink);}
  .buy .sub{font-size:12px;color:var(--ink-3);font-weight:400;margin-top:4px;}

  /* social proof (early) — 프루프는 화이트 카드 배경 + 라벨·크기로만 부각, 아웃라인 없음 */
  .proof{margin:16px;padding:16px;background:var(--panel);border:1px solid #e2ddd0;}
  .proof .label{margin-bottom:10px;display:block;}
  .rating{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap;}
  .stars{color:#ffc800;font-size:20px;letter-spacing:2px;}
  .rating .score{font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;}
  .quote{font-size:14px;font-weight:500;color:var(--ink);line-height:1.55;white-space:pre-line;}
  .quote .who{display:block;color:var(--ink-3);font-size:12.5px;font-weight:400;margin-top:5px;}
  .review-top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .review-stars{color:#ffc800;font-size:13px;letter-spacing:1px;flex-shrink:0;}
  .review-meta{font-size:11.5px;color:var(--ink-3);text-align:right;}
  .review-highlight{font-size:13px;font-weight:500;color:var(--ink-2);background:var(--paper);padding:6px 10px;margin-bottom:8px;}
  .review-media{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .review-mt-note{font-size:11px;color:var(--ink-3);font-style:italic;margin-top:6px;}
  .review-img{width:88px;height:88px;object-fit:cover;flex-shrink:0;}
  .review-video{width:100%;max-width:220px;display:block;}
  .review-slide .review-item{border-top:none;padding:0;max-height:264px;overflow-y:auto;position:relative;}
  .review-slide .review-item.has-more::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;
    background:linear-gradient(to bottom, rgba(255,255,255,0), var(--panel));pointer-events:none;}
  .review-slide .review-item.has-more::before{content:"more ⌄";position:absolute;left:0;right:0;bottom:2px;
    text-align:center;font-size:10.5px;letter-spacing:0.05em;color:var(--ink-3);pointer-events:none;}
  .review-slide .quote{font-size:14px;line-height:1.5;}
  .review-slide .review-top-row{margin-bottom:4px;}
  .review-slide .review-highlight{font-size:11.5px;padding:4px 8px;margin-bottom:5px;}
  .more-slide{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:120px;gap:10px;text-align:center;cursor:pointer;}
  .more-slide .more-label{font-size:14px;font-weight:500;color:var(--ink);}
  .more-slide .more-arrow{font-size:20px;color:var(--ink-3);}
  .review-gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
  .review-gallery::-webkit-scrollbar{display:none;}
  .review-slide{width:100%;flex-shrink:0;scroll-snap-align:start;}
  .review-dots{display:flex;justify-content:center;gap:6px;margin-top:12px;}
  .review-dot{width:6px;height:6px;border-radius:50%;background:var(--line-2);opacity:.3;border:none;padding:0;cursor:pointer;}
  .review-dot.active{opacity:1;}

  /* overlays */
  .sheet-bg{position:absolute;inset:0;background:rgba(28,26,23,.4);display:none;align-items:flex-end;z-index:20;}
  .sheet-bg.show{display:flex;}
  .sheet{background:var(--panel);width:100%;padding:18px 18px 24px;}
  .sheet h4{margin:0 0 14px;font-size:14.5px;font-weight:500;}
  .note-bg{position:absolute;inset:0;background:rgba(28,26,23,.45);display:none;align-items:center;justify-content:center;z-index:25;padding:24px;}
  .note-bg.show{display:flex;}
  .modal{background:var(--panel);padding:22px 20px;text-align:center;max-width:250px;}
  .modal .label{display:block;margin-bottom:10px;}
  .modal p{font-size:14px;line-height:1.6;margin:0 0 16px;color:var(--ink-2);}
  .modal button{font-family:inherit;border:1px solid var(--line-2);background:none;padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);}

</style>
</head>
<body>
<div class="stage">
  <div class="device-col">
    <div class="device">
      <div class="statusbar"><span class="dot"></span></div>
      <div class="gnb" id="gnb" style="display:none;">
        <div class="gnb-side"><button class="gnb-btn" id="btnBack" title="뒤로가기">←</button></div>
        <div class="wordmark" id="btnHome" title="홈(링크트리)"><img class="gnb-logo" src="thumbnail/nomadia_textlogo_black.webp" alt="NOMADIA"></div>
        <div class="gnb-side right">
          <button class="lang-btn" id="btnLang">🌐 <span id="langLabel">KR</span></button>
        </div>
      </div>
      <div class="viewport">
        <section class="view" id="gate"></section>
        <section class="view" id="list"></section>
        <section class="view" id="detail"></section>
      </div>
      <div class="sheet-bg" id="langSheet"><div class="sheet"><h4>언어 선택 · Language</h4><div id="sheetList"></div></div></div>
      <div class="note-bg" id="homeNote"><div class="modal">
        <span class="label">Home → Linktree</span>
        <p>홈 버튼은 <b>외부 링크트리</b>로 이동합니다.<br>(별도 제작 · 여기에 연결)</p>
        <button onclick="closeNote()">닫기</button>
      </div></div>
    </div>
  </div>
</div>

<script>
const LANGS=[
  {code:"ko",label:"KR",native:"한국어",loc:true},
  {code:"en",label:"EN",native:"English",loc:true},
  {code:"zh-CN",label:"简中",native:"简体中文",loc:true},
  {code:"zh-TW",label:"繁中",native:"繁體中文",loc:true},
  {code:"ja",label:"日",native:"日本語",loc:true},
  {code:"th",label:"TH",native:"ภาษาไทย",loc:true},
];
const UI_I18N={
  "What people say":{"zh-CN":"顾客怎么说","zh-TW":"顧客怎麼說",ja:"お客様の声",th:"เสียงจากลูกค้า"},
  "Load more":{"zh-CN":"查看更多","zh-TW":"查看更多",ja:"もっと見る",th:"ดูเพิ่มเติม"},
  "Reviews":{"zh-CN":"评价","zh-TW":"評價",ja:"レビュー",th:"รีวิว"},
  "BENEFITS":{"zh-CN":"功效","zh-TW":"功效",ja:"効能",th:"ประสิทธิภาพ"},
  "Clinical Results":{"zh-CN":"临床结果","zh-TW":"臨床結果",ja:"臨床試験結果",th:"ผลการทดสอบทางคลินิก"},

  "\"Why do products claim to work for sensitive skin, yet still feel irritating or fail to actually improve it once you use them?\" NOMADIA was born in Seoul in 2025. Its founders have personally lived with sensitive skin — including rosacea and seborrheic dermatitis — and started the brand after discovering that no brand had been scientifically validated using the most reactive skin as its baseline.":{
    "zh-CN":"“为什么明明标榜‘适合敏感肌’，用了之后却还是刺激，或者根本没有改善？”NOMADIA于2025年在首尔诞生。创始人们本身就是长期经历酒糟鼻、脂溢性皮炎的敏感肌肤当事人，正是这段亲身经历让他们发现，市面上并不存在一个以最敏感的肌肤为基准、经过科学验证的品牌，于是决定亲自创立。",
    "zh-TW":"「為什麼明明標榜『適合敏感肌』，用了之後卻還是刺激，或根本沒有改善？」NOMADIA於2025年在首爾誕生。創辦人本身就是長期經歷酒糟性皮膚炎、脂漏性皮膚炎的敏感肌膚當事人，正是這段親身經歷讓他們發現，市面上並不存在一個以最敏感肌膚為基準、經過科學驗證的品牌，於是決定親自創立。",
    ja:"「なぜ敏感肌向けと謳っているのに、実際に使うと刺激を感じたり、肌が良くならないのだろう？」NOMADIAは2025年、ソウルで誕生しました。創業者自身が酒さ・脂漏性皮膚炎を抱えて生きてきた敏感肌当事者としての経験をもとに、最も敏感な肌を基準に科学的に検証されたブランドが存在しないことに気づき、始まりました。",
    th:"\"ทำไมผลิตภัณฑ์ที่บอกว่าเหมาะกับผิวแพ้ง่าย พอใช้จริงกลับยังระคายเคืองหรือไม่ทำให้ผิวดีขึ้นเลย?\" NOMADIA ถือกำเนิดขึ้นที่กรุงโซลในปี 2025 จากประสบการณ์ตรงของผู้ก่อตั้งที่ใช้ชีวิตกับผิวแพ้ง่าย โรคโรซาเชีย และโรคผิวหนังอักเสบจากต่อมไขมัน พวกเขาค้นพบว่าไม่มีแบรนด์ใดที่ผ่านการพิสูจน์ทางวิทยาศาสตร์โดยใช้ผิวที่บอบบางที่สุดเป็นมาตรฐานอ้างอิงอย่างแท้จริง จึงตัดสินใจสร้างแบรนด์นี้ขึ้นมาเอง"
  },
  "NOMADIA focuses on making the most carefully validated answer, rather than chasing new ingredients — and we will become the standard-setting brand in skincare for sensitive skin, a frontier where no definitive answer yet exists.":{
    "zh-CN":"比起追逐新成分，NOMADIA更专注于打造最谨慎验证过的答案——我们将在敏感肌护肤这个尚无标准答案的领域，成为真正的标准品牌。",
    "zh-TW":"比起追逐新成分，NOMADIA更專注於打造最謹慎驗證過的答案——我們將在敏感肌保養這個尚無標準答案的領域，成為真正的標準品牌。",
    ja:"NOMADIAは、新しい成分を追い求めるのではなく、最も慎重に検証された答えをつくることに集中しています——敏感肌のためのスキンケアという、まだ正解のない領域で基準となるブランドになります。",
    th:"NOMADIA มุ่งเน้นการสร้างคำตอบที่ผ่านการพิสูจน์อย่างรอบคอบที่สุด มากกว่าการไล่ตามส่วนผสมใหม่ๆ — และเราจะเป็นแบรนด์ที่เป็นมาตรฐานในวงการดูแลผิวสำหรับผิวแพ้ง่าย ซึ่งเป็นพื้นที่ที่ยังไม่มีคำตอบตายตัว"

    ja:"NOMADIAのすべての製品の安全性と効能は、一般的な肌ではなく、LAST認証済みの敏感肌パネルのみを対象に検証しています。",
    th:"ความปลอดภัยและประสิทธิภาพของผลิตภัณฑ์ NOMADIA ทุกชิ้น ได้รับการตรวจสอบเฉพาะกับกลุ่มทดสอบผิวแพ้ง่ายที่ผ่านการรับรอง LAST เท่านั้น ไม่ใช่ผิวทั่วไป"

  "All Safety & Efficacy":{"zh-CN":"全部安全性与功效","zh-TW":"全部安全性與功效",ja:"すべての安全性・効能効果",th:"ความปลอดภัยและประสิทธิภาพทั้งหมด"},
  "Verified on Sensitive-Skin Panel":{"zh-CN":"针对敏感肌肤人群","zh-TW":"針對敏感肌膚族群",ja:"敏感肌パネル対象",th:"ทดสอบกับกลุ่มผิวแพ้ง่าย"},
  "Human Application Testing":{"zh-CN":"人体应用测试","zh-TW":"人體應用測試",ja:"ヒト適用試験",th:"การทดสอบการใช้จริงในมนุษย์"},

    "zh-TW":"NOMADIA從敏感性肌膚保養這個尚無標準答案的領域出發。比起追逐新成分，我們更專注於打造最謹慎驗證過的答案——從敏感肌膚社群的聲音出發，以科學打磨，再回到敏感肌膚身上確認。",

    th:"NOMADIA เริ่มต้นจากพื้นที่ที่ยังไม่มีคำตอบตายตัวอย่างการดูแลผิวแพ้ง่าย แทนที่จะไล่ตามส่วนผสมใหม่ๆ เรามุ่งเน้นสร้างคำตอบที่ผ่านการพิสูจน์อย่างรอบคอบที่สุด — เริ่มจากเสียงของชุมชนผิวแพ้ง่าย ขัดเกลาด้วยวิทยาศาสตร์ แล้วนำกลับมายืนยันกับผิวแพ้ง่ายอีกครั้ง"

function maskName(name){
  if(!name) return "";
  const chars=[...name];
  const n=chars.length;
  if(n<=2) return chars[0]+"*".repeat(n-1||1);
  const visible=Math.ceil(n*0.5);
  return chars.slice(0,visible).join("")+"*".repeat(n-visible);
}

      quote:{ko:"🧸피부타입\n: 수부지에 엄청난 예민하고 수시로 뒤집어지는 피부. 어릴 때부터 아토피가 있었는데 지금은 좋아졌지만 환절기, 계절 바끨 때마다 다시 얼굴, 몸전체에 올라옴. 조금만 건조하고 유수분 밸런스 깨진다 싶으면 버즘피고(건선) 접촉성피부염, 알러지 난리남. 설상가상으로 주사피부염 진단받음. 나이들면서 모공 넓어지고 이마와 볼 좁쌀여드름 있음\n\n✔️결론\n: 얼굴은 수부지 복합성 좁쌀나는 예민 주사피부! 바디는 극건성 아토피, 알러지 자주 올라오는 피부!\n \n🤍정착템\n: 아이소이 응급스팟, 아이소이 아크니닥터 스킨(주시피부염 사용X), 닥터지 레드블레미쉬 수분크림(10통 넘음...),메이크프렘 안심모이스처12 크림, 제로이드 MD로션•크림(모든 피부 강추), 에스트라 아토베리어크림, 에스트라 아토베리어 로션, 메디힐 티트리팩, 린제이 티트리 모델링팩, 브링그린 알로에젤, 랑벨 egf 앰플, 더마토리 수분앰플, 타마누오일(랑벨, 닥터올가 번갈아 씀)\n\n\n사용기간\n: 약 10일\n\n텍스쳐/발림성\n: 전형적인 클렌징 밀크 부드럽게 롤링됨\n\n용기/가격\n: 조그만한 펌핑용기! 여행 때 가지고 다녀도 좋을 사이즈\n\n트러블 외 기타\n: 이미 화농성 여드름이 몇개 올라온 상태에서 사용했는데 더 트러블이 심해지지 않았어요. 클렌징폼만 사용해도 따가웠는데 제품 사용 시 따가움이나 불편감은 없어서 좋았어요. 판테놀있어서 보습감 있으면서 촉촉하게 세정되는 것 같아요","zh-CN":"🧸皮肤类型\n：水油皮，非常敏感、动不动就爆发的皮肤。从小就有特应性皮炎，现在好些了，但每逢换季、季节交替的时候又会在脸上、全身冒出来。只要稍微一干燥、水油平衡被打破，就会长癣（银屑病）、接触性皮炎、过敏大爆发。雪上加霜的是还被确诊了玫瑰痤疮。随着年龄增长毛孔变粗，额头和脸颊长闭口粉刺。\n\n✔️结论\n：脸部是水油混合、长闭口的敏感玫瑰痤疮肌！身体是极干性特应性皮炎、经常过敏的皮肤！\n \n🤍长期回购好物\n：isoi急救点涂、isoi痘痘医生爽肤水（玫瑰痤疮不能用）、Dr.G红色暗疮舒缓保湿霜（用了10多罐……）、Make P:rem安心保湿12号面霜、Xeroid MD乳液·面霜（所有肤质都强推）、Aestura安敏因面霜、Aestura安敏因乳液、美迪惠尔茶树面膜、Lindsay茶树塑颜面膜、Bring Green芦荟啫喱、狼贝EGF安瓶、Dermatory保湿安瓶、大风子油（狼贝、Dr.Orga交替使用）\n\n\n使用时长\n：约10天\n\n质地/延展性\n：典型的洁面乳质地，能顺滑打圈按摩\n\n包装/价格\n：小巧的按压瓶！旅行携带也很合适的尺寸\n\n痘痘之外的其他体验\n：使用时脸上已经长了几颗脓包型痘痘，用了之后并没有变得更严重。平时光用洁面泡沫都会刺痛，但用这款产品时没有刺痛或不适感，这点很好。含有泛醇，感觉洗完既保湿又清爽"},images:[],video:null},

      quote:{ko:"📍세정력 : 선크림 맞춤 No 자극\n\n - 베이스 메이크업 최적화: 유수분 밸런스가 쉽게 무너지는 수부지 피부 특성상 모공을 막지 않는 세정이 정말 중요한데, 이 제품은 파운데이션, 쿠션, 선크림 등 일상적인 베이스 메이크업을 자극 없이 부드럽게 녹여줘요.\n - 노폐물 용해: 피부 위에서 문지를수록 과도한 피지와 엉겨 붙은 노폐물이 부드럽게 유화되면서 피부 표면을 깔끔하게 정돈해줘서 마음에 들어요!\n\n🧴 제형 및 사용감 : 수분감 가득한 무자극 로션 질감\n\n - 산뜻하고 묽은 로션 같은 텍스처: 오일 특유의 답답하고 무거운 잔여감이나 되직한 크림의 유분감 대신 촉촉하고 묽은 로션 같은 질감이에요!\n - 편안한 무자극 케어: 판테놀 1%와 블루 진정 성분이 함유되어 있어서 피부에 문지를 때 마찰감이 거의 느껴지지 않을 정도로 부드럽게 롤링돼요. 덕분에 장벽이 예민해진 날에도 세안 중이나 세안 후에 붉어짐이나 따가움, 눈 시림이 없어서 편해요! \n\n📍여름철 사용감☀️ : 산뜻한 수분막 유수분 밸런스 유지\n\n - 속건조 해결: 세안 후 피부에 꼭 필요한 수분막을 남겨줘서 새안 후 속당김이 없어요.\n - 유분 부담 제로: 무거운 유분 겉돎이 없어서 더운 날씨에도 부담 없이 산뜻하게 유수분 밸런스를 맞출 수 있어요.\n\n⭐️ 추천 피부 타입\n\n - 수분 부족형 지성(수부지) 및 복합성 피부\n오일 클렌저를 쓰면 트러블이 올라오고, 폼 클렌저만 쓰면 너무 건조한 피부에 추천해요.\n - 민감성 및 장벽이 무너진 피부\n작은 자극에도 쉽게 붉어지고 피부 장벽을 보호해야 하는 피부에 알맞을 것 같아요!","zh-CN":"📍清洁力：贴合防晒霜 无刺激\n\n - 底妆优化：水油皮的水油平衡本来就容易崩溃，不堵塞毛孔的清洁真的很重要，这款产品能把粉底液、气垫、防晒霜等日常底妆无刺激地温和溶解掉。\n - 溶解废物：在皮肤上打圈按摩时，多余的皮脂和粘连的废物会被温和乳化，把皮肤表面清理得很干净，这点很喜欢！\n\n🧴 质地及使用感：水润感十足的无刺激乳液质地\n\n - 清爽偏稀的乳液质地：没有油类特有的闷重残留感，也没有厚重面霜的油腻感，是水润偏稀的乳液质地！\n - 舒适无刺激护理：含有1%泛醇和蓝色舒缓成分，在皮肤上按摩时几乎感觉不到摩擦，滑滑地打圈。所以就算屏障变敏感的日子，洗脸中或洗脸后也不会泛红、刺痛、呛眼，很省心！\n\n📍夏季使用感☀️：清爽的水润膜维持水油平衡\n\n - 解决内干：洗后会在皮肤上留下必要的水润膜，洗脸后不会觉得紧绷。\n - 零油腻负担：没有厚重的油浮在表面，就算天热也能轻松清爽地维持水油平衡。\n\n⭐️推荐肤质\n\n - 水分不足的油性（水油皮）及混合性肌肤\n用油类卸妆会长痘、只用洁面泡沫又太干的肌肤，推荐使用。\n - 敏感性及屏障受损的肌肤\n对适合那种一点小刺激就容易泛红、需要保护皮肤屏障的肌肤，感觉很合适！"},images:[],video:null},
    {id:"Zm2kR8Eq",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"건성(생리기간 악건성), 눈가주름·열감·각질들뜸 - 1차 세안 후에도 당김 없음, 블랙헤드 관리","zh-CN":"干皮（生理期极干），眼周细纹·灼热感·起皮 - 一次洁面后也不紧绷，黑头有改善"},date:"2026-06-15",
      quote:{ko:"✔️피부 정보\n  T존에 유분기가 있는 건성\n  겨울철&생리 기간 중 악건성\n  악건성일 때 눈가주름, 눈 뜨고 감을 때 건조함으로 인한 당김\n  악건성일 때 건조함으로 인한 갑작스러운 얼굴에 열감\n  피부각질 올라옴에 따른 화장/선크림들뜸\n  여름기간 피부 번들거림\n  겨울기간 피부 극건성 (각질, 들뜸, 수분부족)\n  \n \n\n  ✔️제품 추천 대상\n  세안 후 피부 당김있는 사람\n  세안 후 피부 건조감있는 사람\n  민감성 피부가 트러블 없이 사용할 수 있는 제품을 찾는 사람\n  유화과정을 잘 지키는 사람\n  피부가 건조한 사람\n  건성 피부\n  \n \n\n  ✔️제품 특징\n  \n \n\n  1. 판테놀 포함 피부 장벽 강화\n  정말 가장 큰 특징! 오일을 사용하더라도 피부 세안 후에 항상 건조감이 느껴지던 피부 타입인데, 해당 제품은 1차 세안으로 이 제품을 쓰고 클렌징폼으로 2차 세안을 해도 피부 당김이 느껴지지 않습니다! 오히려 기초 관리 전까지 피부가 촉촉해진 느낌이 들어서 악건성이나 클렌징 후 피부 당김이 있으신 분들에게 정말 적합합니다! 이 면에서 정말정말 만족해요!\n  \n \n\n  2. 피부 트러블 없음\n  클렌징오일, 클렌징폼 잘못 쓰면 오히려 트러블이 나기도 하는데, 클렌징 밀크류가 정말 순하긴 한지 트러블이 하나도 안났습니다! 저의 경우 피부 제품을 바꾸면 좁쌀이나 염증성 여드름이 올라오는 편인데, 이 제품 사용 후에는 전혀 없었습니다\n  \n \n\n  3. 유화 과정\n  유화 과정에서 모공 마사지를 하면 안에 있던 블랙헤드가 쏙쏙 나옵니다! 오히려 클렌징오일보다 유화과정에서 블랙헤드 관리가 잘 되는 것 같아요. 또 개인적으로는 화장 할 때 각질이 잘 안올라오더라구요! 다만 콧망울 쪽 블랙헤드는 여전하긴 합니다..ㅎ","zh-CN":"✔️肤质信息\n  T区有点油的干皮\n  冬季&生理期极干\n  极干时眼周有细纹，睁闭眼时因干燥而紧绷\n  极干时因干燥突然脸部发热\n  皮肤起皮导致底妆/防晒浮粉\n  夏季皮肤出油\n  冬季皮肤极干（起皮、浮粉、缺水）\n  \n \n\n  ✔️适合人群\n  洗脸后皮肤紧绷的人\n  洗脸后皮肤干燥的人\n  正在寻找不会导致敏感肌长痘的产品的人\n  会认真做乳化步骤的人\n  皮肤干燥的人\n  干性肌肤\n  \n \n\n  ✔️产品特点\n  \n \n\n  1. 含泛醇，强化皮肤屏障\n  真的是最大的特点！就算用油类，洗完脸后总是会觉得干燥的肤质，用这款产品做一次洁面，再用洁面泡沫二次洁面也不会觉得紧绷！反而在做基础护理之前皮肤就已经感觉水润，对极干性或洁面后紧绷的人真的很适合！这点真的非常满意！\n  \n \n\n  2. 不长痘\n  卸妆油、洁面泡沫用不对反而会长痘，但这款洁面乳质地真的很温和，一颗痘都没长！我的情况是一换产品就容易长闭口或炎症型痘痘，用这款产品后完全没有\n  \n \n\n  3. 乳化过程\n  乳化过程中按摩毛孔时，里面的黑头会一颗颗冒出来！感觉比卸妆油在乳化过程中黑头护理效果更好。而且个人感觉化妆时也不太起皮！只是鼻翼那边的黑头还是老样子……哈"},images:[],video:null},

      quote:{ko:"2주간 매일 사용해 보고 쓰는 솔직한 후기입니다. \n \n\n 🫧피부타입 : 자극을 받으면 붉어지고 가려운 증상이 생기면서 모낭염이 잘 올라오는 예민한 수부지 피부\n \n\n 🫧사용총평 : 모낭염 때문에 피부장벽을 매우 중요하게 생각하는데 매일 써도 가려움이나 자극 없었어요. 크리미한 제형으로 촉촉하고 부드럽게 롤링되어 마찰이 전혀없고 쓸때마다 정말 순하다고 느꼈어요. 민감성 피부를 기준으로 만들어진 제품인 만큼 그동안 써왔던 클렌징 제품들 중에서 제일 순했어요. 세안 후 잔여감없이 산뜻하고 촉촉해서 당김을 못 느꼈어요. \n \n\n 애초에 진한 메이크업을 지우기 위한 제품이 아니기 때문에 색조 메이크업까지 완벽하게 지워지진 않아요. 세정력을 더 높이면 아마 지금처럼 순한 제품은 아니었을테구요. 제품 설명에도 나와있는 부분이라 세정력이 아쉽진 않았어요. 선크림과 가벼운 베이스 메이크업을 지우기에는 충분한 세정력을 가지고 있습니다. 눈시림이나 따가움도 없어요. \n \n\n 피부장벽의 재생,진정,보습,보호에 효과적인 판테놀과 세콜지, 구아이아줄렌, 알란토인까지 예민한 피부에 좋은 성분들이 많아요. 클렌징 제품들 중에서 판테놀 함량이 제일 높은거 같은데 피부가 예민해져서 뭘 써도 아프고 따가울때 상태를 진정시켜줄 좋은 제품인거 같아요. 강추드려요!!","zh-CN":"这是连续两周每天使用后写的真实测评。\n \n\n 🫧肤质：一受刺激就泛红发痒、容易长毛囊炎的敏感水油皮\n \n\n 🫧使用总评：因为毛囊炎的关系我非常在意皮肤屏障，每天用也没有发痒或刺激。膏霜质地，打圈时润滑柔软，完全没有摩擦感，每次用都觉得真的很温和。既然是按敏感肌标准做的产品，在我用过的洁面产品里算是最温和的了。洗完脸没有残留感，清爽又水润，感觉不到紧绷。\n \n\n 因为这本来就不是为卸浓妆设计的产品，所以彩妆不能完全卸干净。要是把清洁力做得更强，大概就不会像现在这么温和了。产品说明里也写明了这点，所以我对清洁力没有失望。卸防晒和轻底妆是完全足够的清洁力。也没有呛眼或刺痛感。\n \n\n 对皮肤屏障的修复、舒缓、保湿、保护都有效的泛醇、积雪草、蓝甘菊薁、尿囊素，都是对敏感肌很好的成分。在洁面产品里泛醇含量算是最高的了，感觉是那种皮肤变敏感、用什么都痛都刺激的时候能帮忙镇静的好产品。强烈推荐！！"},images:[],video:null},
    {id:"qW4jQxoA",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지, 스트레스성 트러블+속건조 - 오래 롤링해도 안 뒤집어짐","zh-CN":"水油皮，压力型痘痘+内干 - 长时间打圈按摩也不会爆痘"},date:"2026-06-05",
      quote:{ko:"여드름+민감성 피부인데 자극이 없어서 좋았어요!\n 요즘 스트레스 심해서인지 조금만 자극적이어도 피부가 뒤집어지고 난리나는데 오래 오래 꼼꼼히 롤링해도 괜찮았어요ㅎㅎ\n \n\n 피부 컨디션이 급격하게 안 좋아진 이후 부터 속건조, 기름, 트러블로 고생했는데 사용 후에도 얼굴에 당김없이 촉촉해요! \n 순히기도 하고 건조함없이 마무리되서 세정력에 큰 기대는 안 했는데 워터프루프 아니면 거의 다 지워져요!!\n \n\n 너무 무겁거나 답답하지않은 로션 제형이어서 저처럼 속건성 수부지이신 분들이나, 건성분들이 쓰기 좋을 것 같아요:)\n \n\n 드라마틱하게 체감되지는 않지만 피부장벽 지켜주는 판테놀 성분이 있어서 세안단계부터 피부를 세심하게 신경쓰는 기분이 들어요ㅎㅎ","zh-CN":"痘痘肌+敏感肌，用起来没有刺激感这点很好！\n 最近可能是压力太大，稍微有点刺激皮肤就会爆炸，但即使长时间仔细打圈按摩也没事哈哈\n \n\n 皮肤状态急剧变差之后一直被内干、出油、痘痘困扰，用完之后脸上也不紧绷，很水润！\n 因为很温和、洗完也不干燥，本来对清洁力没抱太大期待，结果除了防水彩妆几乎都能卸掉！！\n \n\n 不会太厚重也不会闷，是乳液质地，感觉像我这样内干型水油皮，或者干性皮肤的人用起来会很合适:)\n \n\n 虽然没有戏剧性的效果，但因为含有守护皮肤屏障的泛醇成分，从洁面这一步开始就有种在细心呵护皮肤的感觉哈哈"},images:[],video:null},
    {id:"A6gny7eJ",rating:5,skinType:{ko:"복합성","zh-CN":"混合肌"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"복합성, 피부과 시술·수영 후 - 장벽 약해진 날에도 따끔거림 없음, 제모 당일 사용 가능","zh-CN":"混合肌，皮肤科治疗·游泳后 - 屏障变弱的日子也不刺痛，脱毛当天也能用"},date:"2026-06-11",
      quote:{ko:"원래 튼튼피부라 아무거나 막 써도 평소엔 문제 없는데, 피부과 시술이나 수영 후엔 일시적으로 장벽이 약해져 평소 자극없던 제품도 따끔거리더라고요. 그런 날에도 이 클렌징밀크는 따끔거림·속당김이 전혀 없어요. \n2펌핑 덜어 1분 롤링했더니, 평소 가끔 여드름 나던 부위에서 피지가 빠져나오는 게 신기해서 세안 중에 사진까지 찍어뒀어요... \n 모공피지케어도 되면서 클렌징 후에 보습막이 남아 촉촉하게 마무리 되어서 좋았어요\n평소에 메이크업 거의 안하고 선크림만 바르는 편이라 저녁 1차세안으로 매일 사용하려고요\n며칠전에 젠틀맥스 프로 제모 받은 당일에도 안 따가웠을 만큼 순하고요. 민감성 아니어도 데일리로 쟁여둘 만한 제품이에요👍\n\n사용팁\n-세안전 손 씻은 후 '마른 손'에 2~3번 펌핑 \n-1분정도 롤링(코 턱 헤어라인 여드름 잘 생기는 부위는 더 신경 써서 꼼꼼하게)\n-유화 전에 한번 더 손 씻기!!","zh-CN":"本来是皮肤比较强健的类型，平时随便用什么都没问题，但做完皮肤科治疗或游泳之后屏障会暂时变弱，连平时不刺激的产品都会有点刺痛。就算是这种日子，这款洁面乳也完全没有刺痛感、洗后也不紧绷。\n用了两泵打圈按摩了1分钟，平时偶尔长痘的部位有皮脂被推出来，觉得很神奇，洗脸过程中还拍了照片……\n 能做到毛孔皮脂护理，洁面后又留有保湿膜，收尾水润，很喜欢\n平时几乎不化妆只涂防晒，打算晚上当一次洁面每天用\n前几天做完极致清光脱毛当天用也不会刺痛，就是这么温和。就算不是敏感肌也值得日常囤货👍\n\n使用小贴士\n-洗脸前先洗手，然后在'干燥的手上'按压2~3下\n-打圈按摩约1分钟（鼻子、下巴、发际线等容易长痘的部位要更仔细）\n-乳化前再洗一次手！！"},images:["thumbnail/reviews/milk/A6gny7eJ_1.jpg"],video:null},
    {id:"AGE3jOnZ",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"수부지(지성경계)+여드름 민감성, 클렌징오일서 밀크로 정착한 사연","zh-CN":"水油皮（偏油性边缘）+痘痘敏感肌，从卸妆油换成洁面乳的心路历程"},date:"2026-06-05",
      quote:{ko:"💧블루 판테놀 클렌징 밀크 후기💧\n \n\n *지성에 가까운 수부지 타입\n 여드름 민감성 피부라 주 세안을 클렌징 밀크로합니다! 원래 클렌징 오일만쓰다가 속건조에 피부장벽이 너무 빠르게 무너져서 밀크로 정착했어요 ㅜㅜ \n 현재는 주 3~4회 클렌징밀크 / 주 1~2회 클렌징오일 이렇게 씁니다\n \n\n 💧여러 브랜드를 써봤지만 특히나 블루 클렌징 밀크는 예민한 민감성피부에 적합한 것 같아요 !! \n 제형감은 무르기보단 단단하고 도톰한 느낌입니다 대부분 클렌징밀크는 묽어서 줄줄 흐르는데, 약간 도톰해서 얹기 편해요 ! 향은 무향이나 다름없고, 세안 후 속당김 전혀 없습니다\n \n\n 💧세정력에 타 클렌징밀크에 비해 약한 편이긴하나 대부분 클렌징밀크가 세정력이 강한 편은 아니어서 크게 신경쓰이진 않았어요! 참고로 클렌징밀크는 클렌징오일처럼 단순 유화보다는 유화 후 ⭐️\"해면\"⭐️을 이용해서 닦아내는걸 추천드려요 !! 👍이러면 세정력과 보습력이 같이 올라갑니당\n \n\n 💧선크림이나 단순 데일리 메이크업으로 추천드리고, 강한 워터푸르프는 지워내기 어려워요 ㅜ 😭클렌징밀크는 감안하고 써야합니당 \n \n\n 💧다른 브랜드의 클렌징밀크를 많이 써봤는데, 특별한 점을 느끼진 못 했어요..! 좀 더 순하다 정도..? 그래도 전 무난함을 가장 중요하다고 생각하는 사람이기때문에.... 추천드립니다! 🤭 쓰면서 트러블 올라오는것도 없었고, 곧 여름이라 메이크업보단 선크림을 자주 쓰다보니 활용도가 높을 거 같아요 🫶","zh-CN":"💧蓝色泛醇洁面乳使用心得💧\n \n\n *偏油性的水油皮\n 痘痘敏感肌，所以主要用洁面乳来做主要清洁！本来只用卸妆油，但因为内干、皮肤屏障崩得太快，才换成了洁面乳呜呜 \n 现在是每周3~4次用洁面乳 / 每周1~2次用卸妆油这样搭配使用\n \n\n 💧用过很多品牌，但特别是这款蓝色洁面乳好像很适合敏感肌 !! \n 质地不算稀，是偏紧实厚实的感觉。大部分洁面乳都很稀会流得到处都是，但这款稍微厚一点比较好抹开！香味几乎等于无香，洗后完全不紧绷\n \n\n 💧清洁力比其他洁面乳偏弱一点，不过大部分洁面乳清洁力本来就不算强，所以没太在意！顺便说，洁面乳建议不要像卸妆油那样单纯乳化，而是乳化后再用⭐️海绵⭐️擦掉 !! 👍这样清洁力和保湿力都会一起提升\n \n\n 💧适合防晒或日常淡妆，强力防水妆容比较难卸掉ㅠ😭用洁面乳的话要有这个心理准备 \n \n\n 💧其他品牌的洁面乳也用过不少，没觉得这款有什么特别突出的地方……！大概就是更温和一点？不过我是那种觉得'稳定不出错'最重要的人……所以还是推荐！🤭 用的时候也没长痘，马上就要夏天了，比起彩妆更常用防晒，感觉使用率会很高🫶"},images:[],video:null},
    {id:"Z04wvg4Z",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"만성 피부염+매일 모낭염 나는 피부 - 교체 후 모낭염 개수 감소","zh-CN":"慢性皮炎+每天冒毛囊炎的皮肤 - 换用后毛囊炎数量减少"},date:"2026-06-05",
      quote:{ko:"📍텍스처\n 보통 클밀들은 제형이 묽어서 롤링중에 다 날아가거나 롤링할 때 불편한데 제형이 도톰해서 너무 좋아요. 제형이 쿠션감 있다고 해야하나? 도톰해서 피부에 자극도 없고 유화도 부드럽게 잘 돼서 세정력도 좋았어요. 그리고 촉촉묵직해서 세안하고 당김도 덜합니다.\n \n\n \n\n 📍클렌징\n  혼합자차 선크림 바르고 클밀로 1차만 지웠을 때는 잘 지워졌어요. 선크림+비비 발랐을 때는 1차만 하니까 잔여물이 남아서 2차 세안 따로 했습니다.\n \n\n \n\n 📍피부반응\n  우선 저는 티존+ 나비존은 심한 지성이고 나머지는 속건조 심한 건성인데 예전에 화장품 잘못 쓰면서 만성 피부염+ 예민성으로 바뀐 피부입니다. 매일 매일 날치알 모낭염이 오도도 나는데 이 클밀로 바꾸고 나서 모낭염 나는 갯수도 많이 줄고 진짜 도움 많이 받았어요. \n  우선 성분만 봐도 장벽에 좋은 원료들로 구성되어 있습니다. 판테놀, 구아이아줄렌, 히알루론산, 세라마이드, 호호바오일, 엑토인, 스쿠알란등 좋은 원료들이 다수 포함되어 있어요.\n  민감성 피부를 가진 사람들도 안심하고 사용할 수 있도록 설계된 브랜드 철학이 제품 사용감에서도 느껴졌습니다. 다른 화장품들도 궁금하네요. 재구매의사 완전 있습니다.\n \n\n \n\n 📍장점\n -눈에 띄는 피부 개선\n -민감성 피부 구원템\n -좋은 성분들로 구성되어 있음","zh-CN":"📍质地\n 一般洁面乳质地都偏稀，打圈时容易滑掉或不好操作，但这款质地厚实，非常喜欢。质地有点像慕斯感？厚实所以对皮肤没有刺激，乳化也很顺滑，清洁力也不错。而且水润厚重，洗完也不太紧绷。\n \n\n \n\n 📍清洁\n  涂了混合型自制防晒后用洁面乳做一次清洁，能洗得很干净。涂了防晒+BB霜的话只做一次清洁会有残留，所以另外做了二次清洁。\n \n\n \n\n 📍皮肤反应\n  首先我的T区+法令纹区域严重出油，其余部位是内干很严重的干性肌肤，之前因为乱用化妆品变成了慢性皮炎+敏感肌。以前每天都会冒出密密麻麻的毛囊炎，换用这款洁面乳之后毛囊炎数量减少了很多，真的帮了大忙。\n  首先光看成分就是对屏障好的原料组成。泛醇、蓝甘菊薁、透明质酸、神经酰胺、荷荷巴油、麦角硫因、角鲨烷等好成分都有不少。\n  能让敏感肌人群放心使用的品牌理念，从产品的使用感上也能感受到。也很好奇其他产品。完全有回购意愿。\n \n\n \n\n 📍优点\n -肉眼可见的皮肤改善\n -敏感肌救星\n -含有很多好成分"},images:[],video:null},
    {id:"ZMmPExXZ",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"수부지, 피부과 시술 후 각질·흉터 실리콘겔도 자극 없이 제거되는 세정력","zh-CN":"水油皮，皮肤科治疗后起皮·连疤痕硅胶也能无刺激清除的清洁力"},date:"2026-06-15",
      quote:{ko:"클렌징 밀크'라는 이름에 딱 맞게 하얗고 촉촉하면서도 아주 약간의 점성이 느껴지는 부드러운 제형이에요. 피부에 올렸을 때 자극 없이 부드럽게 롤링돼서 참 좋더라고요. (다른 후기들 보니까 성분이 순해서 민감성 피부 분들도 정착템으로 많이 쓰신다는데, 왜 그런지 단번에 이해되는 제형이었어요!)\n \n\n 제일 놀란 건 세정력이었어요. 풀메이크업을 한 친구가 우리집 놀러와서 이걸로 지워봤는데 웬만한 화장이 정말 깔끔하게 잘 지워진다고 감탄하더라고요. 게다가 저는 평소에 선크림 바른 날 폼클렌징이나 클렌징 젤로 2차 세안을 하면 얼굴이 쩍쩍 갈라지듯 당겼거든요? 근데 이 제품은 세안 후에도 건조함이 확실하게 잡히고 촉촉함이 남아있어서 감동했습니다. 건성이나 수부지 피부인 분들께 진짜 강추하고 싶어요.\n \n\n 그리고 저만의 대박 발견이 있는데요! 평소에 세척해서 재사용해야 하는 흉터용 실리콘 겔을 쓰는데, 이게 핸드워시, 바디워시, 폼클렌징으로도 이물질이나 자국이 잘 안 지워져서 스트레스였거든요. 혹시나 하는 마음에 이 클렌징 밀크를 올려두고 살살 롤링해 봤는데 웬걸... 그 지독한 자국들이 잘 지워지더라고요! 피부 노폐물이나 피지도 이렇게 부드럽게 잘 녹여주겠구나 싶어서 제품력에 완전히 신뢰가 생겼습니다.\n 그저께 피부과 시술 받고 나서 자극이 있었는지 입 양옆에 각질이 일어났는데.. 뻑뻑하면서도 덜렁거리는 각질을 블루 진정 판테놀 클렌징 밀크로 2분정도 계속 롤링했더니 아프지 않고 깔끔하게 탈락된 것도 맘에 들었습니다. (첨부한 사진 참고)","zh-CN":"正如'洁面乳'这个名字，是又白又水润、带一点点粘度的柔软质地。涂在脸上时能无刺激地顺滑打圈，真的很喜欢。（看其他测评说成分温和，很多敏感肌都拿它当长期回购款，用了之后立刻理解为什么了！）\n \n\n 最让我惊讶的是清洁力。化了全妆的朋友来我家玩，用这个卸妆，她惊叹说几乎所有妆都能干净卸掉。而且我平时涂防晒的日子如果用洁面泡沫或洁面凝胶做二次清洁，脸会紧绷得像要裂开一样？但这款产品洗完后干燥感明显被压住，还留有水润感，让我很感动。真心想推荐给干皮或水油皮的人。\n \n\n 还有一个我自己的重大发现！我平时要清洗重复使用的疤痕硅胶贴，用洗手液、沐浴露、洁面泡沫都很难把污渍或痕迹洗掉，一直很头疼。抱着试试看的心态把这款洁面乳涂上去轻轻打圈，结果……那些顽固的痕迹居然被洗掉了！这让我更加确信它对皮肤废物、皮脂也能这样温和地溶解清洁，对这款产品彻底建立了信任。\n 前天做完皮肤科治疗后可能是有点刺激，嘴角两侧起皮了……用蓝色舒缓泛醇洁面乳持续打圈按摩约2分钟，那些又干又翘的角质不痛地干净脱落了，这点也很满意。（可参考附图）"},images:[],video:null},
    {id:"Zm2lQRDq",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지, 열감·홍조+장벽 완전히 무너진 상태 - 붉은기·뾰루지 가라앉음","zh-CN":"水油皮，发热·泛红+屏障完全崩溃状态 - 红痘和泛红都有所缓解"},date:"2026-06-05",
      quote:{ko:"🥲수부지,예민/민감피부,열감/홍조,속건조 심한 피부. \n 갑자기 날씨가 변해서 피부가 더 민감해지고 피부장벽이 다 무너진 상태였어요.... 2차세안을 해줘야하는데 클렌징밀크가 가장 순하고 부드러워서 클렌징밀크를 찾다가 이 제품을 계속 사용해줬습니다 ! \n 피부장벽을 보호해주면서 세정력이 있다보니 1차세안으로 사용하기 좋았어요!!! 약산성인데 간단한 메이크업은 거의다 촉촉하게 지워집니다!! 에탄올이 안들어가서 피부자극이 없었고 제일 좋은건 눈시림이 없다는거!!! 😳👀 히알루론산과 아줄렌이 수분진정을 도와줘서 그런가 클밀 세안후에도 건조함이 없어서 속건조 심한 수부지에도 폼클까지 편안하게 세안을 마무리할수있었어요. 진짜 최근 초초초초민감해진 피부여서 붉은기랑 뾰루지가 심하게 올라왔는데 다행히 조금씩 가라앉고 있는 상태라 예민한 피부가 사용하기 정말 좋은거같아요 🥹 순하게 클렌징을 하고 싶은 분들은 노마디아 클렌징밀크를 사용해보세요!! 클렌징때부터 피부장벽을 채워줘야지 피부컨디션이 좋아집니다..🤍","zh-CN":"🥲水油皮，敏感/敏感肌，发热/泛红，内干严重的皮肤。 \n 突然天气变化让皮肤变得更敏感，屏障整个都崩溃了……需要做二次清洁，找洁面乳中最温和柔软的一款，就一直在用这款！ \n 既能保护皮肤屏障又有清洁力，做一次清洁也很合适！！！弱酸性，简单的妆容基本都能水润地卸掉！！不含酒精所以没有皮肤刺激，最好的是不会呛眼！！！😳👀 可能是透明质酸和蓝甘菊薁帮忙做了水润舒缓，用洁面乳洗完也不干燥，就算内干严重的水油皮，也能一路舒服地洗到用洁面泡沫都不难受。最近皮肤真的超超超超敏感，泛红和痘痘都很严重，幸好正在一点点消退，真的很适合敏感肌使用🥹 想温和洁面的人可以试试NOMADIA洁面乳！！从洁面这一步就要给皮肤屏障补充水分，皮肤状态才会变好……🤍"},images:[],video:null},

      quote:{ko:"*피부타입: 전체적으로 건성인데 부분마 지성인 복합성 피부입니다.\n 평소에 세안 후에 건조감을 많이 느끼는 타입이에요.\n \n\n *사용후기: 우선 제품 진짜 순해서 자극감 하나도 없어서 편하게 사용할 수 있어서 좋았어요.\n 평소 자극적인 것 쓰면 피부가 금방 붉어지고 트러블 올라오는데 이 제품은 순해서\n 진짜 자극되는 느낌 하나도 없어요.\n 약산성인데다가 자극성분이나 에탄올 등의 성분이 포함되지 않아서\n 진짜 순하게 세정되는 것 같아요.\n 평소 피부 예민한 분들이 사용해도 편하게 사용하실 수 있을 것 같아요.\n 그리고 제가 건성인데 사용 후에 당김 없어서 마음에 들더라구요.\n 히알루론산이 들어 있어서 그런지 스킨 바르기 전에도 당기지 않아서 좋았습니다. \n 제가 모공이 요즘 넓어져서 스트레스 많은데 이 제품 사용하고나면\n 노폐물이 잘 빠지고 메이크업도 말끔하게 지워져서 좋았어요.\n 메이크업 잔여물 남지 않고 깔끔하게 마무리 되더라구요.\n 그리고 세안 시 눈에 자극감이나 눈시림 없어서 사용할 때도 편하고\n 노폐물이 부드럽게 녹아서 좋더라구요. \n 전체적으로 정말 만족합니다.","zh-CN":"*肤质：整体是干皮，但局部偏油的混合性肌肤。\n 平时洗脸后容易感到干燥的类型。\n \n\n *使用感受：首先产品真的很温和，完全没有刺激感，用起来很省心。\n 平时用刺激性的东西皮肤很快就会泛红长痘，但这款很温和，\n 真的完全没有刺激的感觉。\n 是弱酸性，而且不含刺激成分或酒精等成分，\n 感觉真的能温和清洁。\n 平时皮肤敏感的人用起来应该也能很放心。\n 而且我是干皮，用完之后不紧绷，这点我很喜欢。\n 可能是因为含有透明质酸，涂化妆水之前也不紧绷，很不错。\n 我最近毛孔变粗压力很大，用了这款产品之后\n 废物排得很干净，妆也卸得很彻底，很喜欢。\n 没有妆容残留，收尾很干净。\n 而且洗脸时眼睛没有刺激感或呛眼，用起来很省心，\n 废物也被温和地溶解掉，很不错。\n 整体真的很满意。"},images:[],video:null},
    {id:"Zlyn4B9q",rating:4,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지 복합성+좁쌀트러블, 오일·밤 쓰면 장벽 무너지는 예민 피부가 정착","zh-CN":"水油皮混合肌+闭口痘痘，用油类·膏类就崩溃的敏感屏障肌终于定妆"},date:"2026-06-15",
      quote:{ko:"⭐️노마디아 블루 판테놀 클렌징밀크 사용후기입니다⭐️\n\n✔️피부타입: 수부지 복합성/ 민감성/ 속건조/ 좁쌀트러불\n\n저는 되게 예민한 피부에 피부장벽이 많이 얇아서 클렌징으로\n오일이나 밤을 쓰면 처음에는 좋아보이나 세번 이상만 쓰면\n장벽이 우수수 무너지는 개복치 노답 장벽피부를 지녔는데요\n그래서 클렌징밀크로 갈아탄지 꽤 오래 됐어요. 처음 노마디아 클렌징밀크를 보고 세정제에 판테놀 약간 굳이….?라는\n감정이었지만 좋은 성분 세정할 때부터 들어있으면 믿음이\n가잖아요 그래서 민감성 피부도 맘 편히 사용할 수 있었던 것 같아요. \n\n제형은 메**크프렘이나 듀*트* 밀크보다 조금 더 점도 있는 느낌이었습니다. 그래서 볼에 바로 짜도 막 흘러내리는 점도의 제형은 아니었어요. 그래서 그런지 뭔가 타사의 밀크들보다 조금 더 꾸덕하게 피부에서 롤링되는 기분이었습니다. \n\n세정력은 엄청나게 좋은 느낌은 아니에요. 밀크가 사실 세정력을 보고 사는 제품은 아니다보니까 저는 원래도 밀크로 녹여내고 워터로 닦아내고 있습니다. 이러면 잘 지워져용\n\n👉🏻민감성인데 맘 놓고 쓸 무난한 클렌징밀크를 찾는다 하면 추천","zh-CN":"⭐️NOMADIA蓝色泛醇洁面乳使用心得⭐️\n\n✔️肤质：水油皮混合肌/敏感性/内干/闭口痘痘\n\n我皮肤非常敏感、屏障也很薄，用油类或膏类卸妆，一开始感觉不错，但用超过三次屏障就会哗啦啦地崩溃，是个不折不扣的脆弱屏障肌，所以换用洁面乳已经很久了。第一次看到NOMADIA洁面乳的时候还想'清洁产品里加泛醇是不是有点多此一举……？'，但从清洁这一步就含有好成分，会让人更信任呢，所以敏感肌也能放心使用了。\n\n质地比Make P:rem或Dew*t*的洁面乳稍微更有粘度一点。所以直接挤到脸颊上也不会流得到处都是。可能正因为这样，比其他家的洁面乳感觉更厚实地在皮肤上打圈。\n\n清洁力不算特别强。洁面乳本来就不是靠清洁力取胜的产品，我本来也是用洁面乳溶解后再用清水洗掉。这样就能洗得很干净。\n\n👉🏻如果是敏感肌又想找一款可以放心用的稳定洁面乳，推荐这款"},images:[],video:null},
    {id:"qxowEbaZ",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"수부지, 화장품 애호가의 꼼꼼한 항목별 사용후기","zh-CN":"水油皮，化妆品爱好者的详尽分项使用测评"},date:"2026-06-05",
      quote:{ko:"화장품을 이것저것 테스트해보기 좋아해서 써보고싶은 제품들을 자주 써보는 편인데 \n 이번에는 노마디아 블루 진정 판테놀 1% 클렌징 밀크 솔직후기를 작성해 보겠습니다.!\n \n\n *포장*\n 그레이톤의 심플한 포장\n 펌프형 용기로 사용하는 타입이라 위생적이라고 느껴졌어요\n \n\n *제형*\n 묽은 로션~밀크 사이 정도의 제형으로 손에 덜면 부드럽게 롤링이 가능해서 피부 마찰이 적어요.\n 순하게 클렌징이 가능한 제품인 것 같아요\n 오일처럼 무겁거나 끈적이지 않고 촉촉한 느낌이고 \n 물 묻히면 부드럽게 유화되어 좋았어요.\n \n\n *사용감*\n 세안 후 피부 당김이 적은 편 같아요\n 판테놀 성분 덕분에 민감하거나 건조한 피부도 비교적 편안하게 사용 가능할 것 같아요.\n 가벼운 선크림, 피지, 먼지 제거에는 충분함.\n 사용시 피부트러블 같은건 없었어요\n \n\n *총평*\n 세안 후 촉촉함 유지되고 피부 자극이 적은 편인 점이 좋았어요.\n 그래서 민감성 피부인 분들이 부담없이 사용가능할 것 같아요.\n 단독으로 사용시 아침 세안이나 가벼운 선크림 세정에 적합해 보여요\n 평소 메이크업 없이 선크림만 사용하는 편이라 평상시에는 단독으로 사용했고\n 메이크업 했을때는 립앤아이리무버 + 1차세안 노마디아 블루진정 판테놀 1% 클렌징밀크 + 2차세안 폼클렌징 사용했는데 부족함 없이 클렌징이 가능했어요.\n 사용감이 촉촉해서 지성피부 보다는 복합성-건성, 민감성 피부가 선호할 만한 타입인거 같아요","zh-CN":"我很喜欢各种测试化妆品，经常尝试想用的产品，\n 这次要写一下NOMADIA蓝色舒缓泛醇1%洁面乳的真实使用心得。！\n \n\n *包装*\n 灰色调的简约包装\n 是按压瓶类型，感觉很卫生\n \n\n *质地*\n 介于稀乳液~洁面乳之间的质地，倒在手上能顺滑打圈，皮肤摩擦感少。\n 感觉是能温和清洁的产品\n 不像油类那样厚重或粘腻，是水润的感觉\n 沾水后能顺滑乳化，很不错。\n \n\n *使用感*\n 洗脸后皮肤紧绷感偏少\n 得益于泛醇成分，敏感或干燥的皮肤应该也能相对舒适地使用。\n 卸除轻度防晒、皮脂、灰尘绰绰有余。\n 使用时没有出现皮肤问题\n \n\n *总评*\n 洗脸后能维持水润，皮肤刺激感较少，这点很好。\n 所以敏感肌应该可以放心使用。\n 单独使用的话，适合早上洁面或卸除轻度防晒。\n 平时不化妆只涂防晒，所以平常都是单独使用，\n 化妆的日子则用唇眼卸妆液+一次清洁用NOMADIA蓝色舒缓泛醇1%洁面乳+二次清洁用洁面泡沫，这样清洁完全够用。\n 使用感偏水润，感觉比起油皮，更适合混合性-干性、敏感性肌肤"},images:[],video:null},
    {id:"Z4697YOA",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지, 한 달째 트러블 반복 중 - 교체 후 기존 트러블 잠잠해짐","zh-CN":"水油皮，反复长痘一个月 - 换用后原有痘痘平息"},date:"2026-06-05",
      quote:{ko:"🍀피부타입 : 수부지 / 평소에는 트러블이 없는 피부인데 한 달 전부터 트러블이 올라와서 트러블 여러개가 생겼다 없어졌다 반복중🥺😭\n \n\n 🍀제형 : 로션같이 주르륵 흐르는 부드러운 밀크 제형이라 피부에 롤링할 때 부드럽게 롤링할 수 있어 자극이 적고 사용감이 좋았어요! \n \n\n 🍀평소에도 자극이 적은 클렌징제품을 사용하는지라 아침에는 클렌징젤을, 저녁에는 클렌징밀크 - 클렌징젤을 사용하는데 (아이메이크업을 한 날에는 아이리무버를 사용) 원래 사용하던 클렌징밀크로는 아이메이크업까지 지우는건 좀 힘들었는데 노마디아 블루 진정 판테놀 1% 클렌징밀크는 베이스메이크업은 물론, 틴트, 아이라이너까지 싹 지워지더라고요🫢 \n 순한 사용감에 비해 높은 세정력이 정말 맘에 들었어요😆 \n 거기다 요즘 날씨가 덥고 습한데 반해 속건조가 심해서 한 달전 올라온 트러블이 여전히 차도가 없는데 이럴 때 새로운 화장품이나 클렌징제품을 사용하는게 굉장한 모험일 수 있잖아요🥲 (예전에 클렌징오일 바꿨다가 피부 심하게 뒤집힌 적이 있거든요😥)\n 그런데 진정 판테놀 성분이 들어있다고 해서 믿고 사용해봤는데 사용하는 동안 다행히 새로운 트러블이 올라오지는 않았어요🙂 \n 오히려 기존에 났던 큰 트러블이 잠잠해졌어요☺️\n \n\n 사용 후 속건조나 당김도 없고, 한동안 촉촉함이 유지되는 느낌이라 사용감도 만족스럽고요!\n \n\n 지금 제 피부장벽이 다 무너져있는 상태라 걱정이었는데 너무 순하고 사용감 좋고 세정력도 좋은 제품 만나서 만족스럽습니다!\n 기존에 사용하던 클렌징밀크제품 다 사용하고 나면 이 제품으로 갈아탈 의사도 있어요😉","zh-CN":"🍀肤质：水油皮 / 平时不怎么长痘，但一个月前开始冒痘，好几颗痘痘反反复复长了又消🥺😭\n \n\n 🍀质地：像乳液一样顺滑流动的柔软洁面乳质地，打圈按摩时能顺滑打圈，刺激少，使用感很好！\n \n\n 🍀平时也是用刺激少的清洁产品，早上用洁面凝胶，晚上用洁面乳-洁面凝胶（画了眼妆的日子会用眼部卸妆液），原本用的洁面乳很难卸掉眼妆，但NOMADIA蓝色舒缓泛醇1%洁面乳不仅能卸底妆，连唇釉、眼线都能一并卸干净🫢 \n 相较于温和的使用感，清洁力这么强真的很喜欢😆 \n 而且最近天气又热又潮，但我内干很严重，一个月前长的痘痘还没消，这时候换新化妆品或清洁产品其实是很大的冒险吧🥲（以前换过卸妆油之后皮肤严重爆发过😥）\n 不过因为含有舒缓泛醇成分，就抱着信任试了试，用的期间幸好没有新长痘🙂 \n 反而原本比较大的痘痘平息下去了☺️\n \n\n 用完之后没有内干或紧绷，感觉能维持一段时间的水润，使用感也很满意！\n \n\n 本来担心我的皮肤屏障已经完全崩溃了，结果遇到了这么温和、使用感又好、清洁力也不错的产品，很满意！\n 等我现在用的洁面乳用完之后，也有意愿换成这款😉"},images:[],video:null},
    {id:"qnRn1eVq",rating:4,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"극건성, 찢어질 듯한 속당김·하얀 각질 - 비포&애프터 체감 뚜렷","zh-CN":"极干皮，撕裂般的内干·白色脱皮 - 前后对比感受明显"},date:"2026-06-06",
      quote:{ko:"피부타입: 극건성 / 세안 후 찢어질 듯한 속당김과 하얀 각질이 고민인 건성 피부\n\n1. 성분 및 제형 \n화해 어플에서 성분부터 가장 먼저 확인했는데, 주의 성분 없이 순하고 촉촉한 성분 위주로 구성되어 있어서 안심했어요. 특히 피부 장벽 강화와 수분 유지에 탁월한 판테놀이 1%나 함유되어 있어서 그런지, 확실히 세안하면서도 피부 수분막을 지켜주는 느낌이 듭니다. 제형은 너무 묽지 않고 부드러운 영양 로션 같은 텍스처예요. 건조하고 푸석한 피부에 올렸을 때 마찰 자극 없이 부드럽게 롤링되어서 정말 편안해요. 색상도 은은한 블루 빛이 돌아서 시각적으로도 진정되는 기분이 듭니다.\n2. 세정력 및 사용감\n\n사실 세정력 자체가 엄청 강력한지는 잘 모르겠어요. 그래도 상세 설명에 세정력이 좋다고 나와 있기도 하고, 제가 평소에 선크림이나 가벼운 베이스 위주로만 바르다 보니 일상적인 세정에는 무리가 없다고 생각하면서 쓰고 있어요.\n대신 사용감은 정말 만족스럽습니다. 얼굴에 문지를 때부터 '아, 이거 세안하고 나면 되게 촉촉하겠다'라는 느낌이 딱 와요. 게다가 피부에 좋은 판테놀 같은 특수 성분이 들어가 있어서 그런지, 얼굴에 롤링하며 마사지할 때마다 피부가 건강해지는 것 같고 쓸 때마다 기분이 정말 좋아집니다.\n\n3. 비포 & 애프터 (가장 만족스러운 점)\n가장 마음에 드는 부분은 세안 후 피부 상태예요! 기존 제품들을 썼을 때는 세안 직후 로션을 바르지않으면 얼굴이 붉어지고 당겼는데, 이 제품은 물기를 수건으로 닦아낸 후에도 속당김이 없습니다. 급하게 기초 화장품을 찾아 뛰어가던 루틴이 사라졌어요.","zh-CN":"肤质：极干性 / 洗脸后有撕裂般的内干和白色脱皮困扰的干性肌肤\n\n1. 成分及质地 \n我先在化海App上查了成分，发现没有需要注意的成分，主要由温和水润的成分组成，让人放心。特别是含有1%对皮肤屏障强化和保湿都非常好的泛醇，感觉洗脸的同时也能确实守住皮肤水润膜。质地不算太稀，是柔软的滋养乳液质感。涂在干燥粗糙的皮肤上时，没有摩擦刺激地顺滑打圈，真的很舒服。颜色也带着淡淡的蓝色调，视觉上也让人觉得舒缓。\n2. 清洁力及使用感\n\n其实我不太确定清洁力本身有多强。不过产品详情页也写着清洁力不错，而我平时主要涂防晒或轻底妆，觉得日常清洁完全够用，就这样用着。\n代替强清洁力的是真的令人满意的使用感。从涂在脸上开始，就有种'啊，这个洗完应该会很水润'的预感。而且因为含有对皮肤好的泛醇之类的特殊成分，每次在脸上打圈按摩时都感觉皮肤在变健康，每次用都心情很好。\n\n3. 前后对比（最满意的部分）\n最满意的部分是洗脸后的皮肤状态！用之前的产品时，洗完脸如果不马上涂乳液，脸就会泛红紧绷，但这款产品用毛巾擦干水分之后也不会内干紧绷。急急忙忙冲去找基础护肤品的日常已经不再需要了。"},images:[],video:null},
    {id:"qg29lKzZ",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"수부지 트러블성, 압출 관리사 추천으로 오일→밀크 전환, 화이트헤드 감소","zh-CN":"水油皮痘痘肌，皮肤管理师推荐从油类换成洁面乳，白头粉刺减少"},date:"2026-06-15",
      quote:{ko:"원래 클렌징 오일•밤을 주로 사용하던 수부지, 트러블성 피부입니다. 피지 녹이는 데에만 집중하느라 순한 클렌징보다는 강한 세정력을 중요하게 생각했었는데 이게 누적되면서 피부 장벽이 서서히 무너져 가는 게 느껴졌어요. 그래서 압출을 받으러 갔는데 관리사님이 밀크로 바꾸는 걸 추천해주셔서 고민하던 중 타이밍 좋게 이 제품을 사용하게 되었습니다. \n \n\n 2주정도 사용했고, 결론적으로는 피부결이 많이 좋아졌어요. 한 번 세안할 때 2펌프정도 사용했고 유화가 엄청 잘 된다는 느낌은 아니었지만 피부 메이크업은 깨끗하게 지워졌습니다. 기존에 사용하던 다른 밀크는 물로 헹궈낸 후에도 약간 끈적이는 느낌이 남았는데 이건 잔여감이 없어서 좋았어요. 그래도 메이크업 한 날이면 2차 세안은 습관적으로 해주는 게 좋을 것 같습니다! \n \n\n 저는 클렌징 밀크를 얼굴에 고르게 도포한 후 1분정도 기다렸다가 롤링 -> 물을 살짝 발라 롤링하며 유화 -> 헹굼 -> 약산성 클렌징 폼으로 2차 세안해줬고, 이렇게 클렌징 방법을 바꾼 후에 모공에 끼던 화이트헤드도 정말 많이 없어졌어요. 특히 이 제품은 판테놀이 함유되어 있어서 세안 후에 당기는 느낌이 적은 게 좋아요.\n \n\n 세정력도 좋고 무엇보다 자극 없이 진정되는 클렌징밀크라 정착해도 될 만한 제품이라고 느껴졌습니다.","zh-CN":"我本来主要用卸妆油/膏，是水油皮、痘痘肌。因为一直只专注于溶解皮脂，比起温和清洁更看重强清洁力，结果日积月累皮肤屏障渐渐感觉在崩溃。所以去做了压痘管理，管理师建议我换成洁面乳，正在犹豫的时候刚好用上了这款产品。 \n \n\n 用了大概两周，结论是肤质好了很多。每次洗脸用了大概两泵，虽然不觉得乳化特别顺滑，但妆容都能干净卸掉。之前用的其他洁面乳用水冲洗后还会留一点粘腻感，这款没有残留感，很喜欢。不过化妆的日子还是习惯性地做了二次清洁比较好！ \n \n\n 我的做法是把洁面乳均匀涂在脸上，等一分钟后打圈按摩->沾点水打圈乳化->冲洗->用弱酸性洁面泡沫二次清洁，换成这种清洁方法之后，堵在毛孔里的白头粉刺也真的减少了很多。特别是这款产品含有泛醇，洗完之后紧绷感较少，这点很喜欢。\n \n\n 清洁力也不错，最重要的是这是一款无刺激又舒缓的洁面乳，感觉是值得长期使用的产品。"},images:[],video:null},
    {id:"Jk8nbgLZ",rating:4,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지 민감, 볼 건조+홍조 - 진정 도움, 트러블 없음","zh-CN":"水油皮敏感肌，脸颊干燥+泛红 - 有助舒缓，不长痘"},date:"2026-06-06",
      quote:{ko:"📍피부타입: 민감성 수부지, 볼 건조+약간의 홍조\n\n✅ 클렌징 밀크 특유의 부드러운 사용감 덕분에 세안 후에도 피부가 편안하다. 건성이나 민감성 피부가 사용하기 좋다.\n\n✅ 판테놀 성분이 함유되어 있어 진정에 도움을 준다. 세안 과정에서 피부가 예민해지는 느낌이 적고, 사용 후에도 피부가 촉촉하게 유지된다.\n\n✅ 무향에 부드러운 롤링감이 좋다. 피부 마찰을 최소화하면서 메이크업과 노폐물을 녹여내는 느낌이다. 자극적인 클렌징 오일이 부담스러운 사람에게 적합하다.\n\n✅ 가벼운 베이스 메이크업은 무난하게 지워지기때문에 데일리로 사용하기 좋다. 선크림이나 쿠션 정도의 데일리 메이크업은 큰 자극 없이 깔끔하게 제거된다.","zh-CN":"📍肤质：敏感性水油皮，脸颊干燥+轻微泛红\n\n✅ 得益于洁面乳特有的柔软使用感，洗脸后皮肤也很舒适。适合干性或敏感性肌肤使用。\n\n✅ 含有泛醇成分，有助于舒缓。洗脸过程中皮肤变敏感的感觉较少，用后皮肤也能保持水润。\n\n✅ 无香、顺滑的打圈感很好。能最大程度减少皮肤摩擦，同时溶解妆容和废物。适合觉得刺激性卸妆油有负担的人。\n\n✅ 轻底妆能顺利卸干净，适合日常使用。防晒或气垫程度的日常妆容能无太大刺激地干净卸除。"},images:[],video:null},
    {id:"A7wkN6vA",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"건성, 모공속 노폐물 98.9% 제거 수치 인용, 예민해도 트러블 없음","zh-CN":"干皮，引用毛孔内废物去除率98.9%数据，敏感期也不长痘"},date:"2026-06-15",
      quote:{ko:"블루 진정 판체놀 1% 클렌징밀크는 판테놀 히알루론산 호호바오일 세라마이드 구아이아줄렌이 주요성분으로 되어있어서 피부장벽 진정 수분공급 모공을 막지않는 보습오일로 피부컨디션은 지켜주면서 모공속 노폐물을 98.9% 제거해주는 클렌징밀크에요!\n \n\n 사용감은 되게 부드러우면서 크리미하게 발렸고 원래 쓰던 클렌징 밀크보다 촉촉했어요 다른 밀크제품은 롤링하다보다보명 흡수되서 얼굴마찰이 생기는데 이제품은 그런게 없었어요 세안후에도 깔끔한데 당김없이 촉촉해요! 뽀득뽀득하게 씻기지 않으면 약간 찝찝할때가 있는데 피부가 촉촉하면서 잔여감은 하나도 남지않았어요 워터프루프가 아닌이상 포인트 메이크업이나 베이스메이크업은 지워지도라구여\n \n\n 제피부가 화장품 조금만 잘못쓰거나 피부관리를 멋하면 예민해지고 트러블도 나는데 이 제품쓸때는 불편함은 없었던거같아요 제품 자체가 논코메도제닉테스트 민감성피부 인체적용 실험도 되어있고 세안중에 있을수있는 모든 자극을 최소화시킨 제품이라서 안심하고 썼어요 급속진정+장벽보호+순한세정 까지 완벽한 제품이에요!!","zh-CN":"蓝色舒缓泛醇1%洁面乳的主要成分是泛醇、透明质酸、荷荷巴油、神经酰胺、蓝甘菊薁，用不堵塞毛孔的保湿油分兼顾皮肤屏障舒缓和补水，同时去除98.9%毛孔内废物的洁面乳！\n \n\n 使用感非常柔软顺滑，比原本用的洁面乳更水润。其他洁面乳打圈按摩久了会被吸收产生脸部摩擦感，这款没有这个问题，洗完脸也很干净，不紧绷还很水润！如果没有洗到吱吱作响的干净感有时会觉得有点不放心，但这款皮肤水润的同时完全没有残留感。只要不是防水彩妆，无论是点妆还是底妆都能卸干净。\n \n\n 我皮肤只要化妆品稍微用错或没好好护理就容易变敏感长痘，用这款产品的时候完全没觉得不适。产品本身做过无致痘测试和敏感肌人体测试，是把洗脸过程中可能出现的所有刺激都降到最低的产品，所以能放心使用。速效舒缓+屏障保护+温和清洁，完美的产品！！"},images:[],video:null},
    {id:"qPgn1oxZ",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"20대 수부지~건성 여드름성, 자극·트러블 전혀 없음","zh-CN":"20多岁水油皮～干皮痘痘肌，完全没有刺激·痘痘"},date:"2026-06-05",
      quote:{ko:"✔ 피부타입:\n 20대, 수부지~건성, 여드름성, 예민도 낮음\n \n\n 💬 제형\n 하늘색 클렌징 밀크로, 천천히 흘러내리는 정도의 점성을 가지고 있습니다\n \n\n 💬 사용감\n 부드럽고 잘 발리며, 롤링하다 보면 스킨케어 제품처럼 피부에 자연스럽게 녹아듭니다 이 상태에서 물을 묻히면 다시 하얗게 변하며 유화되면서 클렌징됩니다 사용 후에는 잔여감도 거의 없고, 건성 피부임에도 세안 후 당김이나 건조함이 느껴지지 않아 이 점이 특히 좋았습니다\n \n\n 💬 자극 & 트러블\n 순한 제품답게 자극이나 트러블은 전혀 발생하지 않았습니다","zh-CN":"✔ 肤质：\n 20多岁，水油皮～干皮，痘痘肌，敏感度低\n \n\n 💬 质地\n 天蓝色的洁面乳，具有缓慢流动程度的粘度\n \n\n 💬 使用感\n 柔软好抹开，打圈按摩时会像护肤品一样自然地融入皮肤。这个状态下沾水会重新变白并乳化，完成清洁。用完之后几乎没有残留感，虽然是干性肌肤，但洗脸后没有紧绷或干燥感，这点特别喜欢。\n \n\n 💬 刺激与痘痘\n 不愧是温和的产品，完全没有出现刺激或长痘的情况"},images:[],video:null},
    {id:"A7w3dLnA",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"수부지, 알로에·자작나무·녹두 알레르기 체질 - 자극 없이 사용","zh-CN":"水油皮，对芦荟·桦树·绿豆过敏体质 - 无刺激使用"},date:"2026-06-05",
      quote:{ko:"🪴수부지\n 🪴수분증발차단제(시어버터, 스테아릭애씨드, 오일 등) 성분이 없으면 속건조를 느낍니다! 그래서 수딩크림 같이 가벼운 크림은 선호하지 않아요.\n 🪴알로에(알로에베라추출물), 자작나무(자일리톨), 녹두 성분에 알레르기가 있습니다!\n \n\n 🌳제형 & 사용감🌳\n 부드러운 로션 제형이라 피부에 자극 없이 롤링하기 좋았어요. 세안 후에도 속당김 없이 촉촉하게 마무리되는 편이라 건성이나 수부지 피부도 부담 없이 사용할 수 있을 것 같았습니다. 피부가 건조해지거나 땅기는 느낌이 없어서 데일리로 사용하기 좋았어요!\n \n\n 🌳세정력🌳\n 가벼운 메이크업이나 선크림 정도는 무난하게 지워졌어요. 다만 마스카라나 워터프루프 제품 같은 진한 포인트 메이크업은 한 번에 깔끔하게 지워지지는 않는 편이라 립앤아이리무버를 함께 사용하는 것을 추천드립니다!\n \n\n 🌳트러블 유무🌳\n 사용하는 동안 트러블이 올라오거나 피부가 뒤집어지는 일은 없었어요! \n \n\n 🌳향🌳\n 향은 거의 무향에 가까웠어요! 인위적인 향이 강한 제품을 선호하지 않는 분들이라면 만족할 것 같아요. 세안할 때 향 때문에 거슬리는 부분은 전혀 없었습니다!!","zh-CN":"🪴水油皮\n 🪴如果没有防止水分蒸发的成分（乳木果油、硬脂酸、油类等）会感到内干！所以不太喜欢舒缓面霜之类的轻质面霜。\n 🪴对芦荟（芦荟提取物）、桦树（木糖醇）、绿豆成分过敏！\n \n\n 🌳质地及使用感🌳\n 柔软的乳液质地，在皮肤上打圈无刺激，很好用。洗后也不内干，能水润收尾，感觉干皮或水油皮都能放心使用。皮肤不会变干燥或紧绷，很适合日常使用！\n \n\n 🌳清洁力🌳\n 轻妆或防晒程度能顺利卸掉。不过睫毛膏或防水产品这类浓重的点妆，一次不容易完全卸干净，建议搭配唇眼卸妆液一起用！\n \n\n 🌳是否长痘🌳\n 使用期间没有出现长痘或皮肤爆发的情况！\n \n\n 🌳香味🌳\n 几乎接近无香！不喜欢人工香味强烈的产品的人应该会满意。洗脸时完全没有因为香味而觉得不舒服的地方！！"},images:[],video:null},
    {id:"qW4jQgXA",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지/민감, 트러블 잦은 남편도 순하다고 인정","zh-CN":"水油皮/敏感肌，容易长痘的老公也承认很温和"},date:"2026-06-05",
      quote:{ko:"1. 제형 / 향\n 부드럽고 크리미한 밀크 타입 제형으로 주르륵 흘러내리지 않고 피부에 자극 없이 부드럽게 펴 발립니다. 일반 오일 클렌저보다 가볍고 로션 같은 사용감이라 민감한 피부도 부담 없이 사용할 수 있었어요.\n \n\n 향은 강한 인공향이 거의 느껴지지 않지만 성분의 향인지 모르겠는데, 얼굴에 바르면 살짝 별로인 냄새가 나요. \n \n\n \n\n 2. 성분\n 판테놀 1%(10,000ppm)를 함유해 세안 과정에서도 피부 진정과 보습을 동시에 챙길 수 있는 점이 인상적이었습니다. 개인적으로 판테놀 성분이 잘 맞아서 긍정적인 느낌이 있습니다.\n \n\n 그 외에도 세라마이드 등 피부 장벽을 보호하고 수분 유지에 도움을 주는 성분들이 함유되어 있어 세안 후에도 피부가 당기지 않았어요.\n \n\n 예민한 눈가나 트러블 피부도 눈 시림이나 따가움 걱정 없이 순하게 사용할 수 있었습니다.\n \n\n \n\n 3. 사용감\n 메이크업과 노폐물을 부드럽게 녹여주면서도 세안 후 피부가 건조하거나 땅기는 느낌이 거의 없었습니다.\n 유화 과정도 아주 매끄럽고 물로 씻어낸 이후 미끄덩 한 느낌이 딱히 없어서 좋았어요!\n \n\n 특히 클렌징 후 피부가 촉촉하고 편안하게 마무리되는 점이 만족스러웠고, 평소 세안 후 속당김을 자주 느끼는 예민 피부 분들에게 잘 맞을 것 같아요.\n \n\n 요즘 파데프리 메이크업으로 선크림이랑 색조만 살짝 하고 다니는데, 일상적인 선크림과 가벼운 메이크업 정도는 깔끔하게 제거되는 편이었습니다.\n (마스카라는 하고다니지 않아서 모르겠습니다.)\n \n\n 꼼꼼히 세안 안하면 성인 트러블이 자주 나는 남편도 순하고 괜찮다고 합니다.\n \n\n 4. 기타\n 뚜껑을 돌려서 열고 닫을 수 있는 점이 마음에 들었어요.\n 여행을 자주 다니는데, 별도의 캡으로 펌프를 고정시키는 것은 금방 잃어버리기 일쑤였는데, 간편히 잠글 수 있어서 샐 걱정 없이 다닐 수 있어 좋습니다. 굿굿","zh-CN":"1. 质地/香味\n 柔软细腻的洁面乳质地，不会流得到处都是，能无刺激地在皮肤上顺滑抹开。比一般油类卸妆更轻盈，是乳液般的使用感，敏感肌也能放心使用。\n \n\n 香味没什么明显的人工香，但不确定是不是成分本身的味道，涂在脸上会有一点点不太喜欢的味道。 \n \n\n \n\n 2. 成分\n 含1%（10,000ppm）泛醇，洗脸过程中也能同时兼顾皮肤舒缓和保湿，这点让人印象深刻。个人对泛醇成分比较适应，感觉是正面的。\n \n\n 除此之外还含有神经酰胺等能保护皮肤屏障、帮助保湿的成分，洗完脸皮肤也不紧绷。\n \n\n 就算是敏感的眼周或长痘的皮肤，也能温和使用，不用担心呛眼或刺痛。\n \n\n \n\n 3. 使用感\n 能温和溶解妆容和废物，同时洗完脸后几乎不会感到干燥或紧绷。\n 乳化过程也很顺滑，用水洗掉之后也没有滑腻感，很喜欢！\n \n\n 特别满意的是洁面后皮肤水润舒适的收尾感，感觉很适合平时洗脸后经常内干紧绷的敏感肌人群。\n \n\n 最近走的是裸底妆风格，只简单涂防晒和一点彩妆，日常的防晒和轻度妆容都能干净卸除。\n （因为没画睫毛膏，这部分不清楚。）\n \n\n 我老公不好好洗脸就容易长成人痘，他也说这款很温和没问题。\n \n\n 4. 其他\n 喜欢瓶盖可以旋转开合这点。\n 我经常出差旅行，那种要单独用盖子固定泵头的设计很容易弄丢，这款可以简单锁上，不用担心漏出来，很方便。赞。"},images:[],video:null},
    {id:"JR7jmQzZ",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"홍조 심함+피부염증 상태 중건성, 순한 제품만 쓸 수 있는 피부에도 적합","zh-CN":"泛红严重+皮肤炎症状态的中干皮，只能用温和产品的肌肤也适用"},date:"2026-06-05",
      quote:{ko:"현재 피부상태\n ; 홍조가 심함, 피부염증이 있는 상태, 순한 제품만 사용 가능함, 속건조 심한 중건성 피부\n \n 1. 점도에 대한 느낌 : 부드러운 요플레 제형\n 2. 향에 대한 느낌 : 오일 특유의 향 , 원료 그대로의 향\n 3. 색에 대한 느낌 : 푸른빛이 첨가된 흰색\n 4. 보습에 대한 느낌 : 클렌징 후 당김없이 촉촉한 편\n 5. 발림성에 대한 느낌 : 엄청 부드러움\n 5. 거품력에 대한 느낌 : 거품없는 밀크타입\n \n\n <좋았던 점>\n\n * 사용이 간편하고 편리함!!\n 클렌징 오일보다 유화 과정이 더 짧고, 사용 후에 잔여감이 많이 남지 않아 2차 세정제를 적은 양만 사용해도 충분해서 세안 부담이 적음\n \n * 연한 메이크업하는 사람에게는 만족스러운 세정력\n 클렌징 오일이나 클렌징 밤은 연한 메이크업할 때 사용하기에는 피부에 과한 자극을 주는 느낌이었는데 (세정력이 강함), 노마디아 클렌징 밀크는 피부에 자극 없이 부드럽게 롤링되고 적당한 세정력으로 데일리 세안제로 좋음\n \n * 촉촉하고 순한 세정제\n 성분을 보면 보습성분&피부장벽케어성분이 많고 피부에 자극주는 향료나 알코올같은 성분이없어서 민감한 피부가 사용하기 좋음! 홍조 피부에게도 좋을듯!!\n 확실히 세안 후에도 피부가 건조한 느낌이 다른 세안제보다 덜함. \n \n\n * 위생적인 펌프 용기\n 펌프 타입이라 사용이 편리하고 내용물을 위생적으로 사용할 수 있음","zh-CN":"当前皮肤状态\n ；泛红严重、有皮肤炎症、只能使用温和产品、内干严重的中干性肌肤\n \n 1. 粘度感受：柔软的酸奶质地\n 2. 香味感受：油类特有的香味，原料本身的味道\n 3. 颜色感受：带蓝色调的白色\n 4. 保湿感受：洗后不紧绷，比较水润\n 5. 延展性感受：非常柔软\n 5. 起泡力感受：无泡沫的洁面乳类型\n \n\n <喜欢的地方>\n\n * 使用简单方便！！\n 比卸妆油乳化过程更短，用后残留感不多，二次清洁产品少量就够用，洗脸负担小\n \n * 对淡妆人群来说清洁力令人满意\n 卸妆油或卸妆膏用在淡妆上感觉对皮肤刺激过大（清洁力太强），而NOMADIA洁面乳能无刺激地顺滑打圈，清洁力适中，适合当日常洁面产品\n \n * 水润温和的清洁产品\n 从成分来看含有很多保湿成分&皮肤屏障护理成分，不含刺激皮肤的香料或酒精类成分，适合敏感肌使用！对泛红肌也应该很好！！\n 确实洗完脸后干燥感比其他洁面产品少很多。 \n \n\n * 卫生的泵头包装\n 泵头类型使用方便，内容物也能卫生地使用"},images:[],video:null},
    {id:"ZBz3eoGZ",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"건성/민감, 장벽 약해진 상태 - 붉은기 올라올 때도 편안","zh-CN":"干皮/敏感，屏障变弱的状态 - 泛红时使用也很舒适"},date:"2026-06-05",
      quote:{ko:"피부가 예민한 편이라 화장 후에 이차세안 하고 아침에 약산성 클렌징을 쓰다보니 언제부터 장벽이 많이 약해져서 피부고민이 심했어요. 메이크**, 이즈앤** 등등 순한 밀크 제품에 정착하다가 노마디아 판테놀 클렌징 밀크를 써봤는데… 이 친구 요물이네요?!!🙂\n \n\n 💗 향\n 은은한 크림향 느낌인데 자극적이지 않고 전체적으로 순한 편이에요. 인공향 강한 제품 싫어하는데 부담 없이 사용 가능했어요! 세안할 때 은근 편안한 느낌이라 좋았음🤍\n \n\n 💗 사용감\n 로션처럼 부드러운 밀크 제형이라 피부에 롤링할 때 자극이 거의 없어요. 메이크업이랑 노폐물도 부드럽게 녹여주는 느낌! 오일처럼 미끌거리거나 무겁지 않고 촉촉하게 세안되는 타입이라 아침 세안용으로도 괜찮았어요👍\n \n\n 💗 피부 느낌\n 세안 후에 제일 좋았던 건 당김이 확실히 덜하다는 점! 피부가 편안하고 유수분 안 뺏긴 느낌이라 만족했어요. 특히 붉은기 올라오거나 예민할 때 사용하기 괜찮았고, 세안 후 피부결이 매끈해 보이는 느낌도 있었어요✨\n \n\n 💗 보습감\n 클렌징하고 나면 보통 바로 스킨 발라야 하는데 이건 촉촉함이 꽤 남아있어요. 건성이나 속건조 있는 사람들한테 특히 잘 맞을 것 같고, 아침에 가볍게 세안하기에도 부담 없는 느낌!","zh-CN":"我皮肤比较敏感，化妆后要做二次清洁，早上又用弱酸性洁面，不知从什么时候起屏障变得很弱，皮肤问题很严重。用过Make**、Iz&**等温和洁面乳定妆之后，又试了NOMADIA泛醇洁面乳……这家伙真是个宝贝啊？!!🙂\n \n\n 💗 香味\n 淡淡的奶油香，不刺激，整体偏温和。我不喜欢人工香味强烈的产品，这款用起来没有负担！洗脸时有种莫名舒服的感觉，很喜欢🤍\n \n\n 💗 使用感\n 像乳液一样柔软的洁面乳质地，在皮肤上打圈时几乎没有刺激。能温和地溶解妆容和废物！不像油类那样滑腻厚重，是水润洗净的类型，早上洗脸用也很不错👍\n \n\n 💗 皮肤感受\n 洗后最喜欢的是紧绷感明显减少这点！皮肤很舒服，感觉水油没有被夺走，很满意。特别是在泛红或敏感的时候用也很舒适，洗后皮肤纹理也感觉更细腻✨\n \n\n 💗 保湿感\n 清洁之后通常要马上涂化妆水，但这款水润感留存得相当久。感觉特别适合干皮或内干人群，早上轻松洗脸时也没有负担！"},images:[],video:null},
    {id:"AVpPgD6Z",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"건성+아토피 피부, 세정력·보습 균형","zh-CN":"干皮+特应性皮炎肌，清洁力与保湿的平衡"},date:"2026-06-15",
      quote:{ko:"💡예민한 피부 / 건성 + 아토피 피부💡\n🧊부드럽고 자극 없는 클렌징🧊\n \n\n 처음 사용했을 때 밀크 타입이라 피부에 부드럽게 펴 발려서 자극이 거의 느껴지지 않았어요! 건성 피부라 세안 후 당김이 심한 편인데 세안하는 동안에도 피부가 편안했고, 롤링할 때 마찰감이 적어서 좋았습니다❣️\n \n\n 🧊세안 후에도 촉촉한 마무리감🧊\n \n\n 평소 클렌징 제품을 사용하면 세안 직후 피부가 건조하고 당기는 경우가 많았는데, 이 제품은 세안 후에도 촉촉함이 남아있어서 만족스러웠어요. 특히 예민하고 건조한 피부라 세정력과 보습감을 모두 중요하게 생각하는데 균형이 잘 맞는 느낌이었습니다!\n \n\n 🧊민감 피부도 부담 없이 사용 가능🧊\n \n\n 판테놀 성분이 들어 있어서 그런지 세안 후 붉어짐이나 자극이 크게 느껴지지 않았어요. 피부 컨디션이 좋지 않은 날에도 편안하게 사용할 수 있었고, 꾸준히 사용해도 건조함이 심해지지 않아 좋았습니다. 진한 메이크업보다는 데일리 선크림이나 가벼운 메이크업 세정용으로 사용하기 딱 좋을 것 같아요✨\n \n\n 🧊총평🧊\n \n\n 건성·민감성 피부가 부담 없이 사용할 수 있는 순한 클렌징 밀크였습니다. 세안 후 촉촉한 마무리감이 가장 마음에 들었고, 피부가 예민한 날에도 편안하게 사용할 수 있어 만족스러웠어요. 자극이 적은 클렌징 제품을 찾는 분들께 추천하고 싶습니다💙","zh-CN":"💡敏感肌/干皮+特应性皮炎肌💡\n🧊柔软无刺激的清洁🧊\n \n\n 第一次用的时候是洁面乳质地，在皮肤上柔软地抹开，几乎感觉不到刺激！我是干皮，洗完脸后紧绷感比较严重，但洗脸过程中皮肤也很舒适，打圈按摩时摩擦感少，很喜欢❣️\n \n\n 🧊洗后依然水润的收尾感🧊\n \n\n 平时用清洁产品后，洗完脸马上就会觉得皮肤干燥紧绷，但这款产品洗后依然留有水润感，很满意。特别是我皮肤敏感又干燥，同时看重清洁力和保湿感，感觉两者平衡得很好！\n \n\n 🧊敏感肌也能无负担使用🧊\n \n\n 可能是含有泛醇成分，洗完脸后没有明显的泛红或刺激感。皮肤状态不好的日子用起来也很舒适，持续使用也没有加重干燥，很喜欢。比起浓妆，更适合用来卸日常防晒或轻妆✨\n \n\n 🧊总评🧊\n \n\n 是一款干皮·敏感肌都能无负担使用的温和洁面乳。最喜欢洗后水润的收尾感，皮肤敏感的日子用起来也很舒适，很满意。想找刺激少的清洁产品的人，推荐这款💙"},images:[],video:null},
    {id:"ZN6yp0jZ",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"민감·건성, 환절기·피곤한 날 장벽 약화 - 붉은기 심해지지 않음","zh-CN":"敏感·干皮，换季·疲惫日屏障变弱 - 泛红不会加重"},date:"2026-06-05",
      quote:{ko:"😊 피부 타입 / 컨디션\n 평소 세안 후 피부가 쉽게 당기고 붉어지는 민감·건성 피부입니다. 특히 환절기나 피곤한 날에는 피부 장벽이 약해져 자극에 예민하게 반응하는 편이라, 세정력뿐 아니라 세안 후 편안한 사용감을 중요하게 생각합니다.\n 🗓️ 사용 기간 / 사용 방법\n 약 2주간 아침, 저녁 세안 시 사용했습니다. 물기 없는 손에 적당량을 덜어 얼굴 전체에 부드럽게 마사지하듯 롤링한 뒤, 미온수로 유화 과정을 거쳐 깨끗하게 헹궈냈습니다. 메이크업을 한 날에는 1차 세안 단계로 활용했습니다.\n ✨ 효과 / 변화 포인트\n 사용 후 가장 만족스러웠던 점은 세안 직후 피부가 편안하다는 점이었습니다. 일반 클렌저 사용 후 느껴지던 땅김이 적었고, 피부가 한층 부드럽고 촉촉하게 유지되는 느낌을 받았습니다. 피부가 예민한 날에도 자극 없이 사용할 수 있었으며, 세안 후 붉은기가 심해지지 않아 부담 없이 손이 가는 제품이었습니다. 꾸준히 사용하면서 피부가 건조해지는 느낌이 줄어들어 만족스러웠습니다.\n 🧴 질감 / 향 / 사용감\n 부드러운 밀크 타입 제형으로 피부에 닿았을 때 자극 없이 부드럽게 펴 발립니다. 롤링하는 동안 마찰감이 적어 민감한 피부도 편안하게 사용할 수 있었으며, 세안 후에는 촉촉한 마무리감을 느낄 수 있었습니다. 향은 강하지 않고 은은하거나 거의 무향에 가까운 편이라 향료에 민감한 사람도 부담 없이 사용할 수 있습니다.\n 📝 총평\n 블루 진정 판테놀 1% 클렌징 밀크는 세정과 진정을 동시에 챙기고 싶은 민감성 피부에게 잘 맞는 제품이라고 느꼈습니다. 세안 후에도 피부가 편안하고 촉촉하게 유지되어 건성·민감성 피부가 데일리 클렌저로 사용하기 좋았습니다. 자극적인 세안으로 인해 피부가 쉽게 건조해지는 분들에게 특히 추천하고 싶은 제품입니다.","zh-CN":"😊 肤质/状态\n 平时洗脸后皮肤容易紧绷泛红的敏感·干性肌肤。特别是换季或疲惫的日子皮肤屏障会变弱，对刺激反应敏感，所以除了清洁力，我更看重洗后舒适的使用感。\n 🗓️ 使用时间/使用方法\n 早晚洁面时使用了大约两周。在干燥的手上取适量，在整个脸部像按摩一样柔软打圈，然后用温水乳化，彻底冲洗干净。化妆的日子用作第一次清洁。\n ✨ 效果/变化点\n 用后最满意的是洗脸后皮肤立刻感到舒适这点。用一般洁面产品后会有的紧绷感变少了，皮肤感觉更柔软水润。皮肤敏感的日子也能无刺激使用，洗后泛红没有加重，是让人放心使用的产品。持续使用后皮肤干燥的感觉减少了，很满意。\n 🧴 质感/香味/使用感\n 柔软的洁面乳质地，接触皮肤时能无刺激地柔软抹开。打圈按摩时摩擦感少，敏感肌也能舒适使用，洗后能感受到水润的收尾感。香味不浓，淡雅或近乎无香，对香料敏感的人也能放心使用。\n 📝 总评\n 感觉蓝色舒缓泛醇1%洁面乳很适合想同时兼顾清洁和舒缓的敏感肌。洗后皮肤依然舒适水润，干性·敏感性肌肤当日常洁面产品很合适。特别推荐给容易因刺激性洁面而皮肤干燥的人。"},images:[],video:null},
    {id:"Zm2lQzDq",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지, 여름철 뾰루지 대폭발+열감 홍조 - 자극 전혀 없이 시원한 사용감","zh-CN":"水油皮，夏季痘痘大爆发+发热泛红 - 完全无刺激，清凉使用感"},date:"2026-06-05",
      quote:{ko:"피부타입 : 여름철 뾰루지 대폭발 열감 개많은 홍조 수부지\n \n\n 1) 일단 가장 큰 장점 시원함. 블루 진정 이름에 맞게 하루종일 피곤해져있는 피부에 도포하고 문질문질했을때 답답하지 않고 적당히 시원함 쿨링까진 아니긴한데 어차피 예민피부엔 그렇게 화확적 쿨링 좋지도 않고 이정도면 대만족\n \n\n 2) 자극xxxx . 자극 진짜 없음 원래 예민피부에는 클렌징 밀크쓰라고 하잖음 ? 워낙 예민피부라 갑자기 피부 따갑고 할때 클오 대신에 얘 써줬는데 하나도 안따가웠음\n \n\n 3) 촉촉. 유분 x 촉촉이라서 나같은 수부지 지성피부들써도 번들거리지 않고 수분감만 남길거임\n \n\n 왠만하면 별 5개안주는데 제 피부엔 진짜 잘맞고 마무리감도 산뜻했어요 ! 완전 추천 ㅋㅋㅋ","zh-CN":"肤质：夏季痘痘大爆发、发热感很重、泛红的水油皮\n \n\n 1) 首先最大的优点是清凉感。名副其实的蓝色舒缓，涂在整天疲惫的皮肤上打圈时不闷，有种恰到好处的清凉，虽然算不上冰凉降温，但反正敏感肌也不适合那种化学冰凉感，这种程度就已经很满意了\n \n\n 2) 刺激xxxx。真的完全没有刺激。不是都说敏感肌要用洁面乳吗？我皮肤本来就很敏感，突然刺痛的时候用这个代替卸妆油，完全不刺痛\n \n\n 3) 水润。不油腻却水润，所以像我这种水油皮油性肌肤用也不会出油，只会留下水润感\n \n\n 我一般不太给五星，但这款真的很适合我的皮肤，收尾感也很清爽！强烈推荐哈哈哈"},images:[],video:null},
    {id:"ZN6Pd8aZ",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"악건성+아토피, 환절기 따갑고 붉어지는 피부에 순한 사용감","zh-CN":"极干皮+特应性皮炎，换季刺痛泛红肌也有温和使用感"},date:"2026-06-15",
      quote:{ko:"피부가 워낙 악건성에다 아토피까지 있어서 환절기나 컨디션 안 좋을 때는 클렌징만 해도 얼굴이 찢어질 것처럼 따갑고 붉어지는 편이에요. 그래서 오일이나 폼은 잘 사용하지 않고 순한 밀크 타입을 주로 찾아 쓰는데, 이번에 노마디아 제품이 당첨되어 사용해봤어요.\n \n\n 처음 짰을 때는 생각보다 제형이 묽지 않고 약간 쫀쫀한 로션 같은 느낌인데, 얼굴에 롤링하면 부드럽게 사르르 녹아내려요. 마찰 자극이 거의 없어서 롤링하는 내내 피부가 편안했어요.\n \n\n 가장 마음에 들었던 점은 세안 후 당김이 정말 덜했어요. 물세안만 가볍게 하고 수건으로 닦아내도 촉촉한 느낌이 들고 판테놀이 들어가서 그런지 세수하고 나서 특유의 붉은 기나 가려움 올라오는 것도 많이 진정되는 느낌을 받았어요.\n \n\n 다만, 순한 진정 클렌저라 그런지 세정력이 엄청 강력하진 않을 것 같아요. 저는 보통 선크림만 사용해서 이 제품만으로도 충분하지만 추가적인 화장을 하는 분들은 다른 세정 제품을 추가적으로 사용해주셔야 할 것 같아요.\n \n\n  그리고 뽀드득한 마무리를 좋아하시는 분들에게는 약간 미끈거린다고 느껴질 수도 있을 것 같아요. 하지만 저처럼 장벽 다 무너진 극건성+선천적 아토피 피부인 저에겐 정말 좋았고, 다른 분들에게도 추천해요.","zh-CN":"我皮肤本来就是极干性，还有特应性皮炎，换季或状态不好的时候光洗脸就会觉得脸像要裂开一样刺痛泛红。所以平时不太用油类或洁面泡沫，主要找温和的洁面乳类型，这次抽中了NOMADIA的产品试用了一下。\n \n\n 刚挤出来的时候质地比想象中不稀，有点像黏稠的乳液，但在脸上打圈时会柔软地化开。摩擦刺激几乎感觉不到，打圈的整个过程皮肤都很舒适。\n \n\n 最满意的一点是洗后紧绷感真的少很多。只是简单水洗后用毛巾擦干也有水润感，可能是含有泛醇的关系，洗完脸后特有的泛红或发痒也感觉舒缓了不少。\n \n\n 不过，可能因为是温和舒缓型洁面产品，清洁力应该不算特别强。我平时只涂防晒，用这款就够了，但化了额外妆容的人可能需要再搭配其他清洁产品。\n \n\n 还有，喜欢洗到吱吱作响的干净感的人可能会觉得有点滑腻。但对像我这样屏障全崩的极干性+先天性特应性皮炎肌肤来说真的很好用，也推荐给其他人。"},images:[],video:null},
    {id:"Z9lW6YPJ",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"수부지, 진한 메이크업 세안 노하우 - 트러블 없이 순함","zh-CN":"水油皮，卸浓妆心得分享 - 不长痘，很温和"},date:"2026-06-15",
      quote:{ko:"수부지이고 클렌징밀크를 사용해온지 꽤 오래되었습니다 \n \n\n -저는 화장을 진하게 하는 편입니다\n 팁 (클렌징 밀크 사용 시 화장을 진하게 하신다면 클렌징 밀크를 건조한 얼굴에 문지른 후 물을 조금 묻히고 다시 문질러 헹군 뒤 수건으로 살짝 닦고 다시 반복 후 물로 헹군 상태에서 클렌징폼으로 마지막 3차 세안을 해주시면 화장이 말끔히 미끄러움이 남지 않고 개운하게 지워집니다)\n 이 과정이 귀찮으실수 있으나 클렌징워터를 솜에 묻혀 닦는 거 보다 자극적이지 않고 오일이 맞지 않는 분들에게 최적입니다 =는 저입니다. \n 혹은 워터나 리무버로 아이라인 립을 먼저 지우시면 과정이 수월해집니다\n \n\n -이 제품은 무향인 편입니다 약간 플라스틱향? 같은게 나는데 클렌징밀크나 오일 들에서 종종 나는 향이고 씻고 나면 전혀 나지 않습니다\n -성분이 매우 순하여 트러블이 올라오지 않아서 좋았습니다 순하여 잘 지워지지 않는다는 의견도 있었으나 저는 제 방식대로 하여서 잘 지웠습니다\n -판테놀 성분 덕인지 세안 후 당김이 없어 굉장히 좋았습니다!\n -밀크든 오일이든 세안 후 약간의 미끄러움이 남을 수 있기에 클렌징폼으로 한 번 더 세안하기를 지성 트러블성 인간으로써 개인적으로 추천합니다\n -제형이 묽지 않아 양을 허비하지 않을 수 있어 좋았고 적당히 되직하여 문지르기 좋았습니다\n -펌핑은 잘 나오긴하나 푸욱 나올수도 있습니다\n \n\n > 여드름성 지성이거나 과도한 세정력 강한 세정력은 기피하시는 분, 피부가 민감하신분, 화장을 연하게 하거나 선크림만 바르시는 분, 세안 후 속당김이 싫으신 분들에게 추천합니다!","zh-CN":"我是水油皮，用洁面乳已经用了挺久了 \n \n\n -我平时妆化得比较浓\n 小贴士（如果化浓妆又想用洁面乳，可以先在干燥的脸上涂抹洁面乳打圈，再沾一点水打圈冲洗，用毛巾轻轻擦一下再重复一次，冲洗后再用洁面泡沫做第三次清洁，这样妆容能干净卸掉，不留滑腻感，非常清爽）\n 这个过程可能会觉得麻烦，但比用棉片蘸卸妆水擦拭更不刺激，对不适合油类的人来说是最佳选择=就是我。 \n 或者先用卸妆水或卸妆液把眼线唇妆卸掉，这样过程会更顺畅\n \n\n -这款产品基本是无香型 有一点点像塑料的味道？洁面乳或油类里偶尔会有这种味道，洗完之后完全没有味道了\n -成分非常温和，不会长痘，这点很好。虽然也有人说太温和所以卸得不干净，但我按自己的方法用，卸得很干净\n -可能是泛醇成分的功劳，洗后完全不紧绷，非常好！\n -不管是洁面乳还是油类，洗后都可能留一点滑腻感，作为油性痘痘肌，个人建议再用洁面泡沫二次清洁一次\n -质地不稀，不会浪费用量，浓稠适中很好抹开\n -按压泵出量正常，但有时候可能会挤出来太多\n \n\n > 推荐给痘痘型油皮、不喜欢过强清洁力的人、皮肤敏感的人、化淡妆或只涂防晒的人、讨厌洗后紧绷的人！"},images:[],video:null},
    {id:"ADwbaO2q",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"수부지, 강한 세정력 제품으로 속당김 심하던 피부가 순한 조합으로 전환","zh-CN":"水油皮，强清洁力产品导致内干严重的肌肤换成温和组合"},date:"2026-07-06",
      quote:{ko:"저는 거의 매일 메이크업을 하기에 매일매일 클렌징 제품을 사용하는데요..! 그러다 보니 여러 종류의 클렌징 제품을 써봤지만 정착하지 못해 매번 다른 제품을 구입해서 사용하다가 우연히 노마디아 제품들을 접해서 사용해봤습니다😆\n\n일단!! 저는 수부지인 피부타입 인데요.. 립앤아이 리무버나 오일 제형을 잘 사용하지 않습니당 그 이유가 너무 기름지고 무거운 느낌이 들어 오히려 더 찝찝하더라고요🥲 그래서 항상 세정력이 강한 폼클렌징을 자주 써왔던거 같아요… 그러다 보니 항상 세안을 하고 나면 바로 속당김이 심해 피부가 예민해지고 기초 제품을 빨리 바르지 않으면 아프기 까지 하더라고요😣\n세정력이 강한 제품들은 또, 아침에 사용하기에도 좀 부담스럽더라고요😖\n\n그러다 민감성 피부가 사용해도 자극이 적고, 진정 효과도 있다는 “블루 진정 판테놀 1% 클렌징 밀크“+”골든 호호바 10% 듀얼 마이크로 버블 클렌저“ 조합을 접하게 되었습니다 ‼️\n\n✨블루 진정 판테놀 1% 클렌징 밀크✨\n제형이 정말 부드러워서 눈에도 자극 없고!! 물로 씻어내고 난 뒤에도 미끄러운 찝찝한 느낌이 없어요😆\n\n\n크게 3가지가 정말 만족스러웠는데요🤭\n✔️부드러운 제형이라 피부에 자극이 적어요.\n✔️세안 후 속당김이 적어요.\n✔️아침에 사용하기에도 순해서 부담이 없어요.\n\n✨순하고 속당김이 적은 제품을 찾으시는 분들께 추천 드립니다!!✨","zh-CN":"我几乎每天都化妆，所以每天都要用清洁产品……！用过很多种清洁产品但一直没定妆，每次都买不同的产品用，偶然接触到NOMADIA的产品试用了一下😆\n\n首先我是水油皮肤质……唇眼卸妆液或油类质地我不太常用，因为感觉太油腻沉重，反而更不清爽🥲所以一直常用清洁力强的洁面泡沫……结果洗完脸就立刻很紧绷，皮肤变敏感，不赶紧涂基础护肤品的话甚至会觉得刺痛😣\n清洁力强的产品早上用起来也有点负担😖\n\n后来接触到了敏感肌用也刺激少、还有舒缓效果的「蓝色舒缓泛醇1%洁面乳」+「金色荷荷巴10%双重微气泡洁面」组合‼️\n\n✨蓝色舒缓泛醇1%洁面乳✨\n质地真的很柔软，眼睛也没有刺激！！用水洗掉之后也没有滑腻不适的感觉😆\n\n\n有三点让我特别满意🤭\n✔️质地柔软，皮肤刺激少。\n✔️洗后紧绷感少。\n✔️早上用也很温和，没有负担。\n\n✨推荐给正在找温和、洗后不紧绷产品的人！！✨"},images:["thumbnail/reviews/milk/ADwbaO2q_1.jpg"],video:null},
    {id:"A6gQMEgJ",rating:4,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지 민감 트러블, 턱 주변 트러블에도 자극 없이 사용","zh-CN":"水油皮敏感痘痘肌，下巴周围长痘也能无刺激使用"},date:"2026-06-06",
      quote:{ko:"수부지 민감성 트러블 피부가 남기는 리뷰입니다❤\n\n💧 사용감 & 텍스처\n부드러운 로션 같은 밀크 제형이라 피부에 자극 없이 롤링돼요. 진한 메이크업을 하는 편은 아니라서 선크림이나 가벼운 베이스 정도는 무리 없이 지워졌고, 세안 후에도 피부가 당기지 않아 좋았어요. 특히 건조한 날 사용하면 세안 후에도 촉촉함이 남아있는 느낌이라 만족스러웠습니다.\n\n📌 순한 세정력 & 피부 진정\n요즘 날씨가 더워져서 그런지 턱 주변에 트러블이 자주 올라와 고민이 많았는데, 이런 시기에는 세정 제품도 최대한 순한 걸 찾게 되더라구요. 이 제품은 사용하면서 자극받거나 붉어지는 느낌 없이 편안하게 사용할 수 있었어요. 아직 트러블이 눈에 띄게 줄었다고 말하기는 어렵지만, 피부 컨디션을 무너뜨리지 않는 순한 클렌저라는 점은 확실히 느껴졌습니다.\n\n세안 후 당김이 적고 촉촉함 유지\n부드러운 밀크 제형으로 자극 없이 사용 가능\n예민해진 피부에도 부담 없는 사용감","zh-CN":"这是水油皮敏感痘痘肌留下的测评❤\n\n💧 使用感&质地\n像乳液一样柔软的洁面乳质地，在皮肤上打圈无刺激。我不太化浓妆，防晒或轻底妆程度都能轻松卸掉，洗后皮肤也不紧绷，很喜欢。特别是干燥的日子用，洗后依然有水润感留存，很满意。\n\n📌 温和清洁力&皮肤舒缓\n最近天气变热，下巴周围经常长痘很烦恼，这种时期也会尽量找最温和的清洁产品。用这款的时候没有刺激或泛红的感觉，用起来很舒适。虽然还不能说痘痘明显减少了，但确实能感受到这是一款不会破坏皮肤状态的温和洁面产品。\n\n洗后紧绷感少、维持水润\n柔软的洁面乳质地，可无刺激使用\n对敏感期的皮肤也没有负担的使用感"},images:[],video:null},
    {id:"ZOzPp8NJ",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"미세먼지로 붉어지고 예민해진 피부에도 따가움 없음, 아이와 함께 사용","zh-CN":"因雾霾泛红变敏感的皮肤也无刺痛感，可与孩子一起使用"},date:"2026-06-15",
      quote:{ko:"일주일 넘게 매일 저녁 세안할 때 쓰고 있어요! 일단 제형이 너무 묽지도 꾸덕하지도 않은 부드러운 밀크 타입이라 피부에 올렸을 때 롤링이 정말 잘 돼요. 이름에 '블루 진정'이랑 '판테놀'이 들어가서 기대를 많이 했는데, 요즘 미세먼지 때문에 붉어지고 예민해진 피부에 올려도 따가움이나 자극이 전혀 없어서 신기했어요.\n 가장 마음에 든 건 세안 후 마무리감이에요. 클렌징 오일은 너무 무겁고, 폼은 세안 후에 쩍쩍 갈라지듯 건조했는데, 이 제품은 물세안만 가볍게 해줘도 미끈거림 없이 촉촉하게 마무리돼요. 속당김 심하신 분들이 쓰시면 진짜 만족할 것 같아요. 향도 인위적인 향료 느낌이 아니라 거의 무향에 가까워서 호불호 없이 편안하게 쓰기 좋습니다. 아이와 함께 쓰기에도 좋은 제품같아요!","zh-CN":"已经连续一周多每天晚上洁面时都在用！首先质地不稀也不厚，是柔软的洁面乳类型，涂在脸上真的很好打圈。名字里有'蓝色舒缓'和'泛醇'，本来期待很高，结果最近因雾霾泛红变敏感的皮肤涂上去也完全没有刺痛或刺激，觉得很神奇。\n 最喜欢的是洗后的收尾感。卸妆油太厚重，洁面泡沫洗完又干燥得像要裂开，但这款只需简单水洗就能不滑腻地水润收尾。内干严重的人用了应该会很满意。香味也不是人工香料的感觉，几乎接近无香，用起来没有明显好恶，很舒适。感觉也适合和孩子一起用！"},images:[],video:null},
    {id:"ZN6PdLaZ",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"수부지, 세정 후에도 피지 과다 분비 없이 밸런스 유지","zh-CN":"水油皮，清洁后也不会皮脂过度分泌，维持平衡"},date:"2026-06-15",
      quote:{ko:"민감한 피부라 클렌징 제품 하나 고를 때도 신중한 편인데, 노마디아 블루 진정 판테놀은 사용하면서 정말 자극이 없어서 만족스러웠어요. 피부에 롤링할 때도 부드럽게 발리고, 세안 후에도 당기거나 따갑다는 느낌이 전혀 없어서 민감한 날에도 부담 없이 사용할 수 있었습니다.!!!\n \n\n 세정력도 생각보다 정말 괜찮았어요. 순한 제품들은 메이크업이 잘 안 지워지는 경우가 많은데, 이 제품은 깔끔하게 세정되면서도 피부를 자극하지 않는 점이 마음에 들었습니다. 특히 저처럼 수부지 피부는 클렌징 오일보다는 클렌징 밀크가 더 잘 맞는 경우가 많은데, 이 제품은 세정 후에도 피지가 분출돠자않고 촉톡하게 피부 밸런스를 잘 유지해줘서 수부지인 저에게는 정말 잘 맞았어요. 수부지 피부라면 짱 추천합니다!!👍👍\n \n\n 무엇보다 가장 마음에 들었던 건 세안 후 피부 컨디션이었어요. 보통 클렌징을 하고 나면 피부가 금방 건조해지거나 당기는 느낌이 드는데, 이 제품은 세안을 마치고 나면 피부에 수분감이 남아 있는 듯 촉촉하고 편안했어요. 이름처럼 진정되는 느낌도 들어서 피부가 예민한 날이나 붉은기가 올라온 날에도 부담 없이 사용할 수 있었습니다.\n \n\n 전체적으로 순한 사용감, 만족스러운 세정력, 세안 후 촉촉하고 편안한 마무리감까지 모두 갖춘 제품이라, 특히 민감성 피부나 수부지 피부인 분들에게 추천함니당~~","zh-CN":"我是敏感肌，选清洁产品也比较慎重，NOMADIA蓝色舒缓泛醇用起来真的没有刺激，很满意。在脸上打圈时也能顺滑抹开，洗后完全没有紧绷或刺痛的感觉，敏感的日子用起来也没有负担。!!!\n \n\n 清洁力也比想象中好很多。温和的产品经常卸不干净妆，但这款既能干净清洁又不会刺激皮肤，这点很喜欢。特别像我这种水油皮，比起卸妆油更适合洁面乳，这款洗后皮脂也不会过度分泌，能水润地维持皮肤平衡，对我这种水油皮真的很合适。水油皮的话超推荐!!👍👍\n \n\n 最喜欢的还是洗后的皮肤状态。一般洁面之后皮肤很快就会干燥或紧绷，但这款洗完之后皮肤水润又舒适，感觉水分还留在皮肤里。像名字一样也有种被舒缓的感觉，皮肤敏感或泛红的日子用起来也没有负担。\n \n\n 整体来说是兼具温和使用感、令人满意的清洁力、洗后水润舒适收尾感的产品，特别推荐给敏感肌或水油皮的朋友们~~"},images:[],video:null},
    {id:"qb2mELjq",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지 여드름성, 진한 메이크업 세정력 직접 테스트(사진)","zh-CN":"水油皮痘痘肌，浓妆清洁力实测（附照片）"},date:"2026-06-05",
      quote:{ko:"클렌징 폼을 제외한 클렌징 제품은 클렌징 오일만 계속 사용하고 있었는데 좋은 기회로 드디어 클렌징 밀크를 사용해 봤네요!\n \n\n 피부 타입 : 수부지, 여드름성, 21N\n \n\n 📍제형\n - 묽은 생크림 같은 느낌이에요\n \n\n 📍세정력\n - 클렌징 워터랑 비슷하거나 좀 더 약한 정도의 세정력이에요! 선크림이나 비비 같은 베이스 제품들이 겉으로 보기에는 다 지워졌나 싶었었는데 자세히 보니까 떡진 것 같은 형태로 아직 남아있었어요\n \n\n - 테스트 결과(사진) : 1차로 리무버 사용 필수!\n \n\n [지우기 전 -> 클렌징 밀크 -> 물 추가 -> 씻어낸 후]\n \n\n *사진 속 화장품(순서대로) : 브로우카라, 마스카라, 글로우 틴트, 커버 비비, 파운데이션, 컨실러 펜슬, 팟 컨실러, 리퀴드 블러셔\n \n\n 📍저자극&진정\n - 롤링을 하는 제품이라 아예 자극이 없을 수는 없지만 일단 제형 자체가 부드러워서 얼굴이 불긋불긋 되는 건 전혀 없어요! 그리고 사용하는 동안 트러블도 없었어요!\n \n\n 📍피부결\n - 설명을 보면 딱히 각질 제거 같은 기능성은 없는 것 같은데 특별히 다른 제품 없이 단독으로만 사용해도 결이 매끈매끈해지고 부드러워진 느낌이에요\n \n\n 📍마무리감&당김\n - 단독 세안만 해도 될 정도로 뽀득뽀득해요 근데 신기하게 세안 직후에 바로 스킨케어를 안 해도 당김이 전혀 없어서 피부가 편안한 느낌이에요\n \n\n 클렌징 밀크는 처음 사용해 봤는데 되게 순하고 사용감이 좋아요 기대 이상으로 좋네요!","zh-CN":"除了洁面泡沫之外，我一直只用卸妆油，这次借着好机会终于用上了洁面乳！\n \n\n 肤质：水油皮、痘痘肌、21岁女性\n \n\n 📍质地\n - 感觉像稀释的鲜奶油\n \n\n 📍清洁力\n - 清洁力和卸妆水差不多或稍弱一点！防晒或BB这类底妆产品表面看起来是卸干净了，但仔细看还是有一点像结块一样的残留\n \n\n - 测试结果（照片）：必须先用卸妆液做第一步！\n \n\n [卸妆前 -> 洁面乳 -> 加水 -> 洗净后]\n \n\n *照片里的化妆品（按顺序）：眉毛染膏、睫毛膏、发光唇釉、遮瑕BB、粉底液、遮瑕笔、盒装遮瑕、液体腮红\n \n\n 📍低刺激&舒缓\n - 是需要打圈的产品，完全没有刺激不太可能，但质地本身很柔软，脸完全不会红一块紫一块的！使用期间也没长痘！\n \n\n 📍肤质纹理\n - 看说明好像没有特别的去角质之类的功能性，但单独使用不搭配其他产品也感觉纹理变细腻柔软了\n \n\n 📍收尾感&紧绷\n - 单独清洁就足够干净了，神奇的是洗完立刻不做后续护肤也完全不紧绷，皮肤很舒适\n \n\n 第一次用洁面乳，感觉真的很温和使用感也很好，比预期更好！"},images:[],video:null},
    {id:"AE7VkEkZ",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"패키지·성분·사용감 종합 리뷰, 사계절 자극받은 피부 진정","zh-CN":"包装·成分·使用感综合测评，四季受刺激的皮肤得到舒缓"},date:"2026-05-30",
      quote:{ko:"1. 첫인상\n일단 패키지부터 취향 저격! 이름에 '블루'가 들어가서 그런지 되게 깔끔하고 청량한 느낌이 들어요. 욕실에 그냥 툭 올려두기만 해도 감성 가득해서 인테리어 소품 같은 느낌? 게다가 위생적이고 양 조절하기 편한 펌핑형 용기라서 첫인상부터 완전 합격점 줬어요. 묵직한 제형이 투명하게 비치는 것도 예쁘더라고요~\n2. 성분 효과\n성분을 보니까 왜 다들 극찬하는지 알겠더라고요. 피부 장벽 하면 생각나는 '판테놀'이 무려 1%나 유효 함량으로 제대로 들어가 있어요. 세안하면서부터 피부 장벽을 보호해 주는 느낌! 여기에 붉은 기나 예민해진 피부를 토닥여주는 블루 진정 성분(구아이아줄렌 같은 성분들!)이 같이 들어있어서, 사계절 내내 외부 자극에 지친 피부를 편안하게 달래주기 딱 좋은 스펙이에요\n3. 사용감\n진짜 대박인 건 이 부드러운 롤링감이에요. 피부에 올렸을 때 뻑뻑한 느낌 전혀 없이 부드러운 로션처럼 사르르 펴 발라져요. 손가락이랑 얼굴 피부 사이에 완충 지대를 만들어주는 느낌이라 자극이 1도 없더라고요.\n물 닿으면 하얗게 변하는 유화 과정도 되게 산뜻해요. 간혹 클렌징 밀크 쓰고 나면 미끈거리거나 오일막이 남은 것처럼 답답한 제품들이 있잖아요? 근데 이건 그런 잔여감 없이, 물로 헹구고 나면 딱 수분 크림 바른 것처럼 촉촉하고 산뜻하게 마무리돼서 감탄했어요!!!\n4. 향\n화장품 살 때 향 중요하게 생각하시는 분들 많으시죠? 이건 인위적이고 독한 인공 향료 느낌이 아니라, 세안하면서 마음이 편안해지는 은은하고 자연스러운 향이 나요. 호불호 크게 갈리지 않을 싱그럽고 차분한 향조라, 하루 일과 끝내고 밤에 세안할 때 은근히 테라피 받는 것처럼 힐링 되는 기분이에요.\n5. 장점\n 속당김 없는 극강의 촉촉함: 건성이나 수부지 분들 세안하고 나면 얼굴 찢어질 거 같은 그 느낌 아시죠? 이건 수분 공급이랑 클렌징이 동시에 되는 기분이라 세안 후 당김이 진짜 없어요.ㅋ","zh-CN":"1. 第一印象\n首先包装就正中我的喜好！可能因为名字里有'蓝色'，感觉很干净清爽。就算随手放在浴室里也很有感觉，像个装饰品？而且是卫生又方便控制用量的泵头包装，第一印象就直接满分。厚重的质地隐约透出来也很好看~\n2. 成分功效\n看了成分就明白为什么大家都夸不停了。说起皮肤屏障就会想到的'泛醇'，有效含量竟然高达1%，实打实地加进去了。感觉从洁面这一步就在保护皮肤屏障！还搭配了能安抚泛红或敏感皮肤的蓝色舒缓成分（比如蓝甘菊薁之类的成分！），配方规格很适合一年四季安抚被外界刺激折腾的皮肤\n3. 使用感\n真正惊艳的是这种柔软的打圈感。涂在脸上完全没有干涩感，像柔软的乳液一样丝滑地抹开。感觉手指和脸部皮肤之间形成了一层缓冲，完全没有刺激。\n遇水变白的乳化过程也很清爽。有些洁面乳用完会滑腻或留下一层油膜让人觉得闷，但这款没有那种残留感，用水冲洗后就像涂了保湿霜一样水润清爽地收尾，让人惊叹!!!\n4. 香味\n买化妆品很看重香味的人不少吧？这款不是人工浓香的感觉，而是洗脸时让人心情放松的淡雅自然香味。是不太会有明显好恶的清新沉静香调，结束一天的工作在夜里洁面时，莫名有种被疗愈的感觉。\n5. 优点\n 不紧绷的极致水润感：干皮或水油皮的朋友洗完脸后那种脸要裂开的感觉，都懂吧？这款感觉是补水和清洁同时进行，洗后真的不紧绷。ㅋ"},images:[],video:null},
    {id:"A6gD1YaJ",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"뾰루지(트러블) 잦은 피부, 자극 없는 약산성 케어로 추천","zh-CN":"容易长痘（痘痘）的肌肤，推荐做无刺激的弱酸性护理"},date:"2026-06-15",
      quote:{ko:"🧴세정력\n 선크림, 쿠션이나 파운데이션 같은 기본 베이스 메이크업, 피부 노폐물은 자극 없이 깔끔하게 잘 지워집니다. 포인트 메이크업은 리무버 사용 추천해요\n \n\n 🍃향\n 인위적이고 강한 인공 향료의 느낌이 아니라, 민감성 피부도 편안하게 사용할 수 있는 은은하고 마일드한 향이에요.\n \n\n ✨효과\n 세안 후 속당김 없이 보습이 유지됭 피부 장벽이 보호되는 느낌을 받았어요. 촉촉함이 오래 유지가 되더라고요\n \n\n 🤍사용감\n 너무 물처럼 흘러내리지 않고 어느 정도 점도와 무게감이 있는 텍스처예요.\n 물을 묻혔을 때 바로 녹아 사라지지 않고 롤링이 부드럽게 잘 되어 눈가나 코 옆 등 얇고 예민한 부위에도 자극이 거의 없었어요.\n 펌핑 용기도 부드럽게 작동하여 양 조절이 편리해요.\n \n\n 🔥추천 피부 타입\n 세안만 하면 얼굴이 쉽게 붉어지거나 뾰루지(트러블)가 자주 올라와 자극 없는 약산성 케어가 필요한 피부분께 추천\n 세안 후 극심한 속당김을 느끼며, 세안 단계부터 보습과 장벽 보호가 필요한 피부분께 추천","zh-CN":"🧴清洁力\n 防晒、气垫或粉底这类基础底妆、皮肤废物都能无刺激地干净卸除。点妆建议搭配卸妆液使用\n \n\n 🍃香味\n 不是人工浓香的感觉，是敏感肌也能舒适使用的淡雅温和香味。\n \n\n ✨效果\n 洗后没有内干紧绷，能感受到保湿和皮肤屏障被保护的感觉。水润感能维持较久\n \n\n 🤍使用感\n 不是像水一样稀，是有一定粘度和厚重感的质地。\n 沾水后不会立刻化开消失，能顺滑打圈，眼周或鼻翼等薄弱敏感部位也几乎没有刺激。\n 泵头也运作顺畅，方便控制用量。\n \n\n 🔥推荐肤质\n 推荐给一洗脸脸就容易泛红或经常长痘痘、需要无刺激弱酸性护理的肤质\n 推荐给洗后极度内干、从洁面这一步就需要保湿和屏障保护的肤质"},images:[],video:null},
    {id:"AGE1mlXZ",rating:4,skinType:{ko:"중성","zh-CN":"中性"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"중성/민감, 어릴 때 아토피 있던 예민 피부도 트러블 없음","zh-CN":"中性/敏感，小时候有特应性皮炎的敏感肌也不长痘"},date:"2026-06-11",
      quote:{ko:"💓 성분이 매우 순하다.\n어렸을때 아토피가 심했어서 피부가 예민한 편인데 1주일 이상 매일 사용해도 피부 트러블이나 자극이 없었어요 클렌징 제품들은 자극이 많아 항상 신중하게 고르는 편인데 이 제품 마음 놓고 사용할 수 있을 것 같아용\n\n💓 세안 후 당김없이 촉촉함💧\n유명한 클렌징 제품들 사용하면 사용 후 피부가 너무 당길때가 많은데 이 재품은 유화과정에서부터 촉촉함이 느껴지고 2차세안까지 마쳐도 당기지 않아 넘 좋았어요 저도 건성피부라 세안 후 당김이 심한데 이 제품 잘 사용했어요☺️\n\n💓 부드러운 사용감\n제형자체가 너무 부드럽고 촉촉해서 클렌징 하는동안 자극 일도 없고 피부가 편해요! 촉촉한 로션으로 클렌징 하는 기분입니당\n\n🧡총평\n민감하고 건조한 피부에 자극 없이 클렌징 가능한 밀크👍🏻","zh-CN":"💓 成分非常温和。\n小时候特应性皮炎很严重，皮肤比较敏感，连续一周以上每天使用也没有出现皮肤问题或刺激，清洁产品刺激性大，我一直都很慎重挑选，这款用起来应该可以放心。\n\n💓 洗后不紧绷、很水润💧\n用一些知名洁面产品后皮肤经常很紧绷，但这款从乳化过程就能感觉到水润感，做完二次清洁也不紧绷，真的很喜欢。我也是干皮，洗后紧绷感严重，这款用起来很不错☺️\n\n💓 柔软的使用感\n质地本身非常柔软水润，清洁过程中没有任何刺激，皮肤很舒适！有种用水润乳液清洁的感觉。\n\n🧡总评\n适合敏感干燥肌肤无刺激清洁的洁面乳👍🏻"},images:[],video:null},
    {id:"ZX1jeG5q",rating:5,skinType:{ko:"중성","zh-CN":"中性"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"중성, 장벽 약한 날·아침 세안용으로 적합","zh-CN":"中性，适合屏障较弱的日子·早晨洁面使用"},date:"2026-06-05",
      quote:{ko:"전체적으로 굉장히 순한 느낌의 클렌징 밀크였어요. 이름처럼 판테놀 성분 때문인지 세안하면서도 피부가 편안한 느낌이 들었고, 클렌징 후에도 얼굴이 쉽게 당기지 않아서 만족스러웠어요.\n \n\n 제형은 부드러운 로션 같은 밀크 타입이라 피부에 자극 없이 롤링하기 좋았어요. 특히 피부 컨디션이 예민한 날이나, 장벽이 약해졌을 때 사용하기 부담이 덜했어요. 세정 후에 뽀득하게 마무리되는 스타일은 아니고, 촉촉함이 살짝 남는 타입이라 건조한 피부에는 꽤 잘 맞을 것 같다는 생각이 들었어요.\n \n\n 아침 세안용으로 사용했을 때 특히 만족도가 높았어요. 밤사이 올라온 유분이나 가벼운 노폐물을 부드럽게 정리해주는 느낌이라 피부 부담이 적었고, 세안 후 바로 피부가 붉어지거나 당기는 느낌이 적어서 좋았어요.\n \n\n 또 진정 라인 제품답게 사용하면서 자극감이나 화끈거림이 거의 없었고, 향도 강하지 않아서 예민한 피부가 사용하기 괜찮은 제품이라는 인상이었어요.\n \n\n ✔️ 피부 장벽 약한 분\n ✔️ 세안 후 당김 심한 분\n ✔️ 자극 적은 클렌징 찾는 분\n ✔️ 아침 세안용 제품 찾는 분들께 잘 맞을 것 같아요.","zh-CN":"整体是使用感非常温和的洁面乳。可能因为像名字一样含有泛醇成分，洗脸的同时皮肤也感觉很舒适，清洁后脸也不容易紧绷，很满意。\n \n\n 质地是柔软的乳液型洁面乳，能无刺激地在皮肤上打圈，很好用。特别是皮肤状态敏感的日子，或屏障变弱的时候用起来负担较小。清洁后不是那种洗到吱吱作响的干净感，而是留有一点水润，感觉对干燥肌肤挺合适的。\n \n\n 早上洁面用满意度特别高。感觉能温和整理夜间产生的油分和轻微废物，皮肤负担较小，洗后也不容易马上泛红或紧绷，很喜欢。\n \n\n 而且不愧是舒缓系列产品，使用时几乎没有刺激感或灼热感，香味也不浓，给人的印象是敏感肌也能放心使用的产品。\n \n\n ✔️ 皮肤屏障较弱的人\n ✔️ 洗后严重紧绷的人\n ✔️ 想找刺激少的洁面产品的人\n ✔️ 想找早晨洁面用产品的人，应该都很适合。"},images:[],video:null},
    {id:"qb2B9xVq",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"극건성+요철 고민, 오일 대비 유수분 밸런스·요철 개선 체감","zh-CN":"极干皮+皮肤凹凸不平困扰，相比油类感受到水油平衡、凹凸改善"},date:"2026-05-30",
      quote:{ko:"🩷 피부타입: 여름에도 건조한 극건성 타입이고 민감한편은 아니예요. 모공은 잔잔하게 있지만 큰 모공이 많이 있지는 않아요. 유수분 밸러스가 안좋은편이라 요철은 있어요\n\n🩷사용기간: 26.05 봄-초여름 사용했어요 \n\n🩷사용간격: 저녁세안으로 하루에 1번 사용했어요\n\n🩷향기: 향료가 따로 첨가되어있지는 않은 것 같아요. 무향에 가깝습니다 \n\n🩷제형: 평소에 클렌징 오일을 써서 그런가 오일에 비해서 확실히 덜 오일리하고 부드러워요. 물조금 뭍히면 롤링도 잘되고 크게 미끌거리지 않아서 좋아요\n\n🩷용기:하늘색 플라스틱 용기에 담겨있고 펌프를 누르면 적당량이 나와요. 디자인적으로 용기가 이뻐서 좋아요\n\n🩷성분: 우선 20가지 유해 성분 모두다 없습니다! 화장품 선정할때 자극 없는 성분을 유심히 체크하는 편인데 그 점이 참 좋았어요. 자극 전혀없이 무난해요. 그리고 보습에 도움되는 글리세린, 스쿠알란,피부장벽 개선에 좋은 판테놀, 콜레스테롤, 알라토닌 등 여러좋은 성분이 들어가 있어서 믿음이 가네요\n\n🩷효능&보습력: 순한 클렌징 밀크라서 데일리로 사용하기에 확실히 부담없구요, 저는 아이리무버로 눈화장은 따로지워서 눈화장은 잘 모르겠으나 피부쪽은 오일이랑 비교했을때 세정력이 특별히 약하지 않아요. 오일사용할때보다 더 피부 요철도 줄어들고 유수분 밸런스도 잡히는것 같아서 좋아요. \n\n🩷총평: 2차 세안 하기전에, 이거만 했을때 미끌거리거나 오일리하거나 하지 않아서 마음에 들어요. 좋은제품 같은데 브랜드도 더 유명해지면 좋겠어요!!","zh-CN":"🩷 肤质：夏天也干燥的极干性肌肤，不算特别敏感。有细小毛孔但不算特别多大毛孔。水油平衡不太好，有点皮肤凹凸不平\n\n🩷使用时间：2026年5月春季到初夏用的\n\n🩷使用频率：晚上洁面时每天用一次\n\n🩷香味：好像没有额外添加香料。接近无香\n\n🩷质地：平时用卸妆油，对比之下这款明显不那么油腻，更柔软。沾点水打圈也很顺滑，不会太滑腻，很喜欢\n\n🩷包装：装在天蓝色塑料瓶里，按压泵头会挤出适量。设计上瓶子很好看，这点也喜欢\n\n🩷成分：首先20种有害成分全都不含！挑化妆品时我比较在意有没有刺激成分，这点很好。完全没有刺激，很稳妥。而且含有帮助保湿的甘油、角鲨烷，对皮肤屏障改善有好处的泛醇、胆固醇、尿囊素等多种好成分，很让人信任\n\n🩷功效&保湿力：是很温和的洁面乳，日常使用确实没有负担，我眼妆是用眼部卸妆液另外卸的所以不清楚眼妆效果如何，但脸部清洁力和油类相比并不算特别弱。比用油类的时候皮肤凹凸感也变少了，水油平衡感觉也更好，很喜欢。\n\n🩷总评：在做二次清洁之前，光用这个也不会滑腻或油腻，这点很喜欢。感觉是个好产品，希望品牌能更出名一些！！"},images:[],video:null},
    {id:"J873pBNA",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"건성+기미·잡티·홍조 고민, 오일 사용시 뿌예지던 눈이 밀크는 안 그럼","zh-CN":"干皮+色斑·瑕疵·泛红困扰，用油类眼前会模糊而洁面乳不会"},date:"2026-06-05",
      quote:{ko:"➖ 피부타입 : 건성\n ➖ 피부고민 : 기미, 잡티, 홍조\n \n\n 💦 세정력\n - 제형이 흐르기보다 꾸덕한 제형이라 피부 깊숙이 찐득하니 붙어 세정되는 느낌이었습니다. 사용법에 적혀있는대로 물 묻지 않은 얼굴에 롤링후 물을 조금 섞어 다시 롤링하고 세안해주면 자연스레 2차 세안이 되는 과정이라 좋았습니다. 평소에 선크림, 쿠션 정도만 하고 색조는 블러셔, 입술만 발라서 진한 화장에 세정력이 어떠한지는 모르겠습니다만 제가 하는 정도의 화장은 말끔히 지워졌습니다!\n \n\n 🙌 수분•촉촉함\n - 건성이라 세정력이 너무 강한 클렌저를 사용하면 세안후 피부가 굉장히 당기거든요. 그런데 이 제품은 전혀. 정말 전혀. 그렇지 않았어요. 솔직히 수분감 있다는 클렌징폼 몇 개 사용해봤는데 클렌징폼에 들어가는 성분때문인지, 극건성때문인지 당기는 느낌은 계속 있었거든요. 그런데 클렌징밀크라 그런지 전혀 당김이 없어서 놀랐어요! 클렌징오일은 사용하다가 뚜껑에 묻어 만질 때마다 미끌거리고 눈앞이 뿌옇게 되는데 클렌징밀크 정말 신세계네요!\n \n\n 💥자극\n - 자극 1도 없습니다. 특히 클렌징 오일을 사용할 때 늘 눈앞이 뿌얘지는데 노마디아 블루 진정 판테놀 1% 클렌징밀크는 전혀 그렇지 않았습니다. 그리고 제품 자체에 판테놀이 함유되어있어 조금 더 신뢰가 가긴 하더라고요.\n \n\n ✔📝 총평\n - 클렌징 밀크는 처음 사용해보는데 클렌징 오일의 단점은 보완하고 클렌징폼의 장점은 갖고 온 정말 좋은 제품이었어요! 클렌징폼을 사용할 때 느껴지는 뻑뻑함은 없고 클렌징 오일을 사용할 때 느껴지는 미끌거림 없이 딱 그 중간입니다. 저도 이 제품으로 클렌징밀크를 입문했는데 클렌징밀크 입문용 제품으로도 딱인 듯싶습니다. 용량도 크고 재사용 의사 100%였습니다.","zh-CN":"➖ 肤质：干性\n ➖ 肤质困扰：色斑、瑕疵、泛红\n \n\n 💦 清洁力\n - 质地不是流动型而是厚实型，感觉能深入皮肤紧密附着地清洁。按照使用方法在干燥的脸上打圈后加点水再打圈冲洗，自然而然就完成了二次清洁的过程，这点很喜欢。我平时只涂防晒、气垫，彩妆也只用腮红和口红，不清楚浓妆的清洁力如何，但我这种程度的妆容能干净卸掉！\n \n\n 🙌 水分•水润感\n - 干皮如果用清洁力太强的洁面产品，洗完脸皮肤会非常紧绷。但这款完全没有，真的完全没有。老实说我用过几款号称保湿的洁面泡沫，可能是里面的成分问题，或者是我极干皮的原因，一直都会有紧绷感。但这款是洁面乳，完全不紧绷，让我很惊讶！用卸妆油的时候瓶盖上沾了油每次碰到都滑腻，眼前还会变模糊，用了洁面乳真是打开了新世界！\n \n\n 💥刺激\n - 完全没有刺激。特别是用卸妆油的时候眼前总是会变模糊，NOMADIA蓝色舒缓泛醇1%洁面乳完全没有这种情况。而且产品本身含有泛醇，让人更加信任。\n \n\n ✔📝 总评\n - 第一次用洁面乳，是补足了卸妆油的缺点、又兼具洁面泡沫优点的真正好产品！没有洁面泡沫那种干涩感，也没有卸妆油那种滑腻感，正好是二者的中间。我也是靠这款入门了洁面乳，作为洁面乳的入门产品也很合适。容量也大，百分百会回购。"},images:[],video:null},
    {id:"A11QjYjA",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"클렌징밀크 첫 사용, 모낭염·트러블 잦은 피부 장벽보호 체감(사진)","zh-CN":"第一次用洁面乳，毛囊炎·痘痘频发的皮肤也感受到屏障保护（附照片）"},date:"2026-06-05",
      quote:{ko:"처음으로 클렌징밀크 사용해봐요\n 클렌징오일과 밤 사용하면서, 민감성은 클렌징밀크가 좋다고 해서, 바꾸려고 제품 고르던 중 이 제품을 써보았는데 대만족이었어요!!\n \n\n 요약 : 세정력 좋음, 촉촉한 마무리(수부지 추천), 자극없음,사용감 좋음, 장벽보호\n \n\n 1. 세정력 좋음, 촉촉한 마무리로 수부지에게 추천!\n \n\n (프라이머, 선크림+비비, 파우더, 아이라이너, 속눈썹블랙영양제 기준)\n 제가 평소에 하는 화장은 위에 써놓은 정도인데요. 막 워터프루프 제품을 쓰는 건 아니라, 가벼운 메이크업인 것 같아요. \n 2차세안없이 단독사용해도될 것 같은 정도로 말끔하게 세정돼요. 저는 코, 턱 등 피지 분비 많은 부위만 2차 세안해주었어요.\n \n\n 마무리감도 촉촉하게 보들해져서 좋아요! 당김 없음!! 수부지 피부에 추천합니다!\n \n\n \n\n 2. 자극없고, 사용감 좋아요.  \n \n\n 사진 첨부했는데, 미끌거리다가 물기마르면 약간 끈떡해지며 발리는데, 한번 펌핑 양으로 골고루 잘 발리고, 유화도 잘 되어서 진짜 미끌하게 자극없이 세정돼요.\n \n\n \n\n 3. 장벽보호 굿굿!!\n \n\n 잘 붉어지고 모낭염, 트러블도 잘 생기는 피부인데, 이중세안했을때도 붉어짐도 없고 자극없이 민감해지지 않았어요! \n 또 제품 처음받아서 썼을땐, 이마, 턱이 모낭염과 트러블로 난리가 난 상태였는데(턱에 흔적 남은거 보이시죠ㅜㅜ), \n 클렌징밀크쓰면서 피부컨디션도 되게 좋아졌어요! \n 과한 클렌징으로 피부 상할 수 있었는데, 이 클렌징밀크로 장벽보호가 되게 잘 된거 아닐까요?\n \n\n \n\n 너무 만족해서 앞으로도 클렌징밀크 쓸 것 같아요!!","zh-CN":"第一次用洁面乳\n 一直用卸妆油和卸妆膏，听说敏感肌适合洁面乳，正在挑选想换的产品时用了这款，非常满意!!\n \n\n 总结：清洁力好、收尾水润（推荐水油皮）、无刺激、使用感好、保护屏障\n \n\n 1. 清洁力好，水润收尾，推荐水油皮使用！\n \n\n （以妆前乳、防晒+BB、散粉、眼线笔、睫毛增长营养液为基准）\n 我平时化的妆大概就是上面这些程度，没有用防水产品，应该算轻妆。\n 不做二次清洁单独使用也能干净卸妆。我只对鼻子、下巴等皮脂分泌多的部位做了二次清洁。\n \n\n 收尾感也水润柔滑，很喜欢！完全不紧绷!!推荐给水油皮！\n \n\n \n\n 2. 无刺激，使用感好。 \n \n\n 附了照片，滑腻感在水分变干后会变得有点粘稠地涂开，一泵的量就能均匀涂满全脸，乳化也很顺畅，真的能滑滑地无刺激清洁。\n \n\n \n\n 3. 屏障保护，好评!!\n \n\n 我皮肤容易泛红，也容易长毛囊炎和痘痘，即使做了双重清洁也没有泛红，没有刺激也没有变敏感！\n 而且刚拿到产品开始用的时候，额头、下巴正因为毛囊炎和痘痘闹得很凶（下巴上的痕迹应该能看到吧呜呜），\n 用了洁面乳之后皮肤状态也变好了很多！\n 过度清洁本来可能会伤害皮肤，是不是这款洁面乳把屏障保护得特别好呢？\n \n\n 太满意了，以后应该会一直用洁面乳！！"},images:[],video:null},
