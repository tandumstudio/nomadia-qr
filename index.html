\n\nI'd recommend this to anyone wanting a cleansing foam\nthat has soothing ingredients and doesn't leave tightness after washing. ㅎㅎ","zh-CN":"我是T区油、U区干的\n典型水油皮。🥲\n\n因为经常化耐皮脂的防水妆，\n用清洁力强的清洁产品之后，\n内干导致紧绷感反而更严重……\n一直陷在这种恶性循环里。ㅜㅜ\n\n所以\n挑清洁产品时我更喜欢那种\n能清理多余皮脂、洗后又不紧绷水润的产品！\n\n金色荷荷巴10%双重微气泡洁面\n用了对皮肤友好、不堵塞毛孔的荷荷巴籽油，\n和与皮肤屏障结构类似的神经酰胺成分，\n把毛孔里的皮脂、角质和残妆都清洁干净，\n同时把干燥和刺激降到最低的气泡洁面泡沫，\n对我这种水油皮真的很合适🤭✨️\n\n一按就能出细密的微气泡，\n对早晨忙碌的上班族来说，\n连搓泡沫的那点时间都能省下来，是个宝藏单品！\n(●'◡'●)\n\n特别是最近天热的时候，\n出汗多、皮脂也爆发ㅋ;;\n防晒和废物混在一起，\n下班时皮肤已经乱糟糟的，\n这款成分温和、能清爽收尾，很喜欢~！\n\n推荐给想要洗后不紧绷、又含舒缓成分的洁面泡沫的朋友们。ㅎㅎ","zh-TW":"我是T字偏油、U字偏乾的典型外油內乾肌。🥲\n\n因為常常畫抗皮脂的防水妝，用完潔淨力強的卸妝產品之後，\n因為內在乾燥導致緊繃感更嚴重……\n一直陷入反覆的惡性循環中。ㅜㅜ\n\n所以\n挑潔顏產品時我偏好能照顧過多皮脂、\n同時洗完臉後不緊繃、水潤的產品！\n\n金盞荷荷芭10%雙重微氣泡潔顏乳\n用親膚又不阻塞毛孔的荷荷芭籽油\n和結構與皮膚屏障相似的神經醯胺成分，\n把毛孔裡的皮脂、角質和彩妝殘留都洗得乾乾淨淨，\n同時把乾燥或刺激降到最低的氣泡潔顏乳，\n對我這種外油內乾肌真的太合適了 🤭✨️\n\n一按壓就會出現顆粒細緻的微氣泡，\n對一早忙碌的上班族來說，\n連搓揉起泡的短短時間都能省下來，是個寶藏單品！\n(●'◡'●)\n\n特別是像最近這麼熱的天氣，\n流很多汗、皮脂也爆發ㅋ;;\n防曬乳和老廢物混在一起，\n下班時皮膚常常一團亂，\n這款能用溫和成分清爽收尾，\n讓我很滿意~!\n\n推薦給洗完臉不緊繃、\n又想要含舒緩成分的潔顏乳的人。ㅎㅎ",ja:"私はTゾーンは油分が多く、Uゾーンは乾燥している\n典型的なインナードライ肌です。🥲\n\n皮脂に強いウォータープルーフメイクを主にするので、\n洗浄力の良いクレンジング製品を使うと\nインナードライのせいでつっぱりがさらにひどくなる…\n繰り返される悪循環を経験している一人です。涙\n\nなので\nクレンジング製品を選ぶとき過剰な皮脂はケアしながら\n洗顔後もつっぱらずしっとりする製品を好む方です！\n\nゴールデンホホバ10%デュアルマイクロバブルクレンザーは\n肌に優しく毛穴を詰まらせないホホバ種子油と\n肌バリアと似た構造のセラミド成分が\n毛穴の中の皮脂、角質、メイクの残留物まで\nすっきり洗い流してくれながら\n乾燥や刺激を最小限にしたバブル洗顔フォームなので\n私のようなインナードライ肌にとても良かったです🤭✨️\n\n押すと密な粒子の微細な泡がすぐ出てくるので\n朝から慌ただしく忙しい会社員には\nこすって泡立てる短い時間さえ節約してくれる神アイテム！\n(●'◡'●)\n\n特に最近のように暑い日は\n汗もたくさんかいて皮脂も爆発するし(笑)\n日焼け止めと老廃物が混ざり合って\n仕事終わりには肌がぐちゃぐちゃになりますが\nマイルドな成分でさっぱり仕上げられる製品なので\n気に入りました〜！ \n\n洗顔後もつっぱらず鎮静成分が含まれた \n洗顔フォームを求めている方におすすめします。笑",th:"ฉันเป็นผิวมันขาดน้ำแบบทั่วไปที่ T-zone มันมาก\nแต่ U-zone แห้ง 🥲\n\nปกติแต่งหน้าแบบวอเตอร์พรูฟที่ทนต่อไขมันมาก\nพอใช้ผลิตภัณฑ์คลีนซิ่งที่แรงทำความสะอาดดีแล้ว\nจะยิ่งตึงมากเพราะผิวขาดน้ำ..\nเป็นวงจรที่วนซ้ำแบบนี้มาตลอดค่ะ ㅜㅜ\n\nเลย\nชอบผลิตภัณฑ์คลีนซิ่งที่ดูแลไขมันส่วนเกิน\nแต่หลังล้างหน้าไม่ตึงและยังคงความชุ่มชื้นไว้!\n\nโกลเด้นโฮโฮบา 10% ดูอัลไมโครบับเบิลคลีนเซอร์\nมีน้ำมันเมล็ดโฮโฮบาที่เป็นมิตรกับผิวและไม่อุดตันรูขุมขน\nกับเซราไมด์ที่มีโครงสร้างคล้ายเกราะผิว\nช่วยล้างไขมัน ขุย และคราบเมคอัพในรูขุมขนออกได้หมดจด\nโดยลดความแห้งและการระคายเคืองให้น้อยที่สุด\nเป็นบับเบิลคลีนซิ่งโฟมที่เหมาะกับผิวมันขาดน้ำแบบฉันมากๆ 🤭✨️\n\nกดแล้วฟองละเอียดออกมาทันที\nสำหรับมนุษย์เงินเดือนที่วุ่นวายตั้งแต่เช้า\nช่วยประหยัดเวลาแม้แค่การถูให้เกิดฟองก็ยังช่วยได้!\n(●'◡'●)\n\nโดยเฉพาะช่วงนี้อากาศร้อน\nเหงื่อออกเยอะ ไขมันก็ระเบิดฮ่าๆ;;\nครีมกันแดดกับสิ่งสกปรกผสมกันจนหน้าพังตอนเลิกงาน\nแต่เป็นผลิตภัณฑ์ที่ล้างออกได้สดชื่นด้วยส่วนผสมอ่อนโยน\nชอบมากเลย~! \n\nแนะนำสำหรับคนที่อยากได้โฟมล้างหน้าที่มีส่วนผสมปลอบประโลม\nและไม่ตึงหลังล้างหน้า ฮ่าๆ"},images:[],video:null},
    {id:"A6gQM18J",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"복합성/좁쌀·블랙헤드·두드러기 체질 - 자극적 제품에 두드러기 나는데 이건 안남",en:"Combination, small bumps/blackheads/hives-prone skin - other harsh products give her hives but this one doesn't","zh-CN":"混合肌/闭口·黑头·荨麻疹体质 - 用刺激产品会起荨麻疹，这款不会","zh-TW":"混合性/粉刺‧黑頭‧蕁麻疹體質 - 刺激性產品會長蕁麻疹，這款不會",ja:"混合肌/細かいニキビ・黒ずみ・じんましん体質 - 刺激の強い製品でじんましんが出るがこれは出ない",th:"ผิวผสม/สิวเสี้ยน·หัวสิวอุดตันดำ·เป็นลมพิษง่าย - ผลิตภัณฑ์ที่ระคายเคืองทำให้เป็นลมพิษ แต่ตัวนี้ไม่เป็น"},date:"2026-06-18",
      quote:{ko:"☺️피부타입:복합성/수부지/이마좁쌀/블랙헤드/모공/조금예민한편\n 이 제품 사용해보면서 그동안 쓰던 폼클렌징이 얼마나 자극적인지 느꼈어요.. 진짜 부드럽고 고운 거품이 얼굴을 싸악 감싸주고 모공속까지 자극없이 클렌징 해줘요!!! 너무 만족!!\n  저같은 예민이들 자극적인제품쓰면 코밑이나 인증에 두드러기가 올라오는데 이건 안그렇더라구요.. 넘 만족..\n  세정력은 전 클랜징밀크로 기본 화장지우고 이차세안으로 사용해서 남아있는 잔여물 깔끔하고 개운하게 잘 닦였습니다!\n 아침 저녁 가릴거 없이 이걸로 세안하니가 피부기 맑고 세안후에 피부당김없어 너무 좋아요~~ 진짜 제구매각 쟁여탬 다른거 쓰다가도 다시 생각날거같습니다~~",en:"☺️Skin type: combination/combination-oily/forehead bumps/blackheads/pores/a bit sensitive\nUsing this product, I really felt how irritating the foam cleanser I'd been using was.. The foam is genuinely soft and fine, wrapping the whole face and cleansing deep into pores without irritation!!! So satisfied!!\nFor sensitive people like me, harsh products give me hives under my nose or near my philtrum, but this one didn't do that.. so satisfied..\nAs for cleansing power, I first remove my makeup with the cleansing milk and use this as a second cleanse, and the remaining residue got cleaned off nicely and refreshingly!\nMorning or night, no matter, washing with this leaves my skin clear and no tightness after washing, so good~~ Genuine repurchase, stockpile item, I think I'll come back to this even after trying other things~~","zh-CN":"☺️肤质：混合性/水油皮/额头闭口/黑头/毛孔/偏敏感\n 用了这款产品才感受到之前用的洁面泡沫有多刺激……真的又柔软又细腻的泡沫把整个脸包裹住，连毛孔深处都能无刺激地清洁!!!太满意了!!\n  像我这种敏感体质，用刺激产品鼻下或人中会长荨麻疹，这款完全没有……太满意了……\n 清洁力方面我是先用洁面乳卸基础妆，再用这个做二次清洁，把残留物洗得又干净又清爽！\n 早晚不分都用这个洗脸，皮肤清亮，洗后也不紧绷，特别喜欢~~真的会回购囤货，用其他产品的时候也会想念这款~~","zh-TW":"☺️膚質：混合性/外油內乾/額頭粉刺/黑頭/毛孔/偏敏感\n 用了這款產品之後才發現我以前用的洗面乳有多刺激……真的是柔軟細緻的泡沫把整臉溫柔包覆，連毛孔深處都能無刺激清潔！！！超級滿意！！\n 像我這種敏感體質，用刺激性產品鼻下或人中會長蕁麻疹，這款完全不會……超滿意……\n 潔淨力方面，我是先用卸妝乳卸掉基本妝，二次清潔用這款，剩下的殘留物洗得乾乾淨淨、很清爽！\n 早晚都用這款洗臉，皮膚變得很清透，洗完臉也不緊繃，真的很喜歡~~真心會回購囤貨，就算用別的產品，也會一直想起這款~~",ja:"☺️肌タイプ：混合肌/インナードライ肌/額の細かいニキビ/黒ずみ/毛穴/少し敏感な方\n この製品を使ってみて、今まで使っていた洗顔フォームがどれだけ刺激的だったか感じました…本当に柔らかくきめ細かい泡が顔をふわっと包んでくれて、毛穴の奥まで刺激なくクレンジングしてくれます！！！本当に満足！！\n  私みたいな敏感さんは刺激的な製品を使うと鼻の下や口の周りにじんましんが出るのですが、これはそうならないんです…すごく満足…\n  洗浄力は、私はクレンジングミルクで基本のメイクを落として2回目の洗顔として使っているので、残っている残留物もすっきりさっぱりよく落ちました！\n 朝晩関係なくこれで洗顔したら肌が澄んでいて、洗顔後に肌のつっぱりがなくてすごく良いです〜〜本当にリピート確定、常備決定、他のものを使っていてもまた思い出しそうです〜〜",th:"☺️ประเภทผิว: ผิวผสม/ผิวมันขาดน้ำ/สิวเสี้ยนหน้าผาก/หัวสิวอุดตันดำ/รูขุมขน/ค่อนข้างแพ้ง่าย\n พอลองใช้ผลิตภัณฑ์นี้แล้วรู้สึกเลยว่าโฟมล้างหน้าที่เคยใช้มาก่อนหน้านี้ระคายเคืองแค่ไหน.. ฟองที่นุ่มนวลและละเอียดจริงๆ ห่อหุ้มใบหน้าและทำความสะอาดถึงในรูขุมขนโดยไม่ระคายเคืองเลย!!! พอใจมากๆ!!\n  คนแพ้ง่ายแบบฉันถ้าใช้ผลิตภัณฑ์ที่ระคายเคืองจะเป็นลมพิษที่ใต้จมูกหรือรอบปาก แต่ตัวนี้ไม่เป็นเลย.. พอใจสุดๆ..\n  แรงทำความสะอาด ฉันล้างเมคอัพพื้นฐานด้วยคลีนซิ่งมิลค์ก่อน แล้วใช้ตัวนี้ล้างหน้าครั้งที่สอง คราบตกค้างที่เหลือหลุดออกอย่างสะอาดหมดจดเลย!\n ล้างหน้าด้วยตัวนี้ทั้งเช้าและเย็นแล้วผิวใสขึ้น หลังล้างหน้าไม่ตึงเลย ชอบมากๆ~~ ตั้งใจจะซื้อซ้ำและตุนไว้แน่นอน ต่อให้ใช้ตัวอื่นก็คงคิดถึงตัวนี้อีกแน่นอน~~"},images:[],video:null},
    {id:"Z04Nk94Z",rating:5,skinType:{ko:"지성",en:"Oily","zh-CN":"油皮","zh-TW":"油性肌膚",ja:"脂性肌",th:"ผิวมัน"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"지성/모낭염·여드름·넓은 모공 - 세안 후 당김·붉어짐 없음",en:"Oily, folliculitis/acne/enlarged pores - no tightness or redness after washing","zh-CN":"油皮/毛囊炎·痘痘·毛孔粗大 - 洗后不紧绷不泛红","zh-TW":"油性/毛囊炎‧痘痘‧毛孔粗大 - 洗完臉不緊繃‧不泛紅",ja:"脂性肌/毛嚢炎・ニキビ・広がった毛穴 - 洗顔後のつっぱり・赤みなし",th:"ผิวมัน/รูขุมขนอักเสบ·สิว·รูขุมขนกว้าง - หลังล้างหน้าไม่ตึง·ไม่แดง"},date:"2026-06-18",
      quote:{ko:"피부타입 : 수부지 / 모낭염 / 여드름 / 넓은 모공\n\n🩵 평소 수부지 피부인데도 세안 후 당김이 심한 편이고, 모낭염이나 여드름 때문에 자극이 적은 클렌저를 선호해서 사용해봤어요\n\n펌프만 누르면 미세 버블이 바로 나와서 따로 거품을 낼 필요가 없어 정말 편했어요. 거품이 촘촘하고 부드러워 피부 마찰이 적게 느껴졌습니다😊\n\n✨ 세정력은 선크림이나 가벼운 메이크업, 노폐물은 깔끔하게 제거되는 느낌이었고 피부결도 정돈되는 느낌을 받았습니다. 진한 메이크업을 한 날에는 1차 클렌징을 함께 해주는게 좋을 것 같아요.\n\n💧 가장 만족스러웠던 점은 세안 후에도 피부가 당기지 않고 촉촉함이 유지된다는 점이었어요. 평소 세안 후 쉽게 붉어지거나 건조함을 느끼는 편인데 그런 자극이 거의 없었습니다.\n\n🌿 향은 거의 무향에 가까워서 부담이 없었고, 민감성 피부도 비교적 편안하게 사용할 수 있을 것 같아요.",en:"Skin type: combination-oily / folliculitis / acne / enlarged pores\n\n🩵 Even though I normally have combination-oily skin, I get tightness pretty badly after washing, and because of folliculitis or acne I prefer a low-irritation cleanser, so I tried this\n\nJust pressing the pump gives fine bubbles right away, so I didn't need to make lather separately, which was really convenient. The foam is dense and soft, so I felt little friction on my skin😊\n\n✨ Cleansing power felt like it cleanly removed sunscreen or light makeup and impurities, and I felt my skin texture becoming more refined too. On heavy makeup days, I think it'd be good to pair with a first cleanse.\n\n💧 What I was most satisfied with was that my skin stays moist without tightness even after washing. I usually get red easily or feel dry after washing, but I barely had that irritation with this.\n\n🌿 The scent is close to fragrance-free, so there was no burden, and I think even sensitive skin could use it relatively comfortably.","zh-CN":"肤质：水油皮/毛囊炎/痘痘/毛孔粗大\n\n🩵 我平时是水油皮，但洗后紧绷感比较严重，加上有毛囊炎和痘痘，所以偏好刺激少的洁面产品，就试用了这款\n\n只要按压泵头，微气泡立刻就出来了，不用另外打泡，真的很方便。泡沫细腻柔软，感觉皮肤摩擦少😊\n\n✨ 清洁力方面，防晒或轻妆、废物都能干净去除，肤质纹理也感觉更整齐。浓妆的日子建议搭配一次清洁一起使用。\n\n💧 最满意的是洗后皮肤不紧绷，能维持水润。平时洗后容易泛红或干燥的我，几乎感觉不到这种刺激。\n\n🌿 香味几乎接近无香，没有负担，敏感肌用起来应该也比较舒适。","zh-TW":"膚質：外油內乾／毛囊炎／痘痘／毛孔粗大\n\n🩵 我平常是外油內乾肌，但洗完臉緊繃感偏嚴重，因為毛囊炎或痘痘的關係偏好刺激較少的潔顏產品，於是試用了這款\n\n只要按壓就會出現細緻氣泡，不用另外起泡，真的很方便。泡沫綿密柔軟，皮膚摩擦感較少😊\n\n✨ 潔淨力方面，防曬乳或淡妝、老廢物都能乾淨清除，膚質也感覺被整理過。濃妝的日子最好先做一次卸妝\n\n💧 最滿意的是洗完臉後皮膚不緊繃、能維持水潤感。我平常洗完臉容易泛紅或乾燥，但用這款幾乎沒有這種刺激感。\n\n🌿 香味幾乎接近無香，沒有負擔，敏感肌用起來應該也比較舒服。",ja:"肌タイプ：インナードライ肌/毛嚢炎/ニキビ/広がった毛穴\n\n🩵普段インナードライ肌なのに洗顔後のつっぱりがひどい方で、毛嚢炎やニキビのため刺激の少ないクレンザーを好むので使ってみました\n\nポンプを押すだけで微細な泡がすぐ出てきて、別に泡立てる必要がなくて本当に便利でした。泡がきめ細かく柔らかいので肌への摩擦が少なく感じました😊\n\n✨洗浄力は日焼け止めや軽めのメイク、老廃物はきれいに落ちる感じで、肌のキメも整う感じを受けました。濃いメイクをした日は1回目のクレンジングを併用すると良さそうです。\n\n💧一番満足だった点は洗顔後も肌がつっぱらずしっとり感が保たれるという点でした。普段洗顔後に簡単に赤くなったり乾燥を感じたりする方ですが、そういう刺激がほとんどありませんでした。\n\n🌿香りはほぼ無香に近くて負担がなく、敏感肌も比較的快適に使えそうです。",th:"ประเภทผิว : ผิวมันขาดน้ำ / รูขุมขนอักเสบ / สิว / รูขุมขนกว้าง\n\n🩵 ปกติเป็นผิวมันขาดน้ำแต่ตึงมากหลังล้างหน้า และเพราะเป็นรูขุมขนอักเสบหรือสิว เลยชอบคลีนเซอร์ที่ระคายเคืองน้อย เลยลองใช้ตัวนี้ดู\n\nแค่กดปั๊มก็มีไมโครบับเบิลออกมาทันที ไม่ต้องตีฟองแยกเลยสะดวกมาก ฟองก็ละเอียดและนุ่มนวล รู้สึกว่าแรงเสียดสีน้อยลง😊\n\n✨ แรงทำความสะอาดล้างครีมกันแดดหรือเมคอัพเบาๆ และสิ่งสกปรกออกได้หมดจด รู้สึกว่าผิวเนียนขึ้นด้วย วันที่แต่งหน้าเข้มข้นน่าจะต้องล้างหน้าครั้งแรกเพิ่มเติมด้วย\n\n💧 สิ่งที่พอใจที่สุดคือหลังล้างหน้าไม่ตึงและยังคงความชุ่มชื้นไว้ ปกติหลังล้างหน้าจะแดงง่ายหรือรู้สึกแห้ง แต่แทบไม่มีการระคายเคืองแบบนั้นเลย\n\n🌿 กลิ่นแทบไม่มีเลย ใช้ได้ไม่มีภาระ แม้ผิวแพ้ง่ายก็น่าจะใช้ได้อย่างค่อนข้างสบายใจ"},images:[],video:null},
    {id:"A6gjd28J",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"속건조 심한 지성, 트러블 압출 후에도 따가움 없음, 트러블 감소 체감",en:"Oily with severe inner dryness, no stinging even after extraction, felt reduction in breakouts","zh-CN":"内干严重的油皮，压痘后使用也不刺痛，感受到痘痘减少","zh-TW":"內在乾燥嚴重的油性肌，擠粉刺後也不刺痛，感覺到痘痘減少",ja:"インナードライがひどい脂性肌、トラブルの圧出後も痛みなし、トラブル減少を実感",th:"ผิวมันที่ขาดน้ำรุนแรง ไม่แสบแม้หลังกดสิว รู้สึกได้ว่าสิวลดลง"},date:"2026-07-03",
      quote:{ko:"손에 펌핑했을 때는 생크림처럼 촘촘하고 밀도 있어 보이는 거품이 풍성하게 올라오는데, 실제로 얼굴 피부에 사용할 때는 아주 가볍고 촉촉한 거품이에요.\n그래서 1번보다는 2~2.5번 정도 펌핑해서 사용하고 있어요.\n거품이 생각했던 것보다 더 가볍고 부드러워서 세정이 잘 안되는건 아닐까 걱정했는데 메이크업 세정력도 좋아서 놀랐어요!\n모공 사이에 낀 파운데이션도 아주 잘 씻기더라고요 ㅎ.ㅎ\n\n저는 속건조가 심한 지성피부인데 피부를 산뜻하게 세정해 주면서 속당김이 느껴지지 않는 점이 너무 좋아요!\n계절이나 피부 타입을 타지 않는 클렌저라는 생각이 들어요.\n\n트러블이 자주 올라오는 편인데, 압출 후에 사용해도 따가움이 전혀 느껴지지 않는 점도 좋고, 요즘 매일 이 제품으로만 세안했는데 피지나 트러블이 좀 줄어든 것같은 느낌도 들어요.\n\n클렌징오일처럼 부드럽고 자극없는 제형을 원하시지만 미끌거리는 마무리감이 싫었던 분들이나,\n클렌징폼처럼 강력한 세정력을 원하시지만 피부 당김이 불편하셨던 분들에게 강력추천하는 클렌징제품이에요 :)\n\n저는 개인적으로 용기도 마음에 드는데, 좌우로 돌려서 잠그거나 별도의 마개를 끼우는게 아니라 아예 캡이 있는 제품이라 좋아요.\n펌프가 눌릴 염려가 없으니 출장갈 때 파우치에 편하게 담아가기에도 좋고, 위생적으로 관리할 수 있어서도 좋아요.\n\n순한 사용감이 좋아서 저는 다 쓴 후에 재구매 의향도 있어요, 좋은 제품 체험해 볼 수 있는 기회주셔서 감사합니다!",en:"When pumped onto my hand, the foam looks rich and dense like whipped cream, but when actually used on my face it's a very light, moist foam.\nSo I use about 2-2.5 pumps rather than just 1.\nThe foam was lighter and softer than I expected, so I worried it might not cleanse well, but I was surprised the makeup cleansing power was good too!\nEven foundation stuck between pores got washed off really well ㅎ.ㅎ\n\nI have oily skin with severe inner dryness, and it's so nice that it cleanses my skin fresh while not leaving that inner tightness feeling!\nI feel like this is a cleanser that doesn't discriminate by season or skin type.\n\nI get breakouts often, and even after extraction, using this causes zero stinging, which is also great, and lately using only this product for cleansing, I feel like my sebum and breakouts have decreased a bit.\n\nFor people who wanted a gentle, non-irritating texture like a cleansing oil but hated the slippery finish,\nor people who wanted the powerful cleansing of a foam cleanser but found the tightness uncomfortable,\nI highly recommend this cleansing product :)\n\nPersonally, I also like the packaging - instead of twisting it left and right to lock it or attaching a separate cap, it just comes with a built-in cap, which I like.\nThere's no worry about the pump getting pressed accidentally, so it's great to pack in a pouch for business trips, and it's good for hygiene too.\n\nI liked the gentle feel so much that I do intend to repurchase after finishing this one - thank you for the chance to try such a great product!","zh-CN":"按压在手上时，泡沫像鲜奶油一样细腻紧密、蓬松地冒出来，但实际用在脸上时是非常轻盈水润的泡沫。\n所以我不按一次，而是按压2~2.5次左右使用。\n泡沫比想象中更轻盈柔软，本来担心是不是清洁力不够，结果卸妆清洁力也很好，让我很惊讶！\n卡在毛孔里的粉底液也洗得很干净呵呵。\n\n我是内干严重的油性肌肤，这款能清爽清洁皮肤，同时又不觉得紧绷，真的很喜欢！\n感觉是一款不挑季节、不挑肤质的洁面产品。\n\n我经常长痘，压痘之后用也完全不刺痛，这点也很好，最近每天都只用这款洁面，感觉皮脂和痘痘都稍微减少了一些。\n\n强烈推荐给想要卸妆油般柔软无刺激的质地、但不喜欢滑腻收尾感的人，\n或者想要洁面泡沫般强力清洁力、又不想忍受紧绷感的人 :)\n\n我个人也很喜欢这款的瓶身设计，不是那种要左右旋转锁紧或另外套盖子的类型，而是自带盖子的设计，很喜欢。\n不用担心泵头被按到，出差时放进化妆包也很方便，卫生管理也很省心。\n\n温和的使用感让我很满意，用完之后也有回购意愿，谢谢给我体验好产品的机会！","zh-TW":"按壓在手上時，會像鮮奶油一樣出現綿密紮實的豐盈泡沫，但實際用在臉上時是非常輕盈水潤的泡沫。\n所以比起按一次，我會按2~2.5次左右使用。\n泡沫比想像中更輕柔，本來擔心會不會洗不乾淨，結果卸妝力也很好，讓我很驚訝！\n卡在毛孔裡的粉底也洗得很乾淨ㅎ.ㅎ\n\n我是內在乾燥嚴重的油性肌，能清爽清潔皮膚，同時完全感覺不到內在緊繃感，這點真的很喜歡！\n感覺是不挑季節、不挑膚質的潔顏產品。\n\n我很容易長痘痘，擠完粉刺之後用也完全不刺痛，這點也很喜歡，最近每天只用這款洗臉，感覺皮脂或痘痘好像也稍微減少了。\n\n想要卸妝油那種柔軟無刺激的質地，但討厭滑膩收尾感的人，\n或想要洗面乳那種強力潔淨力，但不喜歡緊繃感的人，\n都強力推薦這款潔顏產品 :)\n\n我個人也很喜歡瓶身設計，不是左右轉動鎖起來或另外套上蓋子，而是直接有蓋子的設計，很喜歡。\n不用擔心壓頭被誤壓，出差時放進化妝包也很方便，也能保持衛生管理。\n\n因為使用感溫和，用完之後我也有回購意願，謝謝讓我有機會體驗這麼好的產品！",ja:"手にポンプしたときは生クリームのようにきめ細かく密度のある泡がふんわり出てきますが、実際に顔の肌に使うときはとても軽くしっとりした泡です。\nなので1回よりは2〜2.5回くらいポンプして使っています。\n泡が思ったより軽くて柔らかいので洗浄がうまくいかないのではと心配しましたが、メイクの洗浄力も良くて驚きました！\n毛穴の間に詰まったファンデーションもとてもよく落ちました笑\n\n私はインナードライがひどい脂性肌ですが、肌をさっぱり洗浄しながらつっぱりを感じない点がとても良いです！\n季節や肌タイプを選ばないクレンザーだと思います。\n\nトラブルがよく出る方ですが、圧出後に使っても痛みが全く感じられない点も良く、最近毎日この製品だけで洗顔していますが、皮脂やトラブルが少し減った感じもします。\n\nクレンジングオイルのように柔らかく刺激のないテクスチャーを求めているけれどぬるつく仕上がりが嫌だった方や、\n洗顔フォームのように強力な洗浄力を求めているけれど肌のつっぱりが不快だった方に強くおすすめするクレンジング製品です:)\n\n私は個人的に容器も気に入っていて、左右に回してロックしたり別途のキャップをはめたりするのではなく、最初からキャップがある製品なのが良いです。\nポンプが押されてしまう心配がないので、出張のときポーチに気軽に入れて持って行くのにも良く、衛生的に管理できるのも良いです。\n\nマイルドな使用感が良いので、使い切った後リピート意向もあります。良い製品を体験させていただく機会をくださりありがとうございます！",th:"พอปั๊มลงมือ ฟองจะฟูขึ้นมาแน่นและละเอียดเหมือนวิปครีม แต่พอใช้จริงบนใบหน้ากลับเป็นฟองที่เบาและชุ่มชื้นมาก\nเลยปั๊มประมาณ 2-2.5 ครั้งแทนที่จะเป็น 1 ครั้ง\nฟองเบาและนุ่มนวลกว่าที่คิดไว้ เลยกังวลว่าจะล้างไม่สะอาด แต่แรงทำความสะอาดเมคอัพก็ดีจนแปลกใจ!\nรองพื้นที่ติดอยู่ในรูขุมขนก็ล้างออกได้ดีมากฮ่าๆ\n\nฉันเป็นผิวมันที่ขาดน้ำรุนแรง แต่ทำความสะอาดผิวได้สดชื่นโดยไม่รู้สึกตึงเลย ชอบมาก!\nรู้สึกว่าเป็นคลีนเซอร์ที่เหมาะกับทุกฤดูกาลและทุกสภาพผิว\n\nปกติเป็นสิวบ่อยๆ แต่ใช้หลังกดสิวแล้วก็ไม่แสบเลย แล้วช่วงนี้ใช้ล้างหน้าด้วยผลิตภัณฑ์นี้ทุกวัน รู้สึกว่าไขมันหรือสิวลดลงด้วย\n\nแนะนำสุดๆ สำหรับคนที่อยากได้เนื้อสัมผัสนุ่มนวลไม่ระคายเคืองแบบคลีนซิ่งออยล์ แต่ไม่ชอบความรู้สึกลื่นเหนอะหนะตอนจบ\nหรือคนที่อยากได้แรงทำความสะอาดแรงแบบโฟมล้างหน้า แต่ไม่ชอบความตึงหลังล้างหน้า :)\n\nส่วนตัวชอบบรรจุภัณฑ์ด้วย ไม่ต้องหมุนล็อคซ้าย-ขวาหรือใส่ฝาแยกต่างหาก แต่มีฝาครอบมาให้เลย\nไม่ต้องกังวลว่าปั๊มจะถูกกดโดยไม่ตั้งใจ เหมาะกับใส่กระเป๋าเครื่องสำอางตอนเดินทางไปทำงาน แล้วยังดูแลรักษาความสะอาดได้ง่ายด้วย\n\nความรู้สึกอ่อนโยนเมื่อใช้ทำให้อยากซื้อซ้ำหลังใช้หมด ขอบคุณที่ให้โอกาสได้ลองผลิตภัณฑ์ดีๆ แบบนี้ค่ะ!"},images:[],video:null},
    {id:"Zly5KNoq",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"복합성/민감성, 운동 후·면도 전후 자극 없이 사용",en:"Combination/sensitive, used without irritation after workouts and before/after shaving","zh-CN":"混合肌/敏感性，运动后·刮胡前后也能无刺激使用","zh-TW":"混合性/敏感性，運動後‧刮鬍前後無刺激使用",ja:"混合肌/敏感肌、運動後・ひげ剃り前後に刺激なく使用",th:"ผิวผสม/แพ้ง่าย ใช้ได้โดยไม่ระคายเคืองหลังออกกำลังกาย·ก่อนและหลังโกนหนวด"},date:"2026-07-03",
      quote:{ko:"1. 세정력\n아침저녁으로 2주 사용\n\n과도하게 뽀득하지 않으면서 피지와 노폐물 제거\n\n운동 후 땀과 유분이 많은 날에도 깔끔한 마무리\n\n선크림 정도는 무리 없이 세정 가능\n\n세안 후 얼굴이 개운하면서도 당김이 적은 편\n\n2. 제형\n펌프를 누르면 풍성한 마이크로 버블이 바로 나옴\n\n거품을 따로 만들 필요가 없어 사용이 편리\n\n거품 입자가 촘촘하고 부드러워 피부 자극이 적은 느낌\n\n얼굴에 닿았을 때 쿠션감이 좋아 마찰 부담 감소\n\n3. 사용감\n세안 후 피부가 건조하게 조여오는 느낌이 적음\n\n촉촉함이 남아 바로 스킨을 바르지 않아도 부담 없음\n\n면도 전후 사용 시에도 자극이 크지 않았음\n\n은은한 향으로 부담 없이 사용 가능\n\n4. 추천 피부타입\n세안 후 당김을 자주 느끼는 건성 피부\n\n유수분 밸런스가 필요한 복합성 피부\n\n자극이 적은 클렌저를 찾는 민감성 피부\n\n과도한 유분 제거보다 촉촉한 마무리를 선호하는 피부\n\n5. 총평\n2주 동안 사용하면서 가장 만족했던 부분은 세정력과 촉촉한 마무리감의 균형이었음. 노폐물과 피지는 깔끔하게 제거되는데 세안 후 피부가 당기지 않아 아침, 저녁 모두 부담 없이 사용 가능했음. 거품이 풍성하고 부드러워 피부 마찰이 적게 느껴졌으며, 건조함 때문에 순한 클렌저를 찾는 사람에게 추천할 만한 제품이었음",en:"1. Cleansing power\nUsed morning and evening for 2 weeks\n\nRemoves sebum and impurities without an overly squeaky-clean feel\n\nCleans up nicely even on days with a lot of sweat and oil after working out\n\nCan cleanse sunscreen without a problem\n\nFace feels refreshed after washing with relatively little tightness\n\n2. Texture\nRich micro bubbles come out right away when you press the pump\n\nNo need to make lather separately, convenient to use\n\nBubble particles are dense and soft, feels like less irritation to the skin\n\nGood cushiony feel on contact with the face, reduces friction burden\n\n3. Feel of use\nLittle feeling of the skin tightening dry after washing\n\nMoisture remains so there's no pressure to apply toner right away\n\nNot much irritation even used before and after shaving\n\nSubtle scent so it's comfortable to use\n\n4. Recommended skin types\nDry skin that often feels tightness after washing\n\nCombination skin that needs oil-water balance\n\nSensitive skin looking for a low-irritation cleanser\n\nSkin that prefers a moist finish over removing excess oil\n\n5. Overall review\nWhat satisfied me most over 2 weeks of use was the balance between cleansing power and a moist finish. Impurities and sebum are cleaned off thoroughly, yet skin doesn't feel tight after washing, so I could use it without worry morning and night. The foam is rich and soft so I felt little friction on my skin, and it's a product I'd recommend to anyone looking for a gentle cleanser due to dryness","zh-CN":"1. 清洁力\n早晚使用两周\n\n不会洗到过度干涩，能去除皮脂和废物\n\n运动后汗多油多的日子也能干净收尾\n\n卸除防晒程度不成问题\n\n洗后清爽，紧绷感较少\n\n2. 质地\n按压泵头蓬松的微气泡立刻就出来\n\n不用另外打泡，使用方便\n\n泡沫颗粒细腻柔软，皮肤刺激感较少\n\n接触脸部时缓冲感好，摩擦负担减少\n\n3. 使用感\n洗后皮肤干燥紧绷的感觉较少\n\n留有水润感，不马上涂化妆水也没负担\n\n刮胡前后使用刺激也不大\n\n淡雅的香味，使用无负担\n\n4. 推荐肤质\n洗后经常紧绷的干性肌肤\n\n需要水油平衡的混合性肌肤\n\n想找刺激少的洁面产品的敏感性肌肤\n\n比起过度去油更偏好水润收尾的肌肤\n\n5. 总评\n使用两周下来，最满意的是清洁力和水润收尾感的平衡。废物和皮脂清洁得很干净，但洗后皮肤不紧绷，早晚使用都没有负担。泡沫蓬松柔软，皮肤摩擦感较少，对因为干燥而想找温和洁面产品的人来说是值得推荐的产品","zh-TW":"1. 潔淨力\n早晚各用兩週\n\n不會過度乾淨清爽（過緊），同時去除皮脂和老廢物\n\n運動後汗水和油脂多的日子也能清爽收尾\n\n防曬乳程度可以輕鬆卸除\n\n洗完臉清爽，緊繃感較少\n\n2. 質地\n按壓就會馬上出現豐盈的微氣泡\n\n不需要另外起泡，使用方便\n\n泡沫顆粒細緻柔軟，皮膚刺激感較少\n\n碰到臉時緩衝感很好，摩擦負擔減少\n\n3. 使用感\n洗完臉後皮膚乾燥緊繃感較少\n\n留有水潤感，不馬上擦化妝水也不會有負擔\n\n刮鬍前後使用也不會有太大刺激\n\n淡雅香氣，使用無負擔\n\n4. 推薦膚質\n洗完臉常常緊繃的乾性肌\n\n需要油水平衡的混合性肌膚\n\n正在找低刺激潔顏產品的敏感肌\n\n比起過度去油、更偏好水潤收尾的肌膚\n\n5. 總評\n使用兩週期間最滿意的是潔淨力和水潤收尾感之間的平衡。老廢物和皮脂清潔得很乾淨，但洗完臉後不緊繃，早晚使用都毫無負擔。泡沫豐盈柔軟，皮膚摩擦感較少，是一款可以推薦給因為乾燥而正在尋找溫和潔顏產品的人的產品",ja:"1. 洗浄力\n朝晩2週間使用\n\n過度にキュッキュッとしすぎず皮脂と老廃物を除去\n\n運動後、汗と油分が多い日もすっきり仕上がる\n\n日焼け止め程度は無理なく洗浄可能\n\n洗顔後、顔がさっぱりしながらもつっぱりが少ない方\n\n2. テクスチャー\nポンプを押すと豊かなマイクロバブルがすぐ出てくる\n\n泡を別に作る必要がなく使いやすい\n\n泡の粒子がきめ細かく柔らかいので肌への刺激が少ない感じ\n\n顔に触れたときクッション感が良く摩擦の負担が減少\n\n3. 使用感\n洗顔後、肌が乾燥して引きつる感じが少ない\n\nしっとり感が残ってすぐ化粧水をつけなくても負担がない\n\nひげ剃り前後の使用時も刺激が大きくなかった\n\nほのかな香りで気兼ねなく使用可能\n\n4. おすすめの肌タイプ\n洗顔後つっぱりをよく感じる乾燥肌\n\n水分・油分バランスが必要な混合肌\n\n刺激の少ないクレンザーを探している敏感肌\n\n過度な油分除去よりしっとりした仕上がりを好む肌\n\n5. 総評\n2週間使ってみて一番満足だった部分は洗浄力としっとりした仕上がりのバランスでした。老廃物と皮脂はきれいに落ちるのに洗顔後肌がつっぱらず、朝晩どちらも気兼ねなく使うことができました。泡が豊かで柔らかく肌への摩擦が少なく感じられ、乾燥のためにマイルドなクレンザーを探している人におすすめできる製品でした",th:"1. แรงทำความสะอาด\nใช้ทั้งเช้าและเย็นเป็นเวลา 2 สัปดาห์\n\nกำจัดไขมันและสิ่งสกปรกโดยไม่สะอาดเอี๊ยดเกินไป\n\nวันที่เหงื่อและไขมันเยอะหลังออกกำลังกายก็จบได้สะอาดหมดจด\n\nล้างครีมกันแดดออกได้ไม่มีปัญหา\n\nหลังล้างหน้ารู้สึกสดชื่นและตึงน้อย\n\n2. เนื้อสัมผัส\nกดปั๊มแล้วไมโครบับเบิลฟูออกมาทันที\n\nไม่ต้องตีฟองแยก ใช้งานสะดวก\n\nฟองละเอียดและนุ่มนวล รู้สึกว่าระคายเคืองผิวน้อย\n\nสัมผัสหน้าแล้วรู้สึกนุ่มฟู ลดแรงเสียดสี\n\n3. ความรู้สึกเมื่อใช้\nหลังล้างหน้าแทบไม่รู้สึกแห้งตึงเลย\n\nความชุ่มชื้นยังคงอยู่ ไม่ต้องรีบทาโทนเนอร์ทันทีก็ไม่มีปัญหา\n\nใช้ก่อนและหลังโกนหนวดก็ไม่ค่อยระคายเคือง\n\nกลิ่นอ่อนๆ ใช้ได้ไม่มีภาระ\n\n4. ประเภทผิวที่แนะนำ\nผิวแห้งที่มักตึงหลังล้างหน้า\n\nผิวผสมที่ต้องการสมดุลน้ำ-มัน\n\nผิวแพ้ง่ายที่กำลังหาคลีนเซอร์ที่ระคายเคืองน้อย\n\nผิวที่ชอบความชุ่มชื้นมากกว่าการขจัดความมันแบบสุดๆ\n\n5. สรุป\nสิ่งที่พอใจที่สุดตลอด 2 สัปดาห์ที่ใช้คือความสมดุลระหว่างแรงทำความสะอาดกับความชุ่มชื้นหลังล้างหน้า สิ่งสกปรกและไขมันหลุดออกหมดจด แต่หลังล้างหน้าไม่ตึงเลย ใช้ได้ทั้งเช้าและเย็นแบบไม่มีภาระ ฟองฟูและนุ่มนวล รู้สึกว่าแรงเสียดสีน้อย เป็นผลิตภัณฑ์ที่น่าแนะนำสำหรับคนที่กำลังหาคลีนเซอร์อ่อนโยนเพราะผิวแห้ง"},images:[],video:null},
    {id:"AVpVyjRZ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"악건성+좁쌀여드름, 피부과에서 호호바오일 추천받은 이력",en:"Extremely dry + tiny bumpy acne, was recommended jojoba oil by a dermatologist","zh-CN":"极干皮+闭口痘痘，曾被皮肤科推荐使用荷荷巴油","zh-TW":"極乾性+粉刺痘痘，皮膚科建議使用荷荷芭油的經歷",ja:"極度の乾燥肌+細かいニキビ、皮膚科でホホバオイルをすすめられた経緯",th:"ผิวแห้งมาก+สิวเสี้ยน เคยได้รับคำแนะนำจากคลินิกผิวหนังให้ใช้น้ำมันโฮโฮบา"},date:"2026-07-03",
      quote:{ko:"2주일간 성실하기 사용한 찐 후기입니다!\n30대 좁쌀 여드름 건성 피부입니다\n\n✌️세안후당김 없음\n진짜 악건성이라 건조해서 오히려 여드름이 나는 스타일이라 세정력 강하고 뽀득한 제품을 정말 안좋아하능데 이제품은 확실히 호호바오일이 함유되어있어서 그런가 세안후 얼굴 당김이 진짜 없었습니다!\n\n호호바오일이 피부의 피지와 가장 유사한 성분으로 피부에 사용하기 정말 건강한 오일이라고 피부과에서 건조한 저같은 피부에 사용해보라고 추천한 오일이였어서 더 신뢰가 갔습니다\n\n✌부드러운 버블\n펌프를 누르면 풍성한 버블로 나와서 거품을 일부로 낼 필요도 없고 자극도 덕분에 하나도 없어서 매일매일 특히 아침에 사용해주기 너무 좋았습니다\n\n\n✌️세정력\n평소 화장은 안하고 톤업선크림 정도만 바르고 출근하는데 충분히 세정이 되어서 세정력도 아주 만족하고 사용하고 있습니다!\n\n✌️순함\n그리고 성분이 일단 여드름이 여전히 나는 피부라서 순함 제품을 늘 찾는데 판테놀에 나이아신아마이드 세라마이드까지 피부장벽에 좋은 성분들은 다 있고 사용하고 부담이 없다고 느껴져서 손이 진짜 자주 가는 제품입니다",en:"Here's my honest review after using it faithfully for 2 weeks!\nI'm in my 30s with dry skin that gets small bumpy acne\n\n✌️No tightness after cleansing\nI'm genuinely extremely dry, so my skin actually breaks out MORE from dryness, so I really don't like products with strong cleansing power that leave my skin squeaky. This product clearly contains jojoba oil, and maybe that's why, but there was truly zero tightness on my face after washing!\n\nJojoba oil is the closest thing to skin's own sebum and is known as a genuinely healthy oil to use on skin — my dermatologist actually recommended it for dry skin like mine, so that gave me even more trust in this product\n\n✌Soft bubbles\nWhen you press the pump, rich bubbles come out so you don't need to work up a lather yourself, and thanks to that there was zero irritation, which made it great to use every day, especially in the mornings\n\n✌️Cleansing power\nI usually don't wear makeup and just put on tone-up sunscreen before work, and it cleanses that off completely, so I'm very satisfied with the cleansing power too!\n\n✌️Gentleness\nSince my skin still breaks out with acne, I'm always looking for gentle products, and the ingredient list has Panthenol, Niacinamide, and Ceramides — all the good stuff for the skin barrier — so it feels completely burden-free to use, and honestly my hand just keeps reaching for this product.","zh-CN":"认真使用两周后的真实测评！\n30多岁闭口痘痘干性肌肤\n\n✌️洗后不紧绷\n我是真正的极干皮，反而是因为干燥才长痘的类型，所以真的不喜欢清洁力强、洗到吱吱响的产品，这款可能是因为确实含有荷荷巴油，洗后脸真的不紧绷！\n\n荷荷巴油是与皮肤皮脂最相似的成分，是对皮肤真正健康的油，皮肤科也曾建议像我这种干燥肌肤用这种油，所以更加信任\n\n✌柔软的气泡\n按压泵头就能出蓬松的气泡，不用特意打泡，也因此完全没有刺激，每天特别是早上用起来非常方便\n\n✌️清洁力\n我平时不化妆，只涂提亮防晒就出门上班，这款完全能洗干净，清洁力也很满意！\n\n✌️温和\n而且成分方面，我是还在长痘的皮肤，一直在找温和的产品，这款含泛醇、烟酰胺、神经酰胺等对皮肤屏障好的成分都有，用起来没有负担，真的很常用","zh-TW":"這是連續兩週認真使用後的真實心得！\n我是30多歲、有粉刺痘痘的乾性肌膚\n\n✌️洗完臉不緊繃\n我真的是極乾性，反而因為乾燥才長痘痘的類型，很不喜歡潔淨力強、洗完咕溜咕溜的產品，這款可能因為確實含有荷荷芭油，洗完臉真的完全不緊繃！\n\n荷荷芭油是和皮膚皮脂最相似的成分，是對皮膚很健康的油，皮膚科曾建議像我這種乾燥肌可以用，所以更信賴這款產品\n\n✌柔軟的氣泡\n按壓就會出現豐盈氣泡，不用特地起泡，也因此完全沒有刺激，每天特別是早上使用都很方便\n\n\n✌️潔淨力\n我平常不化妝，只擦亮白防曬乳就出門，這樣清潔已經很足夠，潔淨力也很滿意！\n\n✌️溫和度\n成分方面，我依然會長痘痘，一直在找溫和產品，這款含有泛醇、菸鹼醯胺、神經醯胺等對皮膚屏障好的成分，用起來完全沒有負擔，真的很常用",ja:"2週間まじめに使ったガチレビューです！\n30代、細かいニキビの乾燥肌です\n\n✌️洗顔後つっぱりなし\n本当に極度の乾燥肌で、乾燥するせいでむしろニキビが出るタイプなので、洗浄力が強くてキュッキュッとする製品は本当に苦手なのですが、この製品は確実にホホバオイルが含まれているからか、洗顔後の顔のつっぱりが本当にありませんでした！\n\nホホバオイルは肌の皮脂と最も似た成分で、肌に使うのに本当に健康的なオイルだと皮膚科で、乾燥している私のような肌に使ってみるようすすめられたオイルだったので、より信頼できました\n\n✌柔らかいバブル\nポンプを押すと豊かなバブルが出てくるので、あえて泡立てる必要もなく、そのおかげで刺激も全くなくて、毎日特に朝使うのにとても良かったです\n\n\n✌️洗浄力\n普段メイクはせずトーンアップ日焼け止め程度だけ塗って出勤していますが、十分洗浄されるので洗浄力もとても満足して使っています！\n\n✌️マイルドさ\nそして成分について、まだニキビが出る肌なのでマイルドな製品をいつも探しているのですが、パンテノールにナイアシンアミド、セラミドまで肌バリアに良い成分は全部入っていて、使っても負担がないと感じるので本当によく手が伸びる製品です",th:"นี่คือรีวิวจริงหลังใช้อย่างสม่ำเสมอเป็นเวลา 2 สัปดาห์ค่ะ!\nเป็นผิวแห้งวัย 30 กว่าที่มีสิวเสี้ยน\n\n✌️หลังล้างหน้าไม่ตึง\nเพราะเป็นผิวแห้งมากจนแห้งแล้วกลับเป็นสิว เลยไม่ชอบผลิตภัณฑ์ที่แรงทำความสะอาดสูงและสะอาดเอี๊ยดเกินไป แต่ผลิตภัณฑ์นี้อาจเพราะมีน้ำมันโฮโฮบา หลังล้างหน้าไม่ตึงเลยจริงๆ!\n\nน้ำมันโฮโฮบามีโครงสร้างใกล้เคียงกับไขมันของผิวมากที่สุด เป็นน้ำมันที่ดีต่อผิวมาก เคยได้รับคำแนะนำจากคลินิกผิวหนังให้ลองใช้กับผิวแห้งแบบฉัน เลยยิ่งไว้ใจมากขึ้น\n\n✌ฟองนุ่มนวล\nกดปั๊มแล้วฟองฟูออกมาทันที ไม่ต้องตีฟองเพิ่ม แล้วไม่ระคายเคืองเลย เหมาะกับใช้ทุกวันโดยเฉพาะตอนเช้ามาก\n\n\n✌️แรงทำความสะอาด\nปกติไม่แต่งหน้า ทาแค่ครีมกันแดดโทนอัพก่อนไปทำงาน ล้างออกได้เพียงพอ พอใจกับแรงทำความสะอาดมากค่ะ!\n\n✌️ความอ่อนโยน\nด้วยความที่ยังเป็นสิวอยู่ เลยหาผลิตภัณฑ์ที่อ่อนโยนตลอด แต่ตัวนี้มีทั้งแพนธีนอล ไนอาซินาไมด์ เซราไมด์ที่ดีต่อเกราะผิวครบเลย ใช้แล้วไม่มีภาระ เลยหยิบใช้บ่อยจริงๆ"},images:[],video:null},
    {id:"ZMmyWKPZ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"민감성/건성, 4시간 방치해도 안당김, 눈 안따가움",en:"Sensitive/dry skin, no tightness even after 4 hours untreated, no stinging in eyes","zh-CN":"敏感性/干皮，放置4小时也不紧绷，不刺激眼睛","zh-TW":"敏感性/乾性，放置4小時也不緊繃，眼睛不刺痛",ja:"敏感肌/乾燥肌、4時間放置してもつっぱらない、目にしみない",th:"แพ้ง่าย/ผิวแห้ง ทิ้งไว้ 4 ชั่วโมงก็ไม่ตึง ไม่แสบตา"},date:"2026-05-19",
      quote:{ko:"성분 : 화해앱에서도 확인가능하지만 성분이 좋아서 그런지 사용하는 내내 트러블 없이 사용 할 수 있었어요.\n향 : 무향이긴 하지만 화장품 유분향이라고 할까요? 거북하진 않음\n눈따가움 : 없음\n\n민감성 피부를 위한 장벽/진정 클렌징 제품으로 약산성과 향료도 없고 무자극인데 세정력은 좋아서 민감성인 저도 편안하게 사용했어요.\n\n호호바 오일이 함유되어 있어서인지 세안후에는 뽀득뽀득보다는 촉촉함이 많아 피부장벽이 보호된다는게 느껴졌어요. 세안후에 깜빡하고 4시간 넘게 기초를 못했는데 피부가 당기거나 건조함은 없었어요.\n\n저처럼 민감성이나 건성이신 분들에게는 잘 맞을 듯하고 지성이거나 뽀득함을 원하는 분들에게는 좀 부족하다고 느끼 실 수도 있을 것 같아요.\n\n평소에 전 클렌징밀크 사용 후 약산성 클렌징 폼을 사용하는데 이 제품은 클렌징 밀크사용하지 않아도 물없이 사용하면  메이크업이 녹는 기분이 들어서 이 제품만 사용해도 충분했어요.",en:"Ingredients: You can check them on the Hwahae app too, but the ingredients are good, so I was able to use it the whole time with no breakouts.\nScent: It's fragrance-free, but there's kind of a \"cosmetic oil\" smell? Not off-putting though\nEye sting: None\n\nIt's a barrier-protecting, soothing cleanser for sensitive skin — mildly acidic (pH-balanced), no added fragrance, and non-irritating, yet the cleansing power is good, so even I, with sensitive skin, could use it comfortably.\n\nMaybe because it contains jojoba oil, after cleansing my skin felt more moisturized than squeaky-clean, and I could feel that my skin barrier was being protected. I once forgot and went over 4 hours after cleansing without doing my skincare routine, and my skin didn't feel tight or dry at all.\n\nI think this would suit people like me with sensitive or dry skin well, but if you're oily or want that squeaky-clean feeling, you might find it a bit lacking.\n\nI usually use a cleansing milk followed by a mildly acidic cleansing foam, but with this product, even without the cleansing milk, using it dry (without water) made it feel like makeup was melting away — so this product alone was enough.","zh-CN":"成分：在化海App上也能查到，可能是成分好，使用期间完全没有出现皮肤问题。\n香味：虽然是无香，但有一点点像护肤品的油脂香？不会让人不舒服\n呛眼：没有\n\n是为敏感肌设计的屏障/舒缓类洁面产品，弱酸性、无香料、无刺激，同时清洁力也不错，我这种敏感肌用起来也很舒适。\n\n可能是含有荷荷巴油，洗后不是那种吱吱响的干净感，而是偏水润，能感受到皮肤屏障被保护着。有一次洗完脸忘了做后续护肤，放了超过4小时，皮肤也没有紧绷或干燥。\n\n像我这种敏感肌或干皮应该会很适合，油皮或喜欢洗到吱吱响的人可能会觉得不够。\n\n我平时是用完洁面乳再用弱酸性洁面泡沫，这款就算不用洁面乳，不沾水直接用也感觉能把妆溶掉，光用这一款就够了。","zh-TW":"成分：在化妝品成分分析App上也能查到，可能因為成分好，整個使用期間都沒有出現肌膚困擾。\n香味：雖然是無香，但有點像化妝品的油脂味？不會讓人不舒服\n刺眼感：沒有\n\n是為敏感肌設計的屏障/舒緩潔顏產品，弱酸性、無香料、無刺激，但潔淨力也不錯，敏感肌的我用起來也很舒服。\n\n可能因為含有荷荷芭油，洗完臉不是那種咕溜咕溜的乾淨感，而是偏水潤，能感覺到皮膚屏障被保護著。有一次洗完臉忘記做保養，過了四個多小時，皮膚也沒有緊繃或乾燥。\n\n像我這樣的敏感肌或乾性肌應該會很適合，但油性肌或喜歡咕溜咕溜乾淨感的人可能會覺得不夠力。\n\n我平常是用卸妝乳之後再用弱酸性洗面乳，但這款產品不用卸妝乳、不沾水使用就有種妝在融化的感覺，光用這款就很足夠了。",ja:"成分：ファヘアプリでも確認できますが、成分が良いからか使っている間ずっとトラブルなく使うことができました。\n香り：無香ですが、コスメの油分の香りというか?不快ではありません\n目のしみ：なし\n\n敏感肌のためのバリア/鎮静クレンジング製品で、弱酸性で香料もなく無刺激なのに洗浄力は良いので、敏感肌の私も快適に使いました。\n\nホホバオイルが含まれているからか、洗顔後はキュッキュッというよりしっとり感が多く、肌バリアが守られている感じがしました。洗顔後うっかりして4時間以上スキンケアができませんでしたが、肌がつっぱったり乾燥したりすることはありませんでした。\n\n私のような敏感肌や乾燥肌の方には合うと思いますが、脂性肌やキュッキュッとした感じを求める方には少し物足りなく感じるかもしれません。\n\n普段私はクレンジングミルクを使った後に弱酸性の洗顔フォームを使いますが、この製品はクレンジングミルクを使わなくても水なしで使うとメイクが溶ける感じがしたので、この製品だけ使っても十分でした。",th:"ส่วนผสม : เช็คได้จากแอปฮวาแฮด้วย ส่วนผสมดีเลยใช้แล้วไม่มีสิวขึ้นตลอดการใช้\nกลิ่น : ไม่มีกลิ่นแต่งเติม แต่มีกลิ่นน้ำมันของเครื่องสำอางนิดหน่อย? ไม่รบกวนใจ\nแสบตา : ไม่มีเลย\n\nเป็นผลิตภัณฑ์คลีนซิ่งที่เน้นเกราะผิว/ปลอบประโลมสำหรับผิวแพ้ง่าย เป็นกรดอ่อน ไม่มีน้ำหอม ไม่ระคายเคือง แต่แรงทำความสะอาดก็ดี แม้ผิวแพ้ง่ายแบบฉันก็ใช้ได้อย่างสบายผิว\n\nอาจเพราะมีน้ำมันโฮโฮบา หลังล้างหน้าไม่ได้สะอาดเอี๊ยดแต่ชุ่มชื้นมากกว่า รู้สึกได้ว่าเกราะผิวได้รับการปกป้อง หลังล้างหน้าลืมทาสกินแคร์นานเกิน 4 ชั่วโมง ผิวก็ไม่ตึงหรือแห้งเลย\n\nน่าจะเหมาะกับคนผิวแพ้ง่ายหรือผิวแห้งแบบฉัน ส่วนคนผิวมันหรือชอบความรู้สึกสะอาดเอี๊ยดอาจรู้สึกว่าไม่เพียงพอนัก\n\nปกติฉันใช้คลีนซิ่งมิลค์แล้วตามด้วยโฟมล้างหน้ากรดอ่อน แต่ผลิตภัณฑ์นี้แม้ไม่ใช้คลีนซิ่งมิลค์ก่อน แค่ใช้แบบไม่เติมน้ำก็รู้สึกเหมือนเมคอัพละลายออก ใช้แค่ตัวนี้อย่างเดียวก็เพียงพอค่ะ"},images:[],video:null},
    {id:"Z3mB7RKA",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"홍조·열감·여드름, 피부장벽 무너져 피부과 상담 받은 경험 인용",en:"Redness, heat flushing, acne — cites experience of consulting a dermatologist after her skin barrier broke down","zh-CN":"泛红·发热·痘痘，引用皮肤屏障崩溃后去看皮肤科的经历","zh-TW":"泛紅‧泛熱‧痘痘，引用皮膚屏障崩壞去看皮膚科的經驗",ja:"赤み・ほてり・ニキビ、肌バリアが崩れて皮膚科相談を受けた経験を引用",th:"ผื่นแดง·ร้อนวูบวาบ·สิว อ้างอิงประสบการณ์ที่เกราะผิวพังจนต้องปรึกษาคลินิกผิวหนัง"},date:"2026-07-03",
      quote:{ko:"❤️피부타입: 홍조, 민감성, 열감, 여드름\n\n🩵사용동기: 평소에 진한 화장보단 선크림을 주로 바르고 다니는데, 데일리로 쓰면서 피부 장벽에 무리가 없는 제품을 찾다가 사용하게 되었습니다! 성분이 너무 좋고 제 피부타입에 잘 맞을것 같아서 꼭 사용해보고 싶었어요!!!\n\n🩷사용감: 시중의 일부 폼 제품들은 사용하면서 폼이 너무 죽어서 세안할때 마찰감이 느껴지는 것도 있었는데 이 제품은 세안이 끝날때 까지 폼이 살아있어 자극이 1도 없어서 좋았습니다!! 세안 후에도 진짜 촉촉했어요. 당기는 느낌이 이때까지 써본 클렌징 제품들 중에서 제일 없었고 그래서인지 확실히 순하다, 자극없다는 느낌이 들었습니다.\n\n💛민감성: 저는 피부 장벽이 무너져서 조금만 자극있는 제품 쓰면 뒤집어져요! 근데 이 제품은 진짜 자극 1도 없고, 세안 하고 나면 결이 정리되면서 보들보들 해졌습니다. 오히려 진정되는 느낌?? 순하고 당김 없어서 민감한 피부에 진짜 추천드려요!!\n\n🫰🏻총평: 장벽 무너져 피부과 갔을때 클렌징 관련해서 말씀해주신게, 클렌징 할때 엄청 조심스럽게 자극없이 부드럽게 하는게 중요하다더라구요. 세안하면서 장벽이 더 자극 받으니까 절대 얼굴 바로 문지르지말고 가능하면 폼 기구로 폼 만들고 손가락에 힘빼고 롤링하라는 거였어요! 무조건 약산성 쓰고.. 근데 이 제품은 성분도 엄청 순하면서 아예 폼형식이라 진짜 만족했습니다. 앞서 언급한 것처럼 폼이 빨리 꺼지는것도 아니라서 얼굴에 더 자극 없이 세안할수 있어서 정말 만족했습니다!!",en:"❤️Skin type: redness, sensitive, heat flushing, acne\n\n🩵Reason for use: I usually just wear sunscreen rather than heavy makeup, and I was looking for a daily product that wouldn't burden my skin barrier when I found this one! The ingredients looked so good and seemed like a great match for my skin type, so I really wanted to try it!!!\n\n🩷Feel during use: With some foam cleansers on the market, the foam dies down too fast so you feel friction while washing, but with this product the foam stayed alive the whole time I was cleansing, so there was zero irritation!! My skin felt genuinely moisturized even after rinsing. This had the least tightness of any cleansing product I've ever used, and because of that it really felt gentle and non-irritating.\n\n💛Sensitivity: My skin barrier is broken down, so even a slightly irritating product makes my skin flare up! But with this product there was truly zero irritation, and after cleansing my texture felt smoothed out and soft. It almost felt soothing?? Gentle with no tightness — I really recommend it for sensitive skin!!\n\n🫰🏻Overall: When my barrier was broken and I went to the dermatologist, they told me that when it comes to cleansing, it's important to be extremely careful and gentle without irritation. Since the barrier gets more irritated during cleansing, they said never rub your face directly — if possible, build up foam with a foaming tool and roll it gently with light finger pressure! And to always use mildly acidic products... But this product has really gentle ingredients and comes in foam form already, so I was truly satisfied. As mentioned, the foam doesn't collapse quickly either, so I could cleanse my face with even less irritation. Really satisfied!!","zh-CN":"❤️肤质：泛红、敏感性、发热、痘痘\n\n🩵使用契机：平时比起浓妆更常涂防晒，一直在找日常使用不会给皮肤屏障添负担的产品才用上了这款！成分特别好，感觉很适合我的肤质，一直想试试看!!!\n\n🩷使用感：市面上有些泡沫产品用着用着泡沫就会消，洗脸的时候能感觉到摩擦感，但这款一直到洗完脸泡沫都还在，完全没有刺激感!!洗后也真的很水润。紧绷感是我用过的洁面产品里最少的，所以确实感觉很温和、无刺激。\n\n💛敏感性：我皮肤屏障已经崩溃了，只要用稍微有刺激的产品就会爆发！但这款真的完全没有刺激，洗完脸后皮肤纹理反而变整齐，摸起来软乎乎的。反而有种被舒缓的感觉？温和又不紧绷，真心推荐给敏感肌！！\n\n🫰🏻总评：屏障崩溃去看皮肤科的时候，医生说关于清洁最重要的是要非常小心地无刺激、柔软地洁面。洗脸的时候屏障会受到更多刺激，所以绝对不要直接用手搓脸，尽量用起泡工具打出泡沫，手指放松力气打圈！而且一定要用弱酸性……这款成分很温和又正好是泡沫形式，真的很满意。就像前面说的，泡沫也不会很快消掉，能更无刺激地洗脸，真的很满意!!","zh-TW":"❤️膚質：泛紅、敏感性、泛熱、痘痘\n\n🩵使用動機：我平常不太化濃妝，主要擦防曬乳，一直在找當日常用、不會給皮膚屏障造成負擔的產品，就用了這款！成分真的很好，感覺很適合我的膚質，所以很想試試看!!!\n\n🩷使用感：市售有些洗面乳用著用著泡沫就消掉了，洗臉時能感覺到摩擦感，但這款一直到洗完臉泡沫都還在，完全零刺激！！洗完臉後真的很水潤。緊繃感是我用過的潔顏產品裡最少的，所以確實感覺得到很溫和、無刺激。\n\n💛敏感性：我皮膚屏障已經崩壞，稍微用點刺激的產品就會爆痘！但這款真的完全零刺激，洗完臉後膚質變整齊、變得柔軟。反而有種被舒緩的感覺？溫和又不緊繃，真心推薦給敏感肌！！\n\n🫰🏻總評：屏障崩壞去看皮膚科時，醫生提到關於清潔的建議是，洗臉時要非常小心，無刺激又柔和地清潔很重要。因為洗臉時屏障會受到更多刺激，絕對不要直接用手搓臉，盡量用起泡工具打出泡沫，手指放輕力道打圈！一定要用弱酸性……而這款產品成分很溫和，又是泡沫型態，真的很滿意。就像前面提到的，泡沫也不會很快消掉，能更無刺激地洗臉，真的很滿意!!",ja:"❤️肌タイプ：赤み、敏感肌、ほてり、ニキビ\n\n🩵使用動機：普段濃いメイクよりも日焼け止めを主に塗っているのですが、デイリーで使いながら肌バリアに負担のない製品を探していて使うことになりました！成分がとても良くて私の肌タイプに合いそうなので、ぜひ使ってみたかったです！！！\n\n🩷使用感：市販の一部のフォーム製品は使っていると泡がすぐへたって洗顔時に摩擦感を感じるものもありましたが、この製品は洗顔が終わるまで泡が生きていて刺激が1ミリもなくて良かったです！！洗顔後も本当にしっとりしていました。つっぱる感じが今まで使ったクレンジング製品の中で一番なくて、そのせいか確実にマイルドで刺激がないという感じがしました。\n\n💛敏感肌：私は肌バリアが崩れていて、ちょっとでも刺激のある製品を使うと荒れます！でもこの製品は本当に刺激が1ミリもなく、洗顔した後キメが整ってふわふわになりました。むしろ鎮静される感じ??マイルドでつっぱりがないので敏感肌に本当におすすめします！！\n\n🫰🏻総評：バリアが崩れて皮膚科に行ったときクレンジングについて言われたのですが、クレンジングするときはとても慎重に刺激なく優しくすることが大事だそうです。洗顔中にバリアがさらに刺激を受けるので、絶対に顔を直接こすらず、できれば泡立て器で泡を作って指の力を抜いてローリングしてくださいとのことでした！絶対弱酸性を使ってと…でもこの製品は成分もすごくマイルドでそもそもフォーム形式なので本当に満足でした。先ほど述べたように泡がすぐへたるわけでもないので、顔にさらに刺激なく洗顔できて本当に満足でした！！",th:"❤️ประเภทผิว: ผื่นแดง แพ้ง่าย ร้อนวูบวาบ สิว\n\n🩵เหตุผลที่ใช้: ปกติไม่แต่งหน้าเข้มข้น ทาแค่ครีมกันแดดเป็นหลัก เลยหาผลิตภัณฑ์ที่ใช้ประจำวันได้โดยไม่ทำร้ายเกราะผิว แล้วมาเจอตัวนี้! ส่วนผสมดีมากและน่าจะเหมาะกับผิวของฉัน เลยอยากลองใช้มากๆ!!!\n\n🩷ความรู้สึกเมื่อใช้: โฟมบางยี่ห้อในท้องตลาดพอใช้ไปฟองจะยุบเร็วจนรู้สึกมีแรงเสียดสีตอนล้างหน้า แต่ผลิตภัณฑ์นี้ฟองยังคงอยู่จนล้างหน้าเสร็จ ไม่ระคายเคืองเลย ชอบมาก!! หลังล้างหน้าก็ชุ่มชื้นจริงๆ รู้สึกตึงน้อยที่สุดในบรรดาผลิตภัณฑ์คลีนซิ่งที่เคยใช้มา เลยรู้สึกได้ชัดเจนว่าอ่อนโยนและไม่ระคายเคือง\n\n💛แพ้ง่าย: เกราะผิวของฉันพังไปแล้ว แค่ใช้ผลิตภัณฑ์ที่ระคายเคืองนิดหน่อยก็เห่อทันที! แต่ผลิตภัณฑ์นี้ไม่ระคายเคืองเลยจริงๆ หลังล้างหน้าผิวเรียบเนียนและนุ่มขึ้น รู้สึกเหมือนได้รับการปลอบประโลมด้วย?? อ่อนโยนและไม่ตึงเลย แนะนำสำหรับผิวแพ้ง่ายจริงๆ!!\n\n🫰🏻สรุป: ตอนที่เกราะผิวพังจนต้องไปคลินิกผิวหนัง หมอบอกเรื่องการล้างหน้าว่าต้องทำอย่างระมัดระวังและนุ่มนวลที่สุด เพราะการล้างหน้าจะยิ่งกระตุ้นเกราะผิวที่อ่อนแออยู่แล้ว ห้ามถูหน้าตรงๆ เด็ดขาด ให้ใช้เครื่องมือตีฟองแล้วนวดคลึงเบามือที่สุด! และต้องใช้กรดอ่อนเท่านั้น.. แต่ผลิตภัณฑ์นี้ทั้งส่วนผสมอ่อนโยนมากและเป็นรูปแบบโฟมพอดี พอใจมากจริงๆ อย่างที่บอกไปว่าฟองไม่ยุบเร็ว เลยล้างหน้าได้โดยไม่ระคายเคืองมากขึ้นอีก พอใจมากจริงๆ!!"},images:[],video:null},
    {id:"Zlyn45Eq",rating:5,skinType:{ko:"지성",en:"Oily","zh-CN":"油皮","zh-TW":"油性肌膚",ja:"脂性肌",th:"ผิวมัน"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"지성 T존+건성 볼 복합, 오일 클렌징 시 트러블 나던 경험 대비 트러블 없음",en:"Oily T-zone + dry cheeks (combination), no breakouts compared to past experience of breaking out with oil cleansers","zh-CN":"T区油、脸颊干的混合肌，对比用油类清洁会长痘的经历，这款不长痘","zh-TW":"T字油性+臉頰乾性混合肌，比起以前用油類清潔會爆痘，這款不會",ja:"脂性Tゾーン+乾燥した頬の混合肌、オイルクレンジングでトラブルが出ていた経験に対しトラブルなし",th:"ผิวผสม T-zone มัน+แก้มแห้ง เทียบกับประสบการณ์ที่เคยเป็นสิวตอนใช้คลีนซิ่งออยล์ ตัวนี้ไม่เป็นสิวเลย"},date:"2026-06-18",
      quote:{ko:"⭐️세정은 물론, 피부장벽 보호&진정까지!!\n: 호호바 오일, 세라마이드로 세안은 기본\n피부장벽 보호에 추가로 병풀추출물, 모란뿌리 추출물로 진정력있게 마무리 가히 갓벽한 클렌저,,왕 추천\n\n⭐️ 약산성& 무향료 무색소\n: 민감성 피부 테스트로 안심하고 사용,, 무향료인것도 가산점인 부분! 민감 예민피부는 색소와 향료 있음 트러블 나잖아요ㅠ\n\n⭐️얇고 조밀한 거품으로 꼼꼼 세정\n: 한번 펌핑으로 손쉬운 사용과 손에서 여러번 거품을 키우지 않아도 충분한 거품량이 좋았어요.\n촘촘한 버블이 피부 구석구석을 부드럽게 지워내주는 느낌\nT존이 유분이 많고 볼 이마는 건성인데 타입별로도 잘 잡아주는 기분이 들었어요. 유분이 많은 곳은 말끔히 지워주면서 건조한 부위는 수분감있게 클렌징해주는 느낌이에요.\n그래서 얼굴이 건조하게 땡기지않았답니다!!\n\n⭐️ 호호바 오일 함유\n: 기름은 기름으로 씻어낸다고들 하는데, 저는 오일을 롤링하면 더 트러블이 올라오는 느낌이더라구요. 잘 씻어도 말이죠 ㅠ근데 이 제품은 모공을 막지않는 식물성 오일이라 그런지\n딱히 트러블이 생기지는 않았어요!\n그래서 꾸준히 모공관리에 사용해보려합니다",en:"⭐️Not just cleansing, but also skin barrier protection & soothing!!\n: Cleansing basics covered with jojoba oil and ceramides\nOn top of barrier protection, it finishes with soothing centella asiatica extract and peony root extract — a truly god-tier cleanser, highly recommend\n\n⭐️Mildly acidic & fragrance-free, no added colorants\n: Tested for sensitive skin, so you can use it with peace of mind, and being fragrance-free is a bonus point! Sensitive/delicate skin breaks out from added colorants and fragrance, right, ugh\n\n⭐️Fine, dense foam for thorough cleansing\n: Easy to use with just one pump, and you get plenty of foam without needing to work it up multiple times in your hands.\nThe dense bubbles feel like they gently sweep away everything from every nook of your skin\nMy T-zone is oily while my cheeks and forehead are dry, and it felt like it handled each area appropriately by type. It cleaned off the oily areas thoroughly while cleansing the dry areas in a way that left some moisture behind.\nSo my face didn't feel dry and tight afterward!!\n\n⭐️Contains jojoba oil\n: People say oil dissolves oil, but for me, rolling oil on my face actually tends to bring up more breakouts. Even when I wash it off well, ugh. But with this product, maybe because it's a plant-based oil that doesn't clog pores,\nI didn't really get any breakouts!\nSo I plan to keep using it consistently for pore care.","zh-CN":"⭐️不仅清洁，还兼顾皮肤屏障保护&舒缓!!\n：荷荷巴油、神经酰胺打好清洁基础\n在保护皮肤屏障之外，还用积雪草提取物、牡丹根提取物做舒缓收尾，堪称完美的洁面产品，,,超推荐\n\n⭐️ 弱酸性&无香料无色素\n：经敏感肌测试，可以放心使用,,无香料这点也是加分项！敏感脆弱肌一沾色素和香料就容易长痘对吧ㅠ\n\n⭐️薄而细密的泡沫，清洁得很仔细\n：一次按压就够用，不用在手上另外搓出很多泡沫，这点很好。\n细密的气泡感觉能柔软地清理皮肤每个角落\nT区油、额头和脸颊偏干，这款感觉能针对不同区域分别照顾。油的地方清理得干干净净，干燥的部位则带着水润感清洁。\n所以脸不会干燥紧绷!!\n\n⭐️ 含荷荷巴油\n：都说以油溶油，但我一用油打圈皮肤反而更容易长痘的感觉ㅠ即使洗干净也一样。但这款是不堵塞毛孔的植物油，用了完全没有长痘的情况!\n所以打算持续用来做毛孔管理","zh-TW":"⭐️不只清潔，連皮膚屏障保護&舒緩都顧到！！\n：荷荷芭油、神經醯胺是基本清潔配方\n除了保護皮膚屏障，還加入積雪草萃取物、牡丹根萃取物做舒緩收尾，堪稱完美的潔顏產品，超推薦\n\n⭐️ 弱酸性&無香料無色素\n：經過敏感肌測試，用起來很放心，無香料這點也是加分項！敏感脆弱肌只要有色素和香料就容易長痘痘對吧ㅠ\n\n⭐️薄而細緻的泡沫，仔細清潔\n：一次按壓就能輕鬆使用，不用在手上反覆搓出更多泡沫，泡沫量就已經足夠，這點很喜歡。\n細緻的氣泡感覺能溫柔地把皮膚每個角落都洗乾淨\nT字偏油、臉頰額頭偏乾，這款好像也能依部位分別照顧。油多的地方洗得乾淨清爽，乾燥的部位則保留水潤感清潔。\n所以臉完全不會乾燥緊繃!!\n\n⭐️ 含荷荷芭油\n：大家都說「以油卸油」，但我用油類打圈反而更容易長痘痘，就算洗乾淨也一樣ㅠ但這款可能因為是不阻塞毛孔的植物性油，\n完全沒有長痘痘的情況！\n所以打算持續用來做毛孔管理",ja:"⭐️洗浄はもちろん、肌バリア保護&鎮静まで！！\n：ホホバオイル、セラミドで洗浄は基本\n肌バリア保護にプラスしてツボクサエキス、ボタン根エキスで鎮静力のある仕上がり、まさに完璧なクレンザー…超おすすめ\n\n⭐️弱酸性&無香料無着色\n：敏感肌テスト済みで安心して使用…無香料なのも加点ポイント！敏感肌は色素や香料が入っているとトラブルが出ますよね、涙\n\n⭐️薄くて密な泡でしっかり洗浄\n：1回のポンプで簡単に使えて、手で何度も泡立てなくても十分な泡の量が良かったです。\nきめ細かいバブルが肌の隅々まで優しく落としてくれる感じ\nTゾーンが油っぽく頬やおでこは乾燥しているのですが、部位別にもよく整えてくれる気がしました。油分が多いところはしっかり落としながら乾燥した部位はしっとりとクレンジングしてくれる感じです。\nなので顔が乾燥してつっぱりませんでした！！\n\n⭐️ホホバオイル配合\n：油は油で洗い流すとよく言われますが、私はオイルをローリングするとむしろトラブルが出る感じがするんです。しっかり洗い流してもです、涙。でもこの製品は毛穴を詰まらせない植物性オイルだからか\n特にトラブルは出ませんでした！\nなので継続して毛穴ケアに使ってみようと思います",th:"⭐️ไม่ใช่แค่ทำความสะอาด แต่ปกป้องเกราะผิว&ปลอบประโลมด้วย!!\n: ล้างหน้าพื้นฐานด้วยน้ำมันโฮโฮบา เซราไมด์\nแล้วยังมีสารสกัดใบบัวบก สารสกัดรากโบตั๋นที่ช่วยปลอบประโลมและปกป้องเกราะผิวเพิ่มเติม เป็นคลีนเซอร์ที่สมบูรณ์แบบมาก แนะนำสุดๆ\n\n⭐️ กรดอ่อน & ไม่มีน้ำหอม ไม่มีสี\n: ผ่านการทดสอบกับผิวแพ้ง่ายเลยใช้ได้อย่างอุ่นใจ การไม่มีน้ำหอมก็เป็นคะแนนบวก! ผิวแพ้ง่ายมักเป็นสิวเพราะสีและน้ำหอมใช่ไหมล่ะㅠ\n\n⭐️ฟองบางละเอียดทำความสะอาดได้ทั่วถึง\n: กดปั๊มครั้งเดียวใช้ง่าย ไม่ต้องขยี้ให้ฟองเพิ่มหลายรอบก็ได้ปริมาณฟองที่เพียงพอ\nรู้สึกว่าฟองละเอียดช่วยทำความสะอาดได้ทั่วทุกซอกทุกมุมอย่างนุ่มนวล\nT-zone มันมากแต่แก้มกับหน้าผากแห้ง ก็รู้สึกว่าจัดการได้ดีตามแต่ละจุด บริเวณที่มันก็ล้างออกหมดจด ส่วนที่แห้งก็ทำความสะอาดแบบคงความชุ่มชื้นไว้\nเลยไม่ตึงแห้งเลย!!\n\n⭐️มีน้ำมันโฮโฮบา\n: เขาว่ากันว่าน้ำมันต้องล้างด้วยน้ำมัน แต่ฉันรู้สึกว่ายิ่งนวดคลึงด้วยออยล์ยิ่งเป็นสิวมากขึ้น แม้ล้างสะอาดแล้วก็ตามㅠ แต่ผลิตภัณฑ์นี้อาจเพราะเป็นน้ำมันจากพืชที่ไม่อุดตันรูขุมขน\nเลยไม่เป็นสิวเลย!\nเลยจะลองใช้ดูแลรูขุมขนต่อเนื่องดูค่ะ"},images:[],video:null},
    {id:"Jy7mwaKq",rating:5,skinType:{ko:"지성",en:"Oily","zh-CN":"油皮","zh-TW":"油性肌膚",ja:"脂性肌",th:"ผิวมัน"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"극건성·홍조 등 예민 피부까지 편안, 오일클렌저 트러블 걱정 해소",en:"Comfortable even for very dry/redness-prone sensitive skin, relieved worries about breakouts from oil cleansers","zh-CN":"极干皮·泛红等敏感肌也很舒适，解除对油类洁面导致长痘的顾虑","zh-TW":"極乾性‧泛紅等敏感肌也舒服，解除對油類潔顏會爆痘的擔憂",ja:"極度の乾燥肌・赤みなど敏感な肌にも快適、オイルクレンザーのトラブル心配を解消",th:"สบายผิวแม้ผิวแห้งมาก·ผื่นแดง คลายกังวลเรื่องสิวจากคลีนซิ่งออยล์"},date:"2026-06-18",
      quote:{ko:"오리입처럼 생긴 거품 입구 디자인이 되게 독특해서 처음부터 사용하는 재미가 있었어요. 그리고 거품이 그냥 물 탄 듯 가벼운 느낌이 아니라 크림빵 속 크림처럼 몽글몽글하고 엄청 부드러워서 피부에 닿는 촉감이 정말 좋더라고요. 향도 은은하게 달달한 느낌이 나서 세안할 때 기분이 편안했어요.\n\n세안 후에는 피부가 하나도 당기지 않고 촉촉하게 마무리돼서 오일 보습막이 피부장벽을 감싸주는 느낌이 들었고요. 선크림 정도는 자극 없이 깔끔하게 잘 지워지는데 마무리는 또 개운해서 만족스러웠어요.\n\n전체적으로 민감성 피부나 극건성, 홍조 피부처럼 예민한 피부도 편안하게 사용할 수 있을 것 같은 순한 클렌저라는 인상이 강했고오일 클렌저 쓰면 트러블 날까 걱정하는 편인데 이 제품은 자극 없이 편안하게 사용할 수 있어서 좋았어요. \n\n컬러도 호호바 느낌의 브라운 톤이라 제품 분위기랑 잘 어울렸고 용기 디자인도 깔끔해서 마음에 들었습니다.",en:"The duck-bill-shaped foam nozzle design is quite unique, so it was fun to use from the very start. And the foam isn't a thin, watered-down feel — it's fluffy and super soft like the cream inside a cream bread, so it felt really good against my skin. There was also a subtle sweet scent, which made cleansing feel relaxing.\n\nAfter cleansing, my skin wasn't tight at all and finished feeling moisturized, like an oil-moisture film was wrapping around my skin barrier. It cleaned off sunscreen without irritation, yet still finished with a refreshed feeling — very satisfying.\n\nOverall it gave a strong impression of being a gentle cleanser that even sensitive, very dry, or redness-prone skin could use comfortably, and since I tend to worry about breakouts with oil cleansers, I appreciated being able to use this comfortably without irritation.\n\nThe color also has that jojoba-like brown tone that matched the product's vibe well, and I liked the clean container design too.","zh-CN":"像鸭嘴一样的出泡口设计很特别，从一开始用起来就很有意思。而且泡沫不是那种加了水一样轻飘飘的感觉，而是像面包夹心奶油一样绵密又超级柔软，接触皮肤的触感真的很好。香味也是淡淡的甜味，洗脸的时候心情很放松。\n\n洗后皮肤一点都不紧绷，能水润收尾，感觉油类保湿膜把皮肤屏障包裹住了。防晒程度能无刺激地干净卸掉，收尾又很清爽，很满意。\n\n整体给人的印象是，就算是敏感肌、极干皮、泛红肌这种敏感肤质应该也能舒适使用的温和洁面产品，我本来担心用油类洁面会长痘，但这款用起来无刺激又舒适，很喜欢。\n\n颜色也是荷荷巴风格的棕色调，和产品氛围很搭，瓶身设计也简洁大方，很喜欢。","zh-TW":"出泡口設計得像鴨嘴一樣很特別，從一開始使用就覺得很有趣。而且泡沫不是那種摻水的輕薄感，而是像麵包裡的奶油餡一樣綿密蓬鬆，觸感真的很好。香味也是淡淡的甜味，洗臉時心情很舒服。\n\n洗完臉後皮膚完全不緊繃、水潤收尾，感覺像是油分保濕膜包覆著皮膚屏障。防曬乳程度可以無刺激乾淨卸除，收尾也很清爽，讓我很滿意。\n\n整體來說給人的印象是，敏感肌、極乾性、泛紅肌這類敏感的膚質也能舒服使用的溫和潔顏產品，我本來很擔心用油類潔顏會爆痘，但這款完全不刺激，用起來很舒服。\n\n顏色也是荷荷芭感的棕色調，和產品氛圍很搭，容器設計也簡約，很喜歡。",ja:"アヒルの口のような形の泡の出口デザインがとてもユニークで、最初から使うのが楽しかったです。そして泡がただ水っぽく軽い感じではなく、クリームパンの中のクリームのようにもこもこしてすごく柔らかく、肌に触れる感触が本当に良かったです。香りもほのかに甘い感じがして洗顔するとき気分が落ち着きました。\n\n洗顔後は肌が全くつっぱらずしっとり仕上がって、オイルの保湿膜が肌バリアを包んでくれる感じがしました。日焼け止め程度は刺激なくきれいに落ちるのに、仕上がりはさっぱりしていて満足でした。\n\n全体的に敏感肌や極度の乾燥肌、赤み肌のような敏感な肌も快適に使えそうなマイルドなクレンザーという印象が強く、オイルクレンザーを使うとトラブルが出るか心配な方ですが、この製品は刺激なく快適に使えて良かったです。\n\n色もホホバのようなブラウントーンで製品の雰囲気とよく合っていて、容器のデザインもすっきりしていて気に入りました。",th:"ดีไซน์ปากขวดสำหรับปั๊มฟองที่รูปร่างเหมือนปากเป็ดแปลกดี เลยรู้สึกสนุกตั้งแต่เริ่มใช้เลย แล้วฟองก็ไม่ได้เบาเหมือนผสมน้ำ แต่ฟูนุ่มเหมือนครีมในขนมปังไส้ครีม นุ่มนวลมาก สัมผัสบนผิวดีจริงๆ กลิ่นก็หวานอ่อนๆ ทำให้ล้างหน้าแล้วรู้สึกสบายใจ\n\nหลังล้างหน้าผิวไม่ตึงเลย จบด้วยความชุ่มชื้น รู้สึกเหมือนมีฟิล์มความชุ่มชื้นจากออยล์ห่อหุ้มเกราะผิวไว้ ล้างครีมกันแดดออกได้หมดจดโดยไม่ระคายเคือง แต่จบด้วยความรู้สึกสดชื่น พอใจมาก\n\nโดยรวมให้ความรู้สึกว่าเป็นคลีนเซอร์ที่อ่อนโยนจนผิวแพ้ง่าย ผิวแห้งมาก หรือผื่นแดงก็ใช้ได้อย่างสบายผิว ปกติกังวลว่าคลีนซิ่งออยล์จะทำให้เป็นสิว แต่ตัวนี้ใช้ได้อย่างสบายโดยไม่ระคายเคืองเลย \n\nสีก็เป็นโทนน้ำตาลแบบโฮโฮบา เข้ากับบรรยากาศของผลิตภัณฑ์ดี ดีไซน์ขวดก็เรียบร้อยชอบมากค่ะ"},images:[],video:null},
    {id:"AweOXVKZ",rating:5,skinType:{ko:"지성",en:"Oily","zh-CN":"油皮","zh-TW":"油性肌膚",ja:"脂性肌",th:"ผิวมัน"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"지성/수부지+속건조 민감성, 민감한 날에도 자극 없음",en:"Oily/combination (oily-dehydrated) + inner dryness, sensitive skin — no irritation even on sensitive days","zh-CN":"油皮/水油皮+内干敏感肌，敏感的日子也无刺激","zh-TW":"油性/外油內乾+內在乾燥敏感性，敏感的日子也無刺激",ja:"脂性肌/インナードライ肌+インナードライの敏感肌、敏感な日でも刺激なし",th:"ผิวมัน/ผิวมันขาดน้ำ+ผิวขาดน้ำแพ้ง่าย ไม่ระคายเคืองแม้วันที่ผิวไวต่อสิ่งเร้า"},date:"2026-07-03",
      quote:{ko:"📍피부 타입 : 지성 및 수부지 / 속건조 / 민감성\n\n🤍 사용감\n한 달 정도 사용해봤는데 거품이 정말 촘촘하고 부드러워서 세안할 때 피부 마찰이 거의 없었어요. 젤 좋은건 펌프만 눌러도 풍성한 거품이 나와서 따로 거품을 낼 필요가 없는거!! 이게 실제로 써보면 진짜 편해요.. 민감 피부는 클렌징할때 거품을 왕창 내줘야 하거든요 민감한 날에도 자극 없이 사용할 수 있었습니닷\n\n🤍 세정력\n평소 선크림이나 가벼운 베이스 메이크업은 깔끔하게 잘 지워졌어요. 세안 후에도 잔여감 없이 개운한데 피부가 뽀득하게 마르는 느낌은 아니점이 좋아요. 세정력은 충분하면서도 필요한 유분까지 싹 가져가는 타입은 아니라 속건조가 있는 저한테는 굳\n\n🤍 사용 후 느낌\n세안하고 나서 촉촉하게 마무리되는 느낌이라 기초 바르기 전까지도 피부가 편안했어요. 붉은기나 자극도 없고 매일 사용하기에도 부담이 없어서 손이 자주 가는 느낌\n\n🤍 추천\n-> 세안 후 당김 심한 사람 추천!\n-> 민감성, 속건조 피부도 부담 없이 사용 가능\n-> 풍성한 거품 좋아하는 사람 만족할 듯\n-> 데일리 클렌저 찾는 사람 추천\n-> 재구매 의사 ○",en:"📍Skin type: Oily and combination (oily-dehydrated) / dehydrated / sensitive\n\n🤍 Feel during use\nI used it for about a month, and the foam is really fine and soft, so there was almost no friction while cleansing. The best part is that rich foam comes out with just the pump, so you don't need to build up lather separately!! This is genuinely convenient once you actually try it. Sensitive skin needs plenty of foam when cleansing, so I could use it without irritation even on sensitive days\n\n🤍 Cleansing power\nIt cleaned off sunscreen and light base makeup thoroughly. No residue left after cleansing and it feels refreshing, but it's not that squeaky-dry feeling, which I like. The cleansing power is sufficient without stripping away the oils I need, which is great for me since I have inner dryness\n\n🤍 Feel after use\nAfter cleansing, it finishes moisturized, so my skin felt comfortable even before applying skincare. No redness or irritation, and it feels burden-free for everyday use, so my hand keeps reaching for it\n\n🤍 Recommend\n-> Recommended for people who get bad tightness after cleansing!\n-> Sensitive/dehydrated skin can use it without worry\n-> People who love rich foam will be satisfied\n-> Recommended for those looking for a daily cleanser\n-> Would repurchase: yes","zh-CN":"📍肤质：油性及水油皮/内干/敏感性\n\n🤍 使用感\n用了大概一个月，泡沫真的很细密柔软，洗脸时皮肤摩擦感很少。最好的是只要按压泵头蓬松的泡沫就出来了，不用另外打泡！！实际用起来真的很方便……敏感肌洗脸就是要打出大量泡沫才行，敏感的日子用也没有刺激感。\n\n🤍 清洁力\n平时的防晒或轻底妆都能干净卸掉。洗后也没有残留感，很清爽，但又不是那种洗到吱吱响的感觉，这点很好。清洁力足够，但又不会把必要的油分都带走，对我这种内干的人来说正合适\n\n🤍 使用后的感觉\n洗完之后水润收尾，涂基础护肤品之前皮肤也很舒适。没有泛红或刺激，每天用也没有负担，会经常用\n\n🤍 推荐\n-> 推荐给洗后紧绷严重的人！\n-> 敏感性、内干肌肤也能无负担使用\n-> 喜欢蓬松泡沫的人应该会满意\n-> 推荐给正在找日常洁面产品的人\n-> 回购意愿 有","zh-TW":"📍膚質：油性及外油內乾／內在乾燥／敏感性\n\n🤍 使用感\n用了大約一個月，泡沫真的很細緻柔軟，洗臉時皮膚幾乎沒有摩擦感。最棒的是只要按壓就會有豐盈泡沫出來，不用另外起泡！！實際用起來真的很方便……敏感肌洗臉時需要打出大量泡沫，敏感的日子也能無刺激使用。\n\n🤍 潔淨力\n平常擦的防曬乳或淡底妝都能卸得很乾淨。洗完臉後也沒有殘留感、很清爽，但不會有那種咕溜咕溜乾到過頭的感覺，這點很喜歡。潔淨力足夠，但不是那種連必要油分都會被帶走的類型，對內在乾燥的我來說很不錯\n\n🤍 使用後感受\n洗完臉後水潤收尾，做基礎保養前皮膚也很舒服。沒有泛紅或刺激，每天使用也沒有負擔，會經常想用\n\n🤍 推薦\n-> 推薦給洗完臉常常很緊繃的人！\n-> 敏感性、內在乾燥肌也能無負擔使用\n-> 喜歡豐盈泡沫的人應該會滿意\n-> 推薦給正在找日常潔顏產品的人\n-> 回購意願 ○",ja:"📍肌タイプ：脂性肌及びインナードライ肌/インナードライ/敏感肌\n\n🤍使用感\n1ヶ月ほど使ってみましたが、泡が本当にきめ細かく柔らかいので洗顔するとき肌への摩擦がほとんどありませんでした。一番良いのはポンプを押すだけで豊かな泡が出てくるので、別に泡立てる必要がないこと！！これ実際に使ってみると本当に楽です…敏感肌はクレンジングするとき泡をたっぷり作らないといけないんですよね。敏感な日でも刺激なく使うことができました\n\n🤍洗浄力\n普段日焼け止めや軽めのベースメイクはきれいに落ちました。洗顔後も残留感なくさっぱりするのに肌がキュッキュッと乾く感じではないのが良いです。洗浄力は十分でありながら必要な油分まで根こそぎ持っていくタイプではないので、インナードライのある私にはグッド\n\n🤍使用後の感じ\n洗顔した後しっとり仕上がる感じで、スキンケアをつける前も肌が快適でした。赤みや刺激もなく毎日使うのにも負担がなく手が伸びる感じ\n\n🤍おすすめ\n->洗顔後のつっぱりがひどい人におすすめ！\n->敏感肌、インナードライ肌も気兼ねなく使用可能\n->豊かな泡が好きな人は満足しそう\n->デイリークレンザーを探している人におすすめ\n->リピート意向○",th:"📍ประเภทผิว : ผิวมันและผิวมันขาดน้ำ / ผิวขาดน้ำ / แพ้ง่าย\n\n🤍 ความรู้สึกเมื่อใช้\nใช้มาประมาณหนึ่งเดือนแล้ว ฟองละเอียดและนุ่มนวลมาก แทบไม่มีแรงเสียดสีตอนล้างหน้าเลย ที่ชอบที่สุดคือแค่กดปั๊มก็ได้ฟองฟูทันที ไม่ต้องตีฟองเพิ่ม!! พอลองใช้จริงสะดวกมากจริงๆ.. ผิวแพ้ง่ายต้องตีฟองให้เยอะๆ ตอนล้างหน้า แต่ตัวนี้ใช้ได้โดยไม่ระคายเคืองแม้วันที่ผิวไวต่อสิ่งเร้าค่ะ\n\n🤍 แรงทำความสะอาด\nปกติล้างครีมกันแดดหรือเมคอัพเบสเบาๆ ออกได้หมดจดดี หลังล้างหน้าก็สดชื่นไม่มีคราบตกค้าง แต่ผิวไม่แห้งจนสะอาดเอี๊ยดเกินไป ชอบจุดนี้ แรงทำความสะอาดเพียงพอแต่ไม่ล้างไขมันที่จำเป็นออกไปหมด เหมาะกับคนผิวขาดน้ำแบบฉันมาก\n\n🤍 ความรู้สึกหลังใช้\nหลังล้างหน้าจบด้วยความชุ่มชื้น ผิวสบายแม้ก่อนทาสกินแคร์ ไม่มีรอยแดงหรือระคายเคือง ใช้ทุกวันก็ไม่มีภาระ เลยหยิบใช้บ่อย\n\n🤍 แนะนำสำหรับ\n-> คนที่ตึงมากหลังล้างหน้า!\n-> ผิวแพ้ง่าย ผิวขาดน้ำ ก็ใช้ได้ไม่มีภาระ\n-> คนที่ชอบฟองฟูน่าจะพอใจ\n-> คนที่กำลังหาคลีนเซอร์ประจำวัน\n-> ตั้งใจซื้อซ้ำ ○"},images:[],video:null},
    {id:"JR786L6Z",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"민감·건성+여름철 속건조, 트러블 걱정에도 자극 없었음",en:"Sensitive/dry + summer inner dryness, no irritation even with breakout concerns","zh-CN":"敏感·干皮+夏季内干，担心长痘但实际无刺激","zh-TW":"敏感‧乾性+夏季內在乾燥，即使擔心爆痘也完全無刺激",ja:"敏感・乾燥肌+夏場のインナードライ、トラブルの心配をよそに刺激なし",th:"แพ้ง่าย·ผิวแห้ง+ผิวขาดน้ำหน้าร้อน กังวลเรื่องสิวแต่ไม่ระคายเคืองเลย"},date:"2026-07-03",
      quote:{ko:"제 피부는 평소엔 민감성에 건성이고 여름엔 속건조 살짝 있는 중성정도입니다.\n\n평소 폼클렌징을 고를땐 저자극, 수분감, 세정력을 꼭 신경써서 봐요.\n\n최근 낮날씨가 부쩍 더워지면서 피부에 트러블이 생기며 클렌징에 더 신경쓰게 되는데 이 제품을 처음 받아봤을때 오일성분이 있는 폼이라 트러블에 자극있지 않을지 조금 걱정이었어요.\n\n우선 오전에 이 제품으로 세안 후 토너를 바로 사용하지않고 조금 있어봤는데 당김이 없어서 놀랐어요. 원래 쓰고있던 제품도 수분감있는 제품이라해서 구매했는데 세안 후 약간의 당김은 있어서 어쩔 수 없나보다 생각하던 차에 이 제품 사용해보니 당김이 없어 너무 마음에 들더라고요. \n그리고 트러블에 자극이 없는 점도 좋았습니다.진정이 된다기보단 더 자극하지 않는 쪽에 가까운거 같았어요.\n\n오후에 메이크업 지울때도 사용해봤는데 확실히 단독으로 사용하기엔 세정력이 조금 약한편이었어요. 대신 1차 클렌징하고 2차에 사용해보니 세정력이 좋더라고요. 피부에 잔여감도 없고 토너패드로 피부정리할때도 깔끔했습니다.\n\n전 오전, 오후 클렌징제품을 다르게 사용하는데 이 제품은 오전 오후 다 쓰기 좋은제품인거 같아요.\n\n 그리고 개인적으로 향에 많이 민감한편은 아닌데 이 제품 향을 맡아보면 약간 오일향?같은게 은은하게 나는데 향이 남는건 아니고 의식하지 않으면 잘 모를정도였습니다.\n\n사용할 때 따로 손에 롤링 안하고 몇 번 섞은 후 펌핑해서 사용하면되는 부분이 편하게 느껴졌어요. 거품도 쫀쫀하니 밀도있어서 피부에 자극없는점도 좋았습니다.",en:"My skin is normally sensitive and dry, and gets slight inner dryness in summer, so I'd say it's mildly neutral.\n\nWhen picking a foam cleanser, I always pay attention to gentleness, moisture, and cleansing power.\n\nAs the daytime weather has gotten noticeably hotter recently, my skin has been breaking out, so I've become more careful with cleansing. When I first received this product, since it's a foam with oil in it, I was a bit worried it might irritate my breakouts.\n\nFirst, I cleansed with this in the morning and waited a bit before applying toner instead of right away, and I was surprised there was no tightness. The product I was using before was also supposed to be moisturizing, but there was always some tightness after cleansing, so I figured that was just unavoidable — but using this one, there was no tightness, which I really loved.\nAnd it also didn't irritate my breakouts, which was great. It's less about soothing and more about just not irritating things further, I felt.\n\nI also used it to remove makeup in the afternoon, and it's definitely a bit weak on cleansing power used alone. But using it as a second cleanse after a first cleanse, the cleansing power was good. No residue on the skin, and it left things clean when using toner pads afterward too.\n\nI usually use different products for morning and afternoon cleansing, but this product seems good for both.\n\nAlso, personally I'm not that sensitive to scent, but when I smell this product there's a faint oil-like scent, though it doesn't linger — you barely notice it unless you're paying attention.\n\nI liked that you don't need to roll it in your hands separately — just mix it a few times and pump it out for use. The foam was also springy and dense, so it felt gentle on the skin too.","zh-CN":"我的皮肤平时是偏敏感的干性，夏天会有点轻微内干，算是中性偏干。\n\n平时挑洁面泡沫一定会看低刺激、水润感、清洁力这几项。\n\n最近白天天气变热，皮肤开始长痘，所以对洁面更加在意，第一次拿到这款产品时，因为是含油成分的泡沫，有点担心会不会刺激长痘的部位。\n\n首先早上用这款洁面之后没有马上用化妆水，等了一会儿，发现完全不紧绷，很惊讶。之前用的产品也是标榜水润，买了之后发现洗完还是会有点紧绷，觉得可能没办法避免，结果这款完全不紧绷，很满意。\n而且对长痘部位也没有刺激感，与其说是舒缓，更像是不会额外刺激的感觉。\n\n下午卸妆时也试了一下，单独使用清洁力确实偏弱。不过先做一次清洁再用这款做二次清洁，清洁力就很不错了。皮肤没有残留感，用化妆水棉片整理皮肤时也很干净。\n\n我早晚用的清洁产品不一样，这款感觉早晚都适合用。\n\n另外我个人不算对香味很敏感的人，闻这款有点像淡淡的油类香味，但不会残留，不刻意去闻的话几乎感觉不到。\n\n使用时不用先在手上打圈，只需搅拌几下再按压使用，这点很方便。泡沫也紧实有密度，对皮肤没有刺激，这点也很喜欢。","zh-TW":"我的皮膚平常是敏感性偏乾性，夏天會有輕微內在乾燥的中性肌。\n\n平常挑洗面乳時我一定會注意低刺激、水潤感、潔淨力這幾點。\n\n最近白天天氣變熱，皮膚開始長痘痘，讓我更在意清潔產品，第一次收到這款時，因為是含油成分的泡沫，有點擔心會不會刺激到痘痘。\n\n首先早上用這款洗完臉後，我沒有馬上用化妝水，等了一下，發現完全不緊繃，讓我很驚訝。我原本用的產品也標榜水潤，但洗完臉多少還是有點緊繃，本來以為這是無可避免的，用了這款之後完全不緊繃，真的很喜歡。而且對痘痘也沒有刺激，與其說是舒緩，更像是不會額外刺激的感覺。\n\n下午卸妝時也試用了，單獨使用時潔淨力確實稍弱一點。不過先做一次清潔、再用這款做二次清潔，潔淨力就很不錯。皮膚沒有殘留感，用化妝水棉片整理肌膚時也很乾淨。\n\n我平常早上和下午會用不同的清潔產品，但這款早晚都適合用。\n\n而且我個人對香味不算特別敏感，但這款聞起來有點像淡淡的油香，不過不會殘留香味，不特別注意的話幾乎感覺不到。\n\n使用時不用特地在手上打圈，混合幾下再按壓使用就很方便。泡沫也紮實有密度，皮膚無刺激這點也很喜歡。",ja:"私の肌は普段敏感肌で乾燥肌、夏は少しインナードライがある普通肌くらいです。\n\n普段洗顔フォームを選ぶときは低刺激、水分感、洗浄力を必ず気にして見ます。\n\n最近日中の気温がぐっと暑くなって肌にトラブルが出て、クレンジングにより気を使うようになったのですが、この製品を初めて受け取ったとき、オイル成分があるフォームなのでトラブルに刺激がないか少し心配でした。\n\nまず午前中にこの製品で洗顔した後、化粧水をすぐつけずに少し置いてみましたが、つっぱりがなくて驚きました。もともと使っていた製品も水分感がある製品だと聞いて購入したのですが、洗顔後に少しつっぱりがあって仕方ないのかなと思っていたところ、この製品を使ってみたらつっぱりがなくてとても気に入りました。\nそしてトラブルに刺激がない点も良かったです。鎮静されるというよりさらに刺激しない方に近い感じでした。\n\n午後にメイクを落とすときも使ってみましたが、確かに単独で使うには洗浄力が少し弱めでした。代わりに1回目のクレンジングをして2回目に使ってみると洗浄力が良かったです。肌に残留感もなく、化粧水パッドで肌を整えるときもすっきりしていました。\n\n私は午前、午後でクレンジング製品を変えて使いますが、この製品は午前午後どちらも使うのに良い製品だと思います。\n\n それから個人的に香りにあまり敏感な方ではないですが、この製品の香りを嗅ぐと少しオイルの香り?のようなものがほのかにしますが、香りが残るわけではなく、意識しなければあまり分からない程度でした。\n\n使うとき別に手でローリングせず、何回か混ぜた後ポンプして使えば良い部分が楽に感じました。泡もとろみがあって密度があるので肌に刺激がない点も良かったです。",th:"ผิวของฉันปกติแพ้ง่ายและแห้ง ส่วนหน้าร้อนจะเป็นผิวธรรมดาที่ขาดน้ำนิดหน่อย\n\nปกติเลือกโฟมล้างหน้าโดยดูเรื่องความอ่อนโยน ความชุ่มชื้น และแรงทำความสะอาดเป็นหลัก\n\nช่วงนี้อากาศกลางวันร้อนขึ้นมาก ผิวเริ่มเป็นสิวเลยต้องใส่ใจเรื่องคลีนซิ่งมากขึ้น ตอนแรกที่ได้ผลิตภัณฑ์นี้มา กังวลนิดหน่อยว่าเป็นโฟมที่มีส่วนผสมของออยล์จะระคายเคืองผิวที่เป็นสิวหรือเปล่า\n\nอันดับแรกลองล้างหน้าตอนเช้าด้วยผลิตภัณฑ์นี้แล้วไม่รีบทาโทนเนอร์ทันที รอดูสักพัก ปรากฏว่าไม่ตึงเลย แปลกใจมาก ผลิตภัณฑ์เดิมที่ใช้ก็ซื้อเพราะบอกว่าชุ่มชื้น แต่หลังล้างหน้าก็ยังมีตึงนิดหน่อยอยู่ดี คิดว่าคงหลีกเลี่ยงไม่ได้ แต่พอใช้ตัวนี้แล้วไม่ตึงเลย ถูกใจมากจริงๆ \nแล้วก็ชอบที่ไม่ระคายเคืองสิวด้วย ไม่ถึงกับปลอบประโลม แต่เหมือนไม่ไปกระตุ้นเพิ่มมากกว่า\n\nตอนบ่ายลองใช้ล้างเมคอัพด้วย พบว่าถ้าใช้เดี่ยวๆ แรงทำความสะอาดค่อนข้างอ่อนไปหน่อย แต่พอล้างหน้าครั้งแรกก่อนแล้วใช้ตัวนี้ล้างครั้งที่สอง แรงทำความสะอาดดีมาก ไม่มีคราบตกค้างบนผิว ตอนใช้โทนเนอร์แพดเช็ดผิวก็สะอาดหมดจด\n\nปกติฉันใช้ผลิตภัณฑ์คลีนซิ่งต่างกันระหว่างเช้ากับบ่าย แต่ตัวนี้ใช้ได้ดีทั้งเช้าและบ่ายเลย\n\n แล้วส่วนตัวไม่ค่อยแพ้กลิ่นง่ายนัก แต่ดมกลิ่นผลิตภัณฑ์นี้แล้วมีกลิ่นออยล์อ่อนๆ นิดหน่อย ไม่ค่อยติดกลิ่น ถ้าไม่ตั้งใจดมก็แทบไม่รู้สึก\n\nตอนใช้ไม่ต้องตีฟองในมือแยก แค่ผสมนิดหน่อยแล้วปั๊มใช้ได้เลย รู้สึกสะดวกดี ฟองก็หนึบแน่นดี ไม่ระคายเคืองผิวด้วย"},images:[],video:null},
    {id:"Jvew9d0A",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"예민+건성, 타 버블클렌저(A사·I사)와 비교 후 만족",en:"Sensitive + dry skin, satisfied after comparing with other bubble cleansers (Brand A, Brand I)","zh-CN":"敏感+干皮，对比其他家（A公司、I公司）气泡洁面后满意","zh-TW":"敏感+乾性，與A牌、I牌氣泡潔顏乳比較後感到滿意",ja:"敏感+乾燥肌、他社バブルクレンザー(A社・I社)と比較して満足",th:"แพ้ง่าย+ผิวแห้ง เปรียบเทียบกับบับเบิลคลีนเซอร์ยี่ห้ออื่น (A, I) แล้วพอใจ"},date:"2026-05-20",
      quote:{ko:"노마디아 골든 호호바 10% 듀얼 마이크로 버블클렌저! 🏆🫧\n\n예민한 피부+건성에 세안을 자주해서 클렌저 중요하게 생각합니다. 버블타입선호해서 (피부자극이 가장 없음) 사용중인 A사, I사랑 비교하며 사용해보았어요. 피부상태에 따라서 선택해서 사용하는데요. 아침에는 가장 순한 제품으로해요. 물세수가 좋다고 하지만 개운하지 않고 찝찝하여 아침부터 저녁까지 클렌저가 필수고 약산성이어야합니다. \n\n이 제품 사용해보니 전체적으로  성분✔️ 사용감✔️ 패키지✔️ 모두 다 만족스럽습니다. 👏\n\n호호바오일이 10%나 들어있어서 그런지 세안 후 촉촉하고, 약산성에 가까운지라 건조하지 않아서 가장 좋았습니다. 세안시 향은 거의 무향에 가까워서 거슬리는 점이 없었고 펌핑도 잘 되고 거품도 쫀쫀하고 좋아요. 이지워시 선크림을 바른 후에는 단독으로 이 제품만으로 세정해도 잘 지워지고. 유기자차 썬크림이나 메이크업후에는 1차로 클렌징밀크를 쓰고 그 후에 사용하기에도 적절합니다. 유기자차선크림을 바른 후 1차세안으로 바로 세안해봤는데 유화과정을 꼼꼼히 거치고 사용하니 잘 지워지긴 하는데 아주 약간은 남는 것 같아서, 아침에 쌩얼로 촉촉하게 순하게 사용하기에 가장 좋고! 2차세안용으로도 아주 좋습니다. 클렌저에 까다로운 편인데 이 제품 사용해보니 마음에 들어요. \n\n세안하고 거의 바로 토너미스트를 뿌리는데, 잠깐 기다리는 시간이 있어도 심하게 건조해 지지 않았어요. 호호바 오일 성분이 많이 들어있는 것이 이 제품의 장점!!! 🧴✨✨\n극건성, 건성에게 가장 추천하고 더워지는 날씨에는 자주 씻게 되니 피부가 건조해져서 장벽이 무너지지 않도록 중성 복합성도 괜찮을 것 같습니다. \n\n이 제품 아주 좋아요. 💛💛💛💛💛",en:"NOMADIA Golden Jojoba 10% Dual Micro Bubble Cleanser! 🏆🫧\n\nI have sensitive + dry skin and cleanse frequently, so cleanser matters a lot to me. I prefer bubble-type cleansers (least irritating to skin), so I compared it while using Brand A and Brand I, which I currently use. I choose based on my skin condition — in the morning I use the gentlest product. People say washing with just water is good, but it doesn't feel clean and leaves things feeling off, so a cleanser is essential morning through night, and it has to be mildly acidic.\n\nAfter using this product, I was overall satisfied with the ingredients✔️ feel of use✔️ and packaging✔️. 👏\n\nMaybe because it contains 10% jojoba oil, my skin felt moisturized after cleansing, and being close to mildly acidic, it wasn't drying, which I loved most. The scent while cleansing is close to fragrance-free, so nothing bothered me, the pump works well, and the foam is springy and nice too. After applying Easy-Wash sunscreen, this product alone cleanses it off well. After organic/mineral sunscreen or makeup, it's also appropriate to use as a second cleanse after a cleansing milk first. I tried using it as a single first cleanse after organic/mineral sunscreen, and going through the emulsifying process thoroughly does get it off, but it feels like just a tiny bit remains — so it's best for using bare-faced in the morning, moisturized and gentle, and it's also great as a second-cleanse product. I'm picky about cleansers, but I really like this one.\n\nI spray toner mist right after cleansing, and even with a bit of waiting time, it didn't get severely dry. The high jojoba oil content is this product's strength!!! 🧴✨✨\nMost recommended for very dry to dry skin, and since you wash your face more often as it gets hotter, this could also be good for neutral/combination skin so the barrier doesn't break down from dryness.\n\nThis product is really great. 💛💛💛💛💛","zh-CN":"NOMADIA金色荷荷巴10%双重微气泡洁面！🏆🫧\n\n我是敏感肌+干皮，洗脸次数多，所以很看重洁面产品。喜欢气泡类型（对皮肤刺激最小），一直在和现在用的A公司、I公司的产品做对比。会根据皮肤状态选择使用。早上用最温和的产品。虽然都说清水洗脸好，但那样不够清爽还有点不适，从早到晚洁面产品都不能少，而且必须是弱酸性。\n\n用了这款之后，整体上成分✔️使用感✔️包装✔️都很满意。👏\n\n可能是荷荷巴油含量高达10%，洗后很水润，接近弱酸性，所以不干燥，这点最喜欢。洗脸时几乎闻不到香味，没有让人不适的地方，泵头也很好按，泡沫也紧实好用。用了物理防晒之后单独用这款清洁也能洗干净。用了有机防晒或化妆之后先用洁面乳做一次清洁，再用这款也很合适。试过直接用这款做一次清洁卸有机防晒，仔细乳化后也能洗干净，但会有一点点残留，所以早上素颜时用这款水润温和地清洁最合适！用作二次清洁也很好。我对洁面产品比较挑剔，用了这款觉得很满意。\n\n洗完脸后我几乎立刻喷化妆水喷雾，就算稍微等一下皮肤也没有严重干燥。荷荷巴油含量高是这款产品的优点!!!🧴✨✨\n最推荐给极干皮、干皮，天气变热之后洗脸次数增多，皮肤容易干燥导致屏障崩溃，中性、混合性肌肤应该也适合。\n\n这款真的很好用。💛💛💛💛💛","zh-TW":"NOMADIA金盞荷荷芭10%雙重微氣泡潔顏乳！🏆🫧\n\n我是敏感肌+乾性，經常洗臉，所以很重視潔顏產品。偏好氣泡型（對皮膚刺激最少），跟正在用的A牌、I牌做了比較。依膚況選擇使用，早上用最溫和的產品。雖然有人說用清水洗臉最好，但總覺得洗不乾淨、有點不舒服，所以早晚都需要潔顏產品，而且一定要是弱酸性。\n\n用了這款之後，整體來說成分✔️使用感✔️包裝✔️都很滿意。👏\n\n可能因為含有10%荷荷芭油，洗完臉水潤，接近弱酸性所以不乾燥，這點我最喜歡。洗臉時香味幾乎接近無香，沒有不舒服的地方，出泡也順暢，泡沫紮實好用。擦完Easy Wash防曬乳後單獨用這款就能洗乾淨。用有機防曬乳或化妝之後，先用卸妝乳再接著用這款也很合適。擦完有機防曬乳直接用這款做一次清潔，仔細做完乳化過程也能洗乾淨，但好像會有一點點殘留，所以早上素顏水潤溫和地使用最好！當二次清潔用也非常好。我對潔顏產品很挑剔，但這款用起來很滿意。\n\n洗完臉幾乎馬上就噴化妝水噴霧，就算稍微等一下也不會太乾燥。含有大量荷荷芭油成分是這款產品的優點!!!🧴✨✨\n最推薦極乾性、乾性肌，天氣變熱時洗臉頻率增加，中性、混合性肌膚為了避免屏障崩壞也應該很適合。\n\n這款產品真的很棒。💛💛💛💛💛",ja:"NOMADIAゴールデンホホバ10%デュアルマイクロバブルクレンザー！🏆🫧\n\n敏感肌+乾燥肌でよく洗顔するのでクレンザーを重視しています。バブルタイプが好きで(肌刺激が一番少ない)使用中のA社、I社と比較しながら使ってみました。肌状態に合わせて選んで使っています。朝は一番マイルドな製品にします。水洗顔が良いと言いますが、すっきりせずべたつくので朝から夜までクレンザーは必須で、弱酸性でないといけません。\n\nこの製品を使ってみたところ、全体的に成分✔️使用感✔️パッケージ✔️すべて満足です。👏\n\nホホバオイルが10%も入っているからか洗顔後しっとりしていて、弱酸性に近いので乾燥せず、これが一番良かったです。洗顔時の香りはほぼ無香に近くて気になる点がなく、ポンプもよく出て泡もとろみがあって良いです。イージーウォッシュ日焼け止めを塗った後は単独でこの製品だけで洗浄してもよく落ち、有機系日焼け止めやメイク後は1回目にクレンジングミルクを使ってその後に使うのにも適しています。有機系日焼け止めを塗った後1回目の洗顔ですぐ洗顔してみましたが、乳化プロセスを丁寧に経て使うとよく落ちるものの、ほんの少し残る感じがしたので、朝のすっぴんにしっとりマイルドに使うのに一番良く！2回目の洗顔用としてもとても良いです。クレンザーにはうるさい方ですが、この製品を使ってみて気に入りました。\n\n洗顔してほぼすぐトナーミストをかけますが、少し待つ時間があってもひどく乾燥しませんでした。ホホバオイル成分がたくさん入っているのがこの製品の長所！！！🧴✨✨\n極度の乾燥肌、乾燥肌に一番おすすめで、暑くなる季節には頻繁に洗うことになるので肌が乾燥してバリアが崩れないように普通肌・混合肌にも良さそうです。\n\nこの製品とても良いです。💛💛💛💛💛",th:"โกลเด้นโฮโฮบา 10% ดูอัลไมโครบับเบิลคลีนเซอร์ของโนมาเดีย! 🏆🫧\n\nฉันเป็นผิวแพ้ง่าย+ผิวแห้งที่ล้างหน้าบ่อย เลยให้ความสำคัญกับคลีนเซอร์มาก ชอบแบบบับเบิล (ระคายเคืองผิวน้อยที่สุด) เลยเปรียบเทียบกับที่ใช้อยู่ของแบรนด์ A กับแบรนด์ I ดู เลือกใช้ตามสภาพผิว ตอนเช้าจะใช้ตัวที่อ่อนโยนที่สุด แม้ล้างด้วยน้ำเปล่าจะดีแต่ไม่รู้สึกสะอาดพอ เลยต้องใช้คลีนเซอร์ทั้งเช้าและเย็น และต้องเป็นกรดอ่อนด้วย \n\nพอลองใช้ผลิตภัณฑ์นี้แล้ว โดยรวมทั้งส่วนผสม✔️ ความรู้สึกเมื่อใช้✔️ บรรจุภัณฑ์✔️ พอใจทุกอย่างเลยค่ะ👏\n\nอาจเพราะมีน้ำมันโฮโฮบาถึง 10% หลังล้างหน้าชุ่มชื้น แล้วเป็นกรดอ่อนใกล้เคียงผิวเลยไม่แห้ง ชอบที่สุด ตอนล้างหน้ากลิ่นแทบไม่มีเลยไม่รบกวนใจ ปั๊มก็ใช้งานได้ดี ฟองก็หนึบดี ถ้าทาแค่ครีมกันแดดอีซี่วอชก็ใช้ตัวนี้อย่างเดียวล้างออกได้หมดจด ส่วนครีมกันแดดออร์แกนิกหรือหลังแต่งหน้าก็เหมาะกับใช้คลีนซิ่งมิลค์ก่อนแล้วตามด้วยตัวนี้ ลองล้างหน้าครั้งแรกด้วยตัวนี้เลยหลังทาครีมกันแดดออร์แกนิก ทำอิมัลชันอย่างละเอียดแล้วก็ล้างออกได้ดี แต่ดูเหมือนจะมีเหลือนิดหน่อย เลยเหมาะที่สุดสำหรับใช้ตอนเช้าหน้าเปล่าแบบอ่อนโยนชุ่มชื้น! และใช้เป็นการล้างหน้าครั้งที่สองก็ดีมากด้วย ปกติเลือกคลีนเซอร์ค่อนข้างจู้จี้ แต่พอใจกับตัวนี้มากค่ะ \n\nล้างหน้าเสร็จก็ฉีดโทนเนอร์มิสต์เกือบทันที แต่แม้จะรอสักพักก็ไม่แห้งมาก มีน้ำมันโฮโฮบาเยอะเป็นข้อดีของผลิตภัณฑ์นี้!!! 🧴✨✨\nแนะนำที่สุดสำหรับผิวแห้งมากหรือผิวแห้ง แล้วช่วงอากาศร้อนที่ต้องล้างหน้าบ่อยจนผิวแห้งและเกราะผิวพัง ผิวธรรมดาหรือผิวผสมก็น่าจะใช้ได้ดีเช่นกัน \n\nผลิตภัณฑ์นี้ดีมากๆ ค่ะ 💛💛💛💛💛"},images:[],video:null},
    {id:"J5zw62aZ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"평범 피부, 눈에 거품 들어가도 무자극 (기존 제품은 따가웠음)",en:"Normal skin, no irritation even when foam gets in eyes (previous product used to sting)","zh-CN":"普通肌，泡沫入眼也无刺激（原用产品会刺痛）","zh-TW":"普通肌膚，泡沫入眼也不刺激（原本用的產品會刺痛）",ja:"普通の肌、泡が目に入っても無刺激(以前の製品は染みていた)",th:"ผิวทั่วไป แม้ฟองเข้าตาก็ไม่ระคายเคือง (ผลิตภัณฑ์เดิมเคยแสบตา)"},date:"2026-06-18",
      quote:{ko:"노마디아 골든 호호바 듀얼 마이크로 버블 클렌저를 2주동안 꾸준히 사용해 보았습니다\n \n제품 외형은 따뜻한 노란 빛이 도는 펌핑형 용기에 거품층과 오일층이 분리되어있어요💛\n\n사용 시 잘 흔들어 주세요🫨\n펌핑을 하면 부드럽고 조밀한 거품이 \n형성되는데 거품을 따로  낼 필요가 없어서 \n피부에 자극이 덜 가요☁️  \n\n향은 무향에 가깝다고 볼 수 있어요 \n향은 워낙 호불호가 갈리기 때문에 \n저는 오히려 무향을 선호해서 마음에 들었어요  \n\n저는 평소에 화장을 거의 하지않고 \n선크림만 바르고 다니는데요 선크림은 잘 안지워져서 2중 세안을 항상 하는데 \n이 제품은 한 번의 클렌징만으로도 세정이 잘 되더라고요🌊 \n\n체감상 가장 바로 느낄 수 있던 점은 \n세안 후 당김이 없고 \n피부가 촉촉해져서 좋았어요 \n피부장벽 강화와 유수분 밸런스에 \n도움을 주는 호호바 오일이 들어 있어서 \n피부 수분 손실을 줄여주는것 같아요🥥\n\n기존에 사용하던 폼 클렌징은 눈에 거품이 들어가면 따가워서  눈에 통증이 있었는데  노마디아 클렌징은 눈에 거품이 들어가도 \n자극이 없었어요☺️\n\n또한 세안 후 피부가 한 톤 환해져서 \n개인적으로 재 구매하고 싶은 제품입니다  \n\n노마디아 브랜드는 민감성 피부를 갖고 계신 분들을 기준으로 만든 화장품이더라고요 \n자극이 적고 성분도 좋기 때문에 민감성이신 분들을 물론 저처럼 평범한 피부를 갖고 계신 분들에게 잘 맞을것 같아요  \n\n이 클렌징 제품은 건성이신 분들과 \n수부지 지성 분들에게  추천합니다😘",en:"I used the NOMADIA Golden Jojoba Dual Micro Bubble Cleanser consistently for 2 weeks\n\nThe product exterior is a warm yellow-toned pump bottle with the foam layer and oil layer separated💛\n\nBe sure to shake well before use🫨\nWhen you pump it, soft, dense foam forms,\nso you don't need to work up foam separately,\nwhich means less irritation to the skin☁️\n\nThe scent is close to fragrance-free.\nScent preferences vary so much,\nso I actually prefer fragrance-free, which I liked\n\nI usually don't wear makeup and just wear sunscreen, and sunscreen doesn't come off easily so I always double-cleanse, but this product cleansed it off well with just one cleanse🌊\n\nWhat I could feel most immediately was\nno tightness after cleansing\nand my skin felt moisturized, which I loved.\nIt contains jojoba oil, which helps strengthen the skin barrier and oil-moisture balance,\nso it seems to help reduce moisture loss from the skin🥥\n\nThe foam cleanser I used before would sting my eyes painfully if foam got in them, but with NOMADIA's cleanser, even when foam got in my eyes,\nthere was no irritation☺️\n\nAlso, my skin looked one shade brighter after cleansing,\nso personally I want to repurchase this product\n\nI found out that the NOMADIA brand makes cosmetics with sensitive skin as the baseline standard.\nIt has low irritation and good ingredients, so it seems to suit not just those with sensitive skin, but also people with normal skin like me\n\nI'd recommend this cleansing product\nfor those with dry skin, as well as\ncombination (oily-dehydrated) and oily skin types too😘","zh-CN":"连续两周持续使用了NOMADIA金色荷荷巴双重微气泡洁面\n \n产品外观是温暖黄色调的泵头瓶，泡沫层和油层是分离的💛\n\n使用前请充分摇匀🫨\n按压后会形成柔软细密的泡沫，\n不用另外打泡，\n对皮肤的刺激更小☁️  \n\n香味几乎接近无香。\n香味这种东西本来就见仁见智，\n我反而喜欢无香，很满意 \n\n我平时几乎不化妆，\n只涂防晒出门，防晒不太好卸所以一直做双重清洁，\n这款只用一次清洁也能洗得很干净🌊 \n\n体感上最能立刻感受到的是，\n洗后不紧绷，\n皮肤变得水润，很喜欢。\n含有能帮助强化皮肤屏障、维持水油平衡的荷荷巴油，\n感觉能减少皮肤水分流失🥥\n\n之前用的洁面泡沫，泡沫进眼睛会刺痛，眼睛会痛，\n但NOMADIA这款就算泡沫进眼睛\n也没有刺激感☺️\n\n而且洗完脸后皮肤肤色也感觉更亮，\n个人很想回购这款产品。\n\nNOMADIA这个品牌是以敏感肌人群为标准做的化妆品，\n刺激少、成分也好，\n不只是敏感肌，像我这种普通肤质用起来应该也很合适。\n\n这款洁面产品推荐给干性肌肤\n以及水油皮、油性肌肤的朋友们😘","zh-TW":"連續兩週持續使用NOMADIA金盞荷荷芭雙重微氣泡潔顏乳\n\n產品外觀是帶著溫暖黃色調的按壓瓶，泡沫層和油層是分離的💛\n\n使用前請充分搖勻🫨\n按壓後會形成柔軟細緻的泡沫，\n不需要另外打泡，\n對皮膚的刺激較少☁️\n\n香味幾乎接近無香，\n香味本來就很容易眾口難調，\n我反而喜歡無香，覺得很滿意\n\n我平常幾乎不化妝，\n只擦防曬乳，防曬乳不太好卸所以一直都要做二次清潔，\n但這款產品光一次清潔就能洗得很乾淨🌊\n\n體感上最直接的感受是\n洗完臉不緊繃、\n皮膚變水潤，很喜歡\n含有助於強化皮膚屏障、調節油水平衡的荷荷芭油，\n感覺能減少皮膚水分流失🥥\n\n原本用的洗面乳如果泡沫跑進眼睛就會刺痛，\n但NOMADIA的產品泡沫進到眼睛也\n完全不刺激☺️\n\n而且洗完臉後皮膚感覺亮了一階，\n個人真的很想回購\n\nNOMADIA品牌好像是以敏感肌為標準製作的化妝品，\n刺激少、成分也好，\n不只敏感肌，像我這種普通肌膚應該也很適合\n\n這款潔顏產品推薦給乾性肌\n和外油內乾油性肌的人使用😘",ja:"NOMADIAゴールデンホホバデュアルマイクロバブルクレンザーを2週間継続して使ってみました\n \n製品の見た目は温かみのある黄色がかったポンプ容器に、泡の層とオイルの層が分かれています💛\n\n使用時はよく振ってください🫨\nポンプすると柔らかくきめ細かい泡が\n形成されるので、別に泡立てる必要がなく\n肌への刺激が少なくて済みます☁️  \n\n香りはほぼ無香と言えます \n香りはとにかく好みが分かれるので \n私はむしろ無香が好きなので気に入りました  \n\n私は普段ほとんどメイクをせず \n日焼け止めだけ塗って過ごしていますが、日焼け止めはなかなか落ちないのでいつもダブル洗顔をしていましたが、 \nこの製品は一度のクレンジングだけでもきれいに洗浄されました🌊 \n\n体感で一番すぐ感じられた点は \n洗顔後つっぱりがなく \n肌がしっとりして良かったです \n肌バリア強化と水分・油分バランスに \n役立つホホバオイルが入っているので \n肌の水分損失を減らしてくれる気がします🥥\n\n以前使っていた洗顔フォームは泡が目に入るとしみて目に痛みがありましたが、NOMADIAのクレンジングは泡が目に入っても \n刺激がありませんでした☺️\n\nまた洗顔後肌のトーンが明るくなって \n個人的にリピートしたい製品です  \n\nNOMADIAブランドは敏感肌の方を基準に作られたコスメだそうです \n刺激が少なく成分も良いので敏感肌の方はもちろん、私のように普通の肌を持っている方にも合うと思います  \n\nこのクレンジング製品は乾燥肌の方と \nインナードライ肌・脂性肌の方におすすめします😘",th:"ใช้โกลเด้นโฮโฮบาดูอัลไมโครบับเบิลคลีนเซอร์ของโนมาเดียต่อเนื่อง 2 สัปดาห์ค่ะ\n \nรูปลักษณ์ผลิตภัณฑ์เป็นขวดปั๊มโทนเหลืองอบอุ่น มีชั้นฟองกับชั้นออยล์แยกกัน💛\n\nก่อนใช้เขย่าให้ดีนะคะ🫨\nพอกดปั๊มจะได้ฟองที่นุ่มและละเอียด \nไม่ต้องตีฟองเพิ่มเอง \nเลยระคายเคืองผิวน้อยลง☁️  \n\nกลิ่นแทบไม่มีเลย \nเรื่องกลิ่นแล้วแต่ความชอบของแต่ละคน \nส่วนตัวชอบแบบไม่มีกลิ่นมากกว่า เลยถูกใจ  \n\nปกติแทบไม่แต่งหน้า \nทาแค่ครีมกันแดด แต่ครีมกันแดดล้างออกยาก เลยต้องล้างหน้าสองครั้งตลอด \nแต่ผลิตภัณฑ์นี้แค่ล้างครั้งเดียวก็สะอาดหมดจดดีเลยค่ะ🌊 \n\nสิ่งที่รู้สึกได้ชัดเจนที่สุดคือ \nหลังล้างหน้าไม่ตึง \nผิวชุ่มชื้นขึ้นชอบมาก \nมีน้ำมันโฮโฮบาที่ช่วยเสริมเกราะผิวและปรับสมดุลน้ำ-มัน \nรู้สึกว่าช่วยลดการสูญเสียความชุ่มชื้นของผิวด้วยค่ะ🥥\n\nโฟมล้างหน้าที่เคยใช้ก่อนหน้านี้ พอฟองเข้าตาจะแสบจนเจ็บตา แต่คลีนซิ่งของโนมาเดียแม้ฟองเข้าตาก็ \nไม่ระคายเคืองเลยค่ะ☺️\n\nแล้วหลังล้างหน้าผิวยังดูกระจ่างขึ้นด้วย \nส่วนตัวอยากซื้อซ้ำผลิตภัณฑ์นี้เลยค่ะ  \n\nแบรนด์โนมาเดียทำเครื่องสำอางโดยยึดมาตรฐานคนผิวแพ้ง่ายเป็นหลัก \nระคายเคืองน้อยและส่วนผสมก็ดี เลยน่าจะเหมาะไม่ใช่แค่คนผิวแพ้ง่าย แต่คนผิวทั่วไปแบบฉันด้วย  \n\nผลิตภัณฑ์คลีนซิ่งตัวนี้แนะนำสำหรับคนผิวแห้ง \nและผิวมันขาดน้ำ ผิวมัน ด้วยค่ะ😘"},images:[],video:null},
    {id:"AweOXdEZ",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"40대 지복합성, 기미·홍조 있는 피부도 T존/U존 밸런스 만족",en:"40s combination-oily skin, satisfied with T-zone/U-zone balance even with hyperpigmentation and redness","zh-CN":"40多岁油性混合肌，有色斑·泛红的皮肤也满意T区/U区平衡","zh-TW":"40多歲油性混合肌，有黑斑‧泛紅的肌膚也滿意T字/U字平衡",ja:"40代脂性混合肌、シミ・赤みのある肌もTゾーン/Uゾーンのバランスに満足",th:"วัย 40 กว่า ผิวผสมมัน มีฝ้า·ผื่นแดงก็พอใจกับสมดุล T-zone/U-zone"},date:"2026-07-03",
      quote:{ko:"•현재 피부 상태\n-지복합성 수부지\n-환절기 시작되면 특히 입주변이 많이 건조함\n-나이가 들면서 광대쪽에 기미가 생김\n-메이크업은 안하며 선크림으로 마무리\n\n•고민 되는 부분\n-40대가 넘어가면서 피부가 얇아지고 건조함\n-겨울이나 일교차가 클때 홍조 자주 발생\n\n•사용기간\n6월 17일 ~ 7월 1일\n\n•체험후기\n펌핑하자마자 쫀쫀한 미세 버블이 나와 거품을 따로 낼 필요가 없어 사용하기 편했음.\n세안하면서도 피부에 자극이 거의 느껴지지 않았고, 헹군 뒤에는 뽀득하게 건조한 느낌보다는 촉촉하고 편안한 마무리감이 좋았음. 호호바 오일이 10% 함유되어 있어서인지 세안 후에도 피부가 당기지 않아 만족스러웠음.\n보통 지복합성 피부는 세정력이 강한 제품을 사용하면 U존이 쉽게 건조해지고, 순한 제품은 T존의 유분감이 남는 경우가 많은데, 이 제품은 두 가지를 비교적 균형 있게 잡아준다는 느낌을 받았음. T존은 산뜻하게 정돈되면서도 U존은 촉촉함이 남아 피부가 편안했음. \n향이 강하지 않아 부담 없이 사용할 수 있었음.\n세안 후 피부가 일시적으로 붉어지거나 예민해지는 느낌이 적어서 민감한 날에도 부담 없이 사용할 수 있었음.\n세안 후 피부가 뽀득하게 마르는 느낌보다 수분감을 어느 정도 유지하면서 편안하게 마무리되는사용감이 특히 마음에 들었음. 전체적으로 피부 컨디션이 안정적으로 유지되는 것 같아 만족스러웠음.\n평소 민감성이나 지복합성 피부라 어떤 클렌저를 써야 할지 고민하는 분들이라면한 번쯤 사용해 볼 만한 제품이라는 생각이 들었음.",en:"•Current skin condition\n-Combination-oily, combination (oily-dehydrated)\n-Especially dry around the mouth when seasons change\n-Developed hyperpigmentation on cheekbones with age\n-Don't wear makeup, just finish with sunscreen\n\n•Concerns\n-Skin getting thinner and drier past my 40s\n-Frequent redness in winter or when there's a big temperature difference\n\n•Usage period\nJune 17 - July 1\n\n•Trial review\nAs soon as I pumped it, springy micro-bubbles came out so I didn't need to build up foam separately, which was convenient to use.\nThere was barely any irritation on my skin while cleansing, and after rinsing, rather than a squeaky-dry feeling, it left a moisturized, comfortable finish that I liked. Maybe because it contains 10% jojoba oil, my skin didn't feel tight even after cleansing, which was satisfying.\nUsually with combination-oily skin, products with strong cleansing power easily dry out the U-zone, while gentle products often leave oiliness in the T-zone, but I felt this product balanced both fairly well. The T-zone was refreshingly clean while the U-zone stayed moisturized, so my skin felt comfortable.\nThe scent wasn't strong, so I could use it without worry.\nThere was less of that temporary redness or sensitized feeling after cleansing, so I could use it worry-free even on sensitive days.\nRather than that squeaky-dry feeling after cleansing, it maintained some moisture while finishing comfortably, which I especially liked. Overall my skin condition seemed to stay stable, which was satisfying.\nFor those with sensitive or combination-oily skin who are wondering which cleanser to use, I think this is one worth trying at least once.","zh-CN":"•当前皮肤状态\n-油性混合肌，水油皮\n-换季开始时嘴巴周围特别干燥\n-随着年龄增长颧骨附近长了色斑\n-不化妆，用防晒收尾\n\n•困扰的地方\n-40岁之后皮肤变薄、变干燥\n-冬天或早晚温差大时经常泛红\n\n•使用时间\n6月17日 ~ 7月1日\n\n•体验感受\n一按压就出紧实的微气泡，不用另外打泡，使用很方便。\n洗脸过程中几乎感觉不到皮肤刺激，冲洗之后不是那种吱吱响的干燥感，而是水润舒适的收尾感，很好。可能是含10%荷荷巴油，洗后皮肤也不紧绷，很满意。\n一般油性混合肌用清洁力强的产品，U区容易干燥，用温和产品又容易在T区留油光，但这款感觉能相对平衡地兼顾两者。T区清爽整洁，U区依然水润，皮肤很舒适。\n香味不浓，用起来没有负担。\n洗后皮肤不容易暂时性泛红或变敏感，敏感的日子用也没有负担。\n比起洗到吱吱响的干燥感，更喜欢这种保留一定水润感、舒适收尾的使用感。整体上皮肤状态感觉维持得很稳定，很满意。\n平时是敏感性或油性混合肌、正在纠结用什么洁面产品的人，这款值得一试。","zh-TW":"•目前膚況\n-油性混合肌、外油內乾\n-換季開始時嘴巴周圍特別乾燥\n-隨著年紀增長，顴骨部位長出黑斑\n-不化妝，用防曬乳收尾\n\n•困擾的部分\n-過了40歲之後皮膚變薄、乾燥\n-冬天或早晚溫差大時常常泛紅\n\n•使用期間\n6月17日 ~ 7月1日\n\n•體驗心得\n一按壓就會出現紮實的微氣泡，不用另外起泡，使用很方便。\n洗臉時幾乎感覺不到刺激，沖洗之後不是那種咕溜咕溜的乾燥感，而是水潤舒適的收尾感，很喜歡。可能因為含有10%荷荷芭油，洗完臉後皮膚也不緊繃，很滿意。\n一般油性混合肌用潔淨力強的產品，U字部位容易變乾燥，溫和產品又常常讓T字部位留有油膩感，但這款感覺能把兩者平衡得不錯。T字清爽整潔，U字則保留水潤感，皮膚很舒服。\n香味不濃，使用無負擔。\n洗完臉後皮膚暫時泛紅或變敏感的感覺較少，敏感的日子用起來也沒有負擔。\n比起洗到乾巴巴的乾淨感，能保留一定水潤感、舒適收尾的使用感，這點我特別喜歡。整體來說皮膚狀況感覺維持得很穩定，很滿意。\n平常敏感肌或油性混合肌不知道該用哪款潔顏產品的人，我覺得值得試試看這款產品。",ja:"•現在の肌状態\n-脂性混合肌、インナードライ肌\n-季節の変わり目になると特に口周りがとても乾燥する\n-年齢を重ねて頬骨あたりにシミができる\n-メイクはせず日焼け止めで仕上げる\n\n•悩んでいる部分\n-40代を過ぎてから肌が薄くなり乾燥する\n-冬や寒暖差が大きいとき赤みがよく発生する\n\n•使用期間\n6月17日〜7月1日\n\n•体験レビュー\nポンプするとすぐにとろみのある微細バブルが出てきて、別に泡立てる必要がなく使いやすかった。\n洗顔中も肌への刺激がほとんど感じられず、すすいだ後はキュッキュッと乾燥した感じよりしっとり快適な仕上がりが良かった。ホホバオイルが10%含まれているからか、洗顔後も肌がつっぱらず満足だった。\n普通、脂性混合肌は洗浄力の強い製品を使うとUゾーンが乾燥しやすく、マイルドな製品はTゾーンの油っぽさが残ることが多いが、この製品は両方を比較的バランス良く整えてくれる感じを受けた。Tゾーンはさっぱり整いながらもUゾーンはしっとり感が残って肌が快適だった。\n香りが強くないので気兼ねなく使うことができた。\n洗顔後、肌が一時的に赤くなったり敏感になったりする感じが少なく、敏感な日でも気兼ねなく使うことができた。\n洗顔後肌がキュッキュッと乾く感じよりも、しっとり感をある程度保ちながら快適に仕上がる使用感が特に気に入った。全体的に肌コンディションが安定して保たれる感じで満足だった。\n普段敏感肌や脂性混合肌でどんなクレンザーを使うべきか悩んでいる方なら、一度は使ってみる価値のある製品だと思った。",th:"•สภาพผิวปัจจุบัน\n-ผิวผสมมันขาดน้ำ\n-พอเข้าช่วงเปลี่ยนฤดูกาลจะแห้งมากโดยเฉพาะรอบปาก\n-อายุมากขึ้นเริ่มมีฝ้าที่โหนกแก้ม\n-ไม่แต่งหน้า จบด้วยครีมกันแดด\n\n•จุดที่กังวล\n-อายุเกิน 40 แล้วผิวเริ่มบางและแห้ง\n-หน้าหนาวหรือช่วงอุณหภูมิเปลี่ยนแปลงมากมักมีผื่นแดง\n\n•ระยะเวลาที่ใช้\n17 มิถุนายน - 1 กรกฎาคม\n\n•รีวิวการทดลองใช้\nพอกดปั๊มก็มีไมโครบับเบิลหนึบแน่นออกมาทันที ไม่ต้องตีฟองเพิ่มเอง ใช้งานสะดวก\nระหว่างล้างหน้าแทบไม่รู้สึกระคายเคืองเลย หลังล้างออกไม่ได้รู้สึกแห้งสะอาดเอี๊ยด แต่จบด้วยความชุ่มชื้นสบายผิว ชอบมาก อาจเพราะมีน้ำมันโฮโฮบา 10% หลังล้างหน้าไม่ตึงเลย พอใจมาก\nปกติผิวผสมมันถ้าใช้ผลิตภัณฑ์ที่แรงทำความสะอาดสูง U-zone จะแห้งง่าย แต่ถ้าใช้ผลิตภัณฑ์อ่อนโยน T-zone มักจะมีความมันเหลืออยู่ แต่ผลิตภัณฑ์นี้รู้สึกว่าจัดการทั้งสองอย่างได้สมดุลกันดี T-zone สะอาดสดชื่น ส่วน U-zone ยังคงความชุ่มชื้นไว้ ผิวสบายดี \nกลิ่นไม่แรง ใช้ได้ไม่มีภาระ\nหลังล้างหน้าแทบไม่รู้สึกแดงหรือไวต่อสิ่งเร้าชั่วคราว ใช้ได้ไม่มีภาระแม้วันที่ผิวไวต่อสิ่งเร้า\nชอบเป็นพิเศษที่หลังล้างหน้าไม่ได้แห้งสะอาดเอี๊ยด แต่ยังคงความชุ่มชื้นไว้พอสมควรและจบอย่างสบายผิว โดยรวมรู้สึกว่าสภาพผิวคงที่มั่นคงขึ้น พอใจมาก\nถ้าใครกำลังกังวลว่าจะใช้คลีนเซอร์แบบไหนดีเพราะเป็นผิวแพ้ง่ายหรือผิวผสมมัน คิดว่าเป็นผลิตภัณฑ์ที่น่าลองใช้ดูสักครั้ง"},images:[],video:null},
    {id:"Jk8nb3lZ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"극민감성+홍조+피지폭발, 홍조에도 자극 없음",en:"Extremely sensitive + redness + excess sebum, no irritation even with redness","zh-CN":"极敏感肌+泛红+皮脂爆发，泛红肌用也无刺激","zh-TW":"極敏感+泛紅+皮脂爆發，泛紅肌也完全不刺激",ja:"極度の敏感肌+赤み+皮脂爆発、赤みがあっても刺激なし",th:"แพ้ง่ายมาก+ผื่นแดง+ไขมันระเบิด ไม่ระคายเคืองแม้มีผื่นแดง"},date:"2026-06-18",
      quote:{ko:"피부타입 :  {t존, 이마, 턱}은 피지폭발, 볼은 수부지인 지성피부. 극민감성+홍조\n제품 사용 기간 : 약 2주\n\n예전부터 호호바가 든 제품을 꼭 좀 써보고 싶었는데! 모공에 좋다고 해서요😆 이번에 좋은 기회가 생겨서 이렇게 사용해보게 되었습니다.\n\n👍🏻버블을 생성해서 사용이 편리합니다. \n짜서 손으로 비벼 거품을 만드는 것이 아닌 제품자체가 거품을 생성해줘서 편했어요. 쫀쫀...? 까진 아니더라도 풍성해서 잘 씻겨지는 기분이 들게 했어요.\n\n👍🏻민감성에 좋은 순한 제품\n성분표 보면 민감성에는 별로 추천 안한다고 했는데 민감성인 제가 썼을때는 괜찮았어요! 홍조가 심한데 자극이 있지도 않았고요. 민감하신 분들이 써도 괜찮을것 같아요.",en:"Skin type: {T-zone, forehead, chin} have excess sebum, cheeks are combination (oily-dehydrated) — oily skin overall. Extremely sensitive + redness\nProduct usage period: about 2 weeks\n\nI'd wanted to try a product with jojoba in it for a while, since I heard it's good for pores😆 This time I got a good chance to try it out.\n\n👍🏻Convenient since it generates its own foam.\nRather than squeezing it out and rubbing it in your hands to make foam, the product itself generates foam, which was convenient. It wasn't exactly springy...? but it was rich enough to feel like it was washing things off well.\n\n👍🏻A gentle product that's good for sensitive skin\nLooking at the ingredient list, it said it's not really recommended for sensitive skin, but when I, someone with sensitive skin, used it, it was fine! I have severe redness and there was no irritation at all. I think even people with sensitive skin can use it fine.","zh-CN":"肤质：{T区、额头、下巴}皮脂爆发，脸颊是水油皮的油性肌肤。极敏感+泛红\n使用时长：约2周\n\n之前就一直很想试试含荷荷巴成分的产品！听说对毛孔好😆这次刚好有机会就试用了。\n\n👍🏻生成气泡使用方便。\n不是挤出来在手上搓出泡沫，而是产品本身直接生成泡沫，很方便。虽算不上特别紧实……但很蓬松，感觉能洗得很干净。\n\n👍🏻适合敏感肌的温和产品\n看成分表说不太推荐敏感肌用，但我是敏感肌用起来没问题！泛红很严重也没有刺激。敏感肌应该也能放心用。","zh-TW":"膚質：{T字、額頭、下巴}皮脂爆發，臉頰外油內乾的油性肌。極敏感+泛紅\n使用期間：約2週\n\n我一直很想試試看含荷荷芭成分的產品！聽說對毛孔很好😆這次剛好有好機會就試用看看了。\n\n👍🏻自動出泡，使用方便\n不用擠出來再用手搓出泡沫，產品本身就會生成泡沫，很方便。雖然不到紮實……的程度，但很豐盈，有種洗得很乾淨的感覺。\n\n👍🏻適合敏感肌的溫和產品\n看成分表寫著不太推薦敏感肌使用，但我是敏感肌用起來完全沒問題！我泛紅很嚴重，也沒有任何刺激。敏感肌的人應該也可以放心使用。",ja:"肌タイプ：{Tゾーン、おでこ、あご}は皮脂爆発、頬はインナードライの脂性肌。極度の敏感肌+赤み\n製品使用期間：約2週間\n\n以前からホホバが入った製品をぜひ使ってみたかったんです！毛穴に良いというので😆今回良い機会があったのでこうして使ってみることになりました。\n\n👍🏻バブルが生成されて使うのが便利です。\n出して手でこすって泡を作るのではなく製品自体が泡を生成してくれるので楽でした。とろみ…?とまではいかなくても、豊かで洗い上がりが良い感じがしました。\n\n👍🏻敏感肌に良いマイルドな製品\n成分表を見ると敏感肌にはあまりおすすめしないと書いてありましたが、敏感肌の私が使ったときは大丈夫でした！赤みがひどいのに刺激もありませんでした。敏感な方が使っても大丈夫そうです。",th:"ประเภทผิว : {T-zone หน้าผาก คาง} ไขมันระเบิด แก้มเป็นผิวมันขาดน้ำ เป็นผิวมัน แพ้ง่ายมาก+ผื่นแดง\nระยะเวลาที่ใช้ : ประมาณ 2 สัปดาห์\n\nอยากลองใช้ผลิตภัณฑ์ที่มีโฮโฮบามานานแล้ว! เพราะว่าดีต่อรูขุมขน😆 ครั้งนี้ได้โอกาสดีเลยได้ลองใช้ค่ะ\n\n👍🏻สร้างฟองเองได้ใช้งานสะดวก \nไม่ต้องบีบแล้วขยี้มือให้เกิดฟองเอง เพราะตัวผลิตภัณฑ์สร้างฟองให้เองเลย สะดวกมาก จะบอกว่าหนึบ...? ก็ไม่ถึงกับหนึบ แต่ฟูจนรู้สึกว่าล้างสะอาดดี\n\n👍🏻ผลิตภัณฑ์อ่อนโยนที่ดีต่อผิวแพ้ง่าย\nดูตารางส่วนผสมแล้วบอกว่าไม่ค่อยแนะนำสำหรับผิวแพ้ง่ายนัก แต่พอฉันที่เป็นผิวแพ้ง่ายใช้แล้วก็โอเคดี! มีผื่นแดงหนักแต่ก็ไม่ระคายเคืองเลย คิดว่าคนผิวแพ้ง่ายก็ใช้ได้ค่ะ"},images:[],video:null},
    {id:"A11oQOWA",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"왕민감성 홍조(세안 직후 홍조 심함)+여드름, 세안 후 홍조 사라짐",en:"Extremely sensitive with severe redness (bad flushing right after cleansing) + acne, redness disappeared after cleansing","zh-CN":"超敏感泛红（洗脸后立刻泛红严重）+痘痘肌，洗后泛红消失","zh-TW":"超級敏感泛紅（洗完臉馬上泛紅）+痘痘肌，洗完臉後泛紅消失",ja:"超敏感肌の赤み(洗顔直後の赤みがひどい)+ニキビ、洗顔後の赤みが消える",th:"แพ้ง่ายสุดๆ ผื่นแดง (แดงมากทันทีหลังล้างหน้า)+สิว - ผื่นแดงหายไปหลังล้างหน้า"},date:"2026-07-09",
      quote:{ko:"저는 평상시에도 홍조도 심한데 세수 직후에는 토마토가 되어버리는 왕 민감성 피부입니다ㅜㅜ 그렇다고 또 여드름 피부라 클렌징 효과가 떨어지는 제품도 쓰지도못해요ㅜㅠ너무 순하면 잔여물이 남아서 안그래도 많은 트러블이 더 올라오거든여...ㅜㅜ\n​\n기존에는 클렌징 오일에 폼으로 이차세안했는데 피부장벽에는 진짜 안좋다고 하더라구요\n그래서 최근에는 클렌징오일로만 클렌징했는데 또 뭔지 아시죠 마지막에 미끌거려서... 좀 덜 씻은 느낌...?\n찝찝쓰\n\n그래서 노마디아 클렌징밀크랑 버블클렌저 같이 쓰고있는데 자극없고 너무 좋은것같아요 눈화장 심한 사람들은 리무버를 따로 하라는데 저는 눈화장 거의 안해서 나랑 완전 찰떡...💕\n\n건조하신 분들 2차세안하면 특히 더 피부 당기고 자극심한데 이건 호호바오일이 들어가있어서 세수직후에도 얼굴이 촉촉한 느낌이 들더라구요 호호..ㅎ\n\n요즘에 세수 직후에도 홍조가 없는걸 보니 저는 클렌징 제품은 여기서 정착할 예정입니다!! 추천추천!!👍👍",en:"I have bad redness even normally, but right after washing my face I turn into a tomato — I'm that extremely sensitive type ㅜㅜ On top of that, I have acne-prone skin so I can't use products with weak cleansing power either ㅜㅠ If it's too gentle, residue gets left behind and it brings up even more breakouts than I already have...ㅜㅜ\n\nI used to do a second cleanse with cleansing oil followed by foam, but apparently that's really bad for the skin barrier\nSo recently I've been cleansing with just cleansing oil only, but you know how that goes — slippery at the end... feels like it's not quite washed off...\nUgh, unsatisfying\n\nSo I've been using the NOMADIA cleansing milk together with the bubble cleanser, and it's non-irritating and really nice. It says people with heavy eye makeup should use a separate remover, but I barely wear eye makeup so it's a perfect match for me...💕\n\nFor those with dry skin, second cleansing especially causes more tightness and irritation, but this one has jojoba oil in it so my face felt moisturized even right after cleansing ㅎ\n\nThese days I notice I don't even get redness right after washing, so I'm planning to stick with this cleanser going forward!! Highly recommend!!👍👍","zh-CN":"我平时泛红也很严重，洗完脸马上就变番茄脸，是超级敏感肌ㅜㅜ 但又是痘痘肌，清洁效果差的产品也不能用ㅜㅠ太温和的话会有残留，本来痘痘就多，用了反而会长更多...ㅜㅜ\n​\n之前用卸妆油再加泡沫做二次清洁，但听说这样对皮肤屏障真的不好\n所以最近只用卸妆油清洁，但你懂的，最后总有点滑腻……感觉没洗干净的样子...\n有点不清爽\n\n所以现在NOMADIA洁面乳和气泡洁面一起用，无刺激真的很喜欢，眼妆浓的人应该要另外用卸妆液，但我几乎不化眼妆，跟我完全绝配...💕\n\n干性的朋友做二次清洁时特
