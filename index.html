けのインナードライ肌\n \n\n 1)まず一番のメリットは涼しさ。ブルー鎮静という名前通り、一日中疲れた肌に塗ってこすったとき、息苦しくなく程よく涼しい感じ。クーリングとまではいかないですが、どうせ敏感肌にはあまり化学的なクーリングも良くないですし、これくらいで大満足\n \n\n 2)刺激ゼロ。本当に刺激がない。もともと敏感肌にはクレンジングミルクを使えってよく言われますよね？かなり敏感肌なので急に肌がヒリヒリするときにクレンジングオイルの代わりにこれを使ってみましたが、全くヒリヒリしませんでした\n \n\n 3)しっとり。油分なし、しっとりなので私みたいなインナードライ脂性肌が使ってもテカらず水分感だけ残してくれます\n \n\n めったに星5つはつけないのですが、私の肌には本当に合っていて仕上がりもさっぱりしていました！超おすすめです笑",th:"ประเภทผิว : ผิวมันขาดน้ำที่หน้าร้อนสิวระเบิด ร้อนวูบวาบ ผื่นแดงเยอะมาก\n \n\n 1) ข้อดีที่สุดคือความเย็นสบาย สมชื่อบลูซูทติ้ง พอทาลงบนผิวที่เหนื่อยล้าทั้งวันแล้วนวดคลึงดู ไม่อึดอัดเลย เย็นสบายพอดีๆ ไม่ถึงกับเย็นเจี๊ยบแบบสารเคมีคูลลิ่ง แต่ผิวแพ้ง่ายก็ไม่ควรใช้คูลลิ่งเคมีแรงๆ อยู่แล้ว แค่นี้ก็พอใจสุดๆ\n \n\n 2) ระคายเคือง xxxx . ไม่ระคายเคืองเลยจริงๆ เขาว่าผิวแพ้ง่ายควรใช้คลีนซิ่งมิลค์กันใช่ไหม? เพราะผิวแพ้ง่ายมาก พอวันไหนผิวแสบขึ้นมากะทันหันก็ใช้ตัวนี้แทนคลีนซิ่งออยล์ ปรากฏว่าไม่แสบเลยสักนิด\n \n\n 3) ชุ่มชื้น ไม่มัน x ชุ่มชื้น เหมาะกับคนผิวมันขาดน้ำแบบฉัน ใช้แล้วไม่มันเยิ้ม เหลือแค่ความชุ่มชื้นเท่านั้น\n \n\n ปกติไม่ค่อยให้ 5 ดาว แต่ตัวนี้เข้ากับผิวฉันจริงๆ แล้วจบด้วยความสดชื่นด้วย! แนะนำสุดๆ ฮ่าๆ"},images:[],video:null},
    {id:"ZN6Pd8aZ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"악건성+아토피, 환절기 따갑고 붉어지는 피부에 순한 사용감",en:"Severely dry + atopic, gentle feel for skin that stings and reddens during season changes","zh-CN":"极干皮+特应性皮炎，换季刺痛泛红肌也有温和使用感","zh-TW":"極乾性+異位性皮膚炎，換季時刺痛泛紅的肌膚也有溫和使用感",ja:"極度の乾燥肌+アトピー、季節の変わり目にヒリヒリして赤くなる肌にマイルドな使用感",th:"ผิวแห้งมาก+ผิวเป็นภูมิแพ้ผิวหนัง ผิวที่แสบและแดงง่ายช่วงเปลี่ยนฤดูกาล ใช้แล้วรู้สึกอ่อนโยน"},date:"2026-06-15",
      quote:{ko:"피부가 워낙 악건성에다 아토피까지 있어서 환절기나 컨디션 안 좋을 때는 클렌징만 해도 얼굴이 찢어질 것처럼 따갑고 붉어지는 편이에요. 그래서 오일이나 폼은 잘 사용하지 않고 순한 밀크 타입을 주로 찾아 쓰는데, 이번에 노마디아 제품이 당첨되어 사용해봤어요.\n \n\n 처음 짰을 때는 생각보다 제형이 묽지 않고 약간 쫀쫀한 로션 같은 느낌인데, 얼굴에 롤링하면 부드럽게 사르르 녹아내려요. 마찰 자극이 거의 없어서 롤링하는 내내 피부가 편안했어요.\n \n\n 가장 마음에 들었던 점은 세안 후 당김이 정말 덜했어요. 물세안만 가볍게 하고 수건으로 닦아내도 촉촉한 느낌이 들고 판테놀이 들어가서 그런지 세수하고 나서 특유의 붉은 기나 가려움 올라오는 것도 많이 진정되는 느낌을 받았어요.\n \n\n 다만, 순한 진정 클렌저라 그런지 세정력이 엄청 강력하진 않을 것 같아요. 저는 보통 선크림만 사용해서 이 제품만으로도 충분하지만 추가적인 화장을 하는 분들은 다른 세정 제품을 추가적으로 사용해주셔야 할 것 같아요.\n \n\n  그리고 뽀드득한 마무리를 좋아하시는 분들에게는 약간 미끈거린다고 느껴질 수도 있을 것 같아요. 하지만 저처럼 장벽 다 무너진 극건성+선천적 아토피 피부인 저에겐 정말 좋았고, 다른 분들에게도 추천해요.",en:"My skin is so severely dry it's practically atopic, so during season changes or when my condition is bad, even just cleansing makes my face feel like it's tearing and turning red. So I usually don't use oils or foams and mainly look for gentle milk types, and this time I got picked to try NOMADIA's product.\n\nWhen I first squeezed it out, the texture was less watery than expected — a bit more like a firm lotion — but when rolled onto the face it melts down softly. There was almost no friction irritation, so my skin stayed comfortable the whole time I was rolling it on.\n\nWhat I liked most was that there was really much less tightness after cleansing. Even just doing a light water rinse and patting dry with a towel left a moist feeling, and maybe because of the Panthenol, the usual redness and itchiness that come up after washing felt a lot more soothed.\n\nThat said, since it's a gentle, calming cleanser, the cleansing power probably isn't super strong. I usually only wear sunscreen, so this alone is enough for me, but people who do additional makeup will probably need to add another cleansing product.\n\nAnd if you like a squeaky-clean finish, you might find it a bit slippery. But for someone like me with a totally broken-down barrier plus congenital atopic dermatitis, it was really good, and I'd recommend it to others too.","zh-CN":"我皮肤本来就是极干性，还有特应性皮炎，换季或状态不好的时候光洗脸就会觉得脸像要裂开一样刺痛泛红。所以平时不太用油类或洁面泡沫，主要找温和的洁面乳类型，这次抽中了NOMADIA的产品试用了一下。\n \n\n 刚挤出来的时候质地比想象中不稀，有点像黏稠的乳液，但在脸上打圈时会柔软地化开。摩擦刺激几乎感觉不到，打圈的整个过程皮肤都很舒适。\n \n\n 最满意的一点是洗后紧绷感真的少很多。只是简单水洗后用毛巾擦干也有水润感，可能是含有泛醇的关系，洗完脸后特有的泛红或发痒也感觉舒缓了不少。\n \n\n 不过，可能因为是温和舒缓型洁面产品，清洁力应该不算特别强。我平时只涂防晒，用这款就够了，但化了额外妆容的人可能需要再搭配其他清洁产品。\n \n\n 还有，喜欢洗到吱吱作响的干净感的人可能会觉得有点滑腻。但对像我这样屏障全崩的极干性+先天性特应性皮炎肌肤来说真的很好用，也推荐给其他人。","zh-TW":"我皮膚本來就是極乾性又有異位性皮膚炎，換季或膚況不好時，光是卸妝臉就會像要裂開一樣刺痛泛紅。所以我幾乎不用油類或洗面乳，主要都找溫和的卸妝乳類型，這次剛好抽中NOMADIA的產品，試用看看。\n\n\n 一開始擠出來時，質地比想像中不稀，有點像有黏性的乳液，但在臉上打圈就會柔順地化開。摩擦刺激幾乎沒有，打圈全程皮膚都很舒服。\n\n\n 最喜歡的一點是洗完臉緊繃感真的少很多。只用清水洗、用毛巾擦乾也覺得水潤，可能因為含有泛醇，洗完臉後那種特有的泛紅或發癢感覺也舒緩了不少。\n\n\n 不過，可能因為是溫和舒緩型潔顏產品，潔淨力應該不會太強。我平常只擦防曬乳，這款就夠用了，但如果有額外化妝的人可能要另外搭配其他清潔產品。\n\n\n 而且喜歡洗完臉「咕溜咕溜」乾淨感的人，可能會覺得有點滑滑的。但對像我這種屏障全毀的極乾性+先天異位性皮膚炎肌膚來說真的很棒，也推薦給其他人。",ja:"肌がとにかく極度の乾燥肌でアトピーもあるので、季節の変わり目やコンディションが悪いときはクレンジングだけでも顔が裂けそうにヒリヒリして赤くなる方です。なのでオイルやフォームはあまり使わず、マイルドなミルクタイプを主に探して使っているのですが、今回NOMADIAの製品が当たったので使ってみました。\n \n\n 最初に出したときは思ったより緩くなく、少しとろみのあるローションのような感じでしたが、顔にローリングすると優しくすっと溶けていきます。摩擦刺激がほとんどなくて、ローリングしている間ずっと肌が快適でした。\n \n\n 一番気に入った点は洗顔後のつっぱりが本当に少なかったことです。水洗いだけ軽くしてタオルで拭いてもしっとりした感じがして、パンテノールが入っているからか洗顔後の特有の赤みや痒みが出るのもかなり鎮まる感じを受けました。\n \n\n ただ、マイルドな鎮静クレンザーだからか洗浄力はそこまで強力ではないと思います。私は普段日焼け止めだけ使っているのでこの製品だけで十分ですが、追加でメイクをする方は別の洗浄製品を追加で使う必要がありそうです。\n \n\n  それから、キュッキュッとした洗い上がりが好きな方には少しぬるぬるすると感じるかもしれません。でも私のようにバリアが完全に崩れた極度の乾燥肌+先天性アトピー肌には本当に良く、他の方にもおすすめします。",th:"เพราะผิวแห้งมากอยู่แล้วแถมยังเป็นภูมิแพ้ผิวหนัง พอถึงช่วงเปลี่ยนฤดูกาลหรือสภาพผิวไม่ดี แค่ล้างหน้าก็แสบและแดงจนเหมือนจะแตกเลย เลยไม่ค่อยใช้ออยล์หรือโฟม มักหาแบบมิลค์ที่อ่อนโยนใช้เป็นหลัก ครั้งนี้ได้ลุ้นถูกรางวัลผลิตภัณฑ์ของโนมาเดียเลยได้ลองใช้ค่ะ\n \n\n ตอนบีบออกมาครั้งแรกเนื้อไม่เหลวอย่างที่คิด ค่อนข้างหนึบเหมือนโลชั่นนิดหน่อย แต่พอนวดคลึงบนหน้าแล้วละลายลงอย่างนุ่มนวล แทบไม่มีแรงเสียดสีเลย ผิวสบายตลอดการนวดคลึง\n \n\n จุดที่ชอบที่สุดคือหลังล้างหน้าตึงน้อยลงจริงๆ แค่ล้างน้ำเบาๆ แล้วซับด้วยผ้าขนหนูก็ยังรู้สึกชุ่มชื้น อาจเพราะมีแพนธีนอล เลยรู้สึกว่ารอยแดงหรืออาการคันที่มักขึ้นหลังล้างหน้าสงบลงไปเยอะ\n \n\n แต่เพราะเป็นคลีนเซอร์ปลอบประโลมที่อ่อนโยน แรงทำความสะอาดอาจจะไม่ได้แรงมากนัก ฉันปกติทาแค่ครีมกันแดด ใช้ตัวนี้อย่างเดียวก็เพียงพอแล้ว แต่ถ้าใครแต่งหน้าเพิ่มเติมอาจต้องใช้ผลิตภัณฑ์ทำความสะอาดอื่นเสริมด้วยค่ะ\n \n\n แล้วคนที่ชอบความรู้สึกล้างหน้าแบบสะอาดเอี๊ยดอาจจะรู้สึกว่าลื่นๆ นิดหน่อย แต่สำหรับฉันที่เกราะผิวพังหมดแล้วและเป็นผิวแห้งมาก+ภูมิแพ้ผิวหนังโดยกำเนิด ตัวนี้ดีมากจริงๆ ค่ะ แนะนำให้คนอื่นด้วยเลย"},images:[],video:null},
    {id:"Z9lW6YPJ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"수부지, 진한 메이크업 세안 노하우 - 트러블 없이 순함",en:"Combination (oily-dehydrated), heavy-makeup cleansing know-how — gentle with no breakouts","zh-CN":"水油皮，卸浓妆心得分享 - 不长痘，很温和","zh-TW":"外油內乾，濃妝卸妝訣竅心得 - 沒有肌膚困擾又溫和",ja:"インナードライ肌、濃いメイクの落とし方のコツ - トラブルなくマイルド",th:"ผิวมันขาดน้ำ เทคนิคล้างเมคอัพเข้มข้น - อ่อนโยนไม่เกิดสิว"},date:"2026-06-15",
      quote:{ko:"수부지이고 클렌징밀크를 사용해온지 꽤 오래되었습니다 \n \n\n -저는 화장을 진하게 하는 편입니다\n 팁 (클렌징 밀크 사용 시 화장을 진하게 하신다면 클렌징 밀크를 건조한 얼굴에 문지른 후 물을 조금 묻히고 다시 문질러 헹군 뒤 수건으로 살짝 닦고 다시 반복 후 물로 헹군 상태에서 클렌징폼으로 마지막 3차 세안을 해주시면 화장이 말끔히 미끄러움이 남지 않고 개운하게 지워집니다)\n 이 과정이 귀찮으실수 있으나 클렌징워터를 솜에 묻혀 닦는 거 보다 자극적이지 않고 오일이 맞지 않는 분들에게 최적입니다 =는 저입니다. \n 혹은 워터나 리무버로 아이라인 립을 먼저 지우시면 과정이 수월해집니다\n \n\n -이 제품은 무향인 편입니다 약간 플라스틱향? 같은게 나는데 클렌징밀크나 오일 들에서 종종 나는 향이고 씻고 나면 전혀 나지 않습니다\n -성분이 매우 순하여 트러블이 올라오지 않아서 좋았습니다 순하여 잘 지워지지 않는다는 의견도 있었으나 저는 제 방식대로 하여서 잘 지웠습니다\n -판테놀 성분 덕인지 세안 후 당김이 없어 굉장히 좋았습니다!\n -밀크든 오일이든 세안 후 약간의 미끄러움이 남을 수 있기에 클렌징폼으로 한 번 더 세안하기를 지성 트러블성 인간으로써 개인적으로 추천합니다\n -제형이 묽지 않아 양을 허비하지 않을 수 있어 좋았고 적당히 되직하여 문지르기 좋았습니다\n -펌핑은 잘 나오긴하나 푸욱 나올수도 있습니다\n \n\n > 여드름성 지성이거나 과도한 세정력 강한 세정력은 기피하시는 분, 피부가 민감하신분, 화장을 연하게 하거나 선크림만 바르시는 분, 세안 후 속당김이 싫으신 분들에게 추천합니다!",en:"I have combination (oily-dehydrated) skin and have been using cleansing milk for quite a while now\n\n- I tend to wear heavy makeup\nTip (if you wear heavy makeup and use cleansing milk, rub the cleansing milk onto dry skin first, then add a bit of water and rub again, pat lightly with a towel, repeat, and then do a third cleanse with a cleansing foam once your skin is rinsed with water — this removes makeup cleanly with no slipperiness left and a refreshed finish)\nThis process might be a hassle, but it's less irritating than wiping with cleansing water on a cotton pad, and it's optimal for people who don't get along with oils = that's me.\nOr removing eyeliner and lip first with cleansing water or remover makes the process easier\n\n- This product is basically fragrance-free. There's a faint plasticky scent, something that often comes from cleansing milks or oils, but it's completely gone after rinsing\n- The ingredients are very gentle so I didn't break out, which I liked. Some people say it's so gentle that makeup doesn't come off well, but I managed to remove it fine my way\n- Thanks to the Panthenol I think, there was no tightness after cleansing, which was great!\n- With both milk and oil, some slipperiness can remain after cleansing, so as an oily, trouble-prone person I personally recommend cleansing once more with a cleansing foam\n- The texture isn't watery so you don't waste product, and it's appropriately thick, good for rubbing on\n- The pump dispenses well, but it can come out in a big glob sometimes\n\n> I'd recommend this to people with acne-prone oily skin or who avoid overly strong cleansing power, people with sensitive skin, people who wear light makeup or just sunscreen, and people who dislike tightness after cleansing!","zh-CN":"我是水油皮，用洁面乳已经用了挺久了 \n \n\n -我平时妆化得比较浓\n 小贴士（如果化浓妆又想用洁面乳，可以先在干燥的脸上涂抹洁面乳打圈，再沾一点水打圈冲洗，用毛巾轻轻擦一下再重复一次，冲洗后再用洁面泡沫做第三次清洁，这样妆容能干净卸掉，不留滑腻感，非常清爽）\n 这个过程可能会觉得麻烦，但比用棉片蘸卸妆水擦拭更不刺激，对不适合油类的人来说是最佳选择=就是我。 \n 或者先用卸妆水或卸妆液把眼线唇妆卸掉，这样过程会更顺畅\n \n\n -这款产品基本是无香型 有一点点像塑料的味道？洁面乳或油类里偶尔会有这种味道，洗完之后完全没有味道了\n -成分非常温和，不会长痘，这点很好。虽然也有人说太温和所以卸得不干净，但我按自己的方法用，卸得很干净\n -可能是泛醇成分的功劳，洗后完全不紧绷，非常好！\n -不管是洁面乳还是油类，洗后都可能留一点滑腻感，作为油性痘痘肌，个人建议再用洁面泡沫二次清洁一次\n -质地不稀，不会浪费用量，浓稠适中很好抹开\n -按压泵出量正常，但有时候可能会挤出来太多\n \n\n > 推荐给痘痘型油皮、不喜欢过强清洁力的人、皮肤敏感的人、化淡妆或只涂防晒的人、讨厌洗后紧绷的人！","zh-TW":"我是外油內乾，用卸妝乳已經很久了\n\n\n -我平常算是濃妝的類型\n 小技巧（用卸妝乳卸濃妝時，先在乾燥的臉上打圈，再沾一點水繼續打圈沖掉，用毛巾稍微擦乾後再重複一次，最後在沖水狀態下用洗面乳做第三次清潔，妝就會乾乾淨淨地卸掉，不會有滑膩感）\n 這個步驟可能有點麻煩，但比用化妝水沾棉片擦拭更不刺激，對不適合油類的人來說是最佳選擇 = 就是我。\n 或者先用卸妝水或眼唇卸妝液卸掉眼線和唇妝，步驟會更順利\n\n\n -這款產品算是無香型，有一點點像塑膠的味道？卸妝乳或油類產品偶爾會有的味道，洗完之後完全不會留香\n -成分非常溫和，不會長痘痘，這點很喜歡。雖然有人說溫和就不容易卸乾淨，但我按照自己的方式使用就能卸得很乾淨\n -可能因為泛醇成分，洗完臉後不緊繃，非常喜歡！\n -不管是卸妝乳還是油類，洗完臉後可能會留一點滑膩感，身為油性痘痘肌，個人建議再用洗面乳洗一次\n -質地不稀，不會浪費用量，這點很喜歡，濃稠度也剛剛好方便推抹\n -按壓頭出量順暢，但有時候可能會噴出稍多\n\n\n > 推薦給痘痘型油性肌、討厭潔淨力過強產品的人、皮膚敏感的人、化淡妝或只擦防曬乳的人、討厭洗完臉緊繃感的人！",ja:"インナードライ肌で、クレンジングミルクを使い始めてかなり経ちます \n \n\n -私はメイクを濃くする方です\n コツ(クレンジングミルクを使うとき濃いメイクをしている場合は、乾いた顔にクレンジングミルクをこすりつけた後、少し水をつけてもう一度こすってすすぎ、タオルで軽く拭いてまた繰り返した後、水ですすいだ状態で洗顔フォームで最後に3回目の洗顔をすると、メイクがきれいにぬるつきを残さずすっきり落ちます)\n この過程は面倒に感じるかもしれませんが、クレンジングウォーターをコットンに含ませて拭き取るより刺激的ではなく、オイルが合わない方には最適です=それが私です。 \n またはウォーターやリムーバーでアイラインとリップを先に落とすと過程が楽になります\n \n\n -この製品はほぼ無香です。少しプラスチック臭?のようなものがしますが、クレンジングミルクやオイル類でよくある香りで、洗い流すと全くしなくなります\n -成分が非常にマイルドでトラブルが出なくて良かったです。マイルドだと落ちにくいという意見もありましたが、私は自分のやり方できちんと落とせました\n -パンテノール成分のおかげか、洗顔後つっぱりがなく本当に良かったです！\n -ミルクでもオイルでも洗顔後に少しぬるつきが残ることがあるので、洗顔フォームでもう一度洗顔することを脂性トラブル肌の人間として個人的におすすめします\n -テクスチャーが緩すぎないので量を無駄にせずに済んで良く、ちょうど良いとろみでこすりやすかったです\n -ポンプはよく出ますが、たまにドバッと出ることもあります\n \n\n > ニキビ性の脂性肌、または強すぎる洗浄力を避けたい方、肌が敏感な方、メイクを薄くするか日焼け止めだけ塗る方、洗顔後のつっぱりが嫌な方におすすめします！",th:"เป็นผิวมันขาดน้ำและใช้คลีนซิ่งมิลค์มานานพอสมควรค่ะ \n \n\n -ฉันเป็นคนที่แต่งหน้าค่อนข้างเข้มข้น\n เทคนิค (ถ้าใช้คลีนซิ่งมิลค์แล้วแต่งหน้าเข้มข้น ให้นวดคลึงคลีนซิ่งมิลค์บนหน้าที่แห้งก่อน แล้วค่อยเติมน้ำนวดคลึงล้างออก ซับด้วยผ้าขนหนูเบาๆ แล้วทำซ้ำอีกครั้ง จากนั้นล้างด้วยโฟมเป็นการล้างหน้าครั้งที่สาม เมคอัพจะหลุดออกหมดจดไม่มีความลื่นเหนอะหนะตกค้างเลย)\n ขั้นตอนนี้อาจดูยุ่งยาก แต่ไม่ระคายเคืองเท่าใช้สำลีชุบคลีนซิ่งวอเตอร์เช็ด แล้วเหมาะมากสำหรับคนที่ใช้ออยล์แล้วไม่ถูกโรค = ก็คือฉันเองค่ะ \n หรือจะใช้วอเตอร์หรือรีมูฟเวอร์เช็ดอายไลน์กับลิปก่อนก็จะทำให้ขั้นตอนง่ายขึ้น\n \n\n -ผลิตภัณฑ์นี้แทบไม่มีกลิ่น มีกลิ่นคล้ายพลาสติกนิดหน่อย ซึ่งเป็นกลิ่นที่มักเจอในคลีนซิ่งมิลค์หรือออยล์ทั่วไป พอล้างออกแล้วก็ไม่มีกลิ่นเหลือเลย\n -ส่วนผสมอ่อนโยนมากจนไม่เกิดสิวเลย ชอบมาก มีความเห็นว่าอ่อนโยนแบบนี้อาจล้างไม่สะอาด แต่ฉันใช้วิธีของตัวเองแล้วล้างออกหมดจดดี\n -อาจเพราะมีแพนธีนอล หลังล้างหน้าไม่ตึงเลย ชอบมากๆ!\n -ไม่ว่าจะมิลค์หรือออยล์ หลังล้างหน้าอาจมีความลื่นเหนอะหนะเหลืออยู่บ้าง ในฐานะคนผิวมันเป็นสิว ส่วนตัวแนะนำให้ล้างซ้ำด้วยโฟมอีกครั้ง\n -เนื้อไม่เหลวเกินไป เลยไม่เปลืองปริมาณการใช้ และหนืดพอดีทำให้นวดคลึงง่าย\n -ปั๊มออกมาได้ดีแต่บางครั้งอาจออกมาเยอะไปหน่อย\n \n\n > แนะนำสำหรับคนผิวมันเป็นสิวที่ไม่ชอบแรงทำความสะอาดที่แรงเกินไป คนผิวแพ้ง่าย คนที่แต่งหน้าเบาๆ หรือทาแค่ครีมกันแดด และคนที่ไม่ชอบความรู้สึกตึงหลังล้างหน้า!"},images:[],video:null},
    {id:"ADwbaO2q",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"수부지, 강한 세정력 제품으로 속당김 심하던 피부가 순한 조합으로 전환",en:"Combination (oily-dehydrated), switched from harsh-cleansing products that caused tightness to a gentle combo","zh-CN":"水油皮，强清洁力产品导致内干严重的肌肤换成温和组合","zh-TW":"外油內乾，用強力潔淨產品導致嚴重緊繃的肌膚換成溫和組合",ja:"インナードライ肌、強い洗浄力の製品でつっぱりがひどかった肌がマイルドな組み合わせに切り替え",th:"ผิวมันขาดน้ำ จากผิวที่ตึงมากเพราะใช้ผลิตภัณฑ์แรงทำความสะอาดสูง เปลี่ยนมาใช้คอมโบที่อ่อนโยนกว่า"},date:"2026-07-06",
      quote:{ko:"저는 거의 매일 메이크업을 하기에 매일매일 클렌징 제품을 사용하는데요..! 그러다 보니 여러 종류의 클렌징 제품을 써봤지만 정착하지 못해 매번 다른 제품을 구입해서 사용하다가 우연히 노마디아 제품들을 접해서 사용해봤습니다😆\n\n일단!! 저는 수부지인 피부타입 인데요.. 립앤아이 리무버나 오일 제형을 잘 사용하지 않습니당 그 이유가 너무 기름지고 무거운 느낌이 들어 오히려 더 찝찝하더라고요🥲 그래서 항상 세정력이 강한 폼클렌징을 자주 써왔던거 같아요… 그러다 보니 항상 세안을 하고 나면 바로 속당김이 심해 피부가 예민해지고 기초 제품을 빨리 바르지 않으면 아프기 까지 하더라고요😣\n세정력이 강한 제품들은 또, 아침에 사용하기에도 좀 부담스럽더라고요😖\n\n그러다 민감성 피부가 사용해도 자극이 적고, 진정 효과도 있다는 “블루 진정 판테놀 1% 클렌징 밀크“+”골든 호호바 10% 듀얼 마이크로 버블 클렌저“ 조합을 접하게 되었습니다 ‼️\n\n✨블루 진정 판테놀 1% 클렌징 밀크✨\n제형이 정말 부드러워서 눈에도 자극 없고!! 물로 씻어내고 난 뒤에도 미끄러운 찝찝한 느낌이 없어요😆\n\n\n크게 3가지가 정말 만족스러웠는데요🤭\n✔️부드러운 제형이라 피부에 자극이 적어요.\n✔️세안 후 속당김이 적어요.\n✔️아침에 사용하기에도 순해서 부담이 없어요.\n\n✨순하고 속당김이 적은 제품을 찾으시는 분들께 추천 드립니다!!✨",en:"I wear makeup almost every day, so I use cleansing products daily. I've tried a lot of different cleansing products but never settled on one, always buying something different each time, until I happened to come across NOMADIA's products and tried them😆\n\nFirst!! My skin type is combination (oily-dehydrated). I don't really use lip-and-eye removers or oil-type products, because the reason is they feel too greasy and heavy, which actually feels more unpleasant🥲 So I always ended up using strong-cleansing foam cleansers a lot… That meant I'd get severe tightness right after cleansing, my skin would get sensitive, and if I didn't apply my basic skincare quickly it would even hurt😣\nStrong cleansing products are also a bit burdensome to use in the morning😖\n\nThen I came across the combo of “Blue Calming Panthenol 1% Cleansing Milk” + “Golden Jojoba 10% Dual Micro Bubble Cleanser,” which is said to be low-irritation and calming even for sensitive skin ‼️\n\n✨Blue Calming Panthenol 1% Cleansing Milk✨\nThe texture is really soft, so no irritation even around the eyes!! And there's no slippery, unpleasant feeling after rinsing with water😆\n\n\nThree things were really satisfying:🤭\n✔️Soft texture means less irritation on skin.\n✔️Less tightness after cleansing.\n✔️Gentle enough to use in the morning without any burden.\n\n✨I recommend it to anyone looking for a gentle product with little tightness!!✨","zh-CN":"我几乎每天都化妆，所以每天都要用清洁产品……！用过很多种清洁产品但一直没定妆，每次都买不同的产品用，偶然接触到NOMADIA的产品试用了一下😆\n\n首先我是水油皮肤质……唇眼卸妆液或油类质地我不太常用，因为感觉太油腻沉重，反而更不清爽🥲所以一直常用清洁力强的洁面泡沫……结果洗完脸就立刻很紧绷，皮肤变敏感，不赶紧涂基础护肤品的话甚至会觉得刺痛😣\n清洁力强的产品早上用起来也有点负担😖\n\n后来接触到了敏感肌用也刺激少、还有舒缓效果的「蓝色舒缓泛醇1%洁面乳」+「金色荷荷巴10%双重微气泡洁面」组合‼️\n\n✨蓝色舒缓泛醇1%洁面乳✨\n质地真的很柔软，眼睛也没有刺激！！用水洗掉之后也没有滑腻不适的感觉😆\n\n\n有三点让我特别满意🤭\n✔️质地柔软，皮肤刺激少。\n✔️洗后紧绷感少。\n✔️早上用也很温和，没有负担。\n\n✨推荐给正在找温和、洗后不紧绷产品的人！！✨","zh-TW":"我幾乎每天都化妝，所以每天都要用卸妝產品……！用過各種卸妝產品但都沒有定下來，每次都買不同產品，偶然接觸到NOMADIA的產品試用看看😆\n\n首先！！我是外油內乾膚質……不太常用唇眼卸妝液或油類質地。原因是感覺太油太厚重，反而更不舒服🥲所以我一直都是用潔淨力強的洗面乳……然後洗完臉馬上就會很緊繃，皮膚變敏感，不趕快擦保養品甚至會痛😣\n潔淨力強的產品早上用起來也有點負擔😖\n\n後來遇到了敏感肌用也刺激較少、還有舒緩效果的「藍色舒緩泛醇1%卸妝乳」+「金盞荷荷芭10%雙重微氣泡潔顏乳」組合‼️\n\n✨藍色舒緩泛醇1%卸妝乳✨\n質地真的很柔軟，眼睛也不會刺激！！用水洗掉之後也不會有滑膩不舒服的感覺😆\n\n\n有3點真的很滿意🤭\n✔️質地柔軟，皮膚刺激少。\n✔️洗完臉後緊繃感少。\n✔️早上用也很溫和無負擔。\n\n✨推薦給正在找溫和、不緊繃產品的人！！✨",ja:"私はほぼ毎日メイクをするので毎日クレンジング製品を使っています…！それでいろいろな種類のクレンジング製品を試してきましたが定着できず、毎回違う製品を購入して使っていたところ、偶然NOMADIAの製品に出会って使ってみました😆\n\nまず！！私はインナードライ肌タイプなのですが…リップ&アイリムーバーやオイルタイプはあまり使いません。理由は油っぽくて重い感じがして、逆にべたついてしまうからです🥲なのでいつも洗浄力の強いフォームクレンジングをよく使っていた気がします…そのせいで洗顔後はいつもすぐつっぱりがひどくて肌が敏感になり、スキンケアをすぐ塗らないと痛くなることさえありました😣\n洗浄力の強い製品は朝使うにもちょっと負担がありました😖\n\nそんな中、敏感肌が使っても刺激が少なく鎮静効果もあるという「ブルー鎮静パンテノール1%クレンジングミルク」+「ゴールデンホホバ10%デュアルマイクロバブルクレンザー」の組み合わせに出会いました‼️\n\n✨ブルー鎮静パンテノール1%クレンジングミルク✨\nテクスチャーが本当に柔らかくて目にも刺激がない！！水で洗い流した後もぬるついてべたつく感じがありません😆\n\n\n大きく3つの点が本当に満足でした🤭\n✔️柔らかいテクスチャーで肌への刺激が少ないです。\n✔️洗顔後のつっぱりが少ないです。\n✔️朝使ってもマイルドで負担がありません。\n\n✨マイルドでつっぱりの少ない製品を探している方におすすめします！！✨",th:"ฉันแต่งหน้าแทบทุกวัน เลยต้องใช้ผลิตภัณฑ์คลีนซิ่งทุกวันด้วย..! เลยลองใช้ผลิตภัณฑ์คลีนซิ่งหลายแบบแต่ก็หาตัวที่ลงตัวไม่ได้สักที ต้องซื้อผลิตภัณฑ์ใหม่มาลองเรื่อยๆ จนบังเอิญได้มาลองใช้ผลิตภัณฑ์ของโนมาเดียค่ะ😆\n\nก่อนอื่น!! ฉันเป็นผิวมันขาดน้ำค่ะ.. ไม่ค่อยใช้ลิปแอนด์อายรีมูฟเวอร์หรือเนื้อออยล์เพราะรู้สึกมันและหนักเกินไป กลับทำให้รู้สึกไม่สบายผิวมากกว่า🥲 เลยมักใช้แต่โฟมล้างหน้าที่มีแรงทำความสะอาดสูง… พอเป็นแบบนั้นทุกครั้งที่ล้างหน้าเสร็จจะตึงมากทันที ผิวไวต่อสิ่งเร้า ถ้าไม่รีบทาสกินแคร์เร็วๆ ถึงกับรู้สึกเจ็บเลย😣\nแล้วผลิตภัณฑ์ที่แรงทำความสะอาดสูงก็รู้สึกมีภาระเกินไปสำหรับใช้ตอนเช้าด้วย😖\n\nจนกระทั่งได้มาเจอคอมโบ “บลูซูทติ้งแพนธีนอล 1% คลีนซิ่งมิลค์” + “โกลเด้นโฮโฮบา 10% ดูอัลไมโครบับเบิลคลีนเซอร์” ที่บอกว่าระคายเคืองน้อยแม้ผิวแพ้ง่ายก็ใช้ได้ แถมยังปลอบประโลมด้วย ‼️\n\n✨บลูซูทติ้งแพนธีนอล 1% คลีนซิ่งมิลค์✨\nเนื้อสัมผัสนุ่มนวลมากจนไม่ระคายเคืองตาเลย!! หลังล้างด้วยน้ำก็ไม่มีความลื่นเหนอะหนะที่ไม่สบายผิวเลย😆\n\n\nมี 3 จุดหลักที่พอใจมากค่ะ🤭\n✔️เนื้อสัมผัสนุ่มนวล ระคายเคืองผิวน้อย\n✔️หลังล้างหน้าตึงน้อยลง\n✔️ใช้ตอนเช้าก็อ่อนโยนไม่มีภาระ\n\n✨แนะนำสำหรับคนที่กำลังหาผลิตภัณฑ์ที่อ่อนโยนและไม่ทำให้ตึงหลังล้างหน้า!!✨"},images:["thumbnail/reviews/milk/ADwbaO2q_1.jpg"],video:null},
    {id:"A6gQMEgJ",rating:4,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지 민감 트러블, 턱 주변 트러블에도 자극 없이 사용",en:"Combination (oily-dehydrated)/Sensitive/Trouble-prone, no irritation even with breakouts around jawline","zh-CN":"水油皮敏感痘痘肌，下巴周围长痘也能无刺激使用","zh-TW":"外油內乾敏感痘痘肌，下巴周圍長痘也能無刺激使用",ja:"インナードライ敏感肌トラブル肌、あご周りのトラブルにも刺激なく使用",th:"ผิวมันขาดน้ำแพ้ง่ายเป็นสิว ใช้ได้โดยไม่ระคายเคืองแม้มีสิวรอบคาง"},date:"2026-06-06",
      quote:{ko:"수부지 민감성 트러블 피부가 남기는 리뷰입니다❤\n\n💧 사용감 & 텍스처\n부드러운 로션 같은 밀크 제형이라 피부에 자극 없이 롤링돼요. 진한 메이크업을 하는 편은 아니라서 선크림이나 가벼운 베이스 정도는 무리 없이 지워졌고, 세안 후에도 피부가 당기지 않아 좋았어요. 특히 건조한 날 사용하면 세안 후에도 촉촉함이 남아있는 느낌이라 만족스러웠습니다.\n\n📌 순한 세정력 & 피부 진정\n요즘 날씨가 더워져서 그런지 턱 주변에 트러블이 자주 올라와 고민이 많았는데, 이런 시기에는 세정 제품도 최대한 순한 걸 찾게 되더라구요. 이 제품은 사용하면서 자극받거나 붉어지는 느낌 없이 편안하게 사용할 수 있었어요. 아직 트러블이 눈에 띄게 줄었다고 말하기는 어렵지만, 피부 컨디션을 무너뜨리지 않는 순한 클렌저라는 점은 확실히 느껴졌습니다.\n\n세안 후 당김이 적고 촉촉함 유지\n부드러운 밀크 제형으로 자극 없이 사용 가능\n예민해진 피부에도 부담 없는 사용감",en:"A review from someone with combination (oily-dehydrated), sensitive, trouble-prone skin❤\n\n💧 Feel & texture\nIt's a soft lotion-like milk formula that rolls on skin with no irritation. I don't wear heavy makeup, so sunscreen or light base makeup came off without issue, and my skin didn't feel tight after cleansing either. Especially on dry days, there was still moisture left after cleansing, which was satisfying.\n\n📌 Gentle cleansing power & skin calming\nWith the weather getting hotter these days, I've been having a lot of trouble with breakouts around my jaw, and during times like this I end up looking for the gentlest cleansing products possible. I could use this comfortably without feeling irritated or getting redness. I can't say yet that my breakouts have noticeably decreased, but I definitely felt that it's a gentle cleanser that doesn't upset my skin's condition.\n\nLess tightness and moisture retained after cleansing\nCan use it with a soft milk formula with no irritation\nA comfortable feel even for sensitized skin","zh-CN":"这是水油皮敏感痘痘肌留下的测评❤\n\n💧 使用感&质地\n像乳液一样柔软的洁面乳质地，在皮肤上打圈无刺激。我不太化浓妆，防晒或轻底妆程度都能轻松卸掉，洗后皮肤也不紧绷，很喜欢。特别是干燥的日子用，洗后依然有水润感留存，很满意。\n\n📌 温和清洁力&皮肤舒缓\n最近天气变热，下巴周围经常长痘很烦恼，这种时期也会尽量找最温和的清洁产品。用这款的时候没有刺激或泛红的感觉，用起来很舒适。虽然还不能说痘痘明显减少了，但确实能感受到这是一款不会破坏皮肤状态的温和洁面产品。\n\n洗后紧绷感少、维持水润\n柔软的洁面乳质地，可无刺激使用\n对敏感期的皮肤也没有负担的使用感","zh-TW":"這是外油內乾敏感痘痘肌留下的心得❤\n\n💧 使用感&質地\n是柔軟乳液般的卸妝乳質地，在皮膚上打圈完全不刺激。我不太化濃妝，防曬乳或淡底妝都能輕鬆卸乾淨，洗完臉後皮膚也不緊繃，這點很喜歡。特別是乾燥的日子用，洗完臉後還留有水潤感，很滿意。\n\n📌 溫和潔淨力&肌膚舒緩\n最近天氣變熱，下巴周圍常常長痘痘讓我很困擾，這種時期也會盡量找最溫和的清潔產品。用這款產品時完全沒有刺激或泛紅的感覺，用起來很舒服。雖然還不能說痘痘明顯減少，但確實感覺得到這是不會破壞膚況的溫和卸妝乳。\n\n洗完臉緊繃感少、能維持水潤\n柔軟的卸妝乳質地，能無刺激使用\n對敏感的肌膚也毫無負擔的使用感",ja:"インナードライ敏感肌トラブル肌が残すレビューです❤\n\n💧使用感&テクスチャー\n柔らかいローションのようなミルクのテクスチャーで肌に刺激なくローリングできます。濃いメイクをする方ではないので日焼け止めや軽めのベースメイク程度は問題なく落ちて、洗顔後も肌がつっぱらなくて良かったです。特に乾燥する日に使うと洗顔後もしっとり感が残る感じで満足でした。\n\n📌マイルドな洗浄力&肌鎮静\n最近暑くなってきたせいか、あご周りにトラブルがよく出て悩みが多かったのですが、こういう時期はクレンジング製品もできるだけマイルドなものを探すようになりますよね。この製品は使用中に刺激を受けたり赤くなる感じなく快適に使うことができました。まだトラブルが目に見えて減ったとは言い難いですが、肌コンディションを崩さないマイルドなクレンザーだということは確かに感じました。\n\n洗顔後のつっぱりが少なくしっとり感が続く\n柔らかいミルクのテクスチャーで刺激なく使用可能\n敏感になった肌にも負担のない使用感",th:"นี่คือรีวิวจากผิวมันขาดน้ำแพ้ง่ายที่เป็นสิวค่ะ❤\n\n💧 ความรู้สึกเมื่อใช้ & เนื้อสัมผัส\nเป็นเนื้อมิลค์นุ่มเหมือนโลชั่น นวดคลึงบนผิวได้โดยไม่ระคายเคือง ไม่ค่อยแต่งหน้าเข้มข้น เลยล้างครีมกันแดดหรือเบสเบาๆ ออกได้ไม่มีปัญหา หลังล้างหน้าไม่ตึง ชอบมาก โดยเฉพาะวันที่ผิวแห้ง ใช้แล้วรู้สึกว่ายังคงความชุ่มชื้นไว้หลังล้างหน้า พอใจมาก\n\n📌 ทำความสะอาดอย่างอ่อนโยน & ปลอบประโลมผิว\nช่วงนี้อากาศร้อนขึ้น เลยมีสิวขึ้นรอบคางบ่อยจนกังวลมาก ช่วงแบบนี้เลยต้องหาผลิตภัณฑ์ทำความสะอาดที่อ่อนโยนที่สุดเท่าที่จะทำได้ ผลิตภัณฑ์นี้ใช้แล้วไม่รู้สึกระคายเคืองหรือแดงเลย ใช้ได้อย่างสบายผิว แม้จะบอกไม่ได้ชัดเจนว่าสิวลดลงเห็นผล แต่รู้สึกได้แน่นอนว่าเป็นคลีนเซอร์ที่อ่อนโยนและไม่ทำให้สภาพผิวแย่ลง\n\nหลังล้างหน้าตึงน้อยและคงความชุ่มชื้น\nเป็นเนื้อมิลค์นุ่มนวล ใช้ได้โดยไม่ระคายเคือง\nความรู้สึกเมื่อใช้ไม่มีภาระแม้ผิวไวต่อสิ่งเร้า"},images:[],video:null},
    {id:"ZOzPp8NJ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"미세먼지로 붉어지고 예민해진 피부에도 따가움 없음, 아이와 함께 사용",en:"No stinging even on skin reddened and sensitized by fine dust, used together with my child","zh-CN":"因雾霾泛红变敏感的皮肤也无刺痛感，可与孩子一起使用","zh-TW":"因空氣汙染泛紅敏感的肌膚也不刺痛，能和小孩一起用",ja:"微細粉塵で赤くなり敏感になった肌にもヒリヒリしない、子供と一緒に使用",th:"ไม่แสบแม้ผิวแดงและแพ้ง่ายขึ้นจากฝุ่น PM2.5 ใช้ร่วมกับลูกได้"},date:"2026-06-15",
      quote:{ko:"일주일 넘게 매일 저녁 세안할 때 쓰고 있어요! 일단 제형이 너무 묽지도 꾸덕하지도 않은 부드러운 밀크 타입이라 피부에 올렸을 때 롤링이 정말 잘 돼요. 이름에 '블루 진정'이랑 '판테놀'이 들어가서 기대를 많이 했는데, 요즘 미세먼지 때문에 붉어지고 예민해진 피부에 올려도 따가움이나 자극이 전혀 없어서 신기했어요.\n 가장 마음에 든 건 세안 후 마무리감이에요. 클렌징 오일은 너무 무겁고, 폼은 세안 후에 쩍쩍 갈라지듯 건조했는데, 이 제품은 물세안만 가볍게 해줘도 미끈거림 없이 촉촉하게 마무리돼요. 속당김 심하신 분들이 쓰시면 진짜 만족할 것 같아요. 향도 인위적인 향료 느낌이 아니라 거의 무향에 가까워서 호불호 없이 편안하게 쓰기 좋습니다. 아이와 함께 쓰기에도 좋은 제품같아요!",en:"I've been using it every evening for over a week for cleansing! First, the texture is a soft milk type that's neither too watery nor too thick, so it rolls on really well when applied to skin. Since the name includes 'Blue Calming' and 'Panthenol,' I had high expectations, and it was surprising that there was no stinging or irritation at all even when applied to skin that's reddened and sensitized from fine dust these days.\nWhat I liked most was the finish after cleansing. Cleansing oil feels too heavy, and foam left my skin feeling dry like it was cracking after cleansing, but this product finishes moist with no slipperiness even with just a light water rinse. I think people who suffer badly from tightness would be really satisfied. The scent isn't like artificial fragrance either — it's almost scentless, so it's comfortable to use without much preference divide. It seems like a good product to use together with my child too!","zh-CN":"已经连续一周多每天晚上洁面时都在用！首先质地不稀也不厚，是柔软的洁面乳类型，涂在脸上真的很好打圈。名字里有'蓝色舒缓'和'泛醇'，本来期待很高，结果最近因雾霾泛红变敏感的皮肤涂上去也完全没有刺痛或刺激，觉得很神奇。\n 最喜欢的是洗后的收尾感。卸妆油太厚重，洁面泡沫洗完又干燥得像要裂开，但这款只需简单水洗就能不滑腻地水润收尾。内干严重的人用了应该会很满意。香味也不是人工香料的感觉，几乎接近无香，用起来没有明显好恶，很舒适。感觉也适合和孩子一起用！","zh-TW":"已經連續一週以上每天晚上洗臉都在用！首先質地不會太稀也不會太厚，是柔軟的卸妝乳類型，放在皮膚上打圈非常順滑。因為名字裡有「藍色舒緩」和「泛醇」，本來就很期待，最近因為空氣汙染皮膚泛紅敏感，擦上去也完全不刺痛不刺激，覺得很神奇。\n 最喜歡的是洗完臉後的收尾感。卸妝油太厚重，洗面乳洗完又像要裂開一樣乾燥，但這款產品只要輕輕用清水洗一洗，就能水潤收尾、不會滑膩。內在乾燥嚴重的人用了應該會很滿意。香味也不是人工香料的感覺，幾乎接近無香，喜好不會太兩極，用起來很舒服。感覺也很適合和小孩一起用！",ja:"1週間以上毎晩洗顔時に使っています！まずテクスチャーがゆるすぎずとろみすぎない柔らかいミルクタイプなので、肌にのせたときローリングが本当にしやすいです。名前に「ブルー鎮静」と「パンテノール」が入っているので期待していましたが、最近微細粉塵で赤くなり敏感になった肌にのせてもヒリヒリや刺激が全くなくて驚きました。\n 一番気に入ったのは洗顔後の仕上がりです。クレンジングオイルは重すぎるし、フォームは洗顔後にパリパリするくらい乾燥していましたが、この製品は水洗いだけ軽くしてもぬるつきなくしっとりと仕上がります。つっぱりがひどい方が使うと本当に満足すると思います。香りも人工的な香料の感じではなくほぼ無香に近いので、好みを問わず快適に使いやすいです。子供と一緒に使うにも良い製品だと思います！",th:"ใช้ล้างหน้าตอนเย็นทุกวันมาเกินหนึ่งสัปดาห์แล้วค่ะ! เนื้อสัมผัสไม่เหลวไม่หนืดเกินไป เป็นเนื้อมิลค์นุ่มๆ พอลงบนผิวแล้วนวดคลึงได้ดีมาก ในชื่อมีคำว่า 'บลูซูทติ้ง' กับ 'แพนธีนอล' เลยคาดหวังไว้เยอะ พอลองใช้กับผิวที่แดงและแพ้ง่ายขึ้นจากฝุ่น PM2.5 ช่วงนี้ ก็ไม่มีอาการแสบหรือระคายเคืองเลย น่าทึ่งมาก\n จุดที่ชอบที่สุดคือความรู้สึกหลังล้างหน้า คลีนซิ่งออยล์หนักเกินไป โฟมก็แห้งจนหน้าตึงเหมือนจะแตกหลังล้างหน้า แต่ผลิตภัณฑ์นี้แค่ล้างน้ำเบาๆ ก็จบด้วยความชุ่มชื้นโดยไม่ลื่นเหนอะหนะ คนที่ตึงมากหลังล้างหน้าน่าจะพอใจมากจริงๆ กลิ่นก็ไม่เหมือนน้ำหอมสังเคราะห์ แทบไม่มีกลิ่นเลย เลยใช้ได้อย่างสบายใจไม่ว่าใครก็ตาม เหมาะใช้ร่วมกับลูกด้วยค่ะ!"},images:[],video:null},
    {id:"ZN6PdLaZ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"수부지, 세정 후에도 피지 과다 분비 없이 밸런스 유지",en:"Combination (oily-dehydrated), no excess sebum after cleansing, balance maintained","zh-CN":"水油皮，清洁后也不会皮脂过度分泌，维持平衡","zh-TW":"外油內乾，清潔後也不會皮脂過度分泌，維持平衡",ja:"インナードライ肌、洗浄後も皮脂の過剰分泌なくバランスをキープ",th:"ผิวมันขาดน้ำ หลังทำความสะอาดแล้วไม่มีไขมันส่วนเกินหลั่งมาก คงสมดุลผิวไว้ได้"},date:"2026-06-15",
      quote:{ko:"민감한 피부라 클렌징 제품 하나 고를 때도 신중한 편인데, 노마디아 블루 진정 판테놀은 사용하면서 정말 자극이 없어서 만족스러웠어요. 피부에 롤링할 때도 부드럽게 발리고, 세안 후에도 당기거나 따갑다는 느낌이 전혀 없어서 민감한 날에도 부담 없이 사용할 수 있었습니다.!!!\n \n\n 세정력도 생각보다 정말 괜찮았어요. 순한 제품들은 메이크업이 잘 안 지워지는 경우가 많은데, 이 제품은 깔끔하게 세정되면서도 피부를 자극하지 않는 점이 마음에 들었습니다. 특히 저처럼 수부지 피부는 클렌징 오일보다는 클렌징 밀크가 더 잘 맞는 경우가 많은데, 이 제품은 세정 후에도 피지가 분출돠자않고 촉톡하게 피부 밸런스를 잘 유지해줘서 수부지인 저에게는 정말 잘 맞았어요. 수부지 피부라면 짱 추천합니다!!👍👍\n \n\n 무엇보다 가장 마음에 들었던 건 세안 후 피부 컨디션이었어요. 보통 클렌징을 하고 나면 피부가 금방 건조해지거나 당기는 느낌이 드는데, 이 제품은 세안을 마치고 나면 피부에 수분감이 남아 있는 듯 촉촉하고 편안했어요. 이름처럼 진정되는 느낌도 들어서 피부가 예민한 날이나 붉은기가 올라온 날에도 부담 없이 사용할 수 있었습니다.\n \n\n 전체적으로 순한 사용감, 만족스러운 세정력, 세안 후 촉촉하고 편안한 마무리감까지 모두 갖춘 제품이라, 특히 민감성 피부나 수부지 피부인 분들에게 추천함니당~~",en:"I have sensitive skin so I'm careful even when choosing one cleansing product, and NOMADIA's Blue Calming Panthenol was really satisfying because there was truly no irritation while using it. It applies smoothly when rolled on skin, and there was no tightness or stinging at all after cleansing, so I could use it without worry even on sensitive days.!!!\n\nThe cleansing power was also better than I expected. Gentle products often don't remove makeup well, but this one cleanses cleanly while still not irritating skin, which I liked. Especially for combination (oily-dehydrated) skin like mine, cleansing milk tends to suit better than cleansing oil, and this product kept my skin balance moist without sebum surging out after cleansing, so it really suited me as someone with combination-oily-dehydrated skin. I highly recommend it if you have combination (oily-dehydrated) skin!!👍👍\n\nAbove all, what I liked most was my skin condition after cleansing. Usually after cleansing my skin gets dry or tight quickly, but with this product my skin felt like it still had moisture left, moist and comfortable, even after finishing. As the name suggests, it also felt calming, so I could use it without worry even on sensitive days or days when redness came up.\n\nOverall, it's a product with a gentle feel, satisfying cleansing power, and a moist, comfortable finish after cleansing all together — I especially recommend it to those with sensitive or combination (oily-dehydrated) skin~~","zh-CN":"我是敏感肌，选清洁产品也比较慎重，NOMADIA蓝色舒缓泛醇用起来真的没有刺激，很满意。在脸上打圈时也能顺滑抹开，洗后完全没有紧绷或刺痛的感觉，敏感的日子用起来也没有负担。!!!\n \n\n 清洁力也比想象中好很多。温和的产品经常卸不干净妆，但这款既能干净清洁又不会刺激皮肤，这点很喜欢。特别像我这种水油皮，比起卸妆油更适合洁面乳，这款洗后皮脂也不会过度分泌，能水润地维持皮肤平衡，对我这种水油皮真的很合适。水油皮的话超推荐!!👍👍\n \n\n 最喜欢的还是洗后的皮肤状态。一般洁面之后皮肤很快就会干燥或紧绷，但这款洗完之后皮肤水润又舒适，感觉水分还留在皮肤里。像名字一样也有种被舒缓的感觉，皮肤敏感或泛红的日子用起来也没有负担。\n \n\n 整体来说是兼具温和使用感、令人满意的清洁力、洗后水润舒适收尾感的产品，特别推荐给敏感肌或水油皮的朋友们~~","zh-TW":"我是敏感肌，連挑選一款卸妝產品都很謹慎，用了NOMADIA藍色舒緩泛醇之後，真的完全不刺激，讓我很滿意。在皮膚上打圈時很柔順，洗完臉後也完全不會緊繃或刺痛，就算是敏感的日子也能無負擔使用！！！\n\n\n 潔淨力也比想像中好很多。溫和的產品常常卸不乾淨妝，但這款能乾淨卸妝，同時又不刺激皮膚，這點很喜歡。特別是像我這種外油內乾肌，通常卸妝乳比卸妝油更適合，這款洗完之後皮脂也不會爆發，水潤地維持皮膚平衡，對外油內乾的我來說真的很合適。外油內乾的人真心推薦!!👍👍\n\n\n 最重要的是洗完臉後的膚況。一般洗完臉皮膚很快就會乾燥緊繃，但這款產品洗完之後皮膚還留有水潤感，很舒服。就像名字一樣有種被舒緩的感覺，就算是皮膚敏感或泛紅的日子也能無負擔使用。\n\n\n 整體來說是兼具溫和使用感、令人滿意的潔淨力、洗完臉後水潤舒適收尾感的產品，特別推薦給敏感肌或外油內乾的人~~",ja:"敏感肌なのでクレンジング製品を一つ選ぶときも慎重な方なのですが、NOMADIAブルー鎮静パンテノールは使っている間本当に刺激がなくて満足でした。肌にローリングするときも優しくなじみ、洗顔後もつっぱったりヒリヒリする感じが全くなくて、敏感な日でも気軽に使うことができました！！！\n \n\n 洗浄力も思ったより本当に良かったです。マイルドな製品はメイクがなかなか落ちないことが多いのですが、この製品はきれいに洗浄されながらも肌を刺激しない点が気に入りました。特に私のようなインナードライ肌はクレンジングオイルよりクレンジングミルクの方が合うことが多いのですが、この製品は洗浄後も皮脂が過剰に出ることなくしっとりと肌のバランスをよく保ってくれて、インナードライ肌の私には本当に合いました。インナードライ肌ならめちゃくちゃおすすめします！！👍👍\n \n\n 何より一番気に入ったのは洗顔後の肌コンディションでした。普通クレンジングをすると肌がすぐ乾燥したりつっぱる感じがしますが、この製品は洗顔を終えると肌に水分感が残っているようにしっとりして快適でした。名前の通り鎮静される感じもあって、肌が敏感な日や赤みが出た日でも気兼ねなく使うことができました。\n \n\n 全体的にマイルドな使用感、満足の洗浄力、洗顔後のしっとり快適な仕上がりまですべて備えた製品なので、特に敏感肌やインナードライ肌の方におすすめします〜〜",th:"เพราะเป็นผิวแพ้ง่าย เลยเลือกผลิตภัณฑ์คลีนซิ่งอย่างระมัดระวังมาก แต่บลูซูทติ้งแพนธีนอลของโนมาเดียใช้แล้วไม่ระคายเคืองเลยจริงๆ พอใจมาก นวดคลึงบนผิวก็ลื่นไหลนุ่มนวล หลังล้างหน้าไม่ตึงหรือแสบเลย ใช้ได้อย่างสบายใจแม้วันที่ผิวไวต่อสิ่งเร้า!!!\n \n\n แรงทำความสะอาดก็ดีกว่าที่คิดไว้มาก ผลิตภัณฑ์ที่อ่อนโยนมักล้างเมคอัพไม่ค่อยออก แต่ตัวนี้ล้างออกหมดจดโดยไม่ระคายเคืองผิว ชอบมาก โดยเฉพาะผิวมันขาดน้ำแบบฉันมักจะเข้ากับคลีนซิ่งมิลค์มากกว่าคลีนซิ่งออยล์อยู่แล้ว ผลิตภัณฑ์นี้หลังทำความสะอาดไม่มีไขมันส่วนเกินหลั่งออกมา คงสมดุลผิวไว้ได้ดีมาก เหมาะกับผิวมันขาดน้ำแบบฉันจริงๆ ถ้าเป็นผิวมันขาดน้ำแนะนำสุดๆ เลยค่ะ!!👍👍\n \n\n สิ่งที่ชอบที่สุดคือสภาพผิวหลังล้างหน้า ปกติล้างหน้าเสร็จผิวมักจะแห้งหรือตึงทันที แต่ผลิตภัณฑ์นี้หลังล้างหน้าเสร็จผิวยังคงความชุ่มชื้นและสบาย สมชื่อที่บอกว่าปลอบประโลม เลยใช้ได้อย่างสบายใจแม้วันที่ผิวไวต่อสิ่งเร้าหรือมีรอยแดงขึ้น\n \n\n โดยรวมเป็นผลิตภัณฑ์ที่ครบทั้งความอ่อนโยน แรงทำความสะอาดที่น่าพอใจ และจบด้วยความชุ่มชื้นสบายผิวหลังล้างหน้า อยากแนะนำเป็นพิเศษสำหรับคนผิวแพ้ง่ายหรือผิวมันขาดน้ำค่ะ~~"},images:[],video:null},
    {id:"qb2mELjq",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지 여드름성, 진한 메이크업 세정력 직접 테스트(사진)",en:"Combination (oily-dehydrated) acne-prone, direct test of cleansing power on heavy makeup (photo)","zh-CN":"水油皮痘痘肌，浓妆清洁力实测（附照片）","zh-TW":"外油內乾痘痘肌，實測濃妝潔淨力（附圖）",ja:"インナードライ肌ニキビ肌、濃いメイクの洗浄力を実際にテスト(写真)",th:"ผิวมันขาดน้ำเป็นสิว ทดสอบแรงทำความสะอาดกับเมคอัพเข้มข้นด้วยตัวเอง (มีรูป)"},date:"2026-06-05",
      quote:{ko:"클렌징 폼을 제외한 클렌징 제품은 클렌징 오일만 계속 사용하고 있었는데 좋은 기회로 드디어 클렌징 밀크를 사용해 봤네요!\n \n\n 피부 타입 : 수부지, 여드름성, 21N\n \n\n 📍제형\n - 묽은 생크림 같은 느낌이에요\n \n\n 📍세정력\n - 클렌징 워터랑 비슷하거나 좀 더 약한 정도의 세정력이에요! 선크림이나 비비 같은 베이스 제품들이 겉으로 보기에는 다 지워졌나 싶었었는데 자세히 보니까 떡진 것 같은 형태로 아직 남아있었어요\n \n\n - 테스트 결과(사진) : 1차로 리무버 사용 필수!\n \n\n [지우기 전 -> 클렌징 밀크 -> 물 추가 -> 씻어낸 후]\n \n\n *사진 속 화장품(순서대로) : 브로우카라, 마스카라, 글로우 틴트, 커버 비비, 파운데이션, 컨실러 펜슬, 팟 컨실러, 리퀴드 블러셔\n \n\n 📍저자극&진정\n - 롤링을 하는 제품이라 아예 자극이 없을 수는 없지만 일단 제형 자체가 부드러워서 얼굴이 불긋불긋 되는 건 전혀 없어요! 그리고 사용하는 동안 트러블도 없었어요!\n \n\n 📍피부결\n - 설명을 보면 딱히 각질 제거 같은 기능성은 없는 것 같은데 특별히 다른 제품 없이 단독으로만 사용해도 결이 매끈매끈해지고 부드러워진 느낌이에요\n \n\n 📍마무리감&당김\n - 단독 세안만 해도 될 정도로 뽀득뽀득해요 근데 신기하게 세안 직후에 바로 스킨케어를 안 해도 당김이 전혀 없어서 피부가 편안한 느낌이에요\n \n\n 클렌징 밀크는 처음 사용해 봤는데 되게 순하고 사용감이 좋아요 기대 이상으로 좋네요!",en:"Aside from cleansing foam, I'd only ever used cleansing oil for other cleansing products, but I finally got the chance to try cleansing milk!\n\nSkin type: combination (oily-dehydrated), acne-prone, 21N\n\n📍Texture\n- Feels like a watery fresh cream\n\n📍Cleansing power\n- The cleansing power is similar to or a bit weaker than cleansing water! Base products like sunscreen or BB cream looked like they were all wiped off on the surface, but looking closer, there was still some residue left in a clumped-up form\n\n- Test result (photo): First cleanse with remover required!\n\n[Before removing -> Cleansing milk -> Add water -> After rinsing]\n\n*Cosmetics in the photo (in order): brow mascara, mascara, glow tint, cover BB cream, foundation, concealer pencil, pot concealer, liquid blush\n\n📍Low irritation & calming\n- Since it's a product you roll on, there can't be zero irritation at all, but the formula itself is soft so there's no redness on the face at all! And there were no breakouts while using it!\n\n📍Skin texture\n- Looking at the description, there doesn't seem to be any exfoliating function specifically, but even used alone without any other products, my skin texture felt smoother and softer\n\n📍Finish & tightness\n- It's clean enough to be used as a single cleanse, but surprisingly there's no tightness at all even without doing skincare right after cleansing, so skin feels comfortable\n\nThis was my first time using cleansing milk, and it's really gentle with a great feel — better than expected!","zh-CN":"除了洁面泡沫之外，我一直只用卸妆油，这次借着好机会终于用上了洁面乳！\n \n\n 肤质：水油皮、痘痘肌、21岁女性\n \n\n 📍质地\n - 感觉像稀释的鲜奶油\n \n\n 📍清洁力\n - 清洁力和卸妆水差不多或稍弱一点！防晒或BB这类底妆产品表面看起来是卸干净了，但仔细看还是有一点像结块一样的残留\n \n\n - 测试结果（照片）：必须先用卸妆液做第一步！\n \n\n [卸妆前 -> 洁面乳 -> 加水 -> 洗净后]\n \n\n *照片里的化妆品（按顺序）：眉毛染膏、睫毛膏、发光唇釉、遮瑕BB、粉底液、遮瑕笔、盒装遮瑕、液体腮红\n \n\n 📍低刺激&舒缓\n - 是需要打圈的产品，完全没有刺激不太可能，但质地本身很柔软，脸完全不会红一块紫一块的！使用期间也没长痘！\n \n\n 📍肤质纹理\n - 看说明好像没有特别的去角质之类的功能性，但单独使用不搭配其他产品也感觉纹理变细腻柔软了\n \n\n 📍收尾感&紧绷\n - 单独清洁就足够干净了，神奇的是洗完立刻不做后续护肤也完全不紧绷，皮肤很舒适\n \n\n 第一次用洁面乳，感觉真的很温和使用感也很好，比预期更好！","zh-TW":"除了洗面乳之外的卸妝產品我一直都只用卸妝油，這次有好機會終於用了卸妝乳！\n\n\n 膚質：外油內乾、痘痘肌、21N\n\n\n 📍質地\n - 像稀釋過的鮮奶油\n\n\n 📍潔淨力\n - 潔淨力和卸妝水差不多或稍弱一點！防曬乳或BB霜這類底妝表面看起來好像卸乾淨了，但仔細看還是有點結塊殘留\n\n\n - 實測結果（附圖）：一定要先用卸妝液！！\n\n [卸妝前 -> 卸妝乳 -> 加水 -> 洗淨後]\n\n\n *照片中的化妝品（依序）：眉彩膏、睫毛膏、光澤唇釉、遮瑕BB、粉底液、遮瑕筆、罐裝遮瑕膏、液狀腮紅\n\n\n 📍低刺激&舒緩\n - 因為是需要打圈的產品，不能說完全零刺激，但質地本身很柔軟，完全不會讓臉泛紅發紅！使用期間也沒有長痘痘！\n\n\n 📍膚質觸感\n - 看說明沒有特別標榜去角質之類的功能性，但單獨使用也感覺膚質變得細緻柔滑\n\n\n 📍收尾感&緊繃感\n - 光是這樣洗也能有咕溜咕溜的乾淨感，神奇的是洗完臉後就算不馬上做保養也完全不緊繃，皮膚很舒服\n\n\n 第一次用卸妝乳，真的很溫和，使用感也很好，比預期還要滿意！",ja:"洗顔フォームを除くクレンジング製品はクレンジングオイルばかり使い続けていましたが、良い機会でついにクレンジングミルクを使ってみました！\n \n\n 肌タイプ：インナードライ肌、ニキビ肌、21N\n \n\n 📍テクスチャー\n - 緩めの生クリームのような感じです\n \n\n 📍洗浄力\n - クレンジングウォーターと同じくらいか、もう少し弱いくらいの洗浄力です！日焼け止めやBBクリームなどのベース製品が見た目は落ちたかなと思ったのですが、よく見るとダマになったような形でまだ残っていました\n \n\n - テスト結果(写真)：1回目にリムーバー使用は必須！\n \n\n [落とす前→クレンジングミルク→水を追加→洗い流した後]\n \n\n *写真の中のコスメ(順に)：眉マスカラ、マスカラ、グロウティント、カバーBBクリーム、ファンデーション、コンシーラーペンシル、ポットコンシーラー、リキッドチーク\n \n\n 📍低刺激&鎮静\n - ローリングする製品なので刺激が全くないわけではありませんが、テクスチャー自体が柔らかいので顔が赤くまだらになることは全くありません！そして使用中トラブルもありませんでした！\n \n\n 📍肌のキメ\n - 説明を見ると特に角質ケアのような機能性はないようですが、特に他の製品なしで単独で使っても肌のキメがすべすべと柔らかくなった感じがします\n \n\n 📍仕上がり&つっぱり\n - 単独洗顔だけでも良いくらいキュッキュッとします。でも不思議なことに洗顔直後にすぐスキンケアをしなくてもつっぱりが全くなくて肌が快適な感じです\n \n\n クレンジングミルクは初めて使いましたが、とてもマイルドで使用感が良いです。期待以上に良いですね！",th:"นอกจากโฟมล้างหน้าแล้ว ฉันใช้แต่คลีนซิ่งออยล์มาตลอด แต่ครั้งนี้ได้โอกาสดีมาลองคลีนซิ่งมิลค์ในที่สุดค่ะ!\n \n\n ประเภทผิว : ผิวมันขาดน้ำ เป็นสิว วัย 21\n \n\n 📍เนื้อสัมผัส\n - เหมือนวิปครีมเหลวๆ ค่ะ\n \n\n 📍แรงทำความสะอาด\n - แรงทำความสะอาดใกล้เคียงหรืออ่อนกว่าคลีนซิ่งวอเตอร์นิดหน่อย! ครีมกันแดดหรือบีบีครีมมองแวบแรกเหมือนจะหลุดออกหมดแล้ว แต่ดูใกล้ๆ ยังมีคราบจับตัวเป็นก้อนตกค้างอยู่\n \n\n - ผลการทดสอบ (มีรูป) : ต้องใช้รีมูฟเวอร์เป็นขั้นแรกก่อนเสมอ!\n \n\n [ก่อนล้าง -> คลีนซิ่งมิลค์ -> เติมน้ำ -> หลังล้างออก]\n \n\n *เครื่องสำอางในรูป (ตามลำดับ) : มาสคาร่าคิ้ว มาสคาร่า กลอสทินท์ คัฟเวอร์บีบี รองพื้น ดินสอคอนซีลเลอร์ คอนซีลเลอร์แบบพอต บลัชออนน้ำ\n \n\n 📍ระคายเคืองน้อย & ปลอบประโลม\n - เพราะต้องนวดคลึงจึงไม่มีทางไม่ระคายเคืองเลยเสียทีเดียว แต่เนื้อสัมผัสนุ่มนวลมากจนหน้าไม่แดงเลย! แล้วระหว่างใช้ก็ไม่มีสิวขึ้นเลย!\n \n\n 📍ผิวเนียนละเอียด\n - จากรายละเอียดสินค้าดูเหมือนจะไม่มีฟังก์ชันขจัดขุยเป็นพิเศษ แต่ใช้เดี่ยวๆ โดยไม่พึ่งผลิตภัณฑ์อื่นก็รู้สึกว่าผิวเนียนและนุ่มขึ้น\n \n\n 📍ความรู้สึกตอนจบ & ความตึง\n - สะอาดเอี๊ยดจนใช้เดี่ยวๆ ก็พอ แต่ที่น่าแปลกใจคือแม้ไม่รีบทาสกินแคร์ทันทีหลังล้างหน้าก็ไม่ตึงเลย ผิวรู้สึกสบายมาก\n \n\n เพิ่งลองใช้คลีนซิ่งมิลค์เป็นครั้งแรก อ่อนโยนมากและความรู้สึกเมื่อใช้ดีมาก ดีเกินคาดจริงๆ ค่ะ!"},images:[],video:null},
    {id:"AE7VkEkZ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"패키지·성분·사용감 종합 리뷰, 사계절 자극받은 피부 진정",en:"Overall review of package, ingredients, feel — calms skin stressed across all four seasons","zh-CN":"包装·成分·使用感综合测评，四季受刺激的皮肤得到舒缓","zh-TW":"包裝‧成分‧使用感綜合評論，四季受刺激的肌膚都能舒緩",ja:"パッケージ・成分・使用感の総合レビュー、四季を通して刺激を受けた肌を鎮静",th:"รีวิวรวมทั้งบรรจุภัณฑ์·ส่วนผสม·ความรู้สึกเมื่อใช้ ปลอบประโลมผิวที่ระคายเคืองได้ทุกฤดูกาล"},date:"2026-05-30",
      quote:{ko:"1. 첫인상\n일단 패키지부터 취향 저격! 이름에 '블루'가 들어가서 그런지 되게 깔끔하고 청량한 느낌이 들어요. 욕실에 그냥 툭 올려두기만 해도 감성 가득해서 인테리어 소품 같은 느낌? 게다가 위생적이고 양 조절하기 편한 펌핑형 용기라서 첫인상부터 완전 합격점 줬어요. 묵직한 제형이 투명하게 비치는 것도 예쁘더라고요~\n2. 성분 효과\n성분을 보니까 왜 다들 극찬하는지 알겠더라고요. 피부 장벽 하면 생각나는 '판테놀'이 무려 1%나 유효 함량으로 제대로 들어가 있어요. 세안하면서부터 피부 장벽을 보호해 주는 느낌! 여기에 붉은 기나 예민해진 피부를 토닥여주는 블루 진정 성분(구아이아줄렌 같은 성분들!)이 같이 들어있어서, 사계절 내내 외부 자극에 지친 피부를 편안하게 달래주기 딱 좋은 스펙이에요\n3. 사용감\n진짜 대박인 건 이 부드러운 롤링감이에요. 피부에 올렸을 때 뻑뻑한 느낌 전혀 없이 부드러운 로션처럼 사르르 펴 발라져요. 손가락이랑 얼굴 피부 사이에 완충 지대를 만들어주는 느낌이라 자극이 1도 없더라고요.\n물 닿으면 하얗게 변하는 유화 과정도 되게 산뜻해요. 간혹 클렌징 밀크 쓰고 나면 미끈거리거나 오일막이 남은 것처럼 답답한 제품들이 있잖아요? 근데 이건 그런 잔여감 없이, 물로 헹구고 나면 딱 수분 크림 바른 것처럼 촉촉하고 산뜻하게 마무리돼서 감탄했어요!!!\n4. 향\n화장품 살 때 향 중요하게 생각하시는 분들 많으시죠? 이건 인위적이고 독한 인공 향료 느낌이 아니라, 세안하면서 마음이 편안해지는 은은하고 자연스러운 향이 나요. 호불호 크게 갈리지 않을 싱그럽고 차분한 향조라, 하루 일과 끝내고 밤에 세안할 때 은근히 테라피 받는 것처럼 힐링 되는 기분이에요.\n5. 장점\n 속당김 없는 극강의 촉촉함: 건성이나 수부지 분들 세안하고 나면 얼굴 찢어질 거 같은 그 느낌 아시죠? 이건 수분 공급이랑 클렌징이 동시에 되는 기분이라 세안 후 당김이 진짜 없어요.ㅋ",en:"1. First impression\nThe packaging grabbed me right away! Maybe because the name includes 'Blue,' it has such a clean, refreshing feel. Just leaving it out in the bathroom already gives off good vibes, like an interior accent piece? Plus it's a hygienic, easy-to-control pump container, so it got a full pass from first impression. The way the thick texture shows through transparently is pretty too~\n2. Ingredient effects\nLooking at the ingredients, I get why everyone raves about it. Panthenol, the ingredient everyone thinks of for the skin barrier, is included at a full 1% effective content. It feels like it's protecting the skin barrier from the moment you start cleansing! On top of that, it also contains Blue Calming ingredients (like Guaiazulene) that soothe redness or sensitized skin, so it has just the spec to comfortably calm skin that's been worn down by external stress all year round\n3. Application feel\nWhat's really amazing is this soft rolling feel. When applied to skin, there's no stiff feeling at all — it spreads like a soft lotion melting away.\nIt feels like it creates a buffer zone between your fingers and facial skin, so there's zero irritation.\nThe emulsifying process, where it turns white on contact with water, is also really refreshing. You know how some cleansing milks leave you feeling stuffy with slipperiness or an oil film left behind? This one has none of that residue — after rinsing with water it finishes moist and refreshing, just like applying a moisture cream, which impressed me!!!\n4. Scent\nA lot of people care about scent when buying cosmetics, right? This isn't an artificial, strong fragrance feel — it has a mild, natural scent that makes you feel at ease while cleansing. It's a fresh, calm scent tone that shouldn't divide preferences much, and cleansing with it at night after a long day feels like getting therapy, kind of healing.\n5. Strengths\nExtreme moisture with no tightness: You know that feeling like your face is going to tear after cleansing if you have dry or combination-oily-dehydrated skin? With this, moisture supply and cleansing happen at the same time, so there's really no tightness after cleansing.ㅋ","zh-CN":"1. 第一印象\n首先包装就正中我的喜好！可能因为名字里有'蓝色'，感觉很干净清爽。就算随手放在浴室里也很有感觉，像个装饰品？而且是卫生又方便控制用量的泵头包装，第一印象就直接满分。厚重的质地隐约透出来也很好看~\n2. 成分功效\n看了成分就明白为什么大家都夸不停了。说起皮肤屏障就会想到的'泛醇'，有效含量竟然高达1%，实打实地加进去了。感觉从洁面这一步就在保护皮肤屏障！还搭配了能安抚泛红或敏感皮肤的蓝色舒缓成分（比如蓝甘菊薁之类的成分！），配方规格很适合一年四季安抚被外界刺激折腾的皮肤\n3. 使用感\n真正惊艳的是这种柔软的打圈感。涂在脸上完全没有干涩感，像柔软的乳液一样丝滑地抹开。感觉手指和脸部皮肤之间形成了一层缓冲，完全没有刺激。\n遇水变白的乳化过程也很清爽。有些洁面乳用完会滑腻或留下一层油膜让人觉得闷，但这款没有那种残留感，用水冲洗后就像涂了保湿霜一样水润清爽地收尾，让人惊叹!!!\n4. 香味\n买化妆品很看重香味的人不少吧？这款不是人工浓香的感觉，而是洗脸时让人心情放松的淡雅自然香味。是不太会有明显好恶的清新沉静香调，结束一天的工作在夜里洁面时，莫名有种被疗愈的感觉。\n5. 优点\n 不紧绷的极致水润感：干皮或水油皮的朋友洗完脸后那种脸要裂开的感觉，都懂吧？这款感觉是补水和清洁同时进行，洗后真的不紧绷。ㅋ","zh-TW":"1. 第一印象\n首先包裝就正中我的喜好！可能因為名字有「藍色」，感覺很簡約清爽。就算隨手放在浴室裡也很有質感，像個裝飾小物？而且是衛生又方便調整用量的按壓瓶，第一印象就完全過關。厚實的質地透出來的樣子也很好看~\n2. 成分效果\n看了成分才知道為什麼大家都讚不絕口。提到皮膚屏障就會想到的「泛醇」，居然以1%的有效含量確實添加進去。感覺從洗臉這一步就開始保護皮膚屏障！而且還加入了能安撫泛紅或敏感肌膚的藍色舒緩成分（癒創木薁之類的成分！），這樣的配方很適合安撫四季都被外界刺激搞得疲憊不堪的肌膚\n3. 使用感\n真正厲害的是這種柔順的滾動感。放在皮膚上完全沒有乾澀感，像柔軟的乳液一樣輕柔推開。感覺在手指和臉部皮膚之間形成了一層緩衝地帶，完全零刺激。\n碰到水就變白的乳化過程也很清爽。有時候用完卸妝乳之後會有滑膩感，或留下像油膜一樣悶悶的感覺對吧？但這款完全沒有那種殘留感，用水沖洗之後就像擦了水凝霜一樣水潤清爽地收尾，讓我很驚豔!!!\n4. 香味\n買保養品時很重視香味的人應該不少吧？這款不是人工濃重的合成香料感，而是洗臉時能讓心情放鬆的淡雅自然香氣。清新沉穩的調性，喜好不會太兩極，晚上結束一天洗臉時，隱隱有種被療癒的感覺。\n5. 優點\n 完全不緊繃的極致水潤感：乾性或外油內乾的人洗完臉常有那種臉要裂開的感覺對吧？這款感覺補水和清潔同時完成，洗完臉真的完全不緊繃。ㅋ",ja:"1. 第一印象\nまずパッケージからドンピシャ！名前に「ブルー」が入っているからか、とてもすっきりして清涼感があります。バスルームにただポンと置くだけでも雰囲気があってインテリア小物みたいな感じ?しかも衛生的で量調整しやすいポンプ容器なので第一印象から完全に合格点をあげました。とろみのあるテクスチャーが透けて見えるのもきれいでした〜\n2. 成分の効果\n成分を見たらなぜみんな絶賛するのか分かりました。肌バリアといえば思い浮かぶ「パンテノール」がなんと1%も有効成分としてちゃんと入っています。洗顔しながら肌バリアを守ってくれる感じ！ここに赤みや敏感になった肌をなだめてくれるブルー鎮静成分(グアイアズレンのような成分!)も一緒に入っていて、四季を通して外部刺激に疲れた肌を快適になだめてくれるのにぴったりのスペックです\n3. 使用感\n本当にすごいのはこの柔らかいローリング感です。肌にのせたとき、ゴワゴワした感じが全くなく柔らかいローションのようにすっとのびます。指と顔の肌の間にクッションゾーンを作ってくれる感じで刺激が1ミリもありませんでした。\n水に触れると白く変わる乳化プロセスもとてもさっぱりしています。たまにクレンジングミルクを使った後にぬるついたり、オイル膜が残ったように息苦しい製品ってありますよね?でもこれはそういう残留感なく、水ですすぐと化粧水クリームを塗ったようにしっとりさっぱり仕上がって感動しました！！！\n4. 香り\nコスメを買うとき香りを重視する方多いですよね?これは人工的でくどい人工香料の感じではなく、洗顔しながら心が落ち着く、ほのかで自然な香りがします。好みが大きく分かれない爽やかで落ち着いた香調で、一日の予定を終えて夜洗顔するとき何となくセラピーを受けているようにヒーリングされる気分になります。\n5. 長所\nつっぱりのない極上のしっとり感：乾燥肌やインナードライの方は洗顔した後に顔が裂けそうなあの感じ、分かりますよね?これは水分供給とクレンジングが同時にされる感じで洗顔後のつっぱりが本当にありません(笑)",th:"1. ความประทับใจแรก\nแค่บรรจุภัณฑ์ก็โดนใจแล้ว! อาจเพราะมีคำว่า 'บลู' อยู่ในชื่อ เลยให้ความรู้สึกสะอาดสดชื่นมาก แค่วางไว้ในห้องน้ำเฉยๆ ก็รู้สึกมีสไตล์เหมือนของแต่งบ้านเลย แถมเป็นขวดปั๊มที่ถูกสุขอนามัยและปรับปริมาณได้ง่าย ความประทับใจแรกผ่านฉลุยเลยค่ะ เนื้อสัมผัสข้นๆ ที่มองทะลุขวดใสได้ก็สวยดีด้วย~\n2. ประสิทธิภาพของส่วนผสม\nพอดูส่วนผสมแล้วก็เข้าใจว่าทำไมทุกคนถึงชมกันนักหนา มีแพนธีนอลซึ่งเป็นตัวแทนของการเสริมเกราะผิวถึง 1% เต็มๆ! รู้สึกเหมือนได้ปกป้องเกราะผิวตั้งแต่ขั้นตอนล้างหน้าเลย แถมยังมีส่วนผสมบลูซูทติ้ง (อย่างกวยอาซูเลน!) ที่ช่วยปลอบประโลมรอยแดงหรือผิวที่ไวต่อสิ่งเร้า เหมาะมากสำหรับปลอบประโลมผิวที่เหนื่อยล้าจากสิ่งกระตุ้นภายนอกได้ทุกฤดูกาล\n3. ความรู้สึกเมื่อใช้\nสิ่งที่เจ๋งที่สุดคือความรู้สึกนวดคลึงที่นุ่มนวลมาก พอลงบนผิวแล้วไม่มีความฝืดเลย ลื่นไหลเหมือนโลชั่นนุ่มๆ รู้สึกเหมือนมีชั้นกันกระแทกระหว่างนิ้วกับผิวหน้า เลยไม่ระคายเคืองเลยแม้แต่น้อย\nขั้นตอนอิมัลชันที่เปลี่ยนเป็นสีขาวเมื่อโดนน้ำก็สดชื่นมาก บางทีคลีนซิ่งมิลค์บางตัวใช้แล้วรู้สึกลื่นเหนอะหนะหรือเหมือนมีฟิล์มออยล์ตกค้างอึดอัดใช่ไหมคะ? แต่ตัวนี้ไม่มีคราบตกค้างแบบนั้นเลย พอล้างด้วยน้ำแล้วจบด้วยความชุ่มชื้นสดชื่นเหมือนทาครีมบำรุง ทึ่งมากจริงๆ!!!\n4. กลิ่น\nหลายคนให้ความสำคัญกับกลิ่นตอนซื้อเครื่องสำอางใช่ไหมคะ? ตัวนี้ไม่ใช่กลิ่นสังเคราะห์ฉุนแรง แต่เป็นกลิ่นอ่อนๆ เป็นธรรมชาติที่ทำให้ใจสงบตอนล้างหน้า เป็นกลิ่นสดชื่นนุ่มนวลที่ไม่ค่อยมีคนไม่ชอบ พอล้างหน้าตอนกลางคืนหลังเลิกงานแล้วรู้สึกเหมือนได้รับการบำบัดเยียวยาเบาๆ เลย\n5. ข้อดี\n ความชุ่มชื้นสุดขั้วที่ไม่ตึงเลย: คนผิวแห้งหรือผิวมันขาดน้ำรู้ใช่ไหมคะความรู้สึกหน้าเหมือนจะแตกหลังล้างหน้า? ตัวนี้ให้ทั้งความชุ่มชื้นและการทำความสะอาดไปพร้อมกัน หลังล้างหน้าเลยไม่ตึงเลยจริงๆ ฮ่าๆ"},images:[],video:null},
    {id:"A6gD1YaJ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"뾰루지(트러블) 잦은 피부, 자극 없는 약산성 케어로 추천",en:"Frequent breakouts (trouble), recommended for gentle mildly-acidic care with no irritation","zh-CN":"容易长痘（痘痘）的肌肤，推荐做无刺激的弱酸性护理","zh-TW":"容易長痘痘（肌膚困擾）的肌膚，推薦作為無刺激弱酸性保養",ja:"吹き出物(トラブル)が出やすい肌に、刺激のない弱酸性ケアとしておすすめ",th:"ผิวเป็นสิวง่าย แนะนำสำหรับการดูแลด้วยกรดอ่อนที่ไม่ระคายเคือง"},date:"2026-06-15",
      quote:{ko:"🧴세정력\n 선크림, 쿠션이나 파운데이션 같은 기본 베이스 메이크업, 피부 노폐물은 자극 없이 깔끔하게 잘 지워집니다. 포인트 메이크업은 리무버 사용 추천해요\n \n\n 🍃향\n 인위적이고 강한 인공 향료의 느낌이 아니라, 민감성 피부도 편안하게 사용할 수 있는 은은하고 마일드한 향이에요.\n \n\n ✨효과\n 세안 후 속당김 없이 보습이 유지됭 피부 장벽이 보호되는 느낌을 받았어요. 촉촉함이 오래 유지가 되더라고요\n \n\n 🤍사용감\n 너무 물처럼 흘러내리지 않고 어느 정도 점도와 무게감이 있는 텍스처예요.\n 물을 묻혔을 때 바로 녹아 사라지지 않고 롤링이 부드럽게 잘 되어 눈가나 코 옆 등 얇고 예민한 부위에도 자극이 거의 없었어요.\n 펌핑 용기도 부드럽게 작동하여 양 조절이 편리해요.\n \n\n 🔥추천 피부 타입\n 세안만 하면 얼굴이 쉽게 붉어지거나 뾰루지(트러블)가 자주 올라와 자극 없는 약산성 케어가 필요한 피부분께 추천\n 세안 후 극심한 속당김을 느끼며, 세안 단계부터 보습과 장벽 보호가 필요한 피부분께 추천",en:"🧴Cleansing power\nSunscreen, cushion or foundation basic base makeup, and skin impurities are removed cleanly without irritation. For point makeup, I'd recommend using a remover\n\n🍃Scent\nNot an artificial, strong fragrance feel — it has a mild, gentle scent that even sensitive skin can use comfortably.\n\n✨Effect\nI felt moisture was maintained and my skin barrier felt protected with no tightness after cleansing. The moisture lasted a long time\n\n🤍Application feel\nThe texture isn't too watery — it has some viscosity and weight to it.\nWhen it comes into contact with water it doesn't dissolve away instantly, it rolls on smoothly, so there was almost no irritation even on thin, sensitive areas like the eye area or beside the nose.\nThe pump container also operates smoothly, making it easy to control the amount.\n\n🔥Recommended skin types\nRecommended for people whose face easily reddens or breaks out (trouble) just from cleansing and who need irritation-free, mildly-acidic care\nRecommended for people who feel severe tightness after cleansing and need moisture and barrier protection starting from the cleansing step","zh-CN":"🧴清洁力\n 防晒、气垫或粉底这类基础底妆、皮肤废物都能无刺激地干净卸除。点妆建议搭配卸妆液使用\n \n\n 🍃香味\n 不是人工浓香的感觉，是敏感肌也能舒适使用的淡雅温和香味。\n \n\n ✨效果\n 洗后没有内干紧绷，能感受到保湿和皮肤屏障被保护的感觉。水润感能维持较久\n \n\n 🤍使用感\n 不是像水一样稀，是有一定粘度和厚重感的质地。\n 沾水后不会立刻化开消失，能顺滑打圈，眼周或鼻翼等薄弱敏感部位也几乎没有刺激。\n 泵头也运作顺畅，方便控制用量。\n \n\n 🔥推荐肤质\n 推荐给一洗脸脸就容易泛红或经常长痘痘、需要无刺激弱酸性护理的肤质\n 推荐给洗后极度内干、从洁面这一步就需要保湿和屏障保护的肤质","zh-TW":"🧴潔淨力\n 防曬乳、氣墊或粉底液這類基礎底妝、皮膚老廢物都能無刺激乾淨卸除。重點彩妝建議搭配卸妝液使用\n\n\n 🍃香味\n 不是人工強烈的合成香料感，而是敏感肌也能舒服使用的淡雅溫和香氣。\n\n\n ✨效果\n 洗完臉不緊繃，能感受到保濕維持、皮膚屏障被保護的感覺。水潤感能維持很久\n\n\n 🤍使用感\n 不會太稀像水一樣流下來，有一定的黏稠度和厚實感的質地。\n 沾水後不會馬上化開消失，能柔順地打圈，眼周或鼻翼旁這類薄嫩敏感部位也幾乎沒有刺激。\n 按壓瓶按壓順暢，方便調整用量。\n\n\n 🔥推薦膚質\n 洗臉就容易泛紅或常常長痘痘（肌膚困擾）、需要無刺激弱酸性保養的人推薦\n 洗完臉會感到極度緊繃、從洗臉這一步就需要保濕和屏障保護的人推薦",ja:"🧴洗浄力\n 日焼け止め、クッションファンデやファンデーションのような基本のベースメイク、肌の老廃物は刺激なくきれいに落ちます。ポイントメイクはリムーバーの使用をおすすめします\n \n\n 🍃香り\n 人工的で強い香料の感じではなく、敏感肌も快適に使えるほのかでマイルドな香りです。\n \n\n ✨効果\n 洗顔後つっぱりなく保湿が保たれ、肌バリアが守られている感じを受けました。しっとり感が長く続きました\n \n\n 🤍使用感\n 水のようにさらさら流れすぎず、ある程度とろみと重みのあるテクスチャーです。\n 水をつけたときすぐに溶けて消えず、優しくローリングでき、目元や鼻の横などの薄くて敏感な部位にも刺激がほとんどありませんでした。\n ポンプ容器もスムーズに動いて量の調整が便利です。\n \n\n 🔥おすすめの肌タイプ\n 洗顔だけで顔がすぐ赤くなったり吹き出物(トラブル)がよく出て刺激のない弱酸性ケアが必要な方におすすめ\n 洗顔後にひどいつっぱりを感じ、洗顔の段階から保湿とバリア保護が必要な方におすすめ",th:"🧴แรงทำความสะอาด\n ล้างครีมกันแดด คุชชั่นหรือรองพื้น รวมถึงสิ่งสกปรกบนผิว ออกได้หมดจดโดยไม่ระคายเคือง ส่วนเมคอัพจุดแนะนำให้ใช้รีมูฟเวอร์เพิ่มเติมค่ะ\n \n\n 🍃กลิ่น\n ไม่ใช่กลิ่นสังเคราะห์แรงๆ แต่เป็นกลิ่นอ่อนละมุนที่แม้ผิวแพ้ง่ายก็ใช้ได้อย่างสบายใจ\n \n\n ✨ประสิทธิภาพ\n รู้สึกว่าหลังล้างหน้าไม่ตึง ยังคงความชุ่มชื้นและปกป้องเกราะผิวไว้ ความชุ่มชื้นอยู่ได้นาน\n \n\n 🤍ความรู้สึกเมื่อใช้\n ไม่เหลวไหลย้อยเกินไป มีความหนืดและน้ำหนักพอดี\n พอโดนน้ำจะไม่ละลายหายไปทันที นวดคลึงได้นุ่มนวลดี แม้บริเวณบางและบอบบางอย่างรอบดวงตาหรือข้างจมูกก็แทบไม่ระคายเคืองเลย\n ปั๊มก็ทำงานได้ลื่นไหล ปรับปริมาณได้ง่าย\n \n\n 🔥ประเภทผิวที่แนะนำ\n แนะนำสำหรับคนที่แค่ล้างหน้าก็หน้าแดงง่ายหรือเป็นสิวบ่อยๆ ที่ต้องการการดูแลด้วยกรดอ่อนที่ไม่ระคายเคือง\n แนะนำสำหรับคนที่รู้สึกตึงมากหลังล้างหน้า และต้องการความชุ่มชื้นกับการปกป้องเกราะผิวตั้งแต่ขั้นตอนล้างหน้า"},images:[],video:null},
    {id:"AGE1mlXZ",rating:4,skinType:{ko:"중성",en:"Normal skin","zh-CN":"中性","zh-TW":"中性肌膚",ja:"普通肌",th:"ผิวธรรมดา"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"중성/민감, 어릴 때 아토피 있던 예민 피부도 트러블 없음",en:"Normal/Sensitive, sensitive skin with childhood atopic dermatitis also had no breakouts","zh-CN":"中性/敏感，小时候有特应性皮炎的敏感肌也不长痘","zh-TW":"中性/敏感，小時候有異位性皮膚炎的敏感肌也不長痘痘",ja:"普通肌/敏感肌、子供の頃アトピーがあった敏感肌もトラブルなし",th:"ผิวธรรมดา/แพ้ง่าย แม้เคยเป็นภูมิแพ้ผิวหนังตอนเด็กก็ไม่เกิดสิว"},date:"2026-06-11",
      quote:{ko:"💓 성분이 매우 순하다.\n어렸을때 아토피가 심했어서 피부가 예민한 편인데 1주일 이상 매일 사용해도 피부 트러블이나 자극이 없었어요 클렌징 제품들은 자극이 많아 항상 신중하게 고르는 편인데 이 제품 마음 놓고 사용할 수 있을 것 같아용\n\n💓 세안 후 당김없이 촉촉함💧\n유명한 클렌징 제품들 사용하면 사용 후 피부가 너무 당길때가 많은데 이 재품은 유화과정에서부터 촉촉함이 느껴지고 2차세안까지 마쳐도 당기지 않아 넘 좋았어요 저도 건성피부라 세안 후 당김이 심한데 이 제품 잘 사용했어요☺️\n\n💓 부드러운 사용감\n제형자체가 너무 부드럽고 촉촉해서 클렌징 하는동안 자극 일도 없고 피부가 편해요! 촉촉한 로션으로 클렌징 하는 기분입니당\n\n🧡총평\n민감하고 건조한 피부에 자극 없이 클렌징 가능한 밀크👍🏻",en:"💓 The ingredients are very gentle.\nI had severe atopic dermatitis as a kid, so my skin is on the sensitive side, but even using it every day for over a week, I had no breakouts or irritation. I'm always careful when picking cleansing products since they can be quite irritating, but I feel like I can use this one with peace of mind\n\n💓 Moist with no tightness after cleansing💧\nWith well-known cleansing products, my skin often feels really tight after use, but with this product I could feel moisture from the emulsifying stage onward, and even after finishing with a second cleanse, there was no tightness, which I really liked. I also have dry skin so I get a lot of tightness after cleansing, but I could use this product well☺️\n\n💓 Soft application feel\nThe texture itself is so soft and moist that there's zero irritation while cleansing, and skin feels comfortable! It feels like cleansing with a moist lotion\n\n🧡Overall review\nA milk that lets sensitive, dry skin cleanse with no irritation👍🏻","zh-CN":"💓 成分非常温和。\n小时候特应性皮炎很严重，皮肤比较敏感，连续一周以上每天使用也没有出现皮肤问题或刺激，清洁产品刺激性大，我一直都很慎重挑选，这款用起来应该可以放心。\n\n💓 洗后不紧绷、很水润💧\n用一些知名洁面产品后皮肤经常很紧绷，但这款从乳化过程就能感觉到水润感，做完二次清洁也不紧绷，真的很喜欢。我也是干皮，洗后紧绷感严重，这款用起来很不错☺️\n\n💓 柔软的使用感\n质地本身非常柔软水润，清洁过程中没有任何刺激，皮肤很舒适！有种用水润乳液清洁的感觉。\n\n🧡总评\n适合敏感干燥肌肤无刺激清洁的洁面乳👍🏻","zh-TW":"💓 成分非常溫和。\n小時候異位性皮膚炎很嚴重，皮膚偏敏感，連續使用一週以上每天用也沒有出現肌膚困擾或刺激。卸妝產品常常刺激性較大，我一直都很謹慎挑選，這款用起來可以很放心\n\n💓 洗完臉不緊繃、水潤💧\n用很多有名的卸妝產品洗完臉常常會很緊繃，但這款從乳化過程就能感覺到水潤感，就算做完二次清潔也不緊繃，真的很喜歡。我也是乾性肌，洗完臉緊繃感很嚴重，這款用起來很不錯☺️\n\n💓 柔順的使用感\n質地本身非常柔軟水潤，卸妝過程中完全沒有刺激，皮膚很舒服！感覺就像用水潤乳液在卸妝一樣\n\n🧡總評\n敏感又乾燥的肌膚也能無刺激卸妝的卸妝乳👍🏻",ja:"💓成分がとてもマイルド\n子供の頃アトピーがひどかったので肌が敏感な方ですが、1週間以上毎日使っても肌トラブルや刺激がありませんでした。クレンジング製品は刺激が多いのでいつも慎重に選ぶ方ですが、この製品は安心して使えそうです\n\n💓洗顔後つっぱりなくしっとり💧\n有名なクレンジング製品を使うと使用後に肌がすごくつっぱることが多いのですが、この製品は乳化プロセスからしっとり感が感じられて、2回目の洗顔まで終えてもつっぱらなくてとても良かったです。私も乾燥肌で洗顔後のつっぱりがひどいのですが、この製品はうまく使えました☺️\n\n💓柔らかい使用感\nテクスチャー自体がとても柔らかくしっとりしているので、クレンジング中に刺激も全くなく肌が快適です！しっとりしたローションでクレンジングしている気分です\n\n🧡総評\n敏感で乾燥した肌に刺激なくクレンジングできるミルク👍🏻",th:"💓 ส่วนผสมอ่อนโยนมาก\nตอนเด็กเคยเป็นภูมิแพ้ผิวหนังหนักมาก เลยเป็นผิวแพ้ง่าย แต่ใช้ทุกวันเกินหนึ่งสัปดาห์แล้วไม่มีสิวหรือระคายเคืองเลย ปกติเลือกผลิตภัณฑ์คลีนซิ่งอย่างระมัดระวังเพราะมักระคายเคือง แต่ตัวนี้ใช้ได้อย่างสบายใจเลยค่ะ\n\n💓 หลังล้างหน้าชุ่มชื้นไม่ตึง💧\nผลิตภัณฑ์คลีนซิ่งชื่อดังหลายตัวใช้แล้วผิวมักตึงมาก แต่ตัวนี้รู้สึกชุ่มชื้นตั้งแต่ขั้นตอนอิมัลชัน แม้ล้างหน้าครั้งที่สองเสร็จก็ยังไม่ตึงเลย ชอบมาก ฉันเองก็เป็นผิวแห้งที่ตึงมากหลังล้างหน้า แต่ใช้ตัวนี้ได้ดีเลยค่ะ☺️\n\n💓 ความรู้สึกเมื่อใช้นุ่มนวล\nเนื้อสัมผัสนุ่มนวลและชุ่มชื้นมาก ระหว่างล้างหน้าไม่ระคายเคืองเลย ผิวสบายมาก! รู้สึกเหมือนล้างหน้าด้วยโลชั่นชุ่มชื้นเลยค่ะ\n\n🧡สรุป\nเป็นมิลค์ที่ทำความสะอาดได้โดยไม่ระคายเคือง เหมาะกับผิวแพ้ง่ายและผิวแห้ง👍🏻"},images:[],video:null},
    {id:"ZX1jeG5q",rating:5,skinType:{ko:"중성",en:"Normal skin","zh-CN":"中性","zh-TW":"中性肌膚",ja:"普通肌",th:"ผิวธรรมดา"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"중성, 장벽 약한 날·아침 세안용으로 적합",en:"Normal, suitable for mornings or days when the barrier feels weak","zh-CN":"中性，适合屏障较弱的日子·早晨洁面使用","zh-TW":"中性，適合屏障較弱的日子‧早晨洗臉使用",ja:"普通肌、バリアが弱った日・朝の洗顔用に適合",th:"ผิวธรรมดา เหมาะสำหรับวันที่เกราะผิวอ่อนแอ·ใช้ล้างหน้าตอนเช้า"},date:"2026-06-05",
      quote:{ko:"전체적으로 굉장히 순한 느낌의 클렌징 밀크였어요. 이름처럼 판테놀 성분 때문인지 세안하면서도 피부가 편안한 느낌이 들었고, 클렌징 후에도 얼굴이 쉽게 당기지 않아서 만족스러웠어요.\n \n\n 제형은 부드러운 로션 같은 밀크 타입이라 피부에 자극 없이 롤링하기 좋았어요. 특히 피부 컨디션이 예민한 날이나, 장벽이 약해졌을 때 사용하기 부담이 덜했어요. 세정 후에 뽀득하게 마무리되는 스타일은 아니고, 촉촉함이 살짝 남는 타입이라 건조한 피부에는 꽤 잘 맞을 것 같다는 생각이 들었어요.\n \n\n 아침 세안용으로 사용했을 때 특히 만족도가 높았어요. 밤사이 올라온 유분이나 가벼운 노폐물을 부드럽게 정리해주는 느낌이라 피부 부담이 적었고, 세안 후 바로 피부가 붉어지거나 당기는 느낌이 적어서 좋았어요.\n \n\n 또 진정 라인 제품답게 사용하면서 자극감이나 화끈거림이 거의 없었고, 향도 강하지 않아서 예민한 피부가 사용하기 괜찮은 제품이라는 인상이었어요.\n \n\n ✔️ 피부 장벽 약한 분\n ✔️ 세안 후 당김 심한 분\n ✔️ 자극 적은 클렌징 찾는 분\n ✔️ 아침 세안용 제품 찾는 분들께 잘 맞을 것 같아요.",en:"Overall it felt like a very gentle cleansing milk. True to the name, maybe because of the Panthenol, my skin felt comfortable even while cleansing, and my face didn't easily feel tight after cleansing either, which was satisfying.\n\nThe texture is a soft lotion-like milk type, good for rolling onto skin without irritation. It felt especially low-burden to use on days when my skin condition was sensitive or my barrier had weakened. It doesn't finish with a squeaky-clean feel — a bit of moisture stays behind — so I think it'd suit dry skin quite well.\n\nSatisfaction was especially high when I used it for morning cleansing. It felt like it gently cleared away oil and light impurities that built up overnight, so it was low-burden on skin, and there was less redness or tightness right after cleansing, which I liked.\n\nAlso, true to being from the calming line, there was almost no irritation or burning sensation while using it, and the scent isn't strong either, giving the impression of a product that sensitive skin can use comfortably.\n\n✔️ Those with a weak skin barrier\n✔️ Those with severe tightness after cleansing\n✔️ Those looking for a low-irritation cleanser\n✔️ Those looking for a morning cleansing product — this should suit you well.","zh-CN":"整体是使用感非常温和的洁面乳。可能因为像名字一样含有泛醇成分，洗脸的同时皮肤也感觉很舒适，清洁后脸也不容易紧绷，很满意。\n \n\n 质地是柔软的乳液型洁面乳，能无刺激地在皮肤上打圈，很好用。特别是皮肤状态敏感的日子，或屏障变弱的时候用起来负担较小。清洁后不是那种洗到吱吱作响的干净感，而是留有一点水润，感觉对干燥肌肤挺合适的。\n \n\n 早上洁面用满意度特别高。感觉能温和整理夜间产生的油分和轻微废物，皮肤负担较小，洗后也不容易马上泛红或紧绷，很喜欢。\n \n\n 而且不愧是舒缓系列产品，使用时几乎没有刺激感或灼热感，香味也不浓，给人的印象是敏感肌也能放心使用的产品。\n \n\n ✔️ 皮肤屏障较弱的人\n ✔️ 洗后严重紧绷的人\n ✔️ 想找刺激少的洁面产品的人\n ✔️ 想找早晨洁面用产品的人，应该都很适合。","zh-TW":"整體來說是感覺非常溫和的卸妝乳。可能因為名字裡的泛醇成分，洗臉的同時皮膚也感覺很舒服，卸妝後臉也不容易緊繃，很滿意。\n\n\n 質地是柔軟的乳液型卸妝乳，能無刺激地在皮膚上打圈，很順手。特別是膚況敏感的日子，或屏障變弱時，使用起來負擔比較小。清潔後不是那種咕溜咕溜的乾淨收尾，而是稍微留一點水潤感的類型，感覺對乾燥肌應該蠻適合的。\n\n\n 當作早晨洗臉用時滿意度特別高。感覺能柔順整理一夜間產生的油脂和輕微老廢物，皮膚負擔較小，洗完臉後也比較不會馬上泛紅或緊繃，這點很喜歡。\n\n\n 而且不愧是舒緩系列產品，使用時幾乎沒有刺激感或灼熱感，香味也不濃，給人一種敏感肌也能使用的印象。\n\n\n ✔️ 皮膚屏障較弱的人\n ✔️ 洗完臉容易嚴重緊繃的人\n ✔️ 想找刺激較少的卸妝產品的人\n ✔️ 想找早晨洗臉用產品的人，應該都會很適合。",ja:"全体的にとてもマイルドな感じのクレンジングミルクでした。名前の通りパンテノール成分のおかげか、洗顔しながらも肌が快適な感じがして、クレンジング後も顔が簡単につっぱらなくて満足でした。\n \n\n テクスチャーは柔らかいローションのようなミルクタイプで肌に刺激なくローリングしやすかったです。特に肌コンディションが敏感な日や、バリアが弱くなったときに使う負担が少なかったです。洗浄後にキュッキュッと仕上がるタイプではなく、しっとり感が少し残るタイプなので、乾燥肌にはかなり合いそうだと思いました。\n \n\n 朝の洗顔用として使ったとき特に満足度が高かったです。夜の間に出た油分や軽い老廃物を優しく整えてくれる感じで肌への負担が少なく、洗顔後すぐに肌が赤くなったりつっぱる感じが少なくて良かったです。\n \n\n また鎮静ラインの製品らしく、使用中に刺激感やヒリヒリ感がほとんどなく、香りも強くないので敏感肌が使うのに良い製品という印象でした。\n \n\n ✔️肌バリアが弱い方\n ✔️洗顔後のつっぱりがひどい方\n ✔️刺激の少ないクレンジングを探している方\n ✔️朝の洗顔用製品を探している方に合いそうです。",th:"โดยรวมเป็นคลีนซิ่งมิลค์ที่รู้สึกอ่อนโยนมาก อาจเพราะมีแพนธีนอลสมชื่อ ระหว่างล้างหน้าผิวรู้สึกสบาย และหลังล้างหน้าไม่ค่อยตึง พอใจมาก\n \n\n เป็นเนื้อมิลค์นุ่มนวลเหมือนโลชั่น นวดคลึงบนผิวได้ดีโดยไม่ระคายเคือง โดยเฉพาะวันที่ผิวไวต่อสิ่งเร้าหรือเกราะผิวอ่อนแอ ใช้แล้วไม่มีภาระ ไม่ได้จบด้วยความรู้สึกสะอาดเอี๊ยด แต่เป็นแบบที่ยังคงความชุ่มชื้นไว้นิดหน่อย คิดว่าน่าจะเหมาะกับผิวแห้งมาก\n \n\n ใช้ล้างหน้าตอนเช้าแล้วรู้สึกพอใจเป็นพิเศษ ช่วยจัดการไขมันหรือสิ่งสกปรกเบาๆ ที่สะสมข้ามคืนได้อย่างนุ่มนวล ไม่มีภาระต่อผิว หลังล้างหน้าไม่ค่อยแดงหรือตึงทันที ชอบมาก\n \n\n แล้วสมกับเป็นไลน์ผลิตภัณฑ์ปลอบประโลม ใช้แล้วแทบไม่รู้สึกระคายเคืองหรือแสบร้อนเลย กลิ่นก็ไม่แรง ให้ความรู้สึกว่าเป็นผลิตภัณฑ์ที่ผิวแพ้ง่ายใช้ได้สบายใจ\n \n\n ✔️ คนที่เกราะผิวอ่อนแอ\n ✔️ คนที่ตึงมากหลังล้างหน้า\n ✔️ คนที่กำลังหาคลีนซิ่งที่ระคายเคืองน้อย\n ✔️ คนที่กำลังหาผลิตภัณฑ์ล้างหน้าตอนเช้า น่าจะเหมาะมากค่ะ"},images:[],video:null},
    {id:"qb2B9xVq",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"극건성+요철 고민, 오일 대비 유수분 밸런스·요철 개선 체감",en:"Extremely dry + concerned about texture bumps, felt improved oil-moisture balance and texture vs. oil","zh-CN":"极干皮+皮肤凹凸不平困扰，相比油类感受到水油平衡、凹凸改善","zh-TW":"極乾性+凹凸不平困擾，比起油類更能感受到油水平衡‧凹凸改善",ja:"極度の乾燥肌+凹凸悩み、オイルに比べて水分・油分バランス・凹凸の改善を実感",th:"ผิวแห้งมาก+กังวลผิวขรุขระ - รู้สึกได้ว่าสมดุลน้ำ-มันและผิวขรุขระดีขึ้นเทียบกับออยล์"},date:"2026-05-30",
      quote:{ko:"🩷 피부타입: 여름에도 건조한 극건성 타입이고 민감한편은 아니예요. 모공은 잔잔하게 있지만 큰 모공이 많이 있지는 않아요. 유수분 밸러스가 안좋은편이라 요철은 있어요\n\n🩷사용기간: 26.05 봄-초여름 사용했어요 \n\n🩷사용간격: 저녁세안으로 하루에 1번 사용했어요\n\n🩷향기: 향료가 따로 첨가되어있지는 않은 것 같아요. 무향에 가깝습니다 \n\n🩷제형: 평소에 클렌징 오일을 써서 그런가 오일에 비해서 확실히 덜 오일리하고 부드러워요. 물조금 뭍히면 롤링도 잘되고 크게 미끌거리지 않아서 좋아요\n\n🩷용기:하늘색 플라스틱 용기에 담겨있고 펌프를 누르면 적당량이 나와요. 디자인적으로 용기가 이뻐서 좋아요\n\n🩷성분: 우선 20가지 유해 성분 모두다 없습니다! 화장품 선정할때 자극 없는 성분을 유심히 체크하는 편인데 그 점이 참 좋았어요. 자극 전혀없이 무난해요. 그리고 보습에 도움되는 글리세린, 스쿠알란,피부장벽 개선에 좋은 판테놀, 콜레스테롤, 알라토닌 등 여러좋은 성분이 들어가 있어서 믿음이 가네요\n\n🩷효능&보습력: 순한 클렌징 밀크라서 데일리로 사용하기에 확실히 부담없구요, 저는 아이리무버로 눈화장은 따로지워서 눈화장은 잘 모르겠으나 피부쪽은 오일이랑 비교했을때 세정력이 특별히 약하지 않아요. 오일사용할때보다 더 피부 요철도 줄어들고 유수분 밸런스도 잡히는것 같아서 좋아요. \n\n🩷총평: 2차 세안 하기전에, 이거만 했을때 미끌거리거나 오일리하거나 하지 않아서 마음에 들어요. 좋은제품 같은데 브랜드도 더 유명해지면 좋겠어요!!",en:"🪷Skin type: Extremely dry even in summer, and I'm not particularly sensitive. I have faint pores but not many large ones. My oil-moisture balance isn't great so I have some texture bumps\n\n🪷Duration of use: Used spring–early summer 2026.05\n\n🪷Frequency: Used once a day for evening cleansing\n\n🪷Scent: Doesn't seem to have added fragrance. Nearly scentless\n\n🪷Texture: Since I usually use cleansing oil, this feels definitely less oily and softer compared to oil. It rolls on well with a bit of water added and isn't very slippery, which I like\n\n🪷Container: Comes in a sky-blue plastic container, and pressing the pump dispenses just the right amount. I like it because the container design is pretty\n\n🪷Ingredients: First, it's free of all 20 harmful ingredients! I'm the type who checks carefully for irritating ingredients when choosing cosmetics, so that part was really nice. It's mild with basically no irritation at all. And it contains glycerin for moisture, squalane, plus Panthenol, cholesterol, allantoin and other good ingredients for skin barrier improvement, so it feels trustworthy\n\n🪷Efficacy & moisturizing power: Being a gentle cleansing milk, it's definitely low-burden to use daily. I use a separate eye remover for eye makeup so I can't speak to that, but for skin, compared to oil the cleansing power isn't especially weak. Compared to when I used oil, the texture bumps have reduced more and the oil-moisture balance seems better too, which I like.\n\n🪷Overall review: Before doing a second cleanse, using just this alone doesn't feel slippery or oily, which I like. Seems like a good product — I hope the brand gets even more well-known too!!","zh-CN":"🩷 肤质：夏天也干燥的极干性肌肤，不算特别敏感。有细小毛孔但不算特别多大毛孔。水油平衡不太好，有点皮肤凹凸不平\n\n🩷使用时间：2026年5月春季到初夏用的\n\n🩷使用频率：晚上洁面时每天用一次\n\n🩷香味：好像没有额外添加香料。接近无香\n\n🩷质地：平时用卸妆油，对比之下这款明显不那么油腻，更柔软。沾点水打圈也很顺滑，不会太滑腻，很喜欢\n\n🩷包装：装在天蓝色塑料瓶里，按压泵头会挤出适量。设计上瓶子很好看，这点也喜欢\n\n🩷成分：首先20种有害成分全都不含！挑化妆品时我比较在意有没有刺激成分，这点很好。完全没有刺激，很稳妥。而且含有帮助保湿的甘油、角鲨烷，对皮肤屏障改善有好处的泛醇、胆固醇、尿囊素等多种好成分，很让人信任\n\n🩷功效&保湿力：是很温和的洁面乳，日常使用确实没有负担，我眼妆是用眼部卸妆液另外卸的所以不清楚眼妆效果如何，但脸部清洁力和油类相比并不算特别弱。比用油类的时候皮肤凹凸感也变少了，水油平衡感觉也更好，很喜欢。\n\n🩷总评：在做二次清洁之前，光用这个也不会滑腻或油腻，这点很喜欢。感觉是个好产品，希望品牌能更出名一些！！","zh-TW":"🩷 膚質：就算夏天也很乾燥的極乾性類型，不算敏感。有一些細小毛孔，但沒有太多大毛孔。油水平衡不太好，有凹凸不平的困擾\n\n🩷使用期間：26年05月 春天到初夏使用\n\n🩷使用頻率：晚上洗臉一天用一次\n\n🩷香味：好像沒有額外添加香料。接近無香\n\n🩷質地：可能因為平常用卸妝油，比起油類明顯感覺更不油、更柔軟。稍微沾點水就能順暢打圈，也不會太滑膩，這點很喜歡\n\n🩷容器：裝在天藍色塑膠瓶裡，按壓就會出來適量。設計上瓶身好看，這點很喜歡\n\n🩷成分：首先20種有害成分都沒有！挑選化妝品時我很在意成分是否無刺激，這點真的很棒。完全無刺激、很溫和。而且含有幫助保濕的甘油、角鯊烷，還有對皮膚屏障改善有益的泛醇、膽固醇、尿囊素等許多好成分，讓人很信賴\n\n🩷效能&保濕力：是溫和的卸妝乳，當日常用真的很沒有負擔，我的眼妝是另外用眼部卸妝液卸的所以不太清楚眼妝效果，但皮膚部分和油類比較起來，潔淨力並沒有特別弱。而且比起用油類的時候，皮膚凹凸感也減少了，油水平衡好像也調整得更好，這點很喜歡\n\n🩷總評：在做二次清潔之前，光用這款就不會滑膩或油膩，這點很喜歡。感覺是不錯的產品，希望這個品牌能更有名一點!!",ja:"🩷肌タイプ：夏でも乾燥する極度の乾燥肌タイプで、敏感な方ではありません。毛穴は多少ありますが大きい毛穴はそんなに多くありません。水分・油分バランスが良くない方なので凹凸があります\n\n🩷使用期間：26年5月、春〜初夏に使いました \n\n🩷使用間隔：夜の洗顔として1日1回使いました\n\n🩷香り：香料は特に添加されていないようです。無香に近いです \n\n🩷テクスチャー：普段クレンジングオイルを使っているせいか、オイルに比べて確実にオイリー感が少なく柔らかいです。少し水をつけるとローリングもしやすく、あまりぬるつかなくて良いです\n\n🩷容器：水色のプラスチック容器に入っていて、ポンプを押すと適量が出てきます。デザイン的に容器がかわいくて良いです\n\n🩷成分：まず20種類の有害成分がすべて入っていません！コスメを選ぶとき刺激のない成分を注意深くチェックする方ですが、その点が本当に良かったです。刺激が全くなく無難です。それから保湿に役立つグリセリン、スクワラン、肌バリア改善に良いパンテノール、コレステロール、アラントインなどいろいろな良い成分が入っていて信頼できますね\n\n🩷効能&保湿力：マイルドなクレンジングミルクなのでデイリーで使うのに確実に負担がなく、私はアイリムーバーで目元メイクは別に落とすので目元のことはよく分かりませんが、肌の方はオイルと比べて洗浄力が特別弱くはありません。オイルを使っていたときより肌の凹凸も減って水分・油分バランスも整う気がして良いです。 \n\n🩷総評：2回目の洗顔をする前に、これだけでもぬるついたりオイリーになったりしないので気に入っています。良い製品だと思うので、ブランドももっと有名になってほしいです！！",th:"🩷ประเภทผิว: เป็นผิวแห้งมากที่แห้งแม้ในหน้าร้อน ไม่ค่อยแพ้ง่าย มีรูขุมขนอยู่บ้างแต่ไม่กว้างมาก สมดุลน้ำ-มันไม่ค่อยดี เลยมีปัญหาผิวขรุขระ\n\n🩷ระยะเวลาที่ใช้: ใช้ช่วงฤดูใบไม้ผลิ-ต้นฤดูร้อนปี 26 \n\n🩷ความถี่ในการใช้: ใช้วันละ 1 ครั้งตอนล้างหน้าเย็น\n\n🩷กลิ่น: ดูเหมือนจะไม่เติมน้ำหอมเพิ่มเติม แทบไม่มีกลิ่นเลย \n\n🩷เนื้อสัมผัส: ปกติใช้คลีนซิ่งออยล์ เลยรู้สึกว่าตัวนี้มันน้อยกว่าและนุ่มนวลกว่าออยล์ชัดเจน พอเติมน้ำนิดหน่อยแล้วนวดคลึงได้ดี ไม่ค่อยลื่นเหนอะหนะเลยชอบมาก\n\n🩷บรรจุภัณฑ์: เป็นขวดพลาสติกสีฟ้าอ่อน กดปั๊มแล้วออกมาปริมาณพอดี ดีไซน์ขวดสวยชอบมาก\n\n🩷ส่วนผสม: อันดับแรกไม่มีส่วนผสมอันตราย 20 ชนิดเลย! ปกติเช็คส่วนผสมที่ไม่ระคายเคืองอย่างละเอียดตอนเลือกเครื่องสำอาง จุดนี้ชอบมาก ไม่ระคายเคืองเลยใช้ได้สบายใจ แล้วยังมีกลีเซอรีน สควาเลนที่ช่วยให้ความชุ่มชื้น แพนธีนอล คอเลสเตอรอล อัลลันโทอินที่ดีต่อการเสริมเกราะผิว มีส่วนผสมดีๆ เยอะเลยรู้สึกไว้ใจได้\n\n🩷ประสิทธิภาพ&ความชุ่มชื้น: เป็นคลีนซิ่งมิลค์ที่อ่อนโยนเลยใช้เป็นประจำทุกวันได้แบบไม่มีภาระแน่นอน ฉันใช้อายรีมูฟเวอร์แยกล้างเมคอัพตาต่างหาก เลยไม่แน่ใจเรื่องนั้น แต่เทียบกับออยล์แล้วแรงทำความสะอาดที่ผิวไม่ได้อ่อนเป็นพิเศษ ใช้แล้วผิวขรุขระลดลงและสมดุลน้ำ-มันดีขึ้นกว่าตอนใช้ออยล์ ชอบมาก \n\n🩷สรุป: ก่อนล้างหน้าครั้งที่สอง ใช้แค่ตัวนี้อย่างเดียวก็ไม่ลื่นเหนอะหนะหรือมันเยิ้มเลย ชอบมาก เป็นผลิตภัณฑ์ที่ดี อยากให้แบรนด์นี้ดังขึ้นอีกค่ะ!!"},images:[],video:null},
    {id:"J873pBNA",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"건성+기미·잡티·홍조 고민, 오일 사용시 뿌예지던 눈이 밀크는 안 그럼",en:"Dry with melasma, blemishes, redness concerns — eyes don't get blurry like they do with oil","zh-CN":"干皮+色斑·瑕疵·泛红困扰，用油类眼前会模糊而洁面乳不会","zh-TW":"乾性+黑斑‧瑕疵‧泛紅困擾，用油類時眼前模糊，卸妝乳則不會",ja:"乾燥肌+シミ・くすみ・赤み悩み、オイル使用時に視界がかすんだのがミルクでは起きない",th:"ผิวแห้ง+กังวลฝ้า·จุดด่างดำ·ผื่นแดง ตาไม่พร่ามัวเหมือนตอนใช้ออยล์"},date:"2026-06-05",
      quote:{ko:"➖ 피부타입 : 건성\n ➖ 피부고민 : 기미, 잡티, 홍조\n \n\n 💦 세정력\n - 제형이 흐르기보다 꾸덕한 제형이라 피부 깊숙이 찐득하니 붙어 세정되는 느낌이었습니다. 사용법에 적혀있는대로 물 묻지 않은 얼굴에 롤링후 물을 조금 섞어 다시 롤링하고 세안해주면 자연스레 2차 세안이 되는 과정이라 좋았습니다. 평소에 선크림, 쿠션 정도만 하고 색조는 블러셔, 입술만 발라서 진한 화장에 세정력이 어떠한지는 모르겠습니다만 제가 하는 정도의 화장은 말끔히 지워졌습니다!\n \n\n 🙌 수분•촉촉함\n - 건성이라 세정력이 너무 강한 클렌저를 사용하면 세안후 피부가 굉장히 당기거든요. 그런데 이 제품은 전혀. 정말 전혀. 그렇지 않았어요. 솔직히 수분감 있다는 클렌징폼 몇 개 사용해봤는데 클렌징폼에 들어가는 성분때문인지, 극건성때문인지 당기는 느낌은 계속 있었거든요. 그런데 클렌징밀크라 그런지 전혀 당김이 없어서 놀랐어요! 클렌징오일은 사용하다가 뚜껑에 묻어 만질 때마다 미끌거리고 눈앞이 뿌옇게 되는데 클렌징밀크 정말 신세계네요!\n \n\n 💥자극\n - 자극 1도 없습니다. 특히 클렌징 오일을 사용할 때 늘 눈앞이 뿌얘지는데 노마디아 블루 진정 판테놀 1% 클렌징밀크는 전혀 그렇지 않았습니다. 그리고 제품 자체에 판테놀이 함유되어있어 조금 더 신뢰가 가긴 하더라고요.\n \n\n ✔📝 총평\n - 클렌징 밀크는 처음 사용해보는데 클렌징 오일의 단점은 보완하고 클렌징폼의 장점은 갖고 온 정말 좋은 제품이었어요! 클렌징폼을 사용할 때 느껴지는 뻑뻑함은 없고 클렌징 오일을 사용할 때 느껴지는 미끌거림 없이 딱 그 중간입니다. 저도 이 제품으로 클렌징밀크를 입문했는데 클렌징밀크 입문용 제품으로도 딱인 듯싶습니다. 용량도 크고 재사용 의사 100%였습니다.",en:"➖ Skin type: Dry\n➖ Skin concerns: Melasma, blemishes, redness\n\n💦 Cleansing power\n- The texture is thick rather than runny, so it felt like it clung deep into skin as it cleansed. Following the directions — rolling it on dry skin, then adding a bit of water and rolling again, then rinsing — naturally becomes a second-cleanse process, which I liked. I usually only wear sunscreen and cushion, with blush and lip color for the rest, so I don't know how it performs on heavy makeup, but the level of makeup I do came off cleanly!\n\n🙌 Moisture & hydration\n- Since I have dry skin, if a cleanser's cleansing power is too strong, my skin gets really tight after cleansing. But with this product — not at all. Really, not at all. Honestly I've tried a few cleansing foams that claim to be moisturizing, but whether it's because of the ingredients in the foam or my extremely dry skin, the tightness always remained. But being a cleansing milk, there was zero tightness, which surprised me! With cleansing oil, my hands get slippery whenever I touch the cap and my eyes get blurry, but cleansing milk is truly a whole new world!\n\n💥Irritation\n- Zero irritation. Especially with cleansing oil my eyes always get blurry, but NOMADIA's Blue Calming Panthenol 1% Cleansing Milk was never like that at all. And the product itself contains Panthenol, so that gave me a bit more trust too.\n\n✅📝 Overall review\n- This was my first time using cleansing milk, and it was really a great product that made up for the downsides of cleansing oil while keeping the strengths of cleansing foam! There's none of the stiffness you feel with cleansing foam, and none of the slipperiness you feel with cleansing oil — it's right in the middle. This is the product that got me into cleansing milk, and it seems perfect as a starter product for cleansing milk too. The volume is generous, and I'd repurchase 100%.","zh-CN":"➖ 肤质：干性\n ➖ 肤质困扰：色斑、瑕疵、泛红\n \n\n 💦 清洁力\n - 质地不是流动型而是厚实型，感觉能深入皮肤紧密附着地清洁。按照使用方法在干燥的脸上打圈后加点水再打圈冲洗，自然而然就完成了二次清洁的过程，这点很喜欢。我平时只涂防晒、气垫，彩妆也只用腮红和口红，不清楚浓妆的清洁力如何，但我这种程度的妆容能干净卸掉！\n \n\n 🙌 水分•水润感\n - 干皮如果用清洁力太强的洁面产品，洗完脸皮肤会非常紧绷。但这款完全没有，真的完全没有。老实说我用过几款号称保湿的洁面泡沫，可能是里面的成分问题，或者是我极干皮的原因，一直都会有紧绷感。但这款是洁面乳，完全不紧绷，让我很惊讶！用卸妆油的时候瓶盖上沾了油每次碰到都滑腻，眼前还会变模糊，用了洁面乳真是打开了新世界！\n \n\n 💥刺激\n - 完全没有刺激。特别是用卸妆油的时候眼前总是会变模糊，NOMADIA蓝色舒缓泛醇1%洁面乳完全没有这种情况。而且产品本身含有泛醇，让人更加信任。\n \n\n ✔📝 总评\n - 第一次用洁面乳，是补足了卸妆油的缺点、又兼具洁面泡沫优点的真正好产品！没有洁面泡沫那种干涩感，也没有卸妆油那种滑腻感，正好是二者的中间。我也是靠这款入门了洁面乳，作为洁面乳的入门产品也很合适。容量也大，百分百会回购。","zh-TW":"➖ 膚質：乾性\n ➖ 肌膚困擾：黑斑、瑕疵、泛紅\n\n\n 💦 潔淨力\n - 質地不是流動型，而是偏厚實，感覺能深入皮膚黏著清潔。按照使用說明在乾燥的臉上先打圈，再混合一點水繼續打圈後洗臉，自然而然就完成了二次清潔的過程，這點很喜歡。我平常只擦防曬乳、氣墊，彩妝只上腮紅和唇膏，不確定濃妝的潔淨效果如何，但我這種程度的妝容都乾淨卸除了！\n\n\n 🙌 水分‧水潤感\n - 我是乾性肌，用潔淨力太強的卸妝產品洗完臉皮膚會非常緊繃。但這款完全，真的完全不會這樣。老實說我用過幾款標榜水潤的洗面乳，不知道是不是成分關係，還是極乾性的關係，緊繃感一直都在。但可能因為是卸妝乳，完全不緊繃，讓我很驚訝！用卸妝油時蓋子沾到會滑膩，眼前還會模糊一片，卸妝乳真的是新世界！\n\n\n 💥刺激感\n - 完全零刺激。特別是用卸妝油時眼前總是會模糊，但NOMADIA藍色舒緩泛醇1%卸妝乳完全不會這樣。而且產品本身含有泛醇，讓人多一分信賴。\n\n\n ✔📝 總評\n - 第一次用卸妝乳，這款完美補足了卸妝油的缺點，又保留了洗面乳的優點！沒有洗面乳那種乾澀感，也沒有卸妝油那種滑膩感，剛剛好是中間值。我也是靠這款入門卸妝乳，感覺也很適合當入門款。容量也大，回購意願100%。",ja:"➖肌タイプ：乾燥肌\n ➖肌の悩み：シミ、くすみ、赤み\n \n\n 💦洗浄力\n - テクスチャーが流れるというよりとろっとしているので、肌の奥までしっかり密着して洗浄される感じでした。使用法に書かれている通り、水をつけない顔にローリングした後、少し水を混ぜて再びローリングして洗顔すると自然に2回目の洗顔になる過程で良かったです。普段は日焼け止め、クッションファンデ程度で、色物はチークと唇だけなので濃いメイクへの洗浄力はどうか分かりませんが、私がしている程度のメイクはきれいに落ちました！\n \n\n 🙌水分・しっとり感\n - 乾燥肌なので洗浄力が強すぎるクレンザーを使うと洗顔後に肌がすごくつっぱるんです。でもこの製品は全く。本当に全く。そうなりませんでした。正直、水分感があるという洗顔フォームをいくつか使ってみましたが、洗顔フォームに入っている成分のせいか、極度の乾燥肌のせいか、つっぱる感じがずっとありました。でもクレンジングミルクだからか全くつっぱりがなくて驚きました！クレンジングオイルは使っているとキャップについて触るたびにぬるぬるして視界がかすむのですが、クレンジングミルクは本当に別世界ですね！\n \n\n 💥刺激\n - 刺激が1ミリもありません。特にクレンジングオイルを使うときいつも視界がかすむのですが、NOMADIAブルー鎮静パンテノール1%クレンジングミルクは全くそうなりませんでした。そして製品自体にパンテノールが含まれているので、もう少し信頼できる感じもしました。\n \n\n ✔📝総評\n - クレンジングミルクは初めて使いますが、クレンジングオイルの欠点は補いクレンジングフォームの長所は持ってきた本当に良い製品でした！洗顔フォームを使うときに感じるゴワゴワ感はなく、クレンジングオイルを使うときに感じるぬるつきもなく、ちょうどその中間です。私もこの製品でクレンジングミルクデビューしましたが、クレンジングミルク入門用としてもぴったりだと思います。容量も大きく、リピート意思100%でした。",th:"➖ ประเภทผิว : ผิวแห้ง\n ➖ ปัญหาผิว : ฝ้า จุดด่างดำ ผื่นแดง\n \n\n 💦 แรงทำความสะอาด\n - เนื้อสัมผัสค่อนข้างหนึบไม่ไหลย้อย รู้สึกเหมือนซึมเข้าไปทำความสะอาดลึกถึงผิว ตามวิธีใช้ที่ระบุไว้คือนวดคลึงบนหน้าแห้งก่อน แล้วเติมน้ำนวดคลึงอีกครั้งแล้วล้างออก ทำให้เป็นการล้างหน้าครั้งที่สองไปในตัวโดยธรรมชาติ ชอบมาก ปกติแต่งหน้าแค่ครีมกันแดด คุชชั่น กับบลัชออนและลิปเท่านั้น เลยไม่แน่ใจว่าล้างเมคอัพเข้มข้นได้ดีแค่ไหน แต่เมคอัพระดับที่ฉันแต่งล้างออกหมดจดเลย!\n \n\n 🙌 ความชุ่มชื้น\n - เพราะเป็นผิวแห้ง ถ้าใช้คลีนเซอร์ที่แรงทำความสะอาดแรงเกินไปจะตึงมากหลังล้างหน้า แต่ผลิตภัณฑ์นี้ไม่เลย ไม่เลยจริงๆ เคยลองใช้โฟมล้างหน้าที่บอกว่าชุ่มชื้นหลายตัว แต่ไม่แน่ใจว่าเพราะส่วนผสมในโฟมหรือเพราะผิวแห้งมากของตัวเอง ก็ยังรู้สึกตึงอยู่ตลอด แต่พอเป็นคลีนซิ่งมิลค์กลับไม่ตึงเลย แปลกใจมาก! คลีนซิ่งออยล์เวลาใช้มักจะเปื้อนติดฝาขวดจนลื่นทุกครั้งที่จับ แล้วตาก็พร่ามัว แต่คลีนซิ่งมิลค์นี่โลกใหม่จริงๆ!\n \n\n 💥ระคายเคือง\n - ไม่ระคายเคืองเลยแม้แต่น้อย โดยเฉพาะเวลาใช้คลีนซิ่งออยล์ตาจะพร่ามัวตลอด แต่บลูซูทติ้งแพนธีนอล 1% คลีนซิ่งมิลค์ของโนมาเดียไม่เป็นแบบนั้นเลย แล้วตัวผลิตภัณฑ์เองก็มีแพนธีนอลด้วย เลยรู้สึกไว้ใจได้มากขึ้น\n \n\n ✔📝 สรุป\n - เป็นการลองใช้คลีนซิ่งมิลค์ครั้งแรก แต่เป็นผลิตภัณฑ์ที่ดีมากที่แก้จุดด้อยของคลีนซิ่งออยล์และนำข้อดีของโฟมมารวมกัน! ไม่มีความฝืดแบบโฟม ไม่มีความลื่นแบบออยล์ อยู่ตรงกลางพอดีเลย ฉันเองก็เริ่มต้นใช้คลีนซิ่งมิลค์ด้วยตัวนี้ เหมาะมากสำหรับมือใหม่ที่อยากลองคลีนซิ่งมิลค์ ปริมาณก็เยอะ อยากซื้อซ้ำ 100%"},images:[],video:null},
    {id:"A11QjYjA",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"클렌징밀크 첫 사용, 모낭염·트러블 잦은 피부 장벽보호 체감(사진)",en:"First time using cleansing milk, felt barrier protection with folliculitis/frequent breakouts (photo)","zh-CN":"第一次用洁面乳，毛囊炎·痘痘频发的皮肤也感受到屏障保护（附照片）","zh-TW":"第一次使用卸妝乳，容易長毛囊炎/痘痘的肌膚感受到屏障保護（附圖）",ja:"クレンジングミルク初使用、毛嚢炎・トラブルが出やすい肌のバリア保護を実感(写真)",th:"ใช้คลีนซิ่งมิลค์ครั้งแรก รู้สึกได้ถึงการปกป้องเกราะผิวที่เป็นรูขุมขนอักเสบและสิวบ่อย (มีรูป)"},date:"2026-06-05",
      quote:{ko:"처음으로 클렌징밀크 사용해봐요\n 클렌징오일과 밤 사용하면서, 민감성은 클렌징밀크가 좋다고 해서, 바꾸려고 제품 고르던 중 이 제품을 써보았는데 대만족이었어요!!\n \n\n 요약 : 세정력 좋음, 촉촉한 마무리(수부지 추천), 자극없음,사용감 좋음, 장벽보호\n \n\n 1. 세정력 좋음, 촉촉한 마무리로 수부지에게 추천!\n \n\n (프라이머, 선크림+비비, 파우더, 아이라이너, 속눈썹블랙영양제 기준)\n 제가 평소에 하는 화장은 위에 써놓은 정도인데요. 막 워터프루프 제품을 쓰는 건 아니라, 가벼운 메이크업인 것 같아요. \n 2차세안없이 단독사용해도될 것 같은 정도로 말끔하게 세정돼요. 저는 코, 턱 등 피지 분비 많은 부위만 2차 세안해주었어요.\n \n\n 마무리감도 촉촉하게 보들해져서 좋아요! 당김 없음!! 수부지 피부에 추천합니다!\n \n\n \n\n 2. 자극없고, 사용감 좋아요.  \n \n\n 사진 첨부했는데, 미끌거리다가 물기마르면 약간 끈떡해지며 발리는데, 한번 펌핑 양으로 골고루 잘 발리고, 유화도 잘 되어서 진짜 미끌하게 자극없이 세정돼요.\n \n\n \n\n 3. 장벽보호 굿굿!!\n \n\n 잘 붉어지고 모낭염, 트러블도 잘 생기는 피부인데, 이중세안했을때도 붉어짐도 없고 자극없이 민감해지지 않았어요! \n 또 제품 처음받아서 썼을땐, 이마, 턱이 모낭염과 트러블로 난리가 난 상태였는데(턱에 흔적 남은거 보이시죠ㅜㅜ), \n 클렌징밀크쓰면서 피부컨디션도 되게 좋아졌어요! \n 과한 클렌징으로 피부 상할 수 있었는데, 이 클렌징밀크로 장벽보호가 되게 잘 된거 아닐까요?\n \n\n \n\n 너무 만족해서 앞으로도 클렌징밀크 쓸 것 같아요!!",en:"Using cleansing milk for the first time\nWhile using cleansing oil and balm, I heard cleansing milk is better for sensitive skin, so while looking to switch I picked this product to try, and I was very satisfied!!\n\nSummary: Good cleansing power, moist finish (recommend for combination-oily-dehydrated), no irritation, good application feel, barrier protection\n\n1. Good cleansing power, moist finish — recommend for combination (oily-dehydrated)!\n\n(Based on primer, sunscreen+BB cream, powder, eyeliner, lash serum)\nThe makeup I usually wear is what I listed above, and I don't use waterproof products, so it's fairly light makeup.\nIt cleanses cleanly enough that you could probably skip a second cleanse. I only did a second cleanse on my nose, chin, and other areas with more sebum.\n\nThe finish was also moist and smooth, which I liked! No tightness!! I recommend it for combination-oily-dehydrated skin!\n\n\n\n2. No irritation, good application feel.\n\nI attached a photo — it's slippery at first, then gets a bit tacky as it dries while spreading, and one pump's worth spreads evenly, emulsifies well, and cleanses with a truly slippery, irritation-free feel.\n\n\n\n3. Great barrier protection!!\n\nMy skin easily reddens and gets folliculitis and breakouts often, but even after double cleansing there was no redness and no irritation or sensitization!\nAlso when I first got the product and used it, my forehead and chin were in chaos with folliculitis and breakouts (you can see the marks left on my chin ㅜㅜ),\nbut while using the cleansing milk my skin condition got a lot better!\nExcessive cleansing could have damaged my skin, but I think the barrier protection from this cleansing milk really worked well?\n\n\n\nI'm so satisfied that I think I'll keep using cleansing milk from now on!!","zh-CN":"第一次用洁面乳\n 一直用卸妆油和卸妆膏，听说敏感肌适合洁面乳，正在挑选想换的产品时用了这款，非常满意!!\n \n\n 总结：清洁力好、收尾水润（推荐水油皮）、无刺激、使用感好、保护屏障\n \n\n 1. 清洁力好，水润收尾，推荐水油皮使用！\n \n\n （以妆前乳、防晒+BB、散粉、眼线笔、睫毛增长营养液为基准）\n 我平时化的妆大概就是上面这些程度，没有用防水产品，应该算轻妆。\n 不做二次清洁单独使用也能干净卸妆。我只对鼻子、下巴等皮脂分泌多的部位做了二次清洁。\n \n\n 收尾感也水润柔滑，很喜欢！完全不紧绷!!推荐给水油皮！\n \n\n \n\n 2. 无刺激，使用感好。 \n \n\n 附了照片，滑腻感在水分变干后会变得有点粘稠地涂开，一泵的量就能均匀涂满全脸，乳化也很顺畅，真的能滑滑地无刺激清洁。\n \n\n \n\n 3. 屏障保护，好评!!\n \n\n 我皮肤容易泛红，也容易长毛囊炎和痘痘，即使做了双重清洁也没有泛红，没有刺激也没有变敏感！\n 而且刚拿到产品开始用的时候，额头、下巴正因为毛囊炎和痘痘闹得很凶（下巴上的痕迹应该能看到吧呜呜），\n 用了洁面乳之后皮肤状态也变好了很多！\n 过度清洁本来可能会伤害皮肤，是不是这款洁面乳把屏障保护得特别好呢？\n \n\n 太满意了，以后应该会一直用洁面乳！！","zh-TW":"第一次使用卸妝乳\n 一直用卸妝油和卸妝膏，聽說敏感肌適合用卸妝乳，正在挑選要換的產品時試了這款，非常滿意!!\n\n\n 總結：潔淨力好、水潤收尾（推薦外油內乾）、無刺激、使用感好、保護屏障\n\n\n 1. 潔淨力好、水潤收尾，推薦外油內乾使用！\n\n\n （以妝前乳、防曬乳+BB霜、蜜粉、眼線筆、睫毛滋養液為基準）\n 我平常的妝容大概就是上面寫的程度，沒有用防水產品，算是淡妝。\n 乾淨到甚至不用二次清潔也可以，我只有針對鼻子、下巴這種皮脂分泌多的部位做二次清潔。\n\n\n 收尾也水潤柔軟，很喜歡！不緊繃!!推薦外油內乾使用！\n\n\n\n 2. 無刺激、使用感好。\n\n\n 附上照片，一開始滑滑的，等水分乾了之後會變得有點黏稠好推抹，用一次按壓的量就能均勻推開，乳化也很順暢，真的能滑順又無刺激地卸妝乾淨。\n\n\n\n 3. 屏障保護真的很讚!!\n\n\n 我皮膚容易泛紅，也容易長毛囊炎、痘痘，二次清潔之後也完全不泛紅、不刺激、不會變敏感！\n 而且剛拿到產品開始用的時候，額頭、下巴正因為毛囊炎和痘痘鬧得很嚴重（下巴的痕跡看得出來吧ㅜㅜ），\n 用了卸妝乳之後膚況真的變好很多！\n 過度清潔可能會傷害皮膚，是不是這款卸妝乳把屏障保護得很好呢？\n\n\n 真的很滿意，以後應該會繼續用卸妝乳!!",ja:"初めてクレンジングミルクを使ってみます\n クレンジングオイルとバームを使ってきましたが、敏感肌にはクレンジングミルクが良いというので、切り替えようと製品を選んでいたところこの製品を使ってみて大満足でした！！\n \n\n 要約：洗浄力良い、しっとりした仕上がり(インナードライにおすすめ)、刺激なし、使用感良い、バリア保護\n \n\n 1. 洗浄力良い、しっとりした仕上がりでインナードライにおすすめ！\n \n\n (プライマー、日焼け止め+BBクリーム、パウダー、アイライナー、まつ毛美容液基準)\n 私が普段するメイクは上に書いた程度です。特にウォータープルーフ製品を使うわけではないので、軽めのメイクだと思います。 \n 2回目の洗顔なしで単独使用でも良さそうなくらいすっきり洗浄されます。私は鼻、あごなど皮脂分泌が多い部位だけ2回目の洗顔をしました。\n\n 仕上がりもしっとり柔らかくなって良いです！つっぱりなし！！インナードライ肌におすすめします！\n\n\n\n 2. 刺激がなく、使用感が良いです。  \n\n 写真を添付しましたが、ぬるぬるしてから水気が乾くと少しべたっとなじむのですが、1回のポンプの量で均一によくのびて、乳化もうまくいって本当にぬるっと刺激なく洗浄されます。\n\n\n\n 3. バリア保護グッド！！\n\n すぐ赤くなって毛嚢炎やトラブルもできやすい肌ですが、ダブル洗顔をしたときも赤みもなく刺激なく敏感になりませんでした！ \n また製品を初めて受け取って使ったときは、額、あごが毛嚢炎とトラブルで大変な状態でしたが(あごに跡が残っているのが見えますよね、涙)、 \n クレンジングミルクを使いながら肌コンディションもとても良くなりました！ \n 過度なクレンジングで肌が傷むこともあり得たのに、このクレンジングミルクでバリア保護がとてもうまくいったのではないでしょうか？\n\n とても満足なので今後もクレンジングミルクを使い続けると思います！！",th:"ลองใช้คลีนซิ่งมิลค์เป็นครั้งแรกค่ะ\n เคยใช้แต่คลีนซิ่งออยล์กับบาล์ม แต่มีคนบอกว่าผิวแพ้ง่ายเหมาะกับคลีนซิ่งมิลค์มากกว่า เลยกำลังเลือกผลิตภัณฑ์ใหม่อยู่พอดี แล้วมาลองใช้ตัวนี้ พอใจมากๆ เลยค่ะ!!\n \n\n สรุป : แรงทำความสะอาดดี จบด้วยความชุ่มชื้น (แนะนำผิวมันขาดน้ำ) ไม่ระคายเคือง ความรู้สึกเมื่อใช้ดี ปกป้องเกราะผิว\n \n\n 1. แรงทำความสะอาดดี จบด้วยความชุ่มชื้น แนะนำสำหรับผิวมันขาดน้ำ!\n \n\n (ไพรเมอร์ ครีมกันแดด+บีบี แป้ง อายไลเนอร์ มาสคาร่าติดขนตา)\n ปกติฉันแต่งหน้าประมาณที่เขียนไว้ข้างบนนี้ค่ะ ไม่ได้ใช้ผลิตภัณฑ์วอเตอร์พรูฟ เลยน่าจะเป็นเมคอัพเบาๆ \n ล้างออกหมดจดจนใช้เดี่ยวๆ ไม่ต้องล้างซ้ำก็ได้ ฉันล้างซ้ำเฉพาะจุดที่มีไขมันเยอะอย่างจมูกกับคาง\n \n\n จบด้วยความชุ่มชื้นนุ่มนวลดีด้วย! ไม่ตึงเลย!! แนะนำสำหรับผิวมันขาดน้ำค่ะ!\n \n\n \n\n 2. ไม่ระคายเคือง ความรู้สึกเมื่อใช้ดี  \n \n\n แนบรูปไว้ด้วย ตอนแรกลื่นๆ พอน้ำแห้งจะหนึบขึ้นนิดหน่อยตอนลูบไล้ ปั๊มครั้งเดียวก็ทาได้ทั่วหน้า อิมัลชันก็ดี ล้างสะอาดอย่างนุ่มนวลโดยไม่ระคายเคืองเลยจริงๆ\n \n\n \n\n 3. ปกป้องเกราะผิวได้ดีมาก!!\n \n\n เป็นผิวที่แดงง่ายและเป็นรูขุมขนอักเสบ สิวขึ้นบ่อย แต่พอล้างหน้าสองครั้งก็ไม่แดงและไม่ระคายเคืองจนแพ้ง่ายขึ้นเลย! \n แล้วตอนแรกที่ได้ผลิตภัณฑ์มาใช้ หน้าผากกับคางกำลังเป็นรูขุมขนอักเสบและสิวเต็มไปหมด (เห็นรอยที่คางไหมคะ ㅜㅜ) \n พอใช้คลีนซิ่งมิลค์แล้วสภาพผิวดีขึ้นเยอะมาก! \n ปกติการล้างหน้าที่มากเกินไปอาจทำร้ายผิวได้ แต่คลีนซิ่งมิลค์ตัวนี้น่าจะช่วยปกป้องเกราะผิวได้ดีจริงๆ ใช่ไหมคะ?\n \n\n \n\n พอใจมากจนคิดว่าจะใช้คลีนซิ่งมิลค์ต่อไปเรื่อยๆ เลยค่ะ!!"},images:[],video:null},
    {id:"ZOzndwWJ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"지루성피부염 개선 - 코 옆 작은 염증들이 사라짐 (이미지 2장)",en:"Improved seborrheic dermatitis - small inflammations by the nose disappeared (2 photos)","zh-CN":"脂溢性皮炎改善 - 鼻翼旁小炎症消失（附2张图片）","zh-TW":"脂漏性皮膚炎改善 - 鼻翼旁的小發炎消失了（附圖2張）",ja:"脂漏性皮膚炎の改善 - 鼻の横の小さな炎症が消えた(画像2枚)",th:"ผิวหนังอักเสบจากต่อมไขมันดีขึ้น - จุดอักเสบเล็กๆ ข้างจมูกหายไป (มีรูป 2 ภาพ)"},date:"2026-05-31",
      quote:{ko:"평소에는 듀이트리 클렌징밀크를 쓰고 있었어요!\n이번에 판테놀성분이 들었다는 노마디아 제품 당첨되어 써보게 되었습니다.\n♡용량: 듀이트리 200ml와 동일하고 3-4개월 쓰기 적정한 양이었습니다! 지금은 듀이트리 400을 쓰고있어 옆에두었을때 좀 작아보이는데, 400미리가 용기가 너무 큰 느낌이라 200이 딱이라고 봐요.\n♡농도가 듀이트리보다 더 진하고 녹진한 느낌이었어요. 듀이트리는 좀더 물같은 느낌이거든요. 좀더 적은양으로 효과적으로 지울수 있어요.\n♡무향 무자극! 지루성피부염으로 고생하고 있는데 트러블도 없고 테스트기간에 오른쪽 코 옆의 작은 염증들이 사라졌어요. 다른 화장품은 바꾼게 없어서 클렌징밀크 덕분인가 하고 있어요. 좀더 꾸준히 써보고 피부에 잘맞으면 계속 사용해보려고 합니다. 이 부분이 가장 만족스럽습니다.\n♡지성인데 화장이랑 유분으로 인한 각질이 잘 제거됩니다. bb크림이나 닥터지 주황색 썬크림 잘 제거되고, 다음날에 일어나지 않았습니다. 밀크 후 유화하고, 일리윤세안제 제일 순한걸로 써도 충분히 잘 지워져요.\n\n지루성피부염으로 고생하고 있고 피부관리실등에 가면 오일은 쓰지말고 클렌징밀크와 저자극 클렌저 쓰라고 하기 때문에, 딱 맞는 제품인것 같고 받자마자 매일매일썼는데 트러블이 없었고 다른분께도 추천드립니다.^^",en:"I usually use the Dewytree cleansing milk!\nThis time I won a NOMADIA product that contains Panthenol, so I got to try it.\n♡Volume: Same as the Dewytree 200ml, and it was an amount that lasted a good 3-4 months! I'm currently using the Dewytree 400, so it looks a bit small next to it, but the 400ml bottle feels too big honestly, so 200 feels just right.\n♡The texture was thicker and richer than Dewytree's. Dewytree is more watery. You can cleanse effectively with a smaller amount.\n♡Fragrance-free and non-irritating! I've been struggling with seborrheic dermatitis, and I had no breakouts, and during the test period the small inflammations on the right side of my nose next to actually disappeared. I didn't change any other cosmetics, so I think it's thanks to the cleansing milk. I'm going to keep using it a bit more consistently and if it keeps agreeing with my skin I plan to continue. This is the part I'm most satisfied with.\n♡I have oily skin so the buildup from makeup and sebum gets removed well. BB cream and the orange Dr.G sunscreen come off well, and I didn't wake up with them still on the next day. After emulsifying with the milk, I finish with the gentlest Illiyoon cleanser and it's more than enough to wash everything off.\n\nSince I struggle with seborrheic dermatitis and skin clinics tell me not t
