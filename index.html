<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOMADIA — 약국 QR 프로토타입 v2 (밀크 상세)</title>
<style>
  :root{
    --font-sans:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans Thai",-apple-system,BlinkMacSystemFont,sans-serif;
    --ink:#1c1a17; --ink-2:#57534d; --ink-3:#8b867e;
    --paper:#f2efe9; --panel:#ffffff; --line:#1c1c1c; --line-2:#1c1c1c;
    --milk:#dbe6ef; --milk-ink:#3f5468;
    --bubble:#f0e6cf; --bubble-ink:#7a6636;
    --wide:0.08em;
  }
  /* NOTE — 스타일 정리 원칙 (2026-07):
     1) 라운드(border-radius) 전면 제거 — 예외는 .device 하나 뿐(실물 폰 하드웨어 베젤 목업이라 "페이지 디자인"이 아니라서 유지).
     2) 폰트는 전부 Pretendard, weight는 500 이하만 사용(브랜드 가이드 §Weight 운용원칙). 숫자류는 tabular-nums 유지.
     3) 기본 본문 텍스트는 14px 기준 — 브랜드 가이드 자체 체크리스트는 모바일 본문 15px 이상을 권장하니, 엄격 준수가 필요하면 1px만 올리면 됨.
     4) 배경 위계 — 페이지 전체는 연한 미색(--paper), 리뷰·제품카드·통계 등 "카드"만 화이트(--panel)로 띄워 대비.
     5) 아웃라인 — 버튼(gate-pill·lang-btn·acc·modal button)과 뱃지(trust·chip·step 번호·soc)에만 유지. 카드·디바이더 등 나머지는 배경 대비/여백만으로 구분.
  */
  *{box-sizing:border-box;border-radius:0;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--font-sans);background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;font-weight:400;font-size:14px;
    display:flex;min-height:100%;justify-content:center;align-items:flex-start;padding:0;}
  .stage{display:flex;width:100%;justify-content:center;}

  .device-col{display:flex;flex-direction:column;align-items:center;width:100%;}
  .device{width:100%;max-width:480px;height:100vh;height:100dvh;background:var(--paper);
    border:none;position:relative;overflow:hidden;display:flex;flex-direction:column;}
  .statusbar{display:none;}

  .gnb{height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;background:transparent;position:absolute;top:24px;left:0;right:0;z-index:15;
    transition:background .15s;}
  .gnb.solid{background:var(--panel);border-bottom:1px solid var(--line);}
  .gnb-side{display:flex;align-items:center;gap:2px;min-width:70px;}
  .gnb-side.right{justify-content:flex-end;}
  .gnb-btn{width:36px;height:36px;border:none;background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink);}
  .gnb-btn:hover{background:var(--paper);}
  .gnb-btn[disabled]{color:#d5cfc4;cursor:default;}
  .gnb-btn[disabled]:hover{background:none;}
  .wordmark{font-size:14px;font-weight:500;letter-spacing:0.14em;cursor:pointer;}
  .gnb-logo{height:19.5px;width:auto;display:block;}
  .lang-btn{border:1px solid var(--line-2);height:30px;padding:0 9px;background:none;
    font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:3px;}

  .viewport{flex:1;overflow-y:auto;position:relative;}
  .view{display:none;}
  .view.active{display:block;}
  .pad{padding:66px 16px 30px;}

  .label{font-size:12px;font-weight:500;letter-spacing:var(--wide);text-transform:uppercase;color:var(--ink-3);}
  .ph{background:repeating-linear-gradient(-45deg,#efece6,#efece6 6px,#e7e3db 6px,#e7e3db 12px);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-3);font-size:12px;text-align:center;}
  .bar{height:9px;background:#e7e3db;margin:7px 0;}
  .bar.w90{width:90%;}.bar.w70{width:70%;}

  /* gate */
  #gate{background:#646464;min-height:100%;}
  .gate-inner{height:100%;display:flex;flex-direction:column;justify-content:center;padding:34px 26px;}
  .gate-mark{text-align:center;margin-bottom:40px;}
  .gate-logo-full{width:180px;max-width:70%;height:auto;}
  .gate-q{text-align:center;font-size:18px;font-weight:500;margin-bottom:4px;color:#fff;}
  .gate-q-en{text-align:center;font-size:14px;color:#fff;margin-bottom:26px;}
  .gate-pill{width:100%;border:1px solid #fff;padding:15px;margin-bottom:9px;position:relative;
    background:#fff;font-family:inherit;font-size:15.5px;font-weight:500;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;text-align:center;}
  .gate-pill:hover{border-color:#fff;background:#ededed;}
  .gate-pill .rec-icon{position:absolute;right:15px;top:50%;transform:translateY(-50%);}

  /* list */
  #list{background:var(--panel);}
  .brandline{margin-bottom:20px;text-align:center;}
  .brandline .ko{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:5px;letter-spacing:0.03em;}
  .brandline .en{font-family:"EB Garamond",var(--font-sans);font-size:14.5px;font-style:italic;color:var(--ink-2);}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 12px;}
  .prod-list{display:flex;flex-direction:column;margin:0 -16px;}
  .prod-list .prod-card{background:none;padding:14px 16px;border-top:1px solid #e2ddd0;}
  .prod-list .prod-card:first-child{border-top-color:transparent;}
  .prod-card{border:1px solid transparent;cursor:pointer;display:flex;gap:12px;align-items:stretch;background:var(--panel);}
  .prod-card:hover{border-color:var(--ink);}
  .prod-list .prod-card:first-child:hover{border-top-color:var(--ink);}
  .prod-thumb{width:104px;aspect-ratio:4/5;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;text-align:center;line-height:1.3;}
  .prod-thumb-img{width:104px;aspect-ratio:4/5;flex-shrink:0;object-fit:cover;}
  .prod-thumb.milk{background:var(--milk);color:var(--milk-ink);}
  .prod-thumb.bubble{background:var(--bubble);color:var(--bubble-ink);}
  .prod-meta{flex:1;min-width:0;padding:14px 4px 14px 0;display:flex;flex-direction:column;justify-content:center;}
  .prod-name{font-size:15px;font-weight:500;line-height:1.35;margin-bottom:3px;}
  .prod-name-en{font-size:12.5px;color:var(--ink-3);line-height:1.35;}
  .prod-go{font-size:14px;color:var(--ink-3);flex-shrink:0;width:20px;display:flex;align-items:center;justify-content:center;}

  /* mentions (shared) */
  .mentions{padding:0 16px;margin:0 -16px;}
  .review-list{margin-top:10px;}
  .review-item{padding:14px 0;border-top:1px solid #e2ddd0;}
  .review-item:first-child{border-top:none;}
  .load-more{display:block;width:100%;margin-top:6px;padding:10px 0;background:none;border:none;
    font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:center;}

  .footer{margin-top:28px;text-align:center;}
  .copyr{font-size:11px;letter-spacing:0.1em;color:var(--ink-3);}

  /* brand intro (list page) */
  .brand-intro{margin:0 -16px;border-top:1px solid #e2ddd0;}
  .brand-intro-label{padding:18px 16px 12px;text-align:center;}
  .brand-intro-img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;}
  .brand-intro-body{padding:14px 16px 4px;}
  .brand-intro-text{font-size:14px;line-height:1.7;color:var(--ink-2);margin:0 0 16px;}
  .brand-intro-text:last-of-type{margin-bottom:0;}
  .brand-emblem-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;margin:24px 0;}
  .brand-emblem-img{width:176px;height:176px;display:block;margin-bottom:14px;}
  .brand-emblem-divider{width:28px;height:1px;background:#c9c3b8;margin:10px 0;}
  .brand-emblem-tagline{font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3);line-height:1.7;}
  .brand-intro-disclosure{font-size:12.5px;color:var(--ink-3);text-align:center;line-height:1.6;}

  /* ===== DETAIL (milk) ===== */
  #detail{background:var(--panel);}
  .l10n-note{background:var(--bubble);color:var(--bubble-ink);font-size:12px;text-align:center;padding:7px;}
  .hero-wrap{position:relative;}
  .hero-gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
  .hero-gallery::-webkit-scrollbar{display:none;}
  .hero-slide{width:100%;flex-shrink:0;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:start;background:var(--milk);}
  .hero-dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:7px;}
  .hero-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);border:none;padding:0;cursor:pointer;}
  .hero-dot.active{background:#fff;}
  .d-head{padding:16px 16px 4px;}
  .d-name{font-size:22px;font-weight:500;line-height:1.28;letter-spacing:-0.01em;margin-bottom:4px;}
  .d-name-en{font-size:13px;color:var(--ink-3);margin-bottom:8px;}
  .d-tagline{font-size:14.5px;color:var(--ink-2);line-height:1.6;margin-bottom:9px;}
  .d-vol{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;}

  .tagrow{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;padding:14px 16px 4px;}
  .trust{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);}
  .trust .ck{color:#3f7a52;font-size:13px;flex-shrink:0;font-weight:500;}

  .sec{padding:24px 16px;}
  .sec-acc{border-top:1px solid #e2ddd0;}
  .sec-acc-close{border-top:1px solid #e2ddd0;}
  .sec-head-row{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .sec-title{font-size:16px;font-weight:700;margin:0;letter-spacing:0.03em;text-transform:uppercase;}
  .sec-plus{font-size:16px;font-weight:400;color:var(--ink-3);flex-shrink:0;}
  .sec-body{margin-top:15px;}
  .sec-banner{width:100%;aspect-ratio:1/1;object-fit:cover;margin-bottom:16px;}

  .benefit{display:flex;gap:12px;margin-bottom:18px;}
  .benefit:last-child{margin-bottom:0;}
  .b-ico{width:36px;height:36px;background:var(--milk);color:var(--milk-ink);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:17px;}
  .b-t{font-size:15.5px;font-weight:500;margin-bottom:4px;line-height:1.35;}
  .b-d{font-size:14px;color:var(--ink-2);line-height:1.6;}

  .note{font-size:11.5px;color:var(--ink-3);line-height:1.55;margin-top:9px;}

  .label.sub-label{display:block;margin-bottom:10px;}
  .ba-row{display:flex;gap:8px;margin-bottom:8px;}
  .ba-card{flex:1;aspect-ratio:4/5;font-size:11px;}
  .ba-fig{flex:1;margin:0;}
  .ba-img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;}
  .ba-cap{font-size:11px;color:var(--ink-3);text-align:center;margin-top:6px;letter-spacing:0.04em;text-transform:uppercase;}
  .stats{display:flex;gap:8px;}
  .stat{flex:1;background:var(--panel);padding:14px 8px;text-align:center;}
  .stat .v{font-size:27px;font-weight:500;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1;}
  .stat .l{font-size:12px;color:var(--ink-2);line-height:1.45;margin-top:8px;}

  .survey-box{background:none;padding:0;}
  .survey-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;}
  .survey-row .v{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;flex-shrink:0;}
  .survey-row .l{font-size:13.5px;color:var(--ink-2);text-align:right;line-height:1.4;}

  .video-embed{margin-bottom:18px;}

  .step{display:flex;gap:10px;align-items:baseline;margin-bottom:16px;}
  .step:last-child{margin-bottom:0;}
  .step .n{width:16px;flex-shrink:0;font-size:14px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;}
  .step .s{font-size:14px;color:var(--ink-2);line-height:1.55;}

  .ingr{display:flex;gap:11px;padding:15px 0;}
  .ingr .dot{width:7px;height:7px;background:var(--milk-ink);margin-top:6px;flex-shrink:0;}
  .ingr .n{font-size:14.5px;font-weight:500;margin-bottom:3px;}
  .ingr .d{font-size:13.5px;color:var(--ink-2);line-height:1.55;}
  .acc{margin-top:13px;padding:6px 0;font-size:14px;
    font-weight:500;display:flex;justify-content:center;align-items:center;gap:3px;cursor:pointer;color:var(--ink);}
  .acc .label-txt{text-decoration:underline;text-underline-offset:3px;}
  .acc .plus{color:var(--ink-3);font-weight:400;text-decoration:none;}
  .full-inci{display:none;padding:14px 2px 2px;font-size:12.5px;color:var(--ink-2);line-height:1.75;}
  .full-inci.show{display:block;}


  .buy{margin-top:6px;background:var(--panel);
    padding:15px;text-align:center;font-size:14.5px;font-weight:500;color:var(--ink);}
  .buy .sub{font-size:12px;color:var(--ink-3);font-weight:400;margin-top:4px;}

  /* social proof (early) — 프루프는 화이트 카드 배경 + 라벨·크기로만 부각, 아웃라인 없음 */
  .proof{margin:16px;padding:16px;background:var(--panel);border:1px solid #e2ddd0;}
  .proof .label{margin-bottom:10px;display:block;}
  .rating{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap;}
  .stars{color:#ffc800;font-size:20px;letter-spacing:2px;}
  .rating .score{font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;}
  .quote{font-size:14px;font-weight:500;color:var(--ink);line-height:1.55;white-space:pre-line;}
  .quote .who{display:block;color:var(--ink-3);font-size:12.5px;font-weight:400;margin-top:5px;}
  .review-top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .review-stars{color:#ffc800;font-size:13px;letter-spacing:1px;flex-shrink:0;}
  .review-meta{font-size:11.5px;color:var(--ink-3);text-align:right;}
  .review-highlight{font-size:13px;font-weight:500;color:var(--milk-ink);background:var(--milk);padding:6px 10px;margin-bottom:8px;}
  .review-media{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .review-mt-note{font-size:11px;color:var(--ink-3);font-style:italic;margin-top:6px;}
  .review-img{width:88px;height:88px;object-fit:cover;flex-shrink:0;}
  .review-video{width:100%;max-width:220px;display:block;}
  .review-slide .review-item{border-top:none;padding:0;max-height:264px;overflow-y:auto;position:relative;}
  .review-slide .review-item.has-more::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;
    background:linear-gradient(to bottom, rgba(255,255,255,0), var(--panel));pointer-events:none;}
  .review-slide .review-item.has-more::before{content:"more ⌄";position:absolute;left:0;right:0;bottom:2px;
    text-align:center;font-size:10.5px;letter-spacing:0.05em;color:var(--ink-3);pointer-events:none;}
  .review-slide .quote{font-size:14px;line-height:1.5;}
  .review-slide .review-top-row{margin-bottom:4px;}
  .review-slide .review-highlight{font-size:11.5px;padding:4px 8px;margin-bottom:5px;}
  .more-slide{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:120px;gap:10px;text-align:center;cursor:pointer;}
  .more-slide .more-label{font-size:14px;font-weight:500;color:var(--ink);}
  .more-slide .more-arrow{font-size:20px;color:var(--ink-3);}
  .review-gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
  .review-gallery::-webkit-scrollbar{display:none;}
  .review-slide{width:100%;flex-shrink:0;scroll-snap-align:start;}
  .review-dots{display:flex;justify-content:center;gap:6px;margin-top:12px;}
  .review-dot{width:6px;height:6px;border-radius:50%;background:var(--line-2);opacity:.3;border:none;padding:0;cursor:pointer;}
  .review-dot.active{opacity:1;}

  /* overlays */
  .sheet-bg{position:absolute;inset:0;background:rgba(28,26,23,.4);display:none;align-items:flex-end;z-index:20;}
  .sheet-bg.show{display:flex;}
  .sheet{background:var(--panel);width:100%;padding:18px 18px 24px;}
  .sheet h4{margin:0 0 14px;font-size:14.5px;font-weight:500;}
  .note-bg{position:absolute;inset:0;background:rgba(28,26,23,.45);display:none;align-items:center;justify-content:center;z-index:25;padding:24px;}
  .note-bg.show{display:flex;}
  .modal{background:var(--panel);padding:22px 20px;text-align:center;max-width:250px;}
  .modal .label{display:block;margin-bottom:10px;}
  .modal p{font-size:14px;line-height:1.6;margin:0 0 16px;color:var(--ink-2);}
  .modal button{font-family:inherit;border:1px solid var(--line-2);background:none;padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);}

</style>
</head>
<body>
<div class="stage">
  <div class="device-col">
    <div class="device">
      <div class="statusbar"><span class="dot"></span></div>
      <div class="gnb" id="gnb" style="display:none;">
        <div class="gnb-side"><button class="gnb-btn" id="btnBack" title="뒤로가기">←</button></div>
        <div class="wordmark" id="btnHome" title="홈(링크트리)"><img class="gnb-logo" src="thumbnail/nomadia_textlogo_black.webp" alt="NOMADIA"></div>
        <div class="gnb-side right">
          <button class="lang-btn" id="btnLang">🌐 <span id="langLabel">KR</span></button>
        </div>
      </div>
      <div class="viewport">
        <section class="view" id="gate"></section>
        <section class="view" id="list"></section>
        <section class="view" id="detail"></section>
      </div>
      <div class="sheet-bg" id="langSheet"><div class="sheet"><h4>언어 선택 · Language</h4><div id="sheetList"></div></div></div>
      <div class="note-bg" id="homeNote"><div class="modal">
        <span class="label">Home → Linktree</span>
        <p>홈 버튼은 <b>외부 링크트리</b>로 이동합니다.<br>(별도 제작 · 여기에 연결)</p>
        <button onclick="closeNote()">닫기</button>
      </div></div>
    </div>
  </div>
</div>

<script>
const LANGS=[
  {code:"ko",label:"KR",native:"한국어",loc:true},
  {code:"en",label:"EN",native:"English",loc:true},
  {code:"zh-CN",label:"简中",native:"简体中文",loc:true},
  {code:"zh-TW",label:"繁中",native:"繁體中文",loc:true},
  {code:"ja",label:"日",native:"日本語",loc:true},
  {code:"th",label:"TH",native:"ภาษาไทย",loc:true},
];
const UI_I18N={
  "Load more":{"zh-CN":"查看更多","zh-TW":"查看更多",ja:"もっと見る",th:"ดูเพิ่มเติม"},
  "Reviews":{"zh-CN":"评价","zh-TW":"評價",ja:"レビュー",th:"รีวิว"},
  "BENEFITS":{"zh-CN":"功效","zh-TW":"功效",ja:"効能",th:"ประสิทธิภาพ"},
  "Clinical Study Results":{"zh-CN":"临床结果","zh-TW":"臨床結果",ja:"臨床試験結果",th:"ผลการทดสอบทางคลินิก"},
  "Before":{"zh-CN":"使用前","zh-TW":"使用前",ja:"使用前",th:"ก่อนใช้"},
  "After":{"zh-CN":"使用后","zh-TW":"使用後",ja:"使用後",th:"หลังใช้"},
  "Clinical Study":{"zh-CN":"临床试验数据","zh-TW":"臨床試驗數據",ja:"臨床試験データ",th:"ข้อมูลผลการทดสอบทางคลินิก"},

  "Auto-translated - original nuances may be lost.":{"zh-CN":"内容为自动翻译——语气可能与原文有所不同。","zh-TW":"內容為自動翻譯——語氣可能與原文有所不同。",ja:"自動翻訳です — ニュアンスが原文と異なる場合があります。",th:"แปลโดยอัตโนมัติ — อาจมีความแตกต่างของน้ำเสียงจากต้นฉบับ"},
  "\"Why does finding skincare that truly helps sensitive skin still feel like a gamble?\" NOMADIA started in 2025 in Seoul with this question. Our founders have lived experiences with sensitive skin – including rosacea and seborrheic dermatitis – and started the brand after discovering that no brand had been scientifically validated using the most reactive skin as its baseline.":{
    "zh-CN":"“为什么明明标榜‘适合敏感肌’，用了之后却还是刺激，或者根本没有改善？”NOMADIA于2025年在首尔诞生。创始人们本身就是长期经历酒糟鼻、脂溢性皮炎的敏感肌肤当事人，正是这段亲身经历让他们发现，市面上并不存在一个以最敏感的肌肤为基准、经过科学验证的品牌，于是决定亲自创立。",
    "zh-TW":"「為什麼明明標榜『適合敏感肌』，用了之後卻還是刺激，或根本沒有改善？」NOMADIA於2025年在首爾誕生。創辦人本身就是長期經歷酒糟性皮膚炎、脂漏性皮膚炎的敏感肌膚當事人，正是這段親身經歷讓他們發現，市面上並不存在一個以最敏感肌膚為基準、經過科學驗證的品牌，於是決定親自創立。",
    ja:"「なぜ敏感肌向けと謳っているのに、実際に使うと刺激を感じたり、肌が良くならないのだろう？」NOMADIAは2025年、ソウルで誕生しました。創業者自身が酒さ・脂漏性皮膚炎を抱えて生きてきた敏感肌当事者としての経験をもとに、最も敏感な肌を基準に科学的に検証されたブランドが存在しないことに気づき、始まりました。",
    th:"\"ทำไมผลิตภัณฑ์ที่บอกว่าเหมาะกับผิวแพ้ง่าย พอใช้จริงกลับยังระคายเคืองหรือไม่ทำให้ผิวดีขึ้นเลย?\" NOMADIA ถือกำเนิดขึ้นที่กรุงโซลในปี 2025 จากประสบการณ์ตรงของผู้ก่อตั้งที่ใช้ชีวิตกับผิวแพ้ง่าย โรคโรซาเชีย และโรคผิวหนังอักเสบจากต่อมไขมัน พวกเขาค้นพบว่าไม่มีแบรนด์ใดที่ผ่านการพิสูจน์ทางวิทยาศาสตร์โดยใช้ผิวที่บอบบางที่สุดเป็นมาตรฐานอ้างอิงอย่างแท้จริง จึงตัดสินใจสร้างแบรนด์นี้ขึ้นมาเอง"
  },
  "NOMADIA focuses on building products rooted in evidence, not hype — to become the guiding reference for people with sensitive skin, where clear answers are still hard to find.":{
    "zh-CN":"比起追逐新成分，NOMADIA更专注于打造最谨慎验证过的答案——我们将在敏感肌护肤这个尚无标准答案的领域，成为真正的标准品牌。",
    "zh-TW":"比起追逐新成分，NOMADIA更專注於打造最謹慎驗證過的答案——我們將在敏感肌保養這個尚無標準答案的領域，成為真正的標準品牌。",
    ja:"NOMADIAは、新しい成分を追い求めるのではなく、最も慎重に検証された答えをつくることに集中しています——敏感肌のためのスキンケアという、まだ正解のない領域で基準となるブランドになります。",
    th:"NOMADIA มุ่งเน้นการสร้างคำตอบที่ผ่านการพิสูจน์อย่างรอบคอบที่สุด มากกว่าการไล่ตามส่วนผสมใหม่ๆ — และเราจะเป็นแบรนด์ที่เป็นมาตรฐานในวงการดูแลผิวสำหรับผิวแพ้ง่าย ซึ่งเป็นพื้นที่ที่ยังไม่มีคำตอบตายตัว"
  },
  "The safety and efficacy of every NOMADIA product are verified exclusively on a LAST-certified sensitive-skin panel.":{
    "zh-CN":"NOMADIA所有产品的安全性与功效，均仅通过LAST认证的敏感肌肤人群小组进行验证，而非普通肌肤。",
    "zh-TW":"NOMADIA所有產品的安全性與功效，皆僅透過LAST認證的敏感肌膚族群小組進行驗證，而非一般肌膚。",
    ja:"NOMADIAのすべての製品の安全性と効能は、一般的な肌ではなく、LAST認証済みの敏感肌パネルのみを対象に検証しています。",
    th:"ความปลอดภัยและประสิทธิภาพของผลิตภัณฑ์ NOMADIA ทุกชิ้น ได้รับการตรวจสอบเฉพาะกับกลุ่มทดสอบผิวแพ้ง่ายที่ผ่านการรับรอง LAST เท่านั้น ไม่ใช่ผิวทั่วไป"
  },
  "NOMADIA began in the uncharted territory of skincare for sensitive skin. Rather than chasing new ingredients, we focus on making the most carefully validated answer — starting with the sensitive-skin community, refining it with science, and confirming it on sensitive skin again.":{
    "zh-CN":"NOMADIA从敏感性皮肤护理这个尚无标准答案的领域出发。比起追逐新成分，我们更专注于打造最谨慎验证过的答案——从敏感肌肤社群的声音出发，以科学打磨，再回到敏感肌肤身上确认。",
    "zh-TW":"NOMADIA從敏感性肌膚保養這個尚無標準答案的領域出發。比起追逐新成分，我們更專注於打造最謹慎驗證過的答案——從敏感肌膚社群的聲音出發，以科學打磨，再回到敏感肌膚身上確認。",
    ja:"NOMADIAは、敏感肌のためのスキンケアという、まだ正解のない領域から始まりました。新しい成分を追い求めるのではなく、最も慎重に検証された答えをつくることに集中しています——敏感肌コミュニティの声から出発し、科学で磨き上げ、再び敏感肌で確認する。",
    th:"NOMADIA เริ่มต้นจากพื้นที่ที่ยังไม่มีคำตอบตายตัวอย่างการดูแลผิวแพ้ง่าย แทนที่จะไล่ตามส่วนผสมใหม่ๆ เรามุ่งเน้นสร้างคำตอบที่ผ่านการพิสูจน์อย่างรอบคอบที่สุด — เริ่มจากเสียงของชุมชนผิวแพ้ง่าย ขัดเกลาด้วยวิทยาศาสตร์ แล้วนำกลับมายืนยันกับผิวแพ้ง่ายอีกครั้ง"
  },
};

function secondaryName(n){return state.lang==="en"?n.ko:n.en;}
function maskName(name){
  if(!name) return "";
  const chars=[...name];
  const n=chars.length;
  if(n<=2) return chars[0]+"*".repeat(n-1||1);
  const visible=Math.ceil(n*0.5);
  return chars.slice(0,visible).join("")+"*".repeat(n-visible);
}

    {id:"Z3mzgW2A",rating:4,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지 복합성+주사피부염·아토피·접촉성피부염·화농성여드름 - 세안만으로 트러블 악화 없음",en:"Combination (oily-dehydrated) + rosacea, atopic dermatitis, contact dermatitis, cystic acne - no worsening of breakouts from cleansing alone","zh-CN":"水油皮混合肌+玫瑰痤疮·特应性皮炎·接触性皮炎·脓包型痘痘 - 仅靠洁面也不会加重痘痘","zh-TW":"外油內乾混合肌+酒糟性皮膚炎‧異位性皮膚炎‧接觸性皮膚炎‧化膿性痘痘 - 只是洗臉也沒有讓狀況惡化",ja:"インナードライ混合肌+酒さ様皮膚炎・アトピー・接触性皮膚炎・化膿性ニキビ - 洗顔だけでトラブル悪化なし",th:"ผิวมันขาดน้ำผสม + โรซาเชีย·ผื่นภูมิแพ้ผิวหนัง·ผิวอักเสบจากการสัมผัส·สิวอักเสบเป็นหนอง - ล้างหน้าอย่างเดียวไม่ทำให้ปัญหาผิวแย่ลง"},date:"2026-06-15",
      quote:{ko:"🧸피부타입\n: 수부지에 엄청난 예민하고 수시로 뒤집어지는 피부. 어릴 때부터 아토피가 있었는데 지금은 좋아졌지만 환절기, 계절 바끨 때마다 다시 얼굴, 몸전체에 올라옴. 조금만 건조하고 유수분 밸런스 깨진다 싶으면 버즘피고(건선) 접촉성피부염, 알러지 난리남. 설상가상으로 주사피부염 진단받음. 나이들면서 모공 넓어지고 이마와 볼 좁쌀여드름 있음\n\n✔️결론\n: 얼굴은 수부지 복합성 좁쌀나는 예민 주사피부! 바디는 극건성 아토피, 알러지 자주 올라오는 피부!\n \n🤍정착템\n: 아이소이 응급스팟, 아이소이 아크니닥터 스킨(주시피부염 사용X), 닥터지 레드블레미쉬 수분크림(10통 넘음...),메이크프렘 안심모이스처12 크림, 제로이드 MD로션•크림(모든 피부 강추), 에스트라 아토베리어크림, 에스트라 아토베리어 로션, 메디힐 티트리팩, 린제이 티트리 모델링팩, 브링그린 알로에젤, 랑벨 egf 앰플, 더마토리 수분앰플, 타마누오일(랑벨, 닥터올가 번갈아 씀)\n\n\n사용기간\n: 약 10일\n\n텍스쳐/발림성\n: 전형적인 클렌징 밀크 부드럽게 롤링됨\n\n용기/가격\n: 조그만한 펌핑용기! 여행 때 가지고 다녀도 좋을 사이즈\n\n트러블 외 기타\n: 이미 화농성 여드름이 몇개 올라온 상태에서 사용했는데 더 트러블이 심해지지 않았어요. 클렌징폼만 사용해도 따가웠는데 제품 사용 시 따가움이나 불편감은 없어서 좋았어요. 판테놀있어서 보습감 있으면서 촉촉하게 세정되는 것 같아요",en:"🧸Skin type\n: Combination (oily-dehydrated) that's super sensitive and flips out constantly. I've had atopic dermatitis since I was little — it's better now, but it comes back on my face and whole body every time the seasons change. The second things get a little dry or my oil-water balance is off, I get patches of eczema (psoriasis-like), contact dermatitis, allergies — total chaos. On top of that I got diagnosed with rosacea. As I've gotten older my pores have widened and I get tiny bumps on my forehead and cheeks.\n\n✔️Bottom line\n: My face is combination, sensitive, bumpy, rosacea-prone! My body is extremely dry, atopic, and prone to allergic flare-ups!\n \n🤍My go-tos\n: Isoi emergency spot, Isoi Acne Doctor Skin (not used on rosacea areas), Dr.G Red Blemish moisture cream (gone through over 10 tubs...), Make P:rem Safe Me Relief Moisture 12 cream, Zeroid MD lotion/cream (highly recommend for all skin types), AESTURA Atobarrier cream, AESTURA Atobarrier lotion, Mediheal tea tree pack, Lindsay tea tree modeling pack, Bring Green aloe gel, Rangbel EGF ampoule, Dermatory moisture ampoule, tamanu oil (alternating between Rangbel and Dr. Olga)\n\n\nDuration of use\n: About 10 days\n\nTexture/spreadability\n: Rolls on smoothly, a typical cleansing milk feel\n\nContainer/price\n: Small pump bottle! A great size to bring while traveling too\n\nOther than breakouts\n: I was already dealing with a few cystic pimples when I started using this, and they didn't get any worse. Even cleansing foam alone used to sting, but there was no stinging or discomfort with this product at all — I loved that. With panthenol in it, it seems to cleanse while keeping the skin moisturized and hydrated.","zh-CN":"🧸皮肤类型\n：水油皮，非常敏感、动不动就爆发的皮肤。从小就有特应性皮炎，现在好些了，但每逢换季、季节交替的时候又会在脸上、全身冒出来。只要稍微一干燥、水油平衡被打破，就会长癣（银屑病）、接触性皮炎、过敏大爆发。雪上加霜的是还被确诊了玫瑰痤疮。随着年龄增长毛孔变粗，额头和脸颊长闭口粉刺。\n\n✔️结论\n：脸部是水油混合、长闭口的敏感玫瑰痤疮肌！身体是极干性特应性皮炎、经常过敏的皮肤！\n \n🤍长期回购好物\n：isoi急救点涂、isoi痘痘医生爽肤水（玫瑰痤疮不能用）、Dr.G红色暗疮舒缓保湿霜（用了10多罐……）、Make P:rem安心保湿12号面霜、Xeroid MD乳液·面霜（所有肤质都强推）、Aestura安敏因面霜、Aestura安敏因乳液、美迪惠尔茶树面膜、Lindsay茶树塑颜面膜、Bring Green芦荟啫喱、狼贝EGF安瓶、Dermatory保湿安瓶、大风子油（狼贝、Dr.Orga交替使用）\n\n\n使用时长\n：约10天\n\n质地/延展性\n：典型的洁面乳质地，能顺滑打圈按摩\n\n包装/价格\n：小巧的按压瓶！旅行携带也很合适的尺寸\n\n痘痘之外的其他体验\n：使用时脸上已经长了几颗脓包型痘痘，用了之后并没有变得更严重。平时光用洁面泡沫都会刺痛，但用这款产品时没有刺痛或不适感，这点很好。含有泛醇，感觉洗完既保湿又清爽","zh-TW":"🧸膚質\n：外油內乾，非常容易敏感、動不動就爆發的皮膚。從小就有異位性皮膚炎，雖然現在好轉了，但每次換季、季節交替時又會在臉上、全身冒出來。只要稍微乾燥、油水平衡一亂，就會長癬（乾癬）、接觸性皮膚炎、過敏大爆發。雪上加霜的是還被診斷出酒糟性皮膚炎。隨著年紀增長毛孔變大，額頭和臉頰也有粉刺。\n\n✔️結論\n：臉是外油內乾混合性、長粉刺的敏感酒糟肌！身體是極乾性異位性皮膚炎、常常過敏的膚質！\n\n🤍定番愛用品\n：isoi急救痘痘筆、isoi Acne Doctor化妝水（酒糟性皮膚炎不使用）、Dr.G紅色舒緩水凝霜（用超過10罐...）、Make P:rem安心保濕12面霜、Zeroid MD乳液‧面霜（所有膚質都大推）、Aestura APB乾癬修護霜、Aestura APB修護乳液、Mediheal茶樹面膜、Lindsay茶樹造模面膜、Bring Green蘆薈凝膠、Langbel EGF安瓶、Dermatory保濕安瓶、大風子油（Langbel、Dr.Orga交替使用）\n\n\n使用期間\n：約10天\n\n質地/延展性\n：典型的卸妝乳，滾動推勻很柔順\n\n容器/價格\n：小小的按壓瓶！很適合旅行時帶著走的尺寸\n\n除了痘痘之外的其他心得\n：使用的時候臉上已經冒了幾顆化膿性痘痘，但沒有讓狀況變得更嚴重。連只用洗面乳都會刺痛，但用這款產品時完全沒有刺痛或不適感，這點很喜歡。含有泛醇，洗完感覺保濕又清爽",ja:"🧸肌タイプ\n：インナードライ肌でとても敏感、しょっちゅう荒れる肌。子供の頃からアトピーがあって今は良くなったけど、季節の変わり目には顔や体全体にまた出てきます。少しでも乾燥したり水分・油分バランスが崩れると乾癬、接触性皮膚炎、アレルギーが大暴れ。おまけに酒さ性皮膚炎と診断されました。年齢を重ねて毛穴が広がり、額と頬に小さいニキビがあります\n\n✔️結論\n：顔はインナードライ混合肌で細かいニキビができる敏感な酒さ肌！体は極度の乾燥肌でアトピー、アレルギーがよく出る肌！\n \n🤍定番アイテム\n：アイソイ アクネスポット、アイソイ アクネドクタースキン(酒さには使用不可)、Dr.G レッドブレミッシュモイスチャークリーム(10本以上リピート…)、メイクプレム アンシンモイスチャー12クリーム、ゼロイドMDローション・クリーム(全肌タイプに超おすすめ)、エストラ アトバリアクリーム、エストラ アトバリアローション、メディヒール ティーツリーパック、リンゼイ ティーツリーモデリングパック、ブリングリーン アロエジェル、ラボン EGFアンプル、ダーマトリー モイスチャーアンプル、タマヌオイル(ラボンとドクターオルガを交互に使用)\n\n\n使用期間\n：約10日間\n\nテクスチャー/なじみ\n：典型的なクレンジングミルクで、優しくローリングできます\n\n容器/価格\n：小ぶりなポンプ容器！旅行にも持って行きやすいサイズです\n\nトラブル以外の感想\n：すでに化膿性ニキビがいくつか出ていた状態で使いましたが、これ以上悪化しませんでした。洗顔フォームだけでもヒリヒリしていたのに、この製品を使ってもヒリヒリ感や不快感がなくて良かったです。パンテノールが入っているので保湿感がありつつしっとりと洗浄できる気がします",th:"🧸ประเภทผิว\n: ผิวมันขาดน้ำที่แพ้ง่ายมากๆ และเห่อขึ้นบ่อยๆ เป็นภูมิแพ้ผิวหนังตั้งแต่เด็ก ตอนนี้ดีขึ้นแล้วแต่พอเปลี่ยนฤดูกาลทีไรก็จะกลับมาขึ้นที่หน้าและทั้งตัวอีก แค่ผิวแห้งนิดหน่อยหรือสมดุลน้ำ-มันเสียไปหน่อยก็จะเป็นผื่นลอก (สะเก็ดเงิน) ผิวอักเสบจากการสัมผัส แพ้ง่ายจนวุ่นวายไปหมด ซ้ำร้ายยังได้รับการวินิจฉัยว่าเป็นโรซาเชียอีกด้วย พออายุมากขึ้นรูขุมขนก็กว้างขึ้น มีสิวเสี้ยนที่หน้าผากกับแก้ม\n\n✔️สรุป\n: หน้าเป็นผิวมันขาดน้ำผสมที่มีสิวเสี้ยน แพ้ง่าย เป็นโรซาเชีย! ตัวเป็นผิวแห้งมาก เป็นภูมิแพ้ผิวหนัง แพ้ง่ายบ่อยๆ!\n \n🤍ไอเทมประจำตัว\n: Isoi Emergency Spot, Isoi Acne Doctor Skin (ไม่ใช้กับโรซาเชีย), Dr.G Red Blemish Moisture Cream (ใช้ไปเกิน 10 กระปุกแล้ว...), Make P:rem Safe Me Relief Moisture 12 Cream, Zeroid MD Lotion•Cream (แนะนำสำหรับทุกสภาพผิว), Aestura Atobarrier Cream, Aestura Atobarrier Lotion, Mediheal Tea Tree Pack, Lindsay Tea Tree Modeling Pack, Bring Green Aloe Gel, Rangbel EGF Ampoule, Dermatory Moisture Ampoule, น้ำมันทามานู (สลับใช้ Rangbel กับ Dr.Orga)\n\n\nระยะเวลาที่ใช้\n: ประมาณ 10 วัน\n\nเนื้อสัมผัส/การลูบไล้\n: เป็นคลีนซิ่งมิลค์ทั่วไป นวดคลึงได้นุ่มนวล\n\nบรรจุภัณฑ์/ราคา\n: ขวดปั๊มขนาดเล็ก! ขนาดพกพาเหมาะกับการเดินทาง\n\nอื่นๆ นอกจากเรื่องสิว\n: ใช้ตอนที่มีสิวอักเสบเป็นหนองขึ้นอยู่แล้วหลายเม็ด แต่ก็ไม่ทำให้สิวแย่ลงไปกว่าเดิม แค่ใช้โฟมล้างหน้าอย่างเดียวก็แสบแล้ว แต่ตอนใช้ผลิตภัณฑ์นี้ไม่รู้สึกแสบหรือไม่สบายผิวเลย ดีมาก มีแพนธีนอลด้วยเลยรู้สึกว่าให้ความชุ่มชื้นและทำความสะอาดแบบนุ่มนวล"},images:[],video:null},
    {id:"AGE1mPeZ",rating:4,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지, 유수분 밸런스 무너짐 - 베이스 메이크업 자극 없이 세정+속당김 없음",en:"Combination (oily-dehydrated), oil-water balance thrown off - cleanses base makeup without irritation, no tightness afterward","zh-CN":"水油皮，水油平衡容易崩溃 - 卸底妆不刺激+洗后不紧绷","zh-TW":"外油內乾，油水平衡容易失衡 - 無刺激卸除底妝+洗後不緊繃",ja:"インナードライ肌、水分・油分バランスが崩れがち - ベースメイクを刺激なく洗浄+つっぱりなし",th:"ผิวมันขาดน้ำ สมดุลน้ำ-มันเสียง่าย - ทำความสะอาดเมคอัพเบสโดยไม่ระคายเคือง + ไม่ตึงหลังล้างหน้า"},date:"2026-06-06",
      quote:{ko:"📍세정력 : 선크림 맞춤 No 자극\n\n - 베이스 메이크업 최적화: 유수분 밸런스가 쉽게 무너지는 수부지 피부 특성상 모공을 막지 않는 세정이 정말 중요한데, 이 제품은 파운데이션, 쿠션, 선크림 등 일상적인 베이스 메이크업을 자극 없이 부드럽게 녹여줘요.\n - 노폐물 용해: 피부 위에서 문지를수록 과도한 피지와 엉겨 붙은 노폐물이 부드럽게 유화되면서 피부 표면을 깔끔하게 정돈해줘서 마음에 들어요!\n\n🧴 제형 및 사용감 : 수분감 가득한 무자극 로션 질감\n\n - 산뜻하고 묽은 로션 같은 텍스처: 오일 특유의 답답하고 무거운 잔여감이나 되직한 크림의 유분감 대신 촉촉하고 묽은 로션 같은 질감이에요!\n - 편안한 무자극 케어: 판테놀 1%와 블루 진정 성분이 함유되어 있어서 피부에 문지를 때 마찰감이 거의 느껴지지 않을 정도로 부드럽게 롤링돼요. 덕분에 장벽이 예민해진 날에도 세안 중이나 세안 후에 붉어짐이나 따가움, 눈 시림이 없어서 편해요! \n\n📍여름철 사용감☀️ : 산뜻한 수분막 유수분 밸런스 유지\n\n - 속건조 해결: 세안 후 피부에 꼭 필요한 수분막을 남겨줘서 새안 후 속당김이 없어요.\n - 유분 부담 제로: 무거운 유분 겉돎이 없어서 더운 날씨에도 부담 없이 산뜻하게 유수분 밸런스를 맞출 수 있어요.\n\n⭐️ 추천 피부 타입\n\n - 수분 부족형 지성(수부지) 및 복합성 피부\n오일 클렌저를 쓰면 트러블이 올라오고, 폼 클렌저만 쓰면 너무 건조한 피부에 추천해요.\n - 민감성 및 장벽이 무너진 피부\n작은 자극에도 쉽게 붉어지고 피부 장벽을 보호해야 하는 피부에 알맞을 것 같아요!",en:"📍Cleansing power: works with sunscreen, no irritation\n\n - Optimized for base makeup: since combination (oily-dehydrated) skin has such an easily disrupted oil-water balance, cleansing that doesn't clog pores really matters — this product gently melts away everyday base makeup like foundation, cushion, and sunscreen without any irritation.\n - Dissolves buildup: the more you massage it into the skin, the more excess sebum and caked-on buildup gently emulsifies and clears off the skin's surface — I love that.\n\n🧴 Texture and feel: a hydrating, non-irritating lotion-like texture\n\n - A light, watery lotion-like texture: instead of the stuffy, heavy oily residue of typical oils or the greasiness of a thick cream, it's got a moist, watery lotion-like feel!\n - Comfortable, gentle care: with 1% Panthenol and blue soothing ingredients, it rolls on so smoothly there's barely any friction against the skin. Thanks to that, even on days when my barrier is extra sensitive, there's no redness, stinging, or eye stinging during or after cleansing — so comfortable! \n\n📍Summer feel☀️: leaves a light hydrating film, keeps oil-water balance\n\n - Fixes inner dehydration: leaves the moisture film your skin needs after cleansing, so there's no tightness post-wash.\n - Zero oily burden: no heavy oily film sitting on top, so even in hot weather you can keep your oil-water balance light and comfortable.\n\n⭐️ Recommended skin types\n\n - Combination (oily-dehydrated) and combination skin\nGreat for people who break out with oil cleansers but find foam cleanser alone too drying.\n - Sensitive skin with a compromised barrier\nSeems ideal for skin that reddens easily at the smallest irritation and needs barrier protection!","zh-CN":"📍清洁力：贴合防晒霜 无刺激\n\n - 底妆优化：水油皮的水油平衡本来就容易崩溃，不堵塞毛孔的清洁真的很重要，这款产品能把粉底液、气垫、防晒霜等日常底妆无刺激地温和溶解掉。\n - 溶解废物：在皮肤上打圈按摩时，多余的皮脂和粘连的废物会被温和乳化，把皮肤表面清理得很干净，这点很喜欢！\n\n🧴 质地及使用感：水润感十足的无刺激乳液质地\n\n - 清爽偏稀的乳液质地：没有油类特有的闷重残留感，也没有厚重面霜的油腻感，是水润偏稀的乳液质地！\n - 舒适无刺激护理：含有1%泛醇和蓝色舒缓成分，在皮肤上按摩时几乎感觉不到摩擦，滑滑地打圈。所以就算屏障变敏感的日子，洗脸中或洗脸后也不会泛红、刺痛、呛眼，很省心！\n\n📍夏季使用感☀️：清爽的水润膜维持水油平衡\n\n - 解决内干：洗后会在皮肤上留下必要的水润膜，洗脸后不会觉得紧绷。\n - 零油腻负担：没有厚重的油浮在表面，就算天热也能轻松清爽地维持水油平衡。\n\n⭐️推荐肤质\n\n - 水分不足的油性（水油皮）及混合性肌肤\n用油类卸妆会长痘、只用洁面泡沫又太干的肌肤，推荐使用。\n - 敏感性及屏障受损的肌肤\n对适合那种一点小刺激就容易泛红、需要保护皮肤屏障的肌肤，感觉很合适！","zh-TW":"📍潔淨力：連防曬乳都能卸乾淨 完全無刺激\n\n - 底妝最佳化：外油內乾膚質油水平衡容易失衡，不阻塞毛孔的清潔真的很重要，這款產品能無刺激地溫柔溶解粉底、氣墊、防曬乳等日常底妝。\n - 溶解老廢角質：在皮膚上按摩滾動時，過多皮脂和黏結的老廢物會被溫和乳化，把肌膚表面整理得乾乾淨淨，這點很喜歡！\n\n🧴 質地與使用感：水潤感十足的無刺激乳液質地\n\n - 清爽稀薄的乳液質地：不是油類特有的悶重殘留感，也不是厚重面霜的油膩感，而是水潤又稀薄的乳液質地！\n - 舒適無刺激的呵護：含有1%泛醇和藍色舒緩成分，在肌膚上按摩時幾乎感受不到摩擦，滾動起來非常柔順。多虧如此，就算是屏障敏感的日子，洗臉中或洗臉後都不會泛紅、刺痛或刺眼，非常舒服！\n\n📍夏季使用感☀️：清爽水膜、維持油水平衡\n\n - 解決內在乾燥：洗完臉會留下肌膚必需的水膜，洗臉後不會有內在乾燥的緊繃感。\n - 零油膩負擔：沒有厚重浮油感，即使天氣炎熱也能輕鬆維持清爽的油水平衡。\n\n⭐️ 推薦膚質\n\n - 水分不足型油性肌（外油內乾）及混合性肌膚\n如果用油類卸妝會長痘痘、只用洗面乳又太乾的膚質，推薦使用。\n - 敏感肌及屏障受損的肌膚\n稍微一點刺激就容易泛紅、需要保護皮膚屏障的膚質也很適合！",ja:"📍洗浄力：日焼け止めもしっかり落とすのに刺激なし\n\n・ベースメイクに最適化：水分・油分バランスが崩れやすいインナードライ肌にとって毛穴を詰まらせない洗浄はとても大事ですが、この製品はファンデーション、クッション、日焼け止めなど日常的なベースメイクを刺激なく優しく溶かしてくれます。\n・老廃物を溶解：肌の上でこすればこするほど過剰な皮脂と絡まった老廃物が優しく乳化されて、肌表面をきれいに整えてくれるところが気に入っています！\n\n🧴 テクスチャー・使用感：水分感たっぷりの低刺激ローションのような質感\n\n・さっぱりとした水っぽいローションのようなテクスチャー：オイル特有の重くて息苦しい残留感や、濃厚なクリームの油っぽさの代わりに、しっとりとした水っぽいローションのような質感です！\n・快適な低刺激ケア：パンテノール1%とブルー鎮静成分が配合されていて、肌にこすっても摩擦をほとんど感じないくらい滑らかにローリングできます。おかげでバリアが敏感になった日でも、洗顔中や洗顔後の赤みやヒリヒリ感、目にしみる感じがなくて楽です！\n\n📍夏の使用感☀️：さっぱりとした水分膜で水分・油分バランスをキープ\n\n・インナードライ解消：洗顔後に肌に必要な水分膜を残してくれるので、洗顔後のつっぱりがありません。\n・油分の負担ゼロ：重たい油分が浮くことがないので、暑い日でも負担なくさっぱりと水分・油分バランスを整えられます。\n\n⭐️ おすすめの肌タイプ\n\n・水分不足型の脂性肌(インナードライ)や混合肌\nオイルクレンザーを使うと肌荒れが起きて、フォームクレンザーだけだと乾燥しすぎる肌におすすめです。\n・敏感肌やバリアが崩れた肌\nちょっとした刺激にもすぐ赤くなって、肌バリアを守る必要がある肌に合うと思います！",th:"📍แรงทำความสะอาด : เข้ากับครีมกันแดด ไม่ระคายเคือง\n\n - เหมาะกับเมคอัพเบส: ด้วยความที่ผิวมันขาดน้ำสมดุลน้ำ-มันเสียง่าย การทำความสะอาดแบบไม่อุดตันรูขุมขนจึงสำคัญมาก ผลิตภัณฑ์นี้ละลายเมคอัพเบสประจำวันอย่างรองพื้น คุชชั่น ครีมกันแดด ได้อย่างนุ่มนวลไม่ระคายเคือง\n - ละลายสิ่งสกปรก: ยิ่งนวดบนผิวมากเท่าไหร่ ไขมันส่วนเกินและสิ่งสกปรกที่จับตัวกันก็จะค่อยๆ อิมัลชันออกมาอย่างนุ่มนวล ทำให้ผิวหน้าดูสะอาดเรียบเนียน ชอบมากเลย!\n\n🧴 เนื้อสัมผัสและความรู้สึกเมื่อใช้ : เนื้อโลชั่นชุ่มชื้นไม่ระคายเคือง\n\n - เนื้อสัมผัสโลชั่นบางเบาสดชื่น: แทนที่จะเป็นความหนักอึ้งอึดอัดแบบออยล์ หรือความมันของครีมข้นๆ กลับเป็นเนื้อโลชั่นบางเบาชุ่มชื้น!\n - ดูแลผิวอย่างอ่อนโยนไม่ระคายเคือง: มีแพนธีนอล 1% และส่วนผสมบลูซูทติ้ง ทำให้แทบไม่รู้สึกถึงแรงเสียดสีตอนนวดบนผิวเลย นุ่มนวลมาก ด้วยเหตุนี้แม้วันที่เกราะผิวอ่อนแอ ก็ไม่มีอาการแดง แสบ หรือแสบตาทั้งระหว่างและหลังล้างหน้า สบายผิวมาก! \n\n📍ความรู้สึกตอนใช้หน้าร้อน☀️ : คงความชุ่มชื้นสดชื่น สมดุลน้ำ-มันดี\n\n - แก้ปัญหาผิวขาดน้ำ: หลังล้างหน้าจะทิ้งฟิล์มความชุ่มชื้นที่จำเป็นไว้บนผิว ทำให้ไม่ตึงหลังล้างหน้า\n - ไม่มีภาระความมัน: ไม่มีความมันหนักๆ ลอยอยู่บนผิว แม้อากาศร้อนก็ปรับสมดุลน้ำ-มันได้อย่างสดชื่นไม่มีภาระ\n\n⭐️ ประเภทผิวที่แนะนำ\n\n - ผิวมันขาดน้ำ (ผิวมันแต่ขาดความชุ่มชื้น) และผิวผสม\nแนะนำสำหรับผิวที่ใช้คลีนซิ่งออยล์แล้วเกิดสิว แต่ใช้แค่โฟมล้างหน้าแล้วแห้งเกินไป\n - ผิวแพ้ง่ายและผิวที่เกราะผิวเสียหาย\nน่าจะเหมาะกับผิวที่แดงง่ายแม้โดนการระคายเคืองเพียงเล็กน้อย และต้องการปกป้องเกราะผิว!"},images:[],video:null},
    {id:"Zm2kR8Eq",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"건성(생리기간 악건성), 눈가주름·열감·각질들뜸 - 1차 세안 후에도 당김 없음, 블랙헤드 관리",en:"Dry (severely dry during period), fine lines around eyes, flushing, flaking - no tightness even after first cleanse, helps manage blackheads","zh-CN":"干皮（生理期极干），眼周细纹·灼热感·起皮 - 一次洁面后也不紧绷，黑头有改善","zh-TW":"乾性（生理期間極乾），眼周細紋‧泛熱‧角質浮起 - 一次卸妝後也不緊繃，黑頭管理",ja:"乾燥肌(生理期間は極度乾燥)、目元のシワ・ほてり・粉吹き - 1回目洗顔後もつっぱりなし、黒ずみケア",th:"ผิวแห้ง (แห้งมากช่วงมีประจำเดือน) ริ้วรอยรอบดวงตา·ผิวร้อนวูบวาบ·ขุยลอก - ไม่ตึงแม้หลังล้างหน้าครั้งแรก ช่วยดูแลหัวสิวอุดตันดำ"},date:"2026-06-15",
      quote:{ko:"✔️피부 정보\n  T존에 유분기가 있는 건성\n  겨울철&생리 기간 중 악건성\n  악건성일 때 눈가주름, 눈 뜨고 감을 때 건조함으로 인한 당김\n  악건성일 때 건조함으로 인한 갑작스러운 얼굴에 열감\n  피부각질 올라옴에 따른 화장/선크림들뜸\n  여름기간 피부 번들거림\n  겨울기간 피부 극건성 (각질, 들뜸, 수분부족)\n  \n \n\n  ✔️제품 추천 대상\n  세안 후 피부 당김있는 사람\n  세안 후 피부 건조감있는 사람\n  민감성 피부가 트러블 없이 사용할 수 있는 제품을 찾는 사람\n  유화과정을 잘 지키는 사람\n  피부가 건조한 사람\n  건성 피부\n  \n \n\n  ✔️제품 특징\n  \n \n\n  1. 판테놀 포함 피부 장벽 강화\n  정말 가장 큰 특징! 오일을 사용하더라도 피부 세안 후에 항상 건조감이 느껴지던 피부 타입인데, 해당 제품은 1차 세안으로 이 제품을 쓰고 클렌징폼으로 2차 세안을 해도 피부 당김이 느껴지지 않습니다! 오히려 기초 관리 전까지 피부가 촉촉해진 느낌이 들어서 악건성이나 클렌징 후 피부 당김이 있으신 분들에게 정말 적합합니다! 이 면에서 정말정말 만족해요!\n  \n \n\n  2. 피부 트러블 없음\n  클렌징오일, 클렌징폼 잘못 쓰면 오히려 트러블이 나기도 하는데, 클렌징 밀크류가 정말 순하긴 한지 트러블이 하나도 안났습니다! 저의 경우 피부 제품을 바꾸면 좁쌀이나 염증성 여드름이 올라오는 편인데, 이 제품 사용 후에는 전혀 없었습니다\n  \n \n\n  3. 유화 과정\n  유화 과정에서 모공 마사지를 하면 안에 있던 블랙헤드가 쏙쏙 나옵니다! 오히려 클렌징오일보다 유화과정에서 블랙헤드 관리가 잘 되는 것 같아요. 또 개인적으로는 화장 할 때 각질이 잘 안올라오더라구요! 다만 콧망울 쪽 블랙헤드는 여전하긴 합니다..ㅎ",en:"✔️Skin info\n  Dry with some oil in the T-zone\n  Severely dry in winter & during my period\n  When severely dry: fine lines around the eyes, tightness from dryness when opening/closing eyes\n  When severely dry: sudden flushing/heat in the face from dryness\n  Makeup/sunscreen lifting due to flaking\n  Skin gets shiny in summer\n  Extremely dry skin in winter (flaking, lifting, lack of moisture)\n  \n \n\n  ✔️Who I'd recommend this to\n  People who feel tightness after cleansing\n  People who feel dryness after cleansing\n  People with sensitive skin looking for a product they can use without breakouts\n  People who follow the emulsifying step properly\n  People with dry skin\n  Dry skin types\n  \n \n\n  ✔️Product features\n  \n \n\n  1. Strengthens the skin barrier with panthenol\n  This is honestly the biggest highlight! Even with oil cleansers, my skin always felt dry after cleansing — but with this product, using it as the first cleanse and then a foam cleanser as the second cleanse, I don't feel any tightness at all! If anything, my skin feels moisturized right up until my regular skincare routine, so it's really well suited for severely dry skin or anyone who feels tight after cleansing! Genuinely, genuinely satisfied on this front!\n  \n \n\n  2. No breakouts\n  Cleansing oils and foams can sometimes cause breakouts if used wrong, but this cleansing milk type seems gentle enough that I had zero breakouts! I'm someone who tends to get little bumps or inflamed acne when I switch products, but there was none of that after using this\n  \n \n\n  3. Emulsifying step\n  When you massage the pores during the emulsifying step, blackheads pop right out! It actually manages blackheads better during emulsification than a cleansing oil does. Personally I also noticed less flaking when doing my makeup! That said, the blackheads around my nose wings are still stubbornly there..lol","zh-CN":"✔️肤质信息\n  T区有点油的干皮\n  冬季&生理期极干\n  极干时眼周有细纹，睁闭眼时因干燥而紧绷\n  极干时因干燥突然脸部发热\n  皮肤起皮导致底妆/防晒浮粉\n  夏季皮肤出油\n  冬季皮肤极干（起皮、浮粉、缺水）\n  \n \n\n  ✔️适合人群\n  洗脸后皮肤紧绷的人\n  洗脸后皮肤干燥的人\n  正在寻找不会导致敏感肌长痘的产品的人\n  会认真做乳化步骤的人\n  皮肤干燥的人\n  干性肌肤\n  \n \n\n  ✔️产品特点\n  \n \n\n  1. 含泛醇，强化皮肤屏障\n  真的是最大的特点！就算用油类，洗完脸后总是会觉得干燥的肤质，用这款产品做一次洁面，再用洁面泡沫二次洁面也不会觉得紧绷！反而在做基础护理之前皮肤就已经感觉水润，对极干性或洁面后紧绷的人真的很适合！这点真的非常满意！\n  \n \n\n  2. 不长痘\n  卸妆油、洁面泡沫用不对反而会长痘，但这款洁面乳质地真的很温和，一颗痘都没长！我的情况是一换产品就容易长闭口或炎症型痘痘，用这款产品后完全没有\n  \n \n\n  3. 乳化过程\n  乳化过程中按摩毛孔时，里面的黑头会一颗颗冒出来！感觉比卸妆油在乳化过程中黑头护理效果更好。而且个人感觉化妆时也不太起皮！只是鼻翼那边的黑头还是老样子……哈","zh-TW":"✔️膚質資訊\n  T字部位偏油的乾性肌\n  冬天&生理期間極度乾燥\n  極乾時眼周會有細紋，睜眼閉眼時因乾燥而緊繃\n  極乾時因乾燥導致臉突然發熱\n  角質浮起導致上妝/防曬乳浮粉\n  夏天皮膚會出油\n  冬天皮膚極乾（角質、浮粉、缺水）\n\n\n\n  ✔️適合推薦對象\n  洗臉後皮膚會緊繃的人\n  洗臉後皮膚會乾燥的人\n  正在尋找敏感肌也能無負擔使用產品的人\n  會確實做乳化步驟的人\n  皮膚乾燥的人\n  乾性肌膚\n\n\n\n  ✔️產品特色\n\n\n\n  1. 含泛醇、強化皮膚屏障\n  真的是最大的特色！就算用油卸妝，洗完臉後總是會感到乾燥的膚質，但這款產品一次卸妝用它、再用洗面乳二次清潔，也完全不會感到緊繃！反而在做基礎保養之前皮膚就已經覺得水潤，對極乾肌或卸妝後會緊繃的人真的很適合！這點真的非常滿意！\n\n\n\n  2. 完全沒有長痘痘\n  卸妝油、洗面乳用不對反而會長痘痘，不知道是不是卸妝乳類真的比較溫和，完全沒有長任何痘痘！我自己只要換保養品就容易長粉刺或發炎型痘痘，用了這款之後完全沒有\n\n\n\n  3. 乳化過程\n  在乳化過程中按摩毛孔，裡面的黑頭會咕嚕咕嚕跑出來！感覺乳化過程中管理黑頭的效果反而比卸妝油更好。而且我個人上妝時也比較不會浮粉！不過鼻翼旁的黑頭還是老樣子……哈",ja:"✔️肌情報\n  Tゾーンに皮脂がある乾燥肌\n  冬場&生理期間中は極度の乾燥肌\n  極度の乾燥肌のとき、目元のシワ、目を開け閉めする時の乾燥によるつっぱり\n  極度の乾燥肌のとき、乾燥による急な顔のほてり\n  肌の粉吹きによるメイク/日焼け止めの浮き\n  夏場は肌のテカリ\n  冬場は肌が極度に乾燥(粉吹き、浮き、水分不足)\n  \n \n\n  ✔️こんな人におすすめ\n  洗顔後に肌がつっぱる人\n  洗顔後に肌の乾燥を感じる人\n  敏感肌がトラブルなく使える製品を探している人\n  乳化プロセスをきちんと守る人\n  肌が乾燥している人\n  乾燥肌\n  \n \n\n  ✔️製品の特徴\n  \n \n\n  1. パンテノール配合で肌バリア強化\n  本当に一番の特徴！オイルを使っても洗顔後はいつも乾燥を感じていた肌タイプなのですが、この製品を1回目の洗顔に使い、洗顔フォームで2回目の洗顔をしても肌のつっぱりを感じません！むしろスキンケア前まで肌がしっとりしている感じがして、極度の乾燥肌の方や洗顔後につっぱりを感じる方に本当にぴったりです！この点は本当に本当に満足しています！\n  \n \n\n  2. 肌トラブルなし\n  クレンジングオイルやクレンジングフォームを間違った使い方をすると、逆に肌荒れすることもありますが、クレンジングミルク系は本当に低刺激なのか、トラブルが一つも出ませんでした！私の場合、スキンケア製品を変えると小さいブツブツや炎症性ニキビが出やすいのですが、この製品を使ってからは全くありませんでした\n  \n \n\n  3. 乳化プロセス\n  乳化しながら毛穴をマッサージすると、中にあった黒ずみがするっと出てきます！むしろクレンジングオイルより乳化過程で黒ずみケアがしっかりできる感じがします。個人的にはメイクの時に粉が浮きにくくなりました！ただ小鼻まわりの黒ずみは相変わらずです…笑",th:"✔️ข้อมูลผิว\n  ผิวแห้งที่มีความมันบริเวณ T-zone\n  แห้งมากในช่วงหน้าหนาวและช่วงมีประจำเดือน\n  ตอนแห้งมาก จะมีริ้วรอยรอบดวงตา ตึงเวลาลืมตา-หลับตาเพราะความแห้ง\n  ตอนแห้งมาก จะรู้สึกร้อนวูบวาบที่หน้ากะทันหันเพราะความแห้ง\n  เมคอัพ/ครีมกันแดดลอกเป็นขุยเพราะขุยผิว\n  ผิวมันเยิ้มในหน้าร้อน\n  ผิวแห้งมากในหน้าหนาว (ขุย ลอก ขาดความชุ่มชื้น)\n  \n \n\n  ✔️เหมาะกับใคร\n  คนที่ผิวตึงหลังล้างหน้า\n  คนที่ผิวแห้งหลังล้างหน้า\n  คนผิวแพ้ง่ายที่กำลังหาผลิตภัณฑ์ที่ใช้แล้วไม่เกิดสิว\n  คนที่ทำขั้นตอนอิมัลชันอย่างถูกต้อง\n  คนผิวแห้ง\n  ผิวแห้ง\n  \n \n\n  ✔️จุดเด่นของผลิตภัณฑ์\n  \n \n\n  1. เสริมเกราะผิวด้วยแพนธีนอล\n  จุดเด่นที่สุดจริงๆ! ปกติแม้ใช้ออยล์ล้างหน้าก็ยังรู้สึกแห้งตลอด แต่ผลิตภัณฑ์นี้แม้ล้างหน้าครั้งแรกด้วยตัวนี้แล้วล้างครั้งที่สองด้วยโฟม ก็ไม่รู้สึกตึงเลย! กลับรู้สึกว่าผิวชุ่มชื้นจนกว่าจะเริ่มสกินแคร์ เหมาะมากสำหรับคนผิวแห้งมากหรือคนที่ตึงหลังล้างหน้า พอใจในจุดนี้มากๆ!\n  \n \n\n  2. ไม่เกิดสิว\n  ถ้าใช้คลีนซิ่งออยล์หรือโฟมผิด อาจทำให้เกิดสิวได้ แต่คลีนซิ่งมิลค์ตัวนี้อ่อนโยนมากจนไม่เกิดสิวเลยแม้แต่เม็ดเดียว! ปกติเวลาเปลี่ยนผลิตภัณฑ์ผิวหน้าฉันมักจะมีสิวเสี้ยนหรือสิวอักเสบขึ้น แต่หลังใช้ตัวนี้ไม่มีเลยสักนิด\n  \n \n\n  3. ขั้นตอนอิมัลชัน\n  ตอนนวดรูขุมขนในขั้นตอนอิมัลชัน หัวสิวอุดตันดำที่ซ่อนอยู่จะหลุดออกมาเป็นระยะๆ! รู้สึกว่าขั้นตอนอิมัลชันนี้จัดการหัวสิวอุดตันดำได้ดีกว่าคลีนซิ่งออยล์อีก แล้วส่วนตัวรู้สึกว่าตอนแต่งหน้าก็ไม่ค่อยมีขุยลอกด้วย! แต่หัวสิวอุดตันดำบริเวณปีกจมูกก็ยังคงอยู่เหมือนเดิมนะ..ฮ่า"},images:[],video:null},
    {id:"Ad2zpYXZ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지, 자극시 붉어지고 가려운 모낭염 피부 - 가려움·자극 없이 매일 사용 가능",en:"Combination (oily-dehydrated), folliculitis-prone skin that reddens and itches with irritation - daily use with no itching or irritation","zh-CN":"水油皮，一刺激就泛红发痒的毛囊炎肌 - 每天使用也不痒不刺激","zh-TW":"外油內乾，刺激時會泛紅發癢的毛囊炎肌膚 - 每天使用也不癢不刺激",ja:"インナードライ肌、刺激を受けると赤くなって痒くなる毛嚢炎肌 - 痒み・刺激なく毎日使用可能",th:"ผิวมันขาดน้ำ ผิวเป็นรูขุมขนอักเสบที่แดงและคันเมื่อโดนกระตุ้น - ใช้ได้ทุกวันโดยไม่คันหรือระคายเคือง"},date:"2026-06-05",
      quote:{ko:"2주간 매일 사용해 보고 쓰는 솔직한 후기입니다. \n \n\n 🫧피부타입 : 자극을 받으면 붉어지고 가려운 증상이 생기면서 모낭염이 잘 올라오는 예민한 수부지 피부\n \n\n 🫧사용총평 : 모낭염 때문에 피부장벽을 매우 중요하게 생각하는데 매일 써도 가려움이나 자극 없었어요. 크리미한 제형으로 촉촉하고 부드럽게 롤링되어 마찰이 전혀없고 쓸때마다 정말 순하다고 느꼈어요. 민감성 피부를 기준으로 만들어진 제품인 만큼 그동안 써왔던 클렌징 제품들 중에서 제일 순했어요. 세안 후 잔여감없이 산뜻하고 촉촉해서 당김을 못 느꼈어요. \n \n\n 애초에 진한 메이크업을 지우기 위한 제품이 아니기 때문에 색조 메이크업까지 완벽하게 지워지진 않아요. 세정력을 더 높이면 아마 지금처럼 순한 제품은 아니었을테구요. 제품 설명에도 나와있는 부분이라 세정력이 아쉽진 않았어요. 선크림과 가벼운 베이스 메이크업을 지우기에는 충분한 세정력을 가지고 있습니다. 눈시림이나 따가움도 없어요. \n \n\n 피부장벽의 재생,진정,보습,보호에 효과적인 판테놀과 세콜지, 구아이아줄렌, 알란토인까지 예민한 피부에 좋은 성분들이 많아요. 클렌징 제품들 중에서 판테놀 함량이 제일 높은거 같은데 피부가 예민해져서 뭘 써도 아프고 따가울때 상태를 진정시켜줄 좋은 제품인거 같아요. 강추드려요!!",en:"This is an honest review after using it daily for 2 weeks. \n \n\n 🫧Skin type: sensitive combination (oily-dehydrated) skin that reddens and itches with irritation, and is prone to folliculitis\n \n\n 🫧Overall thoughts: because of my folliculitis I care a lot about the skin barrier, and even with daily use there was no itching or irritation. The creamy texture rolls on moist and smooth with zero friction, and every time I used it I really felt how gentle it was. Since it's made with sensitive skin in mind, it was the gentlest out of all the cleansing products I've tried. No residue after rinsing — fresh and moist, with no tightness at all. \n \n\n It's not designed to remove heavy makeup in the first place, so it won't perfectly take off full color makeup. If they'd cranked up the cleansing power, it probably wouldn't be this gentle anymore — that's mentioned in the product description too, so I wasn't disappointed by the cleansing strength. It has plenty of power to remove sunscreen and light base makeup. No eye stinging or discomfort either. \n \n\n It's packed with ingredients great for sensitive skin — panthenol, which helps repair, soothe, moisturize, and protect the barrier, plus cecolgi, guaiazulene, and allantoin. I think it has the highest panthenol content among cleansing products I've tried, and it feels like a great option to calm things down when your skin is so sensitive that everything stings. Highly recommend!!","zh-CN":"这是连续两周每天使用后写的真实测评。\n \n\n 🫧肤质：一受刺激就泛红发痒、容易长毛囊炎的敏感水油皮\n \n\n 🫧使用总评：因为毛囊炎的关系我非常在意皮肤屏障，每天用也没有发痒或刺激。膏霜质地，打圈时润滑柔软，完全没有摩擦感，每次用都觉得真的很温和。既然是按敏感肌标准做的产品，在我用过的洁面产品里算是最温和的了。洗完脸没有残留感，清爽又水润，感觉不到紧绷。\n \n\n 因为这本来就不是为卸浓妆设计的产品，所以彩妆不能完全卸干净。要是把清洁力做得更强，大概就不会像现在这么温和了。产品说明里也写明了这点，所以我对清洁力没有失望。卸防晒和轻底妆是完全足够的清洁力。也没有呛眼或刺痛感。\n \n\n 对皮肤屏障的修复、舒缓、保湿、保护都有效的泛醇、积雪草、蓝甘菊薁、尿囊素，都是对敏感肌很好的成分。在洁面产品里泛醇含量算是最高的了，感觉是那种皮肤变敏感、用什么都痛都刺激的时候能帮忙镇静的好产品。强烈推荐！！","zh-TW":"這是連續兩週每天使用後的真實心得。\n\n\n 🫧膚質：只要一刺激就會泛紅發癢、容易長毛囊炎的敏感外油內乾肌\n\n\n 🫧使用總評：因為毛囊炎的關係我非常重視皮膚屏障，每天使用也完全沒有癢或刺激。乳霜質地滾動起來濕潤又柔順，完全沒有摩擦感，每次用都覺得真的很溫和。畢竟是以敏感肌為標準製作的產品，是我用過的卸妝產品裡最溫和的。洗完臉後沒有殘留感，清爽又濕潤，完全感覺不到緊繃。\n\n\n 因為本來就不是為了卸濃妝設計的產品，所以沒辦法把彩妝完全卸乾淨。如果把潔淨力再提高，大概就不會像現在這麼溫和了。產品說明裡也有寫到這一點，所以對潔淨力沒有太失望。卸防曬乳和淡妝已經綽綽有餘。也完全不會刺眼或刺痛。\n\n 對皮膚屏障的修護、舒緩、保濕、保護有效的泛醇，加上Cecalgine、癒創木薁、尿囊素，敏感肌適用的好成分很多。卸妝產品裡泛醇含量好像是最高的，當皮膚敏感到用什麼都會痛、會刺痛的時候，這款應該能幫忙舒緩狀況。大力推薦！！",ja:"2週間毎日使ってみた正直レビューです。\n \n\n 🫧肌タイプ：刺激を受けると赤くなって痒くなる症状が出て、毛嚢炎ができやすい敏感なインナードライ肌\n \n\n 🫧使用総評：毛嚢炎があるので肌バリアをとても重要視していますが、毎日使っても痒みや刺激はありませんでした。クリーミーなテクスチャーでしっとり優しくローリングできて摩擦が全くなく、使うたびに本当に低刺激だと感じました。敏感肌を基準に作られた製品なだけあって、これまで使ってきたクレンジング製品の中で一番マイルドでした。洗顔後は残留感なくさっぱりしっとりしていて、つっぱりを感じませんでした。\n \n\n もともと濃いメイクを落とすための製品ではないので、色付きメイクまで完璧には落ちません。洗浄力をもっと高めていたら、おそらく今のような低刺激な製品ではなかったと思います。製品説明にも書かれている部分なので、洗浄力について不満はありませんでした。日焼け止めや軽めのベースメイクを落とすには十分な洗浄力があります。目にしみたりヒリヒリすることもありません。\n \n\n 肌バリアの再生、鎮静、保湿、保護に効果的なパンテノールとセコルジ、グアイアズレン、アラントインまで、敏感肌に良い成分がたくさん入っています。クレンジング製品の中でパンテノール含有量が一番高い気がしますが、肌が敏感になって何を使っても痛くてヒリヒリする時に、状態を鎮めてくれる良い製品だと思います。強くおすすめします！！",th:"นี่คือรีวิวตรงไปตรงมาหลังใช้ทุกวันติดต่อกัน 2 สัปดาห์ค่ะ \n \n\n 🫧ประเภทผิว : ผิวมันขาดน้ำที่แพ้ง่าย พอโดนกระตุ้นจะแดงและคัน แล้วมักจะเป็นรูขุมขนอักเสบ\n \n\n 🫧สรุปการใช้งาน : เพราะเป็นรูขุมขนอักเสบเลยให้ความสำคัญกับเกราะผิวมาก แต่ใช้ทุกวันแล้วไม่คันไม่ระคายเคืองเลย เนื้อครีมมี่ นวดคลึงได้ชุ่มชื้นนุ่มนวล ไม่มีแรงเสียดสีเลย รู้สึกว่าอ่อนโยนจริงๆ ทุกครั้งที่ใช้ เป็นผลิตภัณฑ์ที่ออกแบบมาสำหรับผิวแพ้ง่ายโดยเฉพาะ จึงอ่อนโยนที่สุดในบรรดาผลิตภัณฑ์คลีนซิ่งที่เคยใช้มา หลังล้างหน้าไม่มีคราบตกค้าง สดชื่นชุ่มชื้น ไม่รู้สึกตึงเลย \n \n\n เนื่องจากไม่ได้ออกแบบมาเพื่อล้างเมคอัพเข้มข้นตั้งแต่แรก จึงล้างเมคอัพสีสันไม่ออกหมดจด ถ้าเพิ่มแรงทำความสะอาดให้มากขึ้น ก็คงจะไม่อ่อนโยนแบบนี้แล้ว เพราะมีระบุไว้ในรายละเอียดสินค้าอยู่แล้ว เลยไม่รู้สึกผิดหวังเรื่องแรงทำความสะอาด มีแรงทำความสะอาดเพียงพอสำหรับล้างครีมกันแดดและเมคอัพเบสบางๆ ไม่แสบตาหรือแสบผิวเลย \n \n\n มีส่วนผสมที่ดีต่อผิวแพ้ง่ายมากมาย ทั้งแพนธีนอลที่ช่วยฟื้นฟู ปลอบประโลม ให้ความชุ่มชื้น และปกป้องเกราะผิว รวมถึงเซนเทลล่า กวยอาซูเลน และอัลลันโทอิน รู้สึกว่ามีปริมาณแพนธีนอลสูงที่สุดในบรรดาผลิตภัณฑ์คลีนซิ่งที่เคยใช้มา เหมาะมากสำหรับตอนที่ผิวแพ้ง่ายจนใช้อะไรก็แสบเจ็บไปหมด แนะนำเลยค่ะ!!"},images:[],video:null},
    {id:"qW4jQxoA",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지, 스트레스성 트러블+속건조 - 오래 롤링해도 안 뒤집어짐",en:"Combination (oily-dehydrated), stress-induced breakouts + inner dehydration - no flare-up even with long rolling","zh-CN":"水油皮，压力型痘痘+内干 - 长时间打圈按摩也不会爆痘","zh-TW":"外油內乾，壓力型痘痘+內在乾燥 - 長時間打圈也不會爆發",ja:"インナードライ肌、ストレス性トラブル+インナードライ - 長時間ローリングしても荒れない",th:"ผิวมันขาดน้ำ สิวจากความเครียด+ผิวขาดน้ำ - นวดคลึงนานแค่ไหนก็ไม่เห่อ"},date:"2026-06-05",
      quote:{ko:"여드름+민감성 피부인데 자극이 없어서 좋았어요!\n 요즘 스트레스 심해서인지 조금만 자극적이어도 피부가 뒤집어지고 난리나는데 오래 오래 꼼꼼히 롤링해도 괜찮았어요ㅎㅎ\n \n\n 피부 컨디션이 급격하게 안 좋아진 이후 부터 속건조, 기름, 트러블로 고생했는데 사용 후에도 얼굴에 당김없이 촉촉해요! \n 순히기도 하고 건조함없이 마무리되서 세정력에 큰 기대는 안 했는데 워터프루프 아니면 거의 다 지워져요!!\n \n\n 너무 무겁거나 답답하지않은 로션 제형이어서 저처럼 속건성 수부지이신 분들이나, 건성분들이 쓰기 좋을 것 같아요:)\n \n\n 드라마틱하게 체감되지는 않지만 피부장벽 지켜주는 판테놀 성분이 있어서 세안단계부터 피부를 세심하게 신경쓰는 기분이 들어요ㅎㅎ",en:"I have acne-prone, sensitive skin, and I loved that there was no irritation!\n Maybe it's because I've been so stressed lately, but my skin flips out over the smallest irritation these days — yet even rolling it in thoroughly for a long time was totally fine haha\n \n\n Ever since my skin condition suddenly got worse, I've been struggling with inner dryness, oiliness, and breakouts, but after using this my face stays moist with no tightness! \n It's gentle and finishes without dryness, so I wasn't expecting much from the cleansing power, but unless it's waterproof, it pretty much all comes off!!\n \n\n It's a lotion texture that's not too heavy or stuffy, so I think it'd work well for people like me with dehydrated combination (oily-dehydrated) skin, or for dry skin types too :)\n \n\n It's not a dramatic difference I can feel instantly, but knowing it has panthenol to protect the skin barrier makes me feel like I'm taking good care of my skin right from the cleansing step haha","zh-CN":"痘痘肌+敏感肌，用起来没有刺激感这点很好！\n 最近可能是压力太大，稍微有点刺激皮肤就会爆炸，但即使长时间仔细打圈按摩也没事哈哈\n \n\n 皮肤状态急剧变差之后一直被内干、出油、痘痘困扰，用完之后脸上也不紧绷，很水润！\n 因为很温和、洗完也不干燥，本来对清洁力没抱太大期待，结果除了防水彩妆几乎都能卸掉！！\n \n\n 不会太厚重也不会闷，是乳液质地，感觉像我这样内干型水油皮，或者干性皮肤的人用起来会很合适:)\n \n\n 虽然没有戏剧性的效果，但因为含有守护皮肤屏障的泛醇成分，从洁面这一步开始就有种在细心呵护皮肤的感觉哈哈","zh-TW":"有痘痘又敏感的肌膚，因為完全不刺激所以很喜歡！\n 最近可能壓力太大，稍微刺激一點皮膚就會大爆發，但長時間仔細打圈也完全沒問題ㅎㅎ\n\n\n 自從皮膚狀況急遽變差之後，一直被內在乾燥、出油、痘痘困擾，用了之後臉也不會緊繃，很水潤！\n 質地溫和又不會乾燥收尾，本來對潔淨力沒抱太大期待，結果除了防水產品幾乎都能卸乾淨！！\n\n\n 不會太厚重或悶，是乳液質地，我覺得像我這種內在乾燥的外油內乾，還有乾性肌的人應該都很適合用:)\n\n\n 雖然沒有戲劇性的體感變化，但因為有守護皮膚屏障的泛醇成分，從卸妝這一步就開始感覺很細心地照顧皮膚ㅎㅎ",ja:"ニキビ+敏感肌なのに刺激がなくて良かったです！\n 最近ストレスがひどいせいか、少し刺激があるだけで肌が荒れて大変なことになるのですが、長時間丁寧にローリングしても大丈夫でした(笑)\n \n\n 肌コンディションが急激に悪くなってからインナードライ、テカリ、トラブルに悩まされていましたが、使用後も顔がつっぱらずしっとりしています！\n マイルドで乾燥せず仕上がるので洗浄力にはあまり期待していませんでしたが、ウォータープルーフでなければほとんど落ちます！！\n \n\n 重すぎたり息苦しくなったりしないローション状のテクスチャーなので、私のようなインナードライ肌の方や乾燥肌の方が使うのに良さそうです:)\n \n\n 劇的な変化は感じませんが、肌バリアを守ってくれるパンテノール成分が入っているので、洗顔の段階から肌を丁寧にケアしている気分になります(笑)",th:"เป็นผิวเป็นสิว+แพ้ง่าย แต่ใช้แล้วไม่ระคายเคืองเลยชอบมากค่ะ!\n ช่วงนี้เครียดมากเลยผิวเห่อง่ายมาก แค่โดนอะไรนิดหน่อยก็เห่อทั้งหน้า แต่นวดคลึงนานแค่ไหนก็ยังโอเคอยู่ฮะ\n \n\n ตั้งแต่สภาพผิวแย่ลงอย่างฉับพลัน ก็ทรมานกับผิวขาดน้ำ มัน และสิวมาตลอด แต่หลังใช้แล้วหน้าชุ่มชื้นไม่ตึงเลย! \n เพราะอ่อนโยนและไม่ทำให้แห้งเลยไม่ได้คาดหวังเรื่องแรงทำความสะอาดมาก แต่ถ้าไม่ใช่วอเตอร์พรูฟก็ล้างออกเกือบหมดเลย!!\n \n\n เป็นเนื้อโลชั่นที่ไม่หนักหรืออึดอัดเกินไป เลยน่าจะเหมาะกับคนผิวมันขาดน้ำแบบฉัน หรือคนผิวแห้งด้วยค่ะ:)\n \n\n แม้จะไม่รู้สึกเปลี่ยนแปลงชัดเจนแบบทันตาเห็น แต่มีแพนธีนอลที่ช่วยปกป้องเกราะผิว เลยรู้สึกเหมือนได้ดูแลผิวอย่างใส่ใจตั้งแต่ขั้นตอนล้างหน้าเลยค่ะฮะ"},images:[],video:null},
    {id:"A6gny7eJ",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合肌","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"복합성, 피부과 시술·수영 후 - 장벽 약해진 날에도 따끔거림 없음, 제모 당일 사용 가능",en:"Combination, after dermatology procedures/swimming - no stinging even with a weakened barrier, safe to use same-day as hair removal","zh-CN":"混合肌，皮肤科治疗·游泳后 - 屏障变弱的日子也不刺痛，脱毛当天也能用","zh-TW":"混合性肌膚，皮膚科療程‧游泳後 - 屏障變弱的日子也不刺痛，除毛當天也能用",ja:"混合肌、皮膚科施術・水泳後 - バリアが弱った日でもピリピリしない、脱毛当日も使用可能",th:"ผิวผสม หลังทำหัตถการผิวหนัง·ว่ายน้ำ - ไม่แสบแม้วันที่เกราะผิวอ่อนแอ ใช้ได้แม้วันกำจัดขน"},date:"2026-06-11",
      quote:{ko:"원래 튼튼피부라 아무거나 막 써도 평소엔 문제 없는데, 피부과 시술이나 수영 후엔 일시적으로 장벽이 약해져 평소 자극없던 제품도 따끔거리더라고요. 그런 날에도 이 클렌징밀크는 따끔거림·속당김이 전혀 없어요. \n2펌핑 덜어 1분 롤링했더니, 평소 가끔 여드름 나던 부위에서 피지가 빠져나오는 게 신기해서 세안 중에 사진까지 찍어뒀어요... \n 모공피지케어도 되면서 클렌징 후에 보습막이 남아 촉촉하게 마무리 되어서 좋았어요\n평소에 메이크업 거의 안하고 선크림만 바르는 편이라 저녁 1차세안으로 매일 사용하려고요\n며칠전에 젠틀맥스 프로 제모 받은 당일에도 안 따가웠을 만큼 순하고요. 민감성 아니어도 데일리로 쟁여둘 만한 제품이에요👍\n\n사용팁\n-세안전 손 씻은 후 '마른 손'에 2~3번 펌핑 \n-1분정도 롤링(코 턱 헤어라인 여드름 잘 생기는 부위는 더 신경 써서 꼼꼼하게)\n-유화 전에 한번 더 손 씻기!!",en:"My skin is normally pretty sturdy so I can use just about anything without issues, but after dermatology procedures or swimming my barrier temporarily weakens and even products that never bother me start to sting. Even on those days, this cleansing milk has zero stinging or tightness. \nI pumped out 2 pumps and rolled it in for 1 minute, and it was fascinating to see sebum coming out of spots where I sometimes get pimples — I even took a photo mid-cleanse... \n It handles pore/sebum care while also leaving a moisturizing film after cleansing that finishes moist, which I liked\nI barely wear makeup normally and mostly just wear sunscreen, so I plan to use this daily as my evening first cleanse\nIt didn't even sting the day I got a Gentlemax Pro hair removal treatment a few days ago. It's gentle enough for that. Even if you're not sensitive, it's a great product to keep stocked as a daily staple👍\n\nUsage tips\n- After washing hands before cleansing, pump 2-3 times onto 'dry hands' \n- Roll it in for about 1 minute (spend extra time carefully on the nose, chin, hairline — the acne-prone spots)\n- Wash your hands once more before emulsifying!!","zh-CN":"本来是皮肤比较强健的类型，平时随便用什么都没问题，但做完皮肤科治疗或游泳之后屏障会暂时变弱，连平时不刺激的产品都会有点刺痛。就算是这种日子，这款洁面乳也完全没有刺痛感、洗后也不紧绷。\n用了两泵打圈按摩了1分钟，平时偶尔长痘的部位有皮脂被推出来，觉得很神奇，洗脸过程中还拍了照片……\n 能做到毛孔皮脂护理，洁面后又留有保湿膜，收尾水润，很喜欢\n平时几乎不化妆只涂防晒，打算晚上当一次洁面每天用\n前几天做完极致清光脱毛当天用也不会刺痛，就是这么温和。就算不是敏感肌也值得日常囤货👍\n\n使用小贴士\n-洗脸前先洗手，然后在'干燥的手上'按压2~3下\n-打圈按摩约1分钟（鼻子、下巴、发际线等容易长痘的部位要更仔细）\n-乳化前再洗一次手！！","zh-TW":"本來是很強韌的膚質，隨便用什麼平常都沒問題，但做完皮膚科療程或游泳後，屏障會暫時變弱，連平常不刺激的產品都會有點刺痛。就算是這種日子，這款卸妝乳也完全不會刺痛、不會有內在緊繃感。\n用了兩壓打圈一分鐘，發現平常偶爾長痘痘的部位皮脂被推出來，覺得很神奇，甚至在洗臉時拍了照片……\n也能照顧毛孔皮脂，卸完之後會留下保濕膜，收尾水潤，很喜歡\n我平常幾乎不化妝、只擦防曬乳，打算晚上當作一次卸妝每天使用\n前幾天做完Gentlemax Pro除毛的當天用了都不刺痛，就是這麼溫和。就算不是敏感肌，也很值得囤來當日常用品👍\n\n使用小技巧\n-洗臉前先洗手，用「乾燥的手」按壓2~3次\n-打圈約1分鐘（鼻子、下巴、髮際線等容易長痘的部位要更仔細）\n-乳化前再洗一次手！！",ja:"もともと肌が丈夫なので普段は何を使っても問題ないのですが、皮膚科の施術やプール後は一時的にバリアが弱くなって、普段は刺激のない製品でもピリピリすることがあります。そんな日でもこのクレンジングミルクはピリピリ感やつっぱりが全くありません。\n2プッシュ分をとって1分ローリングしたら、普段たまにニキビができる部位から皮脂が出てくるのが不思議で、洗顔中に写真まで撮ってしまいました…\n 毛穴の皮脂ケアもできつつ、クレンジング後も保湿膜が残ってしっとり仕上がるのが良かったです\n普段はメイクをほとんどせず日焼け止めだけ塗るタイプなので、夜の1回目の洗顔として毎日使おうと思います\n数日前にジェントルマックスプロで脱毛した当日でも染みなかったくらい低刺激です。敏感肌でなくてもデイリーで常備しておきたい製品です👍\n\n使用のコツ\n-洗顔前に手を洗ってから「乾いた手」に2~3プッシュ\n-1分程度ローリング(鼻・あご・生え際などニキビができやすい部位はより丁寧に)\n-乳化の前にもう一度手を洗う！！",th:"ปกติเป็นผิวที่แข็งแรง ใช้อะไรก็ไม่ค่อยมีปัญหา แต่หลังทำหัตถการที่คลินิกผิวหนังหรือว่ายน้ำ เกราะผิวจะอ่อนแอลงชั่วคราว จนแม้แต่ผลิตภัณฑ์ที่ปกติไม่ระคายเคืองก็ยังรู้สึกแสบซ่า แต่คลีนซิ่งมิลค์ตัวนี้ไม่มีอาการแสบซ่าหรือตึงเลยแม้ในวันแบบนั้น \nกดปั๊ม 2 ครั้งแล้วนวดคลึง 1 นาที รู้สึกทึ่งที่เห็นไขมันส่วนเกินหลุดออกมาจากจุดที่ปกติเป็นสิวบ่อยๆ จนต้องถ่ายรูปไว้ระหว่างล้างหน้าเลย... \n ดูแลไขมันในรูขุมขนได้ดี แล้วหลังล้างหน้าก็ยังมีฟิล์มความชุ่มชื้นเหลืออยู่ ทำให้จบด้วยความชุ่มชื้น ชอบมาก\nปกติแทบไม่แต่งหน้า ทาแค่ครีมกันแดด เลยตั้งใจจะใช้เป็นการล้างหน้าครั้งแรกตอนเย็นทุกวัน\nอ่อนโยนขนาดที่ว่าวันที่เพิ่งทำเลเซอร์กำจัดขน Gentlemax Pro มาก็ยังไม่แสบเลย แม้ไม่ใช่ผิวแพ้ง่ายก็น่าจะซื้อตุนไว้ใช้ประจำวันได้👍\n\nทิปการใช้\n-ล้างมือก่อนล้างหน้า แล้วกดปั๊ม 2-3 ครั้งลงบน 'มือแห้ง' \n-นวดคลึงประมาณ 1 นาที (บริเวณจมูก คาง แนวไรผมที่เป็นสิวง่ายให้นวดคลึงอย่างใส่ใจเป็นพิเศษ)\n-ล้างมืออีกครั้งก่อนขั้นตอนอิมัลชัน!!"},images:["thumbnail/reviews/milk/A6gny7eJ_1.jpg"],video:null},
    {id:"AGE3jOnZ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"수부지(지성경계)+여드름 민감성, 클렌징오일서 밀크로 정착한 사연",en:"Combination (oily-dehydrated on the oilier side) + acne-prone sensitive skin, the story of switching from cleansing oil to milk","zh-CN":"水油皮（偏油性边缘）+痘痘敏感肌，从卸妆油换成洁面乳的心路历程","zh-TW":"外油內乾（偏油性）+痘痘敏感肌，從卸妝油轉換成卸妝乳的心路歷程",ja:"インナードライ肌(脂性寄り)+ニキビ敏感肌、クレンジングオイルからミルクに落ち着いたエピソード",th:"ผิวมันขาดน้ำ (ค่อนไปทางมัน) + ผิวเป็นสิวแพ้ง่าย เรื่องราวการเปลี่ยนจากคลีนซิ่งออยล์มาเป็นมิลค์"},date:"2026-06-05",
      quote:{ko:"💧블루 판테놀 클렌징 밀크 후기💧\n \n\n *지성에 가까운 수부지 타입\n 여드름 민감성 피부라 주 세안을 클렌징 밀크로합니다! 원래 클렌징 오일만쓰다가 속건조에 피부장벽이 너무 빠르게 무너져서 밀크로 정착했어요 ㅜㅜ \n 현재는 주 3~4회 클렌징밀크 / 주 1~2회 클렌징오일 이렇게 씁니다\n \n\n 💧여러 브랜드를 써봤지만 특히나 블루 클렌징 밀크는 예민한 민감성피부에 적합한 것 같아요 !! \n 제형감은 무르기보단 단단하고 도톰한 느낌입니다 대부분 클렌징밀크는 묽어서 줄줄 흐르는데, 약간 도톰해서 얹기 편해요 ! 향은 무향이나 다름없고, 세안 후 속당김 전혀 없습니다\n \n\n 💧세정력에 타 클렌징밀크에 비해 약한 편이긴하나 대부분 클렌징밀크가 세정력이 강한 편은 아니어서 크게 신경쓰이진 않았어요! 참고로 클렌징밀크는 클렌징오일처럼 단순 유화보다는 유화 후 ⭐️\"해면\"⭐️을 이용해서 닦아내는걸 추천드려요 !! 👍이러면 세정력과 보습력이 같이 올라갑니당\n \n\n 💧선크림이나 단순 데일리 메이크업으로 추천드리고, 강한 워터푸르프는 지워내기 어려워요 ㅜ 😭클렌징밀크는 감안하고 써야합니당 \n \n\n 💧다른 브랜드의 클렌징밀크를 많이 써봤는데, 특별한 점을 느끼진 못 했어요..! 좀 더 순하다 정도..? 그래도 전 무난함을 가장 중요하다고 생각하는 사람이기때문에.... 추천드립니다! 🤭 쓰면서 트러블 올라오는것도 없었고, 곧 여름이라 메이크업보단 선크림을 자주 쓰다보니 활용도가 높을 거 같아요 🫶",en:"💧Blue Panthenol Cleansing Milk review💧\n \n\n *Combination (oily-dehydrated), leaning oily\n Acne-prone sensitive skin, so I use cleansing milk as my main cleanser! I used to use only cleansing oil, but my skin barrier started breaking down way too fast from inner dryness, so I switched to milk ㅜㅜ \n Currently I use cleansing milk 3-4 times a week / cleansing oil 1-2 times a week\n \n\n 💧I've tried several brands, but the Blue Cleansing Milk in particular seems especially well suited for sensitive, easily-irritated skin!! \n The texture is more firm and thick rather than runny — most cleansing milks are watery and drip everywhere, but this one is a bit thick so it's easy to apply! It's basically scentless, and there's zero tightness after cleansing\n \n\n 💧The cleansing power is a bit weaker than other cleansing milks, but most cleansing milks aren't that strong to begin with, so it didn't bother me much! FYI, for cleansing milk, rather than just emulsifying like a cleansing oil, I recommend wiping it off with a ⭐️\"konjac/sea sponge\"⭐️ after emulsifying!! 👍this boosts both cleansing power and moisture retention\n \n\n 💧I'd recommend it for sunscreen or simple daily makeup — strong waterproof makeup is hard to remove ㅜ😭you have to accept that limitation with cleansing milk \n \n\n 💧I've used a lot of other brands' cleansing milks and didn't really notice anything special about them..! Maybe just a bit gentler..? But since I think being reliably gentle is the most important thing, I do recommend this one! 🤭 No breakouts while using it, and since it's almost summer and I'll be using sunscreen more than makeup, I think this will get a lot of use 🫶","zh-CN":"💧蓝色泛醇洁面乳使用心得💧\n \n\n *偏油性的水油皮\n 痘痘敏感肌，所以主要用洁面乳来做主要清洁！本来只用卸妆油，但因为内干、皮肤屏障崩得太快，才换成了洁面乳呜呜 \n 现在是每周3~4次用洁面乳 / 每周1~2次用卸妆油这样搭配使用\n \n\n 💧用过很多品牌，但特别是这款蓝色洁面乳好像很适合敏感肌 !! \n 质地不算稀，是偏紧实厚实的感觉。大部分洁面乳都很稀会流得到处都是，但这款稍微厚一点比较好抹开！香味几乎等于无香，洗后完全不紧绷\n \n\n 💧清洁力比其他洁面乳偏弱一点，不过大部分洁面乳清洁力本来就不算强，所以没太在意！顺便说，洁面乳建议不要像卸妆油那样单纯乳化，而是乳化后再用⭐️海绵⭐️擦掉 !! 👍这样清洁力和保湿力都会一起提升\n \n\n 💧适合防晒或日常淡妆，强力防水妆容比较难卸掉ㅠ😭用洁面乳的话要有这个心理准备 \n \n\n 💧其他品牌的洁面乳也用过不少，没觉得这款有什么特别突出的地方……！大概就是更温和一点？不过我是那种觉得'稳定不出错'最重要的人……所以还是推荐！🤭 用的时候也没长痘，马上就要夏天了，比起彩妆更常用防晒，感觉使用率会很高🫶","zh-TW":"💧藍色泛醇卸妝乳心得💧\n\n\n *偏油性的外油內乾類型\n 因為是痘痘敏感肌，主要都用卸妝乳洗臉！本來只用卸妝油，但因為內在乾燥導致皮膚屏障崩壞得太快，才改用卸妝乳定番ㅜㅜ\n 目前是一週3~4次卸妝乳／一週1~2次卸妝油這樣使用\n\n\n 💧用過很多品牌，但特別是這款藍色卸妝乳好像很適合敏感的敏感肌 !!\n 質地不是稀的，而是偏紮實、厚一點的感覺，大部分卸妝乳都比較稀、容易流下來，但這款有點厚，放在臉上很方便！幾乎無味，洗完臉完全不會內在緊繃\n\n\n 💧潔淨力比其他卸妝乳偏弱一點，但大部分卸妝乳潔淨力本來就不算強，所以沒有太在意！順帶一提，卸妝乳建議乳化後用⭐️「海綿」⭐️擦掉，而不是像卸妝油那樣單純乳化就好 !! 👍這樣潔淨力和保濕力都會一起提升\n\n\n 💧推薦用來卸防曬乳或簡單的日常妝，強力防水產品比較難卸乾淨 ㅜ 😭用卸妝乳要有這樣的心理準備\n\n\n 💧用過很多其他品牌的卸妝乳，沒感覺到有什麼特別之處……！大概就是稍微溫和一點的程度……？不過我是個覺得「無害好用」最重要的人……所以還是推薦！🤭 使用期間完全沒長痘痘，而且快到夏天了，比起化妝更常擦防曬乳，感覺實用度會很高 🫶",ja:"💧ブルーパンテノールクレンジングミルクレビュー💧\n \n\n *脂性寄りのインナードライタイプ\n ニキビ敏感肌なのでメインの洗顔はクレンジングミルクを使っています！もともとクレンジングオイルだけを使っていましたが、インナードライで肌バリアがあまりに早く崩れてしまってミルクに落ち着きました(涙)\n 現在は週3~4回クレンジングミルク/週1~2回クレンジングオイルという感じで使っています\n \n\n 💧いろいろなブランドを試してきましたが、特にブルークレンジングミルクは敏感な肌に合っていると思います！！\n テクスチャーはゆるいというよりしっかりめでとろみがある感じです。ほとんどのクレンジングミルクはさらさらで垂れてしまいますが、少しとろみがあるので手に取りやすいです！香りはほぼ無香で、洗顔後のつっぱりは全くありません\n \n\n 💧洗浄力は他のクレンジングミルクに比べるとやや弱めですが、ほとんどのクレンジングミルクはそもそも洗浄力が強いタイプではないので、そこまで気になりませんでした！ちなみにクレンジングミルクはクレンジングオイルのように単純に乳化するだけでなく、乳化後に⭐️「スポンジ」⭐️を使って拭き取るのがおすすめです！！👍こうすると洗浄力と保湿力が同時にアップします\n \n\n 💧日焼け止めやシンプルなデイリーメイクにおすすめで、しっかりめのウォータープルーフは落としにくいです(涙)😭クレンジングミルクはそこを踏まえて使う必要があります \n \n\n 💧他のブランドのクレンジングミルクもたくさん使ってきましたが、特別な違いは感じませんでした…！もう少しマイルドかな…?という程度です。それでも私は無難さを一番大事にするタイプなので…おすすめします！🤭使っている間トラブルも出ませんでしたし、もうすぐ夏でメイクより日焼け止めをよく使うので活用度も高そうです🫶",th:"💧รีวิวบลูแพนธีนอลคลีนซิ่งมิลค์💧\n \n\n *ผิวมันขาดน้ำที่ค่อนไปทางมัน\n เป็นผิวเป็นสิวแพ้ง่าย เลยใช้คลีนซิ่งมิลค์เป็นการล้างหน้าหลักค่ะ! เดิมทีใช้แต่คลีนซิ่งออยล์ แต่เกราะผิวพังเร็วมากจากผิวขาดน้ำ เลยเปลี่ยนมาใช้มิลค์แทน ㅜㅜ \n ตอนนี้ใช้คลีนซิ่งมิลค์ 3-4 ครั้ง/สัปดาห์ และคลีนซิ่งออยล์ 1-2 ครั้ง/สัปดาห์\n \n\n 💧เคยใช้หลายแบรนด์มาแล้ว แต่บลูคลีนซิ่งมิลค์นี้เหมาะกับผิวแพ้ง่ายเป็นพิเศษ !! \n เนื้อสัมผัสไม่เหลวแต่ค่อนข้างแน่นและหนึบหน่อยๆ ปกติคลีนซิ่งมิลค์ส่วนใหญ่จะเหลวจนไหลย้อย แต่ตัวนี้หนึบนิดหน่อยเลยตักใช้ง่าย! กลิ่นแทบไม่มีเลย และไม่ตึงหลังล้างหน้าเลยสักนิด\n \n\n 💧แรงทำความสะอาดค่อนข้างเบากว่าคลีนซิ่งมิลค์เจ้าอื่นนิดหน่อย แต่ปกติคลีนซิ่งมิลค์ก็ไม่ค่อยมีแรงทำความสะอาดแรงอยู่แล้วเลยไม่ค่อยกังวลค่ะ! เกร็ดเล็กน้อยคือคลีนซิ่งมิลค์แนะนำให้ใช้ ⭐️\"ฟองน้ำ\"⭐️ เช็ดออกหลังทำอิมัลชัน แทนที่จะแค่ทำอิมัลชันเฉยๆ แบบคลีนซิ่งออยล์นะคะ !! 👍แบบนี้จะได้ทั้งแรงทำความสะอาดและความชุ่มชื้นเพิ่มขึ้นด้วย\n \n\n 💧แนะนำสำหรับล้างครีมกันแดดหรือเมคอัพประจำวันธรรมดา ส่วนวอเตอร์พรูฟเข้มๆ ล้างออกยากค่ะ ㅜ 😭ต้องเข้าใจข้อจำกัดนี้ก่อนใช้คลีนซิ่งมิลค์นะคะ \n \n\n 💧เคยใช้คลีนซิ่งมิลค์แบรนด์อื่นมาเยอะมาก แต่ไม่รู้สึกว่ามีอะไรพิเศษนัก..! แค่รู้สึกว่าอ่อนโยนกว่านิดหน่อย..? แต่เพราะฉันเป็นคนที่คิดว่าความไม่มีปัญหาสำคัญที่สุด.... เลยแนะนำค่ะ! 🤭 ใช้แล้วไม่มีสิวขึ้นเลย แล้วใกล้จะหน้าร้อนแล้ว ทาครีมกันแดดบ่อยกว่าแต่งหน้า เลยน่าจะเอาไปใช้ได้เยอะเลยค่ะ 🫶"},images:[],video:null},
    {id:"Z04wvg4Z",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"만성 피부염+매일 모낭염 나는 피부 - 교체 후 모낭염 개수 감소",en:"Chronic dermatitis + skin that gets folliculitis daily - fewer folliculitis bumps after switching","zh-CN":"慢性皮炎+每天冒毛囊炎的皮肤 - 换用后毛囊炎数量减少","zh-TW":"慢性皮膚炎+每天長毛囊炎的肌膚 - 換用後毛囊炎數量減少",ja:"慢性皮膚炎+毎日毛嚢炎が出る肌 - 切り替え後、毛嚢炎の数が減少",th:"ผิวอักเสบเรื้อรัง+รูขุมขนอักเสบขึ้นทุกวัน - เปลี่ยนมาใช้แล้วจำนวนรูขุมขนอักเสบลดลง"},date:"2026-06-05",
      quote:{ko:"📍텍스처\n 보통 클밀들은 제형이 묽어서 롤링중에 다 날아가거나 롤링할 때 불편한데 제형이 도톰해서 너무 좋아요. 제형이 쿠션감 있다고 해야하나? 도톰해서 피부에 자극도 없고 유화도 부드럽게 잘 돼서 세정력도 좋았어요. 그리고 촉촉묵직해서 세안하고 당김도 덜합니다.\n \n\n \n\n 📍클렌징\n  혼합자차 선크림 바르고 클밀로 1차만 지웠을 때는 잘 지워졌어요. 선크림+비비 발랐을 때는 1차만 하니까 잔여물이 남아서 2차 세안 따로 했습니다.\n \n\n \n\n 📍피부반응\n  우선 저는 티존+ 나비존은 심한 지성이고 나머지는 속건조 심한 건성인데 예전에 화장품 잘못 쓰면서 만성 피부염+ 예민성으로 바뀐 피부입니다. 매일 매일 날치알 모낭염이 오도도 나는데 이 클밀로 바꾸고 나서 모낭염 나는 갯수도 많이 줄고 진짜 도움 많이 받았어요. \n  우선 성분만 봐도 장벽에 좋은 원료들로 구성되어 있습니다. 판테놀, 구아이아줄렌, 히알루론산, 세라마이드, 호호바오일, 엑토인, 스쿠알란등 좋은 원료들이 다수 포함되어 있어요.\n  민감성 피부를 가진 사람들도 안심하고 사용할 수 있도록 설계된 브랜드 철학이 제품 사용감에서도 느껴졌습니다. 다른 화장품들도 궁금하네요. 재구매의사 완전 있습니다.\n \n\n \n\n 📍장점\n -눈에 띄는 피부 개선\n -민감성 피부 구원템\n -좋은 성분들로 구성되어 있음",en:"📍Texture\n Most cleansing milks are so runny that they fly off while rolling, which is annoying, but this one has a thicker texture, so I really love it. It's got a bit of a cushiony feel, I guess? Being thicker means no irritation on the skin and it emulsifies smoothly, so the cleansing power was good too. And it's moist and substantial, so there's less tightness after cleansing.\n \n\n \n\n 📍Cleansing\n When I wore a mixed-type sunscreen and only did a first cleanse with this, it came off well. When I wore sunscreen + BB cream, doing just the first cleanse left some residue, so I did a separate second cleanse.\n \n\n \n\n 📍Skin reaction\n My T-zone + butterfly zone is quite oily and the rest is severely dry, and I used to have skin that turned chronically dermatitis-prone and sensitive after using the wrong products in the past. I get little folliculitis bumps popping up constantly every day, but after switching to this cleansing milk, the number of folliculitis bumps dropped a lot — it really helped. \n Just looking at the ingredients, it's made up of ingredients that are great for the barrier. It contains a lot of good ingredients like panthenol, guaiazulene, hyaluronic acid, ceramide, jojoba oil, ectoin, squalane, etc.\n I could feel the brand philosophy of being designed so people with sensitive skin can use it worry-free, even just from the feel of using the product. Now I'm curious about their other products too. I'd definitely repurchase.\n \n\n \n\n 📍Pros\n -Noticeable skin improvement\n -A savior for sensitive skin\n -Made with great ingredients","zh-CN":"📍质地\n 一般洁面乳质地都偏稀，打圈时容易滑掉或不好操作，但这款质地厚实，非常喜欢。质地有点像慕斯感？厚实所以对皮肤没有刺激，乳化也很顺滑，清洁力也不错。而且水润厚重，洗完也不太紧绷。\n \n\n \n\n 📍清洁\n  涂了混合型自制防晒后用洁面乳做一次清洁，能洗得很干净。涂了防晒+BB霜的话只做一次清洁会有残留，所以另外做了二次清洁。\n \n\n \n\n 📍皮肤反应\n  首先我的T区+法令纹区域严重出油，其余部位是内干很严重的干性肌肤，之前因为乱用化妆品变成了慢性皮炎+敏感肌。以前每天都会冒出密密麻麻的毛囊炎，换用这款洁面乳之后毛囊炎数量减少了很多，真的帮了大忙。\n  首先光看成分就是对屏障好的原料组成。泛醇、蓝甘菊薁、透明质酸、神经酰胺、荷荷巴油、麦角硫因、角鲨烷等好成分都有不少。\n  能让敏感肌人群放心使用的品牌理念，从产品的使用感上也能感受到。也很好奇其他产品。完全有回购意愿。\n \n\n \n\n 📍优点\n -肉眼可见的皮肤改善\n -敏感肌救星\n -含有很多好成分","zh-TW":"📍質地\n 一般卸妝乳質地都偏稀，打圈時容易滑掉或不好操作，但這款質地厚一點，超喜歡。該說質地有種綿密感嗎？厚一點對皮膚沒有刺激，乳化也很順，潔淨力也不錯。而且濕潤又有厚度，洗完臉後也比較不緊繃。\n\n\n\n\n 📍清潔力\n  擦了混合式防曬乳，只用卸妝乳卸一次就卸得很乾淨。擦防曬乳+BB霜時，只卸一次會有殘留，所以另外做了二次清潔。\n\n\n\n\n 📍膚況反應\n  我T字加蝴蝶區是嚴重的油性，其餘部位是內在乾燥嚴重的乾性，以前保養品用錯之後皮膚變成慢性皮膚炎+敏感性肌膚。每天都會冒出一堆像魚卵一樣的毛囊炎，換成這款卸妝乳之後，毛囊炎的數量減少很多，真的幫了大忙。\n  光看成分就是對屏障好的原料組成。含有泛醇、癒創木薁、玻尿酸、神經醯胺、荷荷芭油、依克多因、角鯊烷等許多好成分。\n  能感受到品牌設計理念就是希望連敏感肌的人都能安心使用，也體現在產品的使用感上。很好奇這個牌子的其他產品，絕對有回購意願。\n\n\n\n\n 📍優點\n -肌膚改善明顯可見\n -敏感肌救星\n -由好成分組成",ja:"📍テクスチャー\n 普通のクレンジングミルクはゆるくてローリング中に飛び散ったり使いにくかったりしますが、この製品はとろみがあってすごく良いです。テクスチャーにクッション感があるというか？とろみがあるので肌への刺激もなく、乳化も優しくしっかりできて洗浄力も良かったです。しっとり密着感があって洗顔後のつっぱりも少なめです。\n \n\n \n\n 📍クレンジング\n  混合型の紫外線吸収剤入り日焼け止めを塗って、クレンジングミルクで1回だけ落としたときはきちんと落ちました。日焼け止め+BBクリームを塗ったときは1回だけだと残留物が残ったので、別途2回目の洗顔をしました。\n \n\n \n\n 📍肌の反応\n  まず私はTゾーン+小鼻まわりはかなりの脂性で、それ以外はインナードライがひどい乾燥肌なのですが、以前化粧品の使い方を間違えて慢性皮膚炎+敏感肌に変わってしまいました。毎日プツプツと毛嚢炎が出るのですが、このクレンジングミルクに変えてから毛嚢炎の数もかなり減って、本当に助けられました。 \n  まず成分だけ見てもバリアに良い原料で構成されています。パンテノール、グアイアズレン、ヒアルロン酸、セラミド、ホホバオイル、エクトイン、スクワランなど良い原料がたくさん含まれています。\n  敏感肌の人でも安心して使えるように設計されたブランドの哲学が、使用感からも感じられました。他の化粧品も気になります。リピート買い、完全にありです。\n \n\n \n\n 📍良かった点\n -目に見える肌の改善\n -敏感肌の救世主アイテム\n -良い成分で構成されている",th:"📍เนื้อสัมผัส\n ปกติคลีนซิ่งมิลค์ทั่วไปเนื้อจะเหลวจนกระเด็นหรือใช้ยากตอนนวดคลึง แต่ตัวนี้เนื้อแน่นหนึบเลยชอบมาก จะบอกว่าเนื้อนุ่มฟูก็ว่าได้ไหมนะ? เพราะหนึบเลยไม่ระคายเคืองผิว อิมัลชันก็นุ่มนวลดี แรงทำความสะอาดก็ดีด้วย แล้วก็ชุ่มชื้นหนึบแน่น ล้างหน้าแล้วตึงน้อยลง\n \n\n \n\n 📍การทำความสะอาด\n  ทาครีมกันแดดเคมีผสมแล้วล้างด้วยมิลค์แค่ครั้งเดียวก็ล้างออกดี แต่ถ้าทาครีมกันแดด+บีบีครีม ล้างครั้งเดียวจะมีคราบตกค้าง เลยต้องล้างซ้ำอีกครั้ง\n \n\n \n\n 📍ปฏิกิริยาผิว\n  ก่อนอื่นฉันเป็นผิวมันหนักบริเวณ T-zone และรอบจมูก-แก้ม ส่วนที่เหลือเป็นผิวแห้งขาดน้ำรุนแรง เคยใช้เครื่องสำอางผิดจนผิวกลายเป็นผิวอักเสบเรื้อรัง+แพ้ง่าย เป็นรูขุมขนอักเสบขึ้นทุกวันเลย แต่พอเปลี่ยนมาใช้มิลค์ตัวนี้ จำนวนรูขุมขนอักเสบลดลงเยอะมาก ช่วยได้เยอะจริงๆ \n  แค่ดูส่วนผสมก็รู้ว่าประกอบด้วยวัตถุดิบที่ดีต่อเกราะผิว ทั้งแพนธีนอล กวยอาซูเลน ไฮยาลูรอนิกแอซิด เซราไมด์ น้ำมันโฮโฮบา เอ็กทอยน์ สควาเลน มีวัตถุดิบดีๆ เยอะมาก\n  รู้สึกได้ถึงปรัชญาแบรนด์ที่ออกแบบมาให้แม้คนผิวแพ้ง่ายก็ใช้ได้อย่างอุ่นใจ จากความรู้สึกตอนใช้จริง อยากลองผลิตภัณฑ์อื่นๆ ของแบรนด์นี้ดูบ้าง มีความตั้งใจจะซื้อซ้ำแน่นอนค่ะ\n \n\n \n\n 📍ข้อดี\n -ผิวดีขึ้นอย่างเห็นได้ชัด\n -ไอเทมกู้ผิวสำหรับผิวแพ้ง่าย\n -ประกอบด้วยส่วนผสมดีๆ"},images:[],video:null},
    {id:"ZMmPExXZ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"수부지, 피부과 시술 후 각질·흉터 실리콘겔도 자극 없이 제거되는 세정력",en:"Combination (oily-dehydrated), after dermatology procedures - cleansing power strong enough to lift even silicone scar gel residue without irritation","zh-CN":"水油皮，皮肤科治疗后起皮·连疤痕硅胶也能无刺激清除的清洁力","zh-TW":"外油內乾，皮膚科療程後角質‧疤痕矽膠貼也能無刺激清除的潔淨力",ja:"インナードライ肌、皮膚科施術後の角質・傷跡用シリコンジェルも刺激なく落とせる洗浄力",th:"ผิวมันขาดน้ำ หลังทำหัตถการผิวหนัง ล้างขุยผิว·เจลซิลิโคนแผลเป็นออกได้โดยไม่ระคายเคือง"},date:"2026-06-15",
      quote:{ko:"클렌징 밀크'라는 이름에 딱 맞게 하얗고 촉촉하면서도 아주 약간의 점성이 느껴지는 부드러운 제형이에요. 피부에 올렸을 때 자극 없이 부드럽게 롤링돼서 참 좋더라고요. (다른 후기들 보니까 성분이 순해서 민감성 피부 분들도 정착템으로 많이 쓰신다는데, 왜 그런지 단번에 이해되는 제형이었어요!)\n \n\n 제일 놀란 건 세정력이었어요. 풀메이크업을 한 친구가 우리집 놀러와서 이걸로 지워봤는데 웬만한 화장이 정말 깔끔하게 잘 지워진다고 감탄하더라고요. 게다가 저는 평소에 선크림 바른 날 폼클렌징이나 클렌징 젤로 2차 세안을 하면 얼굴이 쩍쩍 갈라지듯 당겼거든요? 근데 이 제품은 세안 후에도 건조함이 확실하게 잡히고 촉촉함이 남아있어서 감동했습니다. 건성이나 수부지 피부인 분들께 진짜 강추하고 싶어요.\n \n\n 그리고 저만의 대박 발견이 있는데요! 평소에 세척해서 재사용해야 하는 흉터용 실리콘 겔을 쓰는데, 이게 핸드워시, 바디워시, 폼클렌징으로도 이물질이나 자국이 잘 안 지워져서 스트레스였거든요. 혹시나 하는 마음에 이 클렌징 밀크를 올려두고 살살 롤링해 봤는데 웬걸... 그 지독한 자국들이 잘 지워지더라고요! 피부 노폐물이나 피지도 이렇게 부드럽게 잘 녹여주겠구나 싶어서 제품력에 완전히 신뢰가 생겼습니다.\n 그저께 피부과 시술 받고 나서 자극이 있었는지 입 양옆에 각질이 일어났는데.. 뻑뻑하면서도 덜렁거리는 각질을 블루 진정 판테놀 클렌징 밀크로 2분정도 계속 롤링했더니 아프지 않고 깔끔하게 탈락된 것도 맘에 들었습니다. (첨부한 사진 참고)",en:"True to the name 'cleansing milk,' it's a soft texture that's white, moist, and has just a slight bit of viscosity. When I put it on my skin, it rolled on smoothly with no irritation — I really liked that. (I saw in other reviews that the ingredients are gentle enough that a lot of sensitive-skin people make this their go-to, and this texture instantly made it clear why!)\n \n\n What surprised me most was the cleansing power. A friend with a full face of makeup came over and tried it, and she was amazed at how cleanly it removed pretty much all of her makeup. Also, on days I wear sunscreen, if I do a second cleanse with foam cleanser or cleansing gel, my face usually feels like it's cracking with tightness — but with this product, dryness was clearly kept in check after cleansing and moisture remained, which honestly moved me. I really want to recommend this to people with dry or combination (oily-dehydrated) skin.\n \n\n And I made an amazing discovery of my own! I normally use a reusable silicone scar gel that needs to be washed, and hand soap, body wash, and foam cleanser never fully remove the residue or marks on it — it's been a source of stress. On a whim, I put this cleansing milk on it and gently rolled it around, and to my surprise... those stubborn marks came right off! It made me realize it must dissolve skin waste and sebum just as gently, and I gained complete trust in this product. \n The day before yesterday I had a dermatology procedure and some flaking showed up at the corners of my mouth from the irritation.. I rolled the Blue Soothing Panthenol Cleansing Milk over the stiff, lifting flakes for about 2 minutes, and they came off cleanly without any pain, which I also loved. (see attached photo)","zh-CN":"正如'洁面乳'这个名字，是又白又水润、带一点点粘度的柔软质地。涂在脸上时能无刺激地顺滑打圈，真的很喜欢。（看其他测评说成分温和，很多敏感肌都拿它当长期回购款，用了之后立刻理解为什么了！）\n \n\n 最让我惊讶的是清洁力。化了全妆的朋友来我家玩，用这个卸妆，她惊叹说几乎所有妆都能干净卸掉。而且我平时涂防晒的日子如果用洁面泡沫或洁面凝胶做二次清洁，脸会紧绷得像要裂开一样？但这款产品洗完后干燥感明显被压住，还留有水润感，让我很感动。真心想推荐给干皮或水油皮的人。\n \n\n 还有一个我自己的重大发现！我平时要清洗重复使用的疤痕硅胶贴，用洗手液、沐浴露、洁面泡沫都很难把污渍或痕迹洗掉，一直很头疼。抱着试试看的心态把这款洁面乳涂上去轻轻打圈，结果……那些顽固的痕迹居然被洗掉了！这让我更加确信它对皮肤废物、皮脂也能这样温和地溶解清洁，对这款产品彻底建立了信任。\n 前天做完皮肤科治疗后可能是有点刺激，嘴角两侧起皮了……用蓝色舒缓泛醇洁面乳持续打圈按摩约2分钟，那些又干又翘的角质不痛地干净脱落了，这点也很满意。（可参考附图）","zh-TW":"真的很符合「卸妝乳」這個名字，是白色、濕潤又帶一點點黏性的柔軟質地。放在皮膚上打圈完全不刺激，很順滑。（看其他心得說成分溫和、很多敏感肌都當定番使用，用了之後馬上懂為什麼。）\n\n 最讓我驚訝的是潔淨力。畫全妝的朋友來我家玩，用這個卸妝，她驚嘆說幾乎所有妝都卸得很乾淨。而且我平常擦防曬乳的日子如果用洗面乳或潔顏凝露二次清潔，臉會像要裂開一樣緊繃，但這款產品洗完臉乾燥感明顯改善，還留有水潤感，讓我很感動。真心想大推給乾性或外油內乾的人。\n\n 而且我還有一個自己的大發現！我平常會用需要清洗重複使用的疤痕矽膠貼，這個平常用洗手乳、沐浴乳、洗面乳都很難洗掉異物或痕跡，一直讓我很有壓力。抱著姑且一試的心情把這款卸妝乳抹上去輕輕打圈，結果……那些頑固痕跡竟然洗掉了！讓我覺得皮膚的老廢物和皮脂應該也能被這樣溫柔地溶解掉，對這款產品的效果完全建立了信任感。\n 前天做完皮膚科療程後可能有點刺激，嘴角兩側浮起角質……用藍色舒緩泛醇卸妝乳持續打圈約2分鐘，角質不痛地乾淨脫落，這點也很滿意。（詳見附圖）",ja:"「クレンジングミルク」という名前にぴったりの、白くてしっとりしながらもほんの少しとろみを感じる柔らかいテクスチャーです。肌にのせたとき刺激なく優しくローリングできて本当に良かったです。(他のレビューを見ると成分がマイルドで敏感肌の方も定番アイテムとしてよく使っているそうですが、なぜかが一瞬で分かるテクスチャーでした！)\n \n\n 一番驚いたのは洗浄力です。フルメイクをした友達が家に遊びに来て、これでメイクを落としてみたところ、だいたいのメイクが本当にきれいに落ちると感心していました。しかも私は普段、日焼け止めを塗った日に洗顔フォームやクレンジングジェルで2回目の洗顔をすると、顔がパリパリするくらいつっぱっていたんです。でもこの製品は洗顔後も乾燥がしっかり抑えられていて、しっとり感が残っていて感動しました。乾燥肌やインナードライ肌の方に本当におすすめしたいです。\n \n\n そして私だけの大発見があります！普段、洗って繰り返し使う傷跡用のシリコンジェルを使っているのですが、これがハンドソープ、ボディソープ、洗顔フォームでも汚れや跡がなかなか落ちなくてストレスでした。もしかしてと思ってこのクレンジングミルクをのせて優しくローリングしてみたら…なんとあのしつこい跡がきれいに落ちました！肌の老廃物や皮脂もこんな風に優しく溶かしてくれるんだなと思って、製品への信頼が完全に生まれました。\n 一昨日皮膚科で施術を受けた後、刺激があったのか口の両脇に角質が浮いていたのですが…ゴワゴワして剥がれかけていた角質を、ブルー鎮静パンテノールクレンジングミルクで2分ほどローリングし続けたら、痛みなくきれいに取れたのも気に入りました。(添付写真参照)",th:"สมชื่อ 'คลีนซิ่งมิลค์' เลยค่ะ เนื้อสีขาว ชุ่มชื้น แต่มีความหนืดนิดๆ เนื้อนุ่มมาก พอลงบนผิวแล้วนวดคลึงได้อย่างนุ่มนวลไม่ระคายเคืองเลย ชอบมากจริงๆ (ดูรีวิวคนอื่นแล้วบอกว่าส่วนผสมอ่อนโยนจนคนผิวแพ้ง่ายหลายคนใช้เป็นไอเทมประจำตัว พอลองใช้เองก็เข้าใจในทันทีเลยว่าทำไม!)\n \n\n สิ่งที่ทึ่งที่สุดคือแรงทำความสะอาด เพื่อนที่แต่งหน้าจัดเต็มมาเที่ยวบ้านฉัน แล้วลองใช้ตัวนี้ล้างเมคอัพ เธอทึ่งมากที่เมคอัพเกือบทั้งหมดล้างออกหมดจดจริงๆ แถมปกติวันที่ทาครีมกันแดดแล้วล้างซ้ำด้วยโฟมหรือคลีนซิ่งเจล หน้าจะตึงจนแทบแตกเลย แต่ผลิตภัณฑ์นี้หลังล้างหน้าความแห้งหายไปชัดเจน ยังคงความชุ่มชื้นไว้ ประทับใจมากค่ะ อยากแนะนำจริงๆ สำหรับคนผิวแห้งหรือผิวมันขาดน้ำ\n \n\n แล้วยังมีการค้นพบสุดว้าวของตัวเองด้วย! ปกติฉันใช้เจลซิลิโคนสำหรับแผลเป็นที่ต้องล้างแล้วใช้ซ้ำ ซึ่งปกติล้างสิ่งสกปรกหรือคราบออกยากมากไม่ว่าจะใช้แฮนด์วอช บอดี้วอช หรือโฟมล้างหน้า เครียดมากเลย ลองใจเสี่ยงเอาคลีนซิ่งมิลค์นี้มาป้ายแล้วนวดคลึงเบาๆ ดู ปรากฏว่า... คราบฝังแน่นนั้นหลุดออกง่ายมาก! ทำให้เชื่อมั่นในประสิทธิภาพของผลิตภัณฑ์นี้เต็มที่เลยว่าน่าจะละลายสิ่งสกปรกหรือไขมันบนผิวได้นุ่มนวลแบบนี้เหมือนกัน\n เมื่อวานซืนไปทำหัตถการที่คลินิกผิวหนังมา อาจจะระคายเคืองนิดหน่อยจนมีขุยลอกที่ข้างปากทั้งสองข้าง.. พอเอาบลูซูทติ้งแพนธีนอลคลีนซิ่งมิลค์มานวดคลึงต่อเนื่องประมาณ 2 นาที ขุยที่แข็งกระด้างและหลวมๆ นั้นก็หลุดออกอย่างสะอาดโดยไม่เจ็บเลย ชอบมากค่ะ (ดูรูปที่แนบมาประกอบ)"},images:[],video:null},
    {id:"Zm2lQRDq",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지, 열감·홍조+장벽 완전히 무너진 상태 - 붉은기·뾰루지 가라앉음",en:"Combination (oily-dehydrated), flushing/redness + fully compromised barrier - redness and bumps calmed down","zh-CN":"水油皮，发热·泛红+屏障完全崩溃状态 - 红痘和泛红都有所缓解","zh-TW":"外油內乾，泛熱‧泛紅+屏障完全崩壞的狀態 - 紅腫、痘痘消退",ja:"インナードライ肌、ほてり・赤み+バリアが完全に崩れた状態 - 赤みとニキビが落ち着く",th:"ผิวมันขาดน้ำ ผิวร้อนวูบวาบ·ผื่นแดง+เกราะผิวพังทั้งหมด - รอยแดง·สิวยุบลง"},date:"2026-06-05",
      quote:{ko:"🥲수부지,예민/민감피부,열감/홍조,속건조 심한 피부. \n 갑자기 날씨가 변해서 피부가 더 민감해지고 피부장벽이 다 무너진 상태였어요.... 2차세안을 해줘야하는데 클렌징밀크가 가장 순하고 부드러워서 클렌징밀크를 찾다가 이 제품을 계속 사용해줬습니다 ! \n 피부장벽을 보호해주면서 세정력이 있다보니 1차세안으로 사용하기 좋았어요!!! 약산성인데 간단한 메이크업은 거의다 촉촉하게 지워집니다!! 에탄올이 안들어가서 피부자극이 없었고 제일 좋은건 눈시림이 없다는거!!! 😳👀 히알루론산과 아줄렌이 수분진정을 도와줘서 그런가 클밀 세안후에도 건조함이 없어서 속건조 심한 수부지에도 폼클까지 편안하게 세안을 마무리할수있었어요. 진짜 최근 초초초초민감해진 피부여서 붉은기랑 뾰루지가 심하게 올라왔는데 다행히 조금씩 가라앉고 있는 상태라 예민한 피부가 사용하기 정말 좋은거같아요 🥹 순하게 클렌징을 하고 싶은 분들은 노마디아 클렌징밀크를 사용해보세요!! 클렌징때부터 피부장벽을 채워줘야지 피부컨디션이 좋아집니다..🤍",en:"🥲Combination (oily-dehydrated), sensitive skin, flushing/redness, severe inner dryness. \n The weather suddenly changed and my skin got even more sensitive, and my barrier was totally broken down.... I needed to do a second cleanse, and since cleansing milk is the gentlest and softest option, I went looking for one and kept using this product! \n It protects the skin barrier while still having cleansing power, so it was great to use as a first cleanse too!!! It's mildly acidic, and it removes light makeup pretty thoroughly while still leaving skin moist!! No ethanol, so no irritation, and best of all, no eye stinging!!! 😳👀 Maybe because hyaluronic acid and azulene help with hydration and calming, there was no dryness even after cleansing with this, so even for severely dehydrated combination (oily-dehydrated) skin like mine, I could comfortably finish with a foam cleanser too. My skin has genuinely been super super sensitive lately with bad redness and bumps, but thankfully they're gradually calming down, so I think this is really great for sensitive skin to use 🥹 If you want to cleanse gently, try NOMADIA Cleansing Milk!! You need to build up the skin barrier starting from the cleansing step for your skin condition to improve..🤍","zh-CN":"🥲水油皮，敏感/敏感肌，发热/泛红，内干严重的皮肤。 \n 突然天气变化让皮肤变得更敏感，屏障整个都崩溃了……需要做二次清洁，找洁面乳中最温和柔软的一款，就一直在用这款！ \n 既能保护皮肤屏障又有清洁力，做一次清洁也很合适！！！弱酸性，简单的妆容基本都能水润地卸掉！！不含酒精所以没有皮肤刺激，最好的是不会呛眼！！！😳👀 可能是透明质酸和蓝甘菊薁帮忙做了水润舒缓，用洁面乳洗完也不干燥，就算内干严重的水油皮，也能一路舒服地洗到用洁面泡沫都不难受。最近皮肤真的超超超超敏感，泛红和痘痘都很严重，幸好正在一点点消退，真的很适合敏感肌使用🥹 想温和洁面的人可以试试NOMADIA洁面乳！！从洁面这一步就要给皮肤屏障补充水分，皮肤状态才会变好……🤍","zh-TW":"🥲外油內乾、敏感肌、泛熱/泛紅、內在乾燥嚴重的肌膚。\n 突然天氣變化，皮膚變得更敏感，皮膚屏障整個崩壞……需要做二次清潔，因為卸妝乳最溫和柔順，所以在找卸妝乳的過程中，一直持續使用這款產品！\n 因為能保護皮膚屏障同時又有潔淨力，很適合當一次卸妝使用！！！雖然是弱酸性，但簡單的妝容幾乎都能水潤地卸乾淨！！沒有添加酒精所以不刺激，最棒的是完全不刺眼！！！😳👀 玻尿酸和薁能幫助鎮定保濕，卸完妝之後也不乾燥，就算是內在乾燥嚴重的外油內乾肌，一路洗到洗面乳都能舒服地完成洗臉。最近皮膚真的變得超級無敵敏感，紅腫和痘痘都冒得很嚴重，還好正在一點一點消退中，真的很適合敏感肌使用 🥹 想溫和卸妝的人，試試看NOMADIA卸妝乳吧！！從卸妝這一步就要把皮膚屏障補滿，肌膚狀況才會變好..🤍",ja:"🥲インナードライ肌、敏感肌、ほてり/赤み、インナードライがひどい肌。\n 急に天候が変わって肌がさらに敏感になり、肌バリアが完全に崩れた状態でした…。2回目の洗顔をしないといけないけれど、クレンジングミルクが一番マイルドで優しいのでクレンジングミルクを探していて、この製品を使い続けています！\n 肌バリアを守りながら洗浄力もあるので、1回目の洗顔として使うのに良かったです！！！弱酸性なのに簡単なメイクはほとんどしっとりと落ちます！！エタノールが入っていないので肌への刺激がなく、一番良いのは目にしみないこと！！！😳👀ヒアルロン酸とアズレンが水分鎮静を助けてくれるからか、クレンジングミルクで洗顔した後も乾燥がなく、インナードライがひどい肌でも洗顔フォームまで快適に洗顔を終えることができました。本当に最近すごくすごく敏感になった肌で赤みとニキビがひどく出ていたのですが、幸い少しずつ落ち着いてきている状態なので、敏感肌が使うのに本当に良いと思います🥹マイルドにクレンジングしたい方はNOMADIAクレンジングミルクを使ってみてください！！クレンジングの段階から肌バリアを満たしてあげてこそ肌コンディションが良くなります…🤍",th:"🥲ผิวมันขาดน้ำ แพ้ง่าย/ผิวไวต่อสิ่งเร้า ร้อนวูบวาบ/ผื่นแดง ผิวขาดน้ำรุนแรง \n จู่ๆ อากาศเปลี่ยนแปลง ทำให้ผิวแพ้ง่ายขึ้นและเกราะผิวพังไปหมด.... ต้องล้างหน้าครั้งที่สอง เลยหาคลีนซิ่งมิลค์ที่อ่อนโยนและนุ่มนวลที่สุด แล้วมาเจอตัวนี้เลยใช้ต่อเนื่องมาตลอด ! \n เพราะปกป้องเกราะผิวไปพร้อมกับมีแรงทำความสะอาด เลยใช้เป็นการล้างหน้าครั้งแรกได้ดีมาก!!! เป็นกรดอ่อนแต่ล้างเมคอัพเบาๆ ออกได้เกือบหมดอย่างชุ่มชื้น!! ไม่มีเอทานอลเลยไม่ระคายเคืองผิว ที่ชอบที่สุดคือไม่แสบตาเลย!!! 😳👀 อาจเป็นเพราะไฮยาลูรอนิกแอซิดและอาซูเลนช่วยให้ความชุ่มชื้นและปลอบประโลม หลังล้างหน้าด้วยมิลค์ไม่แห้งเลย แม้ผิวมันขาดน้ำที่ขาดน้ำรุนแรงก็ยังล้างหน้าต่อด้วยโฟมได้อย่างสบายผิว ช่วงนี้ผิวแพ้ง่ายสุดๆ จนมีรอยแดงและสิวขึ้นเยอะมาก แต่โชคดีที่ค่อยๆ ยุบลงเรื่อยๆ รู้สึกว่าเหมาะกับผิวแพ้ง่ายมากจริงๆ 🥹 ใครอยากล้างหน้าแบบอ่อนโยน ลองใช้คลีนซิ่งมิลค์ของโนมาเดียดูนะคะ!! ต้องเติมเต็มเกราะผิวตั้งแต่ขั้นตอนล้างหน้า สภาพผิวถึงจะดีขึ้นค่ะ..🤍"},images:[],video:null},
    {id:"qQwP13bJ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"건성(부분 지성 복합성), 넓어진 모공 스트레스 - 노폐물 배출 체감",en:"Dry (combination with some oily patches), stressed about widened pores - noticeable removal of buildup","zh-CN":"干皮（局部偏油混合肌），毛孔粗大压力大 - 能感受到废物排出","zh-TW":"乾性（局部偏油混合肌），毛孔變大的壓力 - 明顯感受到老廢物排出",ja:"乾燥肌(部分的に脂性の混合肌)、広がった毛穴がストレス - 老廃物排出を実感",th:"ผิวแห้ง (บางส่วนเป็นผิวผสมมัน) เครียดเรื่องรูขุมขนกว้าง - รู้สึกได้ว่าสิ่งสกปรกหลุดออก"},date:"2026-06-15",
