      quote:{ko:"*피부타입: 전체적으로 건성인데 부분마 지성인 복합성 피부입니다.\n 평소에 세안 후에 건조감을 많이 느끼는 타입이에요.\n \n\n *사용후기: 우선 제품 진짜 순해서 자극감 하나도 없어서 편하게 사용할 수 있어서 좋았어요.\n 평소 자극적인 것 쓰면 피부가 금방 붉어지고 트러블 올라오는데 이 제품은 순해서\n 진짜 자극되는 느낌 하나도 없어요.\n 약산성인데다가 자극성분이나 에탄올 등의 성분이 포함되지 않아서\n 진짜 순하게 세정되는 것 같아요.\n 평소 피부 예민한 분들이 사용해도 편하게 사용하실 수 있을 것 같아요.\n 그리고 제가 건성인데 사용 후에 당김 없어서 마음에 들더라구요.\n 히알루론산이 들어 있어서 그런지 스킨 바르기 전에도 당기지 않아서 좋았습니다. \n 제가 모공이 요즘 넓어져서 스트레스 많은데 이 제품 사용하고나면\n 노폐물이 잘 빠지고 메이크업도 말끔하게 지워져서 좋았어요.\n 메이크업 잔여물 남지 않고 깔끔하게 마무리 되더라구요.\n 그리고 세안 시 눈에 자극감이나 눈시림 없어서 사용할 때도 편하고\n 노폐물이 부드럽게 녹아서 좋더라구요. \n 전체적으로 정말 만족합니다.",en:"*Skin type: overall dry with some oily patches, combination skin.\n I'm the type who feels a lot of dryness after cleansing normally.\n \n\n *Usage review: first of all, the product is genuinely gentle with zero irritation, so it was comfortable to use.\n Normally when I use anything harsh, my skin reddens and breaks out quickly, but this product is gentle,\n so I felt truly zero irritation.\n It's mildly acidic and doesn't contain irritating ingredients or ethanol,\n so it really does feel like a gentle cleanse.\n I think even people with normally sensitive skin could use this comfortably.\n And since I have dry skin, I loved that there was no tightness after use.\n Maybe because it has hyaluronic acid, there was no tightness even before applying toner. \n My pores have been widening lately and it's been stressing me out, but after using this product\n buildup came out well and makeup was removed cleanly.\n No makeup residue left behind, it finished clean.\n And there was no irritation or eye stinging during cleansing, so it was comfortable to use\n and buildup dissolved smoothly, which I liked. \n Overall I'm really satisfied.","zh-CN":"*肤质：整体是干皮，但局部偏油的混合性肌肤。\n 平时洗脸后容易感到干燥的类型。\n \n\n *使用感受：首先产品真的很温和，完全没有刺激感，用起来很省心。\n 平时用刺激性的东西皮肤很快就会泛红长痘，但这款很温和，\n 真的完全没有刺激的感觉。\n 是弱酸性，而且不含刺激成分或酒精等成分，\n 感觉真的能温和清洁。\n 平时皮肤敏感的人用起来应该也能很放心。\n 而且我是干皮，用完之后不紧绷，这点我很喜欢。\n 可能是因为含有透明质酸，涂化妆水之前也不紧绷，很不错。\n 我最近毛孔变粗压力很大，用了这款产品之后\n 废物排得很干净，妆也卸得很彻底，很喜欢。\n 没有妆容残留，收尾很干净。\n 而且洗脸时眼睛没有刺激感或呛眼，用起来很省心，\n 废物也被温和地溶解掉，很不错。\n 整体真的很满意。","zh-TW":"*膚質：整體偏乾性，但局部偏油的混合肌。\n 平常洗完臉後常常覺得乾燥的類型。\n\n\n *使用心得：首先產品真的很溫和，完全沒有刺激感，可以放心使用，這點很喜歡。\n 平常用比較刺激的產品皮膚很快就會泛紅、長痘痘，但這款很溫和，\n 真的完全感覺不到刺激。\n 是弱酸性，又不含刺激成分或酒精等成分，\n 感覺洗得真的很溫和。\n 平常皮膚敏感的人用起來應該也能很放心。\n 而且我是乾性肌，用完之後不緊繃，這點很喜歡。\n 因為含有玻尿酸，擦化妝水之前也不會緊繃，這點很棒。\n 我最近毛孔變大壓力很大，用了這款產品之後\n 老廢物排得很順，妝也卸得很乾淨，這點很喜歡。\n 妝容殘留不會留下，收尾很乾淨。\n 而且洗臉時眼睛不會有刺激感或刺眼感，用起來很舒服，\n 老廢物溶解得很溫和，這點很喜歡。\n 整體來說真的很滿意。",ja:"*肌タイプ：全体的には乾燥肌ですが、部分的に脂性の混合肌です。\n 普段、洗顔後に乾燥をよく感じるタイプです。\n \n\n *使用レビュー：まず製品が本当にマイルドで刺激感が全くなく、快適に使えて良かったです。\n 普段刺激の強いものを使うとすぐ肌が赤くなってトラブルが出るのですが、この製品はマイルドで\n 本当に刺激を感じることが全くありません。\n 弱酸性な上に刺激成分やエタノールなどの成分が含まれていないので\n 本当に優しく洗浄できる気がします。\n 普段肌が敏感な方が使っても快適に使えると思います。\n それから私は乾燥肌なのですが、使用後につっぱりがなくて気に入りました。\n ヒアルロン酸が入っているからか、化粧水をつける前もつっぱらなくて良かったです。\n 最近毛穴が広がってストレスが多いのですが、この製品を使うと\n 老廃物がしっかり抜けてメイクもきれいに落ちて良かったです。\n メイクの残留物が残らずすっきり仕上がります。\n それから洗顔時に目への刺激感やしみる感じがなくて使うときも楽で\n 老廃物が優しく溶けて良かったです。 \n 全体的に本当に満足しています。",th:"*ประเภทผิว: โดยรวมเป็นผิวแห้งแต่บางส่วนเป็นผิวมัน คือผิวผสมค่ะ\n ปกติเป็นคนที่รู้สึกแห้งมากหลังล้างหน้า\n \n\n *รีวิวการใช้งาน: อันดับแรกผลิตภัณฑ์นี้อ่อนโยนมากจนไม่รู้สึกระคายเคืองเลย ใช้ได้สบายๆ ชอบมาก\n ปกติถ้าใช้อะไรที่ระคายเคือง ผิวจะแดงและเป็นสิวขึ้นทันที แต่ผลิตภัณฑ์นี้อ่อนโยน\n จึงไม่รู้สึกระคายเคืองเลยจริงๆ\n เป็นกรดอ่อนและไม่มีส่วนผสมที่ระคายเคืองหรือเอทานอล\n จึงรู้สึกว่าทำความสะอาดได้อย่างอ่อนโยนจริงๆ\n คิดว่าคนผิวแพ้ง่ายก็น่าจะใช้ได้อย่างสบายใจ\n แล้วฉันเป็นผิวแห้งแต่ใช้แล้วไม่ตึงเลย ถูกใจมาก\n อาจเพราะมีไฮยาลูรอนิกแอซิด เลยไม่ตึงแม้ก่อนทาโทนเนอร์ \n ช่วงนี้เครียดเรื่องรูขุมขนกว้างมาก แต่พอใช้ผลิตภัณฑ์นี้แล้ว\n สิ่งสกปรกหลุดออกดีและล้างเมคอัพออกได้หมดจด ชอบมาก\n ไม่มีคราบเมคอัพตกค้าง จบอย่างสะอาดเรียบร้อย\n แล้วตอนล้างหน้าก็ไม่แสบตาหรือแสบตาเลย ใช้สบาย\n สิ่งสกปรกละลายออกอย่างนุ่มนวล ชอบมาก \n โดยรวมพอใจมากจริงๆ ค่ะ"},images:[],video:null},
    {id:"Zlyn4B9q",rating:4,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지 복합성+좁쌀트러블, 오일·밤 쓰면 장벽 무너지는 예민 피부가 정착",en:"Combination (oily-dehydrated), small bumps + a barrier that collapses with oils/balms - finally found a keeper","zh-CN":"水油皮混合肌+闭口痘痘，用油类·膏类就崩溃的敏感屏障肌终于定妆","zh-TW":"外油內乾混合肌+粉刺困擾，用油類/膏狀卸妝就會屏障崩壞的敏感肌終於定番",ja:"インナードライ混合肌+細かいニキビ、オイル・バームを使うとバリアが崩れる敏感肌が定番化",th:"ผิวมันขาดน้ำผสม+สิวเสี้ยน ผิวแพ้ง่ายที่เกราะผิวพังเมื่อใช้ออยล์·บาล์ม จนมาลงเอยที่ตัวนี้"},date:"2026-06-15",
      quote:{ko:"⭐️노마디아 블루 판테놀 클렌징밀크 사용후기입니다⭐️\n\n✔️피부타입: 수부지 복합성/ 민감성/ 속건조/ 좁쌀트러불\n\n저는 되게 예민한 피부에 피부장벽이 많이 얇아서 클렌징으로\n오일이나 밤을 쓰면 처음에는 좋아보이나 세번 이상만 쓰면\n장벽이 우수수 무너지는 개복치 노답 장벽피부를 지녔는데요\n그래서 클렌징밀크로 갈아탄지 꽤 오래 됐어요. 처음 노마디아 클렌징밀크를 보고 세정제에 판테놀 약간 굳이….?라는\n감정이었지만 좋은 성분 세정할 때부터 들어있으면 믿음이\n가잖아요 그래서 민감성 피부도 맘 편히 사용할 수 있었던 것 같아요. \n\n제형은 메**크프렘이나 듀*트* 밀크보다 조금 더 점도 있는 느낌이었습니다. 그래서 볼에 바로 짜도 막 흘러내리는 점도의 제형은 아니었어요. 그래서 그런지 뭔가 타사의 밀크들보다 조금 더 꾸덕하게 피부에서 롤링되는 기분이었습니다. \n\n세정력은 엄청나게 좋은 느낌은 아니에요. 밀크가 사실 세정력을 보고 사는 제품은 아니다보니까 저는 원래도 밀크로 녹여내고 워터로 닦아내고 있습니다. 이러면 잘 지워져용\n\n👉🏻민감성인데 맘 놓고 쓸 무난한 클렌징밀크를 찾는다 하면 추천",en:"⭐️This is my review of the NOMADIA Blue Panthenol Cleansing Milk⭐️\n\n✔️Skin type: combination (oily-dehydrated)/ sensitive/ inner dryness/ small bumps\n\nI have really sensitive skin with a very thin barrier, so when I use\ncleansing oils or balms, they seem fine at first but after just three uses\nmy barrier completely collapses — I have that hopeless, fragile-barrier skin\nSo it's been a while since I switched to cleansing milk. When I first saw NOMADIA's cleansing milk I thought, a bit of panthenol in a cleanser, is that really necessary...? but having good ingredients right from the cleansing step does build trust, so I think that's why even my sensitive skin could use it worry-free. \n\nThe texture felt a bit thicker than Make P***m or D*** milk. So it's not the kind of runny texture that drips right off if you squeeze it onto your cheek. Maybe because of that, it felt like it rolled on a bit more richly on the skin compared to other brands' milks. \n\nThe cleansing power isn't amazingly strong. Milk isn't really something you buy for cleansing power anyway, so I've always dissolved it in with the milk and wiped it off with water. This gets everything off well\n\n👉🏻If you're sensitive and looking for a reliable, no-fuss cleansing milk, I'd recommend this","zh-CN":"⭐️NOMADIA蓝色泛醇洁面乳使用心得⭐️\n\n✔️肤质：水油皮混合肌/敏感性/内干/闭口痘痘\n\n我皮肤非常敏感、屏障也很薄，用油类或膏类卸妆，一开始感觉不错，但用超过三次屏障就会哗啦啦地崩溃，是个不折不扣的脆弱屏障肌，所以换用洁面乳已经很久了。第一次看到NOMADIA洁面乳的时候还想'清洁产品里加泛醇是不是有点多此一举……？'，但从清洁这一步就含有好成分，会让人更信任呢，所以敏感肌也能放心使用了。\n\n质地比Make P:rem或Dew*t*的洁面乳稍微更有粘度一点。所以直接挤到脸颊上也不会流得到处都是。可能正因为这样，比其他家的洁面乳感觉更厚实地在皮肤上打圈。\n\n清洁力不算特别强。洁面乳本来就不是靠清洁力取胜的产品，我本来也是用洁面乳溶解后再用清水洗掉。这样就能洗得很干净。\n\n👉🏻如果是敏感肌又想找一款可以放心用的稳定洁面乳，推荐这款","zh-TW":"⭐️NOMADIA藍色泛醇卸妝乳使用心得⭐️\n\n✔️膚質：外油內乾混合肌／敏感性／內在乾燥／粉刺困擾\n\n我皮膚非常敏感，皮膚屏障很薄，用油類或膏狀產品卸妝，\n一開始感覺不錯，但只要用超過三次，\n屏障就會嘩啦嘩啦崩掉，是那種完全靠不住的玻璃心屏障肌，\n所以我改用卸妝乳已經很久了。第一次看到NOMADIA卸妝乳時，\n心裡想著清潔產品加泛醇是不是有點多此一舉……？\n但好成分從清潔這一步就開始添加，會讓人更有信心，\n所以敏感肌也能安心使用。\n\n質地感覺比某些品牌的乳霜或某乳更有黏稠度一點。所以就算直接擠在臉頰上，也不是那種會流下來的稀薄質地。可能也因為這樣，感覺比其他家的卸妝乳在皮膚上滾動時更有厚度一點。\n\n潔淨力並不是特別強的感覺。畢竟卸妝乳本來就不是靠潔淨力取勝的產品，我本來就是先用卸妝乳溶解、再用清水洗掉。這樣就能卸得很乾淨了\n\n👉🏻如果你是敏感肌，正在找一款可以放心使用、無害好用的卸妝乳，推薦這款",ja:"⭐️NOMADIAブルーパンテノールクレンジングミルク使用レビューです⭐️\n\n✔️肌タイプ：インナードライ混合肌/敏感肌/インナードライ/細かいニキビ\n\n私はかなり敏感な肌でバリアがとても薄いので、クレンジングに\nオイルやバームを使うと最初は良さそうに見えても3回以上使うと\nバリアがぼろぼろ崩れてしまう、どうしようもなく弱いバリア肌を持っています\nなのでクレンジングミルクに切り替えてからかなり経ちます。最初NOMADIAのクレンジングミルクを見て、洗浄剤にパンテノールって少しやりすぎ…?という\n気持ちもありましたが、良い成分が洗浄する段階から入っているとやっぱり信頼が\n湧きますよね。だから敏感肌も安心して使えたのだと思います。\n\nテクスチャーはメ**クプレムやデュ*ト*のミルクより少しとろみがある感じでした。なので頬に直接出してもすぐ垂れてしまうような粘度ではなかったです。そのせいか、他社のミルクよりも少しもったりと肌の上でローリングされる感じでした。\n\n洗浄力はものすごく良い感じではありません。ミルクは実は洗浄力を見て買う製品ではないので、私はもともとミルクで溶かして水で拭き取るようにしています。こうするときれいに落ちます\n\n👉🏻敏感肌だけど安心して使える無難なクレンジングミルクを探しているならおすすめ",th:"⭐️รีวิวการใช้บลูแพนธีนอลคลีนซิ่งมิลค์ของโนมาเดียค่ะ⭐️\n\n✔️ประเภทผิว: ผิวมันขาดน้ำผสม/ แพ้ง่าย/ ผิวขาดน้ำ/ สิวเสี้ยน\n\nฉันเป็นผิวที่แพ้ง่ายมาก เกราะผิวบางมาก พอใช้ออยล์หรือบาล์มล้างหน้า\nตอนแรกจะดูดีแต่พอใช้เกิน 3 ครั้งเกราะผิวจะพังราบคาบ\nเป็นผิวที่บอบบางสุดๆ แก้ไม่ตกเลย\nเลยเปลี่ยนมาใช้คลีนซิ่งมิลค์มานานพอสมควรแล้วค่ะ ตอนแรกที่เห็นคลีนซิ่งมิลค์ของโนมาเดียก็คิดว่าทำไมต้องใส่แพนธีนอลในตัวล้างหน้าด้วยนะ….?\nแต่พอคิดว่ามีส่วนผสมดีๆ ตั้งแต่ขั้นตอนทำความสะอาดก็รู้สึกไว้ใจได้มากขึ้น\nเลยรู้สึกว่าผิวแพ้ง่ายก็ใช้ได้อย่างสบายใจค่ะ \n\nเนื้อสัมผัสมีความหนืดกว่ามิลค์ของแบรนด์ M**e P:re* หรือ Du*t* นิดหน่อย เลยไม่ใช่เนื้อที่บีบใส่แก้มแล้วไหลย้อยเลย เพราะแบบนี้เลยรู้สึกว่านวดคลึงบนผิวได้หนึบแน่นกว่ามิลค์ของแบรนด์อื่นนิดหน่อยค่ะ \n\nแรงทำความสะอาดไม่ได้รู้สึกว่าดีมากเป็นพิเศษ แต่ปกติมิลค์ก็ไม่ใช่ผลิตภัณฑ์ที่ซื้อเพราะแรงทำความสะอาดอยู่แล้ว ฉันเองก็ใช้วิธีละลายด้วยมิลค์แล้วเช็ดออกด้วยน้ำอยู่แล้ว แบบนี้ก็ล้างออกดีค่ะ\n\n👉🏻ถ้าเป็นผิวแพ้ง่ายและกำลังหาคลีนซิ่งมิลค์ที่ใช้แล้วสบายใจ ไม่มีปัญหา แนะนำเลยค่ะ"},images:[],video:null},
    {id:"qxowEbaZ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"수부지, 화장품 애호가의 꼼꼼한 항목별 사용후기",en:"Combination (oily-dehydrated), a skincare enthusiast's detailed category-by-category review","zh-CN":"水油皮，化妆品爱好者的详尽分项使用测评","zh-TW":"外油內乾，愛嘗鮮的保養控逐項細寫的使用心得",ja:"インナードライ肌、コスメ好きによる項目別の丁寧なレビュー",th:"ผิวมันขาดน้ำ รีวิวละเอียดแยกหมวดจากคนที่ชอบทดลองเครื่องสำอาง"},date:"2026-06-05",
      quote:{ko:"화장품을 이것저것 테스트해보기 좋아해서 써보고싶은 제품들을 자주 써보는 편인데 \n 이번에는 노마디아 블루 진정 판테놀 1% 클렌징 밀크 솔직후기를 작성해 보겠습니다.!\n \n\n *포장*\n 그레이톤의 심플한 포장\n 펌프형 용기로 사용하는 타입이라 위생적이라고 느껴졌어요\n \n\n *제형*\n 묽은 로션~밀크 사이 정도의 제형으로 손에 덜면 부드럽게 롤링이 가능해서 피부 마찰이 적어요.\n 순하게 클렌징이 가능한 제품인 것 같아요\n 오일처럼 무겁거나 끈적이지 않고 촉촉한 느낌이고 \n 물 묻히면 부드럽게 유화되어 좋았어요.\n \n\n *사용감*\n 세안 후 피부 당김이 적은 편 같아요\n 판테놀 성분 덕분에 민감하거나 건조한 피부도 비교적 편안하게 사용 가능할 것 같아요.\n 가벼운 선크림, 피지, 먼지 제거에는 충분함.\n 사용시 피부트러블 같은건 없었어요\n \n\n *총평*\n 세안 후 촉촉함 유지되고 피부 자극이 적은 편인 점이 좋았어요.\n 그래서 민감성 피부인 분들이 부담없이 사용가능할 것 같아요.\n 단독으로 사용시 아침 세안이나 가벼운 선크림 세정에 적합해 보여요\n 평소 메이크업 없이 선크림만 사용하는 편이라 평상시에는 단독으로 사용했고\n 메이크업 했을때는 립앤아이리무버 + 1차세안 노마디아 블루진정 판테놀 1% 클렌징밀크 + 2차세안 폼클렌징 사용했는데 부족함 없이 클렌징이 가능했어요.\n 사용감이 촉촉해서 지성피부 보다는 복합성-건성, 민감성 피부가 선호할 만한 타입인거 같아요",en:"I love testing out all kinds of cosmetics, so I try out products often. \n This time I'll write an honest review of NOMADIA's Blue Soothing 1% Panthenol Cleansing Milk.!\n \n\n *Packaging*\n Simple gray-toned packaging\n It's a pump-type container, which felt hygienic\n \n\n *Texture*\n It's somewhere between a runny lotion and milk — when you pump it onto your hand, it rolls on smoothly, so there's minimal friction on the skin.\n Seems like a product that can cleanse gently\n It's not heavy or sticky like an oil, has a moist feel, \n and emulsified smoothly when water was added.\n \n\n *Feel of use*\n Tightness after cleansing seems minimal\n Thanks to the panthenol, even sensitive or dry skin should be able to use it fairly comfortably.\n Sufficient for light sunscreen, sebum, and dust removal.\n No breakouts while using it\n \n\n *Overall thoughts*\n I liked that moisture is maintained after cleansing and irritation is minimal.\n So people with sensitive skin should be able to use it worry-free.\n Used alone, it seems well suited for a morning cleanse or removing light sunscreen\n I normally just wear sunscreen without makeup, so I used it alone most of the time,\n and on days I wore makeup, I used lip & eye remover + first cleanse with NOMADIA Blue Soothing 1% Panthenol Cleansing Milk + second cleanse with foam cleanser, and it cleansed thoroughly with nothing left behind.\n Since the feel of use is moist, I think it suits combination-dry and sensitive skin better than oily skin","zh-CN":"我很喜欢各种测试化妆品，经常尝试想用的产品，\n 这次要写一下NOMADIA蓝色舒缓泛醇1%洁面乳的真实使用心得。！\n \n\n *包装*\n 灰色调的简约包装\n 是按压瓶类型，感觉很卫生\n \n\n *质地*\n 介于稀乳液~洁面乳之间的质地，倒在手上能顺滑打圈，皮肤摩擦感少。\n 感觉是能温和清洁的产品\n 不像油类那样厚重或粘腻，是水润的感觉\n 沾水后能顺滑乳化，很不错。\n \n\n *使用感*\n 洗脸后皮肤紧绷感偏少\n 得益于泛醇成分，敏感或干燥的皮肤应该也能相对舒适地使用。\n 卸除轻度防晒、皮脂、灰尘绰绰有余。\n 使用时没有出现皮肤问题\n \n\n *总评*\n 洗脸后能维持水润，皮肤刺激感较少，这点很好。\n 所以敏感肌应该可以放心使用。\n 单独使用的话，适合早上洁面或卸除轻度防晒。\n 平时不化妆只涂防晒，所以平常都是单独使用，\n 化妆的日子则用唇眼卸妆液+一次清洁用NOMADIA蓝色舒缓泛醇1%洁面乳+二次清洁用洁面泡沫，这样清洁完全够用。\n 使用感偏水润，感觉比起油皮，更适合混合性-干性、敏感性肌肤","zh-TW":"我很喜歡東試西試各種保養品，經常會嘗試想用的產品，\n 這次要來寫NOMADIA藍色舒緩泛醇1%卸妝乳的真實心得。！\n\n\n *包裝*\n 灰色調的簡約包裝\n 是按壓瓶類型，覺得很衛生\n\n\n *質地*\n 介於稀薄乳液到卸妝乳之間的質地，倒在手上就能柔順滾動，皮膚摩擦感很少。\n 感覺是能溫和卸妝的產品\n 不像油類那樣厚重或黏膩，是水潤的感覺，\n 沾水後能柔順乳化，這點很喜歡。\n\n\n *使用感*\n 洗完臉後緊繃感偏少\n 因為含有泛醇成分，敏感或乾燥肌用起來應該也能比較舒服。\n 卸除淡防曬乳、皮脂、灰塵綽綽有餘。\n 使用期間沒有出現任何肌膚困擾\n\n\n *總評*\n 洗完臉後能維持水潤，皮膚刺激感較少，這點很喜歡。\n 所以敏感肌的人應該也能無負擔使用。\n 單獨使用時適合早上洗臉或卸除淡防曬乳\n 平常沒有化妝、只擦防曬乳，所以平時都單獨使用，\n 化妝時就用唇眼卸妝液+一次卸妝用NOMADIA藍色舒緩泛醇1%卸妝乳+二次洗臉用洗面乳，這樣卸妝毫無問題。\n 使用感偏水潤，感覺比起油性肌，混合性-乾性、敏感性肌膚應該會更喜歡這個類型",ja:"コスメをあれこれ試すのが好きで、使ってみたい製品をよく試しているのですが \n 今回はNOMADIAブルー鎮静パンテノール1%クレンジングミルクの正直レビューを書いてみます！\n \n\n *パッケージ*\n グレートーンのシンプルなパッケージ\n ポンプ容器タイプなので衛生的だと感じました\n \n\n *テクスチャー*\n 水っぽいローションとミルクの中間くらいのテクスチャーで、手に取ると優しくローリングできて肌への摩擦が少ないです。\n マイルドにクレンジングできる製品だと思います\n オイルのように重かったりべたついたりせずしっとりした感じで \n 水をつけると優しく乳化して良かったです。\n \n\n *使用感*\n 洗顔後、肌のつっぱりが少ない方だと思います\n パンテノール成分のおかげで敏感肌や乾燥肌も比較的快適に使えそうです。\n 軽めの日焼け止め、皮脂、ほこりを落とすには十分です。\n 使用中に肌トラブルのようなものはありませんでした\n \n\n *総評*\n 洗顔後にしっとり感が保たれて肌への刺激が少ない点が良かったです。\n なので敏感肌の方も気軽に使えると思います。\n 単独で使う場合は朝の洗顔や軽めの日焼け止めのクレンジングに向いていそうです\n 普段メイクをせず日焼け止めだけ使うタイプなので、普段は単独で使い、\n メイクをした日はリップ&アイリムーバー+1回目の洗顔にNOMADIAブルー鎮静パンテノール1%クレンジングミルク+2回目の洗顔にフォームクレンザーを使いましたが、不足なくクレンジングできました。\n 使用感がしっとりしているので、脂性肌よりも混合肌〜乾燥肌、敏感肌の方が好むタイプだと思います",th:"ฉันชอบลองเครื่องสำอางหลายๆ แบบ เลยมักจะลองผลิตภัณฑ์ที่อยากใช้บ่อยๆ ค่ะ \n ครั้งนี้จะมาเขียนรีวิวตรงไปตรงมาของบลูซูทติ้งแพนธีนอล 1% คลีนซิ่งมิลค์ของโนมาเดียค่ะ!\n \n\n *บรรจุภัณฑ์*\n โทนสีเทาเรียบง่าย\n เป็นขวดปั๊ม รู้สึกว่าถูกสุขอนามัยดี\n \n\n *เนื้อสัมผัส*\n เนื้อสัมผัสอยู่ระหว่างโลชั่นเหลวกับมิลค์ ตักใส่มือแล้วนวดคลึงได้นุ่มนวล แรงเสียดสีน้อย\n รู้สึกว่าเป็นผลิตภัณฑ์ที่ทำความสะอาดได้อย่างอ่อนโยน\n ไม่หนักหรือเหนียวเหนอะหนะแบบออยล์ แต่ให้ความรู้สึกชุ่มชื้น \n พอโดนน้ำแล้วอิมัลชันได้นุ่มนวลดี\n \n\n *ความรู้สึกเมื่อใช้*\n หลังล้างหน้าตึงน้อยกว่าที่คิด\n เพราะมีแพนธีนอล เลยน่าจะใช้ได้สบายๆ แม้ผิวแพ้ง่ายหรือผิวแห้ง\n เพียงพอสำหรับล้างครีมกันแดดเบาๆ ไขมัน และฝุ่นละออง\n ใช้แล้วไม่มีสิวขึ้นเลย\n \n\n *สรุป*\n ชอบที่หลังล้างหน้ายังคงความชุ่มชื้นและระคายเคืองผิวน้อย\n เลยคิดว่าคนผิวแพ้ง่ายน่าจะใช้ได้อย่างสบายใจ\n ถ้าใช้เดี่ยวๆ เหมาะกับล้างหน้าตอนเช้าหรือล้างครีมกันแดดเบาๆ\n ปกติไม่แต่งหน้า ทาแค่ครีมกันแดด เลยใช้เดี่ยวๆ เป็นหลัก\n ส่วนวันที่แต่งหน้าใช้ลิปแอนด์อายรีมูฟเวอร์ + ล้างหน้าครั้งแรกด้วยบลูซูทติ้งแพนธีนอล 1% คลีนซิ่งมิลค์ของโนมาเดีย + ล้างหน้าครั้งที่สองด้วยโฟม ก็ล้างออกได้หมดจดไม่ขาดตกบกพร่อง\n เพราะให้ความรู้สึกชุ่มชื้น น่าจะเหมาะกับผิวผสม-ผิวแห้ง และผิวแพ้ง่ายมากกว่าผิวมัน"},images:[],video:null},
    {id:"Z4697YOA",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지, 한 달째 트러블 반복 중 - 교체 후 기존 트러블 잠잠해짐",en:"Combination (oily-dehydrated), a month of recurring breakouts - existing breakouts calmed down after switching","zh-CN":"水油皮，反复长痘一个月 - 换用后原有痘痘平息","zh-TW":"外油內乾，一整個月反覆長痘痘 - 換用後原本的痘痘平息",ja:"インナードライ肌、1ヶ月ほどトラブルが繰り返し発生中 - 切り替え後、既存のトラブルが落ち着く",th:"ผิวมันขาดน้ำ สิวขึ้นๆ ยุบๆ มาเป็นเดือน - เปลี่ยนมาใช้แล้วสิวเดิมสงบลง"},date:"2026-06-05",
      quote:{ko:"🍀피부타입 : 수부지 / 평소에는 트러블이 없는 피부인데 한 달 전부터 트러블이 올라와서 트러블 여러개가 생겼다 없어졌다 반복중🥺😭\n \n\n 🍀제형 : 로션같이 주르륵 흐르는 부드러운 밀크 제형이라 피부에 롤링할 때 부드럽게 롤링할 수 있어 자극이 적고 사용감이 좋았어요! \n \n\n 🍀평소에도 자극이 적은 클렌징제품을 사용하는지라 아침에는 클렌징젤을, 저녁에는 클렌징밀크 - 클렌징젤을 사용하는데 (아이메이크업을 한 날에는 아이리무버를 사용) 원래 사용하던 클렌징밀크로는 아이메이크업까지 지우는건 좀 힘들었는데 노마디아 블루 진정 판테놀 1% 클렌징밀크는 베이스메이크업은 물론, 틴트, 아이라이너까지 싹 지워지더라고요🫢 \n 순한 사용감에 비해 높은 세정력이 정말 맘에 들었어요😆 \n 거기다 요즘 날씨가 덥고 습한데 반해 속건조가 심해서 한 달전 올라온 트러블이 여전히 차도가 없는데 이럴 때 새로운 화장품이나 클렌징제품을 사용하는게 굉장한 모험일 수 있잖아요🥲 (예전에 클렌징오일 바꿨다가 피부 심하게 뒤집힌 적이 있거든요😥)\n 그런데 진정 판테놀 성분이 들어있다고 해서 믿고 사용해봤는데 사용하는 동안 다행히 새로운 트러블이 올라오지는 않았어요🙂 \n 오히려 기존에 났던 큰 트러블이 잠잠해졌어요☺️\n \n\n 사용 후 속건조나 당김도 없고, 한동안 촉촉함이 유지되는 느낌이라 사용감도 만족스럽고요!\n \n\n 지금 제 피부장벽이 다 무너져있는 상태라 걱정이었는데 너무 순하고 사용감 좋고 세정력도 좋은 제품 만나서 만족스럽습니다!\n 기존에 사용하던 클렌징밀크제품 다 사용하고 나면 이 제품으로 갈아탈 의사도 있어요😉",en:"🍀Skin type: combination (oily-dehydrated) / normally breakout-free skin, but breakouts have been popping up and disappearing repeatedly for the past month🥺😭\n \n\n 🍀Texture: it's a soft milk texture that flows smoothly like a lotion, so it rolls on gently on the skin with minimal irritation and a good feel of use! \n \n\n 🍀I normally use low-irritation cleansing products too, so I use cleansing gel in the morning, and cleansing milk - cleansing gel in the evening (eye remover on days I wear eye makeup). With the cleansing milk I used to use, it was tough to fully remove eye makeup, but NOMADIA's Blue Soothing 1% Panthenol Cleansing Milk cleaned off not just base makeup but even tint and eyeliner completely🫢 \n I really loved the high cleansing power despite the gentle feel😆 \n On top of that, the weather's been hot and humid lately, but I have severe inner dryness, and the breakout that started a month ago still hasn't improved, so trying a new cosmetic or cleansing product at a time like this can feel like a big risk right?🥲 (I once switched cleansing oils before and my skin flipped out badly😥)\n But I trusted it because it contains soothing panthenol and tried it, and thankfully no new breakouts appeared while using it🙂 \n If anything, the existing big breakout calmed down☺️\n \n\n No inner dryness or tightness after use, and it feels like moisture is maintained for a while, so the feel of use is satisfying too!\n \n\n My skin barrier is completely broken down right now, so I was worried, but I'm so satisfied to have found a product this gentle with such a good feel of use and cleansing power!\n Once I finish up the cleansing milk I currently use, I'd be willing to switch over to this product😉","zh-CN":"🍀肤质：水油皮 / 平时不怎么长痘，但一个月前开始冒痘，好几颗痘痘反反复复长了又消🥺😭\n \n\n 🍀质地：像乳液一样顺滑流动的柔软洁面乳质地，打圈按摩时能顺滑打圈，刺激少，使用感很好！\n \n\n 🍀平时也是用刺激少的清洁产品，早上用洁面凝胶，晚上用洁面乳-洁面凝胶（画了眼妆的日子会用眼部卸妆液），原本用的洁面乳很难卸掉眼妆，但NOMADIA蓝色舒缓泛醇1%洁面乳不仅能卸底妆，连唇釉、眼线都能一并卸干净🫢 \n 相较于温和的使用感，清洁力这么强真的很喜欢😆 \n 而且最近天气又热又潮，但我内干很严重，一个月前长的痘痘还没消，这时候换新化妆品或清洁产品其实是很大的冒险吧🥲（以前换过卸妆油之后皮肤严重爆发过😥）\n 不过因为含有舒缓泛醇成分，就抱着信任试了试，用的期间幸好没有新长痘🙂 \n 反而原本比较大的痘痘平息下去了☺️\n \n\n 用完之后没有内干或紧绷，感觉能维持一段时间的水润，使用感也很满意！\n \n\n 本来担心我的皮肤屏障已经完全崩溃了，结果遇到了这么温和、使用感又好、清洁力也不错的产品，很满意！\n 等我现在用的洁面乳用完之后，也有意愿换成这款😉","zh-TW":"🍀膚質：外油內乾／平常不太長痘痘的肌膚，但一個月前開始冒痘痘，好幾顆反覆長了又消🥺😭\n\n\n 🍀質地：像乳液一樣稀順流動的柔軟卸妝乳質地，打圈時能溫柔滾動，刺激少、使用感很好！\n\n\n 🍀我平常也是用刺激較少的卸妝產品，早上用潔顏凝露，晚上用卸妝乳-潔顏凝露（畫眼妝的日子會用眼妝卸妝液），原本用的卸妝乳連眼妝都不太容易卸乾淨，但NOMADIA藍色舒緩泛醇1%卸妝乳不只底妝，連唇釉、眼線都完全卸掉了🫢\n 相對溫和的使用感卻有這麼高的潔淨力，真的很滿意😆\n 而且最近天氣濕熱，但我內在乾燥很嚴重，一個月前長的痘痘一直沒好，這種時候換新的保養品或卸妝產品其實蠻冒險的🥲（以前換卸妝油的時候皮膚曾經大爆炸過😥）\n 不過因為聽說含有舒緩泛醇成分，就抱著信任的心情試用了，還好使用期間沒有冒出新的痘痘🙂\n 反而原本比較大顆的痘痘平息下來了☺️\n\n\n 用完之後也不會內在乾燥或緊繃，水潤感能維持一段時間，使用感也很滿意！\n\n\n 現在我的皮膚屏障整個崩壞，本來很擔心，但遇到這麼溫和、使用感又好、潔淨力也不錯的產品，真的很滿意！\n 等我現在用的卸妝乳用完之後，也有意願換成這款😉",ja:"🍀肌タイプ：インナードライ肌/普段はトラブルのない肌ですが、1ヶ月前からトラブルが出てきて、いくつかできては消えを繰り返し中🥺😭\n \n\n 🍀テクスチャー：ローションのようにさらっと流れる柔らかいミルクのテクスチャーなので、肌にローリングするとき優しくローリングでき、刺激が少なく使用感が良かったです！ \n \n\n 🍀普段から刺激が少ないクレンジング製品を使っているので、朝はクレンジングジェルを、夜はクレンジングミルク-クレンジングジェルを使っています(アイメイクをした日はアイリムーバーを使用)。もともと使っていたクレンジングミルクではアイメイクまで落とすのはちょっと大変でしたが、NOMADIAブルー鎮静パンテノール1%クレンジングミルクはベースメイクはもちろん、ティント、アイライナーまですっきり落ちました🫢 \n マイルドな使用感の割に洗浄力が高いところが本当に気に入りました😆 \n それに最近は天気が暑くて湿気があるのに反してインナードライがひどく、1ヶ月前に出たトラブルが未だに改善しない中で新しいコスメやクレンジング製品を使うのはかなりの冒険じゃないですか🥲(以前クレンジングオイルを変えて肌がひどく荒れたことがあります😥)\n でも鎮静パンテノール成分が入っているというので信じて使ってみましたが、使用中は幸い新しいトラブルは出ませんでした🙂 \n むしろ既存の大きなトラブルが落ち着きました☺️\n \n\n 使用後はインナードライやつっぱりもなく、しばらくしっとり感が続く感じで使用感も満足です！\n \n\n 今、私の肌バリアが完全に崩れている状態で心配でしたが、とてもマイルドで使用感も良く、洗浄力も良い製品に出会えて満足しています！\n 今使っているクレンジングミルク製品を使い切ったら、この製品に切り替えるつもりもあります😉",th:"🍀ประเภทผิว : ผิวมันขาดน้ำ / ปกติไม่ค่อยเป็นสิว แต่พอเดือนที่แล้วสิวเริ่มขึ้น ก็ขึ้นๆ ยุบๆ หลายเม็ดมาตลอด🥺😭\n \n\n 🍀เนื้อสัมผัส : เป็นเนื้อมิลค์นุ่มไหลลื่นเหมือนโลชั่น นวดคลึงบนผิวได้นุ่มนวล ระคายเคืองน้อย ความรู้สึกเมื่อใช้ดีมาก! \n \n\n 🍀ปกติก็ใช้ผลิตภัณฑ์คลีนซิ่งที่ระคายเคืองน้อยอยู่แล้ว ตอนเช้าใช้คลีนซิ่งเจล ตอนเย็นใช้คลีนซิ่งมิลค์-คลีนซิ่งเจล (วันที่แต่งตาใช้อายรีมูฟเวอร์) คลีนซิ่งมิลค์ที่เคยใช้ล้างเมคอัพตาไม่ค่อยออก แต่บลูซูทติ้งแพนธีนอล 1% คลีนซิ่งมิลค์ของโนมาเดียล้างเมคอัพเบส ทินท์ และอายไลเนอร์ออกหมดจดเลยค่ะ🫢 \n ชอบมากที่แรงทำความสะอาดสูงทั้งที่อ่อนโยนขนาดนี้😆 \n แถมช่วงนี้อากาศร้อนชื้นแต่ผิวขาดน้ำรุนแรงมาก สิวที่ขึ้นเมื่อเดือนก่อนก็ยังไม่ดีขึ้นเลย การลองเครื่องสำอางหรือผลิตภัณฑ์คลีนซิ่งใหม่ในช่วงนี้เลยเหมือนการเสี่ยงดวงมากๆ🥲 (เคยเปลี่ยนคลีนซิ่งออยล์แล้วผิวเห่อหนักมาแล้ว😥)\n แต่พอรู้ว่ามีส่วนผสมบลูซูทติ้งแพนธีนอลก็เลยลองเชื่อใจใช้ดู โชคดีที่ใช้ไปแล้วไม่มีสิวใหม่ขึ้นเลย🙂 \n กลับกันสิวก้อนใหญ่ที่มีอยู่เดิมยังสงบลงอีกด้วย☺️\n \n\n หลังใช้ไม่มีอาการผิวขาดน้ำหรือตึงเลย รู้สึกชุ่มชื้นต่อเนื่องไปอีกพักหนึ่ง พอใจกับความรู้สึกเมื่อใช้มากค่ะ!\n \n\n ตอนนี้เกราะผิวของฉันพังไปหมดแล้วเลยกังวลอยู่ แต่มาเจอผลิตภัณฑ์ที่อ่อนโยนมาก ความรู้สึกเมื่อใช้ดี แรงทำความสะอาดก็ดี พอใจมากค่ะ!\n พอใช้คลีนซิ่งมิลค์ตัวเดิมที่มีอยู่หมดแล้ว ก็มีความตั้งใจจะเปลี่ยนมาใช้ตัวนี้แทนเลยค่ะ😉"},images:[],video:null},
    {id:"qnRn1eVq",rating:4,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"극건성, 찢어질 듯한 속당김·하얀 각질 - 비포&애프터 체감 뚜렷",en:"Extremely dry, tearing-tight sensation + white flaking - clear before-and-after difference","zh-CN":"极干皮，撕裂般的内干·白色脱皮 - 前后对比感受明显","zh-TW":"極乾性，洗完臉像要裂開的緊繃感‧白色乾屑 - 前後對比明顯",ja:"極度の乾燥肌、裂けそうなつっぱり・白い粉吹き - ビフォー&アフターの実感がはっきり",th:"ผิวแห้งมาก ตึงจนเหมือนจะแตก·ขุยขาว - รู้สึกได้ถึงความเปลี่ยนแปลงก่อน&หลังชัดเจน"},date:"2026-06-06",
      quote:{ko:"피부타입: 극건성 / 세안 후 찢어질 듯한 속당김과 하얀 각질이 고민인 건성 피부\n\n1. 성분 및 제형 \n화해 어플에서 성분부터 가장 먼저 확인했는데, 주의 성분 없이 순하고 촉촉한 성분 위주로 구성되어 있어서 안심했어요. 특히 피부 장벽 강화와 수분 유지에 탁월한 판테놀이 1%나 함유되어 있어서 그런지, 확실히 세안하면서도 피부 수분막을 지켜주는 느낌이 듭니다. 제형은 너무 묽지 않고 부드러운 영양 로션 같은 텍스처예요. 건조하고 푸석한 피부에 올렸을 때 마찰 자극 없이 부드럽게 롤링되어서 정말 편안해요. 색상도 은은한 블루 빛이 돌아서 시각적으로도 진정되는 기분이 듭니다.\n2. 세정력 및 사용감\n\n사실 세정력 자체가 엄청 강력한지는 잘 모르겠어요. 그래도 상세 설명에 세정력이 좋다고 나와 있기도 하고, 제가 평소에 선크림이나 가벼운 베이스 위주로만 바르다 보니 일상적인 세정에는 무리가 없다고 생각하면서 쓰고 있어요.\n대신 사용감은 정말 만족스럽습니다. 얼굴에 문지를 때부터 '아, 이거 세안하고 나면 되게 촉촉하겠다'라는 느낌이 딱 와요. 게다가 피부에 좋은 판테놀 같은 특수 성분이 들어가 있어서 그런지, 얼굴에 롤링하며 마사지할 때마다 피부가 건강해지는 것 같고 쓸 때마다 기분이 정말 좋아집니다.\n\n3. 비포 & 애프터 (가장 만족스러운 점)\n가장 마음에 드는 부분은 세안 후 피부 상태예요! 기존 제품들을 썼을 때는 세안 직후 로션을 바르지않으면 얼굴이 붉어지고 당겼는데, 이 제품은 물기를 수건으로 닦아낸 후에도 속당김이 없습니다. 급하게 기초 화장품을 찾아 뛰어가던 루틴이 사라졌어요.",en:"Skin type: extremely dry / dry skin struggling with a tearing-tight sensation and white flaking after cleansing\n\n1. Ingredients and texture \nI checked the ingredients first on the Hwahae app, and I was relieved to see it's made mostly of gentle, moisturizing ingredients with no ingredients of concern. Especially with 1% panthenol, which is excellent for strengthening the skin barrier and retaining moisture, I could really feel it protecting my skin's moisture film even while cleansing. The texture is a smooth, nourishing lotion-like feel, not too runny. When applied to dry, flaky skin, it rolls on smoothly with no friction — really comfortable. The subtle blue tint even feels visually calming.\n2. Cleansing power and feel of use\n\nHonestly I'm not sure the cleansing power itself is super strong. But the product description does say the cleansing power is good, and since I mostly just wear sunscreen or light base makeup, I've been using it thinking it's plenty for everyday cleansing.\nBut the feel of use is genuinely satisfying. From the moment you rub it on your face you get the sense, 'oh, my skin's going to be so moist after cleansing.' Also, maybe because of skin-friendly special ingredients like panthenol, every time I roll it in and massage my face, it feels like my skin is getting healthier, and I feel really good every time I use it.\n\n3. Before & after (the most satisfying part)\nThe thing I like most is my skin's condition after cleansing! With products I used before, my face would redden and feel tight right after cleansing unless I immediately applied lotion, but with this product there's no inner tightness even after I pat my face dry with a towel. That routine of rushing to grab basic skincare products is gone.","zh-CN":"肤质：极干性 / 洗脸后有撕裂般的内干和白色脱皮困扰的干性肌肤\n\n1. 成分及质地 \n我先在化海App上查了成分，发现没有需要注意的成分，主要由温和水润的成分组成，让人放心。特别是含有1%对皮肤屏障强化和保湿都非常好的泛醇，感觉洗脸的同时也能确实守住皮肤水润膜。质地不算太稀，是柔软的滋养乳液质感。涂在干燥粗糙的皮肤上时，没有摩擦刺激地顺滑打圈，真的很舒服。颜色也带着淡淡的蓝色调，视觉上也让人觉得舒缓。\n2. 清洁力及使用感\n\n其实我不太确定清洁力本身有多强。不过产品详情页也写着清洁力不错，而我平时主要涂防晒或轻底妆，觉得日常清洁完全够用，就这样用着。\n代替强清洁力的是真的令人满意的使用感。从涂在脸上开始，就有种'啊，这个洗完应该会很水润'的预感。而且因为含有对皮肤好的泛醇之类的特殊成分，每次在脸上打圈按摩时都感觉皮肤在变健康，每次用都心情很好。\n\n3. 前后对比（最满意的部分）\n最满意的部分是洗脸后的皮肤状态！用之前的产品时，洗完脸如果不马上涂乳液，脸就会泛红紧绷，但这款产品用毛巾擦干水分之后也不会内干紧绷。急急忙忙冲去找基础护肤品的日常已经不再需要了。","zh-TW":"膚質：極乾性／洗完臉後像要裂開的緊繃感和白色乾屑是困擾的乾性肌\n\n1. 成分與質地\n我在化妝品成分分析App上最先確認的就是成分，看到沒有需要注意的成分，主要由溫和保濕的成分組成，讓我很放心。特別是對強化皮膚屏障和保濕特別有效的泛醇含量高達1%，感覺洗臉的同時也確實守護了肌膚水膜。質地不會太稀，是柔軟的滋養乳液般的觸感。放在乾燥粗糙的皮膚上滾動時完全沒有摩擦刺激，非常舒服。顏色也帶著淡淡的藍色，視覺上也有種被舒緩的感覺。\n2. 潔淨力與使用感\n\n老實說我不太確定潔淨力本身是不是真的很強。不過詳細說明裡有寫潔淨力不錯，而且我平常主要只擦防曬乳或輕薄底妝，所以覺得日常清潔應該沒問題，就這樣使用著。\n但使用感真的很滿意。從在臉上打圈開始就有種「啊，洗完臉一定會很水潤」的預感。而且可能因為添加了對皮膚好的泛醇這類特殊成分，每次在臉上打圈按摩時都感覺皮膚變健康了，每次用心情都會變得很好。\n\n3. 使用前後對比（最滿意的一點）\n最喜歡的部分就是洗完臉後的膚況！以前用其他產品時，洗完臉如果不馬上擦乳液，臉就會泛紅緊繃，但這款產品用毛巾擦乾水分後也完全不會內在緊繃。那種急急忙忙衝去找基礎保養品的日常也消失了。",ja:"肌タイプ：極度の乾燥肌/洗顔後の裂けそうなつっぱりと白い粉吹きが悩みの乾燥肌\n\n1. 成分とテクスチャー \nファヘ(成分チェックアプリ)でまず成分から確認しましたが、注意成分がなく、マイルドでしっとりする成分中心で構成されていて安心しました。特に肌バリア強化と水分保持に優れたパンテノールが1%も含まれているからか、確かに洗顔しながらも肌の水分膜を守ってくれる感じがします。テクスチャーはさらさらしすぎず、柔らかい栄養ローションのような質感です。乾燥してカサカサした肌にのせたとき、摩擦刺激なく優しくローリングできて本当に快適です。色も淡いブルーがかっていて視覚的にも鎮静される気分になります。\n2. 洗浄力と使用感\n\n正直、洗浄力自体がものすごく強いかはよく分かりません。それでも詳細説明に洗浄力が良いと書かれていますし、私は普段日焼け止めや軽めのベースメイク中心で塗っているので、日常的な洗浄には問題ないと思って使っています。\nその代わり使用感は本当に満足です。顔にこすった瞬間から「あ、これ洗顔した後すごくしっとりしそう」という感じがぴったり来ます。さらに肌に良いパンテノールのような特殊成分が入っているからか、顔にローリングしてマッサージするたびに肌が健康になっていく気がして、使うたびに本当に気分が良くなります。\n\n3. ビフォー&アフター(一番満足しているポイント)\n一番気に入っているのは洗顔後の肌状態です！これまでの製品を使っていたときは、洗顔直後にローションを塗らないと顔が赤くなってつっぱっていましたが、この製品は水気をタオルで拭き取った後もつっぱりがありません。急いでスキンケア用品を探して走っていたルーティンがなくなりました。",th:"ประเภทผิว: ผิวแห้งมาก / เป็นผิวแห้งที่กังวลเรื่องตึงจนเหมือนจะแตกและขุยขาวหลังล้างหน้า\n\n1. ส่วนผสมและเนื้อสัมผัส \nเช็คส่วนผสมจากแอปฮวาแฮก่อนเป็นอันดับแรก ไม่มีส่วนผสมที่ต้องระวัง มีแต่ส่วนผสมอ่อนโยนและให้ความชุ่มชื้นเป็นหลัก เลยอุ่นใจ โดยเฉพาะมีแพนธีนอลถึง 1% ที่ช่วยเสริมเกราะผิวและรักษาความชุ่มชื้นได้ดีเยี่ยม รู้สึกได้ว่าแม้ล้างหน้าก็ยังคงฟิล์มความชุ่มชื้นบนผิวไว้ เนื้อสัมผัสไม่เหลวเกินไป เป็นเนื้อโลชั่นบำรุงนุ่มๆ พอลงบนผิวที่แห้งกร้านแล้วนวดคลึงได้อย่างนุ่มนวลไม่มีแรงเสียดสี สบายผิวมาก สีก็เป็นโทนฟ้าอ่อนๆ ทำให้รู้สึกผ่อนคลายทางสายตาด้วย\n2. แรงทำความสะอาดและความรู้สึกเมื่อใช้\n\nจริงๆ ไม่แน่ใจว่าแรงทำความสะอาดจะแรงมากไหม แต่ในรายละเอียดสินค้าก็บอกว่าทำความสะอาดได้ดี แล้วปกติฉันก็ทาแค่ครีมกันแดดหรือเบสเบาๆ เลยคิดว่าเพียงพอสำหรับการทำความสะอาดประจำวัน\nแต่ความรู้สึกเมื่อใช้พอใจมากจริงๆ พอเริ่มนวดบนหน้าก็รู้สึกได้ทันทีว่า 'อ๋อ ล้างหน้าเสร็จนี่ต้องชุ่มชื้นแน่ๆ' แถมมีส่วนผสมพิเศษอย่างแพนธีนอลที่ดีต่อผิว เลยรู้สึกว่าทุกครั้งที่นวดคลึงหน้า ผิวยิ่งดูมีสุขภาพดีขึ้น อารมณ์ดีทุกครั้งที่ใช้เลย\n\n3. ก่อน & หลัง (จุดที่พอใจที่สุด)\nจุดที่ชอบที่สุดคือสภาพผิวหลังล้างหน้า! ปกติถ้าใช้ผลิตภัณฑ์อื่น ถ้าไม่รีบทาโลชั่นทันทีหลังล้างหน้า หน้าจะแดงและตึง แต่ผลิตภัณฑ์นี้แม้ซับน้ำด้วยผ้าขนหนูแล้วก็ยังไม่ตึงเลย ทำให้ไม่ต้องรีบวิ่งหาสกินแคร์มาทาอีกต่อไป"},images:[],video:null},
    {id:"qg29lKzZ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"수부지 트러블성, 압출 관리사 추천으로 오일→밀크 전환, 화이트헤드 감소",en:"Combination (oily-dehydrated), acne-prone - switched from oil to milk on an esthetician's recommendation after extractions, whiteheads reduced","zh-CN":"水油皮痘痘肌，皮肤管理师推荐从油类换成洁面乳，白头粉刺减少","zh-TW":"外油內乾長痘肌，經美容師建議從卸妝油轉為卸妝乳，白頭粉刺減少",ja:"インナードライ肌トラブル肌、エステティシャンのすすめでオイル→ミルクへ切り替え、白ニキビ減少",th:"ผิวมันขาดน้ำเป็นสิว ช่างเอสเธติกแนะนำให้เปลี่ยนจากออยล์เป็นมิลค์ หัวสิวขาวลดลง"},date:"2026-06-15",
      quote:{ko:"원래 클렌징 오일•밤을 주로 사용하던 수부지, 트러블성 피부입니다. 피지 녹이는 데에만 집중하느라 순한 클렌징보다는 강한 세정력을 중요하게 생각했었는데 이게 누적되면서 피부 장벽이 서서히 무너져 가는 게 느껴졌어요. 그래서 압출을 받으러 갔는데 관리사님이 밀크로 바꾸는 걸 추천해주셔서 고민하던 중 타이밍 좋게 이 제품을 사용하게 되었습니다. \n \n\n 2주정도 사용했고, 결론적으로는 피부결이 많이 좋아졌어요. 한 번 세안할 때 2펌프정도 사용했고 유화가 엄청 잘 된다는 느낌은 아니었지만 피부 메이크업은 깨끗하게 지워졌습니다. 기존에 사용하던 다른 밀크는 물로 헹궈낸 후에도 약간 끈적이는 느낌이 남았는데 이건 잔여감이 없어서 좋았어요. 그래도 메이크업 한 날이면 2차 세안은 습관적으로 해주는 게 좋을 것 같습니다! \n \n\n 저는 클렌징 밀크를 얼굴에 고르게 도포한 후 1분정도 기다렸다가 롤링 -> 물을 살짝 발라 롤링하며 유화 -> 헹굼 -> 약산성 클렌징 폼으로 2차 세안해줬고, 이렇게 클렌징 방법을 바꾼 후에 모공에 끼던 화이트헤드도 정말 많이 없어졌어요. 특히 이 제품은 판테놀이 함유되어 있어서 세안 후에 당기는 느낌이 적은 게 좋아요.\n \n\n 세정력도 좋고 무엇보다 자극 없이 진정되는 클렌징밀크라 정착해도 될 만한 제품이라고 느껴졌습니다.",en:"I have combination (oily-dehydrated), acne-prone skin and used to mainly use cleansing oil/balm. I was so focused on dissolving sebum that I prioritized strong cleansing power over gentleness, and I could feel that this had been gradually breaking down my skin barrier over time. So I went to get extractions done, and the esthetician recommended switching to a milk cleanser, and while I was mulling it over, the timing worked out and I started using this product. \n \n\n I've used it for about 2 weeks, and overall my skin texture has improved a lot. I used about 2 pumps per cleanse, and while it didn't emulsify amazingly, my makeup came off cleanly. With other milk cleansers I've used before, there was a slight sticky feeling left even after rinsing with water, but this one left no residue, which I liked. Still, on days I wear makeup I think it's good to make a habit of doing a second cleanse too! \n \n\n My routine is: spread the cleansing milk evenly on my face, wait about 1 minute, roll it in -> add a bit of water and roll it in to emulsify -> rinse -> second cleanse with a mildly acidic foam cleanser, and after switching to this method the whiteheads clogging my pores have really reduced a lot. In particular, this product contains panthenol, so I like that there's less of a tight feeling after cleansing.\n \n\n The cleansing power is good, and above all it's a soothing cleansing milk with no irritation, so it felt like a product worth sticking with.","zh-CN":"我本来主要用卸妆油/膏，是水油皮、痘痘肌。因为一直只专注于溶解皮脂，比起温和清洁更看重强清洁力，结果日积月累皮肤屏障渐渐感觉在崩溃。所以去做了压痘管理，管理师建议我换成洁面乳，正在犹豫的时候刚好用上了这款产品。 \n \n\n 用了大概两周，结论是肤质好了很多。每次洗脸用了大概两泵，虽然不觉得乳化特别顺滑，但妆容都能干净卸掉。之前用的其他洁面乳用水冲洗后还会留一点粘腻感，这款没有残留感，很喜欢。不过化妆的日子还是习惯性地做了二次清洁比较好！ \n \n\n 我的做法是把洁面乳均匀涂在脸上，等一分钟后打圈按摩->沾点水打圈乳化->冲洗->用弱酸性洁面泡沫二次清洁，换成这种清洁方法之后，堵在毛孔里的白头粉刺也真的减少了很多。特别是这款产品含有泛醇，洗完之后紧绷感较少，这点很喜欢。\n \n\n 清洁力也不错，最重要的是这是一款无刺激又舒缓的洁面乳，感觉是值得长期使用的产品。","zh-TW":"我原本主要用卸妝油、膏卸妝，是外油內乾、容易長痘的肌膚。因為只專注在溶解皮脂上，比起溫和卸妝，更重視強力的潔淨力，這樣長期累積下來，能感覺到皮膚屏障漸漸崩壞。後來去做粉刺清除時，美容師建議我改用卸妝乳，正在猶豫的時候，剛好時機湊巧用到了這款產品。\n\n\n 用了大約兩週，結論是膚質變好了很多。每次洗臉用大約兩壓的量，雖然沒有覺得乳化特別順，但妝容都卸得很乾淨。以前用的其他卸妝乳，用水沖洗後還是會留一點黏膩感，但這款沒有殘留感，這點很喜歡。不過化妝的日子還是習慣性做二次清潔比較好！\n\n\n 我的方式是把卸妝乳均勻塗在臉上，等大約一分鐘後打圈->沾點水打圈乳化->沖洗->用弱酸性洗面乳做二次清潔，改變卸妝方式之後，卡在毛孔裡的白頭粉刺也真的減少很多。特別是這款產品含有泛醇，洗完臉後緊繃感較少，這點很喜歡。\n\n\n 潔淨力也不錯，最重要的是能無刺激地舒緩肌膚，感覺是一款可以定番下來的卸妝乳。",ja:"もともとクレンジングオイル・バームを主に使っていたインナードライ肌、トラブル肌です。皮脂を溶かすことばかりに集中して、マイルドなクレンジングよりも強い洗浄力を重視していたのですが、これが積み重なって肌バリアが徐々に崩れていくのを感じました。それで角栓の圧出を受けに行ったら、エステティシャンさんがミルクに変えることをすすめてくれて、悩んでいたところタイミングよくこの製品を使うことになりました。 \n \n\n 2週間ほど使い、結論としては肌のキメがかなり良くなりました。1回の洗顔で2プッシュくらい使い、乳化がものすごくうまくいく感じではありませんでしたが、メイクはきれいに落ちました。今まで使っていた他のミルクは水ですすいだ後も少しべたつきが残っていましたが、これは残留感がなくて良かったです。それでもメイクをした日は2回目の洗顔を習慣的にした方が良さそうです！ \n \n\n 私はクレンジングミルクを顔全体に均一に塗った後1分ほど待ってからローリング→水を少しつけてローリングしながら乳化→すすぎ→弱酸性洗顔フォームで2回目の洗顔、という流れで使い、こうしてクレンジング方法を変えてから毛穴に詰まっていた白ニキビも本当にたくさんなくなりました。特にこの製品はパンテノールが含まれているので、洗顔後のつっぱり感が少ないのが良いです。\n \n\n 洗浄力も良く、何より刺激なく鎮静してくれるクレンジングミルクなので、定番にしても良い製品だと感じました。",th:"เดิมทีเป็นผิวมันขาดน้ำที่เป็นสิวง่าย และใช้แต่คลีนซิ่งออยล์/บาล์มเป็นหลักค่ะ เพราะมัวแต่เน้นละลายไขมันส่วนเกิน ให้ความสำคัญกับแรงทำความสะอาดที่แรงมากกว่าความอ่อนโยน พอสะสมไปนานๆ ก็รู้สึกได้ว่าเกราะผิวค่อยๆ พังลง เลยไปทำทรีตเมนต์กดสิว ช่างแนะนำให้เปลี่ยนมาใช้มิลค์ กำลังลังเลอยู่พอดีก็ได้มาลองใช้ตัวนี้ในจังหวะที่เหมาะเจาะเลยค่ะ \n \n\n ใช้มาประมาณ 2 สัปดาห์ สรุปคือผิวเนียนขึ้นเยอะมาก ล้างหน้าครั้งหนึ่งใช้ประมาณ 2 ปั๊ม แม้จะไม่ได้รู้สึกว่าอิมัลชันดีมากเป็นพิเศษ แต่เมคอัพบนผิวก็หลุดออกหมดจด มิลค์ตัวอื่นที่เคยใช้ล้างออกด้วยน้ำแล้วยังมีความเหนียวเหนอะหนะติดอยู่บ้าง แต่ตัวนี้ไม่มีคราบตกค้างเลย ชอบมาก แต่ถ้าวันไหนแต่งหน้า แนะนำให้ล้างหน้าครั้งที่สองตามความเคยชินไปด้วยจะดีกว่าค่ะ! \n \n\n ฉันจะทาคลีนซิ่งมิลค์ให้ทั่วหน้า รอประมาณ 1 นาทีแล้วนวดคลึง -> ค่อยๆ เติมน้ำแล้วนวดคลึงทำอิมัลชัน -> ล้างออก -> ล้างหน้าครั้งที่สองด้วยโฟมกรดอ่อน พอเปลี่ยนวิธีล้างหน้าแบบนี้ หัวสิวขาวที่อุดตันในรูขุมขนก็ลดลงเยอะมากจริงๆ โดยเฉพาะผลิตภัณฑ์นี้มีแพนธีนอล เลยชอบที่หลังล้างหน้าตึงน้อยลง\n \n\n แรงทำความสะอาดก็ดี แล้วที่สำคัญคือเป็นคลีนซิ่งมิลค์ที่ปลอบประโลมผิวโดยไม่ระคายเคือง รู้สึกว่าเป็นผลิตภัณฑ์ที่น่าใช้เป็นประจำได้เลยค่ะ"},images:[],video:null},
    {id:"Jk8nbgLZ",rating:4,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지 민감, 볼 건조+홍조 - 진정 도움, 트러블 없음",en:"Combination (oily-dehydrated), sensitive, dry cheeks + redness - helps with calming, no breakouts","zh-CN":"水油皮敏感肌，脸颊干燥+泛红 - 有助舒缓，不长痘","zh-TW":"外油內乾敏感，臉頰乾燥+泛紅 - 有助舒緩，不長痘痘",ja:"インナードライ敏感肌、頬の乾燥+赤み - 鎮静に役立つ、トラブルなし",th:"ผิวมันขาดน้ำแพ้ง่าย แก้มแห้ง+ผื่นแดง - ช่วยปลอบประโลม ไม่เกิดสิว"},date:"2026-06-06",
      quote:{ko:"📍피부타입: 민감성 수부지, 볼 건조+약간의 홍조\n\n✅ 클렌징 밀크 특유의 부드러운 사용감 덕분에 세안 후에도 피부가 편안하다. 건성이나 민감성 피부가 사용하기 좋다.\n\n✅ 판테놀 성분이 함유되어 있어 진정에 도움을 준다. 세안 과정에서 피부가 예민해지는 느낌이 적고, 사용 후에도 피부가 촉촉하게 유지된다.\n\n✅ 무향에 부드러운 롤링감이 좋다. 피부 마찰을 최소화하면서 메이크업과 노폐물을 녹여내는 느낌이다. 자극적인 클렌징 오일이 부담스러운 사람에게 적합하다.\n\n✅ 가벼운 베이스 메이크업은 무난하게 지워지기때문에 데일리로 사용하기 좋다. 선크림이나 쿠션 정도의 데일리 메이크업은 큰 자극 없이 깔끔하게 제거된다.",en:"📍Skin type: sensitive combination (oily-dehydrated), dry cheeks + slight redness\n\n✅ Thanks to the gentle feel unique to cleansing milk, skin stays comfortable even after cleansing. Good for dry or sensitive skin.\n\n✅ Contains panthenol, which helps with soothing. There's less of a feeling of the skin getting irritated during cleansing, and skin stays moist after use too.\n\n✅ Scentless with a gentle rolling feel. It seems to dissolve makeup and buildup while minimizing friction on the skin. Suitable for people who find harsh cleansing oils too much.\n\n✅ Light base makeup comes off without issue, so it's good for daily use. Everyday makeup like sunscreen or cushion is removed cleanly without much irritation.","zh-CN":"📍肤质：敏感性水油皮，脸颊干燥+轻微泛红\n\n✅ 得益于洁面乳特有的柔软使用感，洗脸后皮肤也很舒适。适合干性或敏感性肌肤使用。\n\n✅ 含有泛醇成分，有助于舒缓。洗脸过程中皮肤变敏感的感觉较少，用后皮肤也能保持水润。\n\n✅ 无香、顺滑的打圈感很好。能最大程度减少皮肤摩擦，同时溶解妆容和废物。适合觉得刺激性卸妆油有负担的人。\n\n✅ 轻底妆能顺利卸干净，适合日常使用。防晒或气垫程度的日常妆容能无太大刺激地干净卸除。","zh-TW":"📍膚質：敏感性外油內乾，臉頰乾燥+輕微泛紅\n\n✅ 多虧卸妝乳特有的柔順使用感，洗完臉後皮膚也很舒服。適合乾性或敏感肌使用。\n\n✅ 含有泛醇成分，有助於舒緩。洗臉過程中皮膚變敏感的感覺較少，用完之後皮膚也維持水潤。\n\n✅ 無香、滾動感柔順，這點很喜歡。感覺能將皮膚摩擦降到最低，同時溶解彩妝和老廢物。適合覺得刺激性卸妝油負擔太大的人。\n\n✅ 淡妝底妝能輕鬆卸乾淨，適合日常使用。防曬乳或氣墊等級的日常妝容，能無太大刺激地乾淨卸除。",ja:"📍肌タイプ：敏感なインナードライ肌、頬の乾燥+軽い赤み\n\n✅クレンジングミルク特有の柔らかい使用感のおかげで洗顔後も肌が快適。乾燥肌や敏感肌が使うのに良い。\n\n✅パンテノール成分が含まれていて鎮静に役立つ。洗顔中に肌が敏感になる感じが少なく、使用後も肌がしっとり保たれる。\n\n✅無香で優しいローリング感が良い。肌への摩擦を最小限にしながらメイクと老廃物を溶かしてくれる感じ。刺激の強いクレンジングオイルが負担になる人に向いている。\n\n✅軽めのベースメイクは無難に落ちるのでデイリーで使うのに良い。日焼け止めやクッションファンデ程度のデイリーメイクは大きな刺激なくきれいに落ちる。",th:"📍ประเภทผิว: ผิวมันขาดน้ำที่แพ้ง่าย แก้มแห้ง+มีผื่นแดงเล็กน้อย\n\n✅ ด้วยความรู้สึกนุ่มนวลเฉพาะตัวของคลีนซิ่งมิลค์ ทำให้ผิวสบายแม้หลังล้างหน้า เหมาะกับผิวแห้งหรือผิวแพ้ง่าย\n\n✅ มีแพนธีนอลที่ช่วยปลอบประโลมผิว ระหว่างล้างหน้าแทบไม่รู้สึกผิวไวขึ้นเลย และหลังใช้ผิวยังคงความชุ่มชื้น\n\n✅ ไม่มีกลิ่น นวดคลึงได้นุ่มนวลดี ลดแรงเสียดสีบนผิวขณะละลายเมคอัพและสิ่งสกปรกออกไป เหมาะกับคนที่รู้สึกว่าคลีนซิ่งออยล์ระคายเคืองเกินไป\n\n✅ ล้างเมคอัพเบสเบาๆ ออกได้เกลี้ยง เหมาะกับใช้เป็นประจำทุกวัน ล้างครีมกันแดดหรือคุชชั่นแบบเมคอัพประจำวันออกได้หมดจดโดยไม่ระคายเคือง"},images:[],video:null},
    {id:"A7wkN6vA",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"건성, 모공속 노폐물 98.9% 제거 수치 인용, 예민해도 트러블 없음",en:"Dry, cites a 98.9% pore-buildup removal figure, no breakouts even on sensitive days","zh-CN":"干皮，引用毛孔内废物去除率98.9%数据，敏感期也不长痘","zh-TW":"乾性，引用毛孔內老廢物98.9%去除數據，即使敏感也不長痘痘",ja:"乾燥肌、毛穴内老廃物98.9%除去という数値を引用、敏感でもトラブルなし",th:"ผิวแห้ง อ้างอิงตัวเลขกำจัดสิ่งสกปรกในรูขุมขน 98.9% ผิวแพ้ง่ายก็ไม่เกิดสิว"},date:"2026-06-15",
      quote:{ko:"블루 진정 판체놀 1% 클렌징밀크는 판테놀 히알루론산 호호바오일 세라마이드 구아이아줄렌이 주요성분으로 되어있어서 피부장벽 진정 수분공급 모공을 막지않는 보습오일로 피부컨디션은 지켜주면서 모공속 노폐물을 98.9% 제거해주는 클렌징밀크에요!\n \n\n 사용감은 되게 부드러우면서 크리미하게 발렸고 원래 쓰던 클렌징 밀크보다 촉촉했어요 다른 밀크제품은 롤링하다보다보명 흡수되서 얼굴마찰이 생기는데 이제품은 그런게 없었어요 세안후에도 깔끔한데 당김없이 촉촉해요! 뽀득뽀득하게 씻기지 않으면 약간 찝찝할때가 있는데 피부가 촉촉하면서 잔여감은 하나도 남지않았어요 워터프루프가 아닌이상 포인트 메이크업이나 베이스메이크업은 지워지도라구여\n \n\n 제피부가 화장품 조금만 잘못쓰거나 피부관리를 멋하면 예민해지고 트러블도 나는데 이 제품쓸때는 불편함은 없었던거같아요 제품 자체가 논코메도제닉테스트 민감성피부 인체적용 실험도 되어있고 세안중에 있을수있는 모든 자극을 최소화시킨 제품이라서 안심하고 썼어요 급속진정+장벽보호+순한세정 까지 완벽한 제품이에요!!",en:"The Blue Soothing 1% Panthenol Cleansing Milk's main ingredients are panthenol, hyaluronic acid, jojoba oil, ceramide, and guaiazulene, so it's a cleansing milk that soothes the barrier, supplies moisture, and uses a pore-friendly moisturizing oil that keeps your skin condition in check while removing 98.9% of pore buildup!\n \n\n The feel of use was really smooth and creamy, and it was more moisturizing than the cleansing milk I used before. With other milk products, if you keep rolling it in it gets absorbed and causes friction on the face, but there was none of that with this one. It's clean after cleansing but no tightness, just moist! Sometimes if my face doesn't feel squeaky clean it bugs me a bit, but this left my skin moist with zero residue. Unless it's waterproof, point makeup or base makeup comes right off\n \n\n My skin gets sensitive and breaks out if I use the wrong cosmetic or slack on skincare even a little, but I don't think I had any discomfort using this product. The product itself has been non-comedogenic tested and human-tested on sensitive skin, and it's designed to minimize any irritation that could occur during cleansing, so I used it worry-free. It's the complete package — instant soothing + barrier protection + gentle cleansing!!","zh-CN":"蓝色舒缓泛醇1%洁面乳的主要成分是泛醇、透明质酸、荷荷巴油、神经酰胺、蓝甘菊薁，用不堵塞毛孔的保湿油分兼顾皮肤屏障舒缓和补水，同时去除98.9%毛孔内废物的洁面乳！\n \n\n 使用感非常柔软顺滑，比原本用的洁面乳更水润。其他洁面乳打圈按摩久了会被吸收产生脸部摩擦感，这款没有这个问题，洗完脸也很干净，不紧绷还很水润！如果没有洗到吱吱作响的干净感有时会觉得有点不放心，但这款皮肤水润的同时完全没有残留感。只要不是防水彩妆，无论是点妆还是底妆都能卸干净。\n \n\n 我皮肤只要化妆品稍微用错或没好好护理就容易变敏感长痘，用这款产品的时候完全没觉得不适。产品本身做过无致痘测试和敏感肌人体测试，是把洗脸过程中可能出现的所有刺激都降到最低的产品，所以能放心使用。速效舒缓+屏障保护+温和清洁，完美的产品！！","zh-TW":"藍色舒緩泛醇1%卸妝乳的主要成分是泛醇、玻尿酸、荷荷芭油、神經醯胺、癒創木薁，是能舒緩皮膚屏障、供給水分、用不阻塞毛孔的保濕油守護膚況，同時去除98.9%毛孔內老廢物的卸妝乳！\n\n\n 使用感非常柔順、乳霜狀地推開，比我原本用的卸妝乳更水潤。其他卸妝乳打圈打一打會被吸收，產生臉部摩擦，這款完全沒有這個問題，洗完臉後乾淨清爽，不緊繃又水潤！如果沒洗到那種「咕溜咕溜」的乾淨感有時候會有點不放心，但這款皮膚水潤，完全沒有殘留感，只要不是防水產品，重點彩妝或底妝都能卸掉。\n\n\n 我的皮膚只要保養品稍微用錯或沒好好照顧就會變敏感、長痘痘，但用這款產品時完全沒有不適感。產品本身有做過非致粉刺測試、敏感肌人體實驗，是把洗臉過程中可能出現的所有刺激都降到最低的產品，用起來很放心。快速舒緩+屏障保護+溫和清潔，是很完美的產品！！",ja:"ブルー鎮静パンテノール1%クレンジングミルクは、パンテノール、ヒアルロン酸、ホホバオイル、セラミド、グアイアズレンが主要成分になっていて、肌バリア鎮静・水分供給・毛穴を詰まらせない保湿オイルで肌コンディションを守りながら毛穴内の老廃物を98.9%除去してくれるクレンジングミルクです！\n \n\n 使用感はとても柔らかくクリーミーになじんで、もともと使っていたクレンジングミルクよりしっとりしていました。他のミルク製品はローリングしていると吸収されて顔に摩擦が生じるのですが、この製品はそれがありませんでした。洗顔後もすっきりしているのにつっぱらずしっとりしています！キュッキュッと洗えていないと少しモヤモヤすることがあるのですが、肌がしっとりしていて残留感は一つも残りませんでした。ウォータープルーフでない限り、ポイントメイクやベースメイクは落ちます。\n \n\n 私の肌はコスメを少し間違って使ったり肌ケアをサボると敏感になってトラブルも出るのですが、この製品を使っているときは不快感はなかったです。製品自体がノンコメドジェニックテスト、敏感肌向けの人体適用試験もされていて、洗顔中に起こりうるすべての刺激を最小限にした製品なので安心して使いました。急速鎮静+バリア保護+マイルドな洗浄まで完璧な製品です！！",th:"บลูซูทติ้งแพนธีนอล 1% คลีนซิ่งมิลค์ มีส่วนผสมหลักอย่างแพนธีนอล ไฮยาลูรอนิกแอซิด น้ำมันโฮโฮบา เซราไมด์ กวยอาซูเลน เป็นคลีนซิ่งมิลค์ที่ปลอบประโลมเกราะผิว ให้ความชุ่มชื้น ด้วยน้ำมันบำรุงที่ไม่อุดตันรูขุมขน รักษาสภาพผิวไปพร้อมกับกำจัดสิ่งสกปรกในรูขุมขนได้ถึง 98.9%!\n \n\n ความรู้สึกเมื่อใช้นุ่มนวลและครีมมี่มาก ชุ่มชื้นกว่าคลีนซิ่งมิลค์ที่เคยใช้ มิลค์ตัวอื่นพอนวดคลึงไปนานๆ จะซึมเข้าผิวจนเกิดแรงเสียดสี แต่ตัวนี้ไม่มีปัญหานั้นเลย หลังล้างหน้าก็สะอาดแต่ไม่ตึง ชุ่มชื้นดี! ถ้าล้างไม่สะอาดจนรู้สึกฝืดๆ บางทีจะรู้สึกไม่สบายผิว แต่ตัวนี้ผิวชุ่มชื้นและไม่มีคราบตกค้างเลย เมคอัพจุดหรือเมคอัพเบสก็ล้างออกได้หมดยกเว้นวอเตอร์พรูฟ\n \n\n ผิวฉันถ้าใช้เครื่องสำอางผิดนิดหน่อยหรือดูแลผิวไม่ดีจะแพ้ง่ายและเป็นสิวทันที แต่ใช้ผลิตภัณฑ์นี้แล้วไม่รู้สึกไม่สบายผิวเลย ตัวผลิตภัณฑ์เองก็ผ่านการทดสอบนอนโคเมโดเจนิกและทดสอบการใช้จริงกับผิวแพ้ง่าย ลดการระคายเคืองทุกรูปแบบที่อาจเกิดขึ้นระหว่างล้างหน้า เลยใช้ได้อย่างอุ่นใจ ทั้งปลอบประโลมทันที+ปกป้องเกราะผิว+ทำความสะอาดอ่อนโยน ครบเครื่องสมบูรณ์แบบมากค่ะ!!"},images:[],video:null},
    {id:"qPgn1oxZ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"20대 수부지~건성 여드름성, 자극·트러블 전혀 없음",en:"20s, combination (oily-dehydrated) to dry, acne-prone - zero irritation or breakouts","zh-CN":"20多岁水油皮～干皮痘痘肌，完全没有刺激·痘痘","zh-TW":"20多歲外油內乾～乾性痘痘肌，完全不刺激、不長痘痘",ja:"20代、インナードライ肌〜乾燥肌のニキビ肌、刺激・トラブル全くなし",th:"วัย 20 ต้นๆ ผิวมันขาดน้ำ~ผิวแห้ง เป็นสิวง่าย ไม่ระคายเคือง·ไม่เกิดสิวเลย"},date:"2026-06-05",
      quote:{ko:"✔ 피부타입:\n 20대, 수부지~건성, 여드름성, 예민도 낮음\n \n\n 💬 제형\n 하늘색 클렌징 밀크로, 천천히 흘러내리는 정도의 점성을 가지고 있습니다\n \n\n 💬 사용감\n 부드럽고 잘 발리며, 롤링하다 보면 스킨케어 제품처럼 피부에 자연스럽게 녹아듭니다 이 상태에서 물을 묻히면 다시 하얗게 변하며 유화되면서 클렌징됩니다 사용 후에는 잔여감도 거의 없고, 건성 피부임에도 세안 후 당김이나 건조함이 느껴지지 않아 이 점이 특히 좋았습니다\n \n\n 💬 자극 & 트러블\n 순한 제품답게 자극이나 트러블은 전혀 발생하지 않았습니다",en:"✔ Skin type:\n 20s, combination (oily-dehydrated) to dry, acne-prone, low sensitivity\n \n\n 💬 Texture\n A sky-blue cleansing milk with a viscosity that slowly drips down\n \n\n 💬 Feel of use\n It's smooth and spreads well, and as you roll it in it naturally melts into the skin like a skincare product. When you add water at this stage it turns white again and emulsifies as it cleanses. There's almost no residue after use, and even though I have dry skin, I didn't feel any tightness or dryness after cleansing — I especially loved that.\n \n\n 💬 Irritation & breakouts\n True to being a gentle product, there was zero irritation or breakouts.","zh-CN":"✔ 肤质：\n 20多岁，水油皮～干皮，痘痘肌，敏感度低\n \n\n 💬 质地\n 天蓝色的洁面乳，具有缓慢流动程度的粘度\n \n\n 💬 使用感\n 柔软好抹开，打圈按摩时会像护肤品一样自然地融入皮肤。这个状态下沾水会重新变白并乳化，完成清洁。用完之后几乎没有残留感，虽然是干性肌肤，但洗脸后没有紧绷或干燥感，这点特别喜欢。\n \n\n 💬 刺激与痘痘\n 不愧是温和的产品，完全没有出现刺激或长痘的情况","zh-TW":"✔ 膚質：\n 20多歲，外油內乾～乾性，痘痘肌，敏感度低\n\n\n 💬 質地\n 天藍色的卸妝乳，帶有緩緩流下程度的黏稠度\n\n\n 💬 使用感\n 柔順好推，打圈時就像保養品一樣自然融入肌膚，這時沾水就會變回白色並乳化卸妝。用完之後幾乎沒有殘留感，就算是乾性肌，洗完臉也不會覺得緊繃或乾燥，這點特別喜歡\n\n\n 💬 刺激感&肌膚困擾\n 不愧是溫和的產品，完全沒有出現刺激或肌膚困擾",ja:"✔肌タイプ：\n 20代、インナードライ肌〜乾燥肌、ニキビ肌、敏感度は低め\n \n\n 💬テクスチャー\n 水色のクレンジングミルクで、ゆっくり流れる程度の粘度があります\n \n\n 💬使用感\n 柔らかくてよくなじみ、ローリングしているとスキンケア製品のように肌に自然に溶け込みます。この状態で水をつけると再び白く変わりながら乳化してクレンジングされます。使用後は残留感もほとんどなく、乾燥肌なのに洗顔後のつっぱりや乾燥を感じないのがこの製品の特に良い点でした\n \n\n 💬刺激&トラブル\n マイルドな製品らしく、刺激やトラブルは全く発生しませんでした",th:"✔ ประเภทผิว:\n วัย 20 ต้นๆ ผิวมันขาดน้ำ~ผิวแห้ง เป็นสิวง่าย แพ้ง่ายน้อย\n \n\n 💬 เนื้อสัมผัส\n เป็นคลีนซิ่งมิลค์สีฟ้าอ่อน มีความหนืดพอไหลช้าๆ\n \n\n 💬 ความรู้สึกเมื่อใช้\n นุ่มนวล ลูบไล้ง่าย พอนวดคลึงไปเรื่อยๆ จะซึมเข้าผิวอย่างเป็นธรรมชาติเหมือนสกินแคร์ พอโดนน้ำในสภาพนี้จะเปลี่ยนเป็นสีขาวและอิมัลชันเพื่อทำความสะอาด หลังใช้แทบไม่มีคราบตกค้างเลย แม้เป็นผิวแห้งก็ไม่รู้สึกตึงหรือแห้งหลังล้างหน้า ชอบจุดนี้เป็นพิเศษ\n \n\n 💬 การระคายเคือง & สิว\n สมกับเป็นผลิตภัณฑ์ที่อ่อนโยน ไม่มีการระคายเคืองหรือสิวขึ้นเลย"},images:[],video:null},
    {id:"A7w3dLnA",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"수부지, 알로에·자작나무·녹두 알레르기 체질 - 자극 없이 사용",en:"Combination (oily-dehydrated), allergic to aloe, birch, and mung bean - used without irritation","zh-CN":"水油皮，对芦荟·桦树·绿豆过敏体质 - 无刺激使用","zh-TW":"外油內乾，蘆薈‧樺樹‧綠豆過敏體質 - 無刺激使用",ja:"インナードライ肌、アロエ・シラカバ・緑豆アレルギー体質 - 刺激なく使用",th:"ผิวมันขาดน้ำ แพ้ว่านหางจระเข้·เบิร์ช·ถั่วเขียว - ใช้ได้โดยไม่ระคายเคือง"},date:"2026-06-05",
      quote:{ko:"🪴수부지\n 🪴수분증발차단제(시어버터, 스테아릭애씨드, 오일 등) 성분이 없으면 속건조를 느낍니다! 그래서 수딩크림 같이 가벼운 크림은 선호하지 않아요.\n 🪴알로에(알로에베라추출물), 자작나무(자일리톨), 녹두 성분에 알레르기가 있습니다!\n \n\n 🌳제형 & 사용감🌳\n 부드러운 로션 제형이라 피부에 자극 없이 롤링하기 좋았어요. 세안 후에도 속당김 없이 촉촉하게 마무리되는 편이라 건성이나 수부지 피부도 부담 없이 사용할 수 있을 것 같았습니다. 피부가 건조해지거나 땅기는 느낌이 없어서 데일리로 사용하기 좋았어요!\n \n\n 🌳세정력🌳\n 가벼운 메이크업이나 선크림 정도는 무난하게 지워졌어요. 다만 마스카라나 워터프루프 제품 같은 진한 포인트 메이크업은 한 번에 깔끔하게 지워지지는 않는 편이라 립앤아이리무버를 함께 사용하는 것을 추천드립니다!\n \n\n 🌳트러블 유무🌳\n 사용하는 동안 트러블이 올라오거나 피부가 뒤집어지는 일은 없었어요! \n \n\n 🌳향🌳\n 향은 거의 무향에 가까웠어요! 인위적인 향이 강한 제품을 선호하지 않는 분들이라면 만족할 것 같아요. 세안할 때 향 때문에 거슬리는 부분은 전혀 없었습니다!!",en:"🪴Combination (oily-dehydrated)\n 🪴I feel inner dryness without moisture-barrier ingredients (shea butter, stearic acid, oils, etc.)! So I don't prefer light creams like soothing creams.\n 🪴I'm allergic to aloe (aloe vera extract), birch (xylitol), and mung bean!\n \n\n 🌳Texture & feel of use🌳\n It's a soft lotion texture that rolled on the skin with no irritation. It tends to finish moist with no tightness after cleansing, so it seemed like dry or combination (oily-dehydrated) skin could use it worry-free. There's no dryness or tight feeling, so it was good for daily use!\n \n\n 🌳Cleansing power🌳\n Light makeup or sunscreen came off without issue. However, heavy point makeup like mascara or waterproof products doesn't come off completely in one go, so I'd recommend using it together with a lip & eye remover!\n \n\n 🌳Breakouts🌳\n No breakouts or flare-ups while using it! \n \n\n 🌳Scent🌳\n Nearly scentless! If you're someone who doesn't like a strong artificial scent, you'll be satisfied. There was nothing bothersome about the scent while cleansing!!","zh-CN":"🪴水油皮\n 🪴如果没有防止水分蒸发的成分（乳木果油、硬脂酸、油类等）会感到内干！所以不太喜欢舒缓面霜之类的轻质面霜。\n 🪴对芦荟（芦荟提取物）、桦树（木糖醇）、绿豆成分过敏！\n \n\n 🌳质地及使用感🌳\n 柔软的乳液质地，在皮肤上打圈无刺激，很好用。洗后也不内干，能水润收尾，感觉干皮或水油皮都能放心使用。皮肤不会变干燥或紧绷，很适合日常使用！\n \n\n 🌳清洁力🌳\n 轻妆或防晒程度能顺利卸掉。不过睫毛膏或防水产品这类浓重的点妆，一次不容易完全卸干净，建议搭配唇眼卸妆液一起用！\n \n\n 🌳是否长痘🌳\n 使用期间没有出现长痘或皮肤爆发的情况！\n \n\n 🌳香味🌳\n 几乎接近无香！不喜欢人工香味强烈的产品的人应该会满意。洗脸时完全没有因为香味而觉得不舒服的地方！！","zh-TW":"🪴外油內乾\n 🪴如果沒有防止水分蒸發的成分（乳木果油、硬脂酸、油類等）就會感到內在乾燥！所以我不太喜歡舒緩霜這類輕薄面霜。\n 🪴我對蘆薈（蘆薈萃取物）、樺樹（木糖醇）、綠豆成分過敏！\n\n\n 🌳質地&使用感🌳\n 是柔軟的乳液質地，在皮膚上打圈完全不刺激，這點很喜歡。洗完臉後也不會內在緊繃、收尾水潤，感覺乾性或外油內乾肌都能無負擔使用。皮膚不會乾燥或有緊繃感，很適合當日常用品！\n\n\n 🌳潔淨力🌳\n 淡妝或防曬乳程度都能輕鬆卸乾淨。不過像睫毛膏或防水產品這種濃重的重點彩妝，沒辦法一次卸乾淨，建議搭配唇眼卸妝液一起使用！\n\n\n 🌳肌膚困擾🌳\n 使用期間沒有出現肌膚困擾或爆痘的情況！\n\n\n 🌳香味🌳\n 幾乎接近無香！不喜歡人工香味太強的人應該也會滿意。洗臉時完全不會因為香味而覺得不舒服！！",ja:"🪴インナードライ肌\n 🪴水分蒸発防止成分(シアバター、ステアリン酸、オイルなど)が入っていないとインナードライを感じます！なのでスージングクリームのような軽めのクリームは好みません。\n 🪴アロエ(アロエベラエキス)、シラカバ(キシリトール)、緑豆成分にアレルギーがあります！\n \n\n 🌳テクスチャー&使用感🌳\n 柔らかいローションのテクスチャーで肌に刺激なくローリングしやすかったです。洗顔後もつっぱりなくしっとり仕上がる方なので、乾燥肌やインナードライ肌でも気軽に使えそうでした。肌が乾燥したりつっぱる感じがなくてデイリーで使うのに良かったです！\n \n\n 🌳洗浄力🌳\n 軽めのメイクや日焼け止め程度は無難に落ちました。ただマスカラやウォータープルーフ製品のような濃いポイントメイクは一度できれいには落ちにくいので、リップ&アイリムーバーを併用することをおすすめします！\n \n\n 🌳トラブルの有無🌳\n 使用中トラブルが出たり肌が荒れたりすることはありませんでした！ \n \n\n 🌳香り🌳\n 香りはほぼ無香に近かったです！人工的な香りが強い製品を好まない方なら満足すると思います。洗顔中に香りが気になる部分は全くありませんでした！！",th:"🪴ผิวมันขาดน้ำ\n 🪴ถ้าไม่มีส่วนผสมป้องกันการระเหยของน้ำ (เชียบัตเตอร์ สเตียริกแอซิด ออยล์ ฯลฯ) จะรู้สึกขาดน้ำทันที! เลยไม่ค่อยชอบครีมเบาๆ อย่างซูทติ้งครีม\n 🪴แพ้ว่านหางจระเข้ (สารสกัดว่านหางจระเข้), ต้นเบิร์ช (ไซลิทอล), ถั่วเขียว!\n \n\n 🌳เนื้อสัมผัส & ความรู้สึกเมื่อใช้🌳\n เป็นเนื้อโลชั่นนุ่มนวล นวดคลึงบนผิวได้ดีโดยไม่ระคายเคือง หลังล้างหน้าจบด้วยความชุ่มชื้นไม่ตึงเลย เลยคิดว่าผิวแห้งหรือผิวมันขาดน้ำก็น่าจะใช้ได้อย่างสบายใจ ไม่รู้สึกแห้งหรือตึงเลย เหมาะกับใช้เป็นประจำทุกวัน!\n \n\n 🌳แรงทำความสะอาด🌳\n ล้างเมคอัพเบาๆ หรือครีมกันแดดออกได้หมดจดดี แต่มาสคาร่าหรือเมคอัพจุดเข้มๆ แบบวอเตอร์พรูฟจะล้างไม่ออกหมดในครั้งเดียว แนะนำให้ใช้ลิปแอนด์อายรีมูฟเวอร์ร่วมด้วยค่ะ!\n \n\n 🌳เรื่องสิว🌳\n ระหว่างใช้ไม่มีสิวขึ้นหรือผิวเห่อเลย! \n \n\n 🌳กลิ่น🌳\n กลิ่นแทบไม่มีเลย! คนที่ไม่ชอบกลิ่นสังเคราะห์แรงๆ น่าจะพอใจ ตอนล้างหน้าไม่มีอะไรที่กวนใจเรื่องกลิ่นเลย!!"},images:[],video:null},
    {id:"qW4jQgXA",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지/민감, 트러블 잦은 남편도 순하다고 인정",en:"Combination (oily-dehydrated)/Sensitive skin, husband prone to breakouts admits it's gentle","zh-CN":"水油皮/敏感肌，容易长痘的老公也承认很温和","zh-TW":"外油內乾/敏感，容易長痘的老公也認證溫和",ja:"インナードライ肌/敏感肌、トラブルの多い夫もマイルドだと認める",th:"ผิวมันขาดน้ำ/แพ้ง่าย แม้แต่สามีที่เป็นสิวบ่อยก็ยอมรับว่าอ่อนโยน"},date:"2026-06-05",
      quote:{ko:"1. 제형 / 향\n 부드럽고 크리미한 밀크 타입 제형으로 주르륵 흘러내리지 않고 피부에 자극 없이 부드럽게 펴 발립니다. 일반 오일 클렌저보다 가볍고 로션 같은 사용감이라 민감한 피부도 부담 없이 사용할 수 있었어요.\n \n\n 향은 강한 인공향이 거의 느껴지지 않지만 성분의 향인지 모르겠는데, 얼굴에 바르면 살짝 별로인 냄새가 나요. \n \n\n \n\n 2. 성분\n 판테놀 1%(10,000ppm)를 함유해 세안 과정에서도 피부 진정과 보습을 동시에 챙길 수 있는 점이 인상적이었습니다. 개인적으로 판테놀 성분이 잘 맞아서 긍정적인 느낌이 있습니다.\n \n\n 그 외에도 세라마이드 등 피부 장벽을 보호하고 수분 유지에 도움을 주는 성분들이 함유되어 있어 세안 후에도 피부가 당기지 않았어요.\n \n\n 예민한 눈가나 트러블 피부도 눈 시림이나 따가움 걱정 없이 순하게 사용할 수 있었습니다.\n \n\n \n\n 3. 사용감\n 메이크업과 노폐물을 부드럽게 녹여주면서도 세안 후 피부가 건조하거나 땅기는 느낌이 거의 없었습니다.\n 유화 과정도 아주 매끄럽고 물로 씻어낸 이후 미끄덩 한 느낌이 딱히 없어서 좋았어요!\n \n\n 특히 클렌징 후 피부가 촉촉하고 편안하게 마무리되는 점이 만족스러웠고, 평소 세안 후 속당김을 자주 느끼는 예민 피부 분들에게 잘 맞을 것 같아요.\n \n\n 요즘 파데프리 메이크업으로 선크림이랑 색조만 살짝 하고 다니는데, 일상적인 선크림과 가벼운 메이크업 정도는 깔끔하게 제거되는 편이었습니다.\n (마스카라는 하고다니지 않아서 모르겠습니다.)\n \n\n 꼼꼼히 세안 안하면 성인 트러블이 자주 나는 남편도 순하고 괜찮다고 합니다.\n \n\n 4. 기타\n 뚜껑을 돌려서 열고 닫을 수 있는 점이 마음에 들었어요.\n 여행을 자주 다니는데, 별도의 캡으로 펌프를 고정시키는 것은 금방 잃어버리기 일쑤였는데, 간편히 잠글 수 있어서 샐 걱정 없이 다닐 수 있어 좋습니다. 굿굿",en:"1. Texture / Scent\nIt's a soft, creamy milk-type formula that doesn't drip down and spreads gently onto skin without irritation. It's lighter than regular oil cleansers and feels more like a lotion, so even sensitive skin could use it without worry.\n\nThere's almost no strong artificial fragrance, but I'm not sure if it's the scent of the ingredients themselves — when applied to the face, there's a slightly off smell.\n\n\n2. Ingredients\nIt contains 1% Panthenol (10,000ppm), which was impressive since it lets you soothe and moisturize skin at the same time during cleansing. Personally, Panthenol works well for me so I have a positive feeling about it.\n\nBesides that, it also contains ingredients like ceramides that protect the skin barrier and help retain moisture, so my skin didn't feel tight even after cleansing.\n\nEven sensitive under-eye areas or trouble-prone skin could use it gently without worrying about stinging or burning eyes.\n\n\n3. Application feel\nIt melted away makeup and impurities gently, while my skin barely felt dry or tight after cleansing.\nThe emulsifying process was also very smooth, and there wasn't really a slippery feeling after rinsing with water, which I liked!\n\nWhat I especially loved was that skin finished feeling moist and comfortable after cleansing — I think this would suit sensitive-skin people who often feel tightness after washing their face.\n\nThese days I do makeup without foundation, just a light sunscreen and some color makeup, and it cleanly removed my everyday sunscreen and light makeup.\n(I don't wear mascara so I can't speak to that.)\n\nEven my husband, who gets adult acne if he doesn't cleanse thoroughly, says it's gentle and fine.\n\n4. Other\nI liked that the cap twists open and closed.\nSince I travel often, separate pump-locking caps tend to get lost easily, but this one locks up easily so I can travel without worrying about leaks. Good stuff.","zh-CN":"1. 质地/香味\n 柔软细腻的洁面乳质地，不会流得到处都是，能无刺激地在皮肤上顺滑抹开。比一般油类卸妆更轻盈，是乳液般的使用感，敏感肌也能放心使用。\n \n\n 香味没什么明显的人工香，但不确定是不是成分本身的味道，涂在脸上会有一点点不太喜欢的味道。 \n \n\n \n\n 2. 成分\n 含1%（10,000ppm）泛醇，洗脸过程中也能同时兼顾皮肤舒缓和保湿，这点让人印象深刻。个人对泛醇成分比较适应，感觉是正面的。\n \n\n 除此之外还含有神经酰胺等能保护皮肤屏障、帮助保湿的成分，洗完脸皮肤也不紧绷。\n \n\n 就算是敏感的眼周或长痘的皮肤，也能温和使用，不用担心呛眼或刺痛。\n \n\n \n\n 3. 使用感\n 能温和溶解妆容和废物，同时洗完脸后几乎不会感到干燥或紧绷。\n 乳化过程也很顺滑，用水洗掉之后也没有滑腻感，很喜欢！\n \n\n 特别满意的是洁面后皮肤水润舒适的收尾感，感觉很适合平时洗脸后经常内干紧绷的敏感肌人群。\n \n\n 最近走的是裸底妆风格，只简单涂防晒和一点彩妆，日常的防晒和轻度妆容都能干净卸除。\n （因为没画睫毛膏，这部分不清楚。）\n \n\n 我老公不好好洗脸就容易长成人痘，他也说这款很温和没问题。\n \n\n 4. 其他\n 喜欢瓶盖可以旋转开合这点。\n 我经常出差旅行，那种要单独用盖子固定泵头的设计很容易弄丢，这款可以简单锁上，不用担心漏出来，很方便。赞。","zh-TW":"1. 質地／香味\n 是柔軟乳霜狀的卸妝乳質地，不會流下來，能無刺激地在皮膚上柔順推開。比一般卸妝油更輕盈，像乳液的使用感，敏感肌用起來也很放心。\n\n\n 香味幾乎聞不到強烈的人工香，不確定是不是成分本身的味道，擦在臉上會有一點點不太喜歡的味道。\n\n\n\n 2. 成分\n 含有1%（10,000ppm）泛醇，讓洗臉過程也能同時兼顧皮膚舒緩和保濕，這點印象深刻。我個人很適合泛醇成分，感覺很不錯。\n\n\n 除此之外還含有神經醯胺等能保護皮膚屏障、幫助維持水分的成分，洗完臉後皮膚也不會緊繃。\n\n\n 敏感的眼周或長痘肌膚也能溫和使用，不用擔心刺眼或刺痛。\n\n\n\n 3. 使用感\n 能柔順溶解彩妝和老廢物，同時洗完臉後幾乎感覺不到乾燥或緊繃。\n 乳化過程也很順暢，用水洗掉後也不會有滑膩的感覺，這點很喜歡！\n\n\n 特別滿意的是卸妝後皮膚水潤舒適地收尾，平常洗完臉常覺得內在緊繃的敏感肌應該會很適合。\n\n\n 最近走裸妝風格，只擦防曬乳和一點點彩妝，日常的防曬乳和淡妝都能乾淨卸除。\n （沒有畫睫毛膏所以不確定效果如何。）\n\n\n 不仔細洗臉就容易長成人痘的老公也說這款溫和沒問題。\n\n\n 4. 其他\n 瓶蓋用旋轉開闔的設計很喜歡。\n 我常常旅行，之前用另外的蓋子固定壓頭常常一下子就搞丟，這款可以簡單鎖緊，不用擔心漏出來，很不錯。讚讚",ja:"1. テクスチャー/香り\n 柔らかくクリーミーなミルクタイプのテクスチャーで、垂れることなく肌に刺激なく優しくのびます。普通のオイルクレンザーより軽くローションのような使用感なので、敏感肌でも気軽に使えました。\n \n\n 香りは強い人工香料はほとんど感じませんが、成分由来の香りなのか分かりませんが、顔に塗ると少し微妙な匂いがします。 \n \n\n \n\n 2. 成分\n パンテノール1%(10,000ppm)を含んでいて、洗顔中も肌の鎮静と保湿を同時にケアできる点が印象的でした。個人的にパンテノール成分が肌に合っていて良い印象があります。\n \n\n それ以外にもセラミドなど肌バリアを保護して水分保持を助ける成分が含まれていて、洗顔後も肌がつっぱりませんでした。\n \n\n 敏感な目元やトラブル肌でも、目にしみたりヒリヒリする心配なくマイルドに使うことができました。\n \n\n \n\n 3. 使用感\n メイクと老廃物を優しく溶かしながらも、洗顔後に肌が乾燥したりつっぱる感じがほとんどありませんでした。\n 乳化プロセスもとても滑らかで、水で洗い流した後にぬるぬるした感じが特になくて良かったです！\n \n\n 特にクレンジング後に肌がしっとり快適に仕上がる点が満足で、普段洗顔後につっぱりをよく感じる敏感肌の方に合うと思います。\n \n\n 最近はファンデーションフリーのメイクで日焼け止めとポイントメイクだけ軽くしているのですが、日常的な日焼け止めや軽めのメイク程度はきれいに落ちる方でした。\n (マスカラはしていないので分かりません。)\n \n\n きちんと洗顔しないと大人ニキビがよく出る夫も、マイルドで良いと言っています。\n \n\n 4. その他\n 蓋を回して開け閉めできる点が気に入りました。\n 旅行によく行くのですが、別途のキャップでポンプを固定するタイプはすぐなくしがちだったので、簡単にロックできて漏れる心配なく持ち歩けるのが良いです。グッド",th:"1. เนื้อสัมผัส / กลิ่น\n เป็นเนื้อมิลค์นุ่มครีมมี่ ไม่ไหลย้อย ลูบไล้บนผิวได้นุ่มนวลไม่ระคายเคือง เบากว่าคลีนซิ่งออยล์ทั่วไปและให้ความรู้สึกเหมือนโลชั่น เลยใช้ได้อย่างสบายใจแม้ผิวแพ้ง่าย\n \n\n กลิ่นแทบไม่มีกลิ่นสังเคราะห์แรงๆ แต่ไม่แน่ใจว่าเป็นกลิ่นจากส่วนผสมหรือเปล่า พอทาบนหน้าแล้วมีกลิ่นที่ไม่ค่อยชอบนิดหน่อย \n \n\n \n\n 2. ส่วนผสม\n มีแพนธีนอล 1% (10,000ppm) ทำให้ระหว่างล้างหน้าก็ยังได้ทั้งความปลอบประโลมและความชุ่มชื้นไปพร้อมกัน ประทับใจมาก ส่วนตัวแพนธีนอลถูกกับผิวฉันมาก เลยรู้สึกดีกับส่วนผสมนี้\n \n\n นอกจากนี้ยังมีเซราไมด์และส่วนผสมอื่นๆ ที่ช่วยปกป้องเกราะผิวและรักษาความชุ่มชื้น ทำให้ไม่ตึงหลังล้างหน้า\n \n\n แม้ผิวรอบดวงตาที่บอบบางหรือผิวเป็นสิวก็ใช้ได้อย่างอ่อนโยนโดยไม่ต้องกังวลเรื่องแสบตาหรือแสบผิว\n \n\n \n\n 3. ความรู้สึกเมื่อใช้\n ละลายเมคอัพและสิ่งสกปรกได้นุ่มนวล แต่หลังล้างหน้าแทบไม่รู้สึกแห้งหรือตึงเลย\n ขั้นตอนอิมัลชันก็ลื่นไหลดีมาก และหลังล้างด้วยน้ำก็ไม่มีความลื่นเหนอะหนะเหลืออยู่ ชอบมาก!\n \n\n โดยเฉพาะที่หลังล้างหน้าผิวจบด้วยความชุ่มชื้นและสบายผิว พอใจมาก คิดว่าน่าจะเหมาะกับคนผิวแพ้ง่ายที่มักรู้สึกตึงหลังล้างหน้าบ่อยๆ\n \n\n ช่วงนี้แต่งหน้าแบบไม่ใช้รองพื้น ทาแค่ครีมกันแดดกับสีสันเบาๆ เท่านั้น ล้างครีมกันแดดและเมคอัพเบาๆ ประจำวันออกได้หมดจดดี\n (ไม่ได้ทามาสคาร่าเลยไม่แน่ใจในส่วนนี้)\n \n\n แม้แต่สามีที่ถ้าล้างหน้าไม่ละเอียดจะเป็นสิวผู้ใหญ่บ่อยๆ ก็บอกว่าตัวนี้อ่อนโยนและโอเคดี\n \n\n 4. อื่นๆ\n ชอบที่ฝาเปิด-ปิดแบบหมุนได้\n เพราะเดินทางบ่อย ฝาปั๊มแบบล็อคแยกต่างหากมักจะหายง่าย แต่ตัวนี้ล็อคง่ายเลยพกพาไปไหนมาไหนได้โดยไม่ต้องกังวลว่าจะรั่วซึม ดีมากๆ"},images:[],video:null},
    {id:"JR7jmQzZ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"홍조 심함+피부염증 상태 중건성, 순한 제품만 쓸 수 있는 피부에도 적합",en:"Severe redness + skin inflammation, mid-dry (Dry) skin — suits even skin that can only tolerate gentle products","zh-CN":"泛红严重+皮肤炎症状态的中干皮，只能用温和产品的肌肤也适用","zh-TW":"泛紅嚴重+皮膚發炎狀態的中乾性，只能用溫和產品的膚質也適合",ja:"赤みが強い+皮膚炎の状態の中乾燥肌、マイルドな製品しか使えない肌にも適合",th:"ผื่นแดงรุนแรง+ผิวอักเสบ ผิวแห้งค่อนข้างมาก - เหมาะแม้กับผิวที่ใช้ได้แค่ผลิตภัณฑ์อ่อนโยนเท่านั้น"},date:"2026-06-05",
      quote:{ko:"현재 피부상태\n ; 홍조가 심함, 피부염증이 있는 상태, 순한 제품만 사용 가능함, 속건조 심한 중건성 피부\n \n 1. 점도에 대한 느낌 : 부드러운 요플레 제형\n 2. 향에 대한 느낌 : 오일 특유의 향 , 원료 그대로의 향\n 3. 색에 대한 느낌 : 푸른빛이 첨가된 흰색\n 4. 보습에 대한 느낌 : 클렌징 후 당김없이 촉촉한 편\n 5. 발림성에 대한 느낌 : 엄청 부드러움\n 5. 거품력에 대한 느낌 : 거품없는 밀크타입\n \n\n <좋았던 점>\n\n * 사용이 간편하고 편리함!!\n 클렌징 오일보다 유화 과정이 더 짧고, 사용 후에 잔여감이 많이 남지 않아 2차 세정제를 적은 양만 사용해도 충분해서 세안 부담이 적음\n \n * 연한 메이크업하는 사람에게는 만족스러운 세정력\n 클렌징 오일이나 클렌징 밤은 연한 메이크업할 때 사용하기에는 피부에 과한 자극을 주는 느낌이었는데 (세정력이 강함), 노마디아 클렌징 밀크는 피부에 자극 없이 부드럽게 롤링되고 적당한 세정력으로 데일리 세안제로 좋음\n \n * 촉촉하고 순한 세정제\n 성분을 보면 보습성분&피부장벽케어성분이 많고 피부에 자극주는 향료나 알코올같은 성분이없어서 민감한 피부가 사용하기 좋음! 홍조 피부에게도 좋을듯!!\n 확실히 세안 후에도 피부가 건조한 느낌이 다른 세안제보다 덜함. \n \n\n * 위생적인 펌프 용기\n 펌프 타입이라 사용이 편리하고 내용물을 위생적으로 사용할 수 있음",en:"Current skin condition\n; Severe redness, skin inflammation, can only use gentle products, mid-dry skin with deep dryness\n\n1. Feel of viscosity: Soft yogurt-like texture\n2. Feel of scent: A distinct oily scent, the scent of the raw ingredients themselves\n3. Feel of color: White with a hint of blue\n4. Feel of moisture: Moist without tightness after cleansing\n5. Feel of spreadability: Extremely soft\n5. Feel of lathering: Foam-free milk type\n\n<What I liked>\n\n* Easy and convenient to use!!\nThe emulsifying process is shorter than with a cleansing oil, and not much residue is left after use, so even a small amount of second cleanser is enough — less burden when washing your face.\n\n* Satisfying cleansing power for those who wear light makeup\nCleansing oils or balms felt too harsh on skin for light makeup (too strong a cleansing power), but NOMADIA's cleansing milk rolls gently on skin without irritation and has just the right cleansing power, making it great as a daily cleanser.\n\n* Moisturizing and gentle cleanser\nLooking at the ingredients, there are a lot of moisturizing and skin-barrier-care ingredients, and no fragrance or alcohol-type ingredients that irritate skin, so it's good for sensitive skin to use! Seems like it'd be good for redness-prone skin too!!\nMy skin definitely feels less dry after cleansing compared to other cleansers.\n\n* Hygienic pump container\nBeing a pump type, it's convenient to use and lets you use the contents hygienically.","zh-CN":"当前皮肤状态\n ；泛红严重、有皮肤炎症、只能使用温和产品、内干严重的中干性肌肤\n \n 1. 粘度感受：柔软的酸奶质地\n 2. 香味感受：油类特有的香味，原料本身的味道\n 3. 颜色感受：带蓝色调的白色\n 4. 保湿感受：洗后不紧绷，比较水润\n 5. 延展性感受：非常柔软\n 5. 起泡力感受：无泡沫的洁面乳类型\n \n\n <喜欢的地方>\n\n * 使用简单方便！！\n 比卸妆油乳化过程更短，用后残留感不多，二次清洁产品少量就够用，洗脸负担小\n \n * 对淡妆人群来说清洁力令人满意\n 卸妆油或卸妆膏用在淡妆上感觉对皮肤刺激过大（清洁力太强），而NOMADIA洁面乳能无刺激地顺滑打圈，清洁力适中，适合当日常洁面产品\n \n * 水润温和的清洁产品\n 从成分来看含有很多保湿成分&皮肤屏障护理成分，不含刺激皮肤的香料或酒精类成分，适合敏感肌使用！对泛红肌也应该很好！！\n 确实洗完脸后干燥感比其他洁面产品少很多。 \n \n\n * 卫生的泵头包装\n 泵头类型使用方便，内容物也能卫生地使用","zh-TW":"目前膚況\n ；泛紅嚴重、皮膚有發炎狀況、只能用溫和產品、內在乾燥嚴重的中乾性肌膚\n\n 1. 黏稠度的感覺：柔軟的優格般質地\n 2. 香味的感覺：油類特有的味道、原料本身的味道\n 3. 色澤的感覺：帶點藍色的白色\n 4. 保濕感覺：卸妝後不緊繃、偏水潤\n 5. 延展性感覺：非常柔順\n 5. 起泡力感覺：無泡沫的卸妝乳類型\n\n\n <喜歡的地方>\n\n * 使用簡單方便！！\n 比卸妝油乳化過程更短，用完之後殘留感不多，二次清潔劑只要用少量就夠了，洗臉負擔較小\n\n * 對淡妝的人來說潔淨力令人滿意\n 卸妝油或卸妝膏在卸淡妝時感覺對皮膚刺激過強（潔淨力太強），NOMADIA卸妝乳能無刺激柔順滾動，潔淨力適中，適合當日常洗臉產品\n\n * 水潤又溫和的清潔產品\n 看成分，保濕成分&皮膚屏障護理成分很多，沒有添加香料或酒精這類會刺激皮膚的成分，敏感肌用起來很不錯！泛紅肌應該也很適合！！\n 洗完臉後皮膚乾燥感確實比其他洗臉產品少。\n\n\n * 衛生的按壓瓶\n 按壓式使用方便，內容物也能保持衛生",ja:"現在の肌状態\n ；赤みが強い、皮膚炎症がある状態、マイルドな製品しか使えない、インナードライがひどい中乾燥肌\n \n 1. 粘度について：柔らかいヨーグルトのようなテクスチャー\n 2. 香りについて：オイル特有の香り、原料そのままの香り\n 3. 色について：青みがかった白色\n 4. 保湿について：クレンジング後つっぱりなくしっとりする方\n 5. のび・なじみについて：とても柔らか\n 5. 泡立ちについて：泡立たないミルクタイプ\n \n\n <良かった点>\n\n * 使用が簡単で便利！！\n クレンジングオイルより乳化プロセスが短く、使用後の残留感があまり残らないので、2回目の洗浄剤を少量使うだけで十分で洗顔の負担が少ない\n \n * 薄めのメイクをする人には満足の洗浄力\n クレンジングオイルやクレンジングバームは薄めのメイクのときに使うには肌に過剰な刺激を与える感じでしたが(洗浄力が強い)、NOMADIAクレンジングミルクは肌に刺激なく優しくローリングでき、ちょうど良い洗浄力でデイリー洗顔料として良い\n \n * しっとりマイルドな洗浄剤\n 成分を見ると保湿成分&肌バリアケア成分が多く、肌に刺激を与える香料やアルコールのような成分がないので敏感肌が使うのに良い！赤み肌にも良さそう！！\n 確かに洗顔後も肌が乾燥する感じが他の洗顔料より少ない。 \n \n\n * 衛生的なポンプ容器\n ポンプタイプなので使用が便利で、中身を衛生的に使うことができる",th:"สภาพผิวปัจจุบัน\n ; ผื่นแดงรุนแรง มีการอักเสบของผิว ใช้ได้แค่ผลิตภัณฑ์อ่อนโยนเท่านั้น เป็นผิวแห้งค่อนข้างมากที่ขาดน้ำรุนแรง\n \n 1. ความหนืด : เนื้อโยเกิร์ตนุ่มๆ\n 2. กลิ่น : กลิ่นเฉพาะของออยล์ กลิ่นวัตถุดิบดั้งเดิม\n 3. สี : สีขาวผสมโทนฟ้า\n 4. ความชุ่มชื้น : หลังทำความสะอาดไม่ตึง ค่อนข้างชุ่มชื้น\n 5. การลูบไล้ : นุ่มนวลมาก\n 5. การเกิดฟอง : เป็นแบบมิลค์ไม่มีฟอง\n \n\n <จุดที่ชอบ>\n\n * ใช้งานง่ายและสะดวก!!\n ขั้นตอนอิมัลชันสั้นกว่าคลีนซิ่งออยล์ และหลังใช้ไม่มีคราบตกค้างมาก เลยใช้ตัวทำความสะอาดครั้งที่สองในปริมาณน้อยก็เพียงพอ ทำให้ล้างหน้าได้แบบไม่มีภาระ\n \n * แรงทำความสะอาดที่น่าพอใจสำหรับคนแต่งหน้าเบาๆ\n คลีนซิ่งออยล์หรือคลีนซิ่งบาล์มให้ความรู้สึกระคายเคืองผิวเกินไปสำหรับคนแต่งหน้าเบาๆ (เพราะแรงทำความสะอาดแรงเกินไป) แต่คลีนซิ่งมิลค์ของโนมาเดียนวดคลึงบนผิวได้นุ่มนวลไม่ระคายเคือง มีแรงทำความสะอาดพอดี เหมาะเป็นตัวล้างหน้าประจำวันมาก\n \n * ตัวทำความสะอาดที่ชุ่มชื้นและอ่อนโยน\n ดูส่วนผสมแล้วมีทั้งส่วนผสมให้ความชุ่มชื้นและดูแลเกราะผิวเยอะ ไม่มีน้ำหอมหรือแอลกอฮอล์ที่ระคายเคืองผิว เหมาะกับผิวแพ้ง่ายมาก! น่าจะดีกับผิวที่มีผื่นแดงด้วย!!\n หลังล้างหน้ารู้สึกแห้งน้อยกว่าตัวทำความสะอาดอื่นๆ อย่างชัดเจน \n \n\n * ขวดปั๊มถูกสุขอนามัย\n เป็นแบบปั๊มเลยใช้งานสะดวกและใช้เนื้อผลิตภัณฑ์ได้อย่างถูกสุขอนามัย"},images:[],video:null},
    {id:"ZBz3eoGZ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"건성/민감, 장벽 약해진 상태 - 붉은기 올라올 때도 편안",en:"Dry/Sensitive, weakened barrier — comfortable even when redness flares up","zh-CN":"干皮/敏感，屏障变弱的状态 - 泛红时使用也很舒适","zh-TW":"乾性/敏感，屏障變弱狀態 - 泛紅時使用也很舒服",ja:"乾燥肌/敏感肌、バリアが弱った状態 - 赤みが出るときも快適",th:"ผิวแห้ง/แพ้ง่าย เกราะผิวอ่อนแอ - สบายผิวแม้ตอนที่มีรอยแดงขึ้น"},date:"2026-06-05",
      quote:{ko:"피부가 예민한 편이라 화장 후에 이차세안 하고 아침에 약산성 클렌징을 쓰다보니 언제부터 장벽이 많이 약해져서 피부고민이 심했어요. 메이크**, 이즈앤** 등등 순한 밀크 제품에 정착하다가 노마디아 판테놀 클렌징 밀크를 써봤는데… 이 친구 요물이네요?!!🙂\n \n\n 💗 향\n 은은한 크림향 느낌인데 자극적이지 않고 전체적으로 순한 편이에요. 인공향 강한 제품 싫어하는데 부담 없이 사용 가능했어요! 세안할 때 은근 편안한 느낌이라 좋았음🤍\n \n\n 💗 사용감\n 로션처럼 부드러운 밀크 제형이라 피부에 롤링할 때 자극이 거의 없어요. 메이크업이랑 노폐물도 부드럽게 녹여주는 느낌! 오일처럼 미끌거리거나 무겁지 않고 촉촉하게 세안되는 타입이라 아침 세안용으로도 괜찮았어요👍\n \n\n 💗 피부 느낌\n 세안 후에 제일 좋았던 건 당김이 확실히 덜하다는 점! 피부가 편안하고 유수분 안 뺏긴 느낌이라 만족했어요. 특히 붉은기 올라오거나 예민할 때 사용하기 괜찮았고, 세안 후 피부결이 매끈해 보이는 느낌도 있었어요✨\n \n\n 💗 보습감\n 클렌징하고 나면 보통 바로 스킨 발라야 하는데 이건 촉촉함이 꽤 남아있어요. 건성이나 속건조 있는 사람들한테 특히 잘 맞을 것 같고, 아침에 가볍게 세안하기에도 부담 없는 느낌!",en:"My skin is on the sensitive side, and after doing a second cleanse post-makeup and using an acidic cleanser in the mornings, my barrier got really weakened at some point and I had a lot of skin troubles. I'd settled into gentle milk-type products like Make** and Is&** when I tried NOMADIA's Panthenol Cleansing Milk... this thing is a gem?!!🙂\n\n💗 Scent\nIt has a mild creamy scent that isn't harsh and is gentle overall. I dislike products with strong artificial fragrance, but I could use this without any burden! It felt oddly comfortable while cleansing🤍\n\n💗 Application feel\nIt's a lotion-like soft milk formula, so there's almost no irritation when rolling it on skin. It feels like it gently melts away makeup and impurities! It's not slippery or heavy like an oil, and cleanses moist, so it was fine to use for morning cleansing too👍\n\n💗 Skin feel\nWhat I liked best after cleansing was that the tightness was definitely less. My skin felt comfortable and like it hadn't been stripped of oil and moisture, which was satisfying. It was especially good to use when redness was coming up or when feeling sensitive, and my skin texture looked smoother after cleansing too✨\n\n💗 Moisture feel\nUsually after cleansing I have to apply toner right away, but with this one quite a bit of moisture remains. I think it'd especially suit people with dry or dehydrated skin, and it also feels light enough for a no-burden morning cleanse!","zh-CN":"我皮肤比较敏感，化妆后要做二次清洁，早上又用弱酸性洁面，不知从什么时候起屏障变得很弱，皮肤问题很严重。用过Make**、Iz&**等温和洁面乳定妆之后，又试了NOMADIA泛醇洁面乳……这家伙真是个宝贝啊？!!🙂\n \n\n 💗 香味\n 淡淡的奶油香，不刺激，整体偏温和。我不喜欢人工香味强烈的产品，这款用起来没有负担！洗脸时有种莫名舒服的感觉，很喜欢🤍\n \n\n 💗 使用感\n 像乳液一样柔软的洁面乳质地，在皮肤上打圈时几乎没有刺激。能温和地溶解妆容和废物！不像油类那样滑腻厚重，是水润洗净的类型，早上洗脸用也很不错👍\n \n\n 💗 皮肤感受\n 洗后最喜欢的是紧绷感明显减少这点！皮肤很舒服，感觉水油没有被夺走，很满意。特别是在泛红或敏感的时候用也很舒适，洗后皮肤纹理也感觉更细腻✨\n \n\n 💗 保湿感\n 清洁之后通常要马上涂化妆水，但这款水润感留存得相当久。感觉特别适合干皮或内干人群，早上轻松洗脸时也没有负担！","zh-TW":"我皮膚偏敏感，化妝後做二次清潔、早上用弱酸性洗顏，不知道從什麼時候開始屏障變得很弱，肌膚困擾很嚴重。用過各種溫和卸妝乳品牌定番之後，試了NOMADIA泛醇卸妝乳……這孩子真是個寶啊?!!🙂\n\n\n 💗 香味\n 是淡淡的乳霜香，不刺激、整體算溫和。我很討厭人工香味太強的產品，這款完全能無負擔使用！洗臉時有種隱隱的舒適感，很喜歡🤍\n\n\n 💗 使用感\n 像乳液一樣柔軟的卸妝乳質地，在皮膚上打圈時幾乎沒有刺激。彩妝和老廢物也能柔順溶解的感覺！不像油類那樣滑膩厚重，是水潤地洗完臉的類型，當早晨洗臉用也不錯👍\n\n\n 💗 肌膚感受\n 洗完臉後最喜歡的是緊繃感明顯減少！皮膚舒適、油水沒有被搶走的感覺，很滿意。特別是泛紅或敏感的時候用起來也很舒服，洗完臉後膚質看起來也比較細緻✨\n\n\n 💗 保濕感\n 卸妝之後通常要馬上擦化妝水，但這款水潤感留存不少。乾性或內在乾燥的人應該特別適合，早上輕鬆洗臉時用也毫無負擔！",ja:"肌が敏感な方なのでメイク後は2回目の洗顔をして、朝は弱酸性のクレンザーを使っているのですが、いつの頃からかバリアがかなり弱くなって肌の悩みがひどかったです。メイク**、イズエン**など、マイルドなミルク製品に落ち着いていましたが、NOMADIAパンテノールクレンジングミルクを使ってみたら…これ、すごい子ですね?!!🙂\n \n\n 💗香り\n ほのかなクリームの香りですが刺激的でなく全体的にマイルドな方です。人工的な香りが強い製品は苦手なのですが、気軽に使えました！洗顔するとき何となく快適な感じで良かったです🤍\n \n\n 💗使用感\n ローションのように柔らかいミルクのテクスチャーで、肌にローリングするとき刺激がほとんどありません。メイクと老廃物も優しく溶かしてくれる感じ！オイルのようにぬるぬるしたり重かったりせず、しっとりと洗顔できるタイプなので朝の洗顔用としても良かったです👍\n \n\n 💗肌の感じ\n 洗顔後に一番良かったのは、つっぱりが確実に少ないという点！肌が快適で水分・油分が奪われていない感じがして満足でした。特に赤みが出たり敏感なときに使うのに良く、洗顔後に肌のキメが滑らかに見える感じもありました✨\n \n\n 💗保湿感\n クレンジングした後は普通すぐに化粧水をつけないといけませんが、これはしっとり感がかなり残っています。乾燥肌やインナードライの人に特に合いそうですし、朝軽く洗顔するのにも負担のない感じ！",th:"เป็นผิวแพ้ง่าย พอแต่งหน้าแล้วล้างหน้าครั้งที่สอง แล้วตอนเช้าใช้คลีนซิ่งกรดอ่อน เกราะผิวก็อ่อนแอลงมากจนมีปัญหาผิวหนักเลย เคยใช้มิลค์อ่อนโยนอย่าง Make**, Isandeu** เป็นประจำ แต่พอลองใช้แพนธีนอลคลีนซิ่งมิลค์ของโนมาเดียแล้ว… เจ้านี่เจ๋งจริงๆ?!!🙂\n \n\n 💗 กลิ่น\n มีกลิ่นครีมอ่อนๆ ไม่ระคายเคือง โดยรวมอ่อนโยนมาก ไม่ชอบผลิตภัณฑ์ที่มีกลิ่นสังเคราะห์แรงๆ แต่ใช้ตัวนี้ได้อย่างสบายใจ! ตอนล้างหน้ารู้สึกสบายๆ ชอบมาก🤍\n \n\n 💗 ความรู้สึกเมื่อใช้\n เป็นเนื้อมิลค์นุ่มนวลเหมือนโลชั่น นวดคลึงบนผิวแทบไม่ระคายเคืองเลย ละลายเมคอัพและสิ่งสกปรกได้นุ่มนวล! ไม่ลื่นหรือหนักแบบออยล์ แต่ล้างหน้าได้ชุ่มชื้น ใช้ล้างหน้าตอนเช้าก็โอเคดี👍\n \n\n 💗 ความรู้สึกที่ผิว\n สิ่งที่ชอบที่สุดหลังล้างหน้าคือตึงน้อยลงอย่างชัดเจน! ผิวสบายและรู้สึกว่าสมดุลน้ำ-มันไม่ถูกดึงออกไป พอใจมาก โดยเฉพาะใช้ได้ดีตอนที่มีรอยแดงขึ้นหรือผิวไวต่อสิ่งเร้า หลังล้างหน้าผิวยังดูเรียบเนียนขึ้นด้วย✨\n \n\n 💗 ความชุ่มชื้น\n ปกติล้างหน้าเสร็จต้องรีบทาโทนเนอร์ทันที แต่ตัวนี้ยังคงความชุ่มชื้นไว้พอสมควร น่าจะเหมาะกับคนผิวแห้งหรือผิวขาดน้ำเป็นพิเศษ แล้วล้างหน้าเบาๆ ตอนเช้าก็ไม่มีภาระเลย!"},images:[],video:null},
    {id:"AVpPgD6Z",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"건성+아토피 피부, 세정력·보습 균형",en:"Dry + atopic skin, balance of cleansing power and moisture","zh-CN":"干皮+特应性皮炎肌，清洁力与保湿的平衡","zh-TW":"乾性+異位性皮膚炎肌膚，潔淨力‧保濕平衡",ja:"乾燥肌+アトピー肌、洗浄力と保湿のバランス",th:"ผิวแห้ง+ผิวเป็นภูมิแพ้ผิวหนัง สมดุลระหว่างแรงทำความสะอาดกับความชุ่มชื้น"},date:"2026-06-15",
      quote:{ko:"💡예민한 피부 / 건성 + 아토피 피부💡\n🧊부드럽고 자극 없는 클렌징🧊\n \n\n 처음 사용했을 때 밀크 타입이라 피부에 부드럽게 펴 발려서 자극이 거의 느껴지지 않았어요! 건성 피부라 세안 후 당김이 심한 편인데 세안하는 동안에도 피부가 편안했고, 롤링할 때 마찰감이 적어서 좋았습니다❣️\n \n\n 🧊세안 후에도 촉촉한 마무리감🧊\n \n\n 평소 클렌징 제품을 사용하면 세안 직후 피부가 건조하고 당기는 경우가 많았는데, 이 제품은 세안 후에도 촉촉함이 남아있어서 만족스러웠어요. 특히 예민하고 건조한 피부라 세정력과 보습감을 모두 중요하게 생각하는데 균형이 잘 맞는 느낌이었습니다!\n \n\n 🧊민감 피부도 부담 없이 사용 가능🧊\n \n\n 판테놀 성분이 들어 있어서 그런지 세안 후 붉어짐이나 자극이 크게 느껴지지 않았어요. 피부 컨디션이 좋지 않은 날에도 편안하게 사용할 수 있었고, 꾸준히 사용해도 건조함이 심해지지 않아 좋았습니다. 진한 메이크업보다는 데일리 선크림이나 가벼운 메이크업 세정용으로 사용하기 딱 좋을 것 같아요✨\n \n\n 🧊총평🧊\n \n\n 건성·민감성 피부가 부담 없이 사용할 수 있는 순한 클렌징 밀크였습니다. 세안 후 촉촉한 마무리감이 가장 마음에 들었고, 피부가 예민한 날에도 편안하게 사용할 수 있어 만족스러웠어요. 자극이 적은 클렌징 제품을 찾는 분들께 추천하고 싶습니다💙",en:"💡Sensitive skin / Dry + atopic skin💡\n🧊 Gentle, non-irritating cleansing🧊\n\nThe first time I used it, being a milk type, it spread gently on my skin so I barely felt any irritation! I have dry skin so I usually feel a lot of tightness after washing my face, but my skin stayed comfortable throughout cleansing, and I liked that there was little friction while rolling it on❣️\n\n🧊 Moist finish even after cleansing🧊\n\nUsually when I use cleansing products, my skin often feels dry and tight right after washing, but with this product moisture remained even after cleansing, which was satisfying. Especially since I have sensitive, dry skin, I care about both cleansing power and moisture — and the balance felt just right!\n\n🧊 Even sensitive skin can use it without worry🧊\n\nMaybe because it contains Panthenol, I didn't feel much redness or irritation after cleansing. I could use it comfortably even on days when my skin condition wasn't great, and it didn't make dryness worse even with continued use, which I liked. Rather than heavy makeup, it seems best suited for cleansing off daily sunscreen or light makeup✨\n\n🧊 Overall review🧊\n\nIt was a gentle cleansing milk that dry, sensitive skin can use without worry. What I liked most was the moist finish after cleansing, and I could use it comfortably even on sensitive-skin days, which was satisfying. I'd recommend it to anyone looking for a low-irritation cleansing product💙","zh-CN":"💡敏感肌/干皮+特应性皮炎肌💡\n🧊柔软无刺激的清洁🧊\n \n\n 第一次用的时候是洁面乳质地，在皮肤上柔软地抹开，几乎感觉不到刺激！我是干皮，洗完脸后紧绷感比较严重，但洗脸过程中皮肤也很舒适，打圈按摩时摩擦感少，很喜欢❣️\n \n\n 🧊洗后依然水润的收尾感🧊\n \n\n 平时用清洁产品后，洗完脸马上就会觉得皮肤干燥紧绷，但这款产品洗后依然留有水润感，很满意。特别是我皮肤敏感又干燥，同时看重清洁力和保湿感，感觉两者平衡得很好！\n \n\n 🧊敏感肌也能无负担使用🧊\n \n\n 可能是含有泛醇成分，洗完脸后没有明显的泛红或刺激感。皮肤状态不好的日子用起来也很舒适，持续使用也没有加重干燥，很喜欢。比起浓妆，更适合用来卸日常防晒或轻妆✨\n \n\n 🧊总评🧊\n \n\n 是一款干皮·敏感肌都能无负担使用的温和洁面乳。最喜欢洗后水润的收尾感，皮肤敏感的日子用起来也很舒适，很满意。想找刺激少的清洁产品的人，推荐这款💙","zh-TW":"💡敏感肌／乾性+異位性皮膚炎💡\n🧊柔順無刺激的清潔🧊\n\n\n 第一次使用時因為是卸妝乳類型，在皮膚上柔順推開，幾乎感覺不到刺激！我是乾性肌，洗完臉後常常很緊繃，但洗臉過程中皮膚也很舒服，打圈時摩擦感少，很喜歡❣️\n\n\n 🧊洗完臉後水潤的收尾感🧊\n\n\n 平常用清潔產品洗完臉後常常馬上覺得乾燥緊繃，但這款產品洗完臉後水潤感還留著，讓我很滿意。特別是我皮膚敏感又乾燥，很重視潔淨力和保濕感兩者兼顧，這款的平衡感覺抓得剛剛好！\n\n\n 🧊敏感肌也能無負擔使用🧊\n\n\n 可能因為含有泛醇成分，洗完臉後沒有明顯感受到泛紅或刺激。就算膚況不好的日子用起來也很舒服，持續使用也不會讓乾燥加劇，這點很喜歡。比起濃妝，更適合用來卸日常防曬乳或淡妝✨\n\n\n 🧊總評🧊\n\n\n 是一款乾性‧敏感肌都能無負擔使用的溫和卸妝乳。最喜歡的是洗完臉後水潤的收尾感，就算皮膚敏感的日子用起來也很舒服，讓我很滿意。想找刺激較少的卸妝產品的人，我想推薦這款💙",ja:"💡敏感肌/乾燥肌+アトピー肌💡\n🧊柔らかく刺激のないクレンジング🧊\n \n\n 初めて使ったとき、ミルクタイプなので肌に優しくのびて刺激をほとんど感じませんでした！乾燥肌で洗顔後のつっぱりがひどい方ですが、洗顔中も肌が快適で、ローリングするとき摩擦感が少なくて良かったです❣️\n \n\n 🧊洗顔後もしっとりした仕上がり🧊\n \n\n 普段クレンジング製品を使うと洗顔直後に肌が乾燥してつっぱることが多かったのですが、この製品は洗顔後もしっとり感が残っていて満足でした。特に敏感で乾燥した肌なので洗浄力と保湿感を両方重視していますが、バランスが良く取れている感じでした！\n \n\n 🧊敏感肌も気軽に使える🧊\n \n\n パンテノール成分が入っているからか、洗顔後の赤みや刺激をあまり感じませんでした。肌コンディションが良くない日も快適に使えて、継続して使っても乾燥がひどくならなくて良かったです。濃いメイクよりもデイリーの日焼け止めや軽めのメイク落としに使うのにぴったりだと思います✨\n \n\n 🧊総評🧊\n \n\n 乾燥肌・敏感肌が気軽に使えるマイルドなクレンジングミルクでした。洗顔後のしっとりした仕上がりが一番気に入り、肌が敏感な日でも快適に使えて満足でした。刺激の少ないクレンジング製品を探している方におすすめしたいです💙",th:"💡ผิวแพ้ง่าย / ผิวแห้ง + ผิวเป็นภูมิแพ้ผิวหนัง💡\n🧊ทำความสะอาดอย่างนุ่มนวลไม่ระคายเคือง🧊\n \n\n ตอนใช้ครั้งแรกเป็นเนื้อมิลค์เลยลูบไล้บนผิวได้นุ่มนวล แทบไม่รู้สึกระคายเคืองเลย! เป็นผิวแห้งที่มักตึงมากหลังล้างหน้า แต่ระหว่างล้างหน้าผิวก็ยังสบาย แรงเสียดสีตอนนวดคลึงก็น้อย ชอบมาก❣️\n \n\n 🧊จบด้วยความชุ่มชื้นแม้หลังล้างหน้า🧊\n \n\n ปกติถ้าใช้ผลิตภัณฑ์คลีนซิ่งอื่น หลังล้างหน้าทันทีผิวมักจะแห้งและตึง แต่ผลิตภัณฑ์นี้หลังล้างหน้าก็ยังคงความชุ่มชื้นไว้ พอใจมาก โดยเฉพาะเป็นผิวแพ้ง่ายและแห้ง เลยให้ความสำคัญทั้งแรงทำความสะอาดและความชุ่มชื้น รู้สึกว่าสมดุลกันดีมาก!\n \n\n 🧊ผิวแพ้ง่ายก็ใช้ได้อย่างสบายใจ🧊\n \n\n อาจเพราะมีแพนธีนอล หลังล้างหน้าแทบไม่รู้สึกแดงหรือระคายเคืองเลย แม้วันที่สภาพผิวไม่ดีก็ใช้ได้อย่างสบายผิว ใช้ต่อเนื่องก็ไม่ทำให้แห้งมากขึ้น ชอบมาก เหมาะกับใช้ล้างครีมกันแดดประจำวันหรือเมคอัพเบาๆ มากกว่าเมคอัพเข้มข้น✨\n \n\n 🧊สรุป🧊\n \n\n เป็นคลีนซิ่งมิลค์อ่อนโยนที่ผิวแห้ง·แพ้ง่ายใช้ได้อย่างสบายใจ ชอบที่สุดคือจบด้วยความชุ่มชื้นหลังล้างหน้า แม้วันที่ผิวไวต่อสิ่งเร้าก็ใช้ได้อย่างสบายผิว พอใจมาก อยากแนะนำให้คนที่กำลังหาผลิตภัณฑ์คลีนซิ่งที่ระคายเคืองน้อยลองใช้ดูค่ะ💙"},images:[],video:null},
    {id:"ZN6yp0jZ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"민감·건성, 환절기·피곤한 날 장벽 약화 - 붉은기 심해지지 않음",en:"Sensitive/Dry, weakened barrier in season changes or tired days — redness doesn't worsen","zh-CN":"敏感·干皮，换季·疲惫日屏障变弱 - 泛红不会加重","zh-TW":"敏感‧乾性，換季‧疲憊日屏障變弱 - 泛紅不會加劇",ja:"敏感肌・乾燥肌、季節の変わり目・疲れた日のバリア低下 - 赤みが悪化しない",th:"แพ้ง่าย·ผิวแห้ง เกราะผิวอ่อนแอช่วงเปลี่ยนฤดูกาล·วันที่เหนื่อยล้า - รอยแดงไม่แย่ลง"},date:"2026-06-05",
      quote:{ko:"😊 피부 타입 / 컨디션\n 평소 세안 후 피부가 쉽게 당기고 붉어지는 민감·건성 피부입니다. 특히 환절기나 피곤한 날에는 피부 장벽이 약해져 자극에 예민하게 반응하는 편이라, 세정력뿐 아니라 세안 후 편안한 사용감을 중요하게 생각합니다.\n 🗓️ 사용 기간 / 사용 방법\n 약 2주간 아침, 저녁 세안 시 사용했습니다. 물기 없는 손에 적당량을 덜어 얼굴 전체에 부드럽게 마사지하듯 롤링한 뒤, 미온수로 유화 과정을 거쳐 깨끗하게 헹궈냈습니다. 메이크업을 한 날에는 1차 세안 단계로 활용했습니다.\n ✨ 효과 / 변화 포인트\n 사용 후 가장 만족스러웠던 점은 세안 직후 피부가 편안하다는 점이었습니다. 일반 클렌저 사용 후 느껴지던 땅김이 적었고, 피부가 한층 부드럽고 촉촉하게 유지되는 느낌을 받았습니다. 피부가 예민한 날에도 자극 없이 사용할 수 있었으며, 세안 후 붉은기가 심해지지 않아 부담 없이 손이 가는 제품이었습니다. 꾸준히 사용하면서 피부가 건조해지는 느낌이 줄어들어 만족스러웠습니다.\n 🧴 질감 / 향 / 사용감\n 부드러운 밀크 타입 제형으로 피부에 닿았을 때 자극 없이 부드럽게 펴 발립니다. 롤링하는 동안 마찰감이 적어 민감한 피부도 편안하게 사용할 수 있었으며, 세안 후에는 촉촉한 마무리감을 느낄 수 있었습니다. 향은 강하지 않고 은은하거나 거의 무향에 가까운 편이라 향료에 민감한 사람도 부담 없이 사용할 수 있습니다.\n 📝 총평\n 블루 진정 판테놀 1% 클렌징 밀크는 세정과 진정을 동시에 챙기고 싶은 민감성 피부에게 잘 맞는 제품이라고 느꼈습니다. 세안 후에도 피부가 편안하고 촉촉하게 유지되어 건성·민감성 피부가 데일리 클렌저로 사용하기 좋았습니다. 자극적인 세안으로 인해 피부가 쉽게 건조해지는 분들에게 특히 추천하고 싶은 제품입니다.",en:"😊 Skin type / condition\nI have sensitive, dry skin that usually feels tight and turns red easily after cleansing. Especially during season changes or on tired days, my skin barrier weakens and reacts sensitively to irritation, so besides cleansing power, I care a lot about a comfortable feel after washing.\n🗓️ Duration / method of use\nI used it for about 2 weeks for morning and evening cleansing. I took an appropriate amount on dry hands, gently massaged and rolled it over my whole face, then rinsed it off thoroughly after the emulsifying process with lukewarm water. On days I wore makeup, I used it as the first cleansing step.\n✨ Effects / changes\nWhat satisfied me most after use was that my skin felt comfortable right after cleansing. There was less tightness than what I usually feel after regular cleansers, and my skin felt smoother and stayed more moist. I could use it without irritation even on sensitive days, and redness didn't worsen after cleansing, so it became a product I reached for without hesitation. With continued use, I felt less dryness, which was satisfying.\n🧴 Texture / scent / feel\nIt's a soft milk-type formula that spreads gently on skin without irritation. There was little friction while rolling it on, so even sensitive skin could use it comfortably, and I could feel a moist finish after cleansing. The scent isn't strong — it's mild to almost scentless — so even people sensitive to fragrance can use it without worry.\n📝 Overall review\nI felt that the Blue Calming Panthenol 1% Cleansing Milk suits sensitive skin looking to cleanse and soothe at the same time. My skin stayed comfortable and moist even after cleansing, so it was good as a daily cleanser for dry, sensitive skin. I'd especially recommend it to people whose skin dries out easily from harsh cleansing.","zh-CN":"😊 肤质/状态\n 平时洗脸后皮肤容易紧绷泛红的敏感·干性肌肤。特别是换季或疲惫的日子皮肤屏障会变弱，对刺激反应敏感，所以除了清洁力，我更看重洗后舒适的使用感。\n 🗓️ 使用时间/使用方法\n 早晚洁面时使用了大约两周。在干燥的手上取适量，在整个脸部像按摩一样柔软打圈，然后用温水乳化，彻底冲洗干净。化妆的日子用作第一次清洁。\n ✨ 效果/变化点\n 用后最满意的是洗脸后皮肤立刻感到舒适这点。用一般洁面产品后会有的紧绷感变少了，皮肤感觉更柔软水润。皮肤敏感的日子也能无刺激使用，洗后泛红没有加重，是让人放心使用的产品。持续使用后皮肤干燥的感觉减少了，很满意。\n 🧴 质感/香味/使用感\n 柔软的洁面乳质地，接触皮肤时能无刺激地柔软抹开。打圈按摩时摩擦感少，敏感肌也能舒适使用，洗后能感受到水润的收尾感。香味不浓，淡雅或近乎无香，对香料敏感的人也能放心使用。\n 📝 总评\n 感觉蓝色舒缓泛醇1%洁面乳很适合想同时兼顾清洁和舒缓的敏感肌。洗后皮肤依然舒适水润，干性·敏感性肌肤当日常洁面产品很合适。特别推荐给容易因刺激性洁面而皮肤干燥的人。","zh-TW":"😊 膚質／膚況\n 平常洗完臉皮膚容易緊繃泛紅，是敏感‧乾性肌膚。特別是換季或疲憊的日子，皮膚屏障會變弱，對刺激反應比較敏感，所以除了潔淨力之外，我也很重視洗臉後舒服的使用感。\n 🗓️ 使用期間／使用方法\n 大約使用了兩週的早晚洗臉。在乾燥的手上取適量，在整張臉上柔順按摩打圈，再用溫水乳化並徹底沖洗乾淨。化妝的日子當作一次卸妝使用。\n ✨ 效果／變化重點\n 使用後最滿意的一點是洗完臉後皮膚很舒服。一般潔顏產品洗完常有的緊繃感減少了，皮膚感覺更柔軟水潤地維持著。皮膚敏感的日子也能無刺激使用，洗完臉後泛紅不會加劇，是能安心使用的產品。持續使用後皮膚乾燥的感覺減少了，讓我很滿意。\n 🧴 質地／香味／使用感\n 是柔軟的卸妝乳質地，接觸皮膚時能無刺激地柔順推開。打圈時摩擦感較少，敏感肌也能舒服使用，洗完臉後能感受到水潤的收尾感。香味不濃，偏淡雅或幾乎無香，對香料敏感的人也能無負擔使用。\n 📝 總評\n 藍色舒緩泛醇1%卸妝乳，我覺得很適合想同時兼顧清潔和舒緩的敏感肌。洗完臉後皮膚依然舒適水潤，乾性‧敏感肌當日常卸妝乳使用很不錯。特別推薦給容易因為刺激性洗臉而變乾燥的人。",ja:"😊肌タイプ/コンディション\n 普段洗顔後に肌がすぐつっぱって赤くなる敏感・乾燥肌です。特に季節の変わり目や疲れた日は肌バリアが弱くなって刺激に敏感に反応する方なので、洗浄力だけでなく洗顔後の快適な使用感を重視しています。\n 🗓️使用期間/使用方法\n 約2週間、朝と夜の洗顔時に使用しました。水気のない手に適量を取り、顔全体を優しくマッサージするようにローリングした後、ぬるま湯で乳化プロセスを経てきれいにすすぎました。メイクをした日は1回目の洗顔段階として活用しました。\n ✨効果/変化のポイント\n 使用後、一番満足だった点は洗顔直後に肌が快適だということでした。普通のクレンザー使用後に感じていたつっぱりが少なく、肌がより柔らかくしっとり保たれる感じを受けました。肌が敏感な日でも刺激なく使うことができ、洗顔後に赤みが悪化しないので気兼ねなく手が伸びる製品でした。継続して使ううちに肌が乾燥する感じが減って満足でした。\n 🧴質感/香り/使用感\n 柔らかいミルクタイプのテクスチャーで、肌に触れたとき刺激なく優しくのびます。ローリングしている間摩擦感が少なく敏感肌も快適に使うことができ、洗顔後にはしっとりした仕上がりを感じられました。香りは強くなくほのか、あるいはほぼ無香に近い方なので、香料に敏感な人も気兼ねなく使えます。\n 📝総評\n ブルー鎮静パンテノール1%クレンジングミルクは、洗浄と鎮静を同時にケアしたい敏感肌に合う製品だと感じました。洗顔後も肌が快適でしっとり保たれ、乾燥肌・敏感肌がデイリークレンザーとして使うのに良かったです。刺激的な洗顔で肌がすぐ乾燥してしまう方に特におすすめしたい製品です。",th:"😊 ประเภทผิว / สภาพผิว\n ปกติเป็นผิวแพ้ง่าย·ผิวแห้งที่ตึงและแดงง่ายหลังล้างหน้า โดยเฉพาะช่วงเปลี่ยนฤดูกาลหรือวันที่เหนื่อยล้า เกราะผิวจะอ่อนแอลงและไวต่อสิ่งเร้ามากขึ้น เลยให้ความสำคัญทั้งแรงทำความสะอาดและความรู้สึกสบายผิวหลังล้างหน้า\n 🗓️ ระยะเวลา / วิธีใช้\n ใช้ล้างหน้าตอนเช้าและเย็นเป็นเวลาประมาณ 2 สัปดาห์ ตักปริมาณพอเหมาะลงบนมือแห้ง นวดคลึงทั่วใบหน้าอย่างนุ่มนวลเหมือนนวดหน้า แล้วเติมน้ำอุ่นทำอิมัลชันและล้างออกจนสะอาด วันที่แต่งหน้าใช้เป็นการล้างหน้าครั้งแรก\n ✨ ผล / จุดเปลี่ยนแปลง\n สิ่งที่พอใจที่สุดหลังใช้คือผิวสบายทันทีหลังล้างหน้า ตึงน้อยกว่าที่เคยรู้สึกหลังใช้คลีนเซอร์ทั่วไป ผิวรู้สึกนุ่มนวลและชุ่มชื้นมากขึ้น แม้วันที่ผิวไวต่อสิ่งเร้าก็ใช้ได้โดยไม่ระคายเคือง หลังล้างหน้ารอยแดงไม่แย่ลง เลยหยิบใช้ได้อย่างสบายใจ ใช้ต่อเนื่องแล้วรู้สึกว่าผิวแห้งน้อยลง พอใจมาก\n 🧴 เนื้อสัมผัส / กลิ่น / ความรู้สึกเมื่อใช้\n เป็นเนื้อมิลค์นุ่มนวล พอสัมผัสผิวแล้วลูบไล้ได้อย่างนุ่มนวลไม่ระคายเคือง แรงเสียดสีระหว่างนวดคลึงน้อย แม้ผิวแพ้ง่ายก็ใช้ได้อย่างสบายผิว หลังล้างหน้ารู้สึกได้ถึงความชุ่มชื้น กลิ่นไม่แรง อ่อนๆ หรือแทบไม่มีกลิ่นเลย คนที่แพ้น้ำหอมง่ายก็ใช้ได้อย่างสบายใจ\n 📝 สรุป\n รู้สึกว่าบลูซูทติ้งแพนธีนอล 1% คลีนซิ่งมิลค์เหมาะกับผิวแพ้ง่ายที่อยากได้ทั้งการทำความสะอาดและการปลอบประโลมไปพร้อมกัน หลังล้างหน้าผิวยังสบายและชุ่มชื้น เหมาะกับผิวแห้ง·แพ้ง่ายที่ใช้เป็นคลีนเซอร์ประจำวัน อยากแนะนำเป็นพิเศษสำหรับคนที่ผิวแห้งง่ายจากการล้างหน้าที่ระคายเคือง"},images:[],video:null},
    {id:"Zm2lQzDq",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지, 여름철 뾰루지 대폭발+열감 홍조 - 자극 전혀 없이 시원한 사용감",en:"Combination (oily-dehydrated), summer breakout explosion + heat redness — cooling feel with zero irritation","zh-CN":"水油皮，夏季痘痘大爆发+发热泛红 - 完全无刺激，清凉使用感","zh-TW":"外油內乾，夏季痘痘大爆發+泛熱泛紅 - 完全無刺激的清涼使用感",ja:"インナードライ肌、夏場のニキビ大爆発+ほてり・赤み - 刺激ゼロで涼しい使用感",th:"ผิวมันขาดน้ำ สิวระเบิดหน้าร้อน+ร้อนวูบวาบ ผื่นแดง - ไม่ระคายเคืองเลย รู้สึกเย็นสบาย"},date:"2026-06-05",
      quote:{ko:"피부타입 : 여름철 뾰루지 대폭발 열감 개많은 홍조 수부지\n \n\n 1) 일단 가장 큰 장점 시원함. 블루 진정 이름에 맞게 하루종일 피곤해져있는 피부에 도포하고 문질문질했을때 답답하지 않고 적당히 시원함 쿨링까진 아니긴한데 어차피 예민피부엔 그렇게 화확적 쿨링 좋지도 않고 이정도면 대만족\n \n\n 2) 자극xxxx . 자극 진짜 없음 원래 예민피부에는 클렌징 밀크쓰라고 하잖음 ? 워낙 예민피부라 갑자기 피부 따갑고 할때 클오 대신에 얘 써줬는데 하나도 안따가웠음\n \n\n 3) 촉촉. 유분 x 촉촉이라서 나같은 수부지 지성피부들써도 번들거리지 않고 수분감만 남길거임\n \n\n 왠만하면 별 5개안주는데 제 피부엔 진짜 잘맞고 마무리감도 산뜻했어요 ! 완전 추천 ㅋㅋㅋ",en:"Skin type: combination (oily-dehydrated) with a summer breakout explosion, tons of heat-related redness\n\n1) The biggest advantage first — coolness. True to the name Blue Calming, when I applied it and rubbed it into skin that felt exhausted all day, it wasn't stuffy and felt appropriately cool. Not quite chilling-cool, but honestly that kind of chemical cooling isn't great for sensitive skin anyway, so this level is plenty satisfying\n\n2) Irritation — none, none, none, none. Seriously no irritation. You're supposed to use cleansing milk for sensitive skin, right? Since my skin is so sensitive, when it suddenly starts stinging, I used this instead of a cleansing oil, and it didn't sting at all\n\n3) Moist. No oiliness, just moisture, so combination-oily types like me can use it without getting greasy — it just leaves a moisture feel\n\nI barely ever give 5 stars, but this really suits my skin, and the finish was refreshing too! Totally recommend it lol","zh-CN":"肤质：夏季痘痘大爆发、发热感很重、泛红的水油皮\n \n\n 1) 首先最大的优点是清凉感。名副其实的蓝色舒缓，涂在整天疲惫的皮肤上打圈时不闷，有种恰到好处的清凉，虽然算不上冰凉降温，但反正敏感肌也不适合那种化学冰凉感，这种程度就已经很满意了\n \n\n 2) 刺激xxxx。真的完全没有刺激。不是都说敏感肌要用洁面乳吗？我皮肤本来就很敏感，突然刺痛的时候用这个代替卸妆油，完全不刺痛\n \n\n 3) 水润。不油腻却水润，所以像我这种水油皮油性肌肤用也不会出油，只会留下水润感\n \n\n 我一般不太给五星，但这款真的很适合我的皮肤，收尾感也很清爽！强烈推荐哈哈哈","zh-TW":"膚質：夏季痘痘大爆發、泛熱又超多泛紅的外油內乾\n\n\n 1) 首先最大的優點是清涼感。符合「藍色舒緩」這個名字，塗在一整天疲憊的皮膚上打圈時，不會悶，有適度的清涼感，雖然不到冰涼的程度，反正敏感肌也不適合太化學性的冰涼感，這樣程度就非常滿意了\n\n\n 2) 刺激xxxx。真的完全沒有刺激，本來不是說敏感肌要用卸妝乳嗎？我皮膚超級敏感，突然變得刺痛的時候用這個代替卸妝油，結果完全不刺痛\n\n\n 3) 水潤。不油，是水潤型，所以像我這種外油內乾油性肌用了也不會出油，只會留下水潤感\n\n\n 我通常不太給五星，但這款真的很適合我的皮膚，收尾感也很清爽！超級推薦ㅋㅋㅋ",ja:"肌タイプ：夏場ニキビ大爆発、ほてりと赤みだら
