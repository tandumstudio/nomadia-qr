别容易紧绷刺激，这款含荷荷巴油，洗完脸马上就能感受到脸很水润呵呵。\n\n最近发现洗完脸也没有泛红了，我打算就定妆在这套清洁产品上了!!推荐推荐!!👍👍","zh-TW":"我平常泛紅就很嚴重，洗完臉馬上就變番茄臉，是超級敏感肌ㅜㅜ但同時又是痘痘肌，不能用清潔效果太弱的產品ㅜㅠ太溫和的話殘留物洗不乾淨，反而讓本來就很多的痘痘更嚴重……ㅜㅜ\n\n以前是卸妝油+洗面乳雙重清潔，聽說這樣對皮膚屏障真的不好\n所以最近改成只用卸妝油清潔，但你知道的，最後總是有點滑膩……好像沒洗乾淨的感覺……\n有點不舒服\n\n所以我現在同時使用NOMADIA卸妝乳和氣泡潔顏乳，完全不刺激，感覺很棒。聽說眼妝濃的人要另外用卸妝液，但我幾乎不畫眼妝，跟我超級搭……💕\n\n乾性肌的人做二次清潔時特別容易緊繃刺激，但這款含有荷荷芭油，洗完臉後臉也感覺水潤\n\n最近發現洗完臉後也不泛紅了，我打算把清潔產品定番在這裡了!!推薦推薦!!👍👍",ja:"私は普段から赤みもひどいのですが、洗顔直後にはトマトになってしまう超敏感肌です、涙。だからといってニキビ肌なのでクレンジング効果が落ちる製品も使えません、涙。あまりマイルドすぎると残留物が残って、ただでさえ多いトラブルがさらに出るんです…涙\n​\n以前はクレンジングオイルにフォームで2回目の洗顔をしていましたが、肌バリアには本当に良くないそうです\nそれで最近はクレンジングオイルだけでクレンジングしていましたが、また何というか、最後にぬるついて…ちょっと洗いきれていない感じ…?\nモヤモヤ\n\nそれでNOMADIAのクレンジングミルクとバブルクレンザーを一緒に使っていますが、刺激がなくてとても良い感じです。アイメイクが濃い人はリムーバーを別にするようにとありますが、私はアイメイクをほとんどしないので私にぴったり…💕\n\n乾燥している方は2回目の洗顔をすると特にもっと肌がつっぱって刺激が強いですが、これはホホバオイルが入っているので洗顔直後も顔がしっとりする感じがしました、笑\n\n最近洗顔直後も赤みがないのを見ると、私のクレンジング製品はここに定着する予定です！！おすすめおすすめ！！👍👍",th:"ฉันเป็นผิวที่มีผื่นแดงตลอดอยู่แล้ว แต่พอล้างหน้าทันทีจะกลายเป็นมะเขือเทศเลย เป็นผิวแพ้ง่ายสุดๆㅜㅜ แต่ก็เป็นผิวเป็นสิวด้วย เลยใช้ผลิตภัณฑ์ที่ทำความสะอาดไม่ดีก็ไม่ได้ㅜㅠ ถ้าอ่อนโยนเกินไปจะมีคราบตกค้างจนสิวที่มีอยู่แล้วยิ่งขึ้นมากกว่านี้...ㅜㅜ\n​\nเดิมทีล้างหน้าด้วยคลีนซิ่งออยล์แล้วล้างซ้ำด้วยโฟม แต่ได้ยินว่าไม่ดีต่อเกราะผิวเลยจริงๆ\nเลยเปลี่ยนมาล้างด้วยคลีนซิ่งออยล์อย่างเดียว แต่ก็รู้ใช่ไหมคะว่าสุดท้ายจะลื่นเหนอะหนะ... รู้สึกเหมือนล้างไม่สะอาด...?\nไม่สบายผิว\n\nเลยใช้คลีนซิ่งมิลค์กับบับเบิลคลีนเซอร์ของโนมาเดียคู่กัน ไม่ระคายเคืองเลยชอบมาก คนที่แต่งตาเข้มข้นเขาบอกให้ใช้รีมูฟเวอร์แยก แต่ฉันแทบไม่แต่งตา เลยเข้ากันดีมาก...💕\n\nคนผิวแห้งถ้าล้างหน้าครั้งที่สองมักจะตึงและระคายเคืองมากเป็นพิเศษ แต่ตัวนี้มีน้ำมันโฮโฮบา พอล้างหน้าเสร็จหน้าก็ยังชุ่มชื้นอยู่เลยค่ะ ฮ่าๆ\n\nช่วงนี้ล้างหน้าเสร็จแล้วไม่มีผื่นแดงเลย ฉันตัดสินใจแล้วว่าจะลงเอยที่ผลิตภัณฑ์คลีนซิ่งตัวนี้!! แนะนำ แนะนำเลย!!👍👍"},images:["thumbnail/reviews/A11oQOWA_2.webp"],video:"thumbnail/reviews/A11oQOWA.mp4"},
    {id:"ZjK582Bq",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"장벽 손상으로 인한 간지러움 - 제품 교체 후 간지러움 해결",en:"Itchiness from barrier damage — itchiness resolved after switching products","zh-CN":"屏障受损导致的发痒 - 换用产品后发痒问题解决","zh-TW":"屏障受損引起的搔癢感 - 換用產品後搔癢感解決",ja:"バリア損傷による痒み - 製品を変えてから痒みが解決",th:"อาการคันจากเกราะผิวเสียหาย - เปลี่ยนผลิตภัณฑ์แล้วหายคัน"},date:"2026-07-03",
      quote:{ko:"[요즘 피부 고민]\n\n-얼굴이 조금 간지럽다? \n-이게 뭔가 좀 장벽이 무너졌거나\n건조한 것에서 오는 것인지 원인을 알 수 없었는데\n-이 클렌저를 바꾸고 그것의 원인을 깨달음.\n그것은 장벽이 무너지는 세안을 하고 있었기 때문.\n\n[일주일 사용후기]\n\n[제형]\n\n-(다른 버블 클렌저 및 버블 스킨도 쓰고 있는데)\n-노마디아 버블 클렌저는 듀얼 마이크로라는 제품명 답게 \n되게 곱고 쫀쫀한 거품이라는 생각이 직관적으로 보자마자 느껴짐. \n육안으로  봐도 굉장히 밀도 있는 거품임\n-물 뭍히기 전에 거품을 그냥 만져 봤을 때 퐁신퐁신함과 \n쫀쫀 약간 크리미함까지도 느껴졌음. \n커피 스팀 밀크 할때 벨벳 밀크 점도 느낌. \n\n[사용감]\n\n-진짜 딱 생각드는 한 문장 **매끈매끈하다?!**\n-다른 화장품 사용하는거 다 똑같고 \n이것만 바꾼 상태인데 뭔가 매끈매끈 느낌이 들어서\n피부결이 달라졌다고 느껴짐.\n-특히 세안후 당김이 느껴지지 않아서 좋았음\n-또 피부 고민이었던 간지러움이 확 잡힘. 신기....\n\n[장점]\n\n- 세안 시 롤링이 간편하고 퐁신한 거품에 \n손세안도 더 부드럽게 너무 강하지 않게 하게 되는 장점이 있음.\n-여드름성 피부, 민감성 피부도 쓸 수 있도록 순한 것 같음 (여드름 안남)\n-약국, 병원 전용으로도 파는 제품이라고 하니 더 믿음이 가는 느낌.\n-클렌징 밀크 후 버블로 2차세안을 할 수 있을까 세정력이 궁금했는데\n풀메이크업 후 클렌징밀크 + 아이클렌징 + 노마디아 버블 클렌저 2차세안해주니\n깔끔하게 잘 지워짐.  2차 세안의 자극을 줄여줘서 피부장벽 보호가 잘 되는 것 같음.\n-호호바 + 판테놀이 피부에 건조함에 도움이 되는데\n2차 세안 클렌져 단계에서도 들어가서 촉촉하게 세안 가능. \n-향도 거의 많이 느껴지지 않아서 좋았음",en:"[Recent skin concerns]\n\n-My face is a little itchy?\n-I couldn't figure out whether it was from\nsome barrier damage or just dryness,\n-but after switching to this cleanser, I realized the cause.\nIt was because I'd been cleansing in a way that was breaking down my barrier.\n\n[One-week review]\n\n[Texture]\n\n-(I also use other bubble cleansers and bubble toners)\n-True to its name \"Dual Micro,\" NOMADIA's bubble cleanser has\nfoam that felt intuitively fine and springy the moment I saw it.\nEven visually it's a really dense foam\n-Before adding water, just touching the foam felt\nfluffy and even a bit creamy.\nLike the velvet milk texture when steaming coffee milk.\n\n[Feel during use]\n\n-Honestly the one phrase that comes to mind is **smooth, smooth?!**\n-Everything else in my routine stayed the same and\nI only changed this, and somehow it felt so smooth\nthat my skin texture felt different.\n-Especially loved that there was no tightness after cleansing\n-Also, my itchiness concern got resolved completely. Surprising....\n\n[Pros]\n\n- Rolling it on during cleansing is easy, and the fluffy foam\nmakes hand-cleansing gentler, not too harsh — that's an advantage.\n-Seems gentle enough for acne-prone and sensitive skin (no breakouts)\n-Knowing it's also sold exclusively through pharmacies and clinics gives it more credibility.\n-I was curious whether it would have enough cleansing power as a second cleanse after cleansing milk,\nso after full makeup I did cleansing milk + eye makeup remover + NOMADIA bubble cleanser as a second cleanse,\nand it cleaned off cleanly. It reduces irritation from the second cleanse, so it seems to protect the skin barrier well.\n-Jojoba + Panthenol help with skin dryness,\nand since they're in this second-cleanse-stage cleanser too, you can cleanse moisturized.\n-The scent was also barely noticeable, which I liked.","zh-CN":"[最近的皮肤困扰]\n\n-脸有点痒？\n-不知道是屏障崩溃了还是因为干燥，\n原因一直搞不清楚，\n-换了这款洁面之后才意识到原因。\n原来是我一直在用会破坏屏障的方式洁面。\n\n[一周使用心得]\n\n[质地]\n\n-（我还在用其他气泡洁面和气泡爽肤水）\n-NOMADIA气泡洁面正如'双重微'这个名字，\n第一眼看就直观地感觉到泡沫细腻紧实。\n肉眼看也很有密度感的泡沫\n-沾水之前先摸了一下泡沫，感觉蓬松又\n紧实，带点乳霜感。\n有点像咖啡蒸奶时那种丝滑奶泡的浓度感。\n\n[使用感]\n\n-真的脑子里马上冒出一句话**滑滑的？!**\n-其他护肤品都没变，\n只换了这一个，就感觉皮肤变得滑溜溜，\n感觉皮肤纹理都不一样了。\n-特别是洗后不紧绷，这点很喜欢\n-而且困扰我很久的发痒问题一下子解决了。神奇....\n\n[优点]\n\n- 洁面时打圈方便，蓬松的泡沫\n让手部洁面也变得更柔和不会太用力，这是优点。\n-痘痘肌、敏感肌应该也能用，感觉很温和（没有长痘）\n-听说这款也在药店、医院专供渠道销售，更让人信任。\n-一直好奇洁面乳之后用气泡洁面做二次清洁清洁力够不够，\n试了全妆之后先用洁面乳+眼部卸妆+NOMADIA气泡洁面做二次清洁，\n卸得很干净。二次清洁的刺激降低了，感觉皮肤屏障保护得很好。\n-荷荷巴+泛醇对皮肤干燥有帮助，\n二次清洁这一步也加了这些成分，能水润地完成洁面。\n-香味也几乎感觉不到，这点很喜欢","zh-TW":"[最近的肌膚困擾]\n\n-臉有點癢？\n-不知道是屏障崩壞還是乾燥造成的，一直找不到原因\n-換了這款潔顏產品後才恍然大悟。\n原因是我一直在用會破壞屏障的方式洗臉。\n\n[一週使用心得]\n\n[質地]\n\n-（我也在用其他氣泡潔顏乳和氣泡化妝水）\n-NOMADIA氣泡潔顏乳不愧叫做雙重微氣泡，\n第一眼就能直覺感受到泡沫細緻紮實。\n肉眼看也能感覺到密度很高。\n-沾水之前直接摸泡沫，感覺蓬鬆又帶點紮實的乳霜感。\n有點像做咖啡奶泡時絲絨奶泡的黏稠感。\n\n[使用感]\n\n-真的一句話形容就是**滑嫩滑嫩！?**\n-其他保養品都沒換，只換了這一項，\n就感覺膚質變得滑嫩，膚質好像整個改變了。\n-特別是洗完臉不緊繃，這點很喜歡\n-而且原本困擾我的搔癢感明顯改善了。真神奇……\n\n[優點]\n\n- 洗臉時打圈很輕鬆，蓬鬆的泡沫讓\n用手洗臉也能更柔和、不會太用力，這是優點。\n-對痘痘肌、敏感肌來說似乎也很溫和（沒有長痘）\n-聽說也有在藥局、醫院專用通路販售，讓人更信任。\n-本來很好奇卸妝乳之後用氣泡潔顏乳做二次清潔潔淨力如何，\n畫全妝後用卸妝乳+眼部卸妝+NOMADIA氣泡潔顏乳做二次清潔，\n乾淨地卸除了。減少了二次清潔的刺激，感覺屏障保護得很好。\n-荷荷芭+泛醇對皮膚乾燥有幫助，\n二次清潔的潔顏步驟也添加了這些成分，能水潤地完成洗臉。\n-香味也幾乎感覺不到，這點很喜歡",ja:"[最近の肌の悩み]\n\n-顔が少し痒い? \n-これがバリアが崩れているのか\n乾燥から来るものなのか原因が分からなかったが\n-このクレンザーに変えてその原因が分かった。\nそれはバリアを崩す洗顔をしていたから。\n\n[1週間使用レビュー]\n\n[テクスチャー]\n\n-(他のバブルクレンザーやバブルトナーも使っているが)\n-NOMADIAバブルクレンザーはデュアルマイクロという製品名らしく、\nとても細かくとろみのある泡だという印象が見た瞬間に直感的に感じられた。\n目で見てもかなり密度のある泡である\n-水をつける前に泡をただ触ってみたとき、もふもふした感じと\nとろみ、少しクリーミーさまで感じられた。\nコーヒーのスチームミルクをするときのベルベットミルクの粘度感。\n\n[使用感]\n\n-本当にぴったりくる一言、**すべすべしてる?!**\n-他のコスメの使用は全部同じで\nこれだけ変えた状態なのに何かすべすべした感じがして\n肌のキメが変わったと感じた。\n-特に洗顔後つっぱりを感じなくて良かった\n-また肌の悩みだった痒みがぐっと収まった。不思議…\n\n[長所]\n\n- 洗顔時ローリングが簡単で、もふもふした泡で\n手洗顔もより優しく、強すぎずできる長所がある。\n-ニキビ肌、敏感肌も使えるようマイルドな気がする(ニキビが出ない)\n-薬局、病院専用でも売っている製品だそうでより信頼できる感じ。\n-クレンジングミルクの後バブルで2回目の洗顔ができるか洗浄力が気になったが、\nフルメイク後クレンジングミルク+アイクレンジング+NOMADIAバブルクレンザーで2回目の洗顔をすると\nすっきりよく落ちた。2回目の洗顔の刺激を減らしてくれて肌バリア保護がよくできる感じ。\n-ホホバ+パンテノールが肌の乾燥に役立つが\n2回目の洗顔のクレンザー段階にも入っていて、しっとり洗顔可能。\n-香りもあまり感じられなくて良かった",th:"[ปัญหาผิวช่วงนี้]\n\n-หน้าคันนิดหน่อย? \n-ไม่รู้สาเหตุว่ามาจากเกราะผิวพัง\nหรือความแห้ง\n-พอเปลี่ยนคลีนเซอร์นี้ก็รู้สาเหตุ\nคือกำลังล้างหน้าด้วยผลิตภัณฑ์ที่ทำให้เกราะผิวพัง\n\n[รีวิวหลังใช้ 1 สัปดาห์]\n\n[เนื้อสัมผัส]\n\n-(ใช้บับเบิลคลีนเซอร์และบับเบิลโทนเนอร์ยี่ห้ออื่นด้วย)\n-บับเบิลคลีนเซอร์ของโนมาเดียสมชื่อดูอัลไมโคร \nรู้สึกได้ทันทีว่าเป็นฟองที่ละเอียดและหนึบแน่นมาก \nมองด้วยตาก็เห็นว่าฟองแน่นมาก\n-ก่อนโดนน้ำ ลองจับฟองดูก็รู้สึกฟูนุ่ม \nและหนึบครีมมี่นิดหน่อยด้วย \nเหมือนความหนืดของเวลเวทมิลค์ตอนตีฟองนมกาแฟ \n\n[ความรู้สึกเมื่อใช้]\n\n-ประโยคเดียวที่นึกได้คือ **เรียบเนียนมาก?!**\n-เครื่องสำอางอื่นที่ใช้เหมือนเดิมทุกอย่าง \nเปลี่ยนแค่ตัวนี้ แต่รู้สึกว่าผิวเรียบเนียนขึ้นมาก\nรู้สึกว่าผิวเปลี่ยนไปเลย\n-โดยเฉพาะหลังล้างหน้าไม่ตึงเลย ชอบมาก\n-แล้วอาการคันที่กังวลก็หายไปเลย น่าทึ่งจริงๆ....\n\n[ข้อดี]\n\n- ตอนล้างหน้านวดคลึงง่าย ฟองฟูช่วยให้ \nล้างหน้าด้วยมือได้นุ่มนวลกว่าเดิมโดยไม่แรงเกินไป\n-ดูเหมือนอ่อนโยนพอที่ผิวเป็นสิวหรือแพ้ง่ายก็ใช้ได้ (ไม่เกิดสิว)\n-เขาบอกว่ามีขายเฉพาะในร้านขายยาและโรงพยาบาลด้วย เลยยิ่งไว้ใจมากขึ้น\n-กังวลว่าถ้าล้างหน้าครั้งที่สองด้วยบับเบิลหลังคลีนซิ่งมิลค์ แรงทำความสะอาดจะพอไหม\nพอลองแต่งหน้าจัดเต็มแล้วล้างด้วยคลีนซิ่งมิลค์ + อายคลีนซิ่ง + บับเบิลคลีนเซอร์ของโนมาเดียเป็นการล้างหน้าครั้งที่สอง\nก็ล้างออกหมดจดดี ลดการระคายเคืองจากการล้างหน้าครั้งที่สอง เลยรู้สึกว่าปกป้องเกราะผิวได้ดี\n-โฮโฮบา + แพนธีนอลช่วยเรื่องความแห้งของผิว\nแล้วยังใส่ไว้ในขั้นตอนล้างหน้าครั้งที่สองด้วย เลยล้างหน้าได้อย่างชุ่มชื้น \n-กลิ่นก็แทบไม่มีเลยชอบมาก"},images:[],video:null},
    {id:"ZOzbYrOJ",rating:5,skinType:{ko:"지성",en:"Oily","zh-CN":"油皮","zh-TW":"油性肌膚",ja:"脂性肌",th:"ผิวมัน"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"피지 많은 지성, 어머니(건성)에게 선물할 정도로 만족",en:"Oily skin with a lot of sebum, satisfied enough to gift it to her mother (dry skin)","zh-CN":"皮脂旺盛的油皮，满意到送给干皮的妈妈","zh-TW":"皮脂多的油性肌，滿意到送給乾性肌的媽媽",ja:"皮脂が多い脂性肌、母(乾燥肌)にプレゼントするほど満足",th:"ผิวมันที่มีไขมันมาก พอใจจนอยากมอบให้คุณแม่ (ผิวแห้ง)"},date:"2026-07-03",
      quote:{ko:"🫪🫪버블클렌저가 이렇게 쫀쫀하다고!!?😳😳\n\n좋은 기회로 제품 사용해보고 리뷰 남깁니당 ♥\n이 제품 성분은 나중에 말씀드리고, 버블클렌저인데 거품밀도가 장난이아니에요..\n보통 일반 폼 손에서 거품내기 싫어서 버블폼 많이 쓰시잖아요?\n대신 일반폼보다 거품이 조금 가벼운 느낌이 항상 들었거든요\n이 제품도 비슷하겠거니, 그냥 마무리가 촉촉한 폼이겠거니, 했는데.. 아니요....!!!!!!! 아니요!!!!!!!!!!!!!\n폼 밀도가 진짜 장난이 아니에요.. 이렇게 묵직하면서 쫀쫀한 거품이 바로나온다고? 이정도로????? 싶어요진짜\n저는 육성으로 감탄을 했습니다.. 진짜 하루종일 세수하고싶을정도에요 슬라임이필요없는 거품입니다\n심지어 거기에 호호바오일에, 판테놀로 보습도 잡아주고 세라마이드엔피로 장벽케어도해주는데 병풀추출물로 진정도 도와주고 나이아신아마이드로 미백케어까지해준다고..?\n말도안됩니다 ... 기본 성분도 좋을 뿐더러 제품력이 엄청좋아요.\n정말 슬픈점은 제가 피지개쩌는지성피부라 데일리로 못쓴다는점..\n지성분들은 가을겨울이나, 피부가 엄청 예민한날, 혹은 피부과케어받았을때 정도 좋으실거같구 건성분들은 진짜 제발한번만써보세요.. 진짜 좋아요...\n기존에 다른 버블폼들이랑 차원이 다릅니다 ㅜ ㅜ\n저는 어머니가 건성이셔서 바로드렸어요..\n피부장벽무너지신 어머니들도 진짜 잘맞으실거같아요\n제가 건성이였다면 인생폼 될정도입니다 진짜로요\n제 리뷰중에 이렇게 호들갑떤 리뷰는 없어요 이거찐입니다",en:"🫪🫪A bubble cleanser can be THIS springy!!?😳😳\n\nI got a good chance to try this product and I'm leaving a review ♥\nI'll get to the ingredients later, but this is a bubble cleanser and the foam density is no joke..\nUsually people use bubble foams because they don't want to lather regular foam by hand, right?\nBut instead, the foam always felt a bit lighter than regular foam\nI figured this would be similar, just another moisturizing-finish foam, but... nope....!!!!!!! Nope!!!!!!!!!!!!!\nThe foam density is seriously no joke.. wait, this dense, springy foam comes out just like that? Really, this much?????\nI literally gasped out loud at how impressed I was.. I want to wash my face all day long, this foam doesn't even need slime to compare\nIt even has jojoba oil and panthenol for moisture, ceramide NP for barrier care, centella asiatica extract for soothing, and niacinamide for brightening care too..?\nUnbelievable... The basic ingredients are great and the performance is amazing too.\nThe really sad part is that I have crazy oily skin so I can't use it daily..\nFor oily skin types, it'd probably be great in fall/winter, on really sensitive-feeling days, or after a dermatology treatment, and for dry skin types, please just try it once.. it's really good...\nIt's on a completely different level from other bubble foams I've tried\nI have dry skin myself... I mean my mom, so I gave it straight to her..\nMoms whose barrier has broken down would probably suit this really well too\nIf I had dry skin, this would honestly become my holy grail foam\nI've never gushed this much in a review before — this one's the real deal","zh-CN":"🫪🫪气泡洁面居然能这么紧实！?😳😳\n\n有幸试用了这款产品来写测评♥\n成分之后再说，作为气泡洁面，泡沫密度真的不是开玩笑的。\n大家平时不都是不想在手上打泡才用气泡泡沫产品吗？\n但反过来说，气泡类产品的泡沫总感觉比普通泡沫轻一些\n我以为这款也差不多，大概就是收尾水润的泡沫吧，结果……不是……!!!!!!!不是!!!!!!!!!!!!!\n泡沫密度真的不是开玩笑的……居然能直接挤出这么厚重又紧实的泡沫？这种程度?????我真的忍不住惊叹出声……真的想一整天都在洗脸。是不需要史莱姆玩具的泡沫。\n而且还有荷荷巴油、泛醇负责保湿，神经酰胺EP负责屏障护理，积雪草提取物帮忙舒缓，烟酰胺还能做美白护理……？\n简直不像话...成分好就算了，产品力也超强。\n真正让人难过的一点是，我是超级出油的油皮，没法当日常款用……\n油皮的朋友们大概秋冬、皮肤特别敏感的日子、或者刚做完皮肤科护理的时候会很适合，干皮的朋友们真的求你们一定要试一次...真的很好用...\n和之前用过的其他气泡泡沫完全不是一个档次ㅜㅜ\n我妈妈是干皮，我直接送给她了……\n屏障已经崩溃的妈妈们应该也会很合适\n如果我是干皮的话，这款绝对能成为我的人生泡沫。真的。\n我写过的测评里从没这么大惊小怪过，这次是真心的","zh-TW":"🫪🫪氣泡潔顏乳竟然可以這麼紮實！!?😳😳\n\n有好機會試用產品來寫心得♥\n成分之後再說，這款氣泡潔顏乳的泡沫密度真的不是開玩笑的……\n大家通常都是因為不想用手搓泡沫才用氣泡型的洗面乳對吧？\n但我一直覺得氣泡型的泡沫比一般洗面乳輕薄一點\n以為這款也差不多，大概就是收尾水潤的泡沫……但不……不是……！！！！！！不是！！！！！！！！！！！\n泡沫密度真的不是開玩笑的……這麼厚實又紮實的泡沫直接就出來？到這種程度？？？？？我真心讚嘆了……真的整天都想一直洗臉，是不需要慕斯的泡沫\n\n而且裡面還有荷荷芭油、泛醇顧保濕，神經醯胺加菸鹼醯胺照顧屏障，還有積雪草萃取物幫忙舒緩，加菸鹼醯胺做美白護理……？\n太扯了……基本成分好之外，產品力也超強。\n真正遺憾的一點是，我是超級油性肌，沒辦法每天用……\n油性肌的人在秋冬，或皮膚超級敏感的日子，或做完皮膚科保養的時候用會很不錯，乾性肌的人拜託一定要試試看……真的很好用……\n和以前用過的其他氣泡洗面乳完全不是同一個等級ㅜㅜ\n我媽媽是乾性肌，我馬上就送給她了……\n屏障崩壞的媽媽們應該也會很適合。\n如果我是乾性肌，這款絕對能變成我的人生洗面乳，真的。\n我寫過的心得裡從來沒有這麼大驚小怪過，這款是真材實料",ja:"🫪🫪バブルクレンザーがこんなにとろみがあるなんて！！?😳😳\n\n良い機会に製品を使ってみてレビューを残します♥\nこの製品の成分は後で言いますが、バブルクレンザーなのに泡の密度がすごいんです…\n普通は洗顔フォームを手で泡立てるのが嫌でバブルフォームをよく使いますよね?\nその代わり普通のフォームより泡が少し軽い感じがいつもありました\nこの製品も似たようなものだろう、ただ仕上がりがしっとりするフォームだろうと思っていたのですが…違います…！！！！！！！違います！！！！！！！！！！！！\n泡の密度が本当にすごいんです…こんなに濃厚でとろみのある泡がすぐ出てくるなんて?このレベルで?????と思いました本当に\n私は声に出して感嘆しました…本当に一日中洗顔していたいくらいです。スライムが必要ない泡です\nさらにそこにホホバオイル、パンテノールで保湿もキープしてセラミドNPでバリアケアもしてくれるのに、ツボクサエキスで鎮静も助けて、ナイアシンアミドでホワイトニングケアまでしてくれるなんて…?\nありえないです…基本成分も良いだけでなく製品力がすごく良いです。\n本当に悲しい点は、私が皮脂すごい脂性肌なのでデイリーで使えないという点…\n脂性肌の方は秋冬や肌がすごく敏感な日、または皮膚科でケアを受けたとき程度に良さそうで、乾燥肌の方は本当にぜひ一度使ってみてください…本当に良いです…\n今までの他のバブルフォームとは次元が違います、涙涙\n私は母が乾燥肌なのでそのまま差し上げました…\n肌バリアが崩れているお母さん方にも本当に合いそうです\n私が乾燥肌だったら人生フォームになるレベルです本当に\n私のレビューの中でこんなに大げさなレビューはありません。これはガチです",th:"🫪🫪บับเบิลคลีนเซอร์หนึบขนาดนี้เลยเหรอ!!?😳😳\n\nได้โอกาสดีมาลองใช้ผลิตภัณฑ์แล้วมารีวิวค่ะ ♥\nส่วนผสมจะเล่าทีหลัง แต่เป็นบับเบิลคลีนเซอร์ที่ความหนาแน่นของฟองไม่ธรรมดาเลย..\nปกติหลายคนใช้บับเบิลโฟมเพราะไม่ชอบตีฟองด้วยมือใช่ไหมคะ?\nแต่ก็มักจะรู้สึกว่าฟองเบากว่าโฟมทั่วไปเสมอ\nคิดว่าตัวนี้ก็คงคล้ายๆ กัน คงเป็นแค่โฟมที่จบด้วยความชุ่มชื้น.. แต่ไม่ใช่เลย....!!!!!!! ไม่ใช่เลย!!!!!!!!!!!!!\nความหนาแน่นของฟองไม่ธรรมดาจริงๆ.. ฟองหนักแน่นและหนึบแบบนี้ออกมาทันทีเลยเหรอ? ขนาดนี้เลย????? อึ้งไปเลยจริงๆ\nฉันร้องอุทานออกมาเลย.. อยากล้างหน้าทั้งวันเลย เป็นฟองที่ไม่ต้องพึ่งสไลม์เลย\nแถมยังมีน้ำมันโฮโฮบา แพนธีนอลที่ให้ความชุ่มชื้น เซราไมด์เอ็นพีที่ดูแลเกราะผิว สารสกัดใบบัวบกที่ช่วยปลอบประโลม และไนอาซินาไมด์ที่ดูแลผิวขาวกระจ่างใสด้วย..?\nไม่น่าเชื่อเลย... ส่วนผสมพื้นฐานดีแล้วประสิทธิภาพก็ยอดเยี่ยมมาก\nสิ่งที่เศร้าคือฉันเป็นผิวมันที่มีไขมันเยอะมาก เลยใช้เป็นประจำทุกวันไม่ได้..\nคนผิวมันน่าจะเหมาะใช้ช่วงฤดูใบไม้ร่วง-หนาว หรือวันที่ผิวแพ้ง่ายมากๆ หรือหลังทำหัตถการที่คลินิกผิวหนัง ส่วนคนผิวแห้งขอร้องให้ลองใช้สักครั้งเถอะ.. ดีจริงๆ...\nต่างจากบับเบิลโฟมอื่นๆ ที่เคยใช้คนละเรื่องเลย ㅜ ㅜ\nคุณแม่ของฉันเป็นผิวแห้งเลยยกให้ไปเลย..\nคุณแม่ที่เกราะผิวพังก็น่าจะเข้ากันได้ดีจริงๆ\nถ้าฉันเป็นผิวแห้งคงเป็นโฟมในตำนานประจำชีวิตเลย จริงๆ นะ\nในรีวิวของฉันไม่มีรีวิวที่ตื่นเต้นแบบนี้มาก่อน อันนี้ของจริงค่ะ"},images:[],video:null},
    {id:"ZMmwxWpZ",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수분부족형 건성/붉은기+블랙헤드, 자극·붉은기 없이 광택 마무리",en:"Dehydrated dry skin/redness + blackheads, finishes with no irritation or redness and a healthy glow","zh-CN":"水分不足型干皮/泛红+黑头，无刺激无泛红的光泽收尾","zh-TW":"水分不足型乾性/泛紅+黑頭，無刺激無泛紅、光澤收尾",ja:"水分不足型乾燥肌/赤み+黒ずみ、刺激・赤みなく光沢のある仕上がり",th:"ผิวแห้งขาดน้ำ/ผื่นแดง+หัวสิวอุดตันดำ - จบด้วยผิวเปล่งประกายไม่ระคายเคือง·ไม่แดง"},date:"2026-06-18",
      quote:{ko:"🥹피부상태\n수분 부족형 건성, 민감성, 붉은기\nT존 피지, 블랙헤드, 모공\n\n\n✨장점✨\n\n\n\n💫 부드러운 사용감 + 충분한 세정력\n💫 버블로 편리한 사용\n💫 자극감, 붉은기 없이 광택나는 마무리감\n💫 믿음의 콜마 제조\n\n\n일단 한국콜마 제품이 워낙 잘 맞아서 기대했는데\n생각보다 더 좋아서 굉장히 만족스러웠어요!!!\n\n\n저자극이라 세정력은 별로 기대하지 않았는데 \n생각보다 세정력도 너무 좋아서 파운데이션 수준의 톤업크림도 그냥 이 제품으로 2차 세안까지 하면 잘 지워집니다.\n예전처럼 폼클렌징 + 클렌징 오일로 귀찮게; 하지 않아도 돼서 정말 좋아요.\n\n\n특히 바로 거품으로 세안 하는게 너무 편해서 \n더이상 일반 폼클로는 못돌아갈것 같아요ㅋ \n\n\n무향에 제가 써본 약산성 폼클렌징 중에서도 \n사용 후 자극감이나 붉은기도 가장 적은편 이었고,\n마무리감이 건조하지 않고 광택까지 느껴져서 아주 좋았습니다. \n\n\n그냥 지금까지 써본 클렌저 중 제일 맘에 드네요. \n저처럼 민감성에 세정력까지 필요한 사람에게 \n강력 추천 합니다.\n\n\n\n💫 재구매의사 👍👍👍👍👍👍",en:"🥹Skin condition\nDehydrated dry skin, sensitive, redness\nT-zone sebum, blackheads, pores\n\n\n✨Pros✨\n\n\n\n💫 Gentle feel + sufficient cleansing power\n💫 Convenient bubble format\n💫 No irritation or redness, finishes with a glow\n💫 Trusted Kolmar manufacturing\n\n\nI expected a lot since Korea Kolmar products tend to suit me really well,\nand it was even better than expected, so I was very satisfied!!!\n\n\nSince it's gentle, I didn't expect much cleansing power,\nbut it turned out to be really good too — even foundation-level tone-up cream comes off completely just using this as a second cleanse.\nNo more hassle of foam cleanser + cleansing oil like before, which is really nice.\n\n\nEspecially, being able to cleanse directly with foam is so convenient\nthat I don't think I can go back to regular foam cleansers anymore ㅋ\n\n\nFragrance-free, and among the mildly acidic foam cleansers I've tried,\nit had the least irritation and redness after use,\nand the finish wasn't dry — it even had a glow, which I loved.\n\n\nHonestly this is my favorite cleanser I've tried so far.\nFor people like me who need both gentleness and cleansing power,\nI strongly recommend it.\n\n\n\n💫 Would repurchase 👍👍👍👍👍👍","zh-CN":"🥹肤质状态\n水分不足型干皮，敏感性，泛红\nT区皮脂、黑头、毛孔\n\n\n✨优点✨\n\n\n\n💫 柔软的使用感 + 充分的清洁力\n💫 气泡形式使用方便\n💫 无刺激、无泛红，光泽收尾感\n💫 值得信赖的科玛代工\n\n\n本来韩国科玛（Kolmar）的产品一直很对我口味，就抱着期待用了\n结果比预期更好，真的很满意!!!\n\n\n因为是低刺激，本来没抱太大清洁力的期待\n结果清洁力比想象中好很多，连粉底级别的提亮霜用这个做二次清洁也能卸干净。\n不用再像以前那样麻烦地泡沫洁面+卸妆油了，真的很好。\n\n\n特别是可以直接用泡沫洁面这点太方便了\n感觉再也回不去普通泡沫了哈\n\n\n无香，而且是我用过的弱酸性泡沫洁面里，\n用后刺激感和泛红都算最少的一款，\n收尾感不干燥还带点光泽，非常喜欢。\n\n\n是我目前用过的洁面产品里最满意的一款。\n强烈推荐给像我这种既敏感又需要清洁力的人。\n\n\n\n💫 回购意愿 👍👍👍👍👍👍","zh-TW":"🥹膚況\n水分不足型乾性、敏感性、泛紅\nT字皮脂、黑頭、毛孔\n\n\n✨優點✨\n\n\n\n💫 柔軟使用感 + 足夠潔淨力\n💫 氣泡型使用方便\n💫 無刺激、無泛紅、光澤收尾感\n💫 值得信賴的Kolmar製造\n\n\n本來因為韓國Kolmar的產品一直和我很合就抱著期待，\n結果比想像中更好，非常滿意!!!\n\n\n因為是低刺激型本來沒有太期待潔淨力，\n結果潔淨力也比想像中好很多，連粉底等級的亮白霜光靠這款做二次清潔也能卸乾淨。\n不用像以前那樣麻煩地用洗面乳+卸妝油了，真的很棒。\n\n\n特別是能直接出泡沫洗臉這點太方便了，\n已經回不去一般洗面乳了ㅋ\n\n\n無香，是我用過的弱酸性洗面乳裡\n用完刺激感或泛紅最少的一款，\n收尾感也不乾燥，還帶點光澤感，非常喜歡。\n\n\n真心是我目前用過最滿意的潔顏產品。\n像我這種既要敏感肌又要潔淨力的人，\n強力推薦。\n\n\n\n💫 回購意願 👍👍👍👍👍👍",ja:"🥹肌状態\n水分不足型乾燥肌、敏感肌、赤み\nTゾーン皮脂、黒ずみ、毛穴\n\n\n✨長所✨\n\n\n\n💫柔らかい使用感+十分な洗浄力\n💫バブルで便利な使用\n💫刺激感、赤みなく光沢のある仕上がり\n💫信頼のコルマ製造\n\n\nまず韓国コルマの製品はとても肌に合うので期待していましたが\n思ったよりさらに良くてとても満足でした！！！\n\n\n低刺激なので洗浄力はあまり期待していませんでしたが\n思ったより洗浄力もとても良くて、ファンデーション級のトーンアップクリームもこの製品だけで2回目の洗顔まですればきれいに落ちます。\n以前のように洗顔フォーム+クレンジングオイルで面倒にしなくても良いので本当に良いです。\n\n\n特にすぐ泡で洗顔できるのがとても楽で\nもう普通の洗顔フォームには戻れなそうです(笑)\n\n\n無香で、私が使ってきた弱酸性洗顔フォームの中でも\n使用後の刺激感や赤みが最も少ない方で、\n仕上がりが乾燥せず光沢まで感じられてとても良かったです。\n\n\nとにかく今まで使ったクレンザーの中で一番気に入りました。\n私のように敏感肌で洗浄力まで必要な人に\n強くおすすめします。\n\n\n\n💫リピート意向👍👍👍👍👍👍",th:"🥹สภาพผิว\nผิวแห้งขาดน้ำ แพ้ง่าย ผื่นแดง\nไขมัน T-zone หัวสิวอุดตันดำ รูขุมขน\n\n\n✨ข้อดี✨\n\n\n\n💫 ความรู้สึกเมื่อใช้นุ่มนวล + แรงทำความสะอาดเพียงพอ\n💫 ใช้งานสะดวกด้วยรูปแบบบับเบิล\n💫 จบด้วยผิวเปล่งประกาย ไม่ระคายเคือง ไม่แดง\n💫 ผลิตโดย Kolmar ที่ไว้ใจได้\n\n\nปกติผลิตภัณฑ์ของ Korea Kolmar เข้ากับผิวฉันดีอยู่แล้วเลยคาดหวังไว้\nแต่พอใจมากกว่าที่คิดไว้อีก!!!\n\n\nเป็นสูตรระคายเคืองน้อยเลยไม่ได้คาดหวังเรื่องแรงทำความสะอาดมากนัก \nแต่แรงทำความสะอาดดีเกินคาด แม้แต่ครีมโทนอัพระดับรองพื้นก็ล้างออกได้หมดจดด้วยการล้างหน้าครั้งที่สองด้วยตัวนี้เท่านั้น\nไม่ต้องยุ่งยากด้วยโฟม+คลีนซิ่งออยล์แบบเดิมอีกแล้ว ดีมากจริงๆ\n\n\nโดยเฉพาะการล้างหน้าด้วยฟองทันทีสะดวกมาก \nคงกลับไปใช้โฟมทั่วไปไม่ได้แล้วฮ่าๆ \n\n\nไม่มีกลิ่น แล้วในบรรดาโฟมล้างหน้ากรดอ่อนที่เคยใช้ \nรู้สึกว่าระคายเคืองและแดงน้อยที่สุด\nจบด้วยความรู้สึกไม่แห้งแต่มีความเปล่งประกาย ดีมากจริงๆ \n\n\nเป็นคลีนเซอร์ที่ชอบที่สุดในบรรดาที่เคยใช้มา \nแนะนำสุดๆ สำหรับคนผิวแพ้ง่ายที่ต้องการแรงทำความสะอาดด้วยแบบฉัน\n\n\n\n💫 ตั้งใจซื้อซ้ำ 👍👍👍👍👍👍"},images:[],video:null},
    {id:"Jk8nbnpZ",rating:4,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"지성+여드름성이 강한 세안제 써서 건성화된 사연 - 트러블 없이 개선",en:"Story of oily+acne-prone skin that became dry from using a harsh cleanser — improved without breakouts","zh-CN":"油皮+痘痘肌用强力洁面导致变干性的经历 - 无刺激地改善","zh-TW":"油性+痘痘肌用強力清潔導致變乾性的經歷 - 改善後不長痘",ja:"脂性肌+ニキビ肌が強い洗顔料を使って乾燥肌化したエピソード - トラブルなく改善",th:"ผิวมัน+เป็นสิวที่ใช้ตัวล้างหน้าแรงเกินจนกลายเป็นผิวแห้ง - ดีขึ้นโดยไม่เกิดสิว"},date:"2026-06-18",
      quote:{ko:"지성피부에 여드름성 피부라 항상 세정력이 강한 클렌저만 찾아서 사용했어요. 근데 그렇게 자극이 강한 제품들만 쓰다 보니 세안 후에 얼굴이 금방 붉어지고 피부가 엄청 건조해지더라구요ㅠㅜ원래는 티존만 번들거리는 지성이었는데 어느 순간 볼이랑 턱은 건성이 되어버려서 씻고 나오면 볼따구가 쩍쩍 갈라지는 느낌이 들 정도였어요...\n\n그러던 중 노마디아 골든 호호바 10% 듀얼 마이크로 버블 클렌저를 사용해보게 되었는데, 제품을 보니 호호바 오일이 들어있더라구요?! 어릴 때 어무니가 호호바 오일을 자주 챙겨주셔서 효능은 알고 있었는데, 건조함은 잡아주면서도 피부를 번들번들한 지성처럼 만드는 오일이 아니라는 점이 좋았던 기억이 있었는데 오랜만에 호호바 오일이 함유된 세안제를 사용해보니 진짜 세안 후에도 피부가 당기거나 건조한 느낌이 거의 없었어요! 버블도 엄청 부드럽고 조밀해서 자극 없이 세안되는 느낌이었고, 약산성 클렌저라 피부 장벽에도 부담이 덜한 것 같았습니다! 저는 클렌저만 바꿔도 여드름이 하나둘 올라오는 편인데, 이 제품은 사용하면서 따로 트러블이 올라오지 않아서 더 만족스러웠어요.\n\n다만 약산성 클렌저다 보니 진한 메이크업까지 말끔하게 지워주는 제품은 아니었어요. 그래서 저는 1차로 클렌징 밀크로 충분히 마사지해서 메이크업을 지워주고, 2차 세안으로 이 버블 클렌저를 사용했는데 조합이 정말 좋았습니다!\n\n평소 저처럼 지성+여드름성 피부인데 세안 후 건조함이나 피부 당김 때문에 고민하셨던 분들이라면 한 번 사용해보셔도 좋을 것 같아요!",en:"I have oily, acne-prone skin, so I always looked for cleansers with strong cleansing power. But using such harsh products all the time, my face would get red quickly after cleansing and my skin got really dry ㅠㅜOriginally only my T-zone was shiny/oily, but at some point my cheeks and chin became so dry that it felt like they were cracking right after washing...\n\nThen I got to try the NOMADIA Golden Jojoba 10% Dual Micro Bubble Cleanser, and I noticed it contains jojoba oil?! Growing up, my mom used to keep jojoba oil around often, so I knew its benefits — I remembered that it's an oil that addresses dryness without making skin oily and shiny like regular oily skin. It had been a while since I used a cleanser with jojoba oil, and honestly, after cleansing there was almost no tightness or dryness on my skin! The bubbles were also super soft and dense, so it felt like cleansing with no irritation, and being a mildly acidic cleanser, it also seemed easier on the skin barrier! I'm the type whose skin breaks out just from switching cleansers, but with this product I didn't get any extra breakouts, which satisfied me even more.\n\nThat said, since it's a mildly acidic cleanser, it's not a product that completely removes heavy makeup. So I did a first cleanse with cleansing milk to massage off makeup thoroughly, then used this bubble cleanser as a second cleanse, and the combination was really great!\n\nIf you have oily+acne-prone skin like me and have been struggling with dryness or tightness after cleansing, I think this is worth trying!","zh-CN":"我是油皮+痘痘肌，一直只找清洁力强的洁面产品用。但一直用刺激性强的产品，洗完脸很快就泛红，皮肤也变得非常干燥ㅠㅜ本来只有T区出油，不知从什么时候起脸颊和下巴变成了干性，洗完脸出来脸颊感觉像要裂开一样...\n\n后来用了NOMADIA金色荷荷巴10%双重微气泡洁面，一看成分居然有荷荷巴油?!小时候妈妈经常给我用荷荷巴油，我知道它的功效，记得它能解决干燥问题但又不会让皮肤变得油光光的，很久没用含荷荷巴油的洁面产品了，用了之后洗完脸真的几乎不紧绷不干燥！泡沫也超级柔软细密，感觉是无刺激地清洁，弱酸性洁面对皮肤屏障负担也小！我这种人只要换洁面产品就会长痘，但用这款期间没有额外长痘，更满意。\n\n不过因为是弱酸性洁面，不能把浓妆彻底卸干净。所以我先用洁面乳充分按摩卸妆，再用这款气泡洁面做二次清洁，这个组合真的很好！\n\n平时像我这样油皮+痘痘肌，又因为洗后干燥紧绷而烦恼的朋友，可以试试看！","zh-TW":"我是油性痘痘肌，一直只找潔淨力強的洗面乳來用。但一直用刺激性強的產品，洗完臉後臉很快就會泛紅、皮膚也變得非常乾燥ㅠㅜ本來只有T字出油的油性肌，不知不覺臉頰和下巴變成乾性，洗完臉出來甚至覺得臉頰快要裂開的感覺……\n\n後來試用了NOMADIA金盞荷荷芭10%雙重微氣泡潔顏乳，發現裡面竟然有荷荷芭油？！小時候媽媽常常給我用荷荷芭油，我知道它的功效，記得它能改善乾燥卻不會讓皮膚變得油亮亮，好久沒用含荷荷芭油的洗面產品，這次用了之後，洗完臉真的幾乎沒有緊繃或乾燥感！泡沫也超級柔軟細緻，感覺無刺激地洗臉，弱酸性洗面乳對皮膚屏障的負擔感覺也比較小！我只要換洗面乳就容易長痘痘，但用這款期間沒有額外冒痘，更讓我滿意。\n\n不過因為是弱酸性洗面乳，不能把濃妝卸得乾乾淨淨。所以我會先用卸妝乳仔細按摩卸妝，二次清潔用這款氣泡潔顏乳，這個組合真的很不錯！\n\n平常和我一樣是油性+痘痘肌，卻因為洗完臉乾燥緊繃而困擾的人，可以試試看這款！",ja:"脂性肌でニキビ肌なので、いつも洗浄力の強いクレンザーばかり探して使っていました。でもそんな刺激の強い製品ばかり使っていたら、洗顔後すぐ顔が赤くなって肌がすごく乾燥するようになりました、涙。もともとTゾーンだけがテカる脂性肌だったのに、いつの頃からか頬とあごが乾燥肌になってしまい、洗顔後は頬がパリパリするような感じがするほどでした…\n\nそんな中、NOMADIAゴールデンホホバ10%デュアルマイクロバブルクレンザーを使ってみることになったのですが、製品を見るとホホバオイルが入っているんです?!小さい頃母がホホバオイルをよく用意してくれたので効能は知っていましたが、乾燥を抑えながらも肌をテカった脂性肌のようにしないオイルだという良い記憶があったので、久しぶりにホホバオイルが含まれた洗顔料を使ってみたら、本当に洗顔後も肌がつっぱったり乾燥したりする感じがほとんどありませんでした！バブルもすごく柔らかくきめ細かいので刺激なく洗顔できる感じで、弱酸性クレンザーなので肌バリアへの負担も少ない感じでした！私はクレンザーを変えるだけでニキビが一つ二つ出やすい方ですが、この製品は使っている間特にトラブルが出なくてより満足でした。\n\nただ弱酸性クレンザーなので濃いメイクまですっきり落としてくれる製品ではありませんでした。それで私は1回目にクレンジングミルクで十分マッサージしてメイクを落とし、2回目の洗顔でこのバブルクレンザーを使いましたが、組み合わせが本当に良かったです！\n\n普段私のように脂性肌+ニキビ肌で、洗顔後の乾燥や肌のつっぱりで悩んでいた方なら一度使ってみても良いと思います！",th:"เป็นผิวมันที่เป็นสิวง่าย เลยหาแต่คลีนเซอร์ที่แรงทำความสะอาดสูงมาใช้ตลอด แต่พอใช้แต่ผลิตภัณฑ์ที่ระคายเคืองแรงแบบนั้น หลังล้างหน้าหน้าจะแดงและแห้งมากㅠㅜ เดิมทีเป็นผิวมันที่มันเฉพาะ T-zone แต่จู่ๆ แก้มกับคางก็กลายเป็นผิวแห้งจนล้างหน้าเสร็จแก้มรู้สึกเหมือนจะแตกเลย...\n\nพอดีได้ลองใช้โกลเด้นโฮโฮบา 10% ดูอัลไมโครบับเบิลคลีนเซอร์ของโนมาเดีย ดูส่วนผสมแล้วมีน้ำมันโฮโฮบาด้วย?! ตอนเด็กคุณแม่มักให้ใช้น้ำมันโฮโฮบา เลยรู้จักสรรพคุณอยู่แล้ว จำได้ว่าชอบที่มันช่วยจัดการความแห้งได้โดยไม่ทำให้ผิวมันเยิ้มแบบผิวมัน พอได้ใช้ตัวล้างหน้าที่มีน้ำมันโฮโฮบาอีกครั้งหลังจากไม่ได้ใช้มานาน หลังล้างหน้าแทบไม่รู้สึกตึงหรือแห้งเลยจริงๆ! ฟองก็นุ่มนวลและละเอียดมาก รู้สึกเหมือนล้างหน้าโดยไม่ระคายเคือง แล้วเป็นคลีนเซอร์กรดอ่อน เลยรู้สึกว่าไม่มีภาระต่อเกราะผิว! ปกติแค่เปลี่ยนคลีนเซอร์ฉันก็มักจะเป็นสิวขึ้นบ้าง แต่ผลิตภัณฑ์นี้ใช้แล้วไม่มีสิวขึ้นเลย พอใจมากขึ้นไปอีก\n\nแต่เพราะเป็นคลีนเซอร์กรดอ่อน จึงไม่ใช่ผลิตภัณฑ์ที่ล้างเมคอัพเข้มข้นออกได้หมดจด เลยล้างหน้าครั้งแรกด้วยคลีนซิ่งมิลค์นวดคลึงให้เพียงพอเพื่อล้างเมคอัพก่อน แล้วล้างหน้าครั้งที่สองด้วยบับเบิลคลีนเซอร์ตัวนี้ ผลลัพธ์ออกมาดีมากจริงๆ!\n\nถ้าใครเป็นผิวมัน+เป็นสิวแบบฉันที่กังวลเรื่องความแห้งหรือตึงหลังล้างหน้า อยากแนะนำให้ลองใช้ดูสักครั้งค่ะ!"},images:[],video:null},
    {id:"qnRn1aYq",rating:4,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"",en:"","zh-TW":"",ja:"",th:""},date:"2026-06-11",
      quote:{ko:"1:일단 바로 폼 형태로 나오다 보니 사용하기 편해서 좋았어요. \n\n2:!아침세안! 용으로 적합한 제품이라 생각되요. \n\n   남편이 깜빡하고 썬크림(무기자차) 바른 얼굴에 이 \n   제품으로만 세안하고 나선 끈적하게 남아서 안 지워졌다고 \n   투덜거린 적이 있었고 저는 아침에 맨 얼굴 세안시 코 부분이 \n   쫌 깨끗이 닦인 것 같이 안 느껴져서 두 번 한 적도 있었어요. \n   그런데 이 때는 제가 펌핑을 두 번만 해서 세안 했었고 다음번 \n   부터는 서너번 펌핑해서 롤링을 좀 더 많이 하고 씻어냈더니\n   괜찮았어요. \n\n3:전 건성피부에 알레르기 체질이라 툭하면 접촉성 피부염도  \n   잘 걸려서 피부과 쌤이 오일류는 가급적 쓰지 말라 해서 안 \n   써왔는데 호호바오일도 써 본적이 없어서 초큼 걱정을 했지\n   만 가려움이나 두드러기 뾰루지 같은 건 생기지 않아서 이런\n   면에서도 나쁘지 않은 것 같아요. \n\n4:세안 후 당김이 거의 (95%이상) 없어서 좋아요.",en:"1: First off, it comes out already in foam form, so it was convenient to use.\n\n2: I think it's suited for morning cleansing!\n\n   My husband forgot he had inorganic/mineral sunscreen on his face\n   and cleansed with just this product, then complained afterward that it\n   stayed sticky and didn't come off. And in the morning cleansing my bare face,\n   I felt like my nose area wasn't quite cleaned properly, so I did it twice.\n   But that time I'd only pumped it twice for cleansing, and the next time\n   I pumped three or four times and rolled it more thoroughly before\n   rinsing, and it was fine.\n\n3: I have dry skin and an allergic constitution, so I easily get contact\n   dermatitis, and my dermatologist told me to avoid oils where possible, so\n   I hadn't used them — I'd never tried jojoba oil either, so I was a bit\n   worried, but it didn't cause any itchiness, hives, or bumps, so it\n   seems not bad in that regard either.\n\n4: There's almost (95%+) no tightness after cleansing, which I like.","zh-CN":"1：首先直接就是泡沫形态挤出来，用起来很方便，这点很喜欢。\n\n2：作为！早晨洁面！用的产品感觉很合适。\n\n   我老公有次忘了这回事，涂了物理防晒的脸只用这款\n   洗，抱怨说黏糊糊的没洗掉。我自己早上素颜洁面\n   时鼻子那块也感觉没洗得特别干净，有一次还洗了两次。\n   不过那次我只按压了两下就洗了，之后\n   按压三四下多打圈按摩再冲洗，就没问题了。\n\n3：我是干性皮肤又是过敏体质，动不动就得接触性皮炎\n   皮肤科医生让我尽量不要用油类产品，所以一直没用\n   过荷荷巴油，本来还有点担心，结果没有出现发痒、\n   荨麻疹或痘痘之类的情况，这方面也还不错。\n\n4：洗后紧绷感几乎（95%以上）没有，这点很喜欢。","zh-TW":"1：首先直接出泡沫的形態，使用起來很方便，這點很喜歡。\n\n2：!當作早晨洗臉！用的產品很適合。\n\n   老公有一次忘記卸妝，擦了防曬乳（純物理防曬）的臉\n   只用這款洗臉，結果抱怨說黏黏的沒洗乾淨，\n   我早上素顏洗臉時鼻子部位也覺得沒有洗得很乾淨，甚至洗了兩次。\n   不過那次我只按壓了兩次就洗臉了，之後\n   改成按壓三四次、多打圈一點再沖洗，就沒問題了。\n\n3：我是乾性肌又是過敏體質，動不動就得接觸性皮膚炎，\n   皮膚科醫生叫我盡量不要用油類產品，所以一直沒用過，\n   荷荷芭油也是第一次用，本來有點擔心，\n   但沒有出現發癢、蕁麻疹、粉刺之類的反應，這點還不錯。\n\n4：洗完臉幾乎（95%以上）不緊繃，這點很喜歡。",ja:"1：まず泡の状態でそのまま出てくるので使いやすくて良かったです。 \n\n2：朝の洗顔用に適した製品だと思います。 \n\n   夫がうっかり日焼け止め(ノンケミカル)を塗った顔に、この \n   製品だけで洗顔したら、べたべたして落ちなかったと \n   文句を言ったことがあり、私は朝すっぴんで洗顔するとき鼻の部分が \n   きちんと洗えていない感じがして2回洗ったこともありました。 \n   ただこのときは私がポンプを2回だけして洗顔していて、次回 \n   からは3〜4回ポンプしてローリングをもっとして洗い流したら\n   問題ありませんでした。 \n\n3：私は乾燥肌でアレルギー体質なのでちょっとしたことで接触性皮膚炎にも  \n   よくかかるので、皮膚科の先生からオイル類はできるだけ使わないようにと \n   言われて使ってこなかったのですが、ホホバオイルも使ったことがなかったので少し心配していました\n   が、痒みやじんましん、ニキビのようなものはできなかったので、この\n   面でも悪くないと思います。 \n\n4：洗顔後のつっぱりがほとんど(95%以上)なくて良いです。",th:"1: อันดับแรกออกมาเป็นรูปแบบโฟมทันทีใช้งานสะดวกดีค่ะ \n\n2: !ใช้ล้างหน้าตอนเช้า! เหมาะมากคิดว่าเป็นผลิตภัณฑ์ที่เหมาะสำหรับใช้ตอนเช้า \n\n   สามีเคยลืมแล้วล้างหน้าที่ทาครีมกันแดด (สูตรฟิสิคัล) ด้วย \n   ผลิตภัณฑ์นี้อย่างเดียว แล้วบ่นว่ามีความเหนียวเหนอะหนะตกค้างล้างไม่ออก \n   ส่วนฉันตอนล้างหน้าเปล่าตอนเช้าก็รู้สึกว่าบริเวณจมูกไม่ค่อยสะอาดหมดจด \n   เลยล้างซ้ำสองครั้งบ้าง \n   แต่ครั้งนั้นฉันปั๊มแค่สองครั้งเท่านั้น ครั้งต่อๆ มา \n   ปั๊มสามสี่ครั้งแล้วนวดคลึงให้มากขึ้นก่อนล้างออก\n   ก็โอเคดี \n\n3: ฉันเป็นผิวแห้งที่มีอาการแพ้ง่าย เป็นผิวอักเสบจากการสัมผัสบ่อยๆ \n   หมอผิวหนังเคยบอกให้หลีกเลี่ยงผลิตภัณฑ์ประเภทออยล์ เลยไม่ค่อยได้ \n   ใช้ ไม่เคยใช้น้ำมันโฮโฮบามาก่อนด้วยเลยกังวลนิดหน่อย\n   แต่ไม่มีอาการคัน ลมพิษ หรือสิวขึ้นเลย ในแง่นี้\n   ก็ไม่แย่เลยค่ะ \n\n4: หลังล้างหน้าแทบไม่ตึงเลย (เกิน 95%) ชอบมากค่ะ"},images:[],video:null},
    {id:"qW4RmRXA",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지+여드름 피부, 모공 속까지 세정",en:"Combination (oily-dehydrated) + acne-prone, cleans deep into pores","zh-CN":"水油皮+痘痘肌，清洁到毛孔深处","zh-TW":"外油內乾+痘痘肌，清潔到毛孔深處",ja:"インナードライ肌+ニキビ肌、毛穴の奥まで洗浄",th:"ผิวมันขาดน้ำ+เป็นสิว ทำความสะอาดถึงในรูขุมขน"},date:"2026-06-18",
      quote:{ko:"🙋🏻‍♀️ 수부지, 여드름 피부\n\n✅ 제형 및 발림성\n거품이 생각보다 쫀쫀해서 줄줄 흘러내리지 않아 좋아요.\n\n✅ 유수분감 (세정력)\n씻고 나면 뽀득뽀득 해져요. 약산성임에도 세정력이 좋은 것 같고, 건성에게는 조금 건조할 수 있어요.\n\n✅ 성분\n히알루론산, 판테놀 등 수분과 진정에 좋은 성분들이 들어있고, 특히 향료가 없어서 좋아요. 클렌징 제품에 좋은 성분은 크게 의미 없다고 생각하는 편이긴한데 안 좋은 성분이 안 들어가는 건 중요해서 마음에 듭니다.\n\n💟 총평\n거품 클렌저가 필요하다면 쓰기 좋아요. 거품이다 보니 모공 속까지 들어가서 깔끔하게 씻을 수 있어 저 같은 피지 폭발, 트러블 피부에 좋아보여요.",en:"🙋🏻‍♀️ Combination (oily-dehydrated), acne-prone skin\n\n✅ Texture and spreadability\nThe foam is springier than I expected, so it doesn't drip and run, which I like.\n\n✅ Oil-moisture feel (cleansing power)\nAfter washing, my skin gets squeaky-clean. It's mildly acidic yet the cleansing power seems good, though it might be a bit drying for dry skin.\n\n✅ Ingredients\nIt contains hyaluronic acid, panthenol, and other ingredients good for moisture and soothing, and I especially like that there's no added fragrance. I generally think \"good\" ingredients in a cleansing product don't matter that much, but avoiding bad ingredients matters, so I like that about this one.\n\n💟 Overall\nIf you need a foam cleanser, this is good to use. Since it's a foam, it gets deep into pores for a thorough clean, which seems great for people like me with excess sebum and breakout-prone skin.","zh-CN":"🙋🏻‍♀️ 水油皮，痘痘肌\n\n✅ 质地及延展性\n泡沫比想象中紧实，不会流得到处都是，这点很好。\n\n✅ 水油感（清洁力）\n洗完之后有种吱吱响的干净感。虽然是弱酸性，清洁力感觉还不错，干性肌肤可能会觉得稍微有点干。\n\n✅ 成分\n含有透明质酸、泛醇等对补水和舒缓好的成分，特别是不含香料这点很喜欢。我个人觉得洁面产品里的好成分意义不算特别大，但不含不好的成分更重要，这点很满意。\n\n💟 总评\n想要泡沫洁面的话这款很适合。因为是泡沫形式能进入毛孔深处，能清洁得很干净，对我这种皮脂爆发、痘痘肌的人应该很不错。","zh-TW":"🙋🏻‍♀️ 外油內乾、痘痘肌\n\n✅ 質地及延展性\n泡沫比想像中紮實，不會流下來，這點很喜歡。\n\n✅ 油水感（潔淨力）\n洗完之後咕溜咕溜很乾淨。雖然是弱酸性，但潔淨力好像不錯，對乾性肌來說可能會稍微偏乾。\n\n✅ 成分\n含有玻尿酸、泛醇等對保濕和舒緩很好的成分，特別是無香料這點很喜歡。我個人覺得清潔產品裡加太多好成分意義不大，但不含不好的成分很重要，這點我很滿意。\n\n💟 總評\n如果需要氣泡潔顏乳，這款很好用。因為是氣泡型，能深入毛孔清潔乾淨，對我這種皮脂爆發、長痘的肌膚應該很適合。",ja:"🙋🏻‍♀️インナードライ肌、ニキビ肌\n\n✅テクスチャー・のび\n泡が思ったよりとろみがあって垂れないので良いです。\n\n✅水分・油分感(洗浄力)\n洗った後キュッキュッとします。弱酸性なのに洗浄力が良い気がして、乾燥肌には少し乾燥するかもしれません。\n\n✅成分\nヒアルロン酸、パンテノールなど水分と鎮静に良い成分が入っていて、特に香料がないのが良いです。クレンジング製品に良い成分はそこまで意味がないと思う方ですが、良くない成分が入っていないことは大事なので気に入っています。\n\n💟総評\n泡タイプのクレンザーが必要ならおすすめです。泡なので毛穴の奥まで入ってすっきり洗えるので、私のような皮脂爆発、トラブル肌に良さそうです。",th:"🙋🏻‍♀️ ผิวมันขาดน้ำ เป็นสิว\n\n✅ เนื้อสัมผัสและการลูบไล้\nฟองหนึบกว่าที่คิด ไม่ไหลย้อยชอบมาก\n\n✅ ความรู้สึกชุ่มชื้น/มัน (แรงทำความสะอาด)\nล้างเสร็จแล้วสะอาดเอี๊ยด แม้เป็นกรดอ่อนแต่แรงทำความสะอาดก็ดี ผิวแห้งอาจรู้สึกแห้งไปนิดหน่อย\n\n✅ ส่วนผสม\nมีไฮยาลูรอนิกแอซิด แพนธีนอลที่ดีต่อความชุ่มชื้นและการปลอบประโลม โดยเฉพาะไม่มีน้ำหอมชอบมาก ส่วนตัวคิดว่าส่วนผสมดีๆ ในตัวล้างหน้าไม่มีความหมายมากนัก แต่การไม่มีส่วนผสมที่ไม่ดีสำคัญกว่า เลยชอบจุดนี้\n\n💟 สรุป\nถ้าต้องการคลีนเซอร์แบบฟองก็เหมาะมาก เพราะเป็นฟองเลยซึมเข้าถึงในรูขุมขน ล้างสะอาดหมดจด เหมาะกับผิวที่ไขมันระเบิดและเป็นสิวแบบฉัน"},images:[],video:null},
    {id:"qPgLpbxZ",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"화농성 여드름·좁쌀·모공, 세안 후 트러블 변화 없음",en:"Cystic acne, tiny bumpy acne, pores — no change in breakouts after cleansing","zh-CN":"脓包痘痘·闭口·毛孔，洗后痘痘状况没有变化","zh-TW":"化膿性痘痘‧粉刺‧毛孔，洗完臉後痘痘沒有變化",ja:"化膿性ニキビ・細かいニキビ・毛穴、洗顔後トラブルの変化なし",th:"สิวอักเสบเป็นหนอง·สิวเสี้ยน·รูขุมขน - หลังล้างหน้าสิวไม่เปลี่ยนแปลง (ไม่แย่ลง)"},date:"2026-06-18",
      quote:{ko:"피부타입:복합성,여드름(화농성,좁쌀),모공\n\n처음 받았을때 이게 분리되어 있는건지 모르고 그냥 썼었네요 ㅋㅋ 제품 안읽어보고 쓰면 이렇게 됩니당 ㅎ 쓸때마다 꼭 흔들어서 사용해주세요! 일단 확실히 거품클렌저라 미세거품 크리미하게 잘 나옵니다! 그래서 확실히 피부에 자극은 안갈 것 같아요! 거품 한두번만 짜도 충분히 세안 가능해서 부드럽게 클렌징할 수 있었고, 세수하고 나면 비누기가 제대로 닦인게 맞나 싶을 정도로 마무리감이 촉촉해요. 세안하고나서 당김 있으신분들이 사용하기 좋을 것 같습니다! 저는 살면서 사용해본 클렌징중에 당김을 딱히 느껴본 적은 없어서 오히려 세안이 제대로된게 맞나 싶더라구요? 저는 유분기도 많고.. 모공도 크고 피지가 많아서 조금 세정력이 부족하다고 느낄 순 있을 것 같아요! 그렇다고 피부에 여드름이 난다거나 좁쌀이 난다거나 어떤 피부 변화가 있는 건 아닙니다! 워낙 순해서 그런 반응은 딱히 없네요! 세안후에도 촉촉한 마무리감 원하시는 분들한테 강추 드립니당 !",en:"Skin type: combination, acne (cystic, tiny bumpy), pores\n\nWhen I first got it I didn't realize the layers were separated and just used it as is ㅋㅋ This is what happens when you don't read the instructions ㅎ Be sure to shake it every time before use! Anyway, it's definitely a foam cleanser and produces fine, creamy micro-foam! So I feel like it definitely won't irritate the skin! Even one or two pumps of foam was enough to cleanse, so I could cleanse gently, and after washing my face, the finish is so moisturized it made me wonder if the soapy residue was actually properly removed. I think this would be great for people who get tightness after cleansing! I've personally never really felt tightness with any cleanser I've used in my life, so it made me wonder if I was even cleansing properly? I have a lot of oil, big pores, and lots of sebum, so I might feel the cleansing power is a bit lacking. That said, it's not like I get acne or bumpy breakouts or any skin changes from it! It's gentle enough that I don't get those kinds of reactions. Highly recommend for those who want a moisturized finish after cleansing!","zh-CN":"肤质：混合性，痘痘（脓包型、闭口），毛孔\n\n刚拿到的时候都不知道要先摇匀，就直接拿来用了哈哈，不看产品说明就是这样。每次用之前请一定要摇一摇！首先确实是气泡洁面类型，能挤出细腻绵密的微气泡！所以对皮肤应该不会有刺激。挤一两下泡沫就足够洁面了，能温和清洁，洗完脸之后收尾感很水润，甚至会怀疑皂感是不是真的洗干净了。想推荐给洗后容易紧绷的人！我用过的洁面产品里，从没感觉到过这种紧绷感，反而怀疑是不是真的洗干净了？我皮脂比较多……毛孔也大，皮脂多，可能会觉得清洁力有点不够！但也没有出现长痘、闭口之类的皮肤变化！可能就是因为太温和了，没有出现那种反应！强烈推荐给想要洗后水润收尾的朋友！","zh-TW":"膚質：混合性、痘痘（化膿性、粉刺）、毛孔\n\n第一次收到時不知道是分層的，就直接拿來用了ㅋㅋ不看說明就用會這樣ㅎ每次使用一定要先搖勻！首先確實是氣泡潔顏乳，微氣泡出來很綿密！這樣應該真的不會刺激皮膚！按一兩次泡沫就足夠洗臉，能柔順地清潔，洗完臉之後甚至懷疑有沒有真的洗掉肥皂感，收尾感非常水潤。推薦給洗完臉會緊繃的人使用！我用過這麼多卸妝洗顏產品，這款是少數完全沒感覺到緊繃的，反而讓我懷疑是不是真的洗乾淨了？我本身油脂多、毛孔大、皮脂也多，可能會覺得潔淨力稍微不夠！但也不會因此長痘痘或冒粉刺，沒有任何肌膚變化！可能因為真的很溫和，沒有出現那種反應！強力推薦給想要洗完臉水潤收尾的人！",ja:"肌タイプ：混合肌、ニキビ(化膿性、細かいニキビ)、毛穴\n\n最初に受け取ったとき、これが分離しているのを知らずにそのまま使っていました(笑)製品を読まずに使うとこうなります(笑)使うときは必ず振ってから使ってください！まず確実にバブルクレンザーなので微細な泡がクリーミーによく出ます！なので確実に肌への刺激は少なそうです！泡を1〜2回出すだけで十分に洗顔できて優しくクレンジングでき、洗顔後は洗浄成分がきちんと落ちているのか気になるくらい仕上がりがしっとりします。洗顔後につっぱりがある方が使うのに良さそうです！私は今まで使ったクレンジングの中でつっぱりを特に感じたことがなかったので、むしろちゃんと洗顔できているのか気になるくらいでした?私は油分も多く…毛穴も大きく皮脂も多いので、少し洗浄力が足りないと感じることもありそうです！だからといって肌にニキビが出たり細かいニキビが出たりといった肌の変化はありません！とてもマイルドなのでそういう反応は特にありません！洗顔後もしっとりした仕上がりを求める方に強くおすすめします！",th:"ประเภทผิว: ผิวผสม เป็นสิว (อักเสบเป็นหนอง สิวเสี้ยน) รูขุมขน\n\nตอนได้รับมาครั้งแรกไม่รู้ว่าต้องเขย่าให้ชั้นแยกผสมกันก่อน เลยใช้เฉยๆ ฮ่าๆ ถ้าไม่อ่านรายละเอียดสินค้าก่อนใช้ก็จะเป็นแบบนี้แหละฮ่า ทุกครั้งที่ใช้ต้องเขย่าก่อนนะคะ! อันดับแรกเป็นบับเบิลคลีนเซอร์แน่นอน ฟองละเอียดครีมมี่ออกมาดีมาก! เลยรู้สึกว่าน่าจะไม่ระคายเคืองผิวแน่นอน! แค่กดฟองหนึ่งสองครั้งก็เพียงพอสำหรับล้างหน้าแล้ว ล้างได้อย่างนุ่มนวล ล้างหน้าเสร็จแล้วรู้สึกชุ่มชื้นจนสงสัยว่าล้างสบู่ออกหมดจริงหรือเปล่า คนที่ตึงหลังล้างหน้าน่าจะใช้ตัวนี้ได้ดี! ตัวฉันเองไม่เคยรู้สึกตึงจากคลีนเซอร์ตัวไหนมาก่อนเลย เลยแอบสงสัยว่าล้างสะอาดจริงหรือเปล่านะ? เพราะฉันมีไขมันเยอะ.. รูขุมขนก็กว้างและมีไขมันมาก อาจรู้สึกว่าแรงทำความสะอาดไม่เพียงพอนิดหน่อย! แต่ก็ไม่ได้ทำให้สิวขึ้นหรือมีสิวเสี้ยนขึ้นหรือผิวเปลี่ยนแปลงไปในทางแย่ลงแต่อย่างใด! เพราะอ่อนโยนมากจริงๆ ไม่มีปฏิกิริยาแบบนั้นเลย! แนะนำสุดๆ สำหรับคนที่ต้องการความชุ่มชื้นหลังล้างหน้าค่ะ!"},images:[],video:null},
    {id:"Zm2BNOWq",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지/민감, 예민하고 벗겨지던 피부가 안정됨",en:"Combination (oily-dehydrated)/sensitive, skin that used to be sensitive and flaking has stabilized","zh-CN":"水油皮/敏感，容易敏感脱皮的肌肤趋于稳定","zh-TW":"外油內乾/敏感，敏感易脫皮的皮膚變穩定",ja:"インナードライ肌/敏感肌、敏感で皮がむけていた肌が安定",th:"ผิวมันขาดน้ำ/แพ้ง่าย ผิวที่แพ้ง่ายและเป็นขุยเริ่มสงบลง"},date:"2026-05-29",
      quote:{ko:"수부지, 민감성, 약 1주 사용\n\n세정력 ⭐️⭐️⭐️⭐️⭐️ 쓰던 퍼프가 클렌징폼이랑 워터로도 잔여물이 많아서 이 제품으로 거품 흡수시켜 닦아보니 속에 있는 파운데이션이 엄청 나왔어요. 그리곤 잔여물이 안나오게 깨끗한 처음의 색으로 바뀌었네요. 세정력 굿입니다. 또 비누로 샤워해도 피부 위 피지가 기름처럼 있는 부위를 닦아보니 매끈하게 싹 닦이네요.\n\n향⭐️⭐️⭐️⭐️⭐️ 무향이라 너무 편해요. 안 독하고 세면이 편안합니다.\n\n제형⭐️⭐️⭐️⭐️⭐️ 거품 안내도 되고 오일을 피부에 안남게 쓰이는 제형이라 지복합성인데도 잘 닦아내지고 피부가 미끄럽게 싹 닦이는게 정말 좋습니다.\n\n기능⭐️⭐️⭐️⭐️⭐️ 피부장벽이 보호되는 느낌. 수부지에게 매우 좋습니다. 건조해서 피부가 좀 벗겨지고 예민해지는 편인데 이 제품 쓰고 피부가 안정되었어요.",en:"Combination (oily-dehydrated), sensitive, used for about 1 week\n\nCleansing power ⭐️⭐️⭐️⭐️⭐️ My puff had a lot of residue even after washing with cleansing foam and water, but when I soaked up this product's foam and wiped it, so much foundation came out from inside. Then it turned back to its clean original color with no more residue coming out. Cleansing power: great. Also when showering with soap, wiping over the oily/sebum areas of the skin, it wiped away smoothly and cleanly.\n\nScent ⭐️⭐️⭐️⭐️⭐️ Fragrance-free, so it's really easy on the face. Not harsh, comfortable to wash with.\n\nTexture ⭐️⭐️⭐️⭐️⭐️ You don't need to lather it yourself and it's a texture that doesn't leave oil residue on the skin, so even with combination-oily skin it washes off well and the skin feels smoothly wiped clean.\n\nFunction ⭐️⭐️⭐️⭐️⭐️ Feels like the skin barrier is protected. Very good for combination (oily-dehydrated) skin. I tend to get dry, flaky, and sensitive skin, but after using this product my skin has stabilized.","zh-CN":"水油皮，敏感性，使用约1周\n\n清洁力⭐️⭐️⭐️⭐️⭐️ 之前用的粉扑就算用洁面泡沫和清水洗也总有很多残留，用这款泡沫浸泡清洗，结果里面的粉底都被洗出来了。而且直到没有残留物冒出来，恢复到最初干净的颜色。清洁力很棒。而且用肥皂洗澡的时候，摸摸皮肤上像油一样的皮脂部位，也能光滑地一次洗干净。\n\n香味⭐️⭐️⭐️⭐️⭐️ 无香真的很省心。不刺鼻，洗脸时很舒适。\n\n质地⭐️⭐️⭐️⭐️⭐️ 不用另外打泡，也是不会在皮肤上留油的质地，虽然我是油性混合肌，也能洗得很干净，皮肤光滑地被清洗掉，真的很喜欢。\n\n功效⭐️⭐️⭐️⭐️⭐️ 感觉皮肤屏障被保护着。对水油皮非常好。我容易因为干燥而脱皮、变敏感，用了这款之后皮肤稳定下来了。","zh-TW":"外油內乾、敏感性，使用約1週\n\n潔淨力⭐️⭐️⭐️⭐️⭐️ 我用的粉撲用洗面乳和卸妝水洗都還是有很多殘留，用這款氣泡吸附擦拭後，發現裡面的粉底跑出來超多。之後就不再有殘留物，變回原本乾淨的顏色。潔淨力很棒。而且用肥皂洗澡時，皮膚上像油一樣的皮脂部位，用這款擦拭也能滑順地洗乾淨。\n\n香味⭐️⭐️⭐️⭐️⭐️ 無香真的很方便。不刺鼻，洗臉很舒服。\n\n質地⭐️⭐️⭐️⭐️⭐️ 不用另外起泡，也不會在皮膚上留下油感的質地，就算是油性混合肌也能洗得很乾淨，皮膚滑順地被洗淨，真的很喜歡。\n\n功能⭐️⭐️⭐️⭐️⭐️ 有種皮膚屏障被保護的感覺。對外油內乾肌非常好。我因為乾燥容易脫皮、變敏感，用了這款之後皮膚變穩定了。",ja:"インナードライ肌、敏感肌、約1週間使用\n\n洗浄力⭐️⭐️⭐️⭐️⭐️使っていたパフが洗顔フォームとウォーターでも残留物が多かったのですが、この製品で泡を吸収させて洗ってみたら、中にあったファンデーションがすごく出てきました。そして残留物が出なくなるまで、きれいな元の色に変わりました。洗浄力グッドです。また石けんでシャワーしても肌の上に油っぽく残った皮脂の部分を洗ってみると、すべすべにきれいに落ちます。\n\n香り⭐️⭐️⭐️⭐️⭐️無香なのでとても楽です。きつくなく洗顔が快適です。\n\nテクスチャー⭐️⭐️⭐️⭐️⭐️泡立てなくても良く、オイルを肌に残さないタイプなので脂性混合肌でもよく落ち、肌がすべすべにきれいに落ちるのが本当に良いです。\n\n機能⭐️⭐️⭐️⭐️⭐️肌バリアが守られている感じ。インナードライ肌にとても良いです。乾燥して肌が少し皮むけして敏感になる方ですが、この製品を使って肌が安定しました。",th:"ผิวมันขาดน้ำ แพ้ง่าย ใช้มาประมาณ 1 สัปดาห์\n\nแรงทำความสะอาด ⭐️⭐️⭐️⭐️⭐️ พัฟที่ใช้อยู่มีคราบตกค้างเยอะแม้ล้างด้วยโฟมหรือคลีนซิ่งวอเตอร์ พอลองซับด้วยฟองของผลิตภัณฑ์นี้แล้วเช็ด รองพื้นที่ฝังอยู่ในพัฟหลุดออกมาเยอะมาก แล้วก็กลับมาเป็นสีสะอาดดั้งเดิมโดยไม่มีคราบตกค้างเลย แรงทำความสะอาดดีมาก แล้วแม้อาบน้ำด้วยสบู่ พอเช็ดจุดที่มีไขมันบนผิวเหมือนน้ำมัน ก็ล้างออกเกลี้ยงเรียบเนียนดี\n\nกลิ่น ⭐️⭐️⭐️⭐️⭐️ ไม่มีกลิ่นเลยสบายมาก ไม่ฉุนและล้างหน้าได้อย่างสบาย\n\nเนื้อสัมผัส ⭐️⭐️⭐️⭐️⭐️ ไม่ต้องตีฟองเอง แล้วเนื้อสัมผัสก็ไม่ทิ้งออยล์ไว้บนผิว เลยแม้เป็นผิวผสมมันก็ล้างออกได้ดี ผิวเกลี้ยงเรียบเนียนดีมาก\n\nประสิทธิภาพ ⭐️⭐️⭐️⭐️⭐️ รู้สึกว่าเกราะผิวได้รับการปกป้อง ดีมากสำหรับผิวมันขาดน้ำ ปกติผิวจะเป็นขุยลอกและแพ้ง่ายเพราะความแห้ง แต่ใช้ผลิตภัณฑ์นี้แล้วผิวสงบลง"},images:[],video:null},
    {id:"AGE1m1XZ",rating:5,skinType:{ko:"중성",en:"Normal skin","zh-CN":"中性","zh-TW":"中性肌膚",ja:"普通肌",th:"ผิวธรรมดา"},sensitivity:{ko:"일반 피부",en:"Sensitive skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"중성/예민한 편, 전반적 만족도 높은 종합 후기",en:"Normal/somewhat sensitive skin, high overall satisfaction all-round review","zh-CN":"中性/偏敏感，整体满意度很高的综合测评","zh-TW":"中性/偏敏感，整體滿意度高的綜合心得",ja:"普通肌/敏感な方、全体的に満足度の高い総合レビュー",th:"ผิวธรรมดา/ค่อนข้างแพ้ง่าย รีวิวรวมที่พอใจโดยรวมสูง"},date:"2026-06-18",
      quote:{ko:"평소 피부가 예민한 편이라 클렌저를 바꿀 때마다 걱정이 많은데, 노마디아 버블 클렌저는 만족도가 높았어요 😊\n\n처음 사용했을 때 가장 마음에 들었던 점은 거품이 정말 촘촘하고 부드럽고 쫀쫀한 점이었어요! \n손에서 거품을 낼 때도 풍성하게 올라오고, \n얼굴에 닿는 느낌도 자극적이지 않아서 편안하게 세안할 수 있었습니다.\n\n특히 세안할 때 피부를 세게 문지르지 않아도 노폐물이 깔끔하게 제거되는 느낌이 들어 좋았어요. \n평소 선크림을 매일 바르고 가벼운 메이크업도 자주 하는 편인데, 잔여감 없이 산뜻하게 씻기는 점이 만족스러웠습니다. \n그렇다고 해서 세정력이 강한 제품들처럼 세안 후 얼굴이 뻣뻣해지거나 건조해지는 느낌은 거의 없었어요. \n호호바 오일이 함유되어 있어서 그런지 세안 후에도 피부가 한결 촉촉하고 편안한 느낌이 남더라고요 ✨\n\n향도 부담스럽지 않아서 좋았습니다\n인위적으로 강한 향을 싫어하는 편인데 은은한 사용감이라 매일 사용하기에 무리가 없었어요. \n아침 세안용으로도 괜찮고, 저녁에 하루 종일 쌓인 피지와 노폐물을 씻어낼 때도 만족스러웠습니다. \n사용 후 피부가 당기지 않아서 기초 제품을 바를 때도 훨씬 편안했어요👍\n\n며칠 동안 꾸준히 사용해 보니 피부 컨디션도 안정적으로 유지되는 느낌이 들었고, 세안 후 피부결이 조금 더 매끈하게 느껴졌습니다 😊 과하게 자극적이지 않으면서도 깔끔한 세정력을 원하는 분들께 잘 맞을 것 같아요. \n\n건성, 복합성 피부는 물론이고 세안 후 당김 때문에 고민하시는 분들께도 추천드리고 싶습니다. \n\n전체적으로 세정력, 사용감, 촉촉함의 균형이 잘 잡힌 제품이라 만족스럽게 사용하고 있고 재구매 의사도 만땅!!!있습니다 👍💛",en:"My skin's on the sensitive side, so I always worry when switching cleansers, but I was really happy with the NOMADIA Bubble Cleanser 😊\n\nWhat I loved most the first time I used it was how dense, soft, and bouncy the foam was!\nIt came out rich and full even just building it up in my hands,\nand it felt gentle on my face, not irritating at all, so I could wash comfortably.\n\nWhat I especially liked was that it cleared away impurities cleanly without needing to scrub hard.\nI wear sunscreen every day and often do light makeup, so I was happy that it rinsed off cleanly without any residue.\nEven so, my face didn't feel stiff or dry afterward the way it does with strong-cleansing products.\nMaybe it's the jojoba oil, but my skin stayed noticeably moist and comfortable even after washing ✨\n\nThe scent wasn't overwhelming either, which I liked\nI'm not a fan of artificially strong scents, and this one was subtle enough for everyday use.\nIt worked fine for morning washing, and was satisfying at night too for washing off a day's worth of sebum and grime.\nMy skin didn't feel tight afterward, so applying my basic skincare was way more comfortable too 👍\n\nAfter using it consistently for several days, my skin condition felt stable, and my texture felt a bit smoother after washing 😊 I think this would suit anyone who wants clean cleansing without being overly harsh.\n\nI'd recommend it to dry and combination skin types, and also to anyone who struggles with tightness after washing.\n\nOverall it's a product with a great balance of cleansing power, texture, and moisture, so I'm using it happily and definitely plan to repurchase!!! 👍💛","zh-CN":"我平时皮肤偏敏感，每次换洁面产品都很担心，但NOMADIA气泡洁面满意度很高😊\n\n第一次用最喜欢的是泡沫真的很细密柔软紧实！\n在手上打泡也能蓬松地冒出来，\n接触脸部的感觉也不刺激，能舒适地洁面。\n\n特别是洗脸时不用用力搓，就能感觉废物被干净地清除了。\n我平时每天都涂防晒，也经常化淡妆，能清爽洗净没有残留感这点很满意。\n但也不像清洁力强的产品那样，洗完脸僵硬或干燥。\n可能是含有荷荷巴油，洗后皮肤依然水润舒适✨\n\n香味也不重，这点很好\n我不喜欢人工浓香，这种淡淡的使用感每天用也没问题。\n当早晨洁面用也不错，晚上洗掉一天积累的皮脂和废物时也很满意。\n用完之后不紧绷，涂基础护肤品时也更舒适👍\n\n连续用了几天，皮肤状态感觉维持得很稳定，洗后皮肤纹理也感觉更细腻😊 想推荐给不想要过度刺激、又想要干净清洁力的人。\n\n干性、混合性肌肤，以及被洗后紧绷困扰的人都想推荐。\n\n整体来说是清洁力、使用感、水润感平衡得很好的产品，用得很满意，回购意愿也是满满的!!!👍💛","zh-TW":"我皮膚平常偏敏感，每次換洗面乳都很擔心，但NOMADIA氣泡潔顏乳讓我滿意度很高 😊\n\n第一次使用時最喜歡的一點是泡沫真的很細緻柔軟又紮實！\n在手上起泡時也很豐盈地湧出來，\n碰到臉的觸感也不刺激，能舒服地洗臉。\n\n特別喜歡的是洗臉時不用用力搓，老廢物就能被乾淨清除。\n我平常每天都擦防曬乳，也常上淡妝，洗完之後沒有殘留感、清爽感很滿意。\n但也不會像潔淨力強的產品那樣，洗完臉皮膚變得僵硬或乾燥。\n可能因為含有荷荷芭油，洗完臉後皮膚還留有一層水潤舒適感 ✨\n\n香味也不會有負擔，這點很喜歡\n我不喜歡人工感強烈的香味，這款淡雅的使用感每天用也沒問題。\n當早晨洗臉用也不錯，晚上洗掉一整天累積的皮脂和老廢物時也很滿意。\n用完之後皮膚不緊繃，做基礎保養時也更舒服👍\n\n持續使用幾天後，皮膚狀況感覺維持得很穩定，洗完臉後膚質也感覺更細緻一點 😊 想要不過度刺激又乾淨潔淨的人應該會很適合。\n\n不只是乾性、混合性肌膚，因為洗完臉緊繃而困擾的人我也想推薦。\n\n整體來說是潔淨力、使用感、水潤度平衡得很好的產品，用得很滿意，回購意願也滿滿!!!👍💛",ja:"普段肌が敏感な方でクレンザーを変えるたびに心配が多いのですが、NOMADIAバブルクレンザーは満足度が高かったです😊\n\n初めて使ったとき一番気に入った点は泡が本当にきめ細かく柔らかくとろみがある点でした！\n手で泡立てるときも豊かに立ち上がり、\n顔に触れる感じも刺激的でなく快適に洗顔できました。\n\n特に洗顔するとき肌を強くこすらなくても老廃物がすっきり落ちる感じがして良かったです。\n普段日焼け止めを毎日塗って軽めのメイクもよくする方ですが、残留感なくさっぱり洗える点が満足でした。\nだからといって洗浄力の強い製品のように洗顔後に顔がこわばったり乾燥したりする感じはほとんどありませんでした。\nホホバオイルが含まれているからか、洗顔後も肌がより一層しっとり快適な感じが残りました✨\n\n香りも負担がなくて良かったです\n人工的で強い香りは苦手な方ですが、ほのかな使用感なので毎日使うのに無理がありませんでした。\n朝の洗顔用としても良く、夜に一日中溜まった皮脂や老廃物を洗い流すときも満足でした。\n使用後肌がつっぱらないのでスキンケアをつけるときもずっと快適でした👍\n\n数日間継続して使ってみると、肌コンディションも安定して保たれる感じがして、洗顔後肌のキメが少し滑らかに感じられました😊過度に刺激的でなくすっきりした洗浄力を求める方に合うと思います。\n\n乾燥肌、混合肌はもちろん、洗顔後のつっぱりで悩んでいる方にもおすすめしたいです。\n\n全体的に洗浄力、使用感、しっとり感のバランスが取れた製品なので満足して使っていて、リピート意向も満タン！！！あります👍💛",th:"ปกติเป็นผิวที่ค่อนข้างแพ้ง่าย เลยกังวลทุกครั้งที่เปลี่ยนคลีนเซอร์ แต่บับเบิลคลีนเซอร์ของโนมาเดียพอใจมากค่ะ 😊\n\nจุดที่ชอบที่สุดตอนใช้ครั้งแรกคือฟองที่ละเอียด นุ่มนวล และหนึบแน่นมาก! \nตอนตีฟองในมือก็ฟูขึ้นเยอะ \nสัมผัสบนใบหน้าก็ไม่ระคายเคือง ล้างหน้าได้อย่างสบาย\n\nโดยเฉพาะตอนล้างหน้าไม่ต้องถูแรงก็รู้สึกว่าสิ่งสกปรกหลุดออกหมดจดดี \nปกติทาครีมกันแดดทุกวันและแต่งหน้าเบาๆ บ่อยๆ พอใจมากที่ล้างออกสดชื่นโดยไม่มีคราบตกค้าง \nแต่ก็ไม่ได้รู้สึกว่าหลังล้างหน้าหน้าจะแข็งหรือแห้งเหมือนผลิตภัณฑ์ที่แรงทำความสะอาดสูง \nอาจเพราะมีน้ำมันโฮโฮบา หลังล้างหน้าผิวยังชุ่มชื้นและสบายอยู่เลยค่ะ ✨\n\nกลิ่นก็ไม่มีภาระด้วย\nปกติไม่ชอบกลิ่นสังเคราะห์แรงๆ แต่กลิ่นอ่อนๆ แบบนี้ใช้ทุกวันได้สบาย \nใช้ล้างหน้าตอนเช้าก็โอเค ตอนเย็นล้างไขมันและสิ่งสกปรกที่สะสมทั้งวันก็พอใจมาก \nหลังใช้ผิวไม่ตึงเลย เลยทาสกินแคร์ต่อได้สบายขึ้นมาก👍\n\nใช้ต่อเนื่องมาหลายวันแล้ว รู้สึกว่าสภาพผิวคงที่มั่นคงขึ้น หลังล้างหน้าผิวก็เนียนขึ้นนิดหน่อยด้วย 😊 น่าจะเหมาะกับคนที่อยากได้แรงทำความสะอาดที่สะอาดหมดจดโดยไม่ระคายเคืองเกินไป \n\nอยากแนะนำทั้งผิวแห้ง ผิวผสม และคนที่กังวลเรื่องตึงหลังล้างหน้าด้วย \n\nโดยรวมเป็นผลิตภัณฑ์ที่สมดุลดีทั้งแรงทำความสะอาด ความรู้สึกเมื่อใช้ และความชุ่มชื้น พอใจมากและตั้งใจซื้อซ้ำเต็มร้อย!!! 👍💛"},images:[],video:null},
    {id:"Jve415oA",rating:4,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"40대 중반 속건조 심한 예민 피부, 각질 순하게 불려서 세정",en:"Mid-40s with severe underlying dryness and sensitive skin, gently softens flakes while cleansing","zh-CN":"40多岁中年，内干严重的敏感肌，温和地泡软角质完成清洁","zh-TW":"40多歲中段內在乾燥嚴重的敏感肌，溫和軟化角質後清潔",ja:"40代半ば、インナードライがひどい敏感肌、角質を優しくふやかして洗浄",th:"วัย 40 กว่า ผิวขาดน้ำรุนแรงและแพ้ง่าย ช่วยละลายขุยผิวได้อย่างอ่อนโยน"},date:"2026-06-18",
      quote:{ko:"본인:여자 40대중반\n피부:속건조 많이 심함, 예민한편이고  세수하자마자 땡기는 피부\n\n여태 수많은 클렌징 제품을 써봐왔고\n그 중에 정말 한,두개만 맘에 들 정도 \n피부에 잘 맞거나 안심하면서 편안하게 제품은 거의 없었어요\n\n골든호호바 버블클렌저는\n첨에 거품이 풍성하게 나오고 조밀해서 \n얼굴에 닿자마자 부드럽게 감싸는 느낌이 들었어요\n거품이 금방이 없어지는건 아닐까했는데\n물로 씻기전까지 거품이 살아있고\n자극없이 씻겨요\n\n다른 폼클렌저 쓸때는\n해면스펀지까지 쓰면서 각질을 빡빡 닦아냈다면\n골든호호바 버블클렌저는\n자극이 없는데 각질을 잘 불려서 씻겨주는거 같아요\n\n피부와 동안한 약산성인데다가\n무향료,무색소,무에탄올 자극적인거 없이 속당김심한피부,수분부족지성,약한피부에도 쓸수 있어요\n뽀득뽀득 안씻긴다고 해서 찝찝함도 없이 \n세안하자마자 얼굴땡김이 덜해서 저는 너무 만족했어요\n\n속건조를 어느정도 잡아주니 넘 좋네요",en:"Me: woman, mid-40s\nSkin: quite severe underlying dryness, on the sensitive side, skin that tightens right after washing\n\nI've tried countless cleansing products over the years\nand only one or two out of all of them really suited my skin or felt safe and comfortable\n\nWith the Golden Jojoba Bubble Cleanser,\nthe foam came out rich and dense from the start,\nand the moment it touched my face it felt like it wrapped around gently\nI worried the foam might disappear quickly,\nbut it stayed alive until I rinsed with water,\nand it washed off without irritation\n\nWith other foam cleansers,\nI used to scrub off flakes hard, even using a sea sponge,\nbut the Golden Jojoba Bubble Cleanser\nseems to gently soften flakes and wash them away without irritation\n\nIt's mildly acidic, matching skin's own pH,\nand with no fragrance, no dyes, no ethanol, nothing irritating, it can be used even on skin with severe tightness, water-deficient oily skin, or weak/sensitive skin\nIt doesn't leave that squeaky-clean feeling but there's no uncomfortable residue either,\nand my face felt less tight right after washing, so I was really satisfied\n\nIt helps calm the underlying dryness quite a bit, which is so nice","zh-CN":"本人：女性，40多岁中段\n皮肤：内干很严重，偏敏感，一洗完脸就紧绷\n\n用过无数清洁产品，\n真正合心意的也就那么一两款，\n对皮肤合适又能安心舒适使用的产品几乎没有。\n\n金色荷荷巴气泡洁面\n一开始泡沫蓬松细密，\n一碰到脸就有种被柔软包裹的感觉。\n本来担心泡沫会不会很快消掉，\n结果洗到用水冲之前泡沫都还在，\n而且无刺激地洗掉。\n\n用其他洁面泡沫时\n我甚至要用海绵使劲搓掉角质，\n金色荷荷巴气泡洁面\n没有刺激却能把角质泡软洗掉的感觉。\n\n和皮肤一样是弱酸性，\n又无香料、无色素、无乙醇，没有刺激性成分，内干严重的肌肤、水分不足的油性肌肤、脆弱肌肤都能用\n没有那种洗到吱吱响的感觉，也不觉得不清爽，\n洗完脸紧绷感明显减少，我真的很满意。\n\n能在一定程度上缓解内干，真的很喜欢","zh-TW":"本人：女性，40多歲中段\n膚質：內在乾燥嚴重，偏敏感，洗完臉馬上緊繃\n\n至今用過無數清潔產品，\n其中真正合我心意、皮膚適合又能安心舒服使用的，大概只有一兩款\n\n金盞荷荷芭氣泡潔顏乳\n一開始泡沫就豐盈紮實，\n碰到臉的瞬間就有種被溫柔包覆的感覺\n本來擔心泡沫會不會很快消掉，\n結果一直到用水沖洗前泡沫都還在，\n無刺激地洗乾淨\n\n用其他洗面乳時\n還要用海綿把角質使勁擦掉，\n但金盞荷荷芭氣泡潔顏乳\n完全無刺激，卻感覺能把角質軟化後洗掉\n\n是和皮膚相同的弱酸性，\n無香料、無色素、無酒精，沒有刺激成分，\n連內在乾燥嚴重、外油內乾、脆弱肌都能使用\n沒有咕溜咕溜的乾淨感也不會覺得不舒服，\n洗完臉馬上就覺得緊繃感減少了，我真的很滿意\n\n能一定程度改善內在乾燥，這點真的很棒",ja:"本人：女性、40代半ば\n肌：インナードライがかなりひどく、敏感な方で、洗顔した瞬間つっぱる肌\n\nこれまで数多くのクレンジング製品を使ってきましたが、\nその中で本当に1〜2個だけ気に入るくらいで、\n肌に合ったり安心して快適に使える製品はほとんどありませんでした\n\nゴールデンホホババブルクレンザーは\n最初、泡が豊かに出てきてきめ細かく、\n顔に触れた瞬間優しく包まれる感じがしました\n泡がすぐ消えてしまうのではと思いましたが、\n水で洗い流すまで泡が生きていて\n刺激なく洗えます\n\n他の洗顔フォームを使うときは\nスポンジまで使って角質をゴシゴシ落としていましたが、\nゴールデンホホババブルクレンザーは\n刺激がないのに角質をよくふやかして洗い流してくれる感じがします\n\n肌と同じ弱酸性である上に\n無香料、無着色、無エタノールで刺激的なものがなく、つっぱりのひどい肌、水分不足の脂性肌、弱い肌にも使えます\nキュッキュッと洗えていないという不快感もなく、\n洗顔してすぐ顔のつっぱりが少なくて私はとても満足でした\n\nインナードライをある程度抑えてくれるのでとても良いです",th:"ตัวเอง: ผู้หญิงวัย 40 กว่า\nผิว: ผิวขาดน้ำรุนแรงมาก แพ้ง่าย เป็นผิวที่ตึงทันทีที่ล้างหน้าเสร็จ\n\nเคยใช้ผลิตภัณฑ์คลีนซิ่งมาเยอะมาก\nแต่มีแค่หนึ่งสองตัวเท่านั้นที่ถูกใจ \nแทบไม่มีผลิตภัณฑ์ที่เข้ากับผิวหรือใช้ได้อย่างอุ่นใจสบายผิวเลย\n\nบับเบิลคลีนเซอร์โกลเด้นโฮโฮบา\nพอเริ่มใช้ ฟองฟูออกมาแน่นและละเอียด \nพอสัมผัสหน้าก็รู้สึกเหมือนถูกห่อหุ้มอย่างนุ่มนวลทันที\nกังวลว่าฟองจะยุบเร็วไหม\nแต่ฟองยังคงอยู่จนกว่าจะล้างด้วยน้ำ\nล้างได้โดยไม่ระคายเคือง\n\nตอนใช้โฟมล้างหน้าอื่น\nต้องใช้ฟองน้ำถูขุยผิวออกแรงๆ แต่พอใช้\nบับเบิลคลีนเซอร์โกลเด้นโฮโฮบา\nไม่ระคายเคืองแต่รู้สึกว่าช่วยละลายขุยผิวให้นุ่มก่อนล้างออก\n\nเป็นกรดอ่อนใกล้เคียงกับผิว\nไม่มีน้ำหอม ไม่มีสี ไม่มีเอทานอล ไม่ระคายเคือง ใช้ได้แม้ผิวตึงง่าย ผิวมันขาดความชุ่มชื้น หรือผิวอ่อนแอ\nไม่สะอาดเอี๊ยดจนรู้สึกไม่สบายผิว \nพอล้างหน้าเสร็จก็ตึงน้อยลง พอใจมากจริงๆ\n\nช่วยจัดการผิวขาดน้ำได้ในระดับหนึ่ง ดีมากค่ะ"},images:[],video:null},
    {id:"ZN6Q3meZ",rating:4,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"수부지, 이중세안 부담 느끼던 피부 - 단일세안으로도 만족",en:"Combination (oily-dehydrated), used to feel burdened by double cleansing - satisfied with single cleanse","zh-CN":"水油皮，曾觉得双重清洁有负担 - 单次清洁也很满意","zh-TW":"外油內乾，原本覺得雙重清潔有負擔的肌膚 - 單次清潔也滿意",ja:"インナードライ肌、ダブル洗顔に負担を感じていた肌 - 一度の洗顔でも満足",th:"ผิวมันขาดน้ำ ผิวที่เคยรู้สึกเป็นภาระกับการล้างหน้าสองครั้ง - ล้างครั้งเดียวก็พอใจ"},date:"2026-06-11",
      quote:{ko:"🫪 본인 피부타입: 수부지\n\n✅️ 땡김X\n이 클렌저 사용 후, 피부 땡김이라던가 속건조, 붉은기 같은 증상이 없었어요. 피부 만졌을 때도 뽀독뽀독한 느낌이 안들고 맨들맨들하더라고요. 촉촉한 마무리감이라 설명되어 있는데 맞는 것 같습니다~ 건성, 수부지가 사용하기에 아주 좋은 클렌저란 생각이 듭니다!\n\n✅️ 순하다\n화학 약품 많이 써서 뽀글거리는 거품이 아닌 느낌이 들어요. 다른 클렌저는 거품이 밀도 있어서 화학 약품 가득한 느낌인데, 노마디아 클렌저 거품은 금방 사그라지는 순수한 거품 느낌이에요. 사춘기나 자극적인 거 싫어하는 분들께 추천드려요!\n\n✅️ 무향\n순하다고 느낀 부분 중 하나가 더 있는데, 무향이라는 점! 진한 향 안 좋아하는 사람이라 마음에 들었습니다.\n\n✅️ 이중 세안 싫은 분들 추천\n저는 화장 안하고 선크림만 바르고 다니는 사람인데 클렌징오일을 자주 쓰면 피부 장벽이 무너진다는 말을 들어 고민했는데, 이 클렌저는 단일세안으로 꽤 깨끗해지는 것 같아요. 안에 피부 장벽보호 물질도 있어서 더 좋습니다",en:"🫧 My skin type: combination (oily-dehydrated)\n\n✅️ No tightness\nAfter using this cleanser, I had no tightness, underlying dryness, or redness at all. When I touched my skin it didn't feel squeaky, it felt smooth. It says it leaves a moisturized finish, and that seems accurate~ I think this cleanser is really great for dry and combination (oily-dehydrated) skin!\n\n✅️ Gentle\nIt doesn't feel like a foam packed with harsh chemicals that bubbles up a lot. Other cleansers have dense foam that feels like it's full of chemicals, but NOMADIA's foam feels pure and settles quickly. I'd recommend it for teens or anyone who dislikes harsh products!\n\n✅️ Fragrance-free\nAnother thing that made it feel gentle - it's fragrance-free! I don't like strong scents, so this was a plus for me.\n\n✅️ Recommended for those who dislike double cleansing\nI don't wear makeup, just sunscreen, and I'd heard that using cleansing oil often breaks down the skin barrier, so I was on the fence. But this cleanser seems to get me pretty clean with just a single cleanse. It also has skin barrier-protecting ingredients in it, which is an extra plus","zh-CN":"🫪 本人肤质：水油皮\n\n✅️ 不紧绷\n用了这款洁面之后，没有出现紧绷、内干或泛红等症状。摸皮肤也不是那种吱吱响的感觉，而是滑滑的。产品说明说是水润收尾，感觉确实如此~干性、水油皮用这款洁面真的很合适！\n\n✅️ 温和\n不是那种加了很多化学成分、噼里啪啦的泡沫感。其他洁面产品泡沫密度大，感觉化学成分很浓，NOMADIA洁面的泡沫感觉是很快消散的纯净泡沫。推荐给青春期或不喜欢刺激感的人！\n\n✅️ 无香\n温和这一点还有一个体现，就是无香！我不喜欢浓香，这点很满意。\n\n✅️ 推荐给不喜欢二次清洁的人\n我平时不化妆只涂防晒，听说经常用卸妆油会让皮肤屏障崩溃，一直很纠结，这款洁面单次清洁就能洗得相当干净。里面还有护理皮肤屏障的成分，更好了","zh-TW":"🫪 本人膚質：外油內乾\n\n✅️ 不緊繃\n用了這款潔顏產品之後，沒有出現緊繃、內在乾燥、泛紅這些症狀。摸起來也不是咕溜咕溜的乾淨感，而是滑順的觸感。說明裡寫著收尾水潤，我覺得真的很符合~覺得是很適合乾性、外油內乾肌使用的潔顏產品！\n\n✅️ 溫和\n不是那種用很多化學成分做出來的濃密泡沫感覺。其他洗面乳泡沫密度很高，感覺化學成分很重，但NOMADIA的泡沫是那種很快消散的純粹泡沫感。推薦給青春期或討厭刺激感的人！\n\n✅️ 無香\n覺得溫和的另一個原因是無香這一點！我不喜歡濃烈的香味，這點很喜歡。\n\n✅️ 推薦給討厭雙重清潔的人\n我平常不化妝只擦防曬乳，聽說常用卸妝油會讓皮膚屏障崩壞，一直很煩惱，但這款單次清潔好像就能洗得很乾淨。裡面還有保護皮膚屏障的成分，更加分",ja:"🫪本人の肌タイプ：インナードライ肌\n\n✅️つっぱりなし\nこのクレンザーを使った後、肌のつっぱりやインナードライ、赤みのような症状がありませんでした。肌に触れたときもキュッキュッとした感じではなくすべすべしていました。しっとりした仕上がりだと説明されていますが、その通りだと思います〜乾燥肌、インナードライ肌が使うのにとても良いクレンザーだと思います！\n\n✅️マイルド\n化学薬品をたくさん使ってブクブクした泡ではない感じがします。他のクレンザーは泡が密度が高くて化学薬品でいっぱいな感じですが、NOMADIAクレンザーの泡はすぐ消えていく純粋な泡の感じです。思春期の方や刺激的なものが苦手な方におすすめします！\n\n✅️無香\nマイルドだと感じた部分がもう一つあるのですが、無香という点！濃い香りが苦手な人なので気に入りました。\n\n✅️ダブル洗顔が嫌な方におすすめ\n私はメイクをせず日焼け止めだけ塗って過ごす人ですが、クレンジングオイルをよく使うと肌バリアが崩れると聞いて悩んでいましたが、このクレンザーは一度の洗顔でかなりきれいになる感じがします。中に肌バリア保護物質も入っているのでさらに良いです",th:"🫪 ประเภทผิวตัวเอง: ผิวมันขาดน้ำ\n\n✅️ ไม่ตึง\nหลังใช้คลีนเซอร์นี้ ไม่มีอาการตึง ขาดน้ำ หรือแดงเลย จับผิวดูก็ไม่รู้สึกสะอาดเอี๊ยดแต่เรียบเนียนนุ่ม อธิบายว่าจบด้วยความชุ่มชื้น รู้สึกว่าตรงตามที่บอกจริงๆ~ คิดว่าเป็นคลีนเซอร์ที่เหมาะกับผิวแห้งและผิวมันขาดน้ำมาก!\n\n✅️ อ่อนโยน\nรู้สึกว่าไม่ใช่ฟองแบบที่ใช้สารเคมีเยอะจนฟู่ฟ่า คลีนเซอร์อื่นฟองจะแน่นจนรู้สึกเหมือนมีสารเคมีเยอะ แต่ฟองของคลีนเซอร์โนมาเดียเป็นฟองบริสุทธิ์ที่ยุบเร็ว แนะนำสำหรับวัยรุ่นหรือคนที่ไม่ชอบอะไรที่ระคายเคือง!\n\n✅️ ไม่มีกลิ่น\nอีกจุดที่รู้สึกว่าอ่อนโยนคือไม่มีกลิ่นเลย! เป็นคนไม่ชอบกลิ่นแรงๆ เลยถูกใจมาก\n\n✅️ แนะนำสำหรับคนไม่ชอบล้างหน้าสองครั้ง\nฉันไม่แต่งหน้า ทาแค่ครีมกันแดด เคยกังวลเพราะได้ยินว่าใช้คลีนซิ่งออยล์บ่อยจะทำให้เกราะผิวพัง แต่คลีนเซอร์ตัวนี้ล้างครั้งเดียวก็สะอาดพอสมควรแล้ว แถมมีสารปกป้องเกราะผิวด้วย ยิ่งดีเข้าไปใหญ่"},images:[],video:null},
    {id:"JYNMr1jZ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지+여드름+모공, 폼클렌저에 뒤집어진 이력 - 수영 시작하며 재도전 성공",en:"Combination (oily-dehydrated) + acne + pores, history of breakouts from foam cleansers - succeeded on retry after starting swimming","zh-CN":"水油皮+痘痘+毛孔，曾被泡沫洁面搞爆发 - 开始游泳后重新挑战成功","zh-TW":"外油內乾+痘痘+毛孔，曾被洗面乳搞到爆痘 - 開始游泳後重新挑戰成功",ja:"インナードライ肌+ニキビ+毛穴、洗顔フォームで肌荒れした過去 - 水泳を始めて再挑戦成功",th:"ผิวมันขาดน้ำ+เป็นสิว+รูขุมขน เคยเห่อจากโฟมล้างหน้า - เริ่มว่ายน้ำแล้วลองใหม่สำเร็จ"},date:"2026-05-21",
      quote:{ko:"21호 수부지, 민감성, 모공o, 여드름o\n\n* 평소 폼클렌징 사용하면 피부가 뒤집어진 경험이 많아서 클렌징오일+피부과 처방 비누로만 세안\n\n최근에 수영을 시작하면서 수영장 샤워실에서 오일세안하기 번거로워서 신청해봤습니다. 원래 폼클렌징 사용을 꺼려서 걱정하면서 사용해봤는데 화장도 잘 지워지고(썬크림+쿠션+파우더, 눈화장x) 세안 직후 당기는 것도 없이 너무 만족하며 사용중입니다! 폼도 잘 나오고 폼 형태도 잘 유지됩니다. 가장 중요한 부분 🤘민감성 피부인 제게도 자극 없이 필요한 세정만 해줍니다🤘\n요약하자면 노폐물 제거 o, 세정력 o, 세정 후 수분감? o \n(호호바오일이라 그런지 몰라도 문지를때 오일리한 것 같기도 하고.. 느낌..?)\n자극감x, 잔여감x (클렌징 오일이 아니니 미끈하게 남거나 하는건 없습니다. 근데 세정후 피부가 매끈해보이긴 합니다)\n\n홍보문구에 급속진정이라고 있는데 요즘 덥지도 않고 진정시킬만한 요소가 없어서 그건 잘 모르겠습니다.",en:"Shade 21, combination (oily-dehydrated), sensitive, has pores, has acne\n\n* I've had my skin break out many times from using foam cleansers, so I've only used cleansing oil + dermatologist-prescribed soap\n\nI recently started swimming and it was a hassle to do oil cleansing in the pool shower room, so I gave this a try. I was originally wary of foam cleansers so I used it cautiously, but it removes makeup well (sunscreen + cushion + powder, no eye makeup) and there's zero tightness right after washing - I've been using it very satisfied! The foam comes out well too and holds its shape well. Most importantly 🤘for my sensitive skin, it cleanses just what's needed without irritation🤘\nTo sum up: removes impurities o, cleansing power o, moisture after cleansing? o\n(maybe because of the jojoba oil, it feels a bit oily while rubbing.. that kind of feeling..?)\nno irritation, no residue (since it's not a cleansing oil, there's no slick residue left behind. but skin does look smooth after cleansing)\n\nThe promo copy mentions rapid soothing, but it's not hot these days and there wasn't much to soothe, so I can't really speak to that.","zh-CN":"21号色号，水油皮，敏感性，有毛孔，有痘痘\n\n* 平时用泡沫洁面经常爆发，所以一直只用卸妆油+皮肤科处方皂洗脸\n\n最近开始游泳，在泳池更衣室里用油类洁面很麻烦，就申请试用了这款。本来抗拒泡沫洁面，怀着担心用了一下，结果妆容能卸干净（防晒+气垫+散粉，没化眼妆），洗后也不紧绷，用得很满意！泡沫也出得很顺，形态也维持得好。最重要的一点🤘对我这种敏感肌也没有刺激，只做必要的清洁🤘\n总结一下：去污效果o，清洁力o，清洁后水润感？o\n（可能是荷荷巴油的缘故，打圈时感觉有点油润的感觉..?）\n无刺激x，无残留感x（不是卸妆油所以不会留下滑腻感，但洗后皮肤看起来确实很光滑）\n\n宣传语里写着'速效舒缓'，最近天气也不热没什么需要舒缓的情况，所以这点我还不太清楚。","zh-TW":"21號色、外油內乾、敏感性、有毛孔、有痘痘\n\n*平常用洗面乳常常會爆痘，所以一直只用卸妝油+皮膚科處方肥皂洗臉\n\n最近開始游泳，在游泳池的淋浴間用油卸妝很麻煩，於是申請試用了這款。本來很擔心洗面乳，結果彩妝也卸得很乾淨（防曬乳+氣墊+蜜粉，沒畫眼妝），洗完臉也完全不緊繃，超級滿意地在用！泡沫出得順，形狀也維持得很好。最重要的一點🤘對我這種敏感肌也能無刺激完成必要的清潔🤘\n總結：老廢物去除o、潔淨力o、清潔後水潤感？o\n（可能因為荷荷芭油的關係，打圈時感覺有點油潤……的感覺？）\n無刺激感x、無殘留感x（不是卸妝油，所以不會滑膩地殘留，但洗完臉皮膚看起來確實比較光滑）\n\n宣傳文案上寫著快速舒緩，最近天氣不熱，也沒有需要舒緩的狀況，所以這部分我不太清楚。",ja:"21号、インナードライ肌、敏感肌、毛穴あり、ニキビあり\n\n*普段洗顔フォームを使うと肌が荒れた経験が多いので、クレンジングオイル+皮膚科処方の石けんだけで洗顔\n\n最近水泳を始めて、プールのシャワー室でオイル洗顔するのが面倒だったので申し込んでみました。もともと洗顔フォームの使用を避けていたので心配しながら使ってみましたが、メイクもよく落ちて(日焼け止め+クッションファンデ+パウダー、アイメイクなし)洗顔直後つっぱりもなく、とても満足して使っています！泡もよく出て泡の形もよく保たれます。一番大事な部分🤘敏感肌の私にも刺激なく必要な洗浄だけしてくれます🤘\nまとめると、老廃物除去○、洗浄力○、洗浄後の水分感?○\n(ホホバオイルだからか分かりませんが、こするとき少しオイリーな感じもする気が…?)\n刺激感×、残留感×(クレンジングオイルではないのでぬるぬる残ることはありません。でも洗浄後肌がすべすべに見えます)\n\n宣伝文句に急速鎮静とありますが、最近暑くもなく鎮静させる要素がないのでそこはよく分かりません。",th:"เบอร์ผิว 21 ผิวมันขาดน้ำ แพ้ง่าย มีรูขุมขน มีสิว\n\n* ปกติใช้โฟมล้างหน้าแล้วมักเห่อบ่อย เลยล้างหน้าด้วยคลีนซิ่งออยล์+สบู่ที่หมอผิวหนังสั่งเท่านั้น\n\nช่วงนี้เริ่มว่ายน้ำ แล้วรู้สึกยุ่งยากที่ต้องล้างด้วยออยล์ในห้องอาบน้ำที่สระ เลยลองสมัครมาลองใช้ดู เดิมทีไม่ค่อยใช้โฟมล้างหน้าเลยกังวลนิดหน่อย แต่พอลองใช้ก็ล้างเมคอัพออกได้ดี (ครีมกันแดด+คุชชั่น+แป้ง ไม่ได้แต่งตา) หลังล้างหน้าไม่ตึงเลย พอใจมากเลยใช้ต่อเนื่อง! ฟองก็ออกมาดี รูปทรงฟองก็คงอยู่ดี ที่สำคัญที่สุด 🤘แม้เป็นผิวแพ้ง่ายก็ทำความสะอาดได้เท่าที่จำเป็นโดยไม่ระคายเคือง🤘\nสรุปคือ กำจัดสิ่งสกปรก o, แรงทำความสะอาด o, ความชุ่มชื้นหลังล้าง? o \n(อาจเพราะมีน้ำมันโฮโฮบา ตอนนวดคลึงรู้สึกเหมือนมีความมันนิดหน่อย.. รู้สึกแบบนั้น..?)\nระคายเคือง x, คราบตกค้าง x (ไม่ใช่คลีนซิ่งออยล์เลยไม่มีความลื่นเหนอะหนะตกค้าง แต่หลังล้างหน้าผิวดูเรียบเนียนขึ้น)\n\nในคำโฆษณาบอกว่าปลอบประโลมทันที แต่ช่วงนี้อากาศไม่ร้อนและไม่มีอะไรให้ต้องปลอบประโลม เลยไม่แน่ใจในจุดนั้นค่ะ"},images:[],video:null},
    {id:"ZjKnO3Oq",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"임신 후 민감성+건성, 안전성분 확인 후 데일리 사용",en:"Sensitive + dry after pregnancy, uses daily after checking ingredient safety","zh-CN":"孕期敏感性+干皮，确认安全成分后日常使用","zh-TW":"懷孕後敏感+乾性，確認安全成分後每天使用",ja:"妊娠後の敏感肌+乾燥肌、安全性成分を確認した上でデイリー使用",th:"หลังตั้งครรภ์ผิวแพ้ง่าย+ผิวแห้ง เช็คส่วนผสมปลอดภัยแล้วใช้ประจำ"},date:"2026-06-18",
      quote:{ko:"피부타입 : 임신 후 민감성 & 건성\n\n임신하고 나서는 성분에 예민해져서 모든 화장품을 항상 AI에 물어보고 사용하는 편이에요 \n이 제품은 순한 성분이라고 전면에 내세운 만큼 찾아보니 역시나 임산부한테 안전한 성분들이라 안심하고 사용할 수 있었습니다.\n\n향은 무향이라고 나와 있긴 하지만 임신해서 코가 예민해져서 그런지 저는 약간 특유의 화학 향? 같은 게 살짝 느껴지긴 했어요! 그래도 사용할 때 거부감이 있거나 신경 쓰일 정도는 전혀 아니었습니다.\n\n사용할 때 제품이 잘 섞이게 몇 번 흔들어서 한 펌프 반 정도 짜면 거품이 풍성하게 나와서 클렌징하기 편하더라고요. \n사실 가끔 귀찮아서 안 흔들고 그냥 바로 짜서 쓸 때도 있는데 안 흔들어도 거품은 충분히 잘 나옵니다.\n\n기존에 쓰던 폼클렌징들은 세안 후에 살짝 건조함이나 당김이 있었는데 이 제품은 사용 후에도 건조함이 전혀 없어서 만족스러웠어요!\n\n같이 올린 사진은 평소에 일반 선크림(메베x)바르고 다니다가 이 클렌저로 지운 후의 모습이고 성분이 워낙 순하다고 해서 세정력이 강하지 않을거라 생각했는데\n생각 외로 깔끔하고 말끔하게 잘 지워지더라고요!\n 임신하고 피부가 건조하고 민감해졌는데 데일리로 아주 잘 쓰고 있습니다.\n\n임산부들&민감성 피부이신 분들한테 강추합니다!🫶🏻",en:"Skin type: sensitive & dry after pregnancy\n\nSince becoming pregnant I've gotten sensitive about ingredients, so I always check every cosmetic with AI before using it.\nThis product markets itself as having gentle ingredients, and sure enough when I looked it up, they were ingredients safe for pregnant women, so I could use it with peace of mind.\n\nIt's listed as fragrance-free, but since my nose got more sensitive during pregnancy, I did notice a faint sort of chemical smell? Still, it was nowhere near enough to feel off-putting or bothersome while using it.\n\nWhen using it, if you shake it a few times to mix it well and squeeze out about one and a half pumps, it comes out with rich foam that's easy to cleanse with.\nActually sometimes I'm lazy and just squeeze without shaking, and even then the foam comes out plenty well.\n\nThe foam cleansers I used before left a bit of dryness or tightness after washing, but this product had zero dryness afterward, which I was happy about!\n\nThe photo I attached is my face after removing regular sunscreen (not Maybelline) with this cleanser, and since the ingredients are so gentle I figured the cleansing power wouldn't be strong,\nbut surprisingly it removed everything cleanly and thoroughly!\nMy skin got dry and sensitive after pregnancy, and I've been using this as my daily cleanser very successfully.\n\nHighly recommend to pregnant women & anyone with sensitive skin! 🫶🏻","zh-CN":"肤质：孕期敏感性&干性\n\n怀孕之后对成分变得很敏感，用任何化妆品之前都会先问AI \n这款产品主打成分温和，查了之后果然是对孕妇安全的成分，用起来很放心。\n\n虽然标注无香，但可能是怀孕后鼻子变敏感，我确实感觉到一点点特有的化学味道？不过用的时候完全不会让人反感或在意。\n\n使用时先摇匀混合，按压一泵半左右就能出蓬松的泡沫，洁面很方便。\n有时候懒得摇直接按压用，不摇也能出足够的泡沫。\n\n之前用的泡沫洁面洗完脸都会有点干燥紧绷，这款用完完全没有干燥感，很满意！\n\n附的照片是平时涂普通防晒（非物理防晒）之后用这款卸掉的样子，本来以为成分这么温和清洁力应该不强，\n结果意外地干净利落地卸掉了！\n怀孕之后皮肤变干燥敏感，这款当日常用真的很合适。\n\n强烈推荐给孕妇和敏感肌的朋友们！🫶🏻","zh-TW":"膚質：懷孕後敏感&乾性\n\n懷孕之後對成分變得很敏感，所有保養品我都會先問AI再用。\n這款產品標榜溫和成分，查了一下確實是孕婦安全的成分，可以放心使用。\n\n雖然標示無香，但可能因為懷孕鼻子變敏感，我還是感覺得到一點點化學味？不過完全不到讓人反感或在意的程度。\n\n使用時搖幾下讓產品混合均勻，按壓約一次半，泡沫就會很豐盈，洗臉很方便。\n老實說有時候懶得搖就直接按壓使用，不搖也能出足夠的泡沫。\n\n以前用的洗面乳洗完臉多少會有點乾燥或緊繃，但這款用完完全不乾燥，很滿意！\n\n附上的照片是平常擦一般防曬乳（沒有卡粉）之後用這款卸掉的樣子，本來以為成分這麼溫和潔淨力應該不強，\n結果意外地卸得又乾淨又清爽！\n懷孕後皮膚變乾燥敏感，這款當日常用真的很不錯。\n\n強力推薦給孕婦和敏感肌的人!🫶🏻",ja:"肌タイプ：妊娠後の敏感肌&乾燥肌\n\n妊娠してから成分に敏感になり、すべてのコスメをいつもAIに聞いてから使う方です \n この製品はマイルドな成分だと前面に打ち出しているだけあって調べてみたところ、やはり妊婦に安全な成分だったので安心して使うことができました。\n\n香りは無香と表記されていますが、妊娠して鼻が敏感になったからか、私は少し独特の化学的な香り?のようなものがわずかに感じられました！それでも使うとき抵抗があったり気になったりするほどでは全くありませんでした。\n\n使うとき製品がよく混ざるように何回か振ってポンプ1回半くらい出すと泡が豊かに出てきてクレンジングしやすかったです。 \n 実は時々面倒で振らずにそのまま出して使うこともありますが、振らなくても泡は十分よく出ます。\n\n以前使っていた洗顔フォームは洗顔後に少し乾燥やつっぱりがありましたが、この製品は使用後も乾燥が全くなくて満足でした！\n\n一緒に載せた写真は普段一般的な日焼け止め(メベ×)を塗って過ごしていて、このクレンザーで落とした後の様子で、成分がとてもマイルドだというので洗浄力が強くないと思っていましたが、\n思いのほかすっきりきれいに落ちました！\n 妊娠して肌が乾燥して敏感になりましたが、デイリーでとてもよく使っています。\n\n妊婦の方&敏感肌の方に強くおすすめします！🫶🏻",th:"ประเภทผิว : หลังตั้งครรภ์ผิวแพ้ง่าย & ผิวแห้ง\n\nหลังตั้งครรภ์ไวต่อส่วนผสมมากขึ้น เลยถามเอไอเช็คทุกครั้งก่อนใช้เครื่องสำอางทุกตัวเลยค่ะ \nผลิตภัณฑ์นี้ชูจุดเด่นเรื่องส่วนผสมอ่อนโยน พอลองหาข้อมูลดูก็เป็นส่วนผสมที่ปลอดภัยสำหรับคนท้องจริงๆ เลยใช้ได้อย่างอุ่นใจ\n\nแม้จะระบุว่าไม่มีกลิ่น แต่อาจเพราะตั้งครรภ์แล้วจมูกไวขึ้น เลยรู้สึกถึงกลิ่นคล้ายสารเคมีนิดหน่อย! แต่ก็ไม่ถึงกับรู้สึกต่อต้านหรือกวนใจตอนใช้เลย\n\nตอนใช้เขย่าให้ผสมกันดีก่อนแล้วปั๊มประมาณครั้งครึ่ง ฟองฟูออกมาดี ล้างหน้าได้สะดวก \nจริงๆ บางครั้งขี้เกียจไม่เขย่าแล้วปั๊มใช้เลยก็มี แต่ไม่เขย่าก็ยังได้ฟองเพียงพอดี\n\nโฟมล้างหน้าที่เคยใช้ก่อนหน้านี้หลังล้างหน้าจะแห้งหรือตึงนิดหน่อย แต่ผลิตภัณฑ์นี้ใช้แล้วไม่แห้งเลย พอใจมาก!\n\nรูปที่แนบมาคือหน้าหลังล้างครีมกันแดดทั่วไป (ไม่กันน้ำ) ด้วยคลีนเซอร์ตัวนี้ คิดว่าเพราะส่วนผสมอ่อนโยนมาก แรงทำความสะอาดคงไม่แรง\nแต่กลับล้างออกได้สะอาดหมดจดเกินคาด!\n ตั้งครรภ์แล้วผิวแห้งและแพ้ง่ายขึ้น แต่ใช้เป็นประจำได้ดีมากค่ะ\n\nแนะนำสุดๆ สำหรับคนท้องและผิวแพ้ง่าย!🫶🏻"},images:[],video:null},
    {id:"ZOze8WDJ",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"복합성/민감, 시술 후 예민해진 피부에도 적합",en:"Combination/sensitive, also suitable for skin made sensitive after procedures","zh-CN":"混合肌/敏感，适合治疗后变敏感的皮肤","zh-TW":"混合性/敏感，術後敏感的肌膚也適合",ja:"混合肌/敏感肌、施術後に敏感になった肌にも適合",th:"ผิวผสม/แพ้ง่าย เหมาะแม้กับผิวที่ไวต่อสิ่งเร้าหลังทำหัตถการ"},date:"2026-06-18",
      quote:{ko:"평소 자극이 없고 당김이 없는 \n순한 클렌징 제품을 선호하고 있어요. \n아침, 저녁으로 클렌징 제품을 사용하다보니, \n기초 화장의 시작은 클렌징이라고 생각하고 신경쓰며 사용중이에요. 클렌징 제품의 성분도 꼼꼼하게 보고 사용하고 있답니다.\n\n< 패키지 >\n박스케이스에 본품이 들어있고, 플라스틱 재질의 거품 용기에요. \n옐로우 컬러지만, 내용물이 살짝살짝 비춰서 \n사용하기 편리할듯해요.\n\n< 향 >\n향은 거의 느끼지 못하여 무향으로 느꼈어요.\n\n< 색상 , 제형 >\n사용 전 용기를 흔들고 펌핑하면 \n화이트 컬러의 풍성한 거품이 나와요.\n힘없이 꺼지는 거품이 아니라 거품 유지력도 좋아요.\n\n< 사용감 >\n거품을 피부에 올려서 롤링을 하면,\n피부 가득 쫀쫀 조밀한 거품형태로 바뀌어서 피부에 착붙되어요.\n모공에 노폐물들을 잘 제거해줄듯한 느낌이에요.\n약산성 제품이지만 세안후 미끌거림이 없고 산뜻해요.\n호호바 오일 성분 때문인지 세안 후에도 당김이 없어서 \n피부가 편안하네요.\n\n< 효과 >\n모공을 막지 않는 호호바 오일 성분으로 \n노폐물은 깨끗하게 없애주고 피부가 건조하지 않도록 \n세안 후 피부를 보호해주는 느낌이에요. \n판테놀, 세라마이드 성분으로 피부 장벽을 지켜줘서\n클렌징 후에도 자극이 없어요. \n피부 타입 가리지 않고 모든 피부에 너무 잘 맞을거 같아요. \n특히 피부과 시술 등으로 예민해진 피부에도 잘 맞을듯해요. \n다만 워터프루프 제품을 클렌징 할때는 물리적 힘이 필요했어서, \n1차 클렌징 후 2차 마무리 클렌징 용도로 사용하는 것이 좋을것 같아요.\n저같은 경우 자극없는 아침 세안용으로 잘 사용하고 있어요.",en:"I generally prefer gentle cleansing products with no irritation and no tightness.\nSince I use a cleansing product morning and night, I think of cleansing as the start of my skincare routine and pay close attention to it. I also check the ingredients of cleansing products carefully before using them.\n\n< Packaging >\nThe product comes in a box case, and it's a plastic foam-pump bottle.\nIt's yellow but the contents show through slightly,\nwhich seems convenient for use.\n\n< Scent >\nI barely noticed any scent, so I'd say it's fragrance-free.\n\n< Color, texture >\nWhen you shake the bottle before use and pump it,\nrich white foam comes out.\nIt's not foam that collapses weakly - it holds up well too.\n\n< Texture on skin >\nWhen you put the foam on your skin and roll it around,\nit turns into a bouncy, dense foam texture that clings all over your face.\nIt feels like it would remove impurities from pores really well.\nIt's mildly acidic but there's no slipperiness after washing, it feels fresh and clean.\nMaybe because of the jojoba oil ingredient, there's no tightness after washing,\nso my skin feels comfortable.\n\n< Effect >\nWith jojoba oil that doesn't clog pores,\nit removes impurities cleanly while protecting skin from drying out\nafter washing, it feels like it protects your skin.\nWith panthenol and ceramide ingredients protecting the skin barrier,\nthere's no irritation even after cleansing.\nI think it would suit pretty much any skin type.\nEspecially good for skin made sensitive from dermatology procedures.\nHowever, when cleansing waterproof makeup, some physical effort was needed,\nso I think it's better used as a second-step finishing cleanse after a first cleanse.\nIn my case, I've been using it well as a gentle morning wash.","zh-CN":"我平时偏好无刺激、不紧绷的温和清洁产品。\n早晚都要用洁面产品，觉得基础护肤的第一步就是清洁，一直很用心对待。也会仔细看清洁产品的成分。\n\n< 包装 >\n盒装里装着本体，是塑料材质的泡沫瓶。\n是黄色的，但内容物隐约能看到，感觉使用起来会很方便。\n\n< 香味 >\n几乎感觉不到香味，是无香的。\n\n< 颜色、质地 >\n使用前摇匀再按压，\n会出白色蓬松的泡沫。\n泡沫不会一下子就消，维持力也不错。\n\n< 使用感 >\n把泡沫放在脸上打圈，\n会变成紧实细密的泡沫贴合在皮肤上。\n感觉能很好地清除毛孔里的废物。\n虽是弱酸性产品，但洗后不滑腻，很清爽。\n可能是荷荷巴油成分的关系，洗后也不紧绷，\n皮肤很舒适。\n\n< 效果 >\n不堵塞毛孔的荷荷巴油成分，\n能干净去除废物，同时保护皮肤不干燥，\n洗后有种被保护的感觉。\n泛醇、神经酰胺成分守护皮肤屏障，\n洗完之后也没有刺激。\n感觉不挑肤质，什么皮肤都很适合。\n特别是做完皮肤科治疗变敏感的皮肤应该也很合适。\n不过卸防水产品的时候需要一点物理力度，\n建议当一次清洁后的二次收尾清洁使用比较好。\n我个人是当无刺激的早晨洁面产品用。","zh-TW":"我平常偏好無刺激、不緊繃的溫和潔顏產品。\n早晚都要用潔顏產品，\n所以我認為基礎保養的第一步就是清潔，一直很用心挑選。連潔顏產品的成分也會仔細查看再使用。\n\n< 包裝 >\n外盒裡裝著本體，是塑膠材質的氣泡瓶。\n雖然是黃色，但內容物稍微透出來，\n使用起來應該很方便。\n\n< 香味 >\n幾乎感覺不到香味，覺得算無香。\n\n< 色澤、質地 >\n使用前搖一搖再按壓，\n會出現白色豐盈的泡沫。\n不是沒力氣就消掉的泡沫，維持力也不錯。\n\n< 使用感 >\n把泡沫放在皮膚上打圈，\n會變成緊實細緻的泡沫形態，緊貼在皮膚上。\n感覺能把毛孔裡的老廢物清得很乾淨。\n雖然是弱酸性產品，但洗完臉不滑膩、很清爽。\n可能因為荷荷芭油成分，洗完臉也不緊繃，\n皮膚很舒服。\n\n< 效果 >\n不阻塞毛孔的荷荷芭油成分，\n把老廢物清得乾乾淨淨，同時不讓皮膚乾燥，\n洗完臉後有種被保護的感覺。\n含有泛醇、神經醯胺成分守護皮膚屏障，\n清潔後也不刺激。\n感覺不挑膚質，任何肌膚都很適合。\n特別是皮膚科療程後變敏感的肌膚應該也很適合。\n不過清潔防水產品時需要一點物理力道，\n建議先做一次清潔，這款當二次收尾清潔使用會更好。\n我自己是拿來當無刺激的早晨洗臉用。",ja:"普段刺激がなくつっぱらない \n マイルドなクレンジング製品を好んでいます。 \n 朝晩、クレンジング製品を使っているので、 \n スキンケアの始まりはクレンジングだと思って気を使いながら使っています。クレンジング製品の成分も細かくチェックして使っています。\n\n<パッケージ>\n箱型ケースに本体が入っていて、プラスチック製の泡容器です。 \n イエローカラーですが、中身が少し透けて見えるので \n 使いやすそうです。\n\n<香り>\n香りはほとんど感じられず無香だと思いました。\n\n<色、テクスチャー>\n使用前に容器を振ってポンプすると \n 白色の豊かな泡が出てきます。\n力なくへたる泡ではなく泡の持続力も良いです。\n\n<使用感>\n泡を肌にのせてローリングすると、\n肌全体にとろみのある密な泡の形に変わって肌に密着します。\n毛穴の老廃物をよく除去してくれそうな感じです。\n弱酸性の製品ですが洗顔後ぬるつきがなくさっぱりします。\nホホバオイル成分のせいか洗顔後もつっぱりがなくて \n 肌が快適です。\n\n<効果>\n毛穴を詰まらせないホホバオイル成分で \n 老廃物はきれいに落としながら肌が乾燥しないよう \n 洗顔後に肌を守ってくれる感じです。 \n パンテノール、セラミド成分で肌バリアを守ってくれて\nクレンジング後も刺激がありません。 \n 肌タイプを問わずすべての肌にとても合いそうです。 \n 特に皮膚科の施術などで敏感になった肌にも合いそうです。 \n ただウォータープルーフ製品をクレンジングするときは物理的な力が必要だったので、 \n 1回目のクレンジング後、2回目の仕上げクレンジング用として使うのが良さそうです。\n私の場合、刺激のない朝の洗顔用としてよく使っています。",th:"ปกติชอบผลิตภัณฑ์คลีนซิ่งที่ไม่ระคายเคือง \nและไม่ทำให้ตึงค่ะ \nใช้ผลิตภัณฑ์คลีนซิ่งทั้งเช้าและเย็น \nคิดว่าจุดเริ่มต้นของสกินแคร์คือการล้างหน้า เลยใส่ใจเลือกใช้ เช็คส่วนผสมของผลิตภัณฑ์คลีนซิ่งอย่างละเอียดด้วยค่ะ\n\n< บรรจุภัณฑ์ >\nมีกล่องใส่ตัวสินค้า เป็นขวดปั๊มโฟมพลาสติก \nสีเหลือง แต่มองเห็นเนื้อผลิตภัณฑ์ข้างในนิดหน่อย \nน่าจะใช้งานสะดวก\n\n< กลิ่น >\nแทบไม่รู้สึกถึงกลิ่นเลย รู้สึกว่าไม่มีกลิ่น\n\n< สี, เนื้อสัมผัส >\nก่อนใช้เขย่าแล้วกดปั๊ม \nจะได้ฟองสีขาวฟูออกมา\nไม่ใช่ฟองที่ยุบง่าย คงรูปฟองได้ดี\n\n< ความรู้สึกเมื่อใช้ >\nพอวางฟองบนผิวแล้วนวดคลึง\nจะเปลี่ยนเป็นฟองหนึบละเอียดที่แนบสนิทกับผิว\nรู้สึกว่าน่าจะกำจัดสิ่งสกปรกในรูขุมขนได้ดี\nแม้เป็นกรดอ่อนแต่หลังล้างหน้าไม่ลื่นเหนอะหนะ สดชื่นดี\nอาจเพราะมีน้ำมันโฮโฮบา หลังล้างหน้าไม่ตึงเลย \nผิวสบายดี\n\n< ประสิทธิภาพ >\nน้ำมันโฮโฮบาที่ไม่อุดตันรูขุมขน \nกำจัดสิ่งสกปรกได้สะอาดหมดจด และปกป้องผิว \nไม่ให้แห้งหลังล้างหน้า \nแพนธีนอล เซราไมด์ช่วยปกป้องเกราะผิว\nเลยไม่ระคายเคืองแม้หลังทำความสะอาด \nน่าจะเหมาะกับทุกสภาพผิวไม่ว่าจะแบบไหน \nโดยเฉพาะผิวที่ไวต่อสิ่งเร้าจากการทำหัตถการที่คลินิกผิวหนัง \nแต่ถ้าล้างเมคอัพวอเตอร์พรูฟต้องใช้แรงถูเพิ่ม \nเลยเหมาะกับใช้เป็นการล้างหน้าครั้งที่สองมากกว่า\nส่วนตัวใช้เป็นการล้างหน้าตอนเช้าที่ไม่ระคายเคืองค่ะ"},images:[],video:null},
    {id:"Zm2n45nq",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"아토피 피부, 순하면서 피지·각질 케어까지",en:"Atopic skin, gentle yet still manages sebum and flakes","zh-CN":"特应性皮炎肌肤，温和的同时兼顾皮脂·角质护理","zh-TW":"異位性皮膚炎肌膚，溫和之餘還能顧到皮脂‧角質護理",ja:"アトピー肌、マイルドでありながら皮脂・角質ケアまで",th:"ผิวเป็นภูมิแพ้ผิวหนัง อ่อนโยนแต่ยังดูแลไขมันและขุยผิวได้"},date:"2026-06-18",
      quote:{ko:"저는 아토피가 있는 피부라서 무조건 순한 제품을 써야하는데, 너무 순하기만한 제품을 사용하기엔 또 피지도 많고, 각질도 많아서 어느정도 각질제거를 해줄수 있거나 피지를 녹이거나 잠재워줄 수 있는 제품을 원하는 편이에요. \n근데 그런 기능이 있는 클렌징을 사용하다보면 점점 피부에 자극이 되는게 느껴지긴 하거든요ㅠㅠ \n그러던 차에 호호바 클렌저를 사용하고 나서는 요제품만 사용중입니다 \n호호바오일이 피부를 편하게 해주고 좋다는 건 알고있었는데,  버블제형으로 사용하니까 더 좋은것 같아요. \n\n제일 좋았던건 전혀피부에 부담이 없어서 아침세안으로도 너무너무 좋았어요!!\n그리고 피지를 완벽하게 녹여주지는 않지만 잠재워지는 느낌이 들어요. \n이중으로 층이 나뉘어 있어서 흔들어서 사용해야하는데, 흔들고나면 액체형 크림같이 변해요. 그걸 또 버블제형으로 세안하다보면 어? 세안이 되고잇는건가? 싶을정도로 피부가 편해요 \n그리고 세안후에는 뽀득거리거나 미끄덩거리지 않아요. \n속건조함 안느껴지고 마치 내가 건강한 중성피부라고 착각하게 만듦ㅋㅋㅋㅋㅋ\n 단독으로 메이크업을 세정하기는 좀 어렵지만, 2차세안이나 아침세안용으로 너무너무 추천합니당",en:"I have atopic skin so I absolutely have to use gentle products, but if a product is only gentle it's not enough for me since I also have a lot of sebum and flakes, so I want something that can manage exfoliation or control sebum to some degree.\nBut whenever I use a cleanser with those functions, I gradually feel it starting to irritate my skin ㅠㅠ\nThen I tried the jojoba cleanser, and now it's the only product I use.\nI already knew jojoba oil was good for calming skin, but using it in bubble form seems even better.\n\nWhat I liked best was that it put zero strain on my skin, so it was great even for morning washing!!\nAnd while it doesn't completely dissolve sebum, it feels like it puts it to sleep.\nThe two layers separate so you have to shake it before use, and once shaken it turns into something like a liquid cream. Then when you wash with it in bubble form, it's so gentle you almost wonder, wait, is this actually cleansing anything?\nAnd after washing there's no squeaky or slippery feeling.\nNo underlying dryness at all, it makes me feel like I have healthy normal skin lol\nIt's a bit hard to remove makeup with this alone, but I highly, highly recommend it as a second cleanse or morning wash.","zh-CN":"我有特应性皮炎，必须只用温和的产品，但如果太温和又会因为皮脂多、角质多而不够用，我更想要能在一定程度上去角质、溶解或抑制皮脂的产品。\n但用有这种功能的洁面产品，又渐渐感觉皮肤开始被刺激ㅠㅠ\n用了荷荷巴洁面之后就一直只用这一款了\n本来就知道荷荷巴油让皮肤舒适、对皮肤好，做成气泡质地感觉更好了。\n\n最喜欢的是完全没有皮肤负担，当早晨洁面用也非常非常好!!\n而且虽然不能完全溶解皮脂，但感觉能把它压制住。\n是双层分离的，需要摇匀之后再用，摇匀后会变成液态霜一样的质地。用气泡形式洁面时，会觉得咦？这样真的在清洁吗？皮肤却很舒服\n洗完之后也不会吱吱响或滑腻。\n完全感觉不到内干，甚至会让人误以为自己是健康的中性皮肤哈哈哈哈哈\n单独用来卸妆有点难，但当二次清洁或早晨洁面用真的非常推荐","zh-TW":"我是有異位性皮膚炎的肌膚，一定要用溫和的產品，但如果只用太溫和的產品，我皮脂又多、角質也多，所以偏好能一定程度去角質、或溶解安撫皮脂的產品。\n但用了那類有這種功能的清潔產品，漸漸就會感覺對皮膚有刺激ㅠㅠ\n後來用了荷荷芭潔顏乳之後，就只用這款了。\n本來就知道荷荷芭油讓皮膚舒服又好，用氣泡質地感覺效果更好。\n\n最喜歡的是完全不會給皮膚造成負擔，當早晨洗臉用真的太好了！！\n而且雖然不能完全溶解皮脂，但有種被安撫的感覺。\n因為是雙層分層的，需要搖勻使用，搖過之後會變成像液狀乳霜。用氣泡質地洗臉時，會有種「咦？這樣真的有在洗嗎？」的感覺，皮膚卻很舒服。\n而且洗完臉後不會咕溜咕溜也不會滑膩。\n完全感覺不到內在乾燥，讓我一度誤以為自己是健康的中性肌ㅋㅋㅋㅋㅋ\n單獨用來卸妝有點勉強，但當二次清潔或早晨洗臉用真的非常推薦",ja:"私はアトピーのある肌なので絶対にマイルドな製品を使わないといけませんが、あまりにマイルドすぎる製品を使うには皮脂も角質も多いので、ある程度角質ケアをしてくれたり皮脂を溶かしたり抑えてくれたりする製品を求める方です。 \n でもそういう機能のあるクレンジングを使っていると、だんだん肌に刺激になっているのを感じるんです、涙 \n そんな中ホホバクレンザーを使ってからはこの製品だけ使っています \n ホホバオイルが肌を楽にしてくれて良いというのは知っていましたが、バブル剤形で使うともっと良い気がします。 \n\n 一番良かったのは全く肌に負担がなくて朝の洗顔にもすごく良かったこと！！\n それから皮脂を完全に溶かしてはくれませんが、抑えられている感じがします。 \n 2層に分かれているので振って使う必要がありますが、振ると液状のクリームのように変わります。それをまたバブル剤形で洗顔していると、あれ?ちゃんと洗顔できているのかな?と思うくらい肌が快適です \n そして洗顔後はキュッキュッとしたりぬるついたりしません。 \n インナードライを感じず、まるで自分が健康な普通肌だと錯覚するくらいです笑笑笑笑笑\n 単独でメイクを落とすのは少し難しいですが、2回目の洗顔や朝の洗顔用としてすごくおすすめします",th:"ฉันเป็นผิวที่เป็นภูมิแพ้ผิวหนัง เลยต้องใช้ผลิตภัณฑ์อ่อนโยนเท่านั้น แต่ถ้าอ่อนโยนเกินไปก็ไม่ตอบโจทย์เพราะมีไขมันและขุยผิวเยอะ เลยชอบผลิตภัณฑ์ที่ช่วยขจัดขุยหรือละลาย/สงบไขมันได้ในระดับหนึ่ง \nแต่พอใช้ผลิตภัณฑ์ที่มีฟังก์ชันแบบนั้น มักจะรู้สึกระคายเคืองผิวมากขึ้นเรื่อยๆㅠㅠ \nพอได้ลองใช้คลีนเซอร์โฮโฮบานี้แล้วก็ใช้แต่ตัวนี้เลยค่ะ \nรู้อยู่แล้วว่าน้ำมันโฮโฮบาดีต่อผิวและทำให้สบายผิว แต่พอเป็นรูปแบบบับเบิลยิ่งดีขึ้นไปอีก \n\nสิ่งที่ชอบที่สุดคือไม่มีภาระต่อผิวเลย เหมาะกับใช้ล้างหน้าตอนเช้ามากๆ!!\nแล้วแม้จะไม่ได้ละลายไขมันหมดจด แต่รู้สึกว่าช่วยสงบไขมันได้ \nต้องเขย่าก่อนใช้เพราะมีสองชั้นแยกกัน พอเขย่าแล้วจะเปลี่ยนเป็นเหมือนครีมเหลว พอใช้ล้างหน้าแบบบับเบิลแล้วรู้สึกสงสัยว่า เอ๊ะ นี่กำลังล้างหน้าอยู่จริงหรือเปล่า? ผิวสบายขนาดนั้น \nแล้วหลังล้างหน้าก็ไม่สะอาดเอี๊ยดหรือลื่นเหนอะหนะเลย \nไม่รู้สึกขาดน้ำ ทำให้เข้าใจผิดว่าตัวเองเป็นผิวธรรมดาที่แข็งแรงฮ่าๆๆๆๆๆ\n ล้างเมคอัพเดี่ยวๆ อาจจะยากนิดหน่อย แต่แนะนำสุดๆ สำหรับล้างหน้าครั้งที่สองหรือตอนเช้าค่ะ"},images:[],video:null},
    {id:"A2N61vxA",rating:5,skinType:{ko:"지성",en:"Oily","zh-CN":"油皮","zh-TW":"油性肌膚",ja:"脂性肌",th:"ผิวมัน"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"30대 수부지, 나이들며 예민해진 장벽 고민 해결",en:"Woman in her 30s, combination (oily-dehydrated), solved concerns about a barrier that got more sensitive with age","zh-CN":"30多岁水油皮，解决了随年龄增长变敏感的屏障困扰","zh-TW":"30多歲外油內乾，解決隨年紀增長變敏感的屏障困擾",ja:"30代インナードライ肌、年齢を重ねて敏感になったバリアの悩みを解決",th:"วัย 30 กว่า ผิวมันขาดน้ำ แก้ปัญหาเกราะผิวที่แพ้ง่ายขึ้นตามอายุ"},date:"2026-06-18",
      quote:{ko:"30대 여성/수부지 \n\n️ ☀️제형\n펌핑하면 처음부터 풍성한 미세 버블이 나오는 타입이에요. 따로 거품을 낼 필요가 없어서 바쁜 아침에도 간편하게 사용할 수 있었어요! 거품은 무스처럼 부드럽고 촘촘한 편이라 피부에 닿았을 때 자극이나 마찰감이 거의 느껴지지 않았어요. 호호바 성분이 함유되어 있어서인지 단순히 가벼운 거품이 아니라 촉촉함도 함께 느껴지는 제형이었어요.\n\n☀️ 사용감\n30대가 넘어갈수록 장벽,건조함에 엄청 예민해지더라구요! \n세안하는 동안 피부가 편안하다는 느낌이 가장 먼저 들었어요. 세안 후에도 얼굴이 땅기거나 건조하게 조여오는 느낌이 적었고, 피부 수분은 어느 정도 남겨두면서 유분감만 깔끔하게 정리해주는 느낌이었어요. 특히 수부지 피부 특유의 속건조가 심한 날에도 부담 없이 사용할 수 있었어요.\n\n☀️ 세정력\n가벼운 선크림이나 일상적인 노폐물 제거에는 충분히 만족스러웠어요. 다만 진한 메이크업까지 한 번에 지우기에는 세정력이 강한 편은 아니라서, 저녁에는 클렌징밀크나 워터로 1차 클렌징 후 사용하는 것이 더 좋겠다고 느꼈어요. 피부를 과하게 벗겨내는 느낌 없이 순하게 세정되는 제품이에요.\n\n☀️ 수부지 피부 기준 장단점\n장점은 세안 후에도 촉촉함이 남아 있다는 점이에요. 유분은 적당히 정돈해주면서 피부가 건조해지지 않아 수부지 피부와 잘 맞는다고 느꼈어요. 반면 개운하고 뽀드득한 마무리를 선호하는 분들에게는 다소 순하게 느껴질 수 있을 것 같아요.\n\n☀️ 총평\n수부지 30대 피부 기준으로 사용했을 때, 자극 없이 편안하게 사용할 수 있는 데일리 클렌저였어요. 세안 후 당김이 적고 피부 컨디션이 예민한 날에도 부담 없이 사용할 수 있어서 만족스러웠어요. 강한 세정력보다는 피부 밸런스를 편안하게 유지하는 데 초점이 맞춰진 제품이라는 생각이 들었고, 아침 세안용이나 피부가 민감해진 시기에 특히 손이 자주 갈 것 같아요☺️",en:"Woman in her 30s / combination (oily-dehydrated)\n\n☀️ Texture\nIt's the type that comes out as rich micro-bubbles from the very first pump. No need to work up a separate lather, so it was easy to use even on busy mornings! The foam is soft and dense like a mousse, so I barely felt any irritation or friction when it touched my skin. Maybe because of the jojoba ingredient, it wasn't just light foam - it felt moisturizing too.\n\n☀️ Texture on skin\nOnce you're past your 30s, your barrier and dryness get so much more sensitive!\nThe first thing I noticed while washing was how comfortable my skin felt. After washing there was little tightness or dry pulling, and it felt like it left some moisture behind while just cleanly clearing away excess oil. Especially on days when the underlying dryness typical of combination (oily-dehydrated) skin was bad, I could use it without any worry.\n\n☀️ Cleansing power\nIt was plenty satisfying for light sunscreen or everyday grime. But it's not strong enough to remove heavy makeup in one
