      quote:{ko:"평소에는 듀이트리 클렌징밀크를 쓰고 있었어요!\n이번에 판테놀성분이 들었다는 노마디아 제품 당첨되어 써보게 되었습니다.\n♡용량: 듀이트리 200ml와 동일하고 3-4개월 쓰기 적정한 양이었습니다! 지금은 듀이트리 400을 쓰고있어 옆에두었을때 좀 작아보이는데, 400미리가 용기가 너무 큰 느낌이라 200이 딱이라고 봐요.\n♡농도가 듀이트리보다 더 진하고 녹진한 느낌이었어요. 듀이트리는 좀더 물같은 느낌이거든요. 좀더 적은양으로 효과적으로 지울수 있어요.\n♡무향 무자극! 지루성피부염으로 고생하고 있는데 트러블도 없고 테스트기간에 오른쪽 코 옆의 작은 염증들이 사라졌어요. 다른 화장품은 바꾼게 없어서 클렌징밀크 덕분인가 하고 있어요. 좀더 꾸준히 써보고 피부에 잘맞으면 계속 사용해보려고 합니다. 이 부분이 가장 만족스럽습니다.\n♡지성인데 화장이랑 유분으로 인한 각질이 잘 제거됩니다. bb크림이나 닥터지 주황색 썬크림 잘 제거되고, 다음날에 일어나지 않았습니다. 밀크 후 유화하고, 일리윤세안제 제일 순한걸로 써도 충분히 잘 지워져요.\n\n지루성피부염으로 고생하고 있고 피부관리실등에 가면 오일은 쓰지말고 클렌징밀크와 저자극 클렌저 쓰라고 하기 때문에, 딱 맞는 제품인것 같고 받자마자 매일매일썼는데 트러블이 없었고 다른분께도 추천드립니다.^^","zh-CN":"平时一直用Dewytree洁面乳！\n这次抽中了含泛醇成分的NOMADIA产品试用了一下。\n♡容量：和Dewytree的200ml一样，够用3-4个月！我现在用的是Dewytree的400ml，放在一起看这款显得有点小，但400ml的瓶子其实太大了，200ml刚刚好。\n♡浓度比Dewytree更浓稠厚重。Dewytree更像水一点。用更少的量就能有效卸干净。\n♡无香无刺激！我一直被脂溢性皮炎困扰，用了之后没长痘，测试期间右边鼻翼旁的小炎症也消失了。其他化妆品都没换，所以我觉得可能是这款洁面乳的功劳。打算再持续用一段时间，如果适合皮肤就会一直用下去。这点最让我满意。\n♡虽然是油皮，但因为化妆和油脂产生的角质能被很好地清除。BB霜或Dr.G橙色防晒都能卸干净，第二天也没有闷痘。用完洁面乳乳化之后，再用Illiyoon最温和款做二次清洁也完全够用。\n\n我一直被脂溢性皮炎困扰，去皮肤管理室他们也说不要用油类，要用洁面乳和低刺激洁面产品，感觉这款正好合适，拿到就每天用，完全没长痘，也推荐给其他人。^^"},images:["thumbnail/reviews/milk/ZOzndwWJ_1.jpg","thumbnail/reviews/milk/ZOzndwWJ_2.jpg"],video:null},
    {id:"qQwWBzpJ",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"오일 단독세안 후 '토마토 얼굴' 되던 극민감성 - 밀크로 전환한 서사 (영상+이미지 3장)","zh-CN":"只用油单独清洁就会变'番茄脸'的极敏感肌 - 改用洁面乳的心路历程（视频+3张图片）"},date:"2026-07-09",
      quote:{ko:"전 기존에 클렌징 오일과 폼으로 이중세안을 하다 피부장벽이 다 무너짐을 느끼고 오일로만 세안하고있는 완전 민감성 피부입니다ㅜㅠ \n근데 오일로만 하니 마지막에 좀 덜 닦인다는 느낌이 들더라구요.. 으쯔라는거냐 내 민감성 피부야.. \n\n그리고 오일로 롤링도 길게하니 세수끝난 직후에는 항상 토마토 얼굴..🍅🍅\n\n항상 인스타에서 클렌징밀크 추천만 듣다가 이번에 화해에서 추천템으로 봐서 도전해봤어요. 잠금장치도 있어서 여행갈때도 불안해하지않고 챙겨가기 좋아영\n\n약산성에 판테놀까지.. 완전 민감성인 나를 위한 제품이잖아요ㅜㅠ 그리고 저는 클렌징 제품에 이상한 냄새 나는것도 싫어하는데 마침 무향..? 이정도면 내가 만든거 아니냐구..ㅎㅎ\n\n2주넘게 사용해봤는데 제형이 쫀쫀한 클렌징밀크라 롤링할때도 부드럽고 헹궈냈을때도 자극이 없는것같아요. 증거는 세수직후 토마토로 변신하지않은 내 얼굴😭\n\n민감성 피부들한테 완전 추천드려요. 저는 버블클렌저까지 세트로 사서 사용중인데 완전.. 정착템 등극!!💕 망하지말구 평생 저한테 팔아주세요 젭알","zh-CN":"我之前一直用卸妆油和泡沫做双重清洁，感觉皮肤屏障整个都崩溃了，所以现在只用卸妆油清洁，是完完全全的敏感肌ㅜㅠ \n但只用油清洁总感觉最后卸得不够干净……到底要我怎么办啊，我的敏感肌…… \n\n而且用油打圈时间一长，洗完脸之后总是番茄脸……🍅🍅\n\n一直在Ins上看到大家推荐洁面乳，这次在化海App上看到这款是推荐款，就挑战了一下。还有锁扣设计，旅行带出去也不用担心漏出来，很好用~\n\n弱酸性又有泛醇……简直是为我这种完全敏感肌量身定做的产品ㅜㅠ 而且我很讨厌清洁产品有奇怪的味道，这款正好无香……这么合适简直像我自己做的一样哈哈\n\n用了两周多，质地是紧实的洁面乳，打圈时也很柔软，冲洗后也感觉没有刺激。证据就是洗完脸没有变成番茄脸😭\n\n非常推荐给敏感肌们。我还配套买了气泡洁面一起用，完全……成了长期回购款!!💕 千万别倒闭，请一直卖给我求你了"},images:["thumbnail/reviews/milk/qQwWBzpJ_1.jpg","thumbnail/reviews/milk/qQwWBzpJ_2.jpg","thumbnail/reviews/milk/qQwWBzpJ_3.jpg"],video:"thumbnail/reviews/milk/qQwWBzpJ.mov"},
    {id:"Aa2527DJ",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"건성+트러블, 세정력만 보다 실패한 경험 → 진정 성분 중요성 깨달음 (이미지 1장)","zh-CN":"干皮+痘痘肌，只看清洁力踩坑的经验 → 领悟舒缓成分的重要性（附1张图片）"},date:"2026-07-04",
      quote:{ko:"건성 피부라 세안 후 얼굴 당김이 고민이신 분들께 추천드리고 싶은 제품이에요‼️\n\n저는 건성 피부에 가끔 트러블도 올라오는 예민한 피부 타입이라 저자극의 순한 클렌징 제품을 이것저것 많이 찾아보는 편인데요. 처음에는 클렌징 제품을 고를 때 ‘세정력’을 가장 중요하게 생각했지만, 사용하다 보니 세정력이 전부는 아니더라구요.😭 건조하고 민감한 피부일수록 세정력뿐만 아니라 “자극이 적고 피부 진정에 도움”이 되는 성분이 함유되어 있는지도 정말 중요하다는 걸 느꼈습니다…🥹\n\n기존에 사용하던 타사의 클렌징 제품은 세정력은 만족스러웠지만, 세안 후 피부 속 당김이 너무 심하다는 아쉬움이 있었어요.😭 그래서 '세안 후에도 얼굴이 당기지 않고 촉촉함이 남는 클렌징 제품은 없을까?' 하고 찾아보다가 제 피부 고민에 잘 맞을 것 같았던 <노마디아 블루 진정 판테놀 1% 클렌징 밀크>를 사용해보게 되었습니다.\n\n매일 아침, 저녁으로 클렌징 밀크를 사용해 부드럽게 세안했고, 메이크업을 한 날에는 '골든 호호바 10% 듀얼 마이크로 버블 클렌저'로 2차 세안까지 해주었어요.\n\n가장 만족스러웠던 점은 세안 후에도 피부에 촉촉함이 남아 있었다는 점인데요‼️ 평소에는 세안만 하고 나오면 바로 기초 제품부터 찾을 정도로 얼굴이 당겼는데, 노마디아 클렌징 밀크는 그런 당김이 거의 느껴지지 않아 정말 만족스러웠습니다.☺️\n\n또 제품에 판테놀 성분이 함유되어 있어 피부가 한결 편안하고 촉촉해지는 느낌을 받았고, 민감한 피부인 저도 자극 없이 사용할 수 있었어요. 사용하는 동안 피부가 예민해지거나 붉어지는 느낌도 없어서 더욱 안심하고 사용할 수 있었고, 따로 인공적인 향이 첨가되지 않아 향에 민감하신 분들도 부담 없이 사용하기 좋을 것 같습니다.👏\n\n만족스럽게 사용한 노마디아 클렌징 밀크의 장점을 정리해보면,\n✔️ 세안 후에도 피부가 촉촉해 피부 속 당김이 적어요.\n✔️ 판테놀이 함유된 저자극 성분으로 민감한 피부도 부담 없이 사용할 수 있어요.\n✔️ 촉촉한 밀크 제형이라 부드럽고 말끔하게 세안할 수 있어요.","zh-CN":"想推荐给因为干皮洗后紧绷而烦恼的朋友们‼️\n\n我是干皮，偶尔还会长痘，属于敏感类型，所以经常到处找低刺激的温和清洁产品。一开始选清洁产品时最看重的是'清洁力'，但用着用着才发现清洁力不是全部。😭 越是干燥敏感的皮肤，除了清洁力，产品是否含有'刺激少、有助舒缓皮肤'的成分也真的很重要……🥹\n\n之前用的其他品牌清洁产品清洁力令人满意，但洗后皮肤内干紧绷得很严重，让人遗憾。😭 所以就在找'有没有洗后不紧绷、还留有水润感的清洁产品？'的时候，发现<NOMADIA蓝色舒缓泛醇1%洁面乳>好像很适合我的皮肤困扰，就试用了。\n\n每天早晚都用洁面乳温和洁面，化妆的日子则用'金色荷荷巴10%双重微气泡洁面'做二次清洁。\n\n最满意的一点是洗后皮肤依然留有水润感‼️ 平时洗完脸马上就要找基础护肤品，脸太紧绷了，但NOMADIA洁面乳用完几乎感觉不到这种紧绷感，真的很满意。☺️\n\n而且产品含有泛醇成分，让人感觉皮肤更舒适水润，我这种敏感肌也能无刺激使用。使用期间皮肤也没有变敏感或泛红，用起来更放心，而且没有额外添加人工香料，对香味敏感的人应该也能放心使用。👏\n\n总结一下用NOMADIA洁面乳满意的优点，\n✔️ 洗后皮肤依然水润，内干紧绷感少。\n✔️ 含泛醇的低刺激成分，敏感肌也能无负担使用。\n✔️ 水润的洁面乳质地，能柔软干净地洁面。"},images:["thumbnail/reviews/milk/Aa2527DJ_1.jpg"],video:null},
    {id:"A6gjEK9J",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"건성, 세정력·당김 딜레마를 동시에 해결한 구체적 체감 (이미지 1장)","zh-CN":"干皮，同时解决清洁力与紧绷两难的具体体验（附1张图片）"},date:"2026-07-06",
      quote:{ko:"건성피부라 세안 후 당김이 늘 고민이었어요. 세정력을 놓치면 찝찝하고, 세정력을 잡으면 당김이 심졌어요... 두 가지를 동시에 만족하는 클렌징 밀크를 드디어 발견한 게 바로 노마디아 블루 진정 판테놀 1% 클렌징밀크입니다!🥰\n\n제형/사용감\n가볍고 부드러운 로션 타입이라 롤링할 때 뻑뻑함 없이 부드럽게 퍼지고, 생크림 촉감처럼 자극 없이 편하게 사용할 수 있어요. 물로 헹굴 때도 미끌거림 없이 깨끗하게 씻겨나가서 헹군 직후에도 잔여감 없이 뽀득한 느낌이 들어요. 이 부분에서 이미 만족도가 확 올라갔습니다.🤩\n\n세안 후\n이게 진짜 신기했던 부분인데, 세안 후에 당김이 거의 없어요. 건성피부는 클렌징 후 바로 스킨케어를 안 하면 얼굴이 뻣뻣해지고 당기는 느낌이있는데, 이 제품을 쓰고는 몇 분이 지나도 그런 느낌이 없어서 처음엔 좀 놀랐습니다.🤩 판테놀 성분 덕인지 세안 직후에도 피부가 진정되어 있는 느낌이 들어요.\n\n세정력\n가벼운 메이크업 날엔 밀크만으로 충분히 지워지고, 화장을 진하게 한 날은 같은 라인의 골든 호호바 버블클렌저로 이중세안을 해주면 정말 말끔하게 지워져요. 밀크치고 세정력이 나쁘지 않다는 느낌을 확실히 받았습니다.🤩\n\n총평\n- 예전에 쓰던 클렌징 밀크는 자극도 있고 세정력도 아쉬웠는데, 이걸로 바꾸고 나서는 자극 없고 당김도 없어서 계속 재구매할 것 같아요.\n- 순하면서 속당김 없는 클렌저 밀크+ 클렌저 버블  찾으시는 분들께 강추합니다!👍🥰","zh-CN":"干皮的我一直被洗后紧绷困扰。清洁力不够就觉得不干净，清洁力够了紧绷又变严重……终于找到能同时满足这两点的洁面乳，就是NOMADIA蓝色舒缓泛醇1%洁面乳！🥰\n\n质地/使用感\n是轻盈柔软的乳液型，打圈时不干涩，能顺滑抹开，像鲜奶油一样的触感，无刺激很舒适。用水冲洗时也不滑腻，能干净洗掉，冲完之后没有残留感，有种清爽的干净感。这一点满意度已经直线上升了。🤩\n\n洗脸后\n真正神奇的地方是，洗后几乎不紧绷。干皮如果洗完不马上做后续护肤，脸就会僵硬紧绷，但用了这款产品几分钟后也没有那种感觉，一开始还有点惊讶。🤩 可能是泛醇成分的功劳，洗完脸马上就有种被舒缓的感觉。\n\n清洁力\n淡妆的日子光用洁面乳就能卸干净，浓妆的日子搭配同系列的金色荷荷巴气泡洁面做双重清洁，真的能卸得很干净。作为洁面乳，清洁力真的不差。🤩\n\n总评\n- 以前用的洁面乳有刺激也有清洁力不足的问题，换了这款之后没有刺激也不紧绷，感觉会一直回购。\n- 强推给正在找温和又不紧绷的洁面乳+气泡洁面组合的朋友们！👍🥰"},images:["thumbnail/reviews/milk/A6gjEK9J_1.jpg"],video:null},
    {id:"JvezQp0A",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"건성, 얇고 약한 피부 - 제품 바꿀 때마다 뒤집어지던 반복 경험담 (이미지 1장)","zh-CN":"干皮，皮肤薄弱敏感 - 每次换产品就爆痘的反复经历（附1张图片）"},date:"2026-06-05",
      quote:{ko:"⭐️노마디아를 만나고 나의 피부 성공 시대 시작됐다⭐️\n\n제 추구미는 좋은 피부를 유지해 최소한의 메이크업만 하는 것인데요. \n건성 김미연에 얇고 약한 피부를 가지고 있어 정착할 제품을 찾는 것이 늘 어려웠습니다.\n성분 좋다 그래서 구매하면 뒤집어지고, 괜찮은 것 같을 때쯤 뒤집어지고.. (그럴 때마다 멘탈도 뒤집오지는..^^;) 의 반복이었어요. \n\n메이크업은 하면 할수록 ‘얹는 것’ 보다 ‘지우는 것’ 이 중요한 것 같더라고요. 30대가 된 후 더더욱 신경쓸 수밖에 없는 피부.. 직구 생활 그만하고 싶어서 K뷰티에서 끝내주는 클렌징 제품 나오기만을 기다렸는데, 혜성같이 나타난 💫노마디아💫 혹시 본사가 어느 쪽일까요.. 그쪽으로 절 한번 올리겠습니다.\n\n제형이 무겁지 않아 아침 세안 저녁 세안에 모두 사용할 수 있고, 피부나 메이크업 상태에 따라 선택적으로 조합해 사용할 수 있어 좋았어요. 무엇보다 성분에 진심인 브랜드를 알게 되어 기쁩니다.\n저는 이제 여기 눕겠습니다 ㅇ<—< 여러분 모두 노마디아 하세요 🩵🩵🩵","zh-CN":"⭐️遇见NOMADIA之后我的皮肤逆袭时代开始了⭐️\n\n我的理想状态是维持好皮肤、只化最简单的妆，\n干皮又皮肤薄弱敏感，一直很难找到能长期定妆的产品。\n听说成分好就买来试，结果爆痘，感觉差不多适应了又爆痘……（每次这样心态也跟着崩溃……^^;）就这样反反复复。\n\n化妆化久了才发现，比起'上妆'，'卸妆'更重要。到了30岁之后更是要重视皮肤……不想再继续海淘了，一直等着K-Beauty出个厉害的清洁产品，结果彗星般出现了💫NOMADIA💫总部到底在哪呢……我要往那边捧一下。\n\n质地不厚重，早晚洁面都能用，还能根据皮肤或妆容状态灵活搭配使用，这点很喜欢。最重要的是很高兴认识了一个对成分很用心的品牌。\n我现在要躺平了ㅇ<—< 大家都来用NOMADIA吧🩵🩵🩵"},images:["thumbnail/reviews/milk/JvezQp0A_1.jpg"],video:null},
    {id:"qPgkDvQZ",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지/민감, 오래 롤링해도 마찰 열감 없음, 항목별 상세 (이미지 3장)","zh-CN":"水油皮/敏感，长时间打圈也不会因摩擦发热，分项详细测评（附3张图片）"},date:"2026-05-30",
      quote:{ko:"🫧 제형 : 묽은 로션 타입의 클렌징 밀크예요. 물처럼 주르륵은 아니지만 오일보다도 훨씬 부드럽게 롤링돼서 피부에 자극감이 거의 없고, 오래 문질러도 마찰로 인한 열감이 느껴지지 않았어요.\n\n🫧 사용감 : 롤링감이 부드럽고 세안 후에도 피부 당김 없이 촉촉하게 마무리돼요. 클렌징 밀크 특유의 잔여감이 걱정됐는데 물세안을 충분히 해주면 미끈거리거나 답답한 느낌 없이 깔끔하게 마무리됐어요.\n\n🫧 세정력 : 평소 가벼운 쉐도우, 브로우, 블러셔 정도의 메이크업을 하는 편인데 무리 없이 잘 지워졌어요. 데일리 메이크업 클렌징용으로 사용하기 괜찮았어요.\n\n🫧 진정감 : 피부가 예민한 날에도 부담 없이 사용할 수 있었어요. 세안 후 피부가 편안한 느낌이라 건조하거나 자극받은 날 손이 자주 갈 것 같아요.\n\n🫧 향 : 향이 강하지 않은 편이라 사용하기 편했어요. 인위적인 향이 거의 느껴지지 않아서 호불호 없이 사용할 수 있을 것 같아요.\n\n🫧 용기 : 펌프 타입이라 사용하기 편하고, 펌프를 옆으로 돌리면 잠기는 구조라 보관할 때도 깔끔해요. 여행이나 외박할 때 챙겨가기에도 안심되는 패키징이었어요.\n\n🫧 민감성 : 사용하면서 따갑거나 화한 느낌은 없었고, 세안 후 붉어짐이나 자극도 느끼지 못했어요. 순한 클렌징 제품 찾는 분들에게 잘 맞을 것 같아요.\n\n오일보다도 훨씬 부드럽고 자극감 없어서 현재 아쉬운거 없고 이걸로 갈아탑니다!","zh-CN":"🫧 质地：是偏稀的乳液型洁面乳。虽不像水一样流动，但比油类打圈更柔软，皮肤几乎没有刺激感，长时间打圈也不会因摩擦而发热。\n\n🫧 使用感：打圈手感柔软，洗后也不紧绷，能水润收尾。本来担心洁面乳特有的残留感，但充分水洗之后没有滑腻或闷的感觉，很清爽地收尾。\n\n🫧 清洁力：我平时化淡妆、眼影、眉毛、腮红程度的妆，都能顺利卸掉。当日常妆容清洁用挺不错。\n\n🫧 舒缓感：皮肤敏感的日子用也没有负担。洗后皮肤感觉很舒适，干燥或受刺激的日子应该会经常用这款。\n\n🫧 香味：香味不浓，很好用。几乎感觉不到人工香味，应该不太会有明显好恶。\n\n🫧 包装：是泵头类型，使用方便，把泵头往旁边一转就能锁住，收纳也很整洁。旅行或外宿携带也让人放心。\n\n🫧 敏感度：使用期间没有刺痛或灼热感，洗后也没有泛红或刺激。适合正在找温和清洁产品的人。\n\n比油类更柔软、没有刺激感，目前完全没有不满意的地方，打算换用这款！"},images:["thumbnail/reviews/milk/qPgkDvQZ_1.jpg","thumbnail/reviews/milk/qPgkDvQZ_2.jpg","thumbnail/reviews/milk/qPgkDvQZ_3.jpg"],video:null},
    {id:"Jk8lOBBZ",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"건성, 클렌징오일→밀크 전환 - 진한/연한 메이크업 각각 테스트 (이미지 1장)","zh-CN":"干皮，从卸妆油换成洁面乳 - 分别测试浓妆/淡妆（附1张图片）"},date:"2026-05-31",
      quote:{ko:"노마디아 클렌징밀크 2주 사용후기\n\n저는 화장을 클렌징오일로 지워와서 클렌징밀크는 처음 써보는 경험이었어요. 클렌징밀크가 훨씬 가볍다고 해서 써보려고 하다 노마디아 클렌징밀크를 써보게되었습니다. 일단 한번 짜면 얼굴에 전부 도포할 수 있는 양이 적당하게 듬뿍 나와줘서 여러번 안짜도 돼서 속이 시원했어요.. 제가 쓰던 클렌징오일은 워낙 조금씩 나와서 여러번 짜고 중간에 막히고 이래서 짜증났거든요. 제형이 로션같더라고요! 점성이 꽤있어서 손위에서 흘러내리지않아서 정말 좋았어요👍 얼굴에 바르는데도 로션 펴바르는 느낌이었어요.\n\n진한메이크업, 연한메이크업 전부 사용해봤는데 립앤아이 리무버같은거 안쓰고도 마스카라 아이라이너도 다 지워져서 만족스러웠어요. 진한 메이크업의 경우 2차세안을 해줬지만, 비비크림, 치크, 립 정도만 바른 연한 메이크업은 그냥 클렌징밀크만 발라주고 유화 시켜준다음 물로 여러번 씻어내니까 잔여감이 없이 개운하더라고요! \n\n약산성이 피부에 좋다는걸 알면서도 미끌거리는 잔여감이 싫어서 꾸역꾸역 알칼리성 폼클렌징 쓰는 사람인데, 노마디아 클렌징밀크는 약산성으로 알고있는데도 메이크업 말끔히 지워주고, 마지막 마무리까지 적당히 개운했고 수분감은 남아있는 딱 좋은 느낌이었어요! 유분감은 가져가고 수분감만 남겨놓은, 너무 미끌거리지 않는 마무리감이라 엄청 만족했습니다💚\n\n집에 쟁여놓은 클렌징오일 다 쓰고 영영 클렌징밀크로 갈아탈 것 같아요. 그 중에서도 노마디아 클렌징밀크 정말 좋았어요!!","zh-CN":"NOMADIA洁面乳两周使用心得\n\n我一直用卸妆油卸妆，第一次尝试洁面乳。听说洁面乳更轻盈，正打算试试的时候就用上了NOMADIA洁面乳。挤一次就能出足够涂满全脸的量，不用挤好几次，很痛快……我之前用的卸妆油每次挤出来的量都很少，要挤好几次还老是堵住，很烦躁。质地像乳液！粘度挺够，不会从手上流下来，真的很喜欢👍涂在脸上也像涂乳液一样。\n\n浓妆、淡妆我都试过，不用唇眼卸妆液睫毛膏和眼线都能卸干净，很满意。浓妆的话我做了二次清洁，但只涂了BB霜、腮红、口红的淡妆，光用洁面乳乳化之后多冲几次水就很干净清爽，没有残留感！\n\n我明知道弱酸性对皮肤好，但因为讨厌滑腻的残留感一直勉强用碱性洁面泡沫，NOMADIA洁面乳虽然是弱酸性，但能把妆卸干净，最后的收尾感也是恰到好处的清爽，还留有水润感！带走油腻只留下水润，不会太滑腻的收尾感，非常满意💚\n\n家里囤的卸妆油用完之后应该会永久换成洁面乳。其中NOMADIA洁面乳真的很好用!!"},images:["thumbnail/reviews/milk/Jk8lOBBZ_1.jpg"],video:null},
    {id:"Z04B2j1Z",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지/민감, 트러블·흉터·자국 있는 예민 피부 - 두꺼운 베이스 메이크업 세안 루틴 (이미지 2장)","zh-CN":"水油皮/敏感，有痘痘·疤痕·痕迹的敏感肌 - 厚重底妆的洁面routine（附2张图片）"},date:"2026-05-31",
      quote:{ko:"약 일주일 정도 사용해봤는데, 개인적으로 정말 만족도가 높았던 클렌징 제품이었어요 💙\n\n저는 피부가 엄청 예민한 편인데도 트러블, 흉터, 자국 때문에  평소 베이스 메이크업을 두껍게 하는 편이라 항상 2차 세안까지 꼼꼼하게 하는 스타일이거든요 🥲 근데 클렌징 제품 잘못 쓰면 바로 피부가 뒤집어지거나 세안 후 얼굴이 화끈거리는 경우가 많았는데, 이 제품은 이름처럼 진정 라인이라 그런지 사용감이 정말 순했어요 🌿 클렌징 밀크 타입이라 피부에 부드럽게 롤링되고 자극 없이 세안되는 느낌이 특히 좋았어요! 그렇다고 세정력이 약한 느낌은 아니라서 메이크업 후에도 답답함 없이 사용할 수 있었어요 ✨세안 후 당김도 심하지 않은 편이라 요즘처럼 피부 예민할 때 더 손이 자주 가더라구요 😊\n\n👉 민감성 피부 + 잦은 메이크업으로 피부가 지친 분들께 추천하고 싶은 제품이에요 💡솔직히 다 사용하면 내돈내산 할 것 같다는생각도 들었어요 💸💙\n\n전체적으로 만족하면서 사용했지만, 아무래도 클렌징 밀크 타입이다 보니 👉 한 번에 엄청 강력하게 지워지는 느낌은 아니었어요! 그래서 진한 메이크업이나  워터프루프 제품을 자주 사용하는 분들은 포인트 리무버나 2차 세안을 함께 하는 게  더 잘 맞을 것 같아요 👀 저는 원래도 2차 세안을 하는 편이라  크게 불편하진 않았지만, 깔끔하게 “한 번에 싹 지워지는 느낌”을 선호하는  분들에겐 조금 순하게 느껴질 수도 있을 것 같아요 🙂 다만 그만큼 자극이 적다는 장점도 확실해서 민감성 피부인 저한테는 오히려 장점처럼 느껴졌어요 🫶","zh-CN":"用了大概一周左右，个人觉得满意度真的很高的清洁产品💙\n\n我皮肤非常敏感，但因为痘痘、疤痕、痕迹的关系，平时底妆化得比较厚，所以一直都要仔细做二次清洁🥲 但清洁产品用错很容易马上爆皮，或者洗后脸发烫，这款正如名字所说是舒缓系列，使用感真的很温和🌿 是洁面乳类型，能在皮肤上柔软打圈，无刺激洁面的感觉特别好！但也不是清洁力弱的感觉，化妆之后用也不会觉得闷✨洗后紧绷也不严重，最近皮肤敏感的时候反而更常用。😊\n\n👉 想推荐给敏感肌+经常化妆导致皮肤疲惫的朋友💡说实话如果用完了我可能会自己掏钱买💸💙\n\n整体用得很满意，但毕竟是洁面乳类型，👉 不是那种一次就能超强力卸干净的感觉！所以经常化浓妆或用防水产品的人，可能更适合搭配点妆卸妆液或二次清洁👀 我本来就习惯二次清洁，所以没什么不便，但喜欢那种'一次就干净卸掉'的人可能会觉得有点温和。🙂 不过正因为这样刺激也少，对我这种敏感肌来说反而是优点🫶"},images:["thumbnail/reviews/milk/Z04B2j1Z_1.jpg","thumbnail/reviews/milk/Z04B2j1Z_2.jpg"],video:null},
    {id:"A7w3M00A",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"건성/민감, 타 제품 대비 잔여감 없음 - 이중세안 불필요 체감 (영상+이미지 3장)","zh-CN":"干皮/敏感，相比其他产品无残留感 - 感受到无需二次清洁（视频+3张图片）"},date:"2026-06-09",
      quote:{ko:"친구의 강력 추천으로!! 구매하게 되었는데요\n써보자마자 만족이었습니다 (*'▽'*)\n\n원래 다른 클렌징 밀크 썼었는데 항상 잔여감이 있어서 찝찝해서 이중 세안 했었어요. 근데 이건 진짜 깨끗하게 씻기는 느낌이라 굳이 클렌징 폼 안해도 될 것 같아요 ㅎㅎ\n\n세안하고 나면 뭔가 뽀용 촉촉하달까? 마무리감이 정말 좋았습니당 다쓰면 재구매 예정이에요\n\n아 참고로 저는 예민한 편인 건성입니다 (｡•̀ᴗ-)✧","zh-CN":"因为朋友的强烈推荐！！才买了这款\n用了之后马上就很满意(*'▽'*)\n\n本来用的是其他家的洁面乳，总是有残留感，觉得不舒服所以都要做二次清洁。但这款真的是清洗得很干净的感觉，感觉不用特意再用洁面泡沫了呵呵\n\n洗完脸有种蓬松水润的感觉？收尾感真的很好。用完打算回购。\n\n啊顺便说一下，我是偏敏感的干皮 (｡•̀ᴗ-)✧"},images:["thumbnail/reviews/milk/A7w3M00A_1.jpg","thumbnail/reviews/milk/A7w3M00A_2.jpg","thumbnail/reviews/milk/A7w3M00A_3.jpg"],video:"thumbnail/reviews/milk/A7w3M00A.mov"},
    {id:"Jy7L1xrq",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"건성, 선크림날 밀크/풀메이크업날 오일+폼 세안 루틴 비교 (이미지 2장)","zh-CN":"干皮，涂防晒的日子用洁面乳/全妆日用油+泡沫的洁面routine对比（附2张图片）"},date:"2026-05-30",
      quote:{ko:"평소에 선크림 정도만 발랐을 때는 클렌징 밀크, 풀 메이크업 했을 때는 클렌징 오일로 일차 세안 하고 폼으로 2차 세안 하고 있습니다. 거의 항상 클렌징 밀크 사용하고 있는데 이번 기회에 예전부터 궁금했던 클렌징 밀크 사용해 볼 수 있는 좋은 기회 얻어서 좋았습니다!\n\n⭐️향: 무향은 아니고 은은하게 포근한 향이 나는데 인공적이지 않아서 향에 민감하신 분들도 충분히 편하게 사용하실 수 있을 것 같아요! \n\n\n⭐️제형 및 사용감: 일반적인 클렌징 밀크같이 로션같은 제형이었습니다! 전체적으로 유화 시키기 전에 부드럽게 얼굴 전체적으로 롤링 해주고 유화 시켜서 한 번 더 롤링 해주는데 일반 클렌징 오일 같이 미끄러운 느낌이 안들고 부드럽게 노폐물 녹여주는 느낌이라 좋았습니다. 보통 클렌징 밀크가 오일보다 자극이 적기는 하나 다른 제품들보다도 더 자극이 적은 느낌이었어요.\n\n\n⭐️세안 후 보습감 및 자극정도: 일단 클렌징 밀크가 순하다고 하더라도 피부 자체에 자극이 좀 있었던 날이라던가 강하게 문지르면 피부가 붉어지기도 하고 당김이 느껴지기도 했는데 판테놀이 들어가서 그런지 어떤 제품들보다도 자극과 속당김이 없어서 정말 좋았어요! 진짜 건성 분들이나 예민한 피부를 갖고 계신 분들도 편안하게 사용할 수 있는 제품이라고 느꼈습니다.\n\n클렌징 밀크로 봤을 때 아쉬운 부분은 전혀 없었습니다 ! 원래 클렌징 밀크가 전체적으로 진한 메이크업을 지워주는 용도가 아니기 때문에 그 부분은 논외로 두고 봐야 한다고 생각합니다!","zh-CN":"平时只涂防晒的日子用洁面乳，化全妆的日子用卸妆油做一次清洁，再用泡沫做二次清洁。几乎一直都在用洁面乳，这次刚好有机会尝试一直很好奇的洁面乳，很开心！\n\n⭐️香味：不是完全无香，有淡淡的温暖香味，不是人工香，对香味敏感的人应该也能放心使用！\n\n⭐️质地及使用感：是一般洁面乳那样的乳液质地！乳化前先在整个脸上柔软打圈，再乳化后再打圈一次，不像一般卸妆油那样滑腻，而是温和溶解废物的感觉，很喜欢。一般来说洁面乳比油类刺激少，但这款感觉比其他产品刺激更少。\n\n⭐️洗后保湿感及刺激程度：就算洁面乳再温和，皮肤本身有点刺激的日子或者用力搓的话还是会泛红或紧绷，但可能是含有泛醇的关系，这款比其他产品都更没有刺激和内干紧绷，真的很好！真心觉得干皮或敏感肌的朋友都能舒适使用。\n\n作为洁面乳来看完全没有不满意的地方！本来洁面乳整体上就不是用来卸浓妆的，这一点应该要另外看待！"},images:["thumbnail/reviews/milk/Jy7L1xrq_1.jpg","thumbnail/reviews/milk/Jy7L1xrq_2.jpg"],video:null},

      quote:{ko:"사용기간: 1.5주 (26.6.13~26.6.24)\n30대 / 건성 / 민감성 / 홍조 / 약한 모낭염, 피부염 등\n\n버블이 아주 쫀쫀한 편입니다. 오일이 포함된 버블이라 그럼 클렌징오일 사용하듯이 물을 묻히지 않고 사용해야하나? 싶어서 그렇게 해봤더니 예전에 사용했던 오일투폼 클렌져처럼 피부 위에서 뻑뻑함이 느껴지더라구요. 그래서 무조건 얼굴에 물을 묻히고 살살 문질렀더니 자극 없이 잘 쓸 수 있었습니다.\n공식 판매처에 가서 확인해봤더니 사용 방법에 얼굴에 물을 묻히고 사용하라고 되어있더라구요.\n\n약산성이라 확실히 세안 후에도 촉촉합니다. 다만 피부 컨디션에 따라서 살짝의 당김은 있을 수 있을 것 같아요. 평소에 사용할 때는 당기는 느낌은 거의 못느껴봤었는데 오늘 사용했을 때는 약간 당기는 느낌이 있었습니다.\n\n그리고 선크림 사용 후에 2차 세안 없이 버블 클렌져 단독으로 사용했을 때 다음 날 트러블이 나거나 한 것 없었고 세안 후 얼굴에 남아있는 느낌도 없었습니다.\n\n눈 따가움은 전혀 없습니다. 사용하면서 일부러 테스트하려고 눈 깜빡이고 문질러보고 해봤는데 전혀 따가운 느낌 없었습니다.\n\n오일이 함유되어있는게 확실히 장점이다 라고 느낄만한 점은 코에 표면 위로 나온 피지가 정돈된다는 것입니다. 클렌징 오일 사용한다는 느낌으로 한 20초쯤 코를 문지르면 코에 박혀있는 블랙헤드가 빠지는 정도는 아니지만 오돌토돌하게 느껴지던 피지가 매끈하게 정돈된 느낌을 받을 수 있었습니다. 또 사용 직후에는 블랙헤드도 아주 살짝 옅어진 것 같은 느낌도 들어요. \n\n저는 조금만 잘못 처치하면 바로 다음 날 모낭염이나 피부염이 재발하기 때문에 각질제거는 오직 세안제로만 합니다. 이 제품은 약산성인데도 꽤 세안 효과가 좋은 것 같습니다.","zh-CN":"使用时间：1.5周（26.6.13~26.6.24）\n30多岁/干皮/敏感性/泛红/轻度毛囊炎、皮炎等\n\n气泡相当浓密。因为含油的气泡产品，我一开始以为是不是要像用卸妆油那样不沾水使用？结果那样一试，就像以前用过的油转泡沫洁面一样，皮肤上有种干涩感。所以后来一律先沾水再轻轻揉搓，就能无刺激地使用了。\n去官方旗舰店确认了一下，使用方法上写着要先沾水再使用。\n\n是弱酸性，洗后确实很水润。不过根据皮肤状态，可能会有轻微紧绷感。平时用的时候几乎没感觉到紧绷，但今天用的时候有点轻微的紧绷感。\n\n还有，涂了防晒之后不做二次清洁、单独用气泡洁面的话，第二天也没有长痘，洗完脸后脸上也没有残留感。\n\n完全没有呛眼。用的时候特意测试了一下，眨眼、揉搓都试了，完全没有刺痛感。\n\n含油这点确实感受到明显优点的地方是，能整理鼻子表面冒出的皮脂。用像用卸妆油那样的手法在鼻子上打圈约20秒，虽然不至于把嵌在里面的黑头挤出来，但能感觉到原本粗糙的皮脂被整理得光滑很多。而且用完之后马上感觉黑头好像也变淡了一点点。\n\n我这种皮肤只要稍微处理不当，第二天就会立刻复发毛囊炎或皮炎，所以去角质只靠洁面产品来做。这款虽然是弱酸性，但洁面效果感觉相当不错。"},images:[],video:null},

      quote:{ko:"🫧 피부 타입: 수부지(수분 부족형 지성), 복합성\n🫧 피부 고민: 여드름 / 모공 / 피부장벽\n🫧 특이 사항: 하관 전체 레이저제모중\n🫧 구매 가격: 24000원\n\n❄️ 수분감/유분감\n세안 후 당김이 심한 편은 아니었고 피부가 편안한 느낌이 들었음 세정력은 괜찮은데 사용 후 건조함은 과하지 않아서 좋았어요\n\n❄️ 사용감\n사용 전에 흔들어주고 펌핑하면 풍성한 거품이 바로 나오는 방식이라 정말 편했음 평소에는 일반 클렌징폼을 거품기에 따로 사용해서 거품을 만들어 썼는데 이 제품은 그 과정이 필요 없어서 좋았어요 거품도 촘촘하고 부드러운 편이라 세안할 때 사용감이 만족스러웠음개인적으로 아침 세안용으로도 좋았어요\n\n❄️ 자극감/트러블 여부\n사용하면서 자극감은 거의 느끼지 못했고 트러블도 따로 올라오지 않았음 데일리 클렌저로 무난하게 사용 가능했어요\n\n❄️ 잔여감\n세안 후에는 미끌거리거나 찝찝한 느낌 없이 깔끔하게 마무리되는 편이었음\n\n❄️ 가성비\n정가 기준 24000원이라 엄청 저렴한 편은 아니지만 할인하면 더 가격 낮아질거고 거품기로 거품을 따로 만들 필요 없이 바로 사용할 수 있다는 점과 사용감을 생각하면 나쁘지 않은 편이라고 생각함\n\n❄️ 재구매 의사\n있음 사용하기 편한 점이 가장 마음에 들었고 세정력도 생각보다 괜찮고 아침세안용으로 사용중이라 재구매 의사 있어요\n\n🫧 총평\n개인적으로 가장 만족했던 부분은 사용 편의성이었음 흔들고 펌핑만 하면 풍성한 거품이 바로 나와서 거품기를 따로 사용할 필요가 없었고 세안 과정이 훨씬 편해졌어요 세정력도 생각보다 약하지 않고 깔끔하게 세안되는 편이라 만족스러웠고 자극도 크지 않아서 데일리 클렌저로 사용하기 좋은 제품이라고 생각해요 개인적으로 아침 세안용으로도 좋아요","zh-CN":"🫧 肤质：水油皮（水分不足型油性肌），混合性\n🫧 肤质困扰：痘痘/毛孔/皮肤屏障\n🫧 特殊情况：下颌部位正在做激光脱毛\n🫧 购买价格：24000韩元\n\n❄️ 水润感/油腻感\n洗后紧绷感不严重，皮肤感觉很舒适。清洁力不错，用后也不会过度干燥，这点很好\n\n❄️ 使用感\n用前摇匀再按压，蓬松的泡沫立刻就出来了，真的很方便。平时用普通洁面泡沫要另外用起泡网打泡，这款不需要这个步骤，很喜欢。泡沫也细腻柔软，洗脸时使用感令人满意，个人觉得当早晨洁面用也很好\n\n❄️ 刺激感/是否长痘\n使用期间几乎感觉不到刺激，也没有额外长痘。当日常洁面产品用完全没问题\n\n❄️ 残留感\n洗后没有滑腻或不适的感觉，收尾很干净\n\n❄️ 性价比\n以原价24000韩元来说不算特别便宜，不过打折后价格会更低，加上不用另外用起泡网就能直接使用这点和使用感，觉得还算不错\n\n❄️ 回购意愿\n有。最喜欢的是使用便利，清洁力也比想象中不错，我当早晨洁面产品在用，有回购意愿\n\n🫧 总评\n个人最满意的部分是使用便利性。摇一摇按压一下蓬松的泡沫立刻就出来，不用另外用起泡网，洁面过程方便多了。清洁力也没有想象中弱，能干净洁面，很满意，刺激也不大，适合当日常洁面产品，个人也很适合当早晨洁面用"},images:[],video:null},
    {id:"Zlyn4nEq",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"수부지/호르몬성 좁쌀·각질뜸 - 5분 이상 맨얼굴에도 당김 없음","zh-CN":"水油皮/激素性闭口·脱皮 - 素颜超过5分钟也不紧绷"},date:"2026-06-18",
      quote:{ko:"6/10-6/11 아침 저녁 두번 사용해봤어요\n저는 흉이 있는 모공피부, 수부지에요 \n이제 여드름은 잘안나지만 호르몬 주기, 또는 요즘처럼 날씨가 바뀌면 좁쌀이 올라오고 선크림만 발라도 하얗게 각질이 뜬것처럼 피부가 트는데요. 수분장벽이 깨지기 쉬운피부라 주의를 해도 관리가 쉽지 않은 직장인이에요\n\n여드름 피부는 오일을 쓰면안된다는 인식이 있지만 오히려 유슈분 밸런스가 깨지면서 트러블이 생기는 경우가 많기에 오히려 오일을 좋게 생각하고 겨울에는 호호바오일을 수분크림에 섞발해주기도 하는데요. 이제품은 클렌징 단계에서 이미 10% 호호바 오일이 들어가있어서 체험을 해보고 싶었어요! \n\n우선 제형이 굉장이 쫀쫀하고 세미꾸덕(?) 그래서 조금만 펌핑해도 얼굴 전체에 도포가 가능하고 수분을 지켜주며 클렌징이 가능한것 같았어요. 실제로 세수를 하고나왔을때 당김이 적고 제가 기초를 깜박하고 갑자기 오신 우체부 아저씨를 마중(?)하고 왔는데 맨얼굴로 오분이상을 지냈는데도 당김이 없었어요..! \n속건조에 특히 도움이 될거 같았고 더써봐야 알겠지만 피부 겉표면이 맨들(?)해지는 느낌을 받았어요!","zh-CN":"6/10-6/11 早晚各用了一次\n我是有痘坑毛孔的水油皮 \n现在已经不太长痘了，但一到生理周期，或者像最近这样换季，就会冒闭口，光涂防晒皮肤都会像起白色皮屑一样干裂。是那种水分屏障容易崩溃、就算注意保养也很难管理的上班族肌肤\n\n虽然大家普遍觉得痘痘肌不能用油类，但其实很多时候恰恰是水油平衡被打破才长痘，所以我反而对油类印象不错，冬天还会把荷荷巴油混进保湿霜里用。这款产品在清洁这一步就已经加了10%荷荷巴油，所以很想体验一下！\n\n首先质地非常紧实，有点半厚重的感觉，所以只需按压少量就能涂满全脸，感觉能在保护水分的同时完成清洁。实际上洗完脸出来紧绷感很少，我忘了涂基础护肤品，突然邮递员大叔来了就出去迎接了一下（？），素颜待了超过五分钟也没有紧绷……！\n感觉对内干特别有帮助，虽然还要多用几次才能确定，但已经感觉皮肤表面变得光滑（？）了！"},images:[],video:null},
    {id:"qPgbxvnZ",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지+성인여드름 민감성 - 임상수치 인용, 모공 노폐물 케어","zh-CN":"水油皮+成人痘敏感肌 - 引用临床数据，毛孔废物护理"},date:"2026-07-03",
      quote:{ko:"수부지 + 성인 여드름 있는 민감성 피부라 세안제도 성분 꼼꼼히 보는 편인데, 이번에 써본 노마디아 골든 호호바 10% 듀얼 마이크로 버블 클렌저 140ml 솔직 후기 남겨볼게요! 🫧\n\n✅ 장점\n1. 펌프 타입이라 한 손으로도 편하게 사용 가능, 양 조절도 쉬움\n2. 미세버블이 모공 속 노폐물까지 세정해주는 느낌, 세정력 확실함\n3. 호호바씨오일 10% 함유라 세안 후에도 당기지 않고 촉촉하게 마무리됨\n4. 판테놀 1%, 구아이아줄렌, 3종 히알루론산, 세라마이드, 병풀추출물 함유로 세안하면서 피부 장벽까지 케어되는 느낌\n4. 약산성 무향 포뮬러라 트러블 피부에도 자극 없이 사용 가능\n5. 수부지 피부 특성상 T존 피지 걱정되는데 오일리하지 않고 산뜻하게 마무리됨\n6. 모공을 막지 않는 식물성 오일이라 여드름성 피부에도 부담 없음\n7. 임상을 통해 모공 속 노폐물 세정 99.4%, 피부장벽 5.9배 케어, 2.1배 빠른 진정 확인된 제품\n\n민감성 + 트러블 피부인데 아침이나 2차 세안에서 당김도 싫고 보습도 챙기고 싶은 분들께 추천드려요 💙","zh-CN":"我是水油皮+有成人痘的敏感肌，选洁面产品也比较看重成分，这次用了NOMADIA金色荷荷巴10%双重微气泡洁面140ml，留个真实测评！🫧\n\n✅ 优点\n1. 泵头设计，单手也能方便使用，用量也好控制\n2. 微气泡感觉能清洁到毛孔深处的废物，清洁力确实不错\n3. 含10%荷荷巴籽油，洗后不紧绷，水润收尾\n4. 含1%泛醇、蓝甘菊薁、3种透明质酸、神经酰胺、积雪草提取物，洗脸的同时感觉皮肤屏障也在被照顾\n4. 弱酸性无香配方，痘痘肌也能无刺激使用\n5. 水油皮T区皮脂多，本来有点担心，但用完不油腻，很清爽地收尾\n6. 是不堵塞毛孔的植物油，痘痘肌用起来也没有负担\n7. 经临床验证：毛孔内废物清洁率99.4%，皮肤屏障护理提升5.9倍，舒缓速度加快2.1倍\n\n推荐给敏感+痘痘肌、又不想早晨或二次清洁时紧绷、还想兼顾保湿的朋友们💙"},images:[],video:null},

      quote:{ko:"저는 T존은 유분기가 많고 U존은 건조한\n전형적인 수부지 피부인데요. 🥲\n\n피지에 강한 워터프루프 메이크업을 주로 하다보니\n세정력이 좋은 클렌징 제품을 사용하고 나면\n속건조 때문에 당김이 더 심해지는.. \n반복되는 악순환을 겪고 있는 1인 입니다. ㅜㅜ\n\n그래서\n클렌징 제품을 고를 때 과도한 피지는 케어해주면서\n세안 후에도 당기지 않고 촉촉한 제품을 선호하는 편이에요!\n\n골든 호호바 10% 듀얼 마이크로 버블 클렌저는\n피부에 친화적이면서 모공을 막지 않는 호호바씨 오일과\n피부 장벽과 유사한 구조의 세라마이드 성분이\n모공 속 피지, 각질 및 메이크업 잔여물까지\n말끔히 씻어내주면서\n건조함이나 자극은 최소화한 버블 클렌징폼이라\n저 같은 수부지 피부에 너무 좋더라구요 🤭✨️\n\n누르면 조밀한 입자의 미세한 거품이 바로 나오는데\n아침부터 분주하고 바쁜 직장인에겐\n문질러 거품을 내야하는 짧은 시간이라도 아껴주는 꿀템!\n(●'◡'●)\n\n특히 요즘처럼 날이 더울 땐\n땀도 많이 흘리고 피지도 폭발하고ㅋ;;\n선크림이랑 노폐물이 뒤적여\n퇴근할 때쯤엔 피부가 엉망이 되는데\n순한 성분으로 산뜻하게 마무리할 수 있는 제품이라\n마음에 들었어요~! \n\n세안 후에도 당기지 않고 진정 성분이 함유된 \n클렌징폼을 원하시는 분들에게 추천 드립니다. ㅎㅎ","zh-CN":"我是T区油、U区干的\n典型水油皮。🥲\n\n因为经常化耐皮脂的防水妆，\n用清洁力强的清洁产品之后，\n内干导致紧绷感反而更严重……\n一直陷在这种恶性循环里。ㅜㅜ\n\n所以\n挑清洁产品时我更喜欢那种\n能清理多余皮脂、洗后又不紧绷水润的产品！\n\n金色荷荷巴10%双重微气泡洁面\n用了对皮肤友好、不堵塞毛孔的荷荷巴籽油，\n和与皮肤屏障结构类似的神经酰胺成分，\n把毛孔里的皮脂、角质和残妆都清洁干净，\n同时把干燥和刺激降到最低的气泡洁面泡沫，\n对我这种水油皮真的很合适🤭✨️\n\n一按就能出细密的微气泡，\n对早晨忙碌的上班族来说，\n连搓泡沫的那点时间都能省下来，是个宝藏单品！\n(●'◡'●)\n\n特别是最近天热的时候，\n出汗多、皮脂也爆发ㅋ;;\n防晒和废物混在一起，\n下班时皮肤已经乱糟糟的，\n这款成分温和、能清爽收尾，很喜欢~！\n\n推荐给想要洗后不紧绷、又含舒缓成分的洁面泡沫的朋友们。ㅎㅎ"},images:[],video:null},

      quote:{ko:"피부타입 : 수부지 / 모낭염 / 여드름 / 넓은 모공\n\n🩵 평소 수부지 피부인데도 세안 후 당김이 심한 편이고, 모낭염이나 여드름 때문에 자극이 적은 클렌저를 선호해서 사용해봤어요\n\n펌프만 누르면 미세 버블이 바로 나와서 따로 거품을 낼 필요가 없어 정말 편했어요. 거품이 촘촘하고 부드러워 피부 마찰이 적게 느껴졌습니다😊\n\n✨ 세정력은 선크림이나 가벼운 메이크업, 노폐물은 깔끔하게 제거되는 느낌이었고 피부결도 정돈되는 느낌을 받았습니다. 진한 메이크업을 한 날에는 1차 클렌징을 함께 해주는게 좋을 것 같아요.\n\n💧 가장 만족스러웠던 점은 세안 후에도 피부가 당기지 않고 촉촉함이 유지된다는 점이었어요. 평소 세안 후 쉽게 붉어지거나 건조함을 느끼는 편인데 그런 자극이 거의 없었습니다.\n\n🌿 향은 거의 무향에 가까워서 부담이 없었고, 민감성 피부도 비교적 편안하게 사용할 수 있을 것 같아요.","zh-CN":"肤质：水油皮/毛囊炎/痘痘/毛孔粗大\n\n🩵 我平时是水油皮，但洗后紧绷感比较严重，加上有毛囊炎和痘痘，所以偏好刺激少的洁面产品，就试用了这款\n\n只要按压泵头，微气泡立刻就出来了，不用另外打泡，真的很方便。泡沫细腻柔软，感觉皮肤摩擦少😊\n\n✨ 清洁力方面，防晒或轻妆、废物都能干净去除，肤质纹理也感觉更整齐。浓妆的日子建议搭配一次清洁一起使用。\n\n💧 最满意的是洗后皮肤不紧绷，能维持水润。平时洗后容易泛红或干燥的我，几乎感觉不到这种刺激。\n\n🌿 香味几乎接近无香，没有负担，敏感肌用起来应该也比较舒适。"},images:[],video:null},
    {id:"A6gjd28J",rating:5,skinType:{ko:"복합성","zh-CN":"混合皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"속건조 심한 지성, 트러블 압출 후에도 따가움 없음, 트러블 감소 체감","zh-CN":"内干严重的油皮，压痘后使用也不刺痛，感受到痘痘减少"},date:"2026-07-03",
      quote:{ko:"손에 펌핑했을 때는 생크림처럼 촘촘하고 밀도 있어 보이는 거품이 풍성하게 올라오는데, 실제로 얼굴 피부에 사용할 때는 아주 가볍고 촉촉한 거품이에요.\n그래서 1번보다는 2~2.5번 정도 펌핑해서 사용하고 있어요.\n거품이 생각했던 것보다 더 가볍고 부드러워서 세정이 잘 안되는건 아닐까 걱정했는데 메이크업 세정력도 좋아서 놀랐어요!\n모공 사이에 낀 파운데이션도 아주 잘 씻기더라고요 ㅎ.ㅎ\n\n저는 속건조가 심한 지성피부인데 피부를 산뜻하게 세정해 주면서 속당김이 느껴지지 않는 점이 너무 좋아요!\n계절이나 피부 타입을 타지 않는 클렌저라는 생각이 들어요.\n\n트러블이 자주 올라오는 편인데, 압출 후에 사용해도 따가움이 전혀 느껴지지 않는 점도 좋고, 요즘 매일 이 제품으로만 세안했는데 피지나 트러블이 좀 줄어든 것같은 느낌도 들어요.\n\n클렌징오일처럼 부드럽고 자극없는 제형을 원하시지만 미끌거리는 마무리감이 싫었던 분들이나,\n클렌징폼처럼 강력한 세정력을 원하시지만 피부 당김이 불편하셨던 분들에게 강력추천하는 클렌징제품이에요 :)\n\n저는 개인적으로 용기도 마음에 드는데, 좌우로 돌려서 잠그거나 별도의 마개를 끼우는게 아니라 아예 캡이 있는 제품이라 좋아요.\n펌프가 눌릴 염려가 없으니 출장갈 때 파우치에 편하게 담아가기에도 좋고, 위생적으로 관리할 수 있어서도 좋아요.\n\n순한 사용감이 좋아서 저는 다 쓴 후에 재구매 의향도 있어요, 좋은 제품 체험해 볼 수 있는 기회주셔서 감사합니다!","zh-CN":"按压在手上时，泡沫像鲜奶油一样细腻紧密、蓬松地冒出来，但实际用在脸上时是非常轻盈水润的泡沫。\n所以我不按一次，而是按压2~2.5次左右使用。\n泡沫比想象中更轻盈柔软，本来担心是不是清洁力不够，结果卸妆清洁力也很好，让我很惊讶！\n卡在毛孔里的粉底液也洗得很干净呵呵。\n\n我是内干严重的油性肌肤，这款能清爽清洁皮肤，同时又不觉得紧绷，真的很喜欢！\n感觉是一款不挑季节、不挑肤质的洁面产品。\n\n我经常长痘，压痘之后用也完全不刺痛，这点也很好，最近每天都只用这款洁面，感觉皮脂和痘痘都稍微减少了一些。\n\n强烈推荐给想要卸妆油般柔软无刺激的质地、但不喜欢滑腻收尾感的人，\n或者想要洁面泡沫般强力清洁力、又不想忍受紧绷感的人 :)\n\n我个人也很喜欢这款的瓶身设计，不是那种要左右旋转锁紧或另外套盖子的类型，而是自带盖子的设计，很喜欢。\n不用担心泵头被按到，出差时放进化妆包也很方便，卫生管理也很省心。\n\n温和的使用感让我很满意，用完之后也有回购意愿，谢谢给我体验好产品的机会！"},images:[],video:null},
    {id:"Zly5KNoq",rating:5,skinType:{ko:"복합성","zh-CN":"混合皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"복합성/민감성, 운동 후·면도 전후 자극 없이 사용","zh-CN":"混合肌/敏感性，运动后·刮胡前后也能无刺激使用"},date:"2026-07-03",
      quote:{ko:"1. 세정력\n아침저녁으로 2주 사용\n\n과도하게 뽀득하지 않으면서 피지와 노폐물 제거\n\n운동 후 땀과 유분이 많은 날에도 깔끔한 마무리\n\n선크림 정도는 무리 없이 세정 가능\n\n세안 후 얼굴이 개운하면서도 당김이 적은 편\n\n2. 제형\n펌프를 누르면 풍성한 마이크로 버블이 바로 나옴\n\n거품을 따로 만들 필요가 없어 사용이 편리\n\n거품 입자가 촘촘하고 부드러워 피부 자극이 적은 느낌\n\n얼굴에 닿았을 때 쿠션감이 좋아 마찰 부담 감소\n\n3. 사용감\n세안 후 피부가 건조하게 조여오는 느낌이 적음\n\n촉촉함이 남아 바로 스킨을 바르지 않아도 부담 없음\n\n면도 전후 사용 시에도 자극이 크지 않았음\n\n은은한 향으로 부담 없이 사용 가능\n\n4. 추천 피부타입\n세안 후 당김을 자주 느끼는 건성 피부\n\n유수분 밸런스가 필요한 복합성 피부\n\n자극이 적은 클렌저를 찾는 민감성 피부\n\n과도한 유분 제거보다 촉촉한 마무리를 선호하는 피부\n\n5. 총평\n2주 동안 사용하면서 가장 만족했던 부분은 세정력과 촉촉한 마무리감의 균형이었음. 노폐물과 피지는 깔끔하게 제거되는데 세안 후 피부가 당기지 않아 아침, 저녁 모두 부담 없이 사용 가능했음. 거품이 풍성하고 부드러워 피부 마찰이 적게 느껴졌으며, 건조함 때문에 순한 클렌저를 찾는 사람에게 추천할 만한 제품이었음","zh-CN":"1. 清洁力\n早晚使用两周\n\n不会洗到过度干涩，能去除皮脂和废物\n\n运动后汗多油多的日子也能干净收尾\n\n卸除防晒程度不成问题\n\n洗后清爽，紧绷感较少\n\n2. 质地\n按压泵头蓬松的微气泡立刻就出来\n\n不用另外打泡，使用方便\n\n泡沫颗粒细腻柔软，皮肤刺激感较少\n\n接触脸部时缓冲感好，摩擦负担减少\n\n3. 使用感\n洗后皮肤干燥紧绷的感觉较少\n\n留有水润感，不马上涂化妆水也没负担\n\n刮胡前后使用刺激也不大\n\n淡雅的香味，使用无负担\n\n4. 推荐肤质\n洗后经常紧绷的干性肌肤\n\n需要水油平衡的混合性肌肤\n\n想找刺激少的洁面产品的敏感性肌肤\n\n比起过度去油更偏好水润收尾的肌肤\n\n5. 总评\n使用两周下来，最满意的是清洁力和水润收尾感的平衡。废物和皮脂清洁得很干净，但洗后皮肤不紧绷，早晚使用都没有负担。泡沫蓬松柔软，皮肤摩擦感较少，对因为干燥而想找温和洁面产品的人来说是值得推荐的产品"},images:[],video:null},
    {id:"AVpVyjRZ",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"악건성+좁쌀여드름, 피부과에서 호호바오일 추천받은 이력","zh-CN":"极干皮+闭口痘痘，曾被皮肤科推荐使用荷荷巴油"},date:"2026-07-03",
      quote:{ko:"2주일간 성실하기 사용한 찐 후기입니다!\n30대 좁쌀 여드름 건성 피부입니다\n\n✌️세안후당김 없음\n진짜 악건성이라 건조해서 오히려 여드름이 나는 스타일이라 세정력 강하고 뽀득한 제품을 정말 안좋아하능데 이제품은 확실히 호호바오일이 함유되어있어서 그런가 세안후 얼굴 당김이 진짜 없었습니다!\n\n호호바오일이 피부의 피지와 가장 유사한 성분으로 피부에 사용하기 정말 건강한 오일이라고 피부과에서 건조한 저같은 피부에 사용해보라고 추천한 오일이였어서 더 신뢰가 갔습니다\n\n✌부드러운 버블\n펌프를 누르면 풍성한 버블로 나와서 거품을 일부로 낼 필요도 없고 자극도 덕분에 하나도 없어서 매일매일 특히 아침에 사용해주기 너무 좋았습니다\n\n\n✌️세정력\n평소 화장은 안하고 톤업선크림 정도만 바르고 출근하는데 충분히 세정이 되어서 세정력도 아주 만족하고 사용하고 있습니다!\n\n✌️순함\n그리고 성분이 일단 여드름이 여전히 나는 피부라서 순함 제품을 늘 찾는데 판테놀에 나이아신아마이드 세라마이드까지 피부장벽에 좋은 성분들은 다 있고 사용하고 부담이 없다고 느껴져서 손이 진짜 자주 가는 제품입니다","zh-CN":"认真使用两周后的真实测评！\n30多岁闭口痘痘干性肌肤\n\n✌️洗后不紧绷\n我是真正的极干皮，反而是因为干燥才长痘的类型，所以真的不喜欢清洁力强、洗到吱吱响的产品，这款可能是因为确实含有荷荷巴油，洗后脸真的不紧绷！\n\n荷荷巴油是与皮肤皮脂最相似的成分，是对皮肤真正健康的油，皮肤科也曾建议像我这种干燥肌肤用这种油，所以更加信任\n\n✌柔软的气泡\n按压泵头就能出蓬松的气泡，不用特意打泡，也因此完全没有刺激，每天特别是早上用起来非常方便\n\n✌️清洁力\n我平时不化妆，只涂提亮防晒就出门上班，这款完全能洗干净，清洁力也很满意！\n\n✌️温和\n而且成分方面，我是还在长痘的皮肤，一直在找温和的产品，这款含泛醇、烟酰胺、神经酰胺等对皮肤屏障好的成分都有，用起来没有负担，真的很常用"},images:[],video:null},
    {id:"ZMmyWKPZ",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"민감성/건성, 4시간 방치해도 안당김, 눈 안따가움","zh-CN":"敏感性/干皮，放置4小时也不紧绷，不刺激眼睛"},date:"2026-05-19",
      quote:{ko:"성분 : 화해앱에서도 확인가능하지만 성분이 좋아서 그런지 사용하는 내내 트러블 없이 사용 할 수 있었어요.\n향 : 무향이긴 하지만 화장품 유분향이라고 할까요? 거북하진 않음\n눈따가움 : 없음\n\n민감성 피부를 위한 장벽/진정 클렌징 제품으로 약산성과 향료도 없고 무자극인데 세정력은 좋아서 민감성인 저도 편안하게 사용했어요.\n\n호호바 오일이 함유되어 있어서인지 세안후에는 뽀득뽀득보다는 촉촉함이 많아 피부장벽이 보호된다는게 느껴졌어요. 세안후에 깜빡하고 4시간 넘게 기초를 못했는데 피부가 당기거나 건조함은 없었어요.\n\n저처럼 민감성이나 건성이신 분들에게는 잘 맞을 듯하고 지성이거나 뽀득함을 원하는 분들에게는 좀 부족하다고 느끼 실 수도 있을 것 같아요.\n\n평소에 전 클렌징밀크 사용 후 약산성 클렌징 폼을 사용하는데 이 제품은 클렌징 밀크사용하지 않아도 물없이 사용하면  메이크업이 녹는 기분이 들어서 이 제품만 사용해도 충분했어요.","zh-CN":"成分：在化海App上也能查到，可能是成分好，使用期间完全没有出现皮肤问题。\n香味：虽然是无香，但有一点点像护肤品的油脂香？不会让人不舒服\n呛眼：没有\n\n是为敏感肌设计的屏障/舒缓类洁面产品，弱酸性、无香料、无刺激，同时清洁力也不错，我这种敏感肌用起来也很舒适。\n\n可能是含有荷荷巴油，洗后不是那种吱吱响的干净感，而是偏水润，能感受到皮肤屏障被保护着。有一次洗完脸忘了做后续护肤，放了超过4小时，皮肤也没有紧绷或干燥。\n\n像我这种敏感肌或干皮应该会很适合，油皮或喜欢洗到吱吱响的人可能会觉得不够。\n\n我平时是用完洁面乳再用弱酸性洁面泡沫，这款就算不用洁面乳，不沾水直接用也感觉能把妆溶掉，光用这一款就够了。"},images:[],video:null},
    {id:"Z3mB7RKA",rating:5,skinType:{ko:"복합성","zh-CN":"混合皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"홍조·열감·여드름, 피부장벽 무너져 피부과 상담 받은 경험 인용","zh-CN":"泛红·发热·痘痘，引用皮肤屏障崩溃后去看皮肤科的经历"},date:"2026-07-03",
      quote:{ko:"❤️피부타입: 홍조, 민감성, 열감, 여드름\n\n🩵사용동기: 평소에 진한 화장보단 선크림을 주로 바르고 다니는데, 데일리로 쓰면서 피부 장벽에 무리가 없는 제품을 찾다가 사용하게 되었습니다! 성분이 너무 좋고 제 피부타입에 잘 맞을것 같아서 꼭 사용해보고 싶었어요!!!\n\n🩷사용감: 시중의 일부 폼 제품들은 사용하면서 폼이 너무 죽어서 세안할때 마찰감이 느껴지는 것도 있었는데 이 제품은 세안이 끝날때 까지 폼이 살아있어 자극이 1도 없어서 좋았습니다!! 세안 후에도 진짜 촉촉했어요. 당기는 느낌이 이때까지 써본 클렌징 제품들 중에서 제일 없었고 그래서인지 확실히 순하다, 자극없다는 느낌이 들었습니다.\n\n💛민감성: 저는 피부 장벽이 무너져서 조금만 자극있는 제품 쓰면 뒤집어져요! 근데 이 제품은 진짜 자극 1도 없고, 세안 하고 나면 결이 정리되면서 보들보들 해졌습니다. 오히려 진정되는 느낌?? 순하고 당김 없어서 민감한 피부에 진짜 추천드려요!!\n\n🫰🏻총평: 장벽 무너져 피부과 갔을때 클렌징 관련해서 말씀해주신게, 클렌징 할때 엄청 조심스럽게 자극없이 부드럽게 하는게 중요하다더라구요. 세안하면서 장벽이 더 자극 받으니까 절대 얼굴 바로 문지르지말고 가능하면 폼 기구로 폼 만들고 손가락에 힘빼고 롤링하라는 거였어요! 무조건 약산성 쓰고.. 근데 이 제품은 성분도 엄청 순하면서 아예 폼형식이라 진짜 만족했습니다. 앞서 언급한 것처럼 폼이 빨리 꺼지는것도 아니라서 얼굴에 더 자극 없이 세안할수 있어서 정말 만족했습니다!!","zh-CN":"❤️肤质：泛红、敏感性、发热、痘痘\n\n🩵使用契机：平时比起浓妆更常涂防晒，一直在找日常使用不会给皮肤屏障添负担的产品才用上了这款！成分特别好，感觉很适合我的肤质，一直想试试看!!!\n\n🩷使用感：市面上有些泡沫产品用着用着泡沫就会消，洗脸的时候能感觉到摩擦感，但这款一直到洗完脸泡沫都还在，完全没有刺激感!!洗后也真的很水润。紧绷感是我用过的洁面产品里最少的，所以确实感觉很温和、无刺激。\n\n💛敏感性：我皮肤屏障已经崩溃了，只要用稍微有刺激的产品就会爆发！但这款真的完全没有刺激，洗完脸后皮肤纹理反而变整齐，摸起来软乎乎的。反而有种被舒缓的感觉？温和又不紧绷，真心推荐给敏感肌！！\n\n🫰🏻总评：屏障崩溃去看皮肤科的时候，医生说关于清洁最重要的是要非常小心地无刺激、柔软地洁面。洗脸的时候屏障会受到更多刺激，所以绝对不要直接用手搓脸，尽量用起泡工具打出泡沫，手指放松力气打圈！而且一定要用弱酸性……这款成分很温和又正好是泡沫形式，真的很满意。就像前面说的，泡沫也不会很快消掉，能更无刺激地洗脸，真的很满意!!"},images:[],video:null},
    {id:"Zlyn45Eq",rating:5,skinType:{ko:"지성","zh-CN":"油皮"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"지성 T존+건성 볼 복합, 오일 클렌징 시 트러블 나던 경험 대비 트러블 없음","zh-CN":"T区油、脸颊干的混合肌，对比用油类清洁会长痘的经历，这款不长痘"},date:"2026-06-18",
      quote:{ko:"⭐️세정은 물론, 피부장벽 보호&진정까지!!\n: 호호바 오일, 세라마이드로 세안은 기본\n피부장벽 보호에 추가로 병풀추출물, 모란뿌리 추출물로 진정력있게 마무리 가히 갓벽한 클렌저,,왕 추천\n\n⭐️ 약산성& 무향료 무색소\n: 민감성 피부 테스트로 안심하고 사용,, 무향료인것도 가산점인 부분! 민감 예민피부는 색소와 향료 있음 트러블 나잖아요ㅠ\n\n⭐️얇고 조밀한 거품으로 꼼꼼 세정\n: 한번 펌핑으로 손쉬운 사용과 손에서 여러번 거품을 키우지 않아도 충분한 거품량이 좋았어요.\n촘촘한 버블이 피부 구석구석을 부드럽게 지워내주는 느낌\nT존이 유분이 많고 볼 이마는 건성인데 타입별로도 잘 잡아주는 기분이 들었어요. 유분이 많은 곳은 말끔히 지워주면서 건조한 부위는 수분감있게 클렌징해주는 느낌이에요.\n그래서 얼굴이 건조하게 땡기지않았답니다!!\n\n⭐️ 호호바 오일 함유\n: 기름은 기름으로 씻어낸다고들 하는데, 저는 오일을 롤링하면 더 트러블이 올라오는 느낌이더라구요. 잘 씻어도 말이죠 ㅠ근데 이 제품은 모공을 막지않는 식물성 오일이라 그런지\n딱히 트러블이 생기지는 않았어요!\n그래서 꾸준히 모공관리에 사용해보려합니다","zh-CN":"⭐️不仅清洁，还兼顾皮肤屏障保护&舒缓!!\n：荷荷巴油、神经酰胺打好清洁基础\n在保护皮肤屏障之外，还用积雪草提取物、牡丹根提取物做舒缓收尾，堪称完美的洁面产品，,,超推荐\n\n⭐️ 弱酸性&无香料无色素\n：经敏感肌测试，可以放心使用,,无香料这点也是加分项！敏感脆弱肌一沾色素和香料就容易长痘对吧ㅠ\n\n⭐️薄而细密的泡沫，清洁得很仔细\n：一次按压就够用，不用在手上另外搓出很多泡沫，这点很好。\n细密的气泡感觉能柔软地清理皮肤每个角落\nT区油、额头和脸颊偏干，这款感觉能针对不同区域分别照顾。油的地方清理得干干净净，干燥的部位则带着水润感清洁。\n所以脸不会干燥紧绷!!\n\n⭐️ 含荷荷巴油\n：都说以油溶油，但我一用油打圈皮肤反而更容易长痘的感觉ㅠ即使洗干净也一样。但这款是不堵塞毛孔的植物油，用了完全没有长痘的情况!\n所以打算持续用来做毛孔管理"},images:[],video:null},
    {id:"Jy7mwaKq",rating:5,skinType:{ko:"지성","zh-CN":"油皮"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"극건성·홍조 등 예민 피부까지 편안, 오일클렌저 트러블 걱정 해소","zh-CN":"极干皮·泛红等敏感肌也很舒适，解除对油类洁面导致长痘的顾虑"},date:"2026-06-18",
      quote:{ko:"오리입처럼 생긴 거품 입구 디자인이 되게 독특해서 처음부터 사용하는 재미가 있었어요. 그리고 거품이 그냥 물 탄 듯 가벼운 느낌이 아니라 크림빵 속 크림처럼 몽글몽글하고 엄청 부드러워서 피부에 닿는 촉감이 정말 좋더라고요. 향도 은은하게 달달한 느낌이 나서 세안할 때 기분이 편안했어요.\n\n세안 후에는 피부가 하나도 당기지 않고 촉촉하게 마무리돼서 오일 보습막이 피부장벽을 감싸주는 느낌이 들었고요. 선크림 정도는 자극 없이 깔끔하게 잘 지워지는데 마무리는 또 개운해서 만족스러웠어요.\n\n전체적으로 민감성 피부나 극건성, 홍조 피부처럼 예민한 피부도 편안하게 사용할 수 있을 것 같은 순한 클렌저라는 인상이 강했고오일 클렌저 쓰면 트러블 날까 걱정하는 편인데 이 제품은 자극 없이 편안하게 사용할 수 있어서 좋았어요. \n\n컬러도 호호바 느낌의 브라운 톤이라 제품 분위기랑 잘 어울렸고 용기 디자인도 깔끔해서 마음에 들었습니다.","zh-CN":"像鸭嘴一样的出泡口设计很特别，从一开始用起来就很有意思。而且泡沫不是那种加了水一样轻飘飘的感觉，而是像面包夹心奶油一样绵密又超级柔软，接触皮肤的触感真的很好。香味也是淡淡的甜味，洗脸的时候心情很放松。\n\n洗后皮肤一点都不紧绷，能水润收尾，感觉油类保湿膜把皮肤屏障包裹住了。防晒程度能无刺激地干净卸掉，收尾又很清爽，很满意。\n\n整体给人的印象是，就算是敏感肌、极干皮、泛红肌这种敏感肤质应该也能舒适使用的温和洁面产品，我本来担心用油类洁面会长痘，但这款用起来无刺激又舒适，很喜欢。\n\n颜色也是荷荷巴风格的棕色调，和产品氛围很搭，瓶身设计也简洁大方，很喜欢。"},images:[],video:null},
    {id:"AweOXVKZ",rating:5,skinType:{ko:"지성","zh-CN":"油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"지성/수부지+속건조 민감성, 민감한 날에도 자극 없음","zh-CN":"油皮/水油皮+内干敏感肌，敏感的日子也无刺激"},date:"2026-07-03",
      quote:{ko:"📍피부 타입 : 지성 및 수부지 / 속건조 / 민감성\n\n🤍 사용감\n한 달 정도 사용해봤는데 거품이 정말 촘촘하고 부드러워서 세안할 때 피부 마찰이 거의 없었어요. 젤 좋은건 펌프만 눌러도 풍성한 거품이 나와서 따로 거품을 낼 필요가 없는거!! 이게 실제로 써보면 진짜 편해요.. 민감 피부는 클렌징할때 거품을 왕창 내줘야 하거든요 민감한 날에도 자극 없이 사용할 수 있었습니닷\n\n🤍 세정력\n평소 선크림이나 가벼운 베이스 메이크업은 깔끔하게 잘 지워졌어요. 세안 후에도 잔여감 없이 개운한데 피부가 뽀득하게 마르는 느낌은 아니점이 좋아요. 세정력은 충분하면서도 필요한 유분까지 싹 가져가는 타입은 아니라 속건조가 있는 저한테는 굳\n\n🤍 사용 후 느낌\n세안하고 나서 촉촉하게 마무리되는 느낌이라 기초 바르기 전까지도 피부가 편안했어요. 붉은기나 자극도 없고 매일 사용하기에도 부담이 없어서 손이 자주 가는 느낌\n\n🤍 추천\n-> 세안 후 당김 심한 사람 추천!\n-> 민감성, 속건조 피부도 부담 없이 사용 가능\n-> 풍성한 거품 좋아하는 사람 만족할 듯\n-> 데일리 클렌저 찾는 사람 추천\n-> 재구매 의사 ○","zh-CN":"📍肤质：油性及水油皮/内干/敏感性\n\n🤍 使用感\n用了大概一个月，泡沫真的很细密柔软，洗脸时皮肤摩擦感很少。最好的是只要按压泵头蓬松的泡沫就出来了，不用另外打泡！！实际用起来真的很方便……敏感肌洗脸就是要打出大量泡沫才行，敏感的日子用也没有刺激感。\n\n🤍 清洁力\n平时的防晒或轻底妆都能干净卸掉。洗后也没有残留感，很清爽，但又不是那种洗到吱吱响的感觉，这点很好。清洁力足够，但又不会把必要的油分都带走，对我这种内干的人来说正合适\n\n🤍 使用后的感觉\n洗完之后水润收尾，涂基础护肤品之前皮肤也很舒适。没有泛红或刺激，每天用也没有负担，会经常用\n\n🤍 推荐\n-> 推荐给洗后紧绷严重的人！\n-> 敏感性、内干肌肤也能无负担使用\n-> 喜欢蓬松泡沫的人应该会满意\n-> 推荐给正在找日常洁面产品的人\n-> 回购意愿 有"},images:[],video:null},
    {id:"JR786L6Z",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"민감·건성+여름철 속건조, 트러블 걱정에도 자극 없었음","zh-CN":"敏感·干皮+夏季内干，担心长痘但实际无刺激"},date:"2026-07-03",
      quote:{ko:"제 피부는 평소엔 민감성에 건성이고 여름엔 속건조 살짝 있는 중성정도입니다.\n\n평소 폼클렌징을 고를땐 저자극, 수분감, 세정력을 꼭 신경써서 봐요.\n\n최근 낮날씨가 부쩍 더워지면서 피부에 트러블이 생기며 클렌징에 더 신경쓰게 되는데 이 제품을 처음 받아봤을때 오일성분이 있는 폼이라 트러블에 자극있지 않을지 조금 걱정이었어요.\n\n우선 오전에 이 제품으로 세안 후 토너를 바로 사용하지않고 조금 있어봤는데 당김이 없어서 놀랐어요. 원래 쓰고있던 제품도 수분감있는 제품이라해서 구매했는데 세안 후 약간의 당김은 있어서 어쩔 수 없나보다 생각하던 차에 이 제품 사용해보니 당김이 없어 너무 마음에 들더라고요. \n그리고 트러블에 자극이 없는 점도 좋았습니다.진정이 된다기보단 더 자극하지 않는 쪽에 가까운거 같았어요.\n\n오후에 메이크업 지울때도 사용해봤는데 확실히 단독으로 사용하기엔 세정력이 조금 약한편이었어요. 대신 1차 클렌징하고 2차에 사용해보니 세정력이 좋더라고요. 피부에 잔여감도 없고 토너패드로 피부정리할때도 깔끔했습니다.\n\n전 오전, 오후 클렌징제품을 다르게 사용하는데 이 제품은 오전 오후 다 쓰기 좋은제품인거 같아요.\n\n 그리고 개인적으로 향에 많이 민감한편은 아닌데 이 제품 향을 맡아보면 약간 오일향?같은게 은은하게 나는데 향이 남는건 아니고 의식하지 않으면 잘 모를정도였습니다.\n\n사용할 때 따로 손에 롤링 안하고 몇 번 섞은 후 펌핑해서 사용하면되는 부분이 편하게 느껴졌어요. 거품도 쫀쫀하니 밀도있어서 피부에 자극없는점도 좋았습니다.","zh-CN":"我的皮肤平时是偏敏感的干性，夏天会有点轻微内干，算是中性偏干。\n\n平时挑洁面泡沫一定会看低刺激、水润感、清洁力这几项。\n\n最近白天天气变热，皮肤开始长痘，所以对洁面更加在意，第一次拿到这款产品时，因为是含油成分的泡沫，有点担心会不会刺激长痘的部位。\n\n首先早上用这款洁面之后没有马上用化妆水，等了一会儿，发现完全不紧绷，很惊讶。之前用的产品也是标榜水润，买了之后发现洗完还是会有点紧绷，觉得可能没办法避免，结果这款完全不紧绷，很满意。\n而且对长痘部位也没有刺激感，与其说是舒缓，更像是不会额外刺激的感觉。\n\n下午卸妆时也试了一下，单独使用清洁力确实偏弱。不过先做一次清洁再用这款做二次清洁，清洁力就很不错了。皮肤没有残留感，用化妆水棉片整理皮肤时也很干净。\n\n我早晚用的清洁产品不一样，这款感觉早晚都适合用。\n\n另外我个人不算对香味很敏感的人，闻这款有点像淡淡的油类香味，但不会残留，不刻意去闻的话几乎感觉不到。\n\n使用时不用先在手上打圈，只需搅拌几下再按压使用，这点很方便。泡沫也紧实有密度，对皮肤没有刺激，这点也很喜欢。"},images:[],video:null},
    {id:"Jvew9d0A",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"예민+건성, 타 버블클렌저(A사·I사)와 비교 후 만족","zh-CN":"敏感+干皮，对比其他家（A公司、I公司）气泡洁面后满意"},date:"2026-05-20",
      quote:{ko:"노마디아 골든 호호바 10% 듀얼 마이크로 버블클렌저! 🏆🫧\n\n예민한 피부+건성에 세안을 자주해서 클렌저 중요하게 생각합니다. 버블타입선호해서 (피부자극이 가장 없음) 사용중인 A사, I사랑 비교하며 사용해보았어요. 피부상태에 따라서 선택해서 사용하는데요. 아침에는 가장 순한 제품으로해요. 물세수가 좋다고 하지만 개운하지 않고 찝찝하여 아침부터 저녁까지 클렌저가 필수고 약산성이어야합니다. \n\n이 제품 사용해보니 전체적으로  성분✔️ 사용감✔️ 패키지✔️ 모두 다 만족스럽습니다. 👏\n\n호호바오일이 10%나 들어있어서 그런지 세안 후 촉촉하고, 약산성에 가까운지라 건조하지 않아서 가장 좋았습니다. 세안시 향은 거의 무향에 가까워서 거슬리는 점이 없었고 펌핑도 잘 되고 거품도 쫀쫀하고 좋아요. 이지워시 선크림을 바른 후에는 단독으로 이 제품만으로 세정해도 잘 지워지고. 유기자차 썬크림이나 메이크업후에는 1차로 클렌징밀크를 쓰고 그 후에 사용하기에도 적절합니다. 유기자차선크림을 바른 후 1차세안으로 바로 세안해봤는데 유화과정을 꼼꼼히 거치고 사용하니 잘 지워지긴 하는데 아주 약간은 남는 것 같아서, 아침에 쌩얼로 촉촉하게 순하게 사용하기에 가장 좋고! 2차세안용으로도 아주 좋습니다. 클렌저에 까다로운 편인데 이 제품 사용해보니 마음에 들어요. \n\n세안하고 거의 바로 토너미스트를 뿌리는데, 잠깐 기다리는 시간이 있어도 심하게 건조해 지지 않았어요. 호호바 오일 성분이 많이 들어있는 것이 이 제품의 장점!!! 🧴✨✨\n극건성, 건성에게 가장 추천하고 더워지는 날씨에는 자주 씻게 되니 피부가 건조해져서 장벽이 무너지지 않도록 중성 복합성도 괜찮을 것 같습니다. \n\n이 제품 아주 좋아요. 💛💛💛💛💛","zh-CN":"NOMADIA金色荷荷巴10%双重微气泡洁面！🏆🫧\n\n我是敏感肌+干皮，洗脸次数多，所以很看重洁面产品。喜欢气泡类型（对皮肤刺激最小），一直在和现在用的A公司、I公司的产品做对比。会根据皮肤状态选择使用。早上用最温和的产品。虽然都说清水洗脸好，但那样不够清爽还有点不适，从早到晚洁面产品都不能少，而且必须是弱酸性。\n\n用了这款之后，整体上成分✔️使用感✔️包装✔️都很满意。👏\n\n可能是荷荷巴油含量高达10%，洗后很水润，接近弱酸性，所以不干燥，这点最喜欢。洗脸时几乎闻不到香味，没有让人不适的地方，泵头也很好按，泡沫也紧实好用。用了物理防晒之后单独用这款清洁也能洗干净。用了有机防晒或化妆之后先用洁面乳做一次清洁，再用这款也很合适。试过直接用这款做一次清洁卸有机防晒，仔细乳化后也能洗干净，但会有一点点残留，所以早上素颜时用这款水润温和地清洁最合适！用作二次清洁也很好。我对洁面产品比较挑剔，用了这款觉得很满意。\n\n洗完脸后我几乎立刻喷化妆水喷雾，就算稍微等一下皮肤也没有严重干燥。荷荷巴油含量高是这款产品的优点!!!🧴✨✨\n最推荐给极干皮、干皮，天气变热之后洗脸次数增多，皮肤容易干燥导致屏障崩溃，中性、混合性肌肤应该也适合。\n\n这款真的很好用。💛💛💛💛💛"},images:[],video:null},
    {id:"J5zw62aZ",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"평범 피부, 눈에 거품 들어가도 무자극 (기존 제품은 따가웠음)","zh-CN":"普通肌，泡沫入眼也无刺激（原用产品会刺痛）"},date:"2026-06-18",
      quote:{ko:"노마디아 골든 호호바 듀얼 마이크로 버블 클렌저를 2주동안 꾸준히 사용해 보았습니다\n \n제품 외형은 따뜻한 노란 빛이 도는 펌핑형 용기에 거품층과 오일층이 분리되어있어요💛\n\n사용 시 잘 흔들어 주세요🫨\n펌핑을 하면 부드럽고 조밀한 거품이 \n형성되는데 거품을 따로  낼 필요가 없어서 \n피부에 자극이 덜 가요☁️  \n\n향은 무향에 가깝다고 볼 수 있어요 \n향은 워낙 호불호가 갈리기 때문에 \n저는 오히려 무향을 선호해서 마음에 들었어요  \n\n저는 평소에 화장을 거의 하지않고 \n선크림만 바르고 다니는데요 선크림은 잘 안지워져서 2중 세안을 항상 하는데 \n이 제품은 한 번의 클렌징만으로도 세정이 잘 되더라고요🌊 \n\n체감상 가장 바로 느낄 수 있던 점은 \n세안 후 당김이 없고 \n피부가 촉촉해져서 좋았어요 \n피부장벽 강화와 유수분 밸런스에 \n도움을 주는 호호바 오일이 들어 있어서 \n피부 수분 손실을 줄여주는것 같아요🥥\n\n기존에 사용하던 폼 클렌징은 눈에 거품이 들어가면 따가워서  눈에 통증이 있었는데  노마디아 클렌징은 눈에 거품이 들어가도 \n자극이 없었어요☺️\n\n또한 세안 후 피부가 한 톤 환해져서 \n개인적으로 재 구매하고 싶은 제품입니다  \n\n노마디아 브랜드는 민감성 피부를 갖고 계신 분들을 기준으로 만든 화장품이더라고요 \n자극이 적고 성분도 좋기 때문에 민감성이신 분들을 물론 저처럼 평범한 피부를 갖고 계신 분들에게 잘 맞을것 같아요  \n\n이 클렌징 제품은 건성이신 분들과 \n수부지 지성 분들에게  추천합니다😘","zh-CN":"连续两周持续使用了NOMADIA金色荷荷巴双重微气泡洁面\n \n产品外观是温暖黄色调的泵头瓶，泡沫层和油层是分离的💛\n\n使用前请充分摇匀🫨\n按压后会形成柔软细密的泡沫，\n不用另外打泡，\n对皮肤的刺激更小☁️  \n\n香味几乎接近无香。\n香味这种东西本来就见仁见智，\n我反而喜欢无香，很满意 \n\n我平时几乎不化妆，\n只涂防晒出门，防晒不太好卸所以一直做双重清洁，\n这款只用一次清洁也能洗得很干净🌊 \n\n体感上最能立刻感受到的是，\n洗后不紧绷，\n皮肤变得水润，很喜欢。\n含有能帮助强化皮肤屏障、维持水油平衡的荷荷巴油，\n感觉能减少皮肤水分流失🥥\n\n之前用的洁面泡沫，泡沫进眼睛会刺痛，眼睛会痛，\n但NOMADIA这款就算泡沫进眼睛\n也没有刺激感☺️\n\n而且洗完脸后皮肤肤色也感觉更亮，\n个人很想回购这款产品。\n\nNOMADIA这个品牌是以敏感肌人群为标准做的化妆品，\n刺激少、成分也好，\n不只是敏感肌，像我这种普通肤质用起来应该也很合适。\n\n这款洁面产品推荐给干性肌肤\n以及水油皮、油性肌肤的朋友们😘"},images:[],video:null},
    {id:"AweOXdEZ",rating:5,skinType:{ko:"복합성","zh-CN":"混合皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"40대 지복합성, 기미·홍조 있는 피부도 T존/U존 밸런스 만족","zh-CN":"40多岁油性混合肌，有色斑·泛红的皮肤也满意T区/U区平衡"},date:"2026-07-03",
      quote:{ko:"•현재 피부 상태\n-지복합성 수부지\n-환절기 시작되면 특히 입주변이 많이 건조함\n-나이가 들면서 광대쪽에 기미가 생김\n-메이크업은 안하며 선크림으로 마무리\n\n•고민 되는 부분\n-40대가 넘어가면서 피부가 얇아지고 건조함\n-겨울이나 일교차가 클때 홍조 자주 발생\n\n•사용기간\n6월 17일 ~ 7월 1일\n\n•체험후기\n펌핑하자마자 쫀쫀한 미세 버블이 나와 거품을 따로 낼 필요가 없어 사용하기 편했음.\n세안하면서도 피부에 자극이 거의 느껴지지 않았고, 헹군 뒤에는 뽀득하게 건조한 느낌보다는 촉촉하고 편안한 마무리감이 좋았음. 호호바 오일이 10% 함유되어 있어서인지 세안 후에도 피부가 당기지 않아 만족스러웠음.\n보통 지복합성 피부는 세정력이 강한 제품을 사용하면 U존이 쉽게 건조해지고, 순한 제품은 T존의 유분감이 남는 경우가 많은데, 이 제품은 두 가지를 비교적 균형 있게 잡아준다는 느낌을 받았음. T존은 산뜻하게 정돈되면서도 U존은 촉촉함이 남아 피부가 편안했음. \n향이 강하지 않아 부담 없이 사용할 수 있었음.\n세안 후 피부가 일시적으로 붉어지거나 예민해지는 느낌이 적어서 민감한 날에도 부담 없이 사용할 수 있었음.\n세안 후 피부가 뽀득하게 마르는 느낌보다 수분감을 어느 정도 유지하면서 편안하게 마무리되는사용감이 특히 마음에 들었음. 전체적으로 피부 컨디션이 안정적으로 유지되는 것 같아 만족스러웠음.\n평소 민감성이나 지복합성 피부라 어떤 클렌저를 써야 할지 고민하는 분들이라면한 번쯤 사용해 볼 만한 제품이라는 생각이 들었음.","zh-CN":"•当前皮肤状态\n-油性混合肌，水油皮\n-换季开始时嘴巴周围特别干燥\n-随着年龄增长颧骨附近长了色斑\n-不化妆，用防晒收尾\n\n•困扰的地方\n-40岁之后皮肤变薄、变干燥\n-冬天或早晚温差大时经常泛红\n\n•使用时间\n6月17日 ~ 7月1日\n\n•体验感受\n一按压就出紧实的微气泡，不用另外打泡，使用很方便。\n洗脸过程中几乎感觉不到皮肤刺激，冲洗之后不是那种吱吱响的干燥感，而是水润舒适的收尾感，很好。可能是含10%荷荷巴油，洗后皮肤也不紧绷，很满意。\n一般油性混合肌用清洁力强的产品，U区容易干燥，用温和产品又容易在T区留油光，但这款感觉能相对平衡地兼顾两者。T区清爽整洁，U区依然水润，皮肤很舒适。\n香味不浓，用起来没有负担。\n洗后皮肤不容易暂时性泛红或变敏感，敏感的日子用也没有负担。\n比起洗到吱吱响的干燥感，更喜欢这种保留一定水润感、舒适收尾的使用感。整体上皮肤状态感觉维持得很稳定，很满意。\n平时是敏感性或油性混合肌、正在纠结用什么洁面产品的人，这款值得一试。"},images:[],video:null},
    {id:"Jk8nb3lZ",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"극민감성+홍조+피지폭발, 홍조에도 자극 없음","zh-CN":"极敏感肌+泛红+皮脂爆发，泛红肌用也无刺激"},date:"2026-06-18",
      quote:{ko:"피부타입 :  {t존, 이마, 턱}은 피지폭발, 볼은 수부지인 지성피부. 극민감성+홍조\n제품 사용 기간 : 약 2주\n\n예전부터 호호바가 든 제품을 꼭 좀 써보고 싶었는데! 모공에 좋다고 해서요😆 이번에 좋은 기회가 생겨서 이렇게 사용해보게 되었습니다.\n\n👍🏻버블을 생성해서 사용이 편리합니다. \n짜서 손으로 비벼 거품을 만드는 것이 아닌 제품자체가 거품을 생성해줘서 편했어요. 쫀쫀...? 까진 아니더라도 풍성해서 잘 씻겨지는 기분이 들게 했어요.\n\n👍🏻민감성에 좋은 순한 제품\n성분표 보면 민감성에는 별로 추천 안한다고 했는데 민감성인 제가 썼을때는 괜찮았어요! 홍조가 심한데 자극이 있지도 않았고요. 민감하신 분들이 써도 괜찮을것 같아요.","zh-CN":"肤质：{T区、额头、下巴}皮脂爆发，脸颊是水油皮的油性肌肤。极敏感+泛红\n使用时长：约2周\n\n之前就一直很想试试含荷荷巴成分的产品！听说对毛孔好😆这次刚好有机会就试用了。\n\n👍🏻生成气泡使用方便。\n不是挤出来在手上搓出泡沫，而是产品本身直接生成泡沫，很方便。虽算不上特别紧实……但很蓬松，感觉能洗得很干净。\n\n👍🏻适合敏感肌的温和产品\n看成分表说不太推荐敏感肌用，但我是敏感肌用起来没问题！泛红很严重也没有刺激。敏感肌应该也能放心用。"},images:[],video:null},
    {id:"A11oQOWA",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"왕민감성 홍조(세안 직후 홍조 심함)+여드름, 세안 후 홍조 사라짐","zh-CN":"超敏感泛红（洗脸后立刻泛红严重）+痘痘肌，洗后泛红消失"},date:"2026-07-09",
      quote:{ko:"저는 평상시에도 홍조도 심한데 세수 직후에는 토마토가 되어버리는 왕 민감성 피부입니다ㅜㅜ 그렇다고 또 여드름 피부라 클렌징 효과가 떨어지는 제품도 쓰지도못해요ㅜㅠ너무 순하면 잔여물이 남아서 안그래도 많은 트러블이 더 올라오거든여...ㅜㅜ\n​\n기존에는 클렌징 오일에 폼으로 이차세안했는데 피부장벽에는 진짜 안좋다고 하더라구요\n그래서 최근에는 클렌징오일로만 클렌징했는데 또 뭔지 아시죠 마지막에 미끌거려서... 좀 덜 씻은 느낌...?\n찝찝쓰\n\n그래서 노마디아 클렌징밀크랑 버블클렌저 같이 쓰고있는데 자극없고 너무 좋은것같아요 눈화장 심한 사람들은 리무버를 따로 하라는데 저는 눈화장 거의 안해서 나랑 완전 찰떡...💕\n\n건조하신 분들 2차세안하면 특히 더 피부 당기고 자극심한데 이건 호호바오일이 들어가있어서 세수직후에도 얼굴이 촉촉한 느낌이 들더라구요 호호..ㅎ\n\n요즘에 세수 직후에도 홍조가 없는걸 보니 저는 클렌징 제품은 여기서 정착할 예정입니다!! 추천추천!!👍👍","zh-CN":"我平时泛红也很严重，洗完脸马上就变番茄脸，是超级敏感肌ㅜㅜ 但又是痘痘肌，清洁效果差的产品也不能用ㅜㅠ太温和的话会有残留，本来痘痘就多，用了反而会长更多...ㅜㅜ\n​\n之前用卸妆油再加泡沫做二次清洁，但听说这样对皮肤屏障真的不好\n所以最近只用卸妆油清洁，但你懂的，最后总有点滑腻……感觉没洗干净的样子...\n有点不清爽\n\n所以现在NOMADIA洁面乳和气泡洁面一起用，无刺激真的很喜欢，眼妆浓的人应该要另外用卸妆液，但我几乎不化眼妆，跟我完全绝配...💕\n\n干性的朋友做二次清洁时特别容易紧绷刺激，这款含荷荷巴油，洗完脸马上就能感受到脸很水润呵呵。\n\n最近发现洗完脸也没有泛红了，我打算就定妆在这套清洁产品上了!!推荐推荐!!👍👍"},images:["thumbnail/reviews/A11oQOWA_2.webp"],video:"thumbnail/reviews/A11oQOWA.mp4"},
    {id:"ZjK582Bq",rating:5,skinType:{ko:"복합성","zh-CN":"混合皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"장벽 손상으로 인한 간지러움 - 제품 교체 후 간지러움 해결","zh-CN":"屏障受损导致的发痒 - 换用产品后发痒问题解决"},date:"2026-07-03",
      quote:{ko:"[요즘 피부 고민]\n\n-얼굴이 조금 간지럽다? \n-이게 뭔가 좀 장벽이 무너졌거나\n건조한 것에서 오는 것인지 원인을 알 수 없었는데\n-이 클렌저를 바꾸고 그것의 원인을 깨달음.\n그것은 장벽이 무너지는 세안을 하고 있었기 때문.\n\n[일주일 사용후기]\n\n[제형]\n\n-(다른 버블 클렌저 및 버블 스킨도 쓰고 있는데)\n-노마디아 버블 클렌저는 듀얼 마이크로라는 제품명 답게 \n되게 곱고 쫀쫀한 거품이라는 생각이 직관적으로 보자마자 느껴짐. \n육안으로  봐도 굉장히 밀도 있는 거품임\n-물 뭍히기 전에 거품을 그냥 만져 봤을 때 퐁신퐁신함과 \n쫀쫀 약간 크리미함까지도 느껴졌음. \n커피 스팀 밀크 할때 벨벳 밀크 점도 느낌. \n\n[사용감]\n\n-진짜 딱 생각드는 한 문장 **매끈매끈하다?!**\n-다른 화장품 사용하는거 다 똑같고 \n이것만 바꾼 상태인데 뭔가 매끈매끈 느낌이 들어서\n피부결이 달라졌다고 느껴짐.\n-특히 세안후 당김이 느껴지지 않아서 좋았음\n-또 피부 고민이었던 간지러움이 확 잡힘. 신기....\n\n[장점]\n\n- 세안 시 롤링이 간편하고 퐁신한 거품에 \n손세안도 더 부드럽게 너무 강하지 않게 하게 되는 장점이 있음.\n-여드름성 피부, 민감성 피부도 쓸 수 있도록 순한 것 같음 (여드름 안남)\n-약국, 병원 전용으로도 파는 제품이라고 하니 더 믿음이 가는 느낌.\n-클렌징 밀크 후 버블로 2차세안을 할 수 있을까 세정력이 궁금했는데\n풀메이크업 후 클렌징밀크 + 아이클렌징 + 노마디아 버블 클렌저 2차세안해주니\n깔끔하게 잘 지워짐.  2차 세안의 자극을 줄여줘서 피부장벽 보호가 잘 되는 것 같음.\n-호호바 + 판테놀이 피부에 건조함에 도움이 되는데\n2차 세안 클렌져 단계에서도 들어가서 촉촉하게 세안 가능. \n-향도 거의 많이 느껴지지 않아서 좋았음","zh-CN":"[最近的皮肤困扰]\n\n-脸有点痒？\n-不知道是屏障崩溃了还是因为干燥，\n原因一直搞不清楚，\n-换了这款洁面之后才意识到原因。\n原来是我一直在用会破坏屏障的方式洁面。\n\n[一周使用心得]\n\n[质地]\n\n-（我还在用其他气泡洁面和气泡爽肤水）\n-NOMADIA气泡洁面正如'双重微'这个名字，\n第一眼看就直观地感觉到泡沫细腻紧实。\n肉眼看也很有密度感的泡沫\n-沾水之前先摸了一下泡沫，感觉蓬松又\n紧实，带点乳霜感。\n有点像咖啡蒸奶时那种丝滑奶泡的浓度感。\n\n[使用感]\n\n-真的脑子里马上冒出一句话**滑滑的？!**\n-其他护肤品都没变，\n只换了这一个，就感觉皮肤变得滑溜溜，\n感觉皮肤纹理都不一样了。\n-特别是洗后不紧绷，这点很喜欢\n-而且困扰我很久的发痒问题一下子解决了。神奇....\n\n[优点]\n\n- 洁面时打圈方便，蓬松的泡沫\n让手部洁面也变得更柔和不会太用力，这是优点。\n-痘痘肌、敏感肌应该也能用，感觉很温和（没有长痘）\n-听说这款也在药店、医院专供渠道销售，更让人信任。\n-一直好奇洁面乳之后用气泡洁面做二次清洁清洁力够不够，\n试了全妆之后先用洁面乳+眼部卸妆+NOMADIA气泡洁面做二次清洁，\n卸得很干净。二次清洁的刺激降低了，感觉皮肤屏障保护得很好。\n-荷荷巴+泛醇对皮肤干燥有帮助，\n二次清洁这一步也加了这些成分，能水润地完成洁面。\n-香味也几乎感觉不到，这点很喜欢"},images:[],video:null},
    {id:"ZOzbYrOJ",rating:5,skinType:{ko:"지성","zh-CN":"油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"피지 많은 지성, 어머니(건성)에게 선물할 정도로 만족","zh-CN":"皮脂旺盛的油皮，满意到送给干皮的妈妈"},date:"2026-07-03",
      quote:{ko:"🫪🫪버블클렌저가 이렇게 쫀쫀하다고!!?😳😳\n\n좋은 기회로 제품 사용해보고 리뷰 남깁니당 ♥\n이 제품 성분은 나중에 말씀드리고, 버블클렌저인데 거품밀도가 장난이아니에요..\n보통 일반 폼 손에서 거품내기 싫어서 버블폼 많이 쓰시잖아요?\n대신 일반폼보다 거품이 조금 가벼운 느낌이 항상 들었거든요\n이 제품도 비슷하겠거니, 그냥 마무리가 촉촉한 폼이겠거니, 했는데.. 아니요....!!!!!!! 아니요!!!!!!!!!!!!!\n폼 밀도가 진짜 장난이 아니에요.. 이렇게 묵직하면서 쫀쫀한 거품이 바로나온다고? 이정도로????? 싶어요진짜\n저는 육성으로 감탄을 했습니다.. 진짜 하루종일 세수하고싶을정도에요 슬라임이필요없는 거품입니다\n심지어 거기에 호호바오일에, 판테놀로 보습도 잡아주고 세라마이드엔피로 장벽케어도해주는데 병풀추출물로 진정도 도와주고 나이아신아마이드로 미백케어까지해준다고..?\n말도안됩니다 ... 기본 성분도 좋을 뿐더러 제품력이 엄청좋아요.\n정말 슬픈점은 제가 피지개쩌는지성피부라 데일리로 못쓴다는점..\n지성분들은 가을겨울이나, 피부가 엄청 예민한날, 혹은 피부과케어받았을때 정도 좋으실거같구 건성분들은 진짜 제발한번만써보세요.. 진짜 좋아요...\n기존에 다른 버블폼들이랑 차원이 다릅니다 ㅜ ㅜ\n저는 어머니가 건성이셔서 바로드렸어요..\n피부장벽무너지신 어머니들도 진짜 잘맞으실거같아요\n제가 건성이였다면 인생폼 될정도입니다 진짜로요\n제 리뷰중에 이렇게 호들갑떤 리뷰는 없어요 이거찐입니다","zh-CN":"🫪🫪气泡洁面居然能这么紧实！?😳😳\n\n有幸试用了这款产品来写测评♥\n成分之后再说，作为气泡洁面，泡沫密度真的不是开玩笑的。\n大家平时不都是不想在手上打泡才用气泡泡沫产品吗？\n但反过来说，气泡类产品的泡沫总感觉比普通泡沫轻一些\n我以为这款也差不多，大概就是收尾水润的泡沫吧，结果……不是……!!!!!!!不是!!!!!!!!!!!!!\n泡沫密度真的不是开玩笑的……居然能直接挤出这么厚重又紧实的泡沫？这种程度?????我真的忍不住惊叹出声……真的想一整天都在洗脸。是不需要史莱姆玩具的泡沫。\n而且还有荷荷巴油、泛醇负责保湿，神经酰胺EP负责屏障护理，积雪草提取物帮忙舒缓，烟酰胺还能做美白护理……？\n简直不像话...成分好就算了，产品力也超强。\n真正让人难过的一点是，我是超级出油的油皮，没法当日常款用……\n油皮的朋友们大概秋冬、皮肤特别敏感的日子、或者刚做完皮肤科护理的时候会很适合，干皮的朋友们真的求你们一定要试一次...真的很好用...\n和之前用过的其他气泡泡沫完全不是一个档次ㅜㅜ\n我妈妈是干皮，我直接送给她了……\n屏障已经崩溃的妈妈们应该也会很合适\n如果我是干皮的话，这款绝对能成为我的人生泡沫。真的。\n我写过的测评里从没这么大惊小怪过，这次是真心的"},images:[],video:null},

      quote:{ko:"🥹피부상태\n수분 부족형 건성, 민감성, 붉은기\nT존 피지, 블랙헤드, 모공\n\n\n✨장점✨\n\n\n\n💫 부드러운 사용감 + 충분한 세정력\n💫 버블로 편리한 사용\n💫 자극감, 붉은기 없이 광택나는 마무리감\n💫 믿음의 콜마 제조\n\n\n일단 한국콜마 제품이 워낙 잘 맞아서 기대했는데\n생각보다 더 좋아서 굉장히 만족스러웠어요!!!\n\n\n저자극이라 세정력은 별로 기대하지 않았는데 \n생각보다 세정력도 너무 좋아서 파운데이션 수준의 톤업크림도 그냥 이 제품으로 2차 세안까지 하면 잘 지워집니다.\n예전처럼 폼클렌징 + 클렌징 오일로 귀찮게; 하지 않아도 돼서 정말 좋아요.\n\n\n특히 바로 거품으로 세안 하는게 너무 편해서 \n더이상 일반 폼클로는 못돌아갈것 같아요ㅋ \n\n\n무향에 제가 써본 약산성 폼클렌징 중에서도 \n사용 후 자극감이나 붉은기도 가장 적은편 이었고,\n마무리감이 건조하지 않고 광택까지 느껴져서 아주 좋았습니다. \n\n\n그냥 지금까지 써본 클렌저 중 제일 맘에 드네요. \n저처럼 민감성에 세정력까지 필요한 사람에게 \n강력 추천 합니다.\n\n\n\n💫 재구매의사 👍👍👍👍👍👍","zh-CN":"🥹肤质状态\n水分不足型干皮，敏感性，泛红\nT区皮脂、黑头、毛孔\n\n\n✨优点✨\n\n\n\n💫 柔软的使用感 + 充分的清洁力\n💫 气泡形式使用方便\n💫 无刺激、无泛红，光泽收尾感\n💫 值得信赖的科玛代工\n\n\n本来韩国科玛（Kolmar）的产品一直很对我口味，就抱着期待用了\n结果比预期更好，真的很满意!!!\n\n\n因为是低刺激，本来没抱太大清洁力的期待\n结果清洁力比想象中好很多，连粉底级别的提亮霜用这个做二次清洁也能卸干净。\n不用再像以前那样麻烦地泡沫洁面+卸妆油了，真的很好。\n\n\n特别是可以直接用泡沫洁面这点太方便了\n感觉再也回不去普通泡沫了哈\n\n\n无香，而且是我用过的弱酸性泡沫洁面里，\n用后刺激感和泛红都算最少的一款，\n收尾感不干燥还带点光泽，非常喜欢。\n\n\n是我目前用过的洁面产品里最满意的一款。\n强烈推荐给像我这种既敏感又需要清洁力的人。\n\n\n\n💫 回购意愿 👍👍👍👍👍👍"},images:[],video:null},
    {id:"Jk8nbnpZ",rating:4,skinType:{ko:"복합성","zh-CN":"混合皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"지성+여드름성이 강한 세안제 써서 건성화된 사연 - 트러블 없이 개선","zh-CN":"油皮+痘痘肌用强力洁面导致变干性的经历 - 无刺激地改善"},date:"2026-06-18",
      quote:{ko:"지성피부에 여드름성 피부라 항상 세정력이 강한 클렌저만 찾아서 사용했어요. 근데 그렇게 자극이 강한 제품들만 쓰다 보니 세안 후에 얼굴이 금방 붉어지고 피부가 엄청 건조해지더라구요ㅠㅜ원래는 티존만 번들거리는 지성이었는데 어느 순간 볼이랑 턱은 건성이 되어버려서 씻고 나오면 볼따구가 쩍쩍 갈라지는 느낌이 들 정도였어요...\n\n그러던 중 노마디아 골든 호호바 10% 듀얼 마이크로 버블 클렌저를 사용해보게 되었는데, 제품을 보니 호호바 오일이 들어있더라구요?! 어릴 때 어무니가 호호바 오일을 자주 챙겨주셔서 효능은 알고 있었는데, 건조함은 잡아주면서도 피부를 번들번들한 지성처럼 만드는 오일이 아니라는 점이 좋았던 기억이 있었는데 오랜만에 호호바 오일이 함유된 세안제를 사용해보니 진짜 세안 후에도 피부가 당기거나 건조한 느낌이 거의 없었어요! 버블도 엄청 부드럽고 조밀해서 자극 없이 세안되는 느낌이었고, 약산성 클렌저라 피부 장벽에도 부담이 덜한 것 같았습니다! 저는 클렌저만 바꿔도 여드름이 하나둘 올라오는 편인데, 이 제품은 사용하면서 따로 트러블이 올라오지 않아서 더 만족스러웠어요.\n\n다만 약산성 클렌저다 보니 진한 메이크업까지 말끔하게 지워주는 제품은 아니었어요. 그래서 저는 1차로 클렌징 밀크로 충분히 마사지해서 메이크업을 지워주고, 2차 세안으로 이 버블 클렌저를 사용했는데 조합이 정말 좋았습니다!\n\n평소 저처럼 지성+여드름성 피부인데 세안 후 건조함이나 피부 당김 때문에 고민하셨던 분들이라면 한 번 사용해보셔도 좋을 것 같아요!","zh-CN":"我是油皮+痘痘肌，一直只找清洁力强的洁面产品用。但一直用刺激性强的产品，洗完脸很快就泛红，皮肤也变得非常干燥ㅠㅜ本来只有T区出油，不知从什么时候起脸颊和下巴变成了干性，洗完脸出来脸颊感觉像要裂开一样...\n\n后来用了NOMADIA金色荷荷巴10%双重微气泡洁面，一看成分居然有荷荷巴油?!小时候妈妈经常给我用荷荷巴油，我知道它的功效，记得它能解决干燥问题但又不会让皮肤变得油光光的，很久没用含荷荷巴油的洁面产品了，用了之后洗完脸真的几乎不紧绷不干燥！泡沫也超级柔软细密，感觉是无刺激地清洁，弱酸性洁面对皮肤屏障负担也小！我这种人只要换洁面产品就会长痘，但用这款期间没有额外长痘，更满意。\n\n不过因为是弱酸性洁面，不能把浓妆彻底卸干净。所以我先用洁面乳充分按摩卸妆，再用这款气泡洁面做二次清洁，这个组合真的很好！\n\n平时像我这样油皮+痘痘肌，又因为洗后干燥紧绷而烦恼的朋友，可以试试看！"},images:[],video:null},
    {id:"qnRn1aYq",rating:4,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:""},date:"2026-06-11",
      quote:{ko:"1:일단 바로 폼 형태로 나오다 보니 사용하기 편해서 좋았어요. \n\n2:!아침세안! 용으로 적합한 제품이라 생각되요. \n\n   남편이 깜빡하고 썬크림(무기자차) 바른 얼굴에 이 \n   제품으로만 세안하고 나선 끈적하게 남아서 안 지워졌다고 \n   투덜거린 적이 있었고 저는 아침에 맨 얼굴 세안시 코 부분이 \n   쫌 깨끗이 닦인 것 같이 안 느껴져서 두 번 한 적도 있었어요. \n   그런데 이 때는 제가 펌핑을 두 번만 해서 세안 했었고 다음번 \n   부터는 서너번 펌핑해서 롤링을 좀 더 많이 하고 씻어냈더니\n   괜찮았어요. \n\n3:전 건성피부에 알레르기 체질이라 툭하면 접촉성 피부염도  \n   잘 걸려서 피부과 쌤이 오일류는 가급적 쓰지 말라 해서 안 \n   써왔는데 호호바오일도 써 본적이 없어서 초큼 걱정을 했지\n   만 가려움이나 두드러기 뾰루지 같은 건 생기지 않아서 이런\n   면에서도 나쁘지 않은 것 같아요. \n\n4:세안 후 당김이 거의 (95%이상) 없어서 좋아요.","zh-CN":"1：首先直接就是泡沫形态挤出来，用起来很方便，这点很喜欢。\n\n2：作为！早晨洁面！用的产品感觉很合适。\n\n   我老公有次忘了这回事，涂了物理防晒的脸只用这款\n   洗，抱怨说黏糊糊的没洗掉。我自己早上素颜洁面\n   时鼻子那块也感觉没洗得特别干净，有一次还洗了两次。\n   不过那次我只按压了两下就洗了，之后\n   按压三四下多打圈按摩再冲洗，就没问题了。\n\n3：我是干性皮肤又是过敏体质，动不动就得接触性皮炎\n   皮肤科医生让我尽量不要用油类产品，所以一直没用\n   过荷荷巴油，本来还有点担心，结果没有出现发痒、\n   荨麻疹或痘痘之类的情况，这方面也还不错。\n\n4：洗后紧绷感几乎（95%以上）没有，这点很喜欢。"},images:[],video:null},
    {id:"qW4RmRXA",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지+여드름 피부, 모공 속까지 세정","zh-CN":"水油皮+痘痘肌，清洁到毛孔深处"},date:"2026-06-18",
      quote:{ko:"🙋🏻‍♀️ 수부지, 여드름 피부\n\n✅ 제형 및 발림성\n거품이 생각보다 쫀쫀해서 줄줄 흘러내리지 않아 좋아요.\n\n✅ 유수분감 (세정력)\n씻고 나면 뽀득뽀득 해져요. 약산성임에도 세정력이 좋은 것 같고, 건성에게는 조금 건조할 수 있어요.\n\n✅ 성분\n히알루론산, 판테놀 등 수분과 진정에 좋은 성분들이 들어있고, 특히 향료가 없어서 좋아요. 클렌징 제품에 좋은 성분은 크게 의미 없다고 생각하는 편이긴한데 안 좋은 성분이 안 들어가는 건 중요해서 마음에 듭니다.\n\n💟 총평\n거품 클렌저가 필요하다면 쓰기 좋아요. 거품이다 보니 모공 속까지 들어가서 깔끔하게 씻을 수 있어 저 같은 피지 폭발, 트러블 피부에 좋아보여요.","zh-CN":"🙋🏻‍♀️ 水油皮，痘痘肌\n\n✅ 质地及延展性\n泡沫比想象中紧实，不会流得到处都是，这点很好。\n\n✅ 水油感（清洁力）\n洗完之后有种吱吱响的干净感。虽然是弱酸性，清洁力感觉还不错，干性肌肤可能会觉得稍微有点干。\n\n✅ 成分\n含有透明质酸、泛醇等对补水和舒缓好的成分，特别是不含香料这点很喜欢。我个人觉得洁面产品里的好成分意义不算特别大，但不含不好的成分更重要，这点很满意。\n\n💟 总评\n想要泡沫洁面的话这款很适合。因为是泡沫形式能进入毛孔深处，能清洁得很干净，对我这种皮脂爆发、痘痘肌的人应该很不错。"},images:[],video:null},
    {id:"qPgLpbxZ",rating:5,skinType:{ko:"복합성","zh-CN":"混合皮"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"화농성 여드름·좁쌀·모공, 세안 후 트러블 변화 없음","zh-CN":"脓包痘痘·闭口·毛孔，洗后痘痘状况没有变化"},date:"2026-06-18",
      quote:{ko:"피부타입:복합성,여드름(화농성,좁쌀),모공\n\n처음 받았을때 이게 분리되어 있는건지 모르고 그냥 썼었네요 ㅋㅋ 제품 안읽어보고 쓰면 이렇게 됩니당 ㅎ 쓸때마다 꼭 흔들어서 사용해주세요! 일단 확실히 거품클렌저라 미세거품 크리미하게 잘 나옵니다! 그래서 확실히 피부에 자극은 안갈 것 같아요! 거품 한두번만 짜도 충분히 세안 가능해서 부드럽게 클렌징할 수 있었고, 세수하고 나면 비누기가 제대로 닦인게 맞나 싶을 정도로 마무리감이 촉촉해요. 세안하고나서 당김 있으신분들이 사용하기 좋을 것 같습니다! 저는 살면서 사용해본 클렌징중에 당김을 딱히 느껴본 적은 없어서 오히려 세안이 제대로된게 맞나 싶더라구요? 저는 유분기도 많고.. 모공도 크고 피지가 많아서 조금 세정력이 부족하다고 느낄 순 있을 것 같아요! 그렇다고 피부에 여드름이 난다거나 좁쌀이 난다거나 어떤 피부 변화가 있는 건 아닙니다! 워낙 순해서 그런 반응은 딱히 없네요! 세안후에도 촉촉한 마무리감 원하시는 분들한테 강추 드립니당 !","zh-CN":"肤质：混合性，痘痘（脓包型、闭口），毛孔\n\n刚拿到的时候都不知道要先摇匀，就直接拿来用了哈哈，不看产品说明就是这样。每次用之前请一定要摇一摇！首先确实是气泡洁面类型，能挤出细腻绵密的微气泡！所以对皮肤应该不会有刺激。挤一两下泡沫就足够洁面了，能温和清洁，洗完脸之后收尾感很水润，甚至会怀疑皂感是不是真的洗干净了。想推荐给洗后容易紧绷的人！我用过的洁面产品里，从没感觉到过这种紧绷感，反而怀疑是不是真的洗干净了？我皮脂比较多……毛孔也大，皮脂多，可能会觉得清洁力有点不够！但也没有出现长痘、闭口之类的皮肤变化！可能就是因为太温和了，没有出现那种反应！强烈推荐给想要洗后水润收尾的朋友！"},images:[],video:null},
    {id:"Zm2BNOWq",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지/민감, 예민하고 벗겨지던 피부가 안정됨","zh-CN":"水油皮/敏感，容易敏感脱皮的肌肤趋于稳定"},date:"2026-05-29",
      quote:{ko:"수부지, 민감성, 약 1주 사용\n\n세정력 ⭐️⭐️⭐️⭐️⭐️ 쓰던 퍼프가 클렌징폼이랑 워터로도 잔여물이 많아서 이 제품으로 거품 흡수시켜 닦아보니 속에 있는 파운데이션이 엄청 나왔어요. 그리곤 잔여물이 안나오게 깨끗한 처음의 색으로 바뀌었네요. 세정력 굿입니다. 또 비누로 샤워해도 피부 위 피지가 기름처럼 있는 부위를 닦아보니 매끈하게 싹 닦이네요.\n\n향⭐️⭐️⭐️⭐️⭐️ 무향이라 너무 편해요. 안 독하고 세면이 편안합니다.\n\n제형⭐️⭐️⭐️⭐️⭐️ 거품 안내도 되고 오일을 피부에 안남게 쓰이는 제형이라 지복합성인데도 잘 닦아내지고 피부가 미끄럽게 싹 닦이는게 정말 좋습니다.\n\n기능⭐️⭐️⭐️⭐️⭐️ 피부장벽이 보호되는 느낌. 수부지에게 매우 좋습니다. 건조해서 피부가 좀 벗겨지고 예민해지는 편인데 이 제품 쓰고 피부가 안정되었어요.","zh-CN":"水油皮，敏感性，使用约1周\n\n清洁力⭐️⭐️⭐️⭐️⭐️ 之前用的粉扑就算用洁面泡沫和清水洗也总有很多残留，用这款泡沫浸泡清洗，结果里面的粉底都被洗出来了。而且直到没有残留物冒出来，恢复到最初干净的颜色。清洁力很棒。而且用肥皂洗澡的时候，摸摸皮肤上像油一样的皮脂部位，也能光滑地一次洗干净。\n\n香味⭐️⭐️⭐️⭐️⭐️ 无香真的很省心。不刺鼻，洗脸时很舒适。\n\n质地⭐️⭐️⭐️⭐️⭐️ 不用另外打泡，也是不会在皮肤上留油的质地，虽然我是油性混合肌，也能洗得很干净，皮肤光滑地被清洗掉，真的很喜欢。\n\n功效⭐️⭐️⭐️⭐️⭐️ 感觉皮肤屏障被保护着。对水油皮非常好。我容易因为干燥而脱皮、变敏感，用了这款之后皮肤稳定下来了。"},images:[],video:null},
    {id:"AGE1m1XZ",rating:5,skinType:{ko:"중성","zh-CN":"中性"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"중성/예민한 편, 전반적 만족도 높은 종합 후기","zh-CN":"中性/偏敏感，整体满意度很高的综合测评"},date:"2026-06-18",
      quote:{ko:"평소 피부가 예민한 편이라 클렌저를 바꿀 때마다 걱정이 많은데, 노마디아 버블 클렌저는 만족도가 높았어요 😊\n\n처음 사용했을 때 가장 마음에 들었던 점은 거품이 정말 촘촘하고 부드럽고 쫀쫀한 점이었어요! \n손에서 거품을 낼 때도 풍성하게 올라오고, \n얼굴에 닿는 느낌도 자극적이지 않아서 편안하게 세안할 수 있었습니다.\n\n특히 세안할 때 피부를 세게 문지르지 않아도 노폐물이 깔끔하게 제거되는 느낌이 들어 좋았어요. \n평소 선크림을 매일 바르고 가벼운 메이크업도 자주 하는 편인데, 잔여감 없이 산뜻하게 씻기는 점이 만족스러웠습니다. \n그렇다고 해서 세정력이 강한 제품들처럼 세안 후 얼굴이 뻣뻣해지거나 건조해지는 느낌은 거의 없었어요. \n호호바 오일이 함유되어 있어서 그런지 세안 후에도 피부가 한결 촉촉하고 편안한 느낌이 남더라고요 ✨\n\n향도 부담스럽지 않아서 좋았습니다\n인위적으로 강한 향을 싫어하는 편인데 은은한 사용감이라 매일 사용하기에 무리가 없었어요. \n아침 세안용으로도 괜찮고, 저녁에 하루 종일 쌓인 피지와 노폐물을 씻어낼 때도 만족스러웠습니다. \n사용 후 피부가 당기지 않아서 기초 제품을 바를 때도 훨씬 편안했어요👍\n\n며칠 동안 꾸준히 사용해 보니 피부 컨디션도 안정적으로 유지되는 느낌이 들었고, 세안 후 피부결이 조금 더 매끈하게 느껴졌습니다 😊 과하게 자극적이지 않으면서도 깔끔한 세정력을 원하는 분들께 잘 맞을 것 같아요. \n\n건성, 복합성 피부는 물론이고 세안 후 당김 때문에 고민하시는 분들께도 추천드리고 싶습니다. \n\n전체적으로 세정력, 사용감, 촉촉함의 균형이 잘 잡힌 제품이라 만족스럽게 사용하고 있고 재구매 의사도 만땅!!!있습니다 👍💛","zh-CN":"我平时皮肤偏敏感，每次换洁面产品都很担心，但NOMADIA气泡洁面满意度很高😊\n\n第一次用最喜欢的是泡沫真的很细密柔软紧实！\n在手上打泡也能蓬松地冒出来，\n接触脸部的感觉也不刺激，能舒适地洁面。\n\n特别是洗脸时不用用力搓，就能感觉废物被干净地清除了。\n我平时每天都涂防晒，也经常化淡妆，能清爽洗净没有残留感这点很满意。\n但也不像清洁力强的产品那样，洗完脸僵硬或干燥。\n可能是含有荷荷巴油，洗后皮肤依然水润舒适✨\n\n香味也不重，这点很好\n我不喜欢人工浓香，这种淡淡的使用感每天用也没问题。\n当早晨洁面用也不错，晚上洗掉一天积累的皮脂和废物时也很满意。\n用完之后不紧绷，涂基础护肤品时也更舒适👍\n\n连续用了几天，皮肤状态感觉维持得很稳定，洗后皮肤纹理也感觉更细腻😊 想推荐给不想要过度刺激、又想要干净清洁力的人。\n\n干性、混合性肌肤，以及被洗后紧绷困扰的人都想推荐。\n\n整体来说是清洁力、使用感、水润感平衡得很好的产品，用得很满意，回购意愿也是满满的!!!👍💛"},images:[],video:null},
    {id:"Jve415oA",rating:4,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"40대 중반 속건조 심한 예민 피부, 각질 순하게 불려서 세정","zh-CN":"40多岁中年，内干严重的敏感肌，温和地泡软角质完成清洁"},date:"2026-06-18",
      quote:{ko:"본인:여자 40대중반\n피부:속건조 많이 심함, 예민한편이고  세수하자마자 땡기는 피부\n\n여태 수많은 클렌징 제품을 써봐왔고\n그 중에 정말 한,두개만 맘에 들 정도 \n피부에 잘 맞거나 안심하면서 편안하게 제품은 거의 없었어요\n\n골든호호바 버블클렌저는\n첨에 거품이 풍성하게 나오고 조밀해서 \n얼굴에 닿자마자 부드럽게 감싸는 느낌이 들었어요\n거품이 금방이 없어지는건 아닐까했는데\n물로 씻기전까지 거품이 살아있고\n자극없이 씻겨요\n\n다른 폼클렌저 쓸때는\n해면스펀지까지 쓰면서 각질을 빡빡 닦아냈다면\n골든호호바 버블클렌저는\n자극이 없는데 각질을 잘 불려서 씻겨주는거 같아요\n\n피부와 동안한 약산성인데다가\n무향료,무색소,무에탄올 자극적인거 없이 속당김심한피부,수분부족지성,약한피부에도 쓸수 있어요\n뽀득뽀득 안씻긴다고 해서 찝찝함도 없이 \n세안하자마자 얼굴땡김이 덜해서 저는 너무 만족했어요\n\n속건조를 어느정도 잡아주니 넘 좋네요","zh-CN":"本人：女性，40多岁中段\n皮肤：内干很严重，偏敏感，一洗完脸就紧绷\n\n用过无数清洁产品，\n真正合心意的也就那么一两款，\n对皮肤合适又能安心舒适使用的产品几乎没有。\n\n金色荷荷巴气泡洁面\n一开始泡沫蓬松细密，\n一碰到脸就有种被柔软包裹的感觉。\n本来担心泡沫会不会很快消掉，\n结果洗到用水冲之前泡沫都还在，\n而且无刺激地洗掉。\n\n用其他洁面泡沫时\n我甚至要用海绵使劲搓掉角质，\n金色荷荷巴气泡洁面\n没有刺激却能把角质泡软洗掉的感觉。\n\n和皮肤一样是弱酸性，\n又无香料、无色素、无乙醇，没有刺激性成分，内干严重的肌肤、水分不足的油性肌肤、脆弱肌肤都能用\n没有那种洗到吱吱响的感觉，也不觉得不清爽，\n洗完脸紧绷感明显减少，我真的很满意。\n\n能在一定程度上缓解内干，真的很喜欢"},images:[],video:null},
    {id:"ZN6Q3meZ",rating:4,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"수부지, 이중세안 부담 느끼던 피부 - 단일세안으로도 만족","zh-CN":"水油皮，曾觉得双重清洁有负担 - 单次清洁也很满意"},date:"2026-06-11",
      quote:{ko:"🫪 본인 피부타입: 수부지\n\n✅️ 땡김X\n이 클렌저 사용 후, 피부 땡김이라던가 속건조, 붉은기 같은 증상이 없었어요. 피부 만졌을 때도 뽀독뽀독한 느낌이 안들고 맨들맨들하더라고요. 촉촉한 마무리감이라 설명되어 있는데 맞는 것 같습니다~ 건성, 수부지가 사용하기에 아주 좋은 클렌저란 생각이 듭니다!\n\n✅️ 순하다\n화학 약품 많이 써서 뽀글거리는 거품이 아닌 느낌이 들어요. 다른 클렌저는 거품이 밀도 있어서 화학 약품 가득한 느낌인데, 노마디아 클렌저 거품은 금방 사그라지는 순수한 거품 느낌이에요. 사춘기나 자극적인 거 싫어하는 분들께 추천드려요!\n\n✅️ 무향\n순하다고 느낀 부분 중 하나가 더 있는데, 무향이라는 점! 진한 향 안 좋아하는 사람이라 마음에 들었습니다.\n\n✅️ 이중 세안 싫은 분들 추천\n저는 화장 안하고 선크림만 바르고 다니는 사람인데 클렌징오일을 자주 쓰면 피부 장벽이 무너진다는 말을 들어 고민했는데, 이 클렌저는 단일세안으로 꽤 깨끗해지는 것 같아요. 안에 피부 장벽보호 물질도 있어서 더 좋습니다","zh-CN":"🫪 本人肤质：水油皮\n\n✅️ 不紧绷\n用了这款洁面之后，没有出现紧绷、内干或泛红等症状。摸皮肤也不是那种吱吱响的感觉，而是滑滑的。产品说明说是水润收尾，感觉确实如此~干性、水油皮用这款洁面真的很合适！\n\n✅️ 温和\n不是那种加了很多化学成分、噼里啪啦的泡沫感。其他洁面产品泡沫密度大，感觉化学成分很浓，NOMADIA洁面的泡沫感觉是很快消散的纯净泡沫。推荐给青春期或不喜欢刺激感的人！\n\n✅️ 无香\n温和这一点还有一个体现，就是无香！我不喜欢浓香，这点很满意。\n\n✅️ 推荐给不喜欢二次清洁的人\n我平时不化妆只涂防晒，听说经常用卸妆油会让皮肤屏障崩溃，一直很纠结，这款洁面单次清洁就能洗得相当干净。里面还有护理皮肤屏障的成分，更好了"},images:[],video:null},
    {id:"JYNMr1jZ",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"수부지+여드름+모공, 폼클렌저에 뒤집어진 이력 - 수영 시작하며 재도전 성공","zh-CN":"水油皮+痘痘+毛孔，曾被泡沫洁面搞爆发 - 开始游泳后重新挑战成功"},date:"2026-05-21",
      quote:{ko:"21호 수부지, 민감성, 모공o, 여드름o\n\n* 평소 폼클렌징 사용하면 피부가 뒤집어진 경험이 많아서 클렌징오일+피부과 처방 비누로만 세안\n\n최근에 수영을 시작하면서 수영장 샤워실에서 오일세안하기 번거로워서 신청해봤습니다. 원래 폼클렌징 사용을 꺼려서 걱정하면서 사용해봤는데 화장도 잘 지워지고(썬크림+쿠션+파우더, 눈화장x) 세안 직후 당기는 것도 없이 너무 만족하며 사용중입니다! 폼도 잘 나오고 폼 형태도 잘 유지됩니다. 가장 중요한 부분 🤘민감성 피부인 제게도 자극 없이 필요한 세정만 해줍니다🤘\n요약하자면 노폐물 제거 o, 세정력 o, 세정 후 수분감? o \n(호호바오일이라 그런지 몰라도 문지를때 오일리한 것 같기도 하고.. 느낌..?)\n자극감x, 잔여감x (클렌징 오일이 아니니 미끈하게 남거나 하는건 없습니다. 근데 세정후 피부가 매끈해보이긴 합니다)\n\n홍보문구에 급속진정이라고 있는데 요즘 덥지도 않고 진정시킬만한 요소가 없어서 그건 잘 모르겠습니다.","zh-CN":"21号色号，水油皮，敏感性，有毛孔，有痘痘\n\n* 平时用泡沫洁面经常爆发，所以一直只用卸妆油+皮肤科处方皂洗脸\n\n最近开始游泳，在泳池更衣室里用油类洁面很麻烦，就申请试用了这款。本来抗拒泡沫洁面，怀着担心用了一下，结果妆容能卸干净（防晒+气垫+散粉，没化眼妆），洗后也不紧绷，用得很满意！泡沫也出得很顺，形态也维持得好。最重要的一点🤘对我这种敏感肌也没有刺激，只做必要的清洁🤘\n总结一下：去污效果o，清洁力o，清洁后水润感？o\n（可能是荷荷巴油的缘故，打圈时感觉有点油润的感觉..?）\n无刺激x，无残留感x（不是卸妆油所以不会留下滑腻感，但洗后皮肤看起来确实很光滑）\n\n宣传语里写着'速效舒缓'，最近天气也不热没什么需要舒缓的情况，所以这点我还不太清楚。"},images:[],video:null},
    {id:"ZjKnO3Oq",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"임신 후 민감성+건성, 안전성분 확인 후 데일리 사용","zh-CN":"孕期敏感性+干皮，确认安全成分后日常使用"},date:"2026-06-18",
      quote:{ko:"피부타입 : 임신 후 민감성 & 건성\n\n임신하고 나서는 성분에 예민해져서 모든 화장품을 항상 AI에 물어보고 사용하는 편이에요 \n이 제품은 순한 성분이라고 전면에 내세운 만큼 찾아보니 역시나 임산부한테 안전한 성분들이라 안심하고 사용할 수 있었습니다.\n\n향은 무향이라고 나와 있긴 하지만 임신해서 코가 예민해져서 그런지 저는 약간 특유의 화학 향? 같은 게 살짝 느껴지긴 했어요! 그래도 사용할 때 거부감이 있거나 신경 쓰일 정도는 전혀 아니었습니다.\n\n사용할 때 제품이 잘 섞이게 몇 번 흔들어서 한 펌프 반 정도 짜면 거품이 풍성하게 나와서 클렌징하기 편하더라고요. \n사실 가끔 귀찮아서 안 흔들고 그냥 바로 짜서 쓸 때도 있는데 안 흔들어도 거품은 충분히 잘 나옵니다.\n\n기존에 쓰던 폼클렌징들은 세안 후에 살짝 건조함이나 당김이 있었는데 이 제품은 사용 후에도 건조함이 전혀 없어서 만족스러웠어요!\n\n같이 올린 사진은 평소에 일반 선크림(메베x)바르고 다니다가 이 클렌저로 지운 후의 모습이고 성분이 워낙 순하다고 해서 세정력이 강하지 않을거라 생각했는데\n생각 외로 깔끔하고 말끔하게 잘 지워지더라고요!\n 임신하고 피부가 건조하고 민감해졌는데 데일리로 아주 잘 쓰고 있습니다.\n\n임산부들&민감성 피부이신 분들한테 강추합니다!🫶🏻","zh-CN":"肤质：孕期敏感性&干性\n\n怀孕之后对成分变得很敏感，用任何化妆品之前都会先问AI \n这款产品主打成分温和，查了之后果然是对孕妇安全的成分，用起来很放心。\n\n虽然标注无香，但可能是怀孕后鼻子变敏感，我确实感觉到一点点特有的化学味道？不过用的时候完全不会让人反感或在意。\n\n使用时先摇匀混合，按压一泵半左右就能出蓬松的泡沫，洁面很方便。\n有时候懒得摇直接按压用，不摇也能出足够的泡沫。\n\n之前用的泡沫洁面洗完脸都会有点干燥紧绷，这款用完完全没有干燥感，很满意！\n\n附的照片是平时涂普通防晒（非物理防晒）之后用这款卸掉的样子，本来以为成分这么温和清洁力应该不强，\n结果意外地干净利落地卸掉了！\n怀孕之后皮肤变干燥敏感，这款当日常用真的很合适。\n\n强烈推荐给孕妇和敏感肌的朋友们！🫶🏻"},images:[],video:null},
    {id:"ZOze8WDJ",rating:5,skinType:{ko:"복합성","zh-CN":"混合皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"복합성/민감, 시술 후 예민해진 피부에도 적합","zh-CN":"混合肌/敏感，适合治疗后变敏感的皮肤"},date:"2026-06-18",
      quote:{ko:"평소 자극이 없고 당김이 없는 \n순한 클렌징 제품을 선호하고 있어요. \n아침, 저녁으로 클렌징 제품을 사용하다보니, \n기초 화장의 시작은 클렌징이라고 생각하고 신경쓰며 사용중이에요. 클렌징 제품의 성분도 꼼꼼하게 보고 사용하고 있답니다.\n\n< 패키지 >\n박스케이스에 본품이 들어있고, 플라스틱 재질의 거품 용기에요. \n옐로우 컬러지만, 내용물이 살짝살짝 비춰서 \n사용하기 편리할듯해요.\n\n< 향 >\n향은 거의 느끼지 못하여 무향으로 느꼈어요.\n\n< 색상 , 제형 >\n사용 전 용기를 흔들고 펌핑하면 \n화이트 컬러의 풍성한 거품이 나와요.\n힘없이 꺼지는 거품이 아니라 거품 유지력도 좋아요.\n\n< 사용감 >\n거품을 피부에 올려서 롤링을 하면,\n피부 가득 쫀쫀 조밀한 거품형태로 바뀌어서 피부에 착붙되어요.\n모공에 노폐물들을 잘 제거해줄듯한 느낌이에요.\n약산성 제품이지만 세안후 미끌거림이 없고 산뜻해요.\n호호바 오일 성분 때문인지 세안 후에도 당김이 없어서 \n피부가 편안하네요.\n\n< 효과 >\n모공을 막지 않는 호호바 오일 성분으로 \n노폐물은 깨끗하게 없애주고 피부가 건조하지 않도록 \n세안 후 피부를 보호해주는 느낌이에요. \n판테놀, 세라마이드 성분으로 피부 장벽을 지켜줘서\n클렌징 후에도 자극이 없어요. \n피부 타입 가리지 않고 모든 피부에 너무 잘 맞을거 같아요. \n특히 피부과 시술 등으로 예민해진 피부에도 잘 맞을듯해요. \n다만 워터프루프 제품을 클렌징 할때는 물리적 힘이 필요했어서, \n1차 클렌징 후 2차 마무리 클렌징 용도로 사용하는 것이 좋을것 같아요.\n저같은 경우 자극없는 아침 세안용으로 잘 사용하고 있어요.","zh-CN":"我平时偏好无刺激、不紧绷的温和清洁产品。\n早晚都要用洁面产品，觉得基础护肤的第一步就是清洁，一直很用心对待。也会仔细看清洁产品的成分。\n\n< 包装 >\n盒装里装着本体，是塑料材质的泡沫瓶。\n是黄色的，但内容物隐约能看到，感觉使用起来会很方便。\n\n< 香味 >\n几乎感觉不到香味，是无香的。\n\n< 颜色、质地 >\n使用前摇匀再按压，\n会出白色蓬松的泡沫。\n泡沫不会一下子就消，维持力也不错。\n\n< 使用感 >\n把泡沫放在脸上打圈，\n会变成紧实细密的泡沫贴合在皮肤上。\n感觉能很好地清除毛孔里的废物。\n虽是弱酸性产品，但洗后不滑腻，很清爽。\n可能是荷荷巴油成分的关系，洗后也不紧绷，\n皮肤很舒适。\n\n< 效果 >\n不堵塞毛孔的荷荷巴油成分，\n能干净去除废物，同时保护皮肤不干燥，\n洗后有种被保护的感觉。\n泛醇、神经酰胺成分守护皮肤屏障，\n洗完之后也没有刺激。\n感觉不挑肤质，什么皮肤都很适合。\n特别是做完皮肤科治疗变敏感的皮肤应该也很合适。\n不过卸防水产品的时候需要一点物理力度，\n建议当一次清洁后的二次收尾清洁使用比较好。\n我个人是当无刺激的早晨洁面产品用。"},images:[],video:null},
    {id:"Zm2n45nq",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"아토피 피부, 순하면서 피지·각질 케어까지","zh-CN":"特应性皮炎肌肤，温和的同时兼顾皮脂·角质护理"},date:"2026-06-18",
      quote:{ko:"저는 아토피가 있는 피부라서 무조건 순한 제품을 써야하는데, 너무 순하기만한 제품을 사용하기엔 또 피지도 많고, 각질도 많아서 어느정도 각질제거를 해줄수 있거나 피지를 녹이거나 잠재워줄 수 있는 제품을 원하는 편이에요. \n근데 그런 기능이 있는 클렌징을 사용하다보면 점점 피부에 자극이 되는게 느껴지긴 하거든요ㅠㅠ \n그러던 차에 호호바 클렌저를 사용하고 나서는 요제품만 사용중입니다 \n호호바오일이 피부를 편하게 해주고 좋다는 건 알고있었는데,  버블제형으로 사용하니까 더 좋은것 같아요. \n\n제일 좋았던건 전혀피부에 부담이 없어서 아침세안으로도 너무너무 좋았어요!!\n그리고 피지를 완벽하게 녹여주지는 않지만 잠재워지는 느낌이 들어요. \n이중으로 층이 나뉘어 있어서 흔들어서 사용해야하는데, 흔들고나면 액체형 크림같이 변해요. 그걸 또 버블제형으로 세안하다보면 어? 세안이 되고잇는건가? 싶을정도로 피부가 편해요 \n그리고 세안후에는 뽀득거리거나 미끄덩거리지 않아요. \n속건조함 안느껴지고 마치 내가 건강한 중성피부라고 착각하게 만듦ㅋㅋㅋㅋㅋ\n 단독으로 메이크업을 세정하기는 좀 어렵지만, 2차세안이나 아침세안용으로 너무너무 추천합니당","zh-CN":"我有特应性皮炎，必须只用温和的产品，但如果太温和又会因为皮脂多、角质多而不够用，我更想要能在一定程度上去角质、溶解或抑制皮脂的产品。\n但用有这种功能的洁面产品，又渐渐感觉皮肤开始被刺激ㅠㅠ\n用了荷荷巴洁面之后就一直只用这一款了\n本来就知道荷荷巴油让皮肤舒适、对皮肤好，做成气泡质地感觉更好了。\n\n最喜欢的是完全没有皮肤负担，当早晨洁面用也非常非常好!!\n而且虽然不能完全溶解皮脂，但感觉能把它压制住。\n是双层分离的，需要摇匀之后再用，摇匀后会变成液态霜一样的质地。用气泡形式洁面时，会觉得咦？这样真的在清洁吗？皮肤却很舒服\n洗完之后也不会吱吱响或滑腻。\n完全感觉不到内干，甚至会让人误以为自己是健康的中性皮肤哈哈哈哈哈\n单独用来卸妆有点难，但当二次清洁或早晨洁面用真的非常推荐"},images:[],video:null},
    {id:"A2N61vxA",rating:5,skinType:{ko:"지성","zh-CN":"油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"30대 수부지, 나이들며 예민해진 장벽 고민 해결","zh-CN":"30多岁水油皮，解决了随年龄增长变敏感的屏障困扰"},date:"2026-06-18",
      quote:{ko:"30대 여성/수부지 \n\n️ ☀️제형\n펌핑하면 처음부터 풍성한 미세 버블이 나오는 타입이에요. 따로 거품을 낼 필요가 없어서 바쁜 아침에도 간편하게 사용할 수 있었어요! 거품은 무스처럼 부드럽고 촘촘한 편이라 피부에 닿았을 때 자극이나 마찰감이 거의 느껴지지 않았어요. 호호바 성분이 함유되어 있어서인지 단순히 가벼운 거품이 아니라 촉촉함도 함께 느껴지는 제형이었어요.\n\n☀️ 사용감\n30대가 넘어갈수록 장벽,건조함에 엄청 예민해지더라구요! \n세안하는 동안 피부가 편안하다는 느낌이 가장 먼저 들었어요. 세안 후에도 얼굴이 땅기거나 건조하게 조여오는 느낌이 적었고, 피부 수분은 어느 정도 남겨두면서 유분감만 깔끔하게 정리해주는 느낌이었어요. 특히 수부지 피부 특유의 속건조가 심한 날에도 부담 없이 사용할 수 있었어요.\n\n☀️ 세정력\n가벼운 선크림이나 일상적인 노폐물 제거에는 충분히 만족스러웠어요. 다만 진한 메이크업까지 한 번에 지우기에는 세정력이 강한 편은 아니라서, 저녁에는 클렌징밀크나 워터로 1차 클렌징 후 사용하는 것이 더 좋겠다고 느꼈어요. 피부를 과하게 벗겨내는 느낌 없이 순하게 세정되는 제품이에요.\n\n☀️ 수부지 피부 기준 장단점\n장점은 세안 후에도 촉촉함이 남아 있다는 점이에요. 유분은 적당히 정돈해주면서 피부가 건조해지지 않아 수부지 피부와 잘 맞는다고 느꼈어요. 반면 개운하고 뽀드득한 마무리를 선호하는 분들에게는 다소 순하게 느껴질 수 있을 것 같아요.\n\n☀️ 총평\n수부지 30대 피부 기준으로 사용했을 때, 자극 없이 편안하게 사용할 수 있는 데일리 클렌저였어요. 세안 후 당김이 적고 피부 컨디션이 예민한 날에도 부담 없이 사용할 수 있어서 만족스러웠어요. 강한 세정력보다는 피부 밸런스를 편안하게 유지하는 데 초점이 맞춰진 제품이라는 생각이 들었고, 아침 세안용이나 피부가 민감해진 시기에 특히 손이 자주 갈 것 같아요☺️","zh-CN":"30多岁女性/水油皮 \n\n️ ☀️质地\n是那种一按压就出蓬松细密泡沫的类型。不用另外打泡，忙碌的早晨也能方便使用！泡沫像慕斯一样柔软紧实，接触皮肤时几乎感觉不到刺激或摩擦感。可能是含荷荷巴成分，不只是轻盈的泡沫，还能同时感受到水润感。\n\n☀️ 使用感\n过了30岁之后，对屏障、干燥变得非常敏感！\n洗脸的过程中最先感觉到的是皮肤很舒适。洗后脸也不太会紧绷或干燥收紧，感觉能保留一定水分同时干净整理油分。特别是水油皮特有的内干严重的日子用也没有负担。\n\n☀️ 清洁力\n卸除轻度防晒或日常废物完全令人满意。不过一次卸浓妆的话清洁力不算特别强，晚上建议先用洁面乳或卸妆水做一次清洁再用这款。是那种不会过度剥除皮肤、温和清洁的产品。\n\n☀️ 水油皮角度的优缺点\n优点是洗后依然留有水润感。能适度整理油分又不会让皮肤干燥，感觉很适合水油皮。反过来，喜欢清爽吱吱响收尾感的人可能会觉得有点太温和。\n\n☀️ 总评\n以水油皮30多岁肤质使用下来，是一款能无刺激舒适使用的日常洁面产品。洗后紧绷少，皮肤敏感的日子用也没有负担，很满意。感觉这款产品的重点不在于强力清洁，而在于舒适维持皮肤平衡，当早晨洁面或皮肤敏感时期特别会常用☺️"},images:[],video:null},

      quote:{ko:"사용기간\n6윌12일~6월16일 (5일사용)\n\n피부타입 \n코랑 이마 지성 / 볼 건성 / 민감성\n평소 피부가 민감해서 피부가 잘 뒤집어져서 트러블이 쉽게 올라오는 타입이지만 최근에 트러블 올라옴 없이 피부 좋아보인다는 소리를 들은 커디션 좋은 피부상태\n\n거품이 밀도가 높아보이고 쫀쫀하고 미세한 거품이어서\n부드럽게 얼굴에 올라간다 \n오일이 약간 들어 있기때문에 쓰기전 잘 흔들어서 사용해야 하고 씻고나서 피부 당김은 없지만 보송하거나 개운한 느낌을 좋아하는 사람들에게는 조금 아쉬울 수 있다 \n그래도 오일성분이 들어간 클렌징 중에 세안후 미끌거림은 거의 없는 편이라 좋았다","zh-CN":"使用时间\n6月12日~6月16日（用了5天）\n\n肤质\n鼻子和额头偏油/脸颊干/敏感性\n平时皮肤敏感，容易爆发长痘，但最近没长痘，还被夸皮肤状态好\n\n泡沫密度看起来很高，紧实细腻，\n能柔软地涂在脸上\n因为含有一点油分，用之前一定要摇匀，洗后不紧绷，但喜欢干爽清爽感的人可能会觉得稍有欠缺\n不过在含油的洁面产品里，这款洗后几乎没有滑腻感，这点很喜欢"},images:[],video:null},
    {id:"ZlyE3loq",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"건성, 세안 후 당김 적고 트러블 없이 2주 사용","zh-CN":"干皮，洗后紧绷少，无刺激地用了两周"},date:"2026-05-27",
      quote:{ko:"평소 피부가 건조한 편이라 클렌저를 고를 때 세정력도 중요하지만 세안 후 당김이 적은 제품을 선호하는데요. 이번에 노마디아 골든 호호바 10% 듀얼 마이크로 버블 클렌저를 체험해볼 기회가 생겨 사용해봤어요. 처음 사용했을 때 가장 인상적이었던 점은 미세하고 촘촘한 버블이었어요. 별도로 거품을 낼 필요 없이 풍성한 거품이 바로 나와서 편했습니다. 피부에 문지를 때 자극이 크지 않았고 부드럽게 롤링되는 느낌이 들었어요. 평소 건성이라 세안 후 얼굴이 금방 당기는 제품은 잘 못 쓰는데, 이 제품은 세안 후에도 피부가 땅기거나 건조해지는 느낌이 비교적 적었습니다. 그렇다고 미끈거리는 잔여감이 남는 것도 아니라서 깔끔하게 마무리되는 점이 마음에 들었어요. 약 2주 정도 사용하면서 아침, 저녁 세안에 활용했는데 피부가 예민하게 반응하거나 트러블이 생기지는 않았습니다. 은은한 향도 부담스럽지 않아 무난하게 사용하기 좋았어요. 전체적으로 세안은 깔끔하게 되면서도 건조함은 덜한 편이라 건성이나 세안 후 당김이 신경 쓰이는 분들이 사용해보기 괜찮은 클렌저라고 생각합니다. 사용하기 편한 버블 타입이라 너무 좋아요!","zh-CN":"我平时皮肤偏干，挑洁面产品时清洁力固然重要，但更偏好洗后不紧绷的产品。这次有机会试用了NOMADIA金色荷荷巴10%双重微气泡洁面。第一次用最有印象的是细腻紧实的气泡。不用另外打泡，蓬松的泡沫直接就出来了，很方便。打圈按摩时刺激不大，感觉能柔软地打圈。我平时是干皮，很多产品洗完脸很快就紧绷，用不了，这款洗后紧绷或干燥的感觉相对较少。但也不会留下滑腻的残留感，能干净收尾，这点很喜欢。用了大概两周，早晚洁面都用了，皮肤没有出现敏感反应或长痘。淡雅的香味也没有负担，用起来很舒适。整体来说清洁很干净，同时干燥感较少，对干皮或在意洗后紧绷的人来说是值得一试的洁面产品。是好用的气泡类型，非常喜欢！"},images:[],video:null},
    {id:"qg2Ml8pZ",rating:5,skinType:{ko:"복합성","zh-CN":"混合皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"홍조 있는 복합성, 사용 후 홍조 개선 체감","zh-CN":"泛红混合肌，使用后感受到泛红改善"},date:"2026-05-30",
      quote:{ko:"😄 피부타입 😄 홍조가 있는 복합성 피부 피부장벽과 수분도는 정상수치\n\n💧 제형 💧\n제품 이름처럼 버블 클렌저라 거품이 풍성하게 생겨요. 일반 폼클렌징은 손바닥으로 문지르거나 거품기에 넣어야 부드러운 거품이 만들어져서 번거로운데 버블 클렌저는 한번에 바로 세안할 수 있어서 편하네요. 놀라운 건 계면활성제가 안 들어갔는데도 거품이 풍성하다는 점이었어요. 성분 생각해서 폼클렌저를 사용할 때 거품이 없으면 아무래도 사용할 때 아쉬움이 느껴지곤 했었거든요. 그런데 골든 호호바 클렌저는 성분도 착한데 거품도 풍성해서 이 점이 만족스러웠어요.\n\n🤗 사용감 🤗\n거품이 풍성해서 손으로 얼굴을 씻을 때 마찰감이 덜하게 느껴져서 좋았어요. 약산성이라 뽀득뽀득한 느낌은 없지만 미끄덩한 느낌도 없는 편이에요.\n\n✨️효과 ✨️\n골든 호호바에 성분을 보면 판테놀, 병풀추출물 등이 들어있는데 이게 다 피부장벽에 도움이 된다고 알고 있어요. 클렌징을 하면서도 피부장벽을 보호할 수 있어서 좋은 것 같아요. 특히 저는 홍조가 있는 피부인데 클렌징 후 홍조끼도 조금씩 개선되는 것을 확인할 수 있었어요.\n그리고 부드러운 거품을 바로 사용할 수 있어서 피부에 자극이 거의 없어서 좋았어요. 세안 후 피부에 수분감이 남아 촉촉해지네요.\n\n🧫 성분 🧫\n저는 화장품을 살 때 성분을 꼭 보거든요. 이 제품에는 20가지 주의성분이 없어서 안심하고 마음껏 사용할 수 있어서 좋네요.\n\n🤭 향 🤭\n향료가 인체에 해롭다는 걸 알아서 무향제품을 선호하는데 호호바 클렌저는 무향이라 좋았어요.","zh-CN":"😄 肤质😄 有泛红的混合性肌肤，皮肤屏障和水分值正常\n\n💧 质地 💧\n正如名字一样是气泡洁面，泡沫非常蓬松。一般洁面泡沫要用手掌搓或放进起泡网才能出细腻泡沫，比较麻烦，气泡洁面能一次直接洁面，很方便。让人惊讶的是没有添加表面活性剂却泡沫这么丰富。考虑成分选洁面泡沫时，泡沫少总会觉得有点遗憾，但金色荷荷巴洁面成分好、泡沫又丰富，这点很满意。\n\n🤗 使用感 🤗\n泡沫丰富，用手洗脸时摩擦感较少，很喜欢。是弱酸性，虽没有洗到吱吱响的感觉，但也不滑腻。\n\n✨️效果 ✨️\n金色荷荷巴的成分里有泛醇、积雪草提取物等，知道这些都对皮肤屏障有帮助。洁面的同时还能保护皮肤屏障，感觉很好。特别是我有泛红问题，洁面后能确认泛红一点点得到改善。\n而且能直接用柔软的泡沫，皮肤几乎没有刺激，这点很好。洗后皮肤留有水分，变得水润。\n\n🧫 成分 🧫\n我买化妆品一定会看成分。这款不含20种需要注意的成分，用起来很放心，能尽情使用。\n\n🤭 香味 🤭\n我知道香料对人体有害，所以偏好无香产品，荷荷巴洁面无香这点很好。"},images:[],video:null},
    {id:"qb2BDz6q",rating:5,skinType:{ko:"복합성","zh-CN":"混合皮"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"마스크 착용으로 인한 홍조·장벽손상+가려움 개선","zh-CN":"戴口罩导致的泛红·屏障受损+发痒得到改善"},date:"2026-05-24",
      quote:{ko:"폼클렌저를 다 썼을 때 마침 노마디아 호호바 오일 듀얼 마이크로 버블 클렌저로 꽉~찬 2주 사용하고 적는 후기 입니다:)\n\n*향: 무향입니다, 향에 민감하신 분들이 사용하시기에 좋습니다:)\n*제형: 버블 클랜저 답게 거품형입니다:) 쫀쫀 보다는 퐁신 퐁신한 느낌의 버블이고, 사용 전에 안에 오일층과 세안제 층이 따로 있기 때문에 흔들어서 사용해야 합니다:)\n*사용감: 폼클렌저를 사용할 떄 거품망을 꼭 사용하는 사람으로서 이런 버블형으로 된 제품을 굉장히 좋아합니다:)\n다만 버블 제형 중에서는 세정려깅 너무 강해서 세안 후에 얼굴이 쩍쩍 갈라지는 제품이 많아서 보통은 젤클렌저 혹은 약상성의 일반 반고체 제형의 폼클렌저를 사용했는데 노마디아 호호바 오일 버블 클렌저는 호호바 오일이 들어 있어서 그런지 세안 후에 얼굴 당김이 단 1도 없어서 애정하며 2주간 아낌 없이 밤 낮으로 사용할 수 있었습니다:)\n\n*후기 추가: 최근 몇주간 날씨는 건조한데 햇볕은 강한 날씨라 세안부터 얼굴에 화장품을 바르는 것까지 신경이 많이 쓰였습니다. 노마디아 호호바 오일 버블 클렌저를 사용한 덕분에 건조한 날씨에도 얼굴 당김 없이 편하게 세안 할 수 있었습니다:) 그리고 최근 마스크를 많이 쓰고 다니면서 홍조와 피부 장벽 무너짐이 자주 와서 고생했는데. 홍조 많이 줄어들었고 피부 가려움도 정말 많이 개선 되었습니다:)\n\n홍조와 피부 장벽 무너짐으로 고생중이신 분들이 있으시다면 꼭 사용해 보셨으면 좋겠습니다:) 저도 재구매해서 사용할 예정입니다:)\n\n제가 너무 자주 사용해서 그런지 벌써 반이나 사용해 버린 점... 이랄까요??:) 피부당김이 없어서 땀날 때마다 자주 사용했습니다:)","zh-CN":"洁面泡沫用完的时候刚好换上NOMADIA荷荷巴油双重微气泡洁面，整整用了两周，写下这篇测评:)\n\n*香味：无香，对香味敏感的人用起来很好:)\n*质地：不愧是气泡洁面，是泡沫型:)不是紧实型而是蓬松柔软的气泡感，使用前因为油层和洁面剂层是分开的，所以要摇匀之后再用:)\n*使用感：我是那种用洁面泡沫一定要用起泡网的人，特别喜欢这种气泡类型的产品:)\n不过气泡类产品中，很多清洁力太强以至于洗完脸后脸会裂开一样紧绷，所以我平时一般用凝胶洁面或弱酸性的一般半固态泡沫洁面，NOMADIA荷荷巴油气泡洁面可能是含荷荷巴油的缘故，洗后脸完全没有一点紧绷感，很喜欢，两周内早晚都毫不吝惜地用了:)\n\n*补充心得：最近几周天气干燥又阳光强烈，从洁面到涂抹护肤品都很费心。多亏用了NOMADIA荷荷巴油气泡洁面，就算天气干燥，脸也不紧绷，能舒适地洁面:)而且最近经常戴口罩，泛红和皮肤屏障崩溃经常发生让我很困扰。用了之后泛红明显减少了，皮肤发痒也真的改善了很多:)\n\n如果有正被泛红和皮肤屏障问题困扰的朋友，真心推荐试试:)我也打算回购继续用:)\n\n可能是我用得太频繁，已经用掉一半了……可以这么说吧？:)因为洗后不紧绷，只要出汗就会经常用。"},images:[],video:null},
    {id:"AwewmlwZ",rating:5,skinType:{ko:"복합성","zh-CN":"混合皮"},sensitivity:{ko:"일반 피부","zh-CN":"普通肌"},highlight:{ko:"수영·운동 후 일시적으로 약해진 피부장벽에 사용 추천 (영상 첨부)","zh-CN":"推荐用于游泳·运动后暂时变弱的皮肤屏障（附视频）"},date:"2026-06-13",
      quote:{ko:"세안 후에 당기지 않는 클렌저를 오래 찾고 있었어요. \n\n처음 받았을 때 용기가 생각보다 길어서 손으로 들고 짜기엔 좀 무거웠어요. 그래서 세면대에 올려두고 뚜껑만 눌러서 사용하고 있어요. 펌핑 방식이라 이게 오히려 편하더라고요. 두세 번만 눌러도 풍성한 거품이 바로 나와서 거품 만드는 시간도 따로 필요 없어요.\n\n가장 좋았던 건 세안 후 당김이 없다는 점이에요. 일반적인 폼 클렌저들은 깨끗하게 닦이는 대신 사용 후 피부가 빡빡한 느낌이 드는데, 이 제품은 그런 느낌이 거의 없어요. 세안 자체에서도 피부장벽을 생각한 처방이라는 브랜드 철학이 좋아서 시도해봤는데, 실제로 그 차이가 느껴져요.\n\n피부가 비교적 튼튼한 편이지만, 수영을 하거나 운동을 한 후에는 피부장벽이 일시적으로 약해지는 느낌이 들어요. 그럴 때 사용하면 특히 좋을 것 같아요. \n\n한 가지 제안하자면 — 본품 구매할 때 미니 사이즈를 함께 구매할 수 있으면 좋겠어요. 여행이나 휴가, 운동 가방에 챙기기 좋은 사이즈로요. 수영장이나 헬스장 락커에 두고 사용할 수 있게요.","zh-CN":"我一直在找洗后不紧绷的洁面产品。\n\n刚拿到的时候瓶身比想象中长，用手拿着挤感觉有点重。所以我把它放在洗手台上，只按压瓶盖使用。是按压式设计，这样反而更方便。只按两三下蓬松的泡沫立刻就出来了，不用另外花时间打泡。\n\n最喜欢的是洗后不紧绷这点。一般洁面泡沫虽然能洗得干净，但用完之后皮肤会有僵硬的感觉，这款几乎没有这种感觉。看到品牌理念是从洁面这一步就考虑皮肤屏障的配方，就试了一下，实际上确实能感受到差别。\n\n我皮肤算比较强健的，但游泳或运动之后会感觉皮肤屏障暂时变弱。那种时候用这款应该会特别合适。\n\n有一点建议——买正装的时候如果能一起买到迷你装就好了。适合旅行、休假或运动包携带的尺寸，可以放在泳池或健身房储物柜里用。"},images:[],video:null},
    {id:"JR7o1wzZ",rating:4,skinType:{ko:"지성","zh-CN":"油皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"지성, 건성·복합성 및 세안 후 건조함 고민에 추천","zh-CN":"油皮，推荐给干皮·混合肌及洗后干燥困扰的人"},date:"2026-06-11",
      quote:{ko:"평소 지성 피부라 세안 후 산뜻한 마무리감을 선호하는 편인데, 이번에 노마디아 골든 호호바 10% 듀얼 마이크로 버블 클렌저를 사용해볼 기회가 생겨 직접 사용해봤습니다.\n\n제품은 사용 전 가볍게 흔들어 내용물을 섞어준 뒤 펌핑하면 바로 풍성한 거품이 나오는 타입이에요. 별도로 거품을 낼 필요가 없어 바쁜 아침에도 간편하게 사용할 수 있었고, 거품 입자가 촘촘하고 부드러워 피부에 자극 없이 롤링하기 좋았습니다.\n\n호호바오일 10%와 판테놀, 세라마이드 NP, 베타인 등 보습 성분이 함유되어 있어서 그런지 세안 후에도 피부가 건조하거나 당기는 느낌은 거의 없었어요. 특히 평소 세안 후 바로 기초 제품을 바르지 않으면 피부가 땅기는 경우가 있었는데, 이 제품은 세안 직후에도 피부가 편안하게 유지되는 점이 인상적이었습니다.\n\n세정력도 무난한 편이었어요. 일상적인 노폐물이나 선크림 정도는 깔끔하게 세정되는 느낌이었고, 세안 후 피부가 과하게 건조해지지 않아 데일리 클렌저로 사용하기 좋았습니다.\n\n다만 개인적으로는 지성 피부라 그런지, 또는 보습 성분 때문인지 헹굴 때 약간의 보습막이 남아있는 듯한 사용감이 느껴졌어요. 피부가 촉촉하게 보호되는 느낌으로 받아들일 수도 있지만, 저처럼 뽀득하고 산뜻한 마무리감을 선호하는 분들은 처음 사용할 때 약간 잔여감처럼 느껴질 수도 있을 것 같습니다.\n\n전반적으로 세안 후 당김이 적고 부드러운 사용감을 가진 클렌저였으며, 건성·복합성 피부나 세안 후 건조함이 고민인 분들에게 특히 잘 맞을 것 같다는 생각이 들었습니다.\n\n✔ 좋았던 점\n\n● 풍성하고 부드러운 마이크로 버블 거품\n● 세안 후 당김이 적음\n● 사용이 간편한 펌프 타입\n● 자극 없이 부드러운 사용감","zh-CN":"我平时是油皮，偏好洗后清爽的收尾感，这次有机会亲自试用了NOMADIA金色荷荷巴10%双重微气泡洁面。\n\n产品是使用前轻轻摇匀混合内容物，按压后立刻出蓬松泡沫的类型。不用另外打泡，忙碌的早晨也能方便使用，泡沫颗粒细密柔软，无刺激地打圈很舒服。\n\n可能是含有10%荷荷巴油以及泛醇、神经酰胺NP、甜菜碱等保湿成分，洗后几乎不觉得干燥或紧绷。特别是我平时如果洗完不马上涂基础护肤品皮肤就会紧绷，但这款洗完之后皮肤依然保持舒适，这点印象深刻。\n\n清洁力也还不错。日常废物或防晒程度能干净清洁，洗后皮肤也不会过度干燥，当日常洁面产品很合适。\n\n不过个人感觉，可能是我是油皮，或者是保湿成分的关系，冲洗时感觉有一层淡淡的保湿膜残留。可以理解为皮肤被水润保护的感觉，但像我这样偏好清爽收尾感的人，第一次用可能会觉得有点像残留感。\n\n整体来说是洗后紧绷少、使用感柔和的洁面产品，感觉特别适合干性、混合性肌肤，或洗后干燥困扰的人。\n\n✔ 喜欢的地方\n\n● 蓬松柔软的微气泡\n● 洗后紧绷感少\n● 使用简便的泵头类型\n● 无刺激的柔和使用感"},images:[],video:null},
    {id:"Jk8nb5pZ",rating:5,skinType:{ko:"복합성","zh-CN":"混合皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"민감성 뾰루지 많은 피부, 촉촉하면서도 트러블 없음 강력 만족","zh-CN":"敏感性痘痘多发肌肤，水润又不长痘，非常满意"},date:"2026-06-18",
      quote:{ko:"이거 너어어무 좋아요 진짜 진심×100000\n\n❤️ 자극 없는 촉촉한 세정력\n호호바 오일 클렌징폼이라서 그런지 씻고나면 엄청 촉촉하고 피부가 편안한 느낌이에요..\n거품도 완전 몽글몽글 잘 나서 건성이신 분들은 완전 추천이고 지성분들도 세정력이 좋아서 피부 트러블 하나도 없이 사용할 수 있어요..\n(진짜 뜬금없지만 세수하다가 머리카락에 묻어서 같이 씻었는데 뻣뻣함 없이 매끄러워서 머리 감아봤는데 맨날 달고 살던 두피 트러블 다 없어져서..이거 샴푸로 대용량 만들어주면 좋겠어요..)\n\n❤️ 좋은 성분\n성분 자체가 좋아서 그런지 이거 쓰고 피부가 진짜 촉촉하고 차분해졌어요.. 민감성 피부라서 맨날 뾰루지 달고사는 저에게는 엄두도 못 냈던 촉촉한 폼클렌징인데 처음으로 촉촉한데도 좋다고 느꼈어요\n\n❤️ 사용하기 간편하고 청결\n흔들어서 누르기만 하면 거품이 몽글몽글 나오니까, 따로 손으로 거품 만들 필요가 없어서 엄청 편했고, 입구에 손이 잘 안 닿으니까 더 청결하게 사용할 수 있다고 생각합니다!!","zh-CN":"这个真的太好用了，真心×100000\n\n❤️ 无刺激的水润清洁力\n可能因为是荷荷巴油洁面泡沫，洗完之后皮肤超级水润舒适……\n泡沫也超级绵密，干皮的朋友们完全推荐，油皮用清洁力也不错，完全不长痘就能用……\n（虽然有点突兀，但洗脸的时候不小心弄到头发上一起洗了，结果头发不僵硬还很顺滑，就试着当洗发水用了一下，天天有的头皮问题全都消失了……真希望出个大容量当洗发水……）\n\n❤️ 好成分\n可能是成分本身就好，用完之后皮肤真的很水润平静……我是敏感肌，天天长痘痘，本来完全不敢想象水润的泡沫洁面，第一次觉得水润又好用\n\n❤️ 使用简便又干净\n摇一摇按一下泡沫就绵密地出来了，不用另外用手打泡，超级方便，而且手不用碰到出口，感觉能用得更干净!!"},images:[],video:null},
    {id:"A7wmjOPA",rating:5,skinType:{ko:"복합성","zh-CN":"混合皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"타 브랜드 폼클렌저 대비 - 장벽은 지키며 과피지만 제거되는 정돈감 (이미지 2장)","zh-CN":"对比其他品牌泡沫洁面 - 兼顾屏障保护和过多皮脂的清洁感（附2张图片）"},date:"2026-06-23",
      quote:{ko:"클렌징 밀크에 이어 버블 클렌저 후기도 남겨요! 저는 원래 다른 브랜드 포밍 클렌저를 쓰고 있어서 비교가 될 것 같아 써봤는데, 첫인상부터 달랐어요. 폼이 진짜 쫀쫀해요🫧 마이크로버블 이름답게 몇 초 지나도 안 꺼지고 손이랑 얼굴 위에서 탄성을 유지하더라고요. 덕분에 세안 중 마찰이나 자극이 확실히 덜했어요.\n\n가장 놀랐던 건 피부결 정돈효과였는데요, 쓰고 나면 묘하게 얼굴이 적당하게 뽀득해지는 느낌이 있어요. 속당김을 유발하는 뽀득함이 아니라, 피부 장벽은 지키면서 과한 피지만 제거해주는 그런 느낌이요. 민감성 피부한테 순하기만 한 게 아니라 좋은 스킨케어 한 것 같은 효과가 나서 진짜 감탄했어요ㅠㅠ\n\n무향 설계라 향에 예민해도 전혀 부담 없고, 디자인도 다른 더마 브랜드랑 달리 너무 예뻐서 욕실에 두기만 해도 인테리어 소품 같아요. 집에 놀러 오신 분들이 이게 뭐냐고 많이 물어보시더라고요ㅎㅎ 유일하게 아쉬운 점은 좋아서 헤프게 쓰게 된다는 것..! 대용량과 사우나 / 여행용 미니 사이즈 빨리 출시해주세요🙏","zh-CN":"洁面乳之后再写一下气泡洁面的测评！我本来用的是其他品牌的起泡洁面，正好可以对比一下，一试就发现第一印象完全不同。泡沫真的很紧实🫧不愧是叫双重微气泡，过了几秒也不消，在手上和脸上都能保持弹性。多亏了这个，洁面时的摩擦和刺激明显更少。\n\n最让我惊讶的是皮肤纹理整理的效果，用完之后脸会有种奇妙的适度干净感。不是那种引起内干的干净感，而是保护皮肤屏障、只去除多余皮脂的那种感觉。对敏感肌来说不只是温和，还有种做了好的护肤的效果，真的让我很惊叹ㅠㅠ\n\n无香设计，对香味敏感的人也完全没有负担，设计也和其他药妆品牌不一样，特别好看，光放在浴室里就像个装饰品。来家里玩的朋友们经常问这是什么ㅎㅎ唯一遗憾的一点是因为太喜欢会用得比较费……！求求快点出大容量和适合桑拿/旅行用的迷你装🙏"},images:["thumbnail/reviews/A7wmjOPA_1.webp"],video:null},
    {id:"qPgb7DmZ",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"건성+매일 메이크업, 1차 밀크+2차 버블 세안 후 개운함 (이미지 1장)","zh-CN":"干皮+每天化妆，一次洁面乳+二次气泡洁面后清爽（附1张图片）"},date:"2026-07-04",
      quote:{ko:"피부에 자극이 덜하면서도 말끔한 세정력을 가진 클렌징 제품을 찾는 분들께 추천드려요‼️\n\n저는 거의 매일 메이크업을 하는 편이라 외출 후 세안하는 과정을 정말 중요하게 생각하는데요…🥹 특히 세안 후 개운한 느낌이 들어야 만족스럽더라구요. 그래서 예전에는 세정력에만 보고 클렌징 제품을 선택했었는데 사용하다 보니… 세안 후 피부 속 당김이 심하거나 피부가 예민해지는 날도 종종 있더라구요…😭 저처럼 건성 피부에는 “세정력뿐만 아니라 보습과 진정에 도움이 되는 성분이 들어있는 제품”을 사용하는 게 좋겠다는 생각이 들었습니다!\n\n그러던 중 노마디아의 <골든 호호바 10% 듀얼 마이크로 버블 클렌저>를 사용해보게 되었는데요! \n저는 <블루 진정 판테놀 1% 클렌징 밀크>로 1차 세안을 한 후에, 이 제품으로 2차 세안을 해주고 있어요. 버블 제형이라 간편하게 사용할 수 있고, 세안하는 동안 피부에 자극이 적게 느껴져 더욱 편안하게 사용할 수 있었어요.☺️\n\n가장 만족스러웠던 점은 세안 후의 마무리감이었어요! 기존에 사용하던 버블 클렌징 제품은 세안 후에도 개운한 느낌이 조금 아쉬웠는데, 노마디아의 제품은 말끔하고 개운하게 세안됐다는 느낌이 가장 크게 들더라구요! 그렇다고 피부가 당기거나 건조한 느낌은 없었고, 촉촉함이 남아 있어 건성인 저도 부담 없이 사용할 수 있었습니다. 또 호호바씨 오일이 들어있어 그런지 사용감이 한결 부드럽게 느껴졌어요.🌿\n\n만족스럽게 사용한 노마디아의 버블 클렌저의 장점을 정리해보면,\n✔️ 자극은 덜하면서도 말끔하고 개운한 세안이 가능해요.\n✔️ 세안 후에도 피부가 건조하지 않아 속 당김이 적어요.\n✔️ 버블 제형이라 간편하게 사용할 수 있고, 예민한 피부도 부담 없이 사용할 수 있어요.","zh-CN":"想推荐给正在找刺激少又清洁干净的产品的人‼️\n\n我几乎每天都化妆，很重视外出回来之后的洁面过程…🥹特别是洗完脸要有清爽感才会满意。所以以前只看清洁力选清洁产品，结果用着用着…有时候洗后皮肤内干紧绷严重，或者皮肤变敏感…😭像我这种干皮，感觉应该用「不只清洁力好、还含有保湿舒缓成分」的产品比较好！\n\n后来用了NOMADIA的<金色荷荷巴10%双重微气泡洁面>！\n我先用<蓝色舒缓泛醇1%洁面乳>做一次清洁，再用这款做二次清洁。是气泡质地，用起来很方便，洁面过程中皮肤刺激感也少，用起来更舒适。☺️\n\n最满意的是洗后的收尾感！之前用的气泡洁面产品洗后清爽感总有点不够，但NOMADIA这款给我最大的感受就是干净清爽！但也不觉得紧绷或干燥，还留有水润感，我这种干皮用也没负担。含有荷荷巴籽油，使用感也更加柔和。🌿\n\n总结一下用得满意的NOMADIA气泡洁面的优点，\n✔️刺激少的同时能干净清爽地洁面。\n✔️洗后皮肤不干燥，内干紧绷少。\n✔️气泡质地使用方便，敏感肌也能没负担地使用。"},images:["thumbnail/reviews/qPgb7DmZ.webp"],video:null},
    {id:"qW45ojpA",rating:5,skinType:{ko:"수부지","zh-CN":"水油皮"},sensitivity:{ko:"-","zh-CN":"-"},highlight:{ko:"수부지+매일 메이크업, 눈 안따가운데 메이크업은 잘 지워짐 (이미지 1장)","zh-CN":"水油皮+每天化妆，不刺激眼睛但妆容卸得干净（附1张图片）"},date:"2026-07-06",
      quote:{ko:"저는 거의 매일 메이크업을 하기에 매일매일 클렌징 제품을 사용하는데요..! 그러다 보니 여러 종류의 클렌징 제품을 써봤지만 정착하지 못해 매번 다른 제품을 구입해서 사용하다가 우연히 노마디아 제품들을 접해서 사용해봤습니다😆\n\n“블루 진정 판테놀 1% 클렌징 밀크“ 와 함께 ”호호바 10% 듀얼 마이크로 버블 클렌저“를 사용했는데요, 다른 제품들은 세정력이 강하다 보니 세안을 하고 나오면 속당김이 심했는데 요 제품은 속당김이 적어 피부가 덜 예민해져서 상쾌하더라구요 😆\n눈에 들어가도 아프지 않을 만큼 순한데 메이크업은 너무 잘 지워져서 손이 많이 가는 제품이에요🤭\n\n✨골든 호호바 10% 듀얼 마이크로 버블 클렌저✨\n거품 타입이라 사용하기 정말 편하고 순한 제형이라 아침에 사용하기도 좋고!! 자극이 적어요\n\n크게 3가지 장점이 있는데요!!\n✔️순한 제형의 클렌징 제품이지만 메이크업 잔여물 없이 말끔하게 지워져요.\n✔️세안 후 속당김이 적어요.\n✔️아침에 사용하기에도 순해서 부담이 없어요.\n\n✨정말 순하고 자극이 최소화 되고 진정 효과까지 보고 싶으신 분들께 추천 드립니다✨","zh-CN":"我几乎每天都化妆，所以每天都要用清洁产品……！用过很多种清洁产品但一直没定妆，每次都买不同产品用，偶然接触到NOMADIA的产品试用了一下😆\n\n我搭配「蓝色舒缓泛醇1%洁面乳」和「荷荷巴10%双重微气泡洁面」一起用，其他产品清洁力太强，洗完脸内干紧绷严重，这款紧绷感少，皮肤没那么敏感，感觉很清爽😆\n就算进眼睛也不痛这么温和，但妆容却能卸得很干净，会经常用🤭\n\n✨金色荷荷巴10%双重微气泡洁面✨\n是泡沫类型，使用真的很方便，质地温和，早上用也不错!!刺激也少\n\n有三大优点!!\n✔️虽是温和质地的清洁产品，但妆容残留能干净卸除。\n✔️洗后紧绷感少。\n✔️早上用也很温和，没有负担。\n\n✨想要温和、刺激最小化又想要舒缓效果的朋友，推荐这款✨"},images:["thumbnail/reviews/qW45ojpA.webp"],video:null},
    {id:"Aa25n3QJ",rating:5,skinType:{ko:"건성","zh-CN":"干皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"건성/민감, 세정력·보습 두 마리 토끼 잡은 사연 (이미지 1장)","zh-CN":"干皮/敏感，同时抓住清洁力与保湿的经历（附1张图片）"},date:"2026-07-06",
      quote:{ko:"건성피부다 보니 세안 후 얼굴이 당기는 게 항상 신경 쓰였어요. 세정력 좋은 제품을 쓰면 꼭 그다음에 얼굴이 뻣뻣해지고, 순한 제품을 쓰면 화장이 덜 지워진 느낌이라 늘 갈등했는데, 두 가지를 한 번에 잡아준 제품이 골든 호호바 10% 듀얼 마이크로 버블클렌저였어요!🥰\n\n일반 클렌징 폼처럼 손으로 비벼서 거품을 만드는 과정이 없어요. 펌핑하자마자 이미 폭신한 거품 상태로 나와서 세안 시간이 훨씬 짧아지더라고요. 얼굴에 올려서 굴릴 때도 힘을 줄 필요 없이 사르르 퍼지고, 질감이 생크림처럼 폭신해서 문지르는 동안 자극이 전혀 느껴지지 않았어요. 헹굴 때도 뻑뻑하게 남지 않고 매끄럽게 씻겨나가서, 수건으로 닦기 전부터 얼굴이 유난히 부드럽다는 게 느껴졌습니다🥰\n\n건성피부는 세안하고 스킨케어를 바로 안 챙기면 금방 피부가 뻣뻣해지는데, 이 제품은 시간이 좀 지나도 그런 느낌이 안 왔어요. 호호바 오일 성분이 들어있어서인지 세안 직후에도 피부가 차분하게 가라앉아있는 느낌이었고, 붉어지거나 화끈거리는 자극도 없었습니다.\n\n이전에 쓰던 클렌징 폼은 자극도 있고 세정력도 애매했는데, 이 제품으로 바꾸면서 자극과 당김 둘 다 해결됐어요. 밀크와 버블을 같이 쓰면서 재구매를 고민할 필요가 없어졌습니다. 순하면서도 세정력까지 챙기고 싶은 건성·예민 피부라면 이 조합 추천드려요!👍🥰","zh-CN":"我是干皮，洗后脸紧绷一直让我很在意。用清洁力好的产品脸就会僵硬，用温和产品又感觉妆卸得不干净，一直很纠结，而金色荷荷巴10%双重微气泡洁面同时解决了这两个问题！🥰\n\n不需要像一般洁面泡沫那样用手搓出泡沫。一按压就已经是蓬松的泡沫状态，洁面时间缩短了很多。放在脸上打圈也不用用力就能顺滑抹开，质地像鲜奶油一样蓬松，打圈过程中完全感觉不到刺激。冲洗时也不会僵硬地残留，滑顺地洗掉，擦干之前就已经感觉脸格外柔软🥰\n\n干皮如果洗后不马上做后续护肤，皮肤很快就会僵硬，但这款过了一段时间也没有这种感觉。可能是含荷荷巴油成分，洗后皮肤感觉很平静，也没有泛红或灼热的刺激。\n\n之前用的洁面泡沫有刺激也有清洁力不够的问题，换成这款之后刺激和紧绷都解决了。洁面乳和气泡洁面一起用之后，就不用再纠结回购哪款了。想同时兼顾温和与清洁力的干性、敏感肌，推荐这个组合！👍🥰"},images:["thumbnail/reviews/Aa25n3QJ.webp"],video:null},
    {id:"ALNlXzrZ",rating:5,skinType:{ko:"복합성","zh-CN":"混合皮"},sensitivity:{ko:"민감 피부","zh-CN":"敏感肌"},highlight:{ko:"복합성/민감, 예민한 날에도 자극 없이 손이 가는 데일리 (영상+이미지 3장)","zh-CN":"混合肌/敏感，敏感的日子也能无刺激地常用（视频+3张图片）"},date:"2026-07-16",
      quote:{ko:"클렌징 제품은 별로 신경 안 쓰는 편인데, 요즘은 “자극 없는 게 최고다”라는 생각이 들더라구요...!\n그런 기준에서 봤을 때, 골든 호호바 10% 듀얼 마이크로 버블 클렌저는 꽤 만족스러운 제품이었어요!\n\n처음 썼을 때 느낀 건 “되게 편안하다”는 느낌이었어요.\n향이 거의 없는 편이라서 사용하면서 신경 쓰이는 부분이 없고, 오히려 피부에 집중하게 되는 느낌? 🙌 인위적인 향이 없으니까 더 순하게 느껴지더라고요!!\n\n버블 타입이라 거품이 굉장히 부드럽게 올라오는데, 이게 생각보다 중요한 포인트였어요.\n거품이 조밀하고 부드러워서 피부에 닿는 느낌 자체가 되게 순해요 ☁️ 세안할 때 문지른다는 느낌보다, 그냥 얹어서 굴려준다는 느낌이라 부담이 없었어요!\n\n그리고 사용하면서 계속 느꼈던 건 “이거 진짜 자극 없다”는 점.\n세안 후에 당김이 심하거나, 미세하게 따끔거리는 제품들도 많은데 이건 그런 게 거의 없었어요. 오히려 세안하고 나서 피부 컨디션이 차분하게 정돈되는 느낌이라서 민감한 날에도 손이 가더라고요 👍\n\n디자인도 은근 만족스러웠어요.\n패키지가 깔끔하면서도 컬러감이 예뻐서, 세면대에 두면 전체적으로 분위기가 정돈되는 느낌이에요 🧴✨ 이런 소소한 부분이지만 매일 쓰는 제품이라 더 중요하게 느껴졌어요.\n\n전체적으로 보면\n자극 없이 부드럽게 세안하고 싶은 날,\n피부 컨디션이 예민하게 올라온 날,\n괜히 아무거나 쓰기 싫을 때\n\n이럴 때 자연스럽게 손이 가는 클렌저였어요 🙂","zh-CN":"我平时不太在意洁面产品，但最近觉得「无刺激才是最好的」...！\n以这个标准来看，金色荷荷巴10%双重微气泡洁面是一款相当令人满意的产品！\n\n第一次用的感受是「真的很舒适」。\n几乎没有香味，用起来没什么需要在意的地方，反而更专注在皮肤上的感觉？🙌 没有人工香味，感觉更加温和!!\n\n是气泡类型，泡沫升起来非常柔软，这一点比想象中更重要。\n泡沫细密柔软，接触皮肤的感觉真的很温和 ☁️ 洗脸时不是搓的感觉，而是放上去打圈的感觉，没有负担！\n\n用的过程中一直感觉到的是「这个真的没有刺激」。\n很多产品洗后紧绷严重，或有轻微刺痛感，但这款几乎没有。反而洗完脸之后皮肤状态感觉被舒缓整理，敏感的日子也会想用👍\n\n设计也让人相当满意。\n包装简洁又配色好看，放在洗手台上整体氛围都变整洁了🧴✨ 虽是小细节，但因为是每天用的产品，感觉更重要。\n\n总的来说\n想无刺激柔和地洁面的日子，\n皮肤状态敏感的日子，\n不想随便用其他产品的时候\n\n这款是会自然而然伸手去拿的洁面产品 🙂"},images:[],video:"thumbnail/reviews/ALNlXzrZ.mp4"},

/* curated top-3 (proof carousel) vs. shuffled full list (bottom, all 50) — per product */
const BUBBLE_TOP_REVIEW_IDS=["A11oQOWA","qb2nRDaq","Z3mB7RKA"];
const MILK_TOP_REVIEW_IDS=["qQwWBzpJ","Zm2kR8Eq","Z04wvg4Z"];

function pickTopReviews(reviews,ids){
  return ids.map(id=>reviews.find(r=>r.id===id)).filter(Boolean);
}
function shuffledBottomReviews(reviews,excludeIds){
  const arr=[...reviews];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  let swapFrom=3;
  for(let k=0;k<3&&k<arr.length;k++){
    while(excludeIds.includes(arr[k].id)&&swapFrom<arr.length){
      [arr[k],arr[swapFrom]]=[arr[swapFrom],arr[k]];
      swapFrom++;
    }
  }
  return arr;
}

  </div></div>`;
}
function goAllReviews(ctx){

}

/* shared mentions block — review list with load-more (product-agnostic) */
const reviewListState={};
const reviewSourceByCtx={};
function reviewItemHtml(r){
  const stars=r.rating?`<span class="review-stars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</span>`:"";
  const skinType=r.skinType?L(r.skinType):"";
  const sensitivity=r.sensitivity?L(r.sensitivity):"";
  const metaParts=[skinType,sensitivity].filter(v=>v&&v!=="-").join(" · ");
  const meta=metaParts?`<span class="review-meta">${metaParts}</span>`:"";
  const topRow=(stars||meta)?`<div class="review-top-row">${stars}${meta}</div>`:"";
  const highlight=r.highlight?`<div class="review-highlight">${L(r.highlight)}</div>`:"";
  const displayName=r.nick||r.id;
  const who=displayName?`<span class="who">${maskName(displayName)}</span>`:"";
  const media=((r.images&&r.images.length)||r.video)?`<div class="review-media">
    ${r.video?`<video class="review-video" src="${r.video}" controls playsinline preload="metadata"></video>`:""}
    ${(r.images||[]).map(src=>`<img class="review-img" src="${src}" alt="review photo" loading="lazy">`).join("")}
  </div>`:"";
  const translated=(state.lang!=="ko"&&r.quote&&r.quote[state.lang])?`<div class="review-mt-note">${T("자동 번역되었습니다 — 뉘앙스가 원문과 다를 수 있습니다.","Auto-translated — nuance may differ from the original.")}</div>`:"";
  return `<div class="review-item">${topRow}${highlight}<div class="quote">${L(r.quote)}${who}</div>${translated}${media}</div>`;
}
function mentionsBlock(ctx,reviewsArr){
  reviewSourceByCtx[ctx]=reviewsArr;
  const visible=reviewListState[ctx]=reviewListState[ctx]||3;
  const items=reviewsArr.slice(0,visible);
  const hasMore=visible<reviewsArr.length;
  return `<div class="mentions">
    <div class="review-list" id="revlist-${ctx}">${items.map(reviewItemHtml).join("")}</div>
    ${hasMore?`<button class="load-more" id="loadmore-${ctx}" onclick="loadMoreReviews('${ctx}')">${T("더 보기","Load more")}</button>`:""}
  </div>`;
}
function loadMoreReviews(ctx){
  const arr=reviewSourceByCtx[ctx]||[];
  const cur=reviewListState[ctx]||3;
  const next=cur+3;
  const newItems=arr.slice(cur,next);
  $("revlist-"+ctx).insertAdjacentHTML("beforeend",newItems.map(reviewItemHtml).join(""));
  reviewListState[ctx]=next;
  if(next>=arr.length){
    const btn=$("loadmore-"+ctx);
    if(btn) btn.remove();
  }
}

function markScrollableReviewSlides(){
  document.querySelectorAll(".review-slide .review-item").forEach(el=>{

      el.classList.toggle("has-more", el.scrollHeight>el.clientHeight+2 && !atBottom);
    };
    update();
    el.onscroll=update;
  });
}
function initHeroGallery(){
  const g=$("heroGallery"); if(!g) return;
  const dots=[...$("heroDots").querySelectorAll(".hero-dot")];
  g.scrollLeft=0;
  const setActive=idx=>dots.forEach((d,i)=>d.classList.toggle("active",i===idx));
  setActive(0);
  g.onscroll=()=>{ setActive(Math.min(dots.length-1,Math.round(g.scrollLeft/g.clientWidth))); };
}
function scrollHeroTo(idx){
  const g=$("heroGallery"); if(!g) return;
  g.scrollTo({left:g.clientWidth*idx,behavior:"smooth"});
}

  const dotsWrap=$("reviewDots"); if(!dotsWrap) return;
  const dots=[...dotsWrap.querySelectorAll(".review-dot")];
  g.scrollLeft=0;
  const setActive=idx=>dots.forEach((d,i)=>d.classList.toggle("active",i===idx));
  setActive(0);
  g.onscroll=()=>{ setActive(Math.min(dots.length-1,Math.round(g.scrollLeft/g.clientWidth))); };
}
function scrollReviewTo(idx){
  const g=$("reviewGallery"); if(!g) return;
  g.scrollTo({left:g.clientWidth*idx,behavior:"smooth"});
}
function toggleInci(el){
  const box=$("fullInci");
  const open=box.classList.toggle("show");
  el.querySelector(".plus").textContent=open?"−":"+";
}
/* nav */
function updateGnbSolid(){
  const vp=document.querySelector(".viewport");
  $("gnb").classList.toggle("solid", vp.scrollTop>30);
}
function show(view){
  state.view=view;
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $(view).classList.add("active");
  $("gnb").style.display=view==="gate"?"none":"flex";
  $("btnBack").disabled=(view==="list");
  $("langLabel").textContent=LANGS.find(l=>l.code===state.lang).label;
  document.querySelector(".viewport").scrollTop=0;
  updateGnbSolid();
}
function pick(code){state.lang=code;renderGate();renderList();show("list");}
function goDetail(key){state.current=key;renderDetail();show("detail");}
function reset(){state.lang="ko";state.current=null;renderGate();show("gate");}

$("btnBack").onclick=()=>{ if(state.view==="detail")show("list"); };
$("btnHome").onclick=()=>$("homeNote").classList.add("show");
function closeNote(){$("homeNote").classList.remove("show");}
$("btnLang").onclick=()=>{
  $("sheetList").innerHTML=LANGS.map(l=>`<button class="gate-pill" onclick="pickSheet('${l.code}')"><span>${l.native}</span>${l.code===state.lang?checkIcon:''}</button>`).join("");
  $("langSheet").classList.add("show");
};
function pickSheet(code){state.lang=code;$("langSheet").classList.remove("show");renderGate();renderList();if(state.view==="detail")renderDetail();$("langLabel").textContent=LANGS.find(l=>l.code===code).label;}
$("langSheet").onclick=e=>{if(e.target.id==="langSheet")$("langSheet").classList.remove("show");};
$("homeNote").onclick=e=>{if(e.target.id==="homeNote")closeNote();};
document.querySelector(".viewport").addEventListener("scroll",updateGnbSolid);

renderGate();show("gate");
</script>
</body>
</html>
