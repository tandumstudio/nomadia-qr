o use oil and to use cleansing milk and low-irritant cleansers instead, this feels like exactly the right product for me. I used it every single day as soon as I got it and had zero breakouts, so I'd recommend it to others too.^^","zh-CN":"平时一直用Dewytree洁面乳！\n这次抽中了含泛醇成分的NOMADIA产品试用了一下。\n♡容量：和Dewytree的200ml一样，够用3-4个月！我现在用的是Dewytree的400ml，放在一起看这款显得有点小，但400ml的瓶子其实太大了，200ml刚刚好。\n♡浓度比Dewytree更浓稠厚重。Dewytree更像水一点。用更少的量就能有效卸干净。\n♡无香无刺激！我一直被脂溢性皮炎困扰，用了之后没长痘，测试期间右边鼻翼旁的小炎症也消失了。其他化妆品都没换，所以我觉得可能是这款洁面乳的功劳。打算再持续用一段时间，如果适合皮肤就会一直用下去。这点最让我满意。\n♡虽然是油皮，但因为化妆和油脂产生的角质能被很好地清除。BB霜或Dr.G橙色防晒都能卸干净，第二天也没有闷痘。用完洁面乳乳化之后，再用Illiyoon最温和款做二次清洁也完全够用。\n\n我一直被脂溢性皮炎困扰，去皮肤管理室他们也说不要用油类，要用洁面乳和低刺激洁面产品，感觉这款正好合适，拿到就每天用，完全没长痘，也推荐给其他人。^^","zh-TW":"我平常都在用Dewytree卸妝乳！\n這次抽中含泛醇成分的NOMADIA產品，試用看看。\n♡容量：和Dewytree的200ml一樣，是能用3-4個月的適當容量！我現在用Dewytree的400ml，放在旁邊比較看起來小一點，但400ml的瓶子其實太大了，200ml剛剛好。\n♡濃度比Dewytree更濃郁綿密。Dewytree比較偏水感。用比較少的量就能有效卸妝。\n♡無香無刺激！我一直被脂漏性皮膚炎困擾，沒有長痘痘，測試期間右邊鼻翼旁的小發炎都消失了。其他保養品都沒有換，所以我猜是這款卸妝乳的功勞。打算再持續用一陣子，如果真的適合就會繼續用下去。這點我最滿意。\n♡雖然是油性肌，但因為化妝和油脂造成的角質也很容易卸除。BB霜或Dr.G橘色防曬乳都能卸乾淨，隔天也不會浮粉。用卸妝乳乳化之後，再用日本Illiyoon最溫和的洗面產品，也能卸得很乾淨。\n\n我一直被脂漏性皮膚炎困擾，去皮膚管理中心也被建議不要用油類，要用卸妝乳和低刺激潔顏產品，感覺這款真的很適合我，一拿到就每天用，完全沒有肌膚困擾，也推薦給大家。^^",ja:"普段はデュイトリー(Duitri)のクレンジングミルクを使っています！\n今回パンテノール成分が入っているというNOMADIA製品が当たったので使ってみることになりました。\n♡容量：デュイトリー200mlと同じで3〜4ヶ月使うのにちょうど良い量でした！今はデュイトリー400を使っているので並べると少し小さく見えますが、400mlは容器が大きすぎる感じなので200がちょうど良いと思います。\n♡濃度がデュイトリーよりも濃厚でしっとりした感じでした。デュイトリーはもう少し水っぽい感じです。少ない量でも効果的に落とせます。\n♡無香無刺激！脂漏性皮膚炎で悩んでいますが、トラブルもなく、テスト期間中に右の鼻の横の小さな炎症が消えました。他のコスメは何も変えていないのでクレンジングミルクのおかげかなと思っています。もう少し継続して使ってみて肌に合えば使い続けようと思います。この部分が一番満足です。\n♡脂性肌ですが、メイクと油分による角質もよく落ちます。BBクリームやDr.Gのオレンジ色日焼け止めもよく落ちて、翌日肌荒れも起きませんでした。ミルクの後に乳化して、イリユン洗顔料の一番マイルドなものを使っても十分きれいに落ちます。\n\n脂漏性皮膚炎で悩んでいて、皮膚科やエステに行くとオイルは使わずクレンジングミルクと低刺激クレンザーを使うように言われるので、ぴったりの製品だと思います。受け取ってすぐ毎日使いましたがトラブルがなく、他の方にもおすすめします^^",th:"ปกติใช้คลีนซิ่งมิลค์ของ Dewytree อยู่ค่ะ!\nครั้งนี้ได้ลุ้นถูกรางวัลผลิตภัณฑ์ของโนมาเดียที่มีส่วนผสมแพนธีนอล เลยได้ลองใช้ค่ะ\n♡ปริมาณ: เท่ากับ Dewytree 200ml เป็นปริมาณที่พอดีสำหรับใช้ 3-4 เดือน! ตอนนี้ใช้ Dewytree 400 อยู่ วางเทียบกันแล้วดูเล็กกว่านิดหน่อย แต่ขนาด 400ml รู้สึกว่าขวดใหญ่เกินไป 200ml กำลังดีเลยค่ะ\n♡ความข้นเข้มข้นกว่า Dewytree และรู้สึกหนึบกว่า Dewytree ค่อนข้างเหลวกว่า ใช้ปริมาณน้อยกว่าก็ล้างเมคอัพออกได้อย่างมีประสิทธิภาพ\n♡ไม่มีกลิ่น ไม่ระคายเคือง! กำลังทรมานกับผิวหนังอักเสบจากต่อมไขมันอยู่ แต่ไม่มีสิวขึ้นเลย แถมช่วงทดลองใช้ จุดอักเสบเล็กๆ ข้างจมูกด้านขวาหายไปด้วย ไม่ได้เปลี่ยนเครื่องสำอางตัวอื่นเลย เลยคิดว่าอาจเป็นเพราะคลีนซิ่งมิลค์ตัวนี้ จะลองใช้ต่อเนื่องดูอีก ถ้าเข้ากับผิวดีจะใช้ต่อไปเรื่อยๆ ค่ะ จุดนี้พอใจที่สุดเลย\n♡เป็นผิวมันแต่ล้างขุยจากเมคอัพและความมันออกได้ดี บีบีครีมหรือครีมกันแดดสีส้มของ Dr.G ล้างออกได้ดี วันรุ่งขึ้นก็ไม่มีสิวขึ้น หลังทำอิมัลชันด้วยมิลค์แล้วล้างด้วยผลิตภัณฑ์ล้างหน้า Illiyoon สูตรอ่อนโยนที่สุดก็ล้างออกได้เกลี้ยงดีค่ะ\n\nกำลังทรมานกับผิวหนังอักเสบจากต่อมไขมันอยู่ แล้วถ้าไปคลินิกดูแลผิวเขาก็จะบอกไม่ให้ใช้ออยล์ ให้ใช้คลีนซิ่งมิลค์กับคลีนเซอร์ที่ระคายเคืองน้อยแทน เลยรู้สึกว่าเป็นผลิตภัณฑ์ที่เหมาะกับตัวเองมาก พอได้รับมาก็ใช้ทุกวันเลย ไม่มีสิวขึ้นเลย แนะนำให้คนอื่นด้วยค่ะ^^"},images:["thumbnail/reviews/milk/ZOzndwWJ_1.jpg","thumbnail/reviews/milk/ZOzndwWJ_2.jpg"],video:null},
    {id:"qQwWBzpJ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"오일 단독세안 후 '토마토 얼굴' 되던 극민감성 - 밀크로 전환한 서사 (영상+이미지 3장)",en:"Extremely sensitive skin that used to turn into a 'tomato face' after oil-only cleansing - the story of switching to milk (video + 3 photos)","zh-CN":"只用油单独清洁就会变'番茄脸'的极敏感肌 - 改用洁面乳的心路历程（视频+3张图片）","zh-TW":"單獨用卸妝油洗完就變「番茄臉」的極敏感肌 - 改用卸妝乳的心路歷程（含影片+附圖3張）",ja:"オイル単独洗顔後「トマト顔」になっていた極度の敏感肌 - ミルクへ切り替えたエピソード(動画+画像3枚)",th:"ผิวแพ้ง่ายมากที่หน้าแดงเหมือน 'มะเขือเทศ' หลังล้างด้วยออยล์อย่างเดียว - เรื่องราวการเปลี่ยนมาใช้มิลค์ (มีวิดีโอ+รูป 3 ภาพ)"},date:"2026-07-09",
      quote:{ko:"전 기존에 클렌징 오일과 폼으로 이중세안을 하다 피부장벽이 다 무너짐을 느끼고 오일로만 세안하고있는 완전 민감성 피부입니다ㅜㅠ \n근데 오일로만 하니 마지막에 좀 덜 닦인다는 느낌이 들더라구요.. 으쯔라는거냐 내 민감성 피부야.. \n\n그리고 오일로 롤링도 길게하니 세수끝난 직후에는 항상 토마토 얼굴..🍅🍅\n\n항상 인스타에서 클렌징밀크 추천만 듣다가 이번에 화해에서 추천템으로 봐서 도전해봤어요. 잠금장치도 있어서 여행갈때도 불안해하지않고 챙겨가기 좋아영\n\n약산성에 판테놀까지.. 완전 민감성인 나를 위한 제품이잖아요ㅜㅠ 그리고 저는 클렌징 제품에 이상한 냄새 나는것도 싫어하는데 마침 무향..? 이정도면 내가 만든거 아니냐구..ㅎㅎ\n\n2주넘게 사용해봤는데 제형이 쫀쫀한 클렌징밀크라 롤링할때도 부드럽고 헹궈냈을때도 자극이 없는것같아요. 증거는 세수직후 토마토로 변신하지않은 내 얼굴😭\n\n민감성 피부들한테 완전 추천드려요. 저는 버블클렌저까지 세트로 사서 사용중인데 완전.. 정착템 등극!!💕 망하지말구 평생 저한테 팔아주세요 젭알",en:"I used to do double cleansing with a cleansing oil and foam, but I felt my skin barrier completely collapse, so now I only cleanse with oil - I have completely sensitive skin ㅜㅠ\nBut cleansing with oil alone leaves me feeling like it's not quite fully cleansed at the end.. ugh, what am I supposed to do, my sensitive skin..\n\nAnd when I roll the oil in for a long time, right after washing my face it's always tomato face..🍅🍅\n\nI kept hearing recommendations for cleansing milk on Instagram, and this time I saw it as a recommended item on Hwahae, so I decided to try it. It also has a lock feature so I could pack it for travel without worrying.\n\nMildly acidic and with Panthenol too.. this is a product made for someone completely sensitive like me ㅜㅠ And I also hate cleansing products with weird smells, and this one happens to be fragrance-free..? At this point I might as well have made it myself, haha.\n\nI've used it for over 2 weeks now, and since it's a firm cleansing milk texture, it rolls on smoothly and there's no irritation even after rinsing. The proof is my face not turning into a tomato right after washing 😭\n\nI'd fully recommend this to people with sensitive skin. I bought the bubble cleanser as a set too and I'm using them together and it's totally become my go-to routine!! 💕 Please don't ever discontinue this, keep selling it to me forever please","zh-CN":"我之前一直用卸妆油和泡沫做双重清洁，感觉皮肤屏障整个都崩溃了，所以现在只用卸妆油清洁，是完完全全的敏感肌ㅜㅠ \n但只用油清洁总感觉最后卸得不够干净……到底要我怎么办啊，我的敏感肌…… \n\n而且用油打圈时间一长，洗完脸之后总是番茄脸……🍅🍅\n\n一直在Ins上看到大家推荐洁面乳，这次在化海App上看到这款是推荐款，就挑战了一下。还有锁扣设计，旅行带出去也不用担心漏出来，很好用~\n\n弱酸性又有泛醇……简直是为我这种完全敏感肌量身定做的产品ㅜㅠ 而且我很讨厌清洁产品有奇怪的味道，这款正好无香……这么合适简直像我自己做的一样哈哈\n\n用了两周多，质地是紧实的洁面乳，打圈时也很柔软，冲洗后也感觉没有刺激。证据就是洗完脸没有变成番茄脸😭\n\n非常推荐给敏感肌们。我还配套买了气泡洁面一起用，完全……成了长期回购款!!💕 千万别倒闭，请一直卖给我求你了","zh-TW":"我本來是卸妝油+洗面乳雙重洗臉，後來覺得皮膚屏障整個崩壞，改成只用卸妝油洗臉的完全敏感肌ㅜㅠ\n但只用卸妝油，總覺得最後卸得不夠乾淨……到底要我怎樣啦，我的敏感肌皮膚啊……\n\n而且用卸妝油打圈的時間也拉長，洗完臉之後永遠都是番茄臉……🍅🍅\n\n一直在IG上聽到大家推薦卸妝乳，這次剛好在化妝品成分分析App上看到推薦，就來挑戰看看。有鎖扣設計，旅行時也能安心帶著走~\n\n弱酸性又加泛醇……根本是為完全敏感肌的我量身打造的產品吧ㅜㅠ 而且我很討厭卸妝產品有奇怪的味道，這款剛好無香……這個程度根本是我自己做的吧……ㅎㅎ\n\n用了兩週多，質地是有黏稠度的卸妝乳，打圈時很柔順，沖洗掉之後也感覺不刺激。證據就是洗完臉之後我的臉沒有變成番茄😭\n\n超級推薦給敏感肌。我連氣泡潔顏乳都一起買了套組使用，完全……定番愛用品確定!!💕 千萬不要倒閉，請一輩子都賣給我拜託",ja:"私は以前クレンジングオイルとフォームでダブル洗顔をしていましたが、肌バリアが完全に崩れているのを感じてオイルだけで洗顔している完全な敏感肌です、涙\n でもオイルだけだと最後にちょっと落ちきってない感じがするんですよね…どうしろっていうの、私の敏感肌よ…\n\n それにオイルで長時間ローリングするので、洗顔直後はいつもトマト顔…🍅🍅\n\n いつもインスタでクレンジングミルクのおすすめばかり聞いていましたが、今回ファヘでおすすめアイテムとして見たので挑戦してみました。ロック機能もあるので旅行のときも不安なく持って行きやすいです\n\n 弱酸性にパンテノールまで…完全に敏感肌の私のための製品じゃないですか、涙。それに私はクレンジング製品に変な匂いがするのも嫌いなのですが、ちょうど無香…?ここまでくると私が作ったんじゃないかってレベル…笑\n\n 2週間以上使ってみましたが、テクスチャーがとろみのあるクレンジングミルクなのでローリングするときも柔らかく、すすいだ後も刺激がない感じがします。証拠は洗顔直後にトマトに変身していない私の顔😭\n\n 敏感肌の方に完全におすすめします。私はバブルクレンザーまでセットで買って使っていますが、完全に…定番アイテム認定！！💕潰れないで一生私に売ってください、お願いします",th:"เดิมทีล้างหน้าสองครั้งด้วยคลีนซิ่งออยล์แล้วโฟม แต่รู้สึกว่าเกราะผิวพังไปหมด เลยเปลี่ยนมาใช้แค่ออยล์อย่างเดียว เป็นผิวแพ้ง่ายสุดๆ เลยค่ะㅜㅠ \nแต่พอใช้แค่ออยล์อย่างเดียว รู้สึกว่าล้างไม่หมดจดสักเท่าไหร่.. จะให้ทำยังไงดีล่ะ ผิวแพ้ง่ายของฉัน.. \n\nแล้วพอนวดคลึงด้วยออยล์นานๆ พอล้างหน้าเสร็จหน้าก็แดงเป็นมะเขือเทศทุกครั้ง..🍅🍅\n\nได้ยินคนแนะนำคลีนซิ่งมิลค์ในอินสตาแกรมมาตลอด พอเห็นเป็นไอเทมแนะนำในแอปฮวาแฮครั้งนี้เลยลองดู มีระบบล็อคด้วยเลยพกไปเที่ยวได้อย่างสบายใจไม่ต้องกังวล\n\nเป็นกรดอ่อนแถมมีแพนธีนอลด้วย.. เป็นผลิตภัณฑ์สำหรับคนผิวแพ้ง่ายสุดๆ แบบฉันเลยㅜㅠ แล้วฉันไม่ชอบผลิตภัณฑ์คลีนซิ่งที่มีกลิ่นแปลกๆ พอดีตัวนี้ไม่มีกลิ่นเลย..? ขนาดนี้เหมือนฉันทำเองเลยนะเนี่ย..ฮ่าๆ\n\nใช้มาเกิน 2 สัปดาห์แล้ว เนื้อสัมผัสหนึบเป็นคลีนซิ่งมิลค์ นวดคลึงก็นุ่มนวล ล้างออกก็ไม่ระคายเคืองเลย หลักฐานคือหน้าที่ไม่กลายเป็นมะเขือเทศหลังล้างหน้าเลย😭\n\nแนะนำสุดๆ สำหรับผิวแพ้ง่าย ฉันซื้อคู่กับบับเบิลคลีนเซอร์มาเป็นเซ็ตด้วย กลายเป็นไอเทมประจำตัวไปแล้ว!!💕 อย่าเจ๊งนะ ขายให้ฉันไปตลอดชีวิตเลยนะขอร้อง"},images:["thumbnail/reviews/milk/qQwWBzpJ_1.jpg","thumbnail/reviews/milk/qQwWBzpJ_2.jpg","thumbnail/reviews/milk/qQwWBzpJ_3.jpg"],video:"thumbnail/reviews/milk/qQwWBzpJ.mov"},
    {id:"Aa2527DJ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"건성+트러블, 세정력만 보다 실패한 경험 → 진정 성분 중요성 깨달음 (이미지 1장)",en:"Dry + trouble-prone, learned the importance of soothing ingredients after a cleansing power-only failure (1 photo)","zh-CN":"干皮+痘痘肌，只看清洁力踩坑的经验 → 领悟舒缓成分的重要性（附1张图片）","zh-TW":"乾性+肌膚困擾，只看潔淨力失敗的經驗 → 領悟舒緩成分的重要性（附圖1張）",ja:"乾燥肌+トラブル、洗浄力だけを見て失敗した経験 → 鎮静成分の重要性を実感(画像1枚)",th:"ผิวแห้ง+เป็นสิว ประสบการณ์ที่เคยดูแค่แรงทำความสะอาดแล้วผิดหวัง → ตระหนักถึงความสำคัญของส่วนผสมปลอบประโลม (มีรูป)"},date:"2026-07-04",
      quote:{ko:"건성 피부라 세안 후 얼굴 당김이 고민이신 분들께 추천드리고 싶은 제품이에요‼️\n\n저는 건성 피부에 가끔 트러블도 올라오는 예민한 피부 타입이라 저자극의 순한 클렌징 제품을 이것저것 많이 찾아보는 편인데요. 처음에는 클렌징 제품을 고를 때 ‘세정력’을 가장 중요하게 생각했지만, 사용하다 보니 세정력이 전부는 아니더라구요.😭 건조하고 민감한 피부일수록 세정력뿐만 아니라 “자극이 적고 피부 진정에 도움”이 되는 성분이 함유되어 있는지도 정말 중요하다는 걸 느꼈습니다…🥹\n\n기존에 사용하던 타사의 클렌징 제품은 세정력은 만족스러웠지만, 세안 후 피부 속 당김이 너무 심하다는 아쉬움이 있었어요.😭 그래서 '세안 후에도 얼굴이 당기지 않고 촉촉함이 남는 클렌징 제품은 없을까?' 하고 찾아보다가 제 피부 고민에 잘 맞을 것 같았던 <노마디아 블루 진정 판테놀 1% 클렌징 밀크>를 사용해보게 되었습니다.\n\n매일 아침, 저녁으로 클렌징 밀크를 사용해 부드럽게 세안했고, 메이크업을 한 날에는 '골든 호호바 10% 듀얼 마이크로 버블 클렌저'로 2차 세안까지 해주었어요.\n\n가장 만족스러웠던 점은 세안 후에도 피부에 촉촉함이 남아 있었다는 점인데요‼️ 평소에는 세안만 하고 나오면 바로 기초 제품부터 찾을 정도로 얼굴이 당겼는데, 노마디아 클렌징 밀크는 그런 당김이 거의 느껴지지 않아 정말 만족스러웠습니다.☺️\n\n또 제품에 판테놀 성분이 함유되어 있어 피부가 한결 편안하고 촉촉해지는 느낌을 받았고, 민감한 피부인 저도 자극 없이 사용할 수 있었어요. 사용하는 동안 피부가 예민해지거나 붉어지는 느낌도 없어서 더욱 안심하고 사용할 수 있었고, 따로 인공적인 향이 첨가되지 않아 향에 민감하신 분들도 부담 없이 사용하기 좋을 것 같습니다.👏\n\n만족스럽게 사용한 노마디아 클렌징 밀크의 장점을 정리해보면,\n✔️ 세안 후에도 피부가 촉촉해 피부 속 당김이 적어요.\n✔️ 판테놀이 함유된 저자극 성분으로 민감한 피부도 부담 없이 사용할 수 있어요.\n✔️ 촉촉한 밀크 제형이라 부드럽고 말끔하게 세안할 수 있어요.",en:"I want to recommend this to anyone with dry skin who worries about tightness after cleansing‼️\n\nI have dry skin that's also prone to occasional breakouts, so I'm the type who searches around for a lot of low-irritant, gentle cleansing products. At first, when choosing a cleansing product, I thought 'cleansing power' was the most important thing, but after using various products, I realized cleansing power isn't everything.😭 The drier and more sensitive your skin is, the more important it is to check whether the product contains ingredients that are 'low-irritant and help soothe the skin,' not just clean well…🥹\n\nA cleansing product I used before from another brand had satisfying cleansing power, but the tightness in my skin after washing was too intense.😭 So I looked for 'is there no cleansing product that leaves the face moist without tightness after washing?' and found the <NOMADIA Blue Calming Panthenol 1% Cleansing Milk>, which seemed like it would suit my skin concerns well.\n\nI gently cleansed with the cleansing milk every morning and evening, and on days I wore makeup, I did a second cleanse with the 'Golden Jojoba 10% Dual Micro Bubble Cleanser' from the same line.\n\nWhat I was most satisfied with was that moisture remained on my skin even after washing‼️ Normally my face would get so tight after just washing that I'd immediately reach for skincare products, but with NOMADIA cleansing milk I barely felt that tightness, which was really satisfying.☺️\n\nAlso, thanks to the Panthenol in the product, my skin felt much more comfortable and moisturized, and even my sensitive skin could use it without irritation. I didn't feel my skin getting sensitized or red while using it, so I could use it with even more peace of mind, and since there's no artificial fragrance added, I think it would also be comfortable for people sensitive to scent.👏\n\nTo sum up the strengths of the NOMADIA cleansing milk I was satisfied with,\n✔️ Skin stays moisturized after washing so there's less inner tightness.\n✔️ A low-irritant formula with Panthenol so even sensitive skin can use it without worry.\n✔️ A moisturizing milk texture so you can cleanse gently and thoroughly.","zh-CN":"想推荐给因为干皮洗后紧绷而烦恼的朋友们‼️\n\n我是干皮，偶尔还会长痘，属于敏感类型，所以经常到处找低刺激的温和清洁产品。一开始选清洁产品时最看重的是'清洁力'，但用着用着才发现清洁力不是全部。😭 越是干燥敏感的皮肤，除了清洁力，产品是否含有'刺激少、有助舒缓皮肤'的成分也真的很重要……🥹\n\n之前用的其他品牌清洁产品清洁力令人满意，但洗后皮肤内干紧绷得很严重，让人遗憾。😭 所以就在找'有没有洗后不紧绷、还留有水润感的清洁产品？'的时候，发现<NOMADIA蓝色舒缓泛醇1%洁面乳>好像很适合我的皮肤困扰，就试用了。\n\n每天早晚都用洁面乳温和洁面，化妆的日子则用'金色荷荷巴10%双重微气泡洁面'做二次清洁。\n\n最满意的一点是洗后皮肤依然留有水润感‼️ 平时洗完脸马上就要找基础护肤品，脸太紧绷了，但NOMADIA洁面乳用完几乎感觉不到这种紧绷感，真的很满意。☺️\n\n而且产品含有泛醇成分，让人感觉皮肤更舒适水润，我这种敏感肌也能无刺激使用。使用期间皮肤也没有变敏感或泛红，用起来更放心，而且没有额外添加人工香料，对香味敏感的人应该也能放心使用。👏\n\n总结一下用NOMADIA洁面乳满意的优点，\n✔️ 洗后皮肤依然水润，内干紧绷感少。\n✔️ 含泛醇的低刺激成分，敏感肌也能无负担使用。\n✔️ 水润的洁面乳质地，能柔软干净地洁面。","zh-TW":"想推薦給乾性肌、正為洗完臉緊繃感煩惱的人‼️\n\n我是乾性肌，偶爾也會長痘痘，算是敏感的膚質，所以常常東找西找低刺激的溫和卸妝產品。一開始挑卸妝產品時，我最重視的是「潔淨力」，但用久了才發現潔淨力不是全部。😭乾燥又敏感的肌膚，除了潔淨力，「刺激少、有助舒緩」的成分是否添加也真的很重要……🥹\n\n以前用的其他品牌卸妝產品潔淨力雖然令人滿意，但洗完臉後皮膚內在緊繃感非常嚴重，讓我很困擾。😭於是我開始找「洗完臉不緊繃、還能留有水潤感的卸妝產品」，找到了感覺很適合我肌膚困擾的<NOMADIA藍色舒緩泛醇1%卸妝乳>。\n\n每天早晚都用卸妝乳溫和洗臉，化妝的日子還會用「金盞荷荷芭10%雙重微氣泡潔顏乳」做二次清潔。\n\n最滿意的一點是洗完臉後皮膚依然水潤‼️平常洗完臉馬上就要找保養品，因為臉太緊繃，但用NOMADIA卸妝乳幾乎感覺不到那種緊繃感，真的很滿意。☺️\n\n而且產品含有泛醇成分，皮膚感覺更舒適水潤，我這種敏感肌用起來也完全不刺激。使用期間皮膚沒有變敏感或泛紅，可以更安心地使用，也沒有額外添加人工香味，對香味敏感的人應該也能無負擔使用。👏\n\n整理一下滿意的NOMADIA卸妝乳優點，\n✔️ 洗完臉皮膚依然水潤，內在緊繃感少。\n✔️ 含泛醇的低刺激成分，敏感肌也能無負擔使用。\n✔️ 水潤的卸妝乳質地，能柔順乾淨地卸妝。",ja:"乾燥肌で洗顔後の顔のつっぱりが悩みの方におすすめしたい製品です‼️\n\n私は乾燥肌でたまにトラブルも出る敏感な肌タイプなので、低刺激でマイルドなクレンジング製品をいろいろ探す方です。最初はクレンジング製品を選ぶとき「洗浄力」を一番重視していましたが、使っているうちに洗浄力がすべてではないと気づきました。😭乾燥して敏感な肌ほど、洗浄力だけでなく「刺激が少なく肌の鎮静に役立つ」成分が含まれているかも本当に大事だと感じました…🥹\n\n これまで使っていた他社のクレンジング製品は洗浄力は満足でしたが、洗顔後の肌のつっぱりがひどすぎるのが残念でした。😭それで「洗顔後も顔がつっぱらずしっとり感が残るクレンジング製品はないかな?」と探していたところ、私の肌の悩みに合いそうな<NOMADIAブルー鎮静パンテノール1%クレンジングミルク>を使ってみることになりました。\n\n毎日朝晩、クレンジングミルクを使って優しく洗顔し、メイクをした日は「ゴールデンホホバ10%デュアルマイクロバブルクレンザー」で2回目の洗顔までしました。\n\n一番満足だった点は洗顔後も肌にしっとり感が残っていたことです‼️普段は洗顔しただけですぐスキンケア用品を探すほど顔がつっぱっていましたが、NOMADIAクレンジングミルクはそのつっぱりがほとんど感じられず本当に満足でした。☺️\n\nまた製品にパンテノール成分が含まれているので、肌がより快適でしっとりする感じを受け、敏感肌の私も刺激なく使うことができました。使用中に肌が敏感になったり赤くなる感じもなく、より安心して使うことができ、人工的な香りが特に添加されていないので香りに敏感な方も気兼ねなく使いやすいと思います。👏\n\n満足して使ったNOMADIAクレンジングミルクの長所をまとめると、\n✔️洗顔後も肌がしっとりしていて肌のつっぱりが少ないです。\n✔️パンテノール配合の低刺激成分で敏感肌も気兼ねなく使えます。\n✔️しっとりしたミルクのテクスチャーで優しくすっきり洗顔できます。",th:"อยากแนะนำผลิตภัณฑ์นี้ให้คนที่กังวลเรื่องหน้าตึงหลังล้างหน้าเพราะผิวแห้งค่ะ‼️\n\nฉันเป็นผิวแห้งที่บางครั้งก็มีสิวขึ้นด้วย เป็นผิวแพ้ง่าย เลยชอบหาผลิตภัณฑ์คลีนซิ่งที่ระคายเคืองน้อยและอ่อนโยนอยู่เสมอ ตอนแรกเลือกผลิตภัณฑ์คลีนซิ่งโดยดู 'แรงทำความสะอาด' เป็นหลัก แต่พอใช้ไปเรื่อยๆ ก็รู้ว่าแรงทำความสะอาดไม่ใช่ทุกอย่าง😭 ยิ่งผิวแห้งและแพ้ง่ายเท่าไหร่ ยิ่งต้องดูว่ามีส่วนผสมที่ \"ระคายเคืองน้อยและช่วยปลอบประโลมผิว\" ด้วยหรือเปล่า สำคัญมากจริงๆ…🥹\n\nผลิตภัณฑ์คลีนซิ่งของแบรนด์อื่นที่เคยใช้ แรงทำความสะอาดน่าพอใจ แต่หลังล้างหน้าตึงมากจนผิดหวัง😭 เลยหาคำตอบว่า 'มีผลิตภัณฑ์คลีนซิ่งที่ล้างหน้าแล้วไม่ตึงและยังคงความชุ่มชื้นไหมนะ?' จนมาเจอ <บลูซูทติ้งแพนธีนอล 1% คลีนซิ่งมิลค์ของโนมาเดีย> ที่น่าจะเหมาะกับปัญหาผิวของฉัน\n\nใช้คลีนซิ่งมิลค์ล้างหน้าอย่างนุ่มนวลทุกเช้า-เย็น และวันที่แต่งหน้าก็ล้างหน้าครั้งที่สองด้วย 'โกลเด้นโฮโฮบา 10% ดูอัลไมโครบับเบิลคลีนเซอร์' เพิ่มเติม\n\nสิ่งที่พอใจที่สุดคือหลังล้างหน้ายังคงความชุ่มชื้นไว้บนผิว‼️ ปกติแค่ล้างหน้าเสร็จก็ต้องรีบหาสกินแคร์มาทาทันทีเพราะหน้าตึงมาก แต่คลีนซิ่งมิลค์ของโนมาเดียแทบไม่รู้สึกตึงเลย พอใจมากจริงๆ☺️\n\nแล้วผลิตภัณฑ์นี้มีแพนธีนอล ทำให้รู้สึกว่าผิวสบายและชุ่มชื้นขึ้น แม้เป็นผิวแพ้ง่ายก็ใช้ได้โดยไม่ระคายเคือง ระหว่างใช้ไม่รู้สึกว่าผิวไวขึ้นหรือแดงขึ้นเลย เลยใช้ได้อย่างอุ่นใจมากขึ้น แล้วไม่ได้เติมน้ำหอมสังเคราะห์เพิ่มเติม คนที่แพ้กลิ่นง่ายก็น่าจะใช้ได้อย่างสบายใจ👏\n\nสรุปข้อดีของคลีนซิ่งมิลค์ของโนมาเดียที่ใช้แล้วพอใจ\n✔️ หลังล้างหน้าผิวยังชุ่มชื้น ตึงน้อย\n✔️ มีแพนธีนอลที่ระคายเคืองน้อย แม้ผิวแพ้ง่ายก็ใช้ได้อย่างสบายใจ\n✔️ เป็นเนื้อมิลค์ชุ่มชื้น ล้างหน้าได้นุ่มนวลและหมดจด"},images:["thumbnail/reviews/milk/Aa2527DJ_1.jpg"],video:null},
    {id:"A6gjEK9J",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"건성, 세정력·당김 딜레마를 동시에 해결한 구체적 체감 (이미지 1장)",en:"Dry skin, solved the dilemma of cleansing power vs. tightness at the same time - concrete impressions (1 photo)","zh-CN":"干皮，同时解决清洁力与紧绷两难的具体体验（附1张图片）","zh-TW":"乾性，同時解決潔淨力與緊繃感兩難的具體體感（附圖1張）",ja:"乾燥肌、洗浄力とつっぱりのジレンマを同時に解決した具体的な実感(画像1枚)",th:"ผิวแห้ง แก้ปัญหาความขัดแย้งระหว่างแรงทำความสะอาดกับความตึงได้พร้อมกัน (มีรูป)"},date:"2026-07-06",
      quote:{ko:"건성피부라 세안 후 당김이 늘 고민이었어요. 세정력을 놓치면 찝찝하고, 세정력을 잡으면 당김이 심졌어요... 두 가지를 동시에 만족하는 클렌징 밀크를 드디어 발견한 게 바로 노마디아 블루 진정 판테놀 1% 클렌징밀크입니다!🥰\n\n제형/사용감\n가볍고 부드러운 로션 타입이라 롤링할 때 뻑뻑함 없이 부드럽게 퍼지고, 생크림 촉감처럼 자극 없이 편하게 사용할 수 있어요. 물로 헹굴 때도 미끌거림 없이 깨끗하게 씻겨나가서 헹군 직후에도 잔여감 없이 뽀득한 느낌이 들어요. 이 부분에서 이미 만족도가 확 올라갔습니다.🤩\n\n세안 후\n이게 진짜 신기했던 부분인데, 세안 후에 당김이 거의 없어요. 건성피부는 클렌징 후 바로 스킨케어를 안 하면 얼굴이 뻣뻣해지고 당기는 느낌이있는데, 이 제품을 쓰고는 몇 분이 지나도 그런 느낌이 없어서 처음엔 좀 놀랐습니다.🤩 판테놀 성분 덕인지 세안 직후에도 피부가 진정되어 있는 느낌이 들어요.\n\n세정력\n가벼운 메이크업 날엔 밀크만으로 충분히 지워지고, 화장을 진하게 한 날은 같은 라인의 골든 호호바 버블클렌저로 이중세안을 해주면 정말 말끔하게 지워져요. 밀크치고 세정력이 나쁘지 않다는 느낌을 확실히 받았습니다.🤩\n\n총평\n- 예전에 쓰던 클렌징 밀크는 자극도 있고 세정력도 아쉬웠는데, 이걸로 바꾸고 나서는 자극 없고 당김도 없어서 계속 재구매할 것 같아요.\n- 순하면서 속당김 없는 클렌저 밀크+ 클렌저 버블  찾으시는 분들께 강추합니다!👍🥰",en:"As someone with dry skin, tightness after cleansing was always a concern. If I prioritized cleansing power, it felt icky, and if I prioritized against tightness, the tightness got worse... I finally found a cleansing milk that satisfies both at once, and it's the NOMADIA Blue Calming Panthenol 1% Cleansing Milk!🥰\n\nTexture/Feel\nIt's a light, soft lotion type, so it spreads smoothly without any stiffness when rolling it in, and it feels like fresh cream against the skin with no irritation, so it's comfortable to use. When rinsing with water there's no slipperiness, it washes off cleanly, so even right after rinsing there's no residue and it feels squeaky clean. My satisfaction already went up a lot from this alone.🤩\n\nAfter cleansing\nThis is the part that really surprised me - there's almost no tightness after washing. With dry skin, if you don't do skincare right after cleansing your face gets stiff and tight, but with this product, even minutes later I didn't feel that, which surprised me at first.🤩 I think thanks to the Panthenol, my skin feels soothed even right after washing.\n\nCleansing power\nOn light makeup days, the milk alone is enough to remove it, and on heavy makeup days, doing a second cleanse with the Golden Jojoba Bubble Cleanser from the same line removes everything really thoroughly. I definitely felt the cleansing power isn't bad for a milk.🤩\n\nOverall review\n- The cleansing milk I used before was somewhat irritating and its cleansing power was lacking, but since switching to this one, there's no irritation and no tightness, so I think I'll keep repurchasing.\n- Highly recommend this cleansing milk + bubble cleanser combo to anyone looking for something gentle with no inner tightness!👍🥰","zh-CN":"干皮的我一直被洗后紧绷困扰。清洁力不够就觉得不干净，清洁力够了紧绷又变严重……终于找到能同时满足这两点的洁面乳，就是NOMADIA蓝色舒缓泛醇1%洁面乳！🥰\n\n质地/使用感\n是轻盈柔软的乳液型，打圈时不干涩，能顺滑抹开，像鲜奶油一样的触感，无刺激很舒适。用水冲洗时也不滑腻，能干净洗掉，冲完之后没有残留感，有种清爽的干净感。这一点满意度已经直线上升了。🤩\n\n洗脸后\n真正神奇的地方是，洗后几乎不紧绷。干皮如果洗完不马上做后续护肤，脸就会僵硬紧绷，但用了这款产品几分钟后也没有那种感觉，一开始还有点惊讶。🤩 可能是泛醇成分的功劳，洗完脸马上就有种被舒缓的感觉。\n\n清洁力\n淡妆的日子光用洁面乳就能卸干净，浓妆的日子搭配同系列的金色荷荷巴气泡洁面做双重清洁，真的能卸得很干净。作为洁面乳，清洁力真的不差。🤩\n\n总评\n- 以前用的洁面乳有刺激也有清洁力不足的问题，换了这款之后没有刺激也不紧绷，感觉会一直回购。\n- 强推给正在找温和又不紧绷的洁面乳+气泡洁面组合的朋友们！👍🥰","zh-TW":"乾性肌洗完臉的緊繃感一直是我的困擾。潔淨力不夠會覺得沒洗乾淨，潔淨力太強又會很緊繃……終於找到能同時滿足這兩者的卸妝乳，就是NOMADIA藍色舒緩泛醇1%卸妝乳!🥰\n\n質地/使用感\n是輕盈柔軟的乳液型，打圈時不會乾澀，能柔順推開，像鮮奶油般的觸感，無刺激又舒服。用水沖洗時也不會滑膩，能乾淨洗掉，沖完之後也沒有殘留感，咕溜咕溜的。光是這一點滿意度就大大提升。🤩\n\n洗完臉後\n這是真正讓我驚訝的部分，洗完臉後幾乎不緊繃。乾性肌洗完臉如果不馬上做保養，臉會變得僵硬緊繃，但用了這款產品，過了幾分鐘也沒有這種感覺，一開始還嚇了一跳。🤩可能因為泛醇成分，洗完臉後皮膚也有種被舒緩的感覺。\n\n潔淨力\n淡妝的日子光靠卸妝乳就能卸乾淨，濃妝的日子搭配同系列的金盞荷荷芭氣泡潔顏乳做雙重清潔，就能卸得非常乾淨。以卸妝乳來說，潔淨力真的不錯。🤩\n\n總評\n- 以前用的卸妝乳有刺激感，潔淨力也不太理想，換成這款之後完全不刺激也不緊繃，應該會一直回購。\n- 大力推薦給正在找溫和又不緊繃的卸妝乳+潔顏氣泡乳的人！👍🥰",ja:"乾燥肌なので洗顔後のつっぱりがいつも悩みでした。洗浄力を優先すると物足りなく感じ、洗浄力を重視するとつっぱりがひどくなり…この2つを同時に満たすクレンジングミルクをついに見つけたのがNOMADIAブルー鎮静パンテノール1%クレンジングミルクです！🥰\n\nテクスチャー/使用感\n軽くて柔らかいローションタイプなのでローリングするときゴワゴワせず優しくのび、生クリームのような感触で刺激なく快適に使えます。水ですすぐときもぬるつきなくきれいに洗い流されて、すすいだ直後も残留感なくキュッとした感じがします。この部分ですでに満足度がぐっと上がりました。🤩\n\n洗顔後\nこれが本当に不思議だった部分ですが、洗顔後のつっぱりがほとんどありません。乾燥肌はクレンジング後すぐスキンケアをしないと顔がこわばってつっぱる感じがありますが、この製品を使ってからは数分経ってもそんな感じがなく、最初は少し驚きました。🤩パンテノール成分のおかげか、洗顔直後も肌が鎮静されている感じがします。\n\n洗浄力\n軽めのメイクの日はミルクだけで十分落ち、メイクを濃くした日は同ラインのゴールデンホホババブルクレンザーでダブル洗顔をすると本当にすっきり落ちます。ミルクにしては洗浄力が悪くないという感じを確実に受けました。🤩\n\n総評\n- 以前使っていたクレンジングミルクは刺激もあって洗浄力も物足りなかったのですが、これに変えてからは刺激もなくつっぱりもないので、これからもリピートすると思います。\n- マイルドでつっぱりのないクレンジングミルク+クレンザーバブルを探している方に強くおすすめします！👍🥰",th:"เป็นผิวแห้งเลยกังวลเรื่องตึงหลังล้างหน้าตลอด ถ้าไม่เน้นแรงทำความสะอาดก็รู้สึกไม่สะอาด แต่ถ้าเน้นแรงทำความสะอาดก็ยิ่งตึงมาก... ในที่สุดก็เจอคลีนซิ่งมิลค์ที่ตอบโจทย์ทั้งสองอย่างพร้อมกันแล้ว คือบลูซูทติ้งแพนธีนอล 1% คลีนซิ่งมิลค์ของโนมาเดียนี่เอง!🥰\n\nเนื้อสัมผัส/ความรู้สึกเมื่อใช้\nเป็นเนื้อโลชั่นบางเบานุ่มนวล นวดคลึงแล้วไม่มีความฝืด ลื่นไหลนุ่มนวล ใช้ได้สบายไม่ระคายเคืองเหมือนสัมผัสวิปครีม ล้างด้วยน้ำก็ไม่ลื่นเหนอะหนะ สะอาดหมดจด หลังล้างเสร็จก็รู้สึกสะอาดเอี๊ยดไม่มีคราบตกค้าง จุดนี้ทำให้ความพอใจพุ่งขึ้นเลย🤩\n\nหลังล้างหน้า\nนี่คือจุดที่น่าทึ่งจริงๆ หลังล้างหน้าแทบไม่ตึงเลย ปกติผิวแห้งถ้าไม่รีบทาสกินแคร์ทันทีหลังล้างหน้าจะรู้สึกแข็งและตึง แต่ใช้ผลิตภัณฑ์นี้แล้วผ่านไปหลายนาทีก็ยังไม่รู้สึกแบบนั้น แปลกใจตอนแรกเลย🤩 อาจเพราะมีแพนธีนอล เลยรู้สึกว่าผิวสงบตั้งแต่หลังล้างหน้าทันที\n\nแรงทำความสะอาด\nวันที่แต่งหน้าเบาๆ ใช้แค่มิลค์ก็ล้างออกหมดจดพอ ส่วนวันที่แต่งหน้าเข้มข้นก็ล้างหน้าสองครั้งด้วยโกลเด้นโฮโฮบาบับเบิลคลีนเซอร์ในไลน์เดียวกัน ก็ล้างออกได้หมดจดจริงๆ รู้สึกได้ชัดเจนว่าแม้เป็นมิลค์ก็มีแรงทำความสะอาดที่ไม่แย่เลย🤩\n\nสรุป\n- คลีนซิ่งมิลค์ที่เคยใช้ก่อนหน้านี้ทั้งระคายเคืองและแรงทำความสะอาดก็ไม่ค่อยดี แต่พอเปลี่ยนมาใช้ตัวนี้แล้วไม่ระคายเคืองและไม่ตึงเลย คิดว่าจะซื้อซ้ำไปเรื่อยๆ\n- แนะนำสุดๆ สำหรับคนที่กำลังหาคลีนซิ่งมิลค์+บับเบิลคลีนเซอร์ที่อ่อนโยนและไม่ทำให้ตึงหลังล้างหน้า!👍🥰"},images:["thumbnail/reviews/milk/A6gjEK9J_1.jpg"],video:null},
    {id:"JvezQp0A",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"건성, 얇고 약한 피부 - 제품 바꿀 때마다 뒤집어지던 반복 경험담 (이미지 1장)",en:"Dry, thin and weak skin - a recurring story of skin flaring up every time she switched products (1 photo)","zh-CN":"干皮，皮肤薄弱敏感 - 每次换产品就爆痘的反复经历（附1张图片）","zh-TW":"乾性，皮膚薄又脆弱 - 每次換產品就爆痘的反覆經歷分享（附圖1張）",ja:"乾燥肌、薄くて弱い肌 - 製品を変えるたびに荒れていた繰り返しの体験談(画像1枚)",th:"ผิวแห้ง ผิวบางและอ่อนแอ - เรื่องราวที่เห่อทุกครั้งที่เปลี่ยนผลิตภัณฑ์ (มีรูป)"},date:"2026-06-05",
      quote:{ko:"⭐️노마디아를 만나고 나의 피부 성공 시대 시작됐다⭐️\n\n제 추구미는 좋은 피부를 유지해 최소한의 메이크업만 하는 것인데요. \n건성 김미연에 얇고 약한 피부를 가지고 있어 정착할 제품을 찾는 것이 늘 어려웠습니다.\n성분 좋다 그래서 구매하면 뒤집어지고, 괜찮은 것 같을 때쯤 뒤집어지고.. (그럴 때마다 멘탈도 뒤집오지는..^^;) 의 반복이었어요. \n\n메이크업은 하면 할수록 ‘얹는 것’ 보다 ‘지우는 것’ 이 중요한 것 같더라고요. 30대가 된 후 더더욱 신경쓸 수밖에 없는 피부.. 직구 생활 그만하고 싶어서 K뷰티에서 끝내주는 클렌징 제품 나오기만을 기다렸는데, 혜성같이 나타난 💫노마디아💫 혹시 본사가 어느 쪽일까요.. 그쪽으로 절 한번 올리겠습니다.\n\n제형이 무겁지 않아 아침 세안 저녁 세안에 모두 사용할 수 있고, 피부나 메이크업 상태에 따라 선택적으로 조합해 사용할 수 있어 좋았어요. 무엇보다 성분에 진심인 브랜드를 알게 되어 기쁩니다.\n저는 이제 여기 눕겠습니다 ㅇ<—< 여러분 모두 노마디아 하세요 🩵🩵🩵",en:"⭐️My skin success era began after meeting NOMADIA⭐️\n\nWhat I'm going for is keeping good skin so I only need minimal makeup.\nI have dry, thin, and weak skin, so finding a product I could stick with has always been hard.\nBuy something because it has good ingredients, and my skin flares up; think it might be working, and it flares up again.. (and my mental flares up right along with it every time..^^;) It was a repeating cycle.\n\nThe more I do makeup, the more I feel that 'taking it off' matters more than 'putting it on.' Since turning 30, I have to pay even more attention to my skin.. I wanted to stop living off overseas direct purchases and was waiting for an amazing cleansing product to come out of K-beauty, and then NOMADIA appeared like a comet 💫 I wonder where headquarters is.. I'm going to sing their praises in that direction.\n\nThe texture isn't heavy so I can use it for both morning and evening cleansing, and I can mix and match depending on my skin or makeup condition, which I liked. Most of all, I'm happy to have found a brand that's serious about ingredients.\nI'm going to lie down right here now ㅇ<—< everyone, go get NOMADIA 🩵🩵🩵","zh-CN":"⭐️遇见NOMADIA之后我的皮肤逆袭时代开始了⭐️\n\n我的理想状态是维持好皮肤、只化最简单的妆，\n干皮又皮肤薄弱敏感，一直很难找到能长期定妆的产品。\n听说成分好就买来试，结果爆痘，感觉差不多适应了又爆痘……（每次这样心态也跟着崩溃……^^;）就这样反反复复。\n\n化妆化久了才发现，比起'上妆'，'卸妆'更重要。到了30岁之后更是要重视皮肤……不想再继续海淘了，一直等着K-Beauty出个厉害的清洁产品，结果彗星般出现了💫NOMADIA💫总部到底在哪呢……我要往那边捧一下。\n\n质地不厚重，早晚洁面都能用，还能根据皮肤或妆容状态灵活搭配使用，这点很喜欢。最重要的是很高兴认识了一个对成分很用心的品牌。\n我现在要躺平了ㅇ<—< 大家都来用NOMADIA吧🩵🩵🩵","zh-TW":"⭐️遇見NOMADIA之後我的皮膚成功時代開始了⭐️\n\n我追求的目標是維持好膚質，只上最少的妝。\n我是乾性肌又皮膚薄又脆弱，一直很難找到能定下來的產品。\n聽說成分好就買，結果爆痘，覺得還不錯的時候又爆痘……（每次爆痘心態也跟著爆炸……^^;）一直重複這個循環。\n\n化妝這件事，越化越覺得比起「上妝」，「卸妝」更重要。過了30歲之後皮膚更需要細心呵護……不想再過海淘生活，一直期待K-beauty能出一款超厲害的卸妝產品，結果彗星般出現了💫NOMADIA💫，不知道總公司在哪裡……我要往那個方向膜拜一下。\n\n質地不厚重，早晚洗臉都能用，可以根據膚況或化妝程度選擇性搭配使用，這點很喜歡。最重要的是很開心認識了一個對成分很真誠的品牌。\n我現在要躺平了 ㅇ<—< 大家都來用NOMADIA吧 🩵🩵🩵",ja:"⭐️NOMADIAに出会って私の肌成功時代が始まった⭐️\n\n私の目指す姿は、良い肌を保って最小限のメイクだけにすることです。\n乾燥肌で敏感な、薄くて弱い肌を持っているので、定着する製品を見つけるのがいつも大変でした。\n成分が良いと聞いて購入すると肌荒れして、良さそうだと思う頃にまた荒れて…(そのたびにメンタルも崩れる…^^;)の繰り返しでした。\n\nメイクはすればするほど「のせること」より「落とすこと」が大事だと感じました。30代になってからさらに気を使わざるを得ない肌…海外通販生活をやめたくて、K-ビューティーからすごいクレンジング製品が出るのをずっと待っていたのですが、彗星のように現れた💫NOMADIA💫本社はどちらでしょうか…そちらに私を一度祭り上げます。\n\nテクスチャーが重くないので朝の洗顔・夜の洗顔どちらにも使えて、肌やメイクの状態に合わせて選んで組み合わせて使えるのが良かったです。何より成分に本気なブランドだと知れて嬉しいです。\n私はもうここに落ち着きます ㅇ<—< みなさんもぜひNOMADIAを🩵🩵🩵",th:"⭐️พอเจอโนมาเดียแล้ว ยุคผิวสำเร็จของฉันก็เริ่มต้นขึ้น⭐️\n\nเป้าหมายของฉันคือรักษาผิวให้ดีจนแต่งหน้าน้อยที่สุดก็พอ\nแต่เป็นผิวแห้งที่บางและอ่อนแอ เลยหาผลิตภัณฑ์ที่ลงตัวยากมาตลอด\nซื้อเพราะบอกว่าส่วนผสมดีก็เห่อ พอเริ่มรู้สึกว่าโอเคก็เห่ออีก.. (ทุกครั้งที่เห่อ ใจก็พังไปด้วย..^^;) วนซ้ำแบบนี้มาตลอด \n\nยิ่งแต่งหน้ามากเท่าไหร่ ยิ่งรู้สึกว่า 'การล้างออก' สำคัญกว่า 'การแต่งลง' พออายุ 30 กว่าแล้วก็ยิ่งต้องใส่ใจผิวมากขึ้น.. อยากเลิกสั่งของนอกแล้ว รอผลิตภัณฑ์คลีนซิ่งเจ๋งๆ จาก K-Beauty มาตลอด แล้วก็มี 💫โนมาเดีย💫 โผล่มาเหมือนดาวหางเลย ไม่รู้บริษัทแม่อยู่ทางไหนนะ.. ขอยกให้เขาเลย\n\nเนื้อสัมผัสไม่หนักเลยใช้ได้ทั้งเช้าและเย็น แล้วยังเลือกใช้ผสมผสานตามสภาพผิวหรือเมคอัพได้ ชอบมาก ที่สำคัญที่สุดคือดีใจที่ได้รู้จักแบรนด์ที่จริงจังกับส่วนผสมแบบนี้\nฉันขอนอนราบตรงนี้เลยละกัน ㅇ<—< ทุกคนมาใช้โนมาเดียกันเถอะ 🩵🩵🩵"},images:["thumbnail/reviews/milk/JvezQp0A_1.jpg"],video:null},
    {id:"qPgkDvQZ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지/민감, 오래 롤링해도 마찰 열감 없음, 항목별 상세 (이미지 3장)",en:"Combination-oily/sensitive, no friction heat even with long rolling, detailed category breakdown (3 photos)","zh-CN":"水油皮/敏感，长时间打圈也不会因摩擦发热，分项详细测评（附3张图片）","zh-TW":"外油內乾/敏感，長時間打圈也不會有摩擦熱感，逐項詳細心得（附圖3張）",ja:"インナードライ肌/敏感肌、長時間ローリングしても摩擦熱を感じない、項目別詳細(画像3枚)",th:"ผิวมันขาดน้ำ/แพ้ง่าย นวดคลึงนานแค่ไหนก็ไม่ร้อนจากแรงเสียดสี รายละเอียดแยกหมวด (มีรูป 3 ภาพ)"},date:"2026-05-30",
      quote:{ko:"🫧 제형 : 묽은 로션 타입의 클렌징 밀크예요. 물처럼 주르륵은 아니지만 오일보다도 훨씬 부드럽게 롤링돼서 피부에 자극감이 거의 없고, 오래 문질러도 마찰로 인한 열감이 느껴지지 않았어요.\n\n🫧 사용감 : 롤링감이 부드럽고 세안 후에도 피부 당김 없이 촉촉하게 마무리돼요. 클렌징 밀크 특유의 잔여감이 걱정됐는데 물세안을 충분히 해주면 미끈거리거나 답답한 느낌 없이 깔끔하게 마무리됐어요.\n\n🫧 세정력 : 평소 가벼운 쉐도우, 브로우, 블러셔 정도의 메이크업을 하는 편인데 무리 없이 잘 지워졌어요. 데일리 메이크업 클렌징용으로 사용하기 괜찮았어요.\n\n🫧 진정감 : 피부가 예민한 날에도 부담 없이 사용할 수 있었어요. 세안 후 피부가 편안한 느낌이라 건조하거나 자극받은 날 손이 자주 갈 것 같아요.\n\n🫧 향 : 향이 강하지 않은 편이라 사용하기 편했어요. 인위적인 향이 거의 느껴지지 않아서 호불호 없이 사용할 수 있을 것 같아요.\n\n🫧 용기 : 펌프 타입이라 사용하기 편하고, 펌프를 옆으로 돌리면 잠기는 구조라 보관할 때도 깔끔해요. 여행이나 외박할 때 챙겨가기에도 안심되는 패키징이었어요.\n\n🫧 민감성 : 사용하면서 따갑거나 화한 느낌은 없었고, 세안 후 붉어짐이나 자극도 느끼지 못했어요. 순한 클렌징 제품 찾는 분들에게 잘 맞을 것 같아요.\n\n오일보다도 훨씬 부드럽고 자극감 없어서 현재 아쉬운거 없고 이걸로 갈아탑니다!",en:"🫧 Texture: It's a watery lotion-type cleansing milk. Not quite as runny as water, but it rolls on much more gently than oil, so there's almost no irritation on the skin, and even with prolonged rubbing I didn't feel any heat from friction.\n\n🫧 Feel: The rolling feel is soft, and after washing there's no tightness, it finishes moist. I was worried about the residue typical of cleansing milks, but if you rinse thoroughly with water it finishes cleanly without any slimy or stuffy feeling.\n\n🫧 Cleansing power: I usually wear light makeup like shadow, brows, and blush, and it removed everything without a problem. Fine for everyday makeup cleansing use.\n\n🫧 Soothing effect: I could use it without worry even on days my skin felt sensitive. My skin felt comfortable after washing, so I think I'd reach for it often on dry or irritated days.\n\n🫧 Scent: The scent isn't strong, so it was comfortable to use. I barely noticed any artificial fragrance, so I think it could be used without much preference-based dislike.\n\n🫧 Packaging: It's a pump type so it's convenient to use, and turning the pump sideways locks it, so it stays tidy when stored. It was reassuring packaging to bring along for travel or staying overnight elsewhere.\n\n🫧 Sensitivity: While using it there was no stinging or tingling, and I didn't feel any redness or irritation after washing. I think it would suit people looking for a gentle cleansing product.\n\nIt's much gentler than oil with no irritation, so I have nothing to complain about right now and I'm switching over to this for good!","zh-CN":"🫧 质地：是偏稀的乳液型洁面乳。虽不像水一样流动，但比油类打圈更柔软，皮肤几乎没有刺激感，长时间打圈也不会因摩擦而发热。\n\n🫧 使用感：打圈手感柔软，洗后也不紧绷，能水润收尾。本来担心洁面乳特有的残留感，但充分水洗之后没有滑腻或闷的感觉，很清爽地收尾。\n\n🫧 清洁力：我平时化淡妆、眼影、眉毛、腮红程度的妆，都能顺利卸掉。当日常妆容清洁用挺不错。\n\n🫧 舒缓感：皮肤敏感的日子用也没有负担。洗后皮肤感觉很舒适，干燥或受刺激的日子应该会经常用这款。\n\n🫧 香味：香味不浓，很好用。几乎感觉不到人工香味，应该不太会有明显好恶。\n\n🫧 包装：是泵头类型，使用方便，把泵头往旁边一转就能锁住，收纳也很整洁。旅行或外宿携带也让人放心。\n\n🫧 敏感度：使用期间没有刺痛或灼热感，洗后也没有泛红或刺激。适合正在找温和清洁产品的人。\n\n比油类更柔软、没有刺激感，目前完全没有不满意的地方，打算换用这款！","zh-TW":"🫧 質地：是稀薄乳液型的卸妝乳。雖然不像水那樣流動，但比油類更柔順地在皮膚上打圈，幾乎沒有刺激感，就算長時間搓揉也不會有摩擦造成的熱感。\n\n🫧 使用感：滾動感柔順，洗完臉後也不緊繃，水潤收尾。原本擔心卸妝乳特有的殘留感，但只要用清水充分沖洗，就不會滑膩或悶，收尾很乾淨。\n\n🫧 潔淨力：我平常只上眼影、眉彩、腮紅程度的淡妝，都能輕鬆卸乾淨。當日常淡妝卸妝用很不錯。\n\n🫧 舒緩感：皮膚敏感的日子也能無負擔使用。洗完臉後皮膚很舒服，乾燥或受刺激的日子應該會常常想用。\n\n🫧 香味：不是濃烈的香味，用起來很舒服。幾乎感覺不到人工香味，喜好應該不會太兩極。\n\n🫧 容器：是按壓瓶類型，使用方便，把壓頭往旁邊轉就能鎖起來，收納也很整齊。旅行或過夜時帶著走也很安心。\n\n🫧 敏感度：使用期間沒有刺痛或灼熱感，洗完臉也沒有感覺到泛紅或刺激。應該很適合正在找溫和卸妝產品的人。\n\n比油類更柔軟、無刺激，現在完全沒有不滿意的地方，決定換成這款了！",ja:"🫧テクスチャー：水っぽいローションタイプのクレンジングミルクです。水のようにさらさらではありませんが、オイルよりずっと柔らかくローリングできて肌への刺激感がほとんどなく、長時間こすっても摩擦による熱感を感じませんでした。\n\n🫧使用感：ローリング感が柔らかく、洗顔後も肌がつっぱらずしっとり仕上がります。クレンジングミルク特有の残留感が心配でしたが、水洗いを十分にするとぬるついたり息苦しい感じなくすっきり仕上がりました。\n\n🫧洗浄力：普段軽めのアイシャドウ、アイブロウ、チーク程度のメイクをする方ですが、無理なくきちんと落ちました。デイリーメイクのクレンジング用として使うのに良かったです。\n\n🫧鎮静感：肌が敏感な日でも気兼ねなく使うことができました。洗顔後に肌が快適な感じで、乾燥したり刺激を受けた日に手が伸びそうです。\n\n🫧香り：香りが強くない方で使いやすかったです。人工的な香りがほとんど感じられないので好みを問わず使えそうです。\n\n🫧容器：ポンプタイプなので使いやすく、ポンプを横に回すとロックされる構造なので保管するときもすっきりしています。旅行や外泊のときに持っていくにも安心なパッケージでした。\n\n🫧敏感さ：使用中にヒリヒリしたりピリピリする感じはなく、洗顔後の赤みや刺激も感じませんでした。マイルドなクレンジング製品を探している方に合いそうです。\n\nオイルよりずっと柔らかく刺激感がないので今のところ不満はなく、これに切り替えます！",th:"🫧 เนื้อสัมผัส : เป็นคลีนซิ่งมิลค์เนื้อโลชั่นเหลว ไม่ถึงกับไหลย้อยแบบน้ำ แต่นวดคลึงได้นุ่มนวลกว่าออยล์มาก แทบไม่ระคายเคืองผิว แม้นวดคลึงนานก็ไม่รู้สึกร้อนจากแรงเสียดสีเลย\n\n🫧 ความรู้สึกเมื่อใช้ : นวดคลึงได้นุ่มนวล หลังล้างหน้าจบด้วยความชุ่มชื้นไม่ตึงเลย กังวลเรื่องคราบตกค้างเฉพาะตัวของคลีนซิ่งมิลค์ แต่พอล้างน้ำให้เพียงพอก็จบอย่างสะอาดหมดจดโดยไม่ลื่นเหนอะหนะหรืออึดอัดเลย\n\n🫧 แรงทำความสะอาด : ปกติแต่งหน้าเบาๆ แค่อายแชโดว์ คิ้ว บลัชออน ก็ล้างออกได้ไม่มีปัญหา เหมาะสำหรับใช้ล้างเมคอัพประจำวัน\n\n🫧 ความรู้สึกปลอบประโลม : ใช้ได้อย่างสบายใจแม้วันที่ผิวไวต่อสิ่งเร้า หลังล้างหน้าผิวรู้สึกสบาย น่าจะหยิบใช้บ่อยในวันที่ผิวแห้งหรือระคายเคือง\n\n🫧 กลิ่น : กลิ่นไม่แรง ใช้สบาย แทบไม่รู้สึกถึงกลิ่นสังเคราะห์เลย น่าจะใช้ได้โดยไม่มีใครไม่ชอบ\n\n🫧 บรรจุภัณฑ์ : เป็นแบบปั๊มใช้งานสะดวก หมุนปั๊มไปด้านข้างแล้วล็อคได้ เก็บรักษาได้เรียบร้อย เป็นแพ็กเกจที่พกไปเที่ยวหรือค้างคืนได้อย่างอุ่นใจ\n\n🫧 ความอ่อนโยน : ใช้แล้วไม่รู้สึกแสบหรือร้อนวูบวาบเลย หลังล้างหน้าก็ไม่รู้สึกแดงหรือระคายเคือง น่าจะเหมาะกับคนที่กำลังหาผลิตภัณฑ์คลีนซิ่งที่อ่อนโยน\n\nนุ่มนวลกว่าออยล์มากและไม่ระคายเคืองเลย ตอนนี้ไม่มีอะไรให้เสียดายแล้ว ขอเปลี่ยนมาใช้ตัวนี้แทนเลย!"},images:["thumbnail/reviews/milk/qPgkDvQZ_1.jpg","thumbnail/reviews/milk/qPgkDvQZ_2.jpg","thumbnail/reviews/milk/qPgkDvQZ_3.jpg"],video:null},
    {id:"Jk8lOBBZ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"건성, 클렌징오일→밀크 전환 - 진한/연한 메이크업 각각 테스트 (이미지 1장)",en:"Dry skin, switching from cleansing oil to milk - tested with both heavy and light makeup (1 photo)","zh-CN":"干皮，从卸妆油换成洁面乳 - 分别测试浓妆/淡妆（附1张图片）","zh-TW":"乾性，從卸妝油換成卸妝乳 - 分別測試濃妝/淡妝（附圖1張）",ja:"乾燥肌、クレンジングオイル→ミルクへ切り替え - 濃い/薄いメイクそれぞれをテスト(画像1枚)",th:"ผิวแห้ง เปลี่ยนจากคลีนซิ่งออยล์เป็นมิลค์ - ทดสอบทั้งเมคอัพเข้มและเบา (มีรูป)"},date:"2026-05-31",
      quote:{ko:"노마디아 클렌징밀크 2주 사용후기\n\n저는 화장을 클렌징오일로 지워와서 클렌징밀크는 처음 써보는 경험이었어요. 클렌징밀크가 훨씬 가볍다고 해서 써보려고 하다 노마디아 클렌징밀크를 써보게되었습니다. 일단 한번 짜면 얼굴에 전부 도포할 수 있는 양이 적당하게 듬뿍 나와줘서 여러번 안짜도 돼서 속이 시원했어요.. 제가 쓰던 클렌징오일은 워낙 조금씩 나와서 여러번 짜고 중간에 막히고 이래서 짜증났거든요. 제형이 로션같더라고요! 점성이 꽤있어서 손위에서 흘러내리지않아서 정말 좋았어요👍 얼굴에 바르는데도 로션 펴바르는 느낌이었어요.\n\n진한메이크업, 연한메이크업 전부 사용해봤는데 립앤아이 리무버같은거 안쓰고도 마스카라 아이라이너도 다 지워져서 만족스러웠어요. 진한 메이크업의 경우 2차세안을 해줬지만, 비비크림, 치크, 립 정도만 바른 연한 메이크업은 그냥 클렌징밀크만 발라주고 유화 시켜준다음 물로 여러번 씻어내니까 잔여감이 없이 개운하더라고요! \n\n약산성이 피부에 좋다는걸 알면서도 미끌거리는 잔여감이 싫어서 꾸역꾸역 알칼리성 폼클렌징 쓰는 사람인데, 노마디아 클렌징밀크는 약산성으로 알고있는데도 메이크업 말끔히 지워주고, 마지막 마무리까지 적당히 개운했고 수분감은 남아있는 딱 좋은 느낌이었어요! 유분감은 가져가고 수분감만 남겨놓은, 너무 미끌거리지 않는 마무리감이라 엄청 만족했습니다💚\n\n집에 쟁여놓은 클렌징오일 다 쓰고 영영 클렌징밀크로 갈아탈 것 같아요. 그 중에서도 노마디아 클렌징밀크 정말 좋았어요!!",en:"2-week review of NOMADIA cleansing milk\n\nI've always removed my makeup with cleansing oil, so this was my first time trying a cleansing milk. I heard cleansing milk is much lighter so I wanted to try it, and I ended up trying NOMADIA's cleansing milk. First off, one pump gave enough to cover my whole face, generously, so I didn't have to pump several times, which was such a relief.. The cleansing oil I used before came out in such small amounts that I had to pump repeatedly and it kept clogging up mid-use, which was annoying. The texture felt like lotion! It had a good amount of viscosity so it didn't run off my hand, which I really liked 👍 Even applying it to my face felt like spreading on lotion.\n\nI tried it with both heavy and light makeup, and it removed mascara and eyeliner just fine without needing a separate lip and eye remover, which was satisfying. For heavy makeup I did a second cleanse, but for light makeup - just BB cream, cheek, and lip - I just applied the cleansing milk, emulsified it, and rinsed with water several times, and it felt refreshingly clean with no residue!\n\nI know mildly acidic is good for the skin, but I've been reluctantly sticking with alkaline foam cleanser because I hate the slippery residue feeling. NOMADIA's cleansing milk, even though I understand it's mildly acidic, cleanly removed my makeup, and the finish was appropriately refreshing while still leaving moisture behind - just the right feeling! It keeps the oiliness in check while leaving just the right amount of moisture, a finish that's not too slippery, so I was really satisfied💚\n\nOnce I finish off the cleansing oil I have stockpiled at home, I think I'll switch to cleansing milk for good. NOMADIA's cleansing milk in particular was really great!!","zh-CN":"NOMADIA洁面乳两周使用心得\n\n我一直用卸妆油卸妆，第一次尝试洁面乳。听说洁面乳更轻盈，正打算试试的时候就用上了NOMADIA洁面乳。挤一次就能出足够涂满全脸的量，不用挤好几次，很痛快……我之前用的卸妆油每次挤出来的量都很少，要挤好几次还老是堵住，很烦躁。质地像乳液！粘度挺够，不会从手上流下来，真的很喜欢👍涂在脸上也像涂乳液一样。\n\n浓妆、淡妆我都试过，不用唇眼卸妆液睫毛膏和眼线都能卸干净，很满意。浓妆的话我做了二次清洁，但只涂了BB霜、腮红、口红的淡妆，光用洁面乳乳化之后多冲几次水就很干净清爽，没有残留感！\n\n我明知道弱酸性对皮肤好，但因为讨厌滑腻的残留感一直勉强用碱性洁面泡沫，NOMADIA洁面乳虽然是弱酸性，但能把妆卸干净，最后的收尾感也是恰到好处的清爽，还留有水润感！带走油腻只留下水润，不会太滑腻的收尾感，非常满意💚\n\n家里囤的卸妆油用完之后应该会永久换成洁面乳。其中NOMADIA洁面乳真的很好用!!","zh-TW":"NOMADIA卸妝乳兩週使用心得\n\n我一直都是用卸妝油卸妝，這是第一次體驗卸妝乳。聽說卸妝乳更輕盈，就想試試看，於是用了NOMADIA卸妝乳。首先按一次就能出足夠塗滿全臉的量，不用按好幾次，這點讓我很痛快……我原本用的卸妝油出量太少，要按好幾次，中間還會塞住，讓我很煩躁。質地很像乳液！有一定的黏稠度，不會在手上流下來，這點真的很喜歡👍塗在臉上也像是推乳液的感覺。\n\n濃妝、淡妝我都試過了，不用唇眼卸妝液，睫毛膏、眼線也都卸乾淨了，很滿意。濃妝的話我還是做了二次清潔，但只上BB霜、腮紅、唇膏程度的淡妝，光用卸妝乳打圈乳化，再用清水多沖幾次，就沒有殘留感、很清爽！\n\n雖然知道弱酸性對皮膚好，但因為討厭滑膩的殘留感，我一直勉強自己用鹼性洗面乳，NOMADIA卸妝乳雖然是弱酸性，卻能把妝卸得乾乾淨淨，收尾也剛剛好清爽，還留有水潤感，這種感覺剛剛好！留下水分感、去掉油膩感，收尾不會太滑膩，讓我非常滿意💚\n\n家裡囤的卸妝油用完之後，應該會永遠換成卸妝乳了。其中NOMADIA卸妝乳真的很不錯!!",ja:"NOMADIAクレンジングミルク2週間使用レビュー\n\n私はメイクをクレンジングオイルで落としてきたので、クレンジングミルクは初めての経験でした。クレンジングミルクの方がずっと軽いというので使ってみようと思い、NOMADIAクレンジングミルクを使ってみることになりました。まず1回押すと顔全体に塗れる量がちょうど良くたっぷり出てくれるので、何回も押さなくて良くてすっきりしました…私が使っていたクレンジングオイルはとにかく少しずつしか出なくて何回も押したり途中で詰まったりしてイライラしていたんです。テクスチャーはローションみたいでした！粘度がかなりあって手の上で垂れないので本当に良かったです👍顔に塗るのもローションをのばす感じでした。\n\n濃いメイク、薄いメイク両方試してみましたが、リップ&アイリムーバーのようなものを使わなくてもマスカラもアイライナーも全部落ちて満足でした。濃いメイクのときは2回目の洗顔をしましたが、BBクリーム、チーク、リップ程度の薄いメイクは、クレンジングミルクだけ塗って乳化させた後、水で何回も洗い流すと残留感なくさっぱりしました！\n\n弱酸性が肌に良いと分かっていてもぬるつく残留感が嫌で無理してアルカリ性の洗顔フォームを使っていた人間なのですが、NOMADIAクレンジングミルクは弱酸性だと知っているのにメイクをきれいに落としてくれて、最後の仕上がりまでほど良くさっぱりして水分感は残っている、ちょうど良い感じでした！油っぽさは持っていって水分感だけ残してくれる、ぬるつきすぎない仕上がりで本当に満足しました💚\n\n家に常備していたクレンジングオイルを全部使い切ったら、もうずっとクレンジングミルクに切り替えると思います。その中でもNOMADIAクレンジングミルクは本当に良かったです！！",th:"รีวิวการใช้คลีนซิ่งมิลค์ของโนมาเดีย 2 สัปดาห์\n\nปกติล้างเมคอัพด้วยคลีนซิ่งออยล์มาตลอด นี่เป็นครั้งแรกที่ได้ลองคลีนซิ่งมิลค์ค่ะ ได้ยินว่าคลีนซิ่งมิลค์เบากว่าเยอะเลยอยากลอง แล้วก็ได้ลองใช้คลีนซิ่งมิลค์ของโนมาเดีย พอปั๊มครั้งเดียวก็ได้ปริมาณเพียงพอสำหรับทาทั่วหน้า ไม่ต้องปั๊มหลายครั้งเลยรู้สึกโล่งใจ.. คลีนซิ่งออยล์ที่เคยใช้ออกมาน้อยมากจนต้องปั๊มหลายครั้งแล้วบางทีก็อุดตัน หงุดหงิดมาก เนื้อสัมผัสเหมือนโลชั่นเลย! มีความหนืดพอสมควรจนไม่ไหลจากมือ ชอบมากจริงๆ👍 ทาบนหน้าก็รู้สึกเหมือนทาโลชั่นเลย\n\nลองใช้ทั้งวันแต่งหน้าเข้มและเบา แม้ไม่ใช้ลิปแอนด์อายรีมูฟเวอร์ มาสคาร่ากับอายไลเนอร์ก็หลุดออกหมด พอใจมาก วันที่แต่งหน้าเข้มข้นก็ล้างหน้าครั้งที่สองเพิ่ม แต่วันที่แต่งหน้าเบาๆ แค่บีบีครีม ชีค ลิป แค่ทาคลีนซิ่งมิลค์แล้วทำอิมัลชัน จากนั้นล้างด้วยน้ำหลายๆ ครั้งก็สะอาดหมดจดไม่มีคราบตกค้างเลย! \n\nรู้อยู่ว่ากรดอ่อนดีต่อผิว แต่เพราะไม่ชอบความรู้สึกลื่นเหนอะหนะตกค้าง เลยฝืนใจใช้โฟมล้างหน้าแบบด่างมาตลอด แต่คลีนซิ่งมิลค์ของโนมาเดียแม้จะเป็นกรดอ่อนก็ล้างเมคอัพออกได้หมดจด แล้วจบด้วยความรู้สึกสะอาดพอดี ยังคงความชุ่มชื้นไว้ กำลังดีเลย! เก็บแค่ความชุ่มชื้นไว้ ไม่เอาความมันเยิ้ม จบแบบไม่ลื่นเหนอะหนะเกินไป พอใจมากๆ เลยค่ะ💚\n\nคลีนซิ่งออยล์ที่ตุนไว้ที่บ้านใช้หมดแล้วคงเปลี่ยนมาใช้คลีนซิ่งมิลค์ตลอดไปเลย โดยเฉพาะคลีนซิ่งมิลค์ของโนมาเดียนี่ดีจริงๆ!!"},images:["thumbnail/reviews/milk/Jk8lOBBZ_1.jpg"],video:null},
    {id:"Z04B2j1Z",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지/민감, 트러블·흉터·자국 있는 예민 피부 - 두꺼운 베이스 메이크업 세안 루틴 (이미지 2장)",en:"Combination-oily/sensitive, sensitive skin with breakouts/scars/marks - heavy base makeup cleansing routine (2 photos)","zh-CN":"水油皮/敏感，有痘痘·疤痕·痕迹的敏感肌 - 厚重底妆的洁面routine（附2张图片）","zh-TW":"外油內乾/敏感，有痘疤‧痕跡的敏感肌 - 厚重底妝的洗臉流程（附圖2張）",ja:"インナードライ肌/敏感肌、トラブル・傷跡・跡がある敏感肌 - 厚めのベースメイクの洗顔ルーティン(画像2枚)",th:"ผิวมันขาดน้ำ/แพ้ง่าย ผิวที่มีสิว รอยแผลเป็น รอยดำ - รูทีนล้างเมคอัพเบสหนา (มีรูป 2 ภาพ)"},date:"2026-05-31",
      quote:{ko:"약 일주일 정도 사용해봤는데, 개인적으로 정말 만족도가 높았던 클렌징 제품이었어요 💙\n\n저는 피부가 엄청 예민한 편인데도 트러블, 흉터, 자국 때문에  평소 베이스 메이크업을 두껍게 하는 편이라 항상 2차 세안까지 꼼꼼하게 하는 스타일이거든요 🥲 근데 클렌징 제품 잘못 쓰면 바로 피부가 뒤집어지거나 세안 후 얼굴이 화끈거리는 경우가 많았는데, 이 제품은 이름처럼 진정 라인이라 그런지 사용감이 정말 순했어요 🌿 클렌징 밀크 타입이라 피부에 부드럽게 롤링되고 자극 없이 세안되는 느낌이 특히 좋았어요! 그렇다고 세정력이 약한 느낌은 아니라서 메이크업 후에도 답답함 없이 사용할 수 있었어요 ✨세안 후 당김도 심하지 않은 편이라 요즘처럼 피부 예민할 때 더 손이 자주 가더라구요 😊\n\n👉 민감성 피부 + 잦은 메이크업으로 피부가 지친 분들께 추천하고 싶은 제품이에요 💡솔직히 다 사용하면 내돈내산 할 것 같다는생각도 들었어요 💸💙\n\n전체적으로 만족하면서 사용했지만, 아무래도 클렌징 밀크 타입이다 보니 👉 한 번에 엄청 강력하게 지워지는 느낌은 아니었어요! 그래서 진한 메이크업이나  워터프루프 제품을 자주 사용하는 분들은 포인트 리무버나 2차 세안을 함께 하는 게  더 잘 맞을 것 같아요 👀 저는 원래도 2차 세안을 하는 편이라  크게 불편하진 않았지만, 깔끔하게 “한 번에 싹 지워지는 느낌”을 선호하는  분들에겐 조금 순하게 느껴질 수도 있을 것 같아요 🙂 다만 그만큼 자극이 적다는 장점도 확실해서 민감성 피부인 저한테는 오히려 장점처럼 느껴졌어요 🫶",en:"I've used it for about a week now, and personally I was really satisfied with this cleansing product 💙\n\nMy skin is quite sensitive, but because of breakouts, scars, and marks I usually wear heavy base makeup, so I always do a thorough second cleanse 🥲 But if I use the wrong cleansing product, my skin flares up right away or my face burns after washing - this product, true to being from a 'calming' line, felt really gentle to use 🌿 Being a cleansing milk type, I especially liked how it rolled on gently and cleansed without irritation! That said, it doesn't feel weak in cleansing power either, so I could use it without feeling stuffy even after makeup ✨There isn't much tightness after washing either, so lately when my skin is sensitive I've reached for it more often 😊\n\n👉 I'd recommend this to people with sensitive skin who wear makeup often and whose skin is worn out 💡Honestly I think I'll buy it with my own money once I finish this one 💸💙\n\nOverall I was satisfied using it, but since it is a cleansing milk type 👉 it's not the type that removes everything with one powerful swipe! So people who often wear heavy makeup or waterproof products would probably do better pairing it with a point remover or second cleanse 👀 I already do a second cleanse anyway so it wasn't a big inconvenience, but for people who prefer the feeling of 'wiping everything off in one go' cleanly, it might feel a bit too gentle. 🙂 But that same gentleness is a clear strength, and for someone with sensitive skin like me it actually felt like an advantage 🫶","zh-CN":"用了大概一周左右，个人觉得满意度真的很高的清洁产品💙\n\n我皮肤非常敏感，但因为痘痘、疤痕、痕迹的关系，平时底妆化得比较厚，所以一直都要仔细做二次清洁🥲 但清洁产品用错很容易马上爆皮，或者洗后脸发烫，这款正如名字所说是舒缓系列，使用感真的很温和🌿 是洁面乳类型，能在皮肤上柔软打圈，无刺激洁面的感觉特别好！但也不是清洁力弱的感觉，化妆之后用也不会觉得闷✨洗后紧绷也不严重，最近皮肤敏感的时候反而更常用。😊\n\n👉 想推荐给敏感肌+经常化妆导致皮肤疲惫的朋友💡说实话如果用完了我可能会自己掏钱买💸💙\n\n整体用得很满意，但毕竟是洁面乳类型，👉 不是那种一次就能超强力卸干净的感觉！所以经常化浓妆或用防水产品的人，可能更适合搭配点妆卸妆液或二次清洁👀 我本来就习惯二次清洁，所以没什么不便，但喜欢那种'一次就干净卸掉'的人可能会觉得有点温和。🙂 不过正因为这样刺激也少，对我这种敏感肌来说反而是优点🫶","zh-TW":"用了大約一週，個人覺得滿意度非常高的卸妝產品 💙\n\n我皮膚算是很敏感，但因為痘痘、疤痕、痕跡的關係，平常底妝畫得比較厚，所以一直都會仔細做二次清潔 🥲不過只要卸妝產品用錯，很容易馬上爆痘或洗完臉臉會發燙，這款產品可能因為是舒緩系列，使用感真的很溫和 🌿是卸妝乳類型，在皮膚上柔順打圈、無刺激卸妝的感覺特別喜歡！但也不會覺得潔淨力弱，化完妝用起來也不會有卸不乾淨的悶悶感 ✨洗完臉緊繃感也不算嚴重，最近皮膚敏感的時候反而更常拿來用 😊\n\n👉 想推薦給敏感肌+常常化妝讓皮膚很疲憊的人 💡老實說如果用完了我應該會自己掏錢回購 💸💙\n\n整體用得很滿意，不過畢竟是卸妝乳類型 👉 不是那種一次就能超強力卸乾淨的感覺！所以常畫濃妝或用防水產品的人，搭配重點卸妝液或二次清潔會更適合 👀 我本來就會做二次清潔，所以不算太不方便，但喜歡「一次就整個卸乾淨」那種爽快感的人，可能會覺得偏溫和 🙂 不過正因為這樣刺激也真的比較少，對我這種敏感肌來說反而是優點 🫶",ja:"約1週間ほど使ってみましたが、個人的に本当に満足度が高かったクレンジング製品でした💙\n\n私は肌がとても敏感な方なのに、トラブル、傷跡、跡があるせいで普段ベースメイクを厚めにする方なので、いつも2回目の洗顔まで丁寧にするスタイルなんです🥲でもクレンジング製品を間違えるとすぐ肌が荒れたり洗顔後に顔がヒリヒリすることが多かったのですが、この製品は名前の通り鎮静ラインだからか使用感が本当にマイルドでした🌿クレンジングミルクタイプで肌に優しくローリングされて刺激なく洗顔できる感じが特に良かったです！だからといって洗浄力が弱い感じではないので、メイクをした後も物足りなさなく使うことができました✨洗顔後のつっぱりもひどくない方なので、最近のように肌が敏感なとき、より手が伸びました😊\n\n👉敏感肌+頻繁なメイクで肌が疲れている方におすすめしたい製品です💡正直、使い切ったら自腹で買いそうだなと思いました💸💙\n\n全体的に満足して使いましたが、やはりクレンジングミルクタイプなので👉一度でものすごく強力に落ちる感じではありませんでした！なので濃いメイクやウォータープルーフ製品をよく使う方はポイントリムーバーや2回目の洗顔を併用する方が合うと思います👀私はもともと2回目の洗顔をする方なので特に不便ではありませんでしたが、すっきり「一度でさっと落ちる感じ」を好む方には少しマイルドに感じるかもしれません🙂ただそれだけ刺激が少ないという長所も確実にあるので、敏感肌の私にはむしろ長所のように感じました🫶",th:"ใช้มาประมาณหนึ่งสัปดาห์แล้ว ส่วนตัวพอใจกับผลิตภัณฑ์คลีนซิ่งตัวนี้มากจริงๆ ค่ะ 💙\n\nฉันเป็นผิวที่แพ้ง่ายมาก แต่เพราะมีสิว รอยแผลเป็น รอยดำ เลยมักแต่งหน้าเบสหนา จึงต้องล้างหน้าครั้งที่สองอย่างละเอียดเสมอ 🥲 แต่ถ้าใช้ผลิตภัณฑ์คลีนซิ่งผิด ผิวมักเห่อทันทีหรือหน้าร้อนวูบวาบหลังล้างหน้า แต่ผลิตภัณฑ์นี้สมชื่อไลน์ปลอบประโลม ความรู้สึกเมื่อใช้อ่อนโยนจริงๆ 🌿 เป็นเนื้อคลีนซิ่งมิลค์ นวดคลึงบนผิวได้นุ่มนวลและล้างหน้าโดยไม่ระคายเคือง ชอบเป็นพิเศษ! แต่ก็ไม่ได้รู้สึกว่าแรงทำความสะอาดอ่อนเกินไป ใช้หลังแต่งหน้าก็ไม่รู้สึกอึดอัดเลย ✨หลังล้างหน้าก็ไม่ค่อยตึง เลยหยิบใช้บ่อยขึ้นช่วงที่ผิวไวต่อสิ่งเร้าแบบนี้ 😊\n\n👉 อยากแนะนำสำหรับคนผิวแพ้ง่าย + คนที่ผิวเหนื่อยล้าจากการแต่งหน้าบ่อยๆ 💡พูดตรงๆ คิดว่าถ้าใช้หมดคงต้องซื้อเองแน่นอน 💸💙\n\nโดยรวมพอใจกับการใช้มาก แต่เพราะเป็นเนื้อคลีนซิ่งมิลค์ 👉 ก็ไม่ได้รู้สึกว่าล้างออกหมดจดแรงมากในครั้งเดียว! เลยคิดว่าคนที่แต่งหน้าเข้มข้นหรือใช้ผลิตภัณฑ์วอเตอร์พรูฟบ่อยๆ น่าจะเหมาะกับการใช้รีมูฟเวอร์เฉพาะจุดหรือล้างหน้าครั้งที่สองเพิ่มเติมมากกว่า 👀 ฉันเองก็ล้างหน้าครั้งที่สองอยู่แล้วเลยไม่ค่อยรู้สึกไม่สะดวกอะไร แต่คนที่ชอบความรู้สึก \"ล้างออกหมดจดในครั้งเดียว\" อาจจะรู้สึกว่าอ่อนโยนไปนิดหน่อย 🙂 แต่ในทางกลับกัน ข้อดีที่ระคายเคืองน้อยก็ชัดเจนมาก สำหรับฉันที่เป็นผิวแพ้ง่าย กลับรู้สึกว่าเป็นข้อดีมากกว่า 🫶"},images:["thumbnail/reviews/milk/Z04B2j1Z_1.jpg","thumbnail/reviews/milk/Z04B2j1Z_2.jpg"],video:null},
    {id:"A7w3M00A",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"건성/민감, 타 제품 대비 잔여감 없음 - 이중세안 불필요 체감 (영상+이미지 3장)",en:"Dry/sensitive, no residue compared to other products - felt no need for double cleansing (video + 3 photos)","zh-CN":"干皮/敏感，相比其他产品无残留感 - 感受到无需二次清洁（视频+3张图片）","zh-TW":"乾性/敏感，相較其他產品沒有殘留感 - 感受到不需要二次清潔（含影片+附圖3張）",ja:"乾燥肌/敏感肌、他製品に比べて残留感なし - ダブル洗顔不要と実感(動画+画像3枚)",th:"ผิวแห้ง/แพ้ง่าย ไม่มีคราบตกค้างเทียบกับผลิตภัณฑ์อื่น - รู้สึกว่าไม่จำเป็นต้องล้างหน้าสองครั้ง (มีวิดีโอ+รูป 3 ภาพ)"},date:"2026-06-09",
      quote:{ko:"친구의 강력 추천으로!! 구매하게 되었는데요\n써보자마자 만족이었습니다 (*'▽'*)\n\n원래 다른 클렌징 밀크 썼었는데 항상 잔여감이 있어서 찝찝해서 이중 세안 했었어요. 근데 이건 진짜 깨끗하게 씻기는 느낌이라 굳이 클렌징 폼 안해도 될 것 같아요 ㅎㅎ\n\n세안하고 나면 뭔가 뽀용 촉촉하달까? 마무리감이 정말 좋았습니당 다쓰면 재구매 예정이에요\n\n아 참고로 저는 예민한 편인 건성입니다 (｡•̀ᴗ-)✧",en:"Bought this on my friend's strong recommendation!!\nAnd I was satisfied the moment I tried it (*'▽'*)\n\nI used to use a different cleansing milk that always left residue, so it felt icky and I'd double cleanse. But with this one, it genuinely feels like it washes off cleanly, so I don't think I even need a cleansing foam ㅎㅎ\n\nAfter washing my face, it feels sort of plump and moist, if that makes sense? The finish was really good. I'll repurchase once I finish this one\n\nOh by the way, I'm on the dry side and a bit sensitive (｡•̀ᴗ-)✧","zh-CN":"因为朋友的强烈推荐！！才买了这款\n用了之后马上就很满意(*'▽'*)\n\n本来用的是其他家的洁面乳，总是有残留感，觉得不舒服所以都要做二次清洁。但这款真的是清洗得很干净的感觉，感觉不用特意再用洁面泡沫了呵呵\n\n洗完脸有种蓬松水润的感觉？收尾感真的很好。用完打算回购。\n\n啊顺便说一下，我是偏敏感的干皮 (｡•̀ᴗ-)✧","zh-TW":"因為朋友大力推薦而買的!!\n一用就很滿意 (*'▽'*)\n\n我原本用其他卸妝乳，總覺得有殘留感、不太舒服，所以會做二次清潔。但這款真的洗得很乾淨，感覺不用特別再用洗面乳也可以ㅎㅎ\n\n洗完臉之後有種蓬鬆水潤的感覺？收尾感真的很好。用完應該會回購。\n\n啊，順便說一下我是偏敏感的乾性肌 (｡•̀ᴗ-)✧",ja:"友達の強力なおすすめで！！購入することになりました\n使ってみてすぐ満足でした(*'▽'*)\n\nもともと他のクレンジングミルクを使っていましたが、いつも残留感があってべたつくのでダブル洗顔していました。でもこれは本当にきれいに洗い流せる感じで、あえて洗顔フォームをしなくても良さそうです(笑)\n\n洗顔した後、なんかふわっとしっとりするというか?仕上がりが本当に良かったです。使い切ったらリピート予定です\n\nあ、ちなみに私は敏感な方の乾燥肌です(｡•̀ᴗ-)✧",th:"เพื่อนแนะนำหนักมาก!! เลยตัดสินใจซื้อค่ะ\nพอลองใช้แล้วพอใจทันที (*'▽'*)\n\nปกติใช้คลีนซิ่งมิลค์ยี่ห้ออื่นแล้วมักมีคราบตกค้างจนรู้สึกไม่สะอาด เลยต้องล้างหน้าสองครั้งตลอด แต่ตัวนี้ล้างสะอาดจริงๆ จนรู้สึกว่าไม่ต้องใช้โฟมล้างหน้าเพิ่มก็ได้ ฮ่าๆ\n\nพอล้างหน้าเสร็จรู้สึกนุ่มฟูชุ่มชื้นยังไงดี? จบด้วยความรู้สึกที่ดีมากจริงๆ ค่ะ ใช้หมดแล้วจะซื้อซ้ำแน่นอน\n\nอ้อ บอกไว้ก่อนว่าฉันเป็นผิวแห้งที่ค่อนข้างแพ้ง่ายค่ะ (｡•̀ᴗ-)✧"},images:["thumbnail/reviews/milk/A7w3M00A_1.jpg","thumbnail/reviews/milk/A7w3M00A_2.jpg","thumbnail/reviews/milk/A7w3M00A_3.jpg"],video:"thumbnail/reviews/milk/A7w3M00A.mov"},
    {id:"Jy7L1xrq",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"건성, 선크림날 밀크/풀메이크업날 오일+폼 세안 루틴 비교 (이미지 2장)",en:"Dry skin, comparing routines - milk on sunscreen-only days vs. oil + foam on full-makeup days (2 photos)","zh-CN":"干皮，涂防晒的日子用洁面乳/全妆日用油+泡沫的洁面routine对比（附2张图片）","zh-TW":"乾性，擦防曬乳的日子用卸妝乳/全妝日用卸妝油+洗面乳的洗臉流程比較（附圖2張）",ja:"乾燥肌、日焼け止めのみの日はミルク/フルメイクの日はオイル+フォームで洗顔ルーティンを比較(画像2枚)",th:"ผิวแห้ง เปรียบเทียบรูทีนล้างหน้า วันทาครีมกันแดดใช้มิลค์/วันแต่งหน้าจัดเต็มใช้ออยล์+โฟม (มีรูป 2 ภาพ)"},date:"2026-05-30",
      quote:{ko:"평소에 선크림 정도만 발랐을 때는 클렌징 밀크, 풀 메이크업 했을 때는 클렌징 오일로 일차 세안 하고 폼으로 2차 세안 하고 있습니다. 거의 항상 클렌징 밀크 사용하고 있는데 이번 기회에 예전부터 궁금했던 클렌징 밀크 사용해 볼 수 있는 좋은 기회 얻어서 좋았습니다!\n\n⭐️향: 무향은 아니고 은은하게 포근한 향이 나는데 인공적이지 않아서 향에 민감하신 분들도 충분히 편하게 사용하실 수 있을 것 같아요! \n\n\n⭐️제형 및 사용감: 일반적인 클렌징 밀크같이 로션같은 제형이었습니다! 전체적으로 유화 시키기 전에 부드럽게 얼굴 전체적으로 롤링 해주고 유화 시켜서 한 번 더 롤링 해주는데 일반 클렌징 오일 같이 미끄러운 느낌이 안들고 부드럽게 노폐물 녹여주는 느낌이라 좋았습니다. 보통 클렌징 밀크가 오일보다 자극이 적기는 하나 다른 제품들보다도 더 자극이 적은 느낌이었어요.\n\n\n⭐️세안 후 보습감 및 자극정도: 일단 클렌징 밀크가 순하다고 하더라도 피부 자체에 자극이 좀 있었던 날이라던가 강하게 문지르면 피부가 붉어지기도 하고 당김이 느껴지기도 했는데 판테놀이 들어가서 그런지 어떤 제품들보다도 자극과 속당김이 없어서 정말 좋았어요! 진짜 건성 분들이나 예민한 피부를 갖고 계신 분들도 편안하게 사용할 수 있는 제품이라고 느꼈습니다.\n\n클렌징 밀크로 봤을 때 아쉬운 부분은 전혀 없었습니다 ! 원래 클렌징 밀크가 전체적으로 진한 메이크업을 지워주는 용도가 아니기 때문에 그 부분은 논외로 두고 봐야 한다고 생각합니다!",en:"Normally, on days I only wear sunscreen, I use a cleansing milk, and on full-makeup days I do a first cleanse with cleansing oil followed by a second cleanse with foam. I use cleansing milk almost all the time, so I was glad to get this chance to try a cleansing milk I'd been curious about for a while!\n\n⭐️Scent: It's not fragrance-free, but it has a subtle, cozy scent that doesn't feel artificial, so I think even people sensitive to scent could use it comfortably!\n\n⭐️Texture and feel: Like a typical cleansing milk, it had a lotion-like texture! I rolled it gently over my whole face before emulsifying, then emulsified and rolled it once more, and unlike a regular cleansing oil it didn't feel slippery, it felt like it gently melted away impurities, which I liked. Cleansing milks are generally less irritating than oil, but this one felt even less irritating than other products.\n\n⭐️Moisture and irritation level after cleansing: Even with a gentle cleansing milk, on days my skin itself was a bit irritated or if I rubbed too hard, my skin would get red or feel tight, but I think thanks to the Panthenol, this had less irritation and inner tightness than any other product I've tried! I really felt this is a product that people with genuinely dry or sensitive skin can use comfortably.\n\nAs a cleansing milk, there was nothing I was dissatisfied with! Since a cleansing milk isn't generally meant to remove heavy makeup, I think that point should be set aside and not counted against it!","zh-CN":"平时只涂防晒的日子用洁面乳，化全妆的日子用卸妆油做一次清洁，再用泡沫做二次清洁。几乎一直都在用洁面乳，这次刚好有机会尝试一直很好奇的洁面乳，很开心！\n\n⭐️香味：不是完全无香，有淡淡的温暖香味，不是人工香，对香味敏感的人应该也能放心使用！\n\n⭐️质地及使用感：是一般洁面乳那样的乳液质地！乳化前先在整个脸上柔软打圈，再乳化后再打圈一次，不像一般卸妆油那样滑腻，而是温和溶解废物的感觉，很喜欢。一般来说洁面乳比油类刺激少，但这款感觉比其他产品刺激更少。\n\n⭐️洗后保湿感及刺激程度：就算洁面乳再温和，皮肤本身有点刺激的日子或者用力搓的话还是会泛红或紧绷，但可能是含有泛醇的关系，这款比其他产品都更没有刺激和内干紧绷，真的很好！真心觉得干皮或敏感肌的朋友都能舒适使用。\n\n作为洁面乳来看完全没有不满意的地方！本来洁面乳整体上就不是用来卸浓妆的，这一点应该要另外看待！","zh-TW":"平常只擦防曬乳的時候用卸妝乳，畫全妝的時候用卸妝油一次卸妝、再用洗面乳二次清潔。幾乎都在用卸妝乳，這次剛好有機會試用一直很好奇的卸妝乳，很開心！\n\n⭐️香味：不是無香，但有淡淡的溫暖香氣，不是人工的感覺，對香味敏感的人應該也能舒服使用！\n\n\n⭐️質地與使用感：是一般卸妝乳常見的乳液質地！乳化之前先在整臉柔順打圈，再乳化後多打圈一次，不像一般卸妝油那樣滑滑的，而是柔順地溶解老廢物的感覺，很喜歡。一般卸妝乳本來就比油類刺激少，但這款感覺比其他產品更少刺激。\n\n\n⭐️洗後保濕感與刺激程度：就算卸妝乳再溫和，如果那天皮膚本身有點刺激，或用力搓揉，皮膚還是會泛紅或緊繃，但可能因為含有泛醇，比起其他產品，刺激和內在緊繃感都比較少，真的很喜歡！真心覺得乾性肌或敏感肌的人用起來也會很舒服。\n\n以卸妝乳來說完全沒有不滿意的地方！本來卸妝乳整體來說就不是拿來卸濃妝的，這點應該要另外看待！",ja:"普段日焼け止め程度しか塗らないときはクレンジングミルク、フルメイクをしたときはクレンジングオイルで1回目の洗顔をしてフォームで2回目の洗顔をしています。ほとんどいつもクレンジングミルクを使っているのですが、今回以前から気になっていたクレンジングミルクを試せる良い機会をいただけて良かったです！\n\n⭐️香り：無香ではなく、ほのかで温かみのある香りがしますが、人工的ではないので香りに敏感な方も十分快適に使えそうです！ \n\n\n⭐️テクスチャー・使用感：一般的なクレンジングミルクのようにローションのようなテクスチャーでした！全体的に乳化させる前に優しく顔全体をローリングし、乳化させてもう一度ローリングするのですが、普通のクレンジングオイルのようなぬるつく感じがなく優しく老廃物を溶かしてくれる感じで良かったです。普通クレンジングミルクはオイルより刺激が少ないですが、他の製品よりもさらに刺激が少ない感じでした。\n\n\n⭐️洗顔後の保湿感&刺激度：クレンジングミルクがマイルドとはいえ、肌自体に刺激があった日や強くこすると肌が赤くなったりつっぱりを感じたりすることもありましたが、パンテノールが入っているからか、他のどの製品よりも刺激とつっぱりがなくて本当に良かったです！本当に乾燥肌の方や敏感肌の方も快適に使える製品だと感じました。\n\nクレンジングミルクとして見て残念な部分は全くありませんでした！もともとクレンジングミルクは濃いメイクを全体的に落とす用途ではないので、その部分は別として見るべきだと思います！",th:"ปกติวันที่ทาแค่ครีมกันแดดจะใช้คลีนซิ่งมิลค์ ส่วนวันที่แต่งหน้าจัดเต็มจะล้างหน้าครั้งแรกด้วยคลีนซิ่งออยล์แล้วล้างครั้งที่สองด้วยโฟม แทบจะใช้คลีนซิ่งมิลค์เป็นหลักตลอด ครั้งนี้ได้โอกาสดีมาลองคลีนซิ่งมิลค์ที่อยากลองมานานแล้วเลยดีใจมาก!\n\n⭐️กลิ่น: ไม่ถึงกับไม่มีกลิ่นเลย แต่มีกลิ่นอบอุ่นอ่อนๆ ไม่รู้สึกสังเคราะห์ คนที่แพ้กลิ่นง่ายก็น่าจะใช้ได้อย่างสบายใจ! \n\n\n⭐️เนื้อสัมผัสและความรู้สึกเมื่อใช้: เป็นเนื้อโลชั่นเหมือนคลีนซิ่งมิลค์ทั่วไป! ก่อนทำอิมัลชันจะนวดคลึงทั่วหน้าอย่างนุ่มนวลก่อน แล้วทำอิมัลชันแล้วนวดคลึงอีกครั้ง ไม่รู้สึกลื่นแบบคลีนซิ่งออยล์ทั่วไป แต่รู้สึกว่าละลายสิ่งสกปรกออกอย่างนุ่มนวล ชอบมาก ปกติคลีนซิ่งมิลค์จะระคายเคืองน้อยกว่าออยล์อยู่แล้ว แต่ตัวนี้รู้สึกว่าระคายเคืองน้อยกว่าผลิตภัณฑ์อื่นๆ อีก\n\n\n⭐️ความชุ่มชื้นและระดับการระคายเคืองหลังล้างหน้า: ปกติแม้คลีนซิ่งมิลค์จะอ่อนโยน แต่ถ้าวันที่ผิวมีการระคายเคืองอยู่แล้วหรือถูแรงไป ผิวก็มักจะแดงหรือตึง แต่ตัวนี้อาจเพราะมีแพนธีนอล เลยระคายเคืองและตึงน้อยกว่าผลิตภัณฑ์อื่นๆ ชอบมากจริงๆ! รู้สึกว่าเป็นผลิตภัณฑ์ที่คนผิวแห้งหรือผิวแพ้ง่ายใช้ได้อย่างสบายใจจริงๆ\n\nในฐานะคลีนซิ่งมิลค์แล้วไม่มีจุดที่น่าผิดหวังเลย! ปกติคลีนซิ่งมิลค์ก็ไม่ได้มีไว้สำหรับล้างเมคอัพเข้มข้นอยู่แล้ว เลยคิดว่าจุดนั้นควรมองข้ามไปได้!"},images:["thumbnail/reviews/milk/Jy7L1xrq_1.jpg","thumbnail/reviews/milk/Jy7L1xrq_2.jpg"],video:null},

      quote:{ko:"사용기간: 1.5주 (26.6.13~26.6.24)\n30대 / 건성 / 민감성 / 홍조 / 약한 모낭염, 피부염 등\n\n버블이 아주 쫀쫀한 편입니다. 오일이 포함된 버블이라 그럼 클렌징오일 사용하듯이 물을 묻히지 않고 사용해야하나? 싶어서 그렇게 해봤더니 예전에 사용했던 오일투폼 클렌져처럼 피부 위에서 뻑뻑함이 느껴지더라구요. 그래서 무조건 얼굴에 물을 묻히고 살살 문질렀더니 자극 없이 잘 쓸 수 있었습니다.\n공식 판매처에 가서 확인해봤더니 사용 방법에 얼굴에 물을 묻히고 사용하라고 되어있더라구요.\n\n약산성이라 확실히 세안 후에도 촉촉합니다. 다만 피부 컨디션에 따라서 살짝의 당김은 있을 수 있을 것 같아요. 평소에 사용할 때는 당기는 느낌은 거의 못느껴봤었는데 오늘 사용했을 때는 약간 당기는 느낌이 있었습니다.\n\n그리고 선크림 사용 후에 2차 세안 없이 버블 클렌져 단독으로 사용했을 때 다음 날 트러블이 나거나 한 것 없었고 세안 후 얼굴에 남아있는 느낌도 없었습니다.\n\n눈 따가움은 전혀 없습니다. 사용하면서 일부러 테스트하려고 눈 깜빡이고 문질러보고 해봤는데 전혀 따가운 느낌 없었습니다.\n\n오일이 함유되어있는게 확실히 장점이다 라고 느낄만한 점은 코에 표면 위로 나온 피지가 정돈된다는 것입니다. 클렌징 오일 사용한다는 느낌으로 한 20초쯤 코를 문지르면 코에 박혀있는 블랙헤드가 빠지는 정도는 아니지만 오돌토돌하게 느껴지던 피지가 매끈하게 정돈된 느낌을 받을 수 있었습니다. 또 사용 직후에는 블랙헤드도 아주 살짝 옅어진 것 같은 느낌도 들어요. \n\n저는 조금만 잘못 처치하면 바로 다음 날 모낭염이나 피부염이 재발하기 때문에 각질제거는 오직 세안제로만 합니다. 이 제품은 약산성인데도 꽤 세안 효과가 좋은 것 같습니다.",en:"Usage period: 1.5 weeks (6/13-6/24, '26)\n30s / dry / sensitive / redness / mild folliculitis, dermatitis, etc.\n\nThe bubble is quite firm. Since it's a bubble with oil in it, I wondered if I should use it dry like a cleansing oil, without wetting my face - I tried that and it felt stiff on my skin, like the old oil-to-foam cleansers I used to use. So I made sure to wet my face with water first and rub gently, and then I could use it without irritation.\nI checked with the official seller and it does say in the instructions to wet your face with water before use.\n\nBeing mildly acidic, my skin definitely feels moist even after washing. That said, depending on skin condition there can be slight tightness. I usually barely notice any tightness, but today I did feel a slight tightness when using it.\n\nAlso, after sunscreen, when I used the bubble cleanser alone with no second cleanse, I had no breakouts the next day, and there was no residue left on my face after washing.\n\nThere's absolutely no eye stinging. I intentionally tested this by blinking and rubbing while using it, and I felt zero stinging.\n\nOne clear advantage I felt from it containing oil is that the sebum surfacing on my nose gets refined. Rubbing my nose for about 20 seconds like using a cleansing oil doesn't pop out blackheads exactly, but the bumpy sebum texture felt smoothed out. And right after use, the blackheads also looked very slightly lighter.\n\nSince even a small misstep triggers folliculitis or dermatitis the very next day for me, I only exfoliate through my cleanser. This product is mildly acidic yet still seems to have quite good cleansing effect.","zh-CN":"使用时间：1.5周（26.6.13~26.6.24）\n30多岁/干皮/敏感性/泛红/轻度毛囊炎、皮炎等\n\n气泡相当浓密。因为含油的气泡产品，我一开始以为是不是要像用卸妆油那样不沾水使用？结果那样一试，就像以前用过的油转泡沫洁面一样，皮肤上有种干涩感。所以后来一律先沾水再轻轻揉搓，就能无刺激地使用了。\n去官方旗舰店确认了一下，使用方法上写着要先沾水再使用。\n\n是弱酸性，洗后确实很水润。不过根据皮肤状态，可能会有轻微紧绷感。平时用的时候几乎没感觉到紧绷，但今天用的时候有点轻微的紧绷感。\n\n还有，涂了防晒之后不做二次清洁、单独用气泡洁面的话，第二天也没有长痘，洗完脸后脸上也没有残留感。\n\n完全没有呛眼。用的时候特意测试了一下，眨眼、揉搓都试了，完全没有刺痛感。\n\n含油这点确实感受到明显优点的地方是，能整理鼻子表面冒出的皮脂。用像用卸妆油那样的手法在鼻子上打圈约20秒，虽然不至于把嵌在里面的黑头挤出来，但能感觉到原本粗糙的皮脂被整理得光滑很多。而且用完之后马上感觉黑头好像也变淡了一点点。\n\n我这种皮肤只要稍微处理不当，第二天就会立刻复发毛囊炎或皮炎，所以去角质只靠洁面产品来做。这款虽然是弱酸性，但洁面效果感觉相当不错。","zh-TW":"使用期間：1.5週（26.6.13~26.6.24）\n30多歲／乾性／敏感性／泛紅／輕微毛囊炎、皮膚炎等\n\n氣泡質地相當紮實。因為含油的氣泡，是不是要像用卸妝油那樣不沾水使用？我試了一下，結果像以前用過的油轉泡沫潔顏產品一樣，在皮膚上會有乾澀感。後來一定先沾濕臉再輕輕搓揉，就能無刺激地使用了。\n去官方通路確認了一下，使用方法上確實寫著要先沾濕臉再使用。\n\n因為是弱酸性，洗完臉後真的很水潤。不過依膚況不同可能會有輕微緊繃感。平常用的時候幾乎感覺不到緊繃，但今天用的時候有一點點緊繃感。\n\n而且擦完防曬乳後不做二次清潔，只單獨用這款氣泡潔顏，隔天也沒有長痘痘，洗完臉後臉上也沒有殘留感。\n\n完全不會刺眼。使用時我特地測試眨眼、搓揉，完全沒有刺痛感。\n\n含油這一點確實有個優點，就是能把鼻子表面浮出的皮脂整理乾淨。用像卸妝油那樣的方式在鼻子上打圈約20秒，雖然不到能把卡住的黑頭挖出來的程度，但原本粗糙的皮脂感會變得滑順。而且用完之後感覺黑頭好像也稍微淡了一點。\n\n我只要處理不當隔天就會馬上復發毛囊炎或皮膚炎，所以去角質只靠洗臉產品完成。這款雖然是弱酸性，但洗臉效果好像相當不錯。",ja:"使用期間：1.5週間(26.6.13〜26.6.24)\n30代/乾燥肌/敏感肌/赤み/軽い毛嚢炎、皮膚炎など\n\nバブルがかなりとろみのある方です。オイルが含まれたバブルなので、クレンジングオイルを使うときのように水をつけずに使うべきなのかな?と思ってそうしてみたら、以前使っていたオイル→フォームのクレンザーのように肌の上でゴワゴワした感じがしました。それで必ず顔に水をつけて優しくこすったら刺激なくうまく使うことができました。\n公式販売店で確認してみたら、使用方法に顔に水をつけて使うように書かれていました。\n\n弱酸性なので確かに洗顔後もしっとりします。ただ肌コンディションによって少しつっぱることもありそうです。普段使うときはつっぱる感じをほとんど感じませんでしたが、今日使ったときは少しつっぱる感じがありました。\n\nそして日焼け止め使用後に2回目の洗顔なしでバブルクレンザー単独で使ったとき、翌日トラブルが出ることもなく、洗顔後に顔に何か残っている感じもありませんでした。\n\n目のしみは全くありません。使いながらわざとテストしようと目を瞬きさせたりこすったりしてみましたが、全くしみる感じはありませんでした。\n\nオイルが含まれているのが確実にメリットだと感じられる点は、鼻の表面に出た皮脂が整うことです。クレンジングオイルを使う感覚で20秒ほど鼻をこすると、鼻に詰まった黒ずみが取れるほどではありませんが、ザラザラしていた皮脂が滑らかに整った感じを受けました。また使用直後は黒ずみもほんの少し薄くなった感じもします。\n\n私はちょっと間違った処置をするとすぐ翌日に毛嚢炎や皮膚炎が再発するので、角質ケアは洗顔料だけで行います。この製品は弱酸性なのにかなり洗顔効果が良いと思います。",th:"ระยะเวลาที่ใช้: 1.5 สัปดาห์ (13-24 มิ.ย. 26)\nวัย 30 กว่า / ผิวแห้ง / แพ้ง่าย / ผื่นแดง / รูขุมขนอักเสบเล็กน้อย ผิวอักเสบ ฯลฯ\n\nฟองค่อนข้างหนึบแน่น เพราะมีออยล์ผสมอยู่ในบับเบิล เลยลองใช้แบบไม่เติมน้ำเหมือนใช้คลีนซิ่งออยล์ดู ปรากฏว่ารู้สึกฝืดบนผิวเหมือนใช้คลีนเซอร์ออยล์ทูโฟมที่เคยใช้ก่อนหน้านี้ เลยลองเติมน้ำที่หน้าก่อนแล้วนวดคลึงเบาๆ ดู ก็ใช้ได้ดีโดยไม่ระคายเคือง\nลองเช็คที่ช่องทางขายทางการดูแล้ว วิธีใช้ก็ระบุให้เติมน้ำที่หน้าก่อนใช้เหมือนกันค่ะ\n\nเป็นกรดอ่อนเลยชุ่มชื้นแน่นอนหลังล้างหน้า แต่ขึ้นอยู่กับสภาพผิวอาจมีตึงนิดหน่อย ปกติใช้แล้วแทบไม่รู้สึกตึงเลย แต่วันนี้ใช้แล้วรู้สึกตึงนิดหน่อย\n\nแล้วพอทาครีมกันแดดแล้วใช้บับเบิลคลีนเซอร์อย่างเดียวโดยไม่ล้างหน้าครั้งที่สอง วันรุ่งขึ้นก็ไม่มีสิวขึ้นและไม่มีคราบตกค้างบนหน้าเลย\n\nไม่แสบตาเลยสักนิด ระหว่างใช้ตั้งใจทดสอบด้วยการกะพริบตาและถูดูแล้ว ไม่รู้สึกแสบเลย\n\nจุดที่รู้สึกว่ามีออยล์เป็นข้อดีแน่นอนคือ ไขมันส่วนเกินที่ผุดขึ้นมาบนผิวจมูกถูกจัดการให้เรียบเนียนขึ้น พอนวดคลึงจมูกประมาณ 20 วินาทีเหมือนใช้คลีนซิ่งออยล์ แม้จะไม่ถึงกับทำให้หัวสิวอุดตันดำที่ฝังลึกหลุดออก แต่ก็รู้สึกได้ว่าไขมันที่เคยขรุขระเรียบเนียนขึ้น แถมหลังใช้ทันทีก็รู้สึกว่าหัวสิวอุดตันดำจางลงนิดหน่อยด้วย \n\nถ้าจัดการผิดพลาดนิดเดียวจะกลับมาเป็นรูขุมขนอักเสบหรือผิวอักเสบในวันถัดไปทันที เลยขจัดขุยผิวด้วยตัวล้างหน้าเท่านั้น ผลิตภัณฑ์นี้แม้เป็นกรดอ่อนก็ยังมีประสิทธิภาพการล้างหน้าที่ดีทีเดียว"},images:[],video:null},
    {id:"qPgLp4nZ",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"여드름·모공·레이저제모 부위 - 자극/트러블 없이 데일리 사용",en:"Acne/pores/laser hair removal area - no irritation or trouble with daily use","zh-CN":"痘痘·毛孔·激光脱毛部位 - 无刺激/不长痘的日常使用","zh-TW":"痘痘‧毛孔‧雷射除毛部位 - 無刺激無肌膚困擾的日常使用",ja:"ニキビ・毛穴・レーザー脱毛部位 - 刺激・トラブルなくデイリー使用",th:"สิว·รูขุมขน·บริเวณเลเซอร์กำจัดขน - ใช้เป็นประจำได้โดยไม่ระคายเคือง/ไม่เกิดสิว"},date:"2026-06-18",
      quote:{ko:"🫧 피부 타입: 수부지(수분 부족형 지성), 복합성\n🫧 피부 고민: 여드름 / 모공 / 피부장벽\n🫧 특이 사항: 하관 전체 레이저제모중\n🫧 구매 가격: 24000원\n\n❄️ 수분감/유분감\n세안 후 당김이 심한 편은 아니었고 피부가 편안한 느낌이 들었음 세정력은 괜찮은데 사용 후 건조함은 과하지 않아서 좋았어요\n\n❄️ 사용감\n사용 전에 흔들어주고 펌핑하면 풍성한 거품이 바로 나오는 방식이라 정말 편했음 평소에는 일반 클렌징폼을 거품기에 따로 사용해서 거품을 만들어 썼는데 이 제품은 그 과정이 필요 없어서 좋았어요 거품도 촘촘하고 부드러운 편이라 세안할 때 사용감이 만족스러웠음개인적으로 아침 세안용으로도 좋았어요\n\n❄️ 자극감/트러블 여부\n사용하면서 자극감은 거의 느끼지 못했고 트러블도 따로 올라오지 않았음 데일리 클렌저로 무난하게 사용 가능했어요\n\n❄️ 잔여감\n세안 후에는 미끌거리거나 찝찝한 느낌 없이 깔끔하게 마무리되는 편이었음\n\n❄️ 가성비\n정가 기준 24000원이라 엄청 저렴한 편은 아니지만 할인하면 더 가격 낮아질거고 거품기로 거품을 따로 만들 필요 없이 바로 사용할 수 있다는 점과 사용감을 생각하면 나쁘지 않은 편이라고 생각함\n\n❄️ 재구매 의사\n있음 사용하기 편한 점이 가장 마음에 들었고 세정력도 생각보다 괜찮고 아침세안용으로 사용중이라 재구매 의사 있어요\n\n🫧 총평\n개인적으로 가장 만족했던 부분은 사용 편의성이었음 흔들고 펌핑만 하면 풍성한 거품이 바로 나와서 거품기를 따로 사용할 필요가 없었고 세안 과정이 훨씬 편해졌어요 세정력도 생각보다 약하지 않고 깔끔하게 세안되는 편이라 만족스러웠고 자극도 크지 않아서 데일리 클렌저로 사용하기 좋은 제품이라고 생각해요 개인적으로 아침 세안용으로도 좋아요",en:"🫧 Skin type: Combination-oily (water-deficient oily), combination\n🫧 Skin concerns: Acne / pores / skin barrier\n🫧 Note: Currently doing laser hair removal on my whole lower face\n🫧 Purchase price: 24,000 won\n\n❄️ Moisture/oil\nTightness after washing wasn't severe, and my skin felt comfortable. Cleansing power was good, and dryness after use wasn't excessive, which I liked\n\n❄️ Feel of use\nShake before use, then pump for instant rich foam, which was really convenient. I usually used a regular cleansing foam with a separate foaming net to make lather, but with this product that step wasn't needed, which I liked. The foam is also dense and soft, so the feel while washing was satisfying, personally it was also good for morning cleansing\n\n❄️ Irritation/breakouts\nI barely felt any irritation while using it, and no breakouts came up either. Could use it comfortably as a daily cleanser\n\n❄️ Residue\nAfter washing, it finished cleanly with no slippery or icky feeling\n\n❄️ Value for money\nAt full price, 24,000 won isn't super cheap, but it'll be cheaper with a discount, and considering you don't need to make lather separately with a foaming net and can use it directly, plus the feel of use, I think it's not bad\n\n❄️ Repurchase intent\nYes, what I liked most was how convenient it is to use, the cleansing power was better than expected too, and I'm using it as my morning cleanser so I do intend to repurchase\n\n🫧 Overall review\nPersonally, what satisfied me most was the convenience of use. Just shake and pump and rich foam comes out right away, so I didn't need a separate foaming net, and washing became so much easier. The cleansing power wasn't as weak as I expected either and it cleanses cleanly, which was satisfying, and the irritation wasn't significant either, so I think it's a great product to use as a daily cleanser. Personally I also like it for morning cleansing","zh-CN":"🫧 肤质：水油皮（水分不足型油性肌），混合性\n🫧 肤质困扰：痘痘/毛孔/皮肤屏障\n🫧 特殊情况：下颌部位正在做激光脱毛\n🫧 购买价格：24000韩元\n\n❄️ 水润感/油腻感\n洗后紧绷感不严重，皮肤感觉很舒适。清洁力不错，用后也不会过度干燥，这点很好\n\n❄️ 使用感\n用前摇匀再按压，蓬松的泡沫立刻就出来了，真的很方便。平时用普通洁面泡沫要另外用起泡网打泡，这款不需要这个步骤，很喜欢。泡沫也细腻柔软，洗脸时使用感令人满意，个人觉得当早晨洁面用也很好\n\n❄️ 刺激感/是否长痘\n使用期间几乎感觉不到刺激，也没有额外长痘。当日常洁面产品用完全没问题\n\n❄️ 残留感\n洗后没有滑腻或不适的感觉，收尾很干净\n\n❄️ 性价比\n以原价24000韩元来说不算特别便宜，不过打折后价格会更低，加上不用另外用起泡网就能直接使用这点和使用感，觉得还算不错\n\n❄️ 回购意愿\n有。最喜欢的是使用便利，清洁力也比想象中不错，我当早晨洁面产品在用，有回购意愿\n\n🫧 总评\n个人最满意的部分是使用便利性。摇一摇按压一下蓬松的泡沫立刻就出来，不用另外用起泡网，洁面过程方便多了。清洁力也没有想象中弱，能干净洁面，很满意，刺激也不大，适合当日常洁面产品，个人也很适合当早晨洁面用","zh-TW":"🫧 膚質：外油內乾（水分不足型油性肌）、混合性\n🫧 肌膚困擾：痘痘／毛孔／皮膚屏障\n🫧 特殊狀況：下顎部位正在做雷射除毛\n🫧 購買價格：24000韓元\n\n❄️ 水潤感/油膩感\n洗完臉不算太緊繃，皮膚感覺很舒服。潔淨力不錯，用完之後也不會過度乾燥，這點很喜歡\n\n❄️ 使用感\n使用前搖一搖再按壓，馬上就有豐盈泡沫出來，真的很方便。我平常都要另外用起泡網打泡沫，這款完全不需要這個步驟，很喜歡。泡沫也很細緻柔軟，洗臉時使用感很滿意，個人覺得當早晨洗臉用也不錯\n\n❄️ 刺激感/肌膚困擾\n使用期間幾乎沒感覺到刺激，也沒有長痘痘。當日常潔顏產品使用毫無問題\n\n❄️ 殘留感\n洗完臉後不會滑膩或有不舒服的感覺，收尾很乾淨\n\n❄️ 性價比\n定價24000韓元不算特別便宜，但打折之後價格會更低，而且不用另外起泡就能直接使用，考慮到使用感，我覺得還不錯\n\n❄️ 回購意願\n有。使用方便這點我最喜歡，潔淨力也比想像中不錯，現在當早晨洗臉用，有回購意願\n\n🫧 總評\n個人最滿意的是使用便利性。搖一搖按壓就能馬上出現豐盈泡沫，不用另外起泡，洗臉過程輕鬆很多。潔淨力也沒有想像中弱，洗得很乾淨，很滿意，刺激也不大，適合當日常潔顏產品，個人覺得當早晨洗臉用也很不錯",ja:"🫧肌タイプ：インナードライ肌(水分不足型脂性肌)、混合肌\n🫧肌の悩み：ニキビ/毛穴/肌バリア\n🫧特記事項：下顎全体レーザー脱毛中\n🫧購入価格：24,000ウォン\n\n❄️水分感/油分感\n洗顔後のつっぱりがひどい方ではなく、肌が快適な感じがしました。洗浄力は良いのに使用後の乾燥が過度でなくて良かったです\n\n❄️使用感\n使用前に振ってポンプすると豊かな泡がすぐ出てくる方式で本当に便利でした。普段は普通の洗顔フォームを泡立てネットで別に泡立てて使っていましたが、この製品はその過程が不要で良かったです。泡もきめ細かく柔らかい方で洗顔するとき使用感が満足でした。個人的に朝の洗顔用にも良かったです\n\n❄️刺激感/トラブルの有無\n使用中刺激感はほとんど感じず、トラブルも特に出ませんでした。デイリークレンザーとして無難に使うことができました\n\n❄️残留感\n洗顔後はぬるついたりべたつく感じなくすっきり仕上がる方でした\n\n❄️コスパ\n正価基準24,000ウォンなのですごく安いというわけではありませんが、割引すればもっと価格が下がりますし、泡立てネットで別に泡立てる必要なくすぐ使えるという点と使用感を考えると悪くない方だと思います\n\n❄️リピート意向\nあり。使いやすい点が一番気に入り、洗浄力も思ったより良く、朝の洗顔用として使っているのでリピート意向があります\n\n🫧総評\n個人的に一番満足だった部分は使いやすさでした。振ってポンプするだけで豊かな泡がすぐ出てくるので泡立てネットを別に使う必要がなく、洗顔過程がずっと楽になりました。洗浄力も思ったより弱くなくすっきり洗顔できる方で満足でしたし、刺激も大きくないのでデイリークレンザーとして使うのに良い製品だと思います。個人的に朝の洗顔用にも良いです",th:"🫧 ประเภทผิว: ผิวมันขาดน้ำ (ผิวมันแต่ขาดความชุ่มชื้น) ผิวผสม\n🫧 ปัญหาผิว: สิว / รูขุมขน / เกราะผิว\n🫧 หมายเหตุ: กำลังทำเลเซอร์กำจัดขนบริเวณคางล่างทั้งหมด\n🫧 ราคาที่ซื้อ: 24,000 วอน\n\n❄️ ความชุ่มชื้น/ความมัน\nหลังล้างหน้าไม่ค่อยตึงมาก รู้สึกสบายผิว แรงทำความสะอาดโอเค แต่หลังใช้ไม่แห้งเกินไป ชอบมาก\n\n❄️ ความรู้สึกเมื่อใช้\nก่อนใช้เขย่าแล้วกดปั๊ม ฟองฟูออกมาทันทีเลย สะดวกมาก ปกติต้องใช้ที่ตีฟองแยกกับโฟมล้างหน้าทั่วไป แต่ตัวนี้ไม่ต้องผ่านขั้นตอนนั้นเลยชอบมาก ฟองก็ละเอียดและนุ่มนวล ความรู้สึกเมื่อล้างหน้าน่าพอใจ ส่วนตัวใช้ล้างหน้าตอนเช้าก็ดีด้วย\n\n❄️ การระคายเคือง/สิว\nระหว่างใช้แทบไม่รู้สึกระคายเคืองเลย และไม่มีสิวขึ้นเลย ใช้เป็นคลีนเซอร์ประจำวันได้แบบไม่มีปัญหา\n\n❄️ คราบตกค้าง\nหลังล้างหน้าไม่ลื่นเหนอะหนะหรือไม่สบายผิว จบอย่างสะอาดหมดจด\n\n❄️ ความคุ้มค่า\nราคาปกติ 24,000 วอน ไม่ได้ถูกมากเป็นพิเศษ แต่ถ้ามีส่วนลดก็ราคาจะลดลงอีก แล้วไม่ต้องใช้ที่ตีฟองแยก ใช้ได้ทันที บวกกับความรู้สึกเมื่อใช้ คิดว่าไม่แย่เลย\n\n❄️ ความตั้งใจซื้อซ้ำ\nมี ชอบที่สุดคือความสะดวกในการใช้ แรงทำความสะอาดก็ดีกว่าที่คิด กำลังใช้ล้างหน้าตอนเช้าอยู่ เลยมีความตั้งใจจะซื้อซ้ำ\n\n🫧 สรุป\nส่วนตัวพอใจที่สุดในเรื่องความสะดวกในการใช้ แค่เขย่าแล้วกดปั๊มก็ได้ฟองฟูทันที ไม่ต้องใช้ที่ตีฟองแยก ทำให้ขั้นตอนล้างหน้าสะดวกขึ้นเยอะ แรงทำความสะอาดก็ไม่อ่อนอย่างที่คิด ล้างหน้าได้สะอาดหมดจด พอใจมาก แล้วไม่ระคายเคืองมาก คิดว่าเป็นผลิตภัณฑ์ที่เหมาะกับใช้เป็นคลีนเซอร์ประจำวัน ส่วนตัวใช้ล้างหน้าตอนเช้าก็ดีด้วย"},images:[],video:null},
    {id:"Zlyn4nEq",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"수부지/호르몬성 좁쌀·각질뜸 - 5분 이상 맨얼굴에도 당김 없음",en:"Combination-oily/hormonal bumps and flaky skin - no tightness even after 5+ minutes bare-faced","zh-CN":"水油皮/激素性闭口·脱皮 - 素颜超过5分钟也不紧绷","zh-TW":"外油內乾/賀爾蒙型粉刺‧角質浮起 - 光著臉超過5分鐘也不緊繃",ja:"インナードライ肌/ホルモン性の細かいニキビ・粉吹き - 5分以上素肌でもつっぱりなし",th:"ผิวมันขาดน้ำ/สิวเสี้ยนจากฮอร์โมน·ขุยลอก - หน้าเปล่าเกิน 5 นาทีก็ไม่ตึง"},date:"2026-06-18",
      quote:{ko:"6/10-6/11 아침 저녁 두번 사용해봤어요\n저는 흉이 있는 모공피부, 수부지에요 \n이제 여드름은 잘안나지만 호르몬 주기, 또는 요즘처럼 날씨가 바뀌면 좁쌀이 올라오고 선크림만 발라도 하얗게 각질이 뜬것처럼 피부가 트는데요. 수분장벽이 깨지기 쉬운피부라 주의를 해도 관리가 쉽지 않은 직장인이에요\n\n여드름 피부는 오일을 쓰면안된다는 인식이 있지만 오히려 유슈분 밸런스가 깨지면서 트러블이 생기는 경우가 많기에 오히려 오일을 좋게 생각하고 겨울에는 호호바오일을 수분크림에 섞발해주기도 하는데요. 이제품은 클렌징 단계에서 이미 10% 호호바 오일이 들어가있어서 체험을 해보고 싶었어요! \n\n우선 제형이 굉장이 쫀쫀하고 세미꾸덕(?) 그래서 조금만 펌핑해도 얼굴 전체에 도포가 가능하고 수분을 지켜주며 클렌징이 가능한것 같았어요. 실제로 세수를 하고나왔을때 당김이 적고 제가 기초를 깜박하고 갑자기 오신 우체부 아저씨를 마중(?)하고 왔는데 맨얼굴로 오분이상을 지냈는데도 당김이 없었어요..! \n속건조에 특히 도움이 될거 같았고 더써봐야 알겠지만 피부 겉표면이 맨들(?)해지는 느낌을 받았어요!",en:"I used it twice a day, morning and evening, on 6/10-6/11\nI have pore skin with scarring, combination-oily\nI don't really get pimples anymore, but with hormonal cycles, or when the weather changes like these days, small bumps come up and my skin flakes white even with just sunscreen on. My moisture barrier breaks easily so it's a skin that's hard to manage carefully even when I'm an office worker who's careful about it\n\nThere's a perception that acne-prone skin shouldn't use oil, but actually when the oil-water balance breaks down, that's often when breakouts happen more, so I actually think favorably of oil and in winter I mix jojoba oil into my moisturizer. This product already has 10% jojoba oil in the cleansing step so I wanted to try it!\n\nFirst, the texture is really firm and semi-thick(?), so even a small pump can cover my whole face, and it seemed to cleanse while protecting moisture. Actually after washing my face, the tightness was minimal, and I forgot to do my skincare and had to greet(?) the mailman who suddenly showed up, and I spent over five minutes bare-faced but there was no tightness..! It seemed like it would especially help with inner dryness and, though I'll need to use it more to be sure, I felt the skin surface become smooth(?)","zh-CN":"6/10-6/11 早晚各用了一次\n我是有痘坑毛孔的水油皮 \n现在已经不太长痘了，但一到生理周期，或者像最近这样换季，就会冒闭口，光涂防晒皮肤都会像起白色皮屑一样干裂。是那种水分屏障容易崩溃、就算注意保养也很难管理的上班族肌肤\n\n虽然大家普遍觉得痘痘肌不能用油类，但其实很多时候恰恰是水油平衡被打破才长痘，所以我反而对油类印象不错，冬天还会把荷荷巴油混进保湿霜里用。这款产品在清洁这一步就已经加了10%荷荷巴油，所以很想体验一下！\n\n首先质地非常紧实，有点半厚重的感觉，所以只需按压少量就能涂满全脸，感觉能在保护水分的同时完成清洁。实际上洗完脸出来紧绷感很少，我忘了涂基础护肤品，突然邮递员大叔来了就出去迎接了一下（？），素颜待了超过五分钟也没有紧绷……！\n感觉对内干特别有帮助，虽然还要多用几次才能确定，但已经感觉皮肤表面变得光滑（？）了！","zh-TW":"6/10-6/11早晚各用了一次\n我是有痘疤毛孔的外油內乾肌\n現在已經不太長痘痘了，但賀爾蒙週期，或像最近這樣天氣轉變時就會冒粉刺，光擦防曬乳皮膚都會像浮起白色角質一樣乾裂。是水分屏障很容易崩壞的膚質，就算小心保養也很難管理，是個上班族\n\n雖然一般認知是長痘的皮膚不能用油，但其實油水平衡一亂反而更常長痘痘，所以我反而對油類抱持正面看法，冬天還會把荷荷芭油混進乳霜裡用。這款產品在清潔這一步就已經添加了10%的荷荷芭油，所以很想體驗看看！\n\n首先質地非常紮實，帶點半凝膠感（？），所以只要按壓一點點就能塗滿全臉，感覺一邊清潔一邊留住水分。實際上洗完臉之後緊繃感較少，有一次我忘了做基礎保養，臨時去迎接（？）郵差先生，光著臉待了超過五分鐘，也完全不緊繃……!\n感覺對內在乾燥特別有幫助，還要再多用才能確定，但皮膚表面有種變得光滑（？）的感覺！",ja:"6/10-6/11、朝晩2回使ってみました\n私は跡のある毛穴肌、インナードライ肌です \n今はニキビはあまりできませんが、ホルモン周期、または最近のように天気が変わると細かいニキビが出て、日焼け止めだけ塗っても白く粉を吹いたように肌が荒れます。水分バリアが崩れやすい肌なので気をつけていてもケアが簡単ではない会社員です\n\nニキビ肌はオイルを使ってはいけないという認識がありますが、むしろ水分・油分バランスが崩れてトラブルが起きる場合が多いので、逆にオイルを良いと思っていて、冬にはホホバオイルを保湿クリームに混ぜて塗ったりもします。この製品はクレンジング段階ですでに10%ホホバオイルが入っているので試してみたかったです！ \n\nまずテクスチャーがかなりとろみがあってセミとろっと(?)しているので、少しポンプするだけで顔全体に塗ることができて、水分を守りながらクレンジングできる感じでした。実際に洗顔した後、つっぱりが少なく、私がスキンケアを忘れて急に来た郵便配達員さんを出迎え(?)に行ったのですが、素肌で5分以上過ごしてもつっぱりがありませんでした…！ \nインナードライに特に役立ちそうで、もっと使ってみないと分かりませんが、肌の表面がすべすべ(?)になった感じを受けました！",th:"ลองใช้ตอนเช้าและเย็นวันที่ 10-11 มิถุนายนค่ะ\nฉันเป็นผิวที่มีรูขุมขนเป็นรอย เป็นผิวมันขาดน้ำ \nตอนนี้ไม่ค่อยเป็นสิวแล้ว แต่พอเข้าสู่รอบฮอร์โมน หรืออากาศเปลี่ยนแบบช่วงนี้ก็จะมีสิวเสี้ยนขึ้น แค่ทาครีมกันแดดก็ผิวแตกเป็นขุยขาวเลย เป็นผิวที่เกราะความชุ่มชื้นเสียง่าย แม้ระวังแล้วก็ยังดูแลยาก เป็นมนุษย์เงินเดือนที่ไม่มีเวลาดูแลผิวมากนัก\n\nมีความเชื่อว่าผิวเป็นสิวไม่ควรใช้ออยล์ แต่จริงๆ แล้วสมดุลน้ำ-มันที่เสียไปต่างหากที่ทำให้เกิดสิวบ่อยๆ เลยคิดว่าออยล์เป็นสิ่งที่ดีต่างหาก หน้าหนาวก็ผสมน้ำมันโฮโฮบากับครีมให้ความชุ่มชื้นด้วย ผลิตภัณฑ์นี้มีน้ำมันโฮโฮบา 10% ตั้งแต่ขั้นตอนคลีนซิ่งเลย เลยอยากลองดู! \n\nอันดับแรกเนื้อสัมผัสหนึบแน่นและกึ่งข้น(?) เลยแค่ปั๊มนิดหน่อยก็ทาได้ทั่วหน้า แล้วรักษาความชุ่มชื้นไปพร้อมกับทำความสะอาดได้ พอล้างหน้าเสร็จจริงๆ แล้วตึงน้อยมาก แล้วครั้งหนึ่งลืมทาสกินแคร์แล้วรีบออกไปรับพัสดุจากบุรุษไปรษณีย์(?) อยู่หน้าเปล่าเกิน 5 นาทีก็ยังไม่ตึงเลย..! \nน่าจะช่วยเรื่องผิวขาดน้ำได้ดีเป็นพิเศษ ต้องใช้ต่อไปถึงจะรู้แน่ชัด แต่รู้สึกได้ว่าผิวหน้าเรียบเนียนขึ้น(?) แล้ว!"},images:[],video:null},
    {id:"qPgbxvnZ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"수부지+성인여드름 민감성 - 임상수치 인용, 모공 노폐물 케어",en:"Combination-oily + adult acne, sensitive - citing clinical figures, targets pore buildup","zh-CN":"水油皮+成人痘敏感肌 - 引用临床数据，毛孔废物护理","zh-TW":"外油內乾+成人痘敏感肌 - 引用臨床數據，毛孔老廢物護理",ja:"インナードライ肌+大人ニキビの敏感肌 - 臨床数値を引用、毛穴の老廃物ケア",th:"ผิวมันขาดน้ำ+สิวผู้ใหญ่แพ้ง่าย - อ้างอิงตัวเลขการทดสอบทางคลินิก ดูแลสิ่งสกปรกในรูขุมขน"},date:"2026-07-03",
      quote:{ko:"수부지 + 성인 여드름 있는 민감성 피부라 세안제도 성분 꼼꼼히 보는 편인데, 이번에 써본 노마디아 골든 호호바 10% 듀얼 마이크로 버블 클렌저 140ml 솔직 후기 남겨볼게요! 🫧\n\n✅ 장점\n1. 펌프 타입이라 한 손으로도 편하게 사용 가능, 양 조절도 쉬움\n2. 미세버블이 모공 속 노폐물까지 세정해주는 느낌, 세정력 확실함\n3. 호호바씨오일 10% 함유라 세안 후에도 당기지 않고 촉촉하게 마무리됨\n4. 판테놀 1%, 구아이아줄렌, 3종 히알루론산, 세라마이드, 병풀추출물 함유로 세안하면서 피부 장벽까지 케어되는 느낌\n4. 약산성 무향 포뮬러라 트러블 피부에도 자극 없이 사용 가능\n5. 수부지 피부 특성상 T존 피지 걱정되는데 오일리하지 않고 산뜻하게 마무리됨\n6. 모공을 막지 않는 식물성 오일이라 여드름성 피부에도 부담 없음\n7. 임상을 통해 모공 속 노폐물 세정 99.4%, 피부장벽 5.9배 케어, 2.1배 빠른 진정 확인된 제품\n\n민감성 + 트러블 피부인데 아침이나 2차 세안에서 당김도 싫고 보습도 챙기고 싶은 분들께 추천드려요 💙",en:"I have combination-oily, adult acne, sensitive skin so I check ingredients carefully even in cleansers, and here's my honest review of the NOMADIA Golden Jojoba 10% Dual Micro Bubble Cleanser 140ml I tried this time! 🫧\n\n✅ Pros\n1. Pump type so it's easy to use with one hand, and easy to control the amount\n2. Micro bubbles feel like they cleanse deep into pores, cleansing power is definitely solid\n3. Contains 10% jojoba seed oil so it finishes moist without tightness after washing\n4. Contains Panthenol 1%, Guaiazulene, 3 types of hyaluronic acid, ceramide, and Centella asiatica extract, so it feels like it cares for the skin barrier while cleansing\n4. Mildly acidic, fragrance-free formula, so it can be used without irritation even on trouble-prone skin\n5. Even with combination-oily skin where T-zone sebum is a worry, it finishes light and non-oily\n6. Plant-derived oil that doesn't clog pores, so it's not a burden even for acne-prone skin\n7. Clinically confirmed 99.4% cleansing of impurities in pores, 5.9x skin barrier care, 2.1x faster soothing\n\nI'd recommend this to anyone with sensitive + trouble-prone skin who hates tightness in the morning or during a second cleanse but also wants moisture 💙","zh-CN":"我是水油皮+有成人痘的敏感肌，选洁面产品也比较看重成分，这次用了NOMADIA金色荷荷巴10%双重微气泡洁面140ml，留个真实测评！🫧\n\n✅ 优点\n1. 泵头设计，单手也能方便使用，用量也好控制\n2. 微气泡感觉能清洁到毛孔深处的废物，清洁力确实不错\n3. 含10%荷荷巴籽油，洗后不紧绷，水润收尾\n4. 含1%泛醇、蓝甘菊薁、3种透明质酸、神经酰胺、积雪草提取物，洗脸的同时感觉皮肤屏障也在被照顾\n4. 弱酸性无香配方，痘痘肌也能无刺激使用\n5. 水油皮T区皮脂多，本来有点担心，但用完不油腻，很清爽地收尾\n6. 是不堵塞毛孔的植物油，痘痘肌用起来也没有负担\n7. 经临床验证：毛孔内废物清洁率99.4%，皮肤屏障护理提升5.9倍，舒缓速度加快2.1倍\n\n推荐给敏感+痘痘肌、又不想早晨或二次清洁时紧绷、还想兼顾保湿的朋友们💙","zh-TW":"我是外油內乾+有成人痘的敏感肌，選潔顏產品也會仔細看成分，這次來寫NOMADIA金盞荷荷芭10%雙重微氣泡潔顏乳140ml的真實心得！🫧\n\n✅ 優點\n1. 按壓瓶類型，單手也能輕鬆使用，用量也好控制\n2. 微氣泡感覺能清潔到毛孔深處的老廢物，潔淨力確實不錯\n3. 含10%荷荷芭籽油，洗完臉後也不緊繃，水潤收尾\n4. 含1%泛醇、癒創木薁、3種玻尿酸、神經醯胺、積雪草萃取物，洗臉的同時也能感覺到皮膚屏障被照顧\n4. 弱酸性無香配方，痘痘肌也能無刺激使用\n5. 外油內乾的T字部位容易出油，用完不油膩，清爽收尾\n6. 不阻塞毛孔的植物性油，長痘肌用也無負擔\n7. 經臨床驗證：毛孔老廢物清潔率99.4%，皮膚屏障護理提升5.9倍，舒緩速度快2.1倍\n\n推薦給敏感+長痘肌，早晨或二次清潔時討厭緊繃感、又想兼顧保濕的人💙",ja:"インナードライ肌+大人ニキビのある敏感肌なので、洗顔料も成分を細かくチェックする方ですが、今回使ってみたNOMADIAゴールデンホホバ10%デュアルマイクロバブルクレンザー140mlの正直レビューを残します！🫧\n\n✅長所\n1. ポンプタイプなので片手でも快適に使える、量の調整も簡単\n2. 微細バブルが毛穴の奥の老廃物まで洗浄してくれる感じ、洗浄力が確か\n3. ホホバ種子油10%含有で洗顔後もつっぱらずしっとり仕上がる\n4. パンテノール1%、グアイアズレン、3種のヒアルロン酸、セラミド、ツボクサエキス含有で、洗顔しながら肌バリアまでケアされる感じ\n4. 弱酸性・無香処方でトラブル肌にも刺激なく使える\n5. インナードライ肌の特性上Tゾーンの皮脂が気になるけど、オイリーにならずさっぱり仕上がる\n6. 毛穴を詰まらせない植物性オイルなのでニキビ肌にも負担がない\n7. 臨床試験を通して毛穴内老廃物洗浄99.4%、肌バリア5.9倍ケア、2.1倍速い鎮静が確認された製品\n\n敏感肌+トラブル肌で、朝や2回目の洗顔でつっぱるのも嫌だし保湿もケアしたい方におすすめします💙",th:"เป็นผิวมันขาดน้ำ + มีสิวผู้ใหญ่ แพ้ง่าย เลยเป็นคนที่เช็คส่วนผสมในตัวล้างหน้าอย่างละเอียด ครั้งนี้ขอรีวิวตรงไปตรงมาของโกลเด้นโฮโฮบา 10% ดูอัลไมโครบับเบิลคลีนเซอร์ 140ml ของโนมาเดียค่ะ! 🫧\n\n✅ ข้อดี\n1. เป็นแบบปั๊มใช้มือเดียวก็สะดวก ปรับปริมาณได้ง่าย\n2. ไมโครบับเบิลรู้สึกเหมือนทำความสะอาดถึงสิ่งสกปรกในรูขุมขน แรงทำความสะอาดชัดเจน\n3. มีน้ำมันเมล็ดโฮโฮบา 10% หลังล้างหน้าไม่ตึง จบด้วยความชุ่มชื้น\n4. มีแพนธีนอล 1% กวยอาซูเลน ไฮยาลูรอนิกแอซิด 3 ชนิด เซราไมด์ สารสกัดใบบัวบก รู้สึกว่าดูแลเกราะผิวไปพร้อมกับล้างหน้า\n4. เป็นสูตรกรดอ่อนไม่มีกลิ่น ผิวเป็นสิวก็ใช้ได้โดยไม่ระคายเคือง\n5. ด้วยความที่เป็นผิวมันขาดน้ำมักกังวลเรื่องไขมันบริเวณ T-zone แต่ใช้แล้วไม่มันเยิ้ม จบแบบสดชื่น\n6. เป็นน้ำมันจากพืชที่ไม่อุดตันรูขุมขน ผิวเป็นสิวก็ใช้ได้ไม่มีภาระ\n7. ผ่านการทดสอบทางคลินิกยืนยันว่าล้างสิ่งสกปรกในรูขุมขนได้ 99.4% ดูแลเกราะผิวได้ 5.9 เท่า ปลอบประโลมได้เร็วขึ้น 2.1 เท่า\n\nแนะนำสำหรับคนผิวแพ้ง่าย + เป็นสิว ที่ไม่ชอบความตึงตอนล้างหน้าตอนเช้าหรือล้างหน้าครั้งที่สอง และอยากได้ความชุ่มชื้นด้วย 💙"},images:[],video:null},
    {id:"A6gjd3LJ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"건성/예민+시술 후 피부 - 눈 예민한데도 전혀 안따가움",en:"Dry/sensitive + post-procedure skin - no stinging at all even with sensitive eyes","zh-CN":"干皮/敏感+治疗后皮肤 - 眼睛敏感也完全不刺痛","zh-TW":"乾性/敏感+術後肌膚 - 眼睛敏感也完全不刺痛",ja:"乾燥肌/敏感+施術後の肌 - 目が敏感なのに全くしみない",th:"ผิวแห้ง/แพ้ง่าย+ผิวหลังทำหัตถการ - ตาไวมากก็ไม่แสบเลย"},date:"2026-07-03",
      quote:{ko:"2026.06.16- 2026.07.01 까지 사용하였습니다\n\n 제 피부타입은 건성에 예민한 타입 입니다 \n그래서 약산성만 사용해야하죠ㅠㅠ\n \n노마디아 호호바 버블클렌저는  피부와 동일한 약산성이고\n예민한분 ,시술 후, 수부지 , 속당김이 심한 건성 분들이\n 쓰기 좋습니다\n\n저는 평소에도 호호바 오일로 마사지하고 보습을 합니다\n그런데 폼클렌징에 포함되어있다니!!!!\n\n골든 호호바 10% 듀얼 마이크로 버블 클렌저는\n세안 후 거품 후에도 당김이 제로고 \n모공 속 노폐물 세정 99.47% ,자외선 차단제 까지  92.33%세정(이게 최고인듯요), 장벽보호38.41%\n피부진정 32.02%  ,무향 ,무색소 라고 합니다\n\n사용방법도 간단합니다!!\n사용 전 흔들어서 사용하고 물기있는 얼굴에 1-2 펌프해서\n얼굴전체 부드럽게 마사지하듯이 문질러주고 미온수로 씻기!!!\n\n저는 선크림만 발랐을때는 버블클렌저로만 씻고(너무 편해요)\n화장했을때는 클렌징 밀크로 먼저 한번 씻어내고 마무리로 버블클렌저를 사용합니다!!!! 세정력이 좋아요👍🏻\n\n세수하면서 느낀건데 제가 눈이 진짜 예민하거든요?\n근데 눈이 안따가워요 !!!! 자극이 없어요 \n\n마무리로 최고 제품 사용하게 해주샤서 감사합니다",en:"I used this from 2026.06.16 to 2026.07.01\n\nMy skin type is dry and sensitive\nSo I can only use mildly acidic products ㅠㅠ\n\nNOMADIA's jojoba bubble cleanser is mildly acidic just like skin\nand it's good to use for sensitive people, post-procedure skin, combination-oily skin, and dry skin with severe inner tightness\n\nI normally massage in and moisturize with jojoba oil myself\nBut to think it's included in a foam cleanser!!!!\n\nThe Golden Jojoba 10% Dual Micro Bubble Cleanser\nhas zero tightness even after the foam and washing\n99.47% cleansing of pore impurities, even 92.33% cleansing of sunscreen (this is the best part), 38.41% barrier protection\n32.02% skin soothing, fragrance-free, no dyes, they say\n\nThe usage method is simple too!!\nShake before use, pump 1-2 times onto a wet face,\ngently massage the whole face, then rinse with lukewarm water!!!\n\nOn days I only wear sunscreen, I just wash with the bubble cleanser alone (so convenient)\nOn makeup days, I first wash with the cleansing milk, then finish with the bubble cleanser!!!! Cleansing power is great 👍🏻\n\nWhile washing, I noticed - my eyes are really sensitive, you know?\nBut my eyes don't sting!!!! No irritation at all\n\nThank you for letting me try such a great product at the end","zh-CN":"使用时间：2026.06.16-2026.07.01\n\n我的肤质是干性偏敏感的类型 \n所以只能用弱酸性产品ㅠㅠ\n \     {id:"ZN6Q3QmZ",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"수부지, 워터프루프 메이크업 후 당김 악순환 해결",en:"Combination-oily, resolved the tightness vicious cycle after waterproof makeup","zh-CN":"水油皮，防水彩妆后紧绷恶性循环得到解决","zh-TW":"外油內乾，防水彩妝後緊繃的惡性循環得到解決",ja:"インナードライ肌、ウォータープルーフメイク後のつっぱりの悪循環を解決",th:"ผิวมันขาดน้ำ แก้วงจรตึงหลังล้างเมคอัพวอเตอร์พรูฟ"},date:"2026-06-18",
      quote:{ko:"저는 T존은 유분기가 많고 U존은 건조한\n전형적인 수부지 피부인데요. 🥲\n\n피지에 강한 워터프루프 메이크업을 주로 하다보니\n세정력이 좋은 클렌징 제품을 사용하고 나면\n속건조 때문에 당김이 더 심해지는.. \n반복되는 악순환을 겪고 있는 1인 입니다. ㅜㅜ\n\n그래서\n클렌징 제품을 고를 때 과도한 피지는 케어해주면서\n세안 후에도 당기지 않고 촉촉한 제품을 선호하는 편이에요!\n\n골든 호호바 10% 듀얼 마이크로 버블 클렌저는\n피부에 친화적이면서 모공을 막지 않는 호호바씨 오일과\n피부 장벽과 유사한 구조의 세라마이드 성분이\n모공 속 피지, 각질 및 메이크업 잔여물까지\n말끔히 씻어내주면서\n건조함이나 자극은 최소화한 버블 클렌징폼이라\n저 같은 수부지 피부에 너무 좋더라구요 🤭✨️\n\n누르면 조밀한 입자의 미세한 거품이 바로 나오는데\n아침부터 분주하고 바쁜 직장인에겐\n문질러 거품을 내야하는 짧은 시간이라도 아껴주는 꿀템!\n(●'◡'●)\n\n특히 요즘처럼 날이 더울 땐\n땀도 많이 흘리고 피지도 폭발하고ㅋ;;\n선크림이랑 노폐물이 뒤적여\n퇴근할 때쯤엔 피부가 엉망이 되는데\n순한 성분으로 산뜻하게 마무리할 수 있는 제품이라\n마음에 들었어요~! \n\n세안 후에도 당기지 않고 진정 성분이 함유된 \n클렌징폼을 원하시는 분들에게 추천 드립니다. ㅎㅎ",en:"My T-zone is oily and my U-zone is dry\na classic case of combination-oily skin. 🥲\n\nSince I mostly wear waterproof makeup that resists sebum,\nwhen I use a cleansing product with strong cleansing power\nit ends up making the tightness worse due to inner dryness..\nI'm the type stuck in that repeating vicious cycle. ㅜㅜ\n\nSo\nwhen choosing a cleansing product I prefer one that\ncares for excess sebum while still leaving skin moist without tightness after washing!\n\nThe Golden Jojoba 10% Dual Micro Bubble Cleanser\nhas jojoba seed oil that's skin-friendly and doesn't clog pores,\nplus ceramide with a structure similar to the skin barrier,\nso it thoroughly washes away sebum, dead skin cells, and makeup residue in pores\nwhile minimizing dryness or irritation - a bubble cleansing foam\nso it was really great for my combination-oily skin 🤭✨️\n\nPress it and fine, dense micro bubbles come out right away,\nwhich is a lifesaver for busy, rushed mornings for an office worker like me,\nsaving the short time it'd take to make lather yourself\n(●'◡'●)\n\nEspecially on hot days like these,\nwhen you sweat a lot and sebum goes wild ㅋ;;\nsunscreen mixes with impurities\nand your skin is a mess by the time you get off work,\nbut this product finishes fresh with gentle ingredients\nso I liked it a lot~!
