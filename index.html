 go, so I felt it would be better at night to do a first cleanse with a cleansing milk or water first. It cleanses gently without stripping the skin excessively.\n\n☀️ Pros and cons for combination (oily-dehydrated) skin\nThe pro is that moisture remains even after washing. It clears oil away just enough while not drying out the skin, which felt like a good match for combination (oily-dehydrated) skin. On the other hand, people who prefer a squeaky-clean, refreshed finish might find it a bit too gentle.\n\n☀️ Overall\nAs someone in my 30s with combination (oily-dehydrated) skin, this was a daily cleanser I could use comfortably without irritation. Little tightness after washing and usable even on days my skin felt sensitive, so I was satisfied. It felt like a product focused on keeping skin balance comfortable rather than delivering strong cleansing power, and I think I'd reach for it especially for morning washing or during times my skin gets sensitive ☺️","zh-CN":"30多岁女性/水油皮 \n\n️ ☀️质地\n是那种一按压就出蓬松细密泡沫的类型。不用另外打泡，忙碌的早晨也能方便使用！泡沫像慕斯一样柔软紧实，接触皮肤时几乎感觉不到刺激或摩擦感。可能是含荷荷巴成分，不只是轻盈的泡沫，还能同时感受到水润感。\n\n☀️ 使用感\n过了30岁之后，对屏障、干燥变得非常敏感！\n洗脸的过程中最先感觉到的是皮肤很舒适。洗后脸也不太会紧绷或干燥收紧，感觉能保留一定水分同时干净整理油分。特别是水油皮特有的内干严重的日子用也没有负担。\n\n☀️ 清洁力\n卸除轻度防晒或日常废物完全令人满意。不过一次卸浓妆的话清洁力不算特别强，晚上建议先用洁面乳或卸妆水做一次清洁再用这款。是那种不会过度剥除皮肤、温和清洁的产品。\n\n☀️ 水油皮角度的优缺点\n优点是洗后依然留有水润感。能适度整理油分又不会让皮肤干燥，感觉很适合水油皮。反过来，喜欢清爽吱吱响收尾感的人可能会觉得有点太温和。\n\n☀️ 总评\n以水油皮30多岁肤质使用下来，是一款能无刺激舒适使用的日常洁面产品。洗后紧绷少，皮肤敏感的日子用也没有负担，很满意。感觉这款产品的重点不在于强力清洁，而在于舒适维持皮肤平衡，当早晨洁面或皮肤敏感时期特别会常用☺️","zh-TW":"30多歲女性/外油內乾\n\n☀️質地\n按壓就會出現豐盈微氣泡的類型。不用另外起泡，忙碌的早晨也能簡單使用！泡沫像慕斯一樣柔軟細緻，碰到皮膚幾乎感覺不到刺激或摩擦感。可能因為含有荷荷芭成分，不只是輕盈的泡沫，還能同時感受到水潤感。\n\n☀️ 使用感\n過了30歲之後，對屏障、乾燥變得超級敏感！\n洗臉過程中最先感受到的是皮膚很舒服。洗完臉後臉也不太會緊繃或乾燥收緊，皮膚水分留住一定程度，只把油分清爽整理掉的感覺。特別是外油內乾肌特有的內在乾燥嚴重的日子用起來也沒有負擔。\n\n☀️ 潔淨力\n卸除淡防曬乳或日常老廢物已經足夠滿意。不過要一次卸掉濃妝，潔淨力並不算強，晚上最好先用卸妝乳或卸妝水做一次清潔再用這款。是不會過度剝除皮膚、溫和清潔的產品。\n\n☀️ 以外油內乾膚質來看的優缺點\n優點是洗完臉後還留有水潤感。能適度整理油分又不讓皮膚乾燥，感覺和外油內乾肌很合適。相反地，喜歡洗到清爽咕溜咕溜收尾的人，可能會覺得偏溫和。\n\n☀️ 總評\n以外油內乾30多歲的膚質來使用，是一款能無刺激舒適使用的日常潔顏產品。洗完臉緊繃感少，皮膚敏感的日子用起來也沒有負擔，很滿意。感覺這款產品的重點不在強力潔淨，而在讓肌膚平衡維持得舒適，當早晨洗臉用、或皮膚變敏感的時期應該會特別常用☺️",ja:"30代女性/インナードライ肌 \n\n ☀️テクスチャー\nポンプすると最初から豊かな微細バブルが出てくるタイプです。別に泡立てる必要がないので忙しい朝でも簡単に使えました！泡はムースのように柔らかくきめ細かい方で、肌に触れたとき刺激や摩擦感がほとんど感じられませんでした。ホホバ成分が含まれているからか、単に軽い泡ではなくしっとり感も一緒に感じられるテクスチャーでした。\n\n☀️使用感\n30代を過ぎるほどバリア、乾燥にすごく敏感になりました！ \n 洗顔している間、肌が快適だという感じが一番先にしました。洗顔後も顔がつっぱったり乾燥して引きつる感じが少なく、肌の水分はある程度残しながら油分感だけすっきり整えてくれる感じでした。特にインナードライ肌特有のインナードライがひどい日でも気兼ねなく使うことができました。\n\n☀️洗浄力\n軽めの日焼け止めや日常的な老廃物除去には十分満足でした。ただ濃いメイクまで一度で落とすには洗浄力が強い方ではないので、夜はクレンジングミルクやウォーターで1回目のクレンジング後に使う方が良いと感じました。肌を過度に削ぎ落とす感じなくマイルドに洗浄される製品です。\n\n☀️インナードライ肌基準の長所と短所\n長所は洗顔後もしっとり感が残っているという点です。油分は適度に整えながら肌が乾燥しないのでインナードライ肌に合うと感じました。反面、さっぱりキュッキュッとした仕上がりを好む方にはやや物足りなく感じるかもしれません。\n\n☀️総評\nインナードライの30代肌基準で使ったとき、刺激なく快適に使えるデイリークレンザーでした。洗顔後のつっぱりが少なく、肌コンディションが敏感な日でも気兼ねなく使えて満足でした。強い洗浄力よりも肌のバランスを快適に保つことに焦点を当てた製品だと感じ、朝の洗顔用や肌が敏感になった時期に特によく手が伸びそうです☺️",th:"หญิงวัย 30 กว่า/ผิวมันขาดน้ำ \n\n☀️เนื้อสัมผัส\nกดปั๊มแล้วมีไมโครบับเบิลฟูออกมาตั้งแต่ครั้งแรก ไม่ต้องตีฟองเพิ่มเอง ใช้งานสะดวกแม้ตอนเช้าที่วุ่นวาย! ฟองนุ่มและละเอียดเหมือนมูส สัมผัสผิวแล้วแทบไม่รู้สึกระคายเคืองหรือเสียดสี อาจเพราะมีส่วนผสมโฮโฮบา เลยไม่ใช่แค่ฟองเบาๆ แต่ให้ความชุ่มชื้นด้วย\n\n☀️ความรู้สึกเมื่อใช้\nพออายุเกิน 30 เกราะผิวและความแห้งก็แพ้ง่ายขึ้นมาก! \nระหว่างล้างหน้าสิ่งแรกที่รู้สึกคือผิวสบาย หลังล้างหน้าแทบไม่ตึงหรือแห้งเลย รู้สึกว่ายังคงความชุ่มชื้นไว้บ้างแต่จัดการความมันได้หมดจด โดยเฉพาะวันที่ผิวขาดน้ำรุนแรงแบบเฉพาะของผิวมันขาดน้ำก็ใช้ได้อย่างไม่มีภาระ\n\n☀️แรงทำความสะอาด\nล้างครีมกันแดดเบาๆ หรือสิ่งสกปรกประจำวันออกได้น่าพอใจ แต่ไม่ได้แรงพอสำหรับล้างเมคอัพเข้มข้นในครั้งเดียว เลยรู้สึกว่าตอนเย็นควรล้างหน้าครั้งแรกด้วยคลีนซิ่งมิลค์หรือวอเตอร์ก่อนแล้วค่อยใช้ตัวนี้ เป็นผลิตภัณฑ์ที่ทำความสะอาดอย่างอ่อนโยนโดยไม่ล้างไขมันออกมากเกินไป\n\n☀️ข้อดีข้อเสียสำหรับผิวมันขาดน้ำ\nข้อดีคือหลังล้างหน้ายังคงความชุ่มชื้นไว้ จัดการความมันได้พอดีโดยไม่ทำให้ผิวแห้ง รู้สึกว่าเข้ากับผิวมันขาดน้ำดี ส่วนคนที่ชอบความรู้สึกสะอาดเอี๊ยดอาจรู้สึกว่าอ่อนโยนไปนิดหน่อย\n\n☀️สรุป\nสำหรับผิวมันขาดน้ำวัย 30 กว่า เป็นคลีนเซอร์ประจำวันที่ใช้ได้อย่างสบายโดยไม่ระคายเคือง หลังล้างหน้าตึงน้อยและใช้ได้ไม่มีภาระแม้วันที่ผิวไวต่อสิ่งเร้า พอใจมาก รู้สึกว่าเป็นผลิตภัณฑ์ที่เน้นรักษาสมดุลผิวมากกว่าแรงทำความสะอาดจัดจ้าน น่าจะหยิบใช้บ่อยตอนเช้าหรือช่วงที่ผิวแพ้ง่ายขึ้น☺️"},images:[],video:null},
    {id:"ZBzlPjPZ",rating:4,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"복합성(코·이마 지성/볼 건성)+민감성, 트러블 잘 올라오는데 개선",en:"Combination (oily nose/forehead, dry cheeks) + sensitive, improvement on skin prone to breakouts","zh-CN":"混合肌（鼻子·额头油/脸颊干）+敏感性，容易长痘的皮肤有改善","zh-TW":"混合性（鼻子‧額頭油性/臉頰乾性）+敏感性，容易長痘痘的肌膚有改善",ja:"混合肌(鼻・おでこは脂性/頬は乾燥)+敏感肌、トラブルが出やすいが改善",th:"ผิวผสม (จมูก·หน้าผากมัน/แก้มแห้ง)+แพ้ง่าย ปกติเป็นสิวง่ายแต่ดีขึ้น"},date:"2026-06-11",
      quote:{ko:"사용기간\n6윌12일~6월16일 (5일사용)\n\n피부타입 \n코랑 이마 지성 / 볼 건성 / 민감성\n평소 피부가 민감해서 피부가 잘 뒤집어져서 트러블이 쉽게 올라오는 타입이지만 최근에 트러블 올라옴 없이 피부 좋아보인다는 소리를 들은 커디션 좋은 피부상태\n\n거품이 밀도가 높아보이고 쫀쫀하고 미세한 거품이어서\n부드럽게 얼굴에 올라간다 \n오일이 약간 들어 있기때문에 쓰기전 잘 흔들어서 사용해야 하고 씻고나서 피부 당김은 없지만 보송하거나 개운한 느낌을 좋아하는 사람들에게는 조금 아쉬울 수 있다 \n그래도 오일성분이 들어간 클렌징 중에 세안후 미끌거림은 거의 없는 편이라 좋았다",en:"Usage period\nJune 12 - June 16 (5 days of use)\n\nSkin type\nOily nose and forehead / dry cheeks / sensitive\nUsually my skin is sensitive and breaks out easily, but recently people have told me my skin looks good with no breakouts, so it's in good condition\n\nThe foam looks dense, feels bouncy and fine,\nso it goes onto the face smoothly\nSince it contains a bit of oil, you need to shake it well before use, and there's no tightness after washing, but people who like that squeaky, super-refreshed feeling might find it a little lacking\nStill, out of the oil-based cleansers I've tried, this one has almost no slippery residue after washing, which I liked","zh-CN":"使用时间\n6月12日~6月16日（用了5天）\n\n肤质\n鼻子和额头偏油/脸颊干/敏感性\n平时皮肤敏感，容易爆发长痘，但最近没长痘，还被夸皮肤状态好\n\n泡沫密度看起来很高，紧实细腻，\n能柔软地涂在脸上\n因为含有一点油分，用之前一定要摇匀，洗后不紧绷，但喜欢干爽清爽感的人可能会觉得稍有欠缺\n不过在含油的洁面产品里，这款洗后几乎没有滑腻感，这点很喜欢","zh-TW":"使用期間\n6月12日~6月16日（使用5天）\n\n膚質\n鼻子和額頭偏油性／臉頰偏乾性／敏感性\n平常皮膚敏感，容易爆痘長痘痘的類型，但最近沒有長痘痘，還被說皮膚看起來變好了，狀況不錯\n\n泡沫看起來密度很高、紮實又細緻，\n能柔順地覆蓋在臉上\n因為含有一點油分，使用前一定要搖勻，\n洗完臉不緊繃，但喜歡乾爽清透感的人可能會覺得稍微不夠\n不過在含油成分的潔顏產品中，洗完臉幾乎不滑膩，這點很喜歡",ja:"使用期間\n6月12日〜6月16日(5日間使用)\n\n肌タイプ \n鼻とおでこは脂性/頬は乾燥/敏感肌\n普段肌が敏感で肌が荒れやすくトラブルが出やすいタイプですが、最近トラブルが出ずに肌が良さそうと言われるくらいコンディションの良い肌状態\n\n泡が密度が高く見えてとろみがあって微細な泡なので\n優しく顔にのる \n オイルが少し入っているので使う前によく振ってから使う必要があり、洗った後肌のつっぱりはありませんが、さらっとした感じやすっきりした感じが好きな人には少し物足りないかもしれません \n それでもオイル成分が入っているクレンジングの中では洗顔後のぬるつきがほとんどない方で良かったです",th:"ระยะเวลาที่ใช้\n12-16 มิถุนายน (ใช้ 5 วัน)\n\nประเภทผิว \nจมูกและหน้าผากมัน / แก้มแห้ง / แพ้ง่าย\nปกติเป็นผิวแพ้ง่ายที่เห่อง่ายและเป็นสิวง่าย แต่ช่วงนี้ไม่มีสิวขึ้นเลย มีคนบอกว่าผิวดูดี สภาพผิวช่วงนี้ดีมาก\n\nฟองดูหนาแน่น หนึบและละเอียด\nลูบไล้บนหน้าได้นุ่มนวล \nมีออยล์ผสมอยู่นิดหน่อยเลยต้องเขย่าให้ดีก่อนใช้ หลังล้างหน้าไม่ตึง แต่คนที่ชอบความรู้สึกสะอาดฟูหรือสดชื่นอาจรู้สึกว่าไม่ค่อยเพียงพอนิดหน่อย \nแต่ในบรรดาคลีนซิ่งที่มีส่วนผสมออยล์ ตัวนี้แทบไม่ลื่นเหนอะหนะหลังล้างหน้าเลย ชอบมาก"},images:[],video:null},
    {id:"ZlyE3loq",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"건성, 세안 후 당김 적고 트러블 없이 2주 사용",en:"Dry skin, little tightness after washing, no breakouts over 2 weeks of use","zh-CN":"干皮，洗后紧绷少，无刺激地用了两周","zh-TW":"乾性，洗完臉緊繃感少、無肌膚困擾地使用兩週",ja:"乾燥肌、洗顔後のつっぱりが少なくトラブルなく2週間使用",th:"ผิวแห้ง หลังล้างหน้าตึงน้อยและไม่เกิดสิวตลอด 2 สัปดาห์ที่ใช้"},date:"2026-05-27",
      quote:{ko:"평소 피부가 건조한 편이라 클렌저를 고를 때 세정력도 중요하지만 세안 후 당김이 적은 제품을 선호하는데요. 이번에 노마디아 골든 호호바 10% 듀얼 마이크로 버블 클렌저를 체험해볼 기회가 생겨 사용해봤어요. 처음 사용했을 때 가장 인상적이었던 점은 미세하고 촘촘한 버블이었어요. 별도로 거품을 낼 필요 없이 풍성한 거품이 바로 나와서 편했습니다. 피부에 문지를 때 자극이 크지 않았고 부드럽게 롤링되는 느낌이 들었어요. 평소 건성이라 세안 후 얼굴이 금방 당기는 제품은 잘 못 쓰는데, 이 제품은 세안 후에도 피부가 땅기거나 건조해지는 느낌이 비교적 적었습니다. 그렇다고 미끈거리는 잔여감이 남는 것도 아니라서 깔끔하게 마무리되는 점이 마음에 들었어요. 약 2주 정도 사용하면서 아침, 저녁 세안에 활용했는데 피부가 예민하게 반응하거나 트러블이 생기지는 않았습니다. 은은한 향도 부담스럽지 않아 무난하게 사용하기 좋았어요. 전체적으로 세안은 깔끔하게 되면서도 건조함은 덜한 편이라 건성이나 세안 후 당김이 신경 쓰이는 분들이 사용해보기 괜찮은 클렌저라고 생각합니다. 사용하기 편한 버블 타입이라 너무 좋아요!",en:"My skin is usually on the dry side, so when choosing a cleanser cleansing power matters, but I also prioritize little tightness after washing. I got the chance to try NOMADIA's Golden Jojoba 10% Dual Micro Bubble Cleanser this time, so I gave it a go. What impressed me most the first time was the fine, dense bubbles. Rich foam came out right away with no need to lather separately, which was convenient. There wasn't much friction rubbing it on my skin, and it rolled on smoothly. I usually can't use products that leave my face tight quickly after washing since I'm dry-skinned, but with this one there was comparatively little tightness or dryness even after washing. And yet it doesn't leave a slippery residue either, so it finished cleanly, which I liked. I used it for about 2 weeks for both morning and evening washing, and my skin didn't react sensitively or break out. The subtle scent wasn't overwhelming either, making it easy to use regularly. Overall, cleansing felt thorough while dryness was reduced, so I think this is a good cleanser to try for dry skin or anyone bothered by post-wash tightness. It's such a convenient bubble type to use, I love it!","zh-CN":"我平时皮肤偏干，挑洁面产品时清洁力固然重要，但更偏好洗后不紧绷的产品。这次有机会试用了NOMADIA金色荷荷巴10%双重微气泡洁面。第一次用最有印象的是细腻紧实的气泡。不用另外打泡，蓬松的泡沫直接就出来了，很方便。打圈按摩时刺激不大，感觉能柔软地打圈。我平时是干皮，很多产品洗完脸很快就紧绷，用不了，这款洗后紧绷或干燥的感觉相对较少。但也不会留下滑腻的残留感，能干净收尾，这点很喜欢。用了大概两周，早晚洁面都用了，皮肤没有出现敏感反应或长痘。淡雅的香味也没有负担，用起来很舒适。整体来说清洁很干净，同时干燥感较少，对干皮或在意洗后紧绷的人来说是值得一试的洁面产品。是好用的气泡类型，非常喜欢！","zh-TW":"我皮膚平常偏乾燥，挑洗面乳時潔淨力很重要，但更偏好洗完臉緊繃感少的產品。這次剛好有機會體驗NOMADIA金盞荷荷芭10%雙重微氣泡潔顏乳。第一次使用時印象最深的是細緻紮實的氣泡。不用另外起泡，豐盈的泡沫直接出來，很方便。在皮膚上打圈時刺激不大，滾動感很柔順。我平常是乾性肌，很難用那種洗完臉馬上緊繃的產品，但這款洗完臉後緊繃或乾燥的感覺相對較少。也不會留下滑膩的殘留感，收尾很乾淨，這點很喜歡。使用了大約兩週，早晚洗臉都用，皮膚沒有敏感反應或長痘痘。淡雅的香味也沒有負擔，用起來很順手。整體來說能乾淨清潔又不會太乾燥，我覺得是適合乾性肌、或在意洗完臉緊繃感的人可以試試看的潔顏產品。是方便使用的氣泡型，真的很喜歡！",ja:"普段肌が乾燥する方なのでクレンザーを選ぶとき洗浄力も大事ですが、洗顔後のつっぱりが少ない製品を好みます。今回NOMADIAゴールデンホホバ10%デュアルマイクロバブルクレンザーを体験できる機会があったので使ってみました。初めて使ったとき一番印象的だった点は微細できめ細かいバブルでした。別途泡立てる必要なく豊かな泡がすぐ出てきて楽でした。肌にこすったとき刺激が大きくなく優しくローリングされる感じがしました。普段乾燥肌なので洗顔後すぐ顔がつっぱる製品はあまり使えないのですが、この製品は洗顔後も肌がつっぱったり乾燥したりする感じが比較的少なかったです。だからといってぬるつく残留感が残るわけでもなく、すっきり仕上がる点が気に入りました。約2週間ほど使いながら朝晩の洗顔に活用しましたが、肌が敏感に反応したりトラブルが出たりはしませんでした。ほのかな香りも負担がなく無難に使うのに良かったです。全体的に洗顔はすっきりできながらも乾燥は少ない方なので、乾燥肌や洗顔後のつっぱりが気になる方が使ってみるのに良いクレンザーだと思います。使いやすいバブルタイプでとても良いです!",th:"ปกติเป็นผิวแห้ง เลยเลือกคลีนเซอร์โดยดูทั้งแรงทำความสะอาดและความตึงหลังล้างหน้าเป็นหลัก ครั้งนี้ได้โอกาสทดลองใช้โกลเด้นโฮโฮบา 10% ดูอัลไมโครบับเบิลคลีนเซอร์ของโนมาเดีย จุดที่ประทับใจที่สุดตอนใช้ครั้งแรกคือฟองที่ละเอียดและหนึบแน่น ไม่ต้องตีฟองแยก ฟองฟูออกมาทันทีสะดวกมาก นวดคลึงบนผิวแล้วไม่ระคายเคืองมาก รู้สึกนุ่มนวลดี ปกติเป็นผิวแห้งเลยใช้ผลิตภัณฑ์ที่ทำให้ตึงเร็วหลังล้างหน้าไม่ค่อยได้ แต่ผลิตภัณฑ์นี้หลังล้างหน้าแทบไม่ตึงหรือแห้งเลย แต่ก็ไม่ได้มีคราบลื่นเหนอะหนะตกค้างด้วย จบอย่างสะอาดหมดจดชอบมาก ใช้มาประมาณ 2 สัปดาห์ทั้งเช้าและเย็น ผิวไม่ไวต่อสิ่งเร้าหรือเป็นสิวเลย กลิ่นอ่อนๆ ก็ไม่มีภาระ ใช้ได้อย่างสบายใจ โดยรวมล้างหน้าได้สะอาดหมดจดแต่แห้งน้อยกว่า คิดว่าเป็นคลีนเซอร์ที่เหมาะกับคนผิวแห้งหรือคนที่กังวลเรื่องตึงหลังล้างหน้า เป็นรูปแบบบับเบิลที่ใช้งานสะดวกชอบมากๆ เลยค่ะ!"},images:[],video:null},
    {id:"qg2Ml8pZ",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"홍조 있는 복합성, 사용 후 홍조 개선 체감",en:"Combination with redness, noticeable improvement in redness after use","zh-CN":"泛红混合肌，使用后感受到泛红改善","zh-TW":"有泛紅的混合肌，使用後感受到泛紅改善",ja:"赤みのある混合肌、使用後赤みの改善を実感",th:"ผิวผสมที่มีผื่นแดง รู้สึกได้ว่าผื่นแดงดีขึ้นหลังใช้"},date:"2026-05-30",
      quote:{ko:"😄 피부타입 😄 홍조가 있는 복합성 피부 피부장벽과 수분도는 정상수치\n\n💧 제형 💧\n제품 이름처럼 버블 클렌저라 거품이 풍성하게 생겨요. 일반 폼클렌징은 손바닥으로 문지르거나 거품기에 넣어야 부드러운 거품이 만들어져서 번거로운데 버블 클렌저는 한번에 바로 세안할 수 있어서 편하네요. 놀라운 건 계면활성제가 안 들어갔는데도 거품이 풍성하다는 점이었어요. 성분 생각해서 폼클렌저를 사용할 때 거품이 없으면 아무래도 사용할 때 아쉬움이 느껴지곤 했었거든요. 그런데 골든 호호바 클렌저는 성분도 착한데 거품도 풍성해서 이 점이 만족스러웠어요.\n\n🤗 사용감 🤗\n거품이 풍성해서 손으로 얼굴을 씻을 때 마찰감이 덜하게 느껴져서 좋았어요. 약산성이라 뽀득뽀득한 느낌은 없지만 미끄덩한 느낌도 없는 편이에요.\n\n✨️효과 ✨️\n골든 호호바에 성분을 보면 판테놀, 병풀추출물 등이 들어있는데 이게 다 피부장벽에 도움이 된다고 알고 있어요. 클렌징을 하면서도 피부장벽을 보호할 수 있어서 좋은 것 같아요. 특히 저는 홍조가 있는 피부인데 클렌징 후 홍조끼도 조금씩 개선되는 것을 확인할 수 있었어요.\n그리고 부드러운 거품을 바로 사용할 수 있어서 피부에 자극이 거의 없어서 좋았어요. 세안 후 피부에 수분감이 남아 촉촉해지네요.\n\n🧫 성분 🧫\n저는 화장품을 살 때 성분을 꼭 보거든요. 이 제품에는 20가지 주의성분이 없어서 안심하고 마음껏 사용할 수 있어서 좋네요.\n\n🤭 향 🤭\n향료가 인체에 해롭다는 걸 알아서 무향제품을 선호하는데 호호바 클렌저는 무향이라 좋았어요.",en:"😄 Skin type 😄 combination skin with redness, skin barrier and hydration levels normal\n\n💧 Texture 💧\nTrue to its name, it's a bubble cleanser so the foam comes out rich. With regular foam cleansers you have to rub it in your palms or use a foam pump to make soft foam, which is a hassle, but with the bubble cleanser you can wash right away, which is convenient. The surprising part was how rich the foam was even without surfactants. When I'm mindful of ingredients and use a foam cleanser without much foam, it always feels a bit lacking. But the Golden Jojoba Cleanser has clean ingredients and rich foam, which was very satisfying.\n\n🤗 Texture 🤗\nSince the foam is so rich, there's less friction when washing my face with my hands, which I liked. It's mildly acidic so there's no squeaky feeling, but also no slippery feeling either.\n\n✨️Effects ✨️\nLooking at the Golden Jojoba ingredients, it contains panthenol, centella asiatica extract, etc., which I know help the skin barrier. It's nice that it protects the skin barrier while cleansing. Especially since I have redness-prone skin, I could see the redness gradually improve after cleansing.\nAlso, since you can use the soft foam right away, there's barely any irritation to the skin, which I liked. After washing, moisture remains on the skin, leaving it moisturized.\n\n🧫 Ingredients 🧫\nI always check ingredients when buying cosmetics. This product has none of the 20 caution ingredients, so I could use it freely with peace of mind.\n\n🤭 Scent 🤭\nI know fragrance can be harmful to the body so I prefer fragrance-free products, and this jojoba cleanser is fragrance-free, which I liked.","zh-CN":"😄 肤质😄 有泛红的混合性肌肤，皮肤屏障和水分值正常\n\n💧 质地 💧\n正如名字一样是气泡洁面，泡沫非常蓬松。一般洁面泡沫要用手掌搓或放进起泡网才能出细腻泡沫，比较麻烦，气泡洁面能一次直接洁面，很方便。让人惊讶的是没有添加表面活性剂却泡沫这么丰富。考虑成分选洁面泡沫时，泡沫少总会觉得有点遗憾，但金色荷荷巴洁面成分好、泡沫又丰富，这点很满意。\n\n🤗 使用感 🤗\n泡沫丰富，用手洗脸时摩擦感较少，很喜欢。是弱酸性，虽没有洗到吱吱响的感觉，但也不滑腻。\n\n✨️效果 ✨️\n金色荷荷巴的成分里有泛醇、积雪草提取物等，知道这些都对皮肤屏障有帮助。洁面的同时还能保护皮肤屏障，感觉很好。特别是我有泛红问题，洁面后能确认泛红一点点得到改善。\n而且能直接用柔软的泡沫，皮肤几乎没有刺激，这点很好。洗后皮肤留有水分，变得水润。\n\n🧫 成分 🧫\n我买化妆品一定会看成分。这款不含20种需要注意的成分，用起来很放心，能尽情使用。\n\n🤭 香味 🤭\n我知道香料对人体有害，所以偏好无香产品，荷荷巴洁面无香这点很好。","zh-TW":"😄 膚質 😄 有泛紅的混合肌，皮膚屏障和水分度數值正常\n\n💧 質地 💧\n就像產品名字一樣是氣泡潔顏乳，泡沫非常豐盈。一般洗面乳要用手掌搓或放進起泡網才能做出柔軟泡沫，比較麻煩，但氣泡潔顏乳能一次就直接洗臉，很方便。驚訝的是完全不含界面活性劑，泡沫卻很豐盈。我很在意成分，用洗面乳時如果沒有泡沫，總覺得使用感有點可惜。但金盞荷荷芭潔顏乳成分溫和又泡沫豐盈，這點讓我很滿意。\n\n🤗 使用感 🤗\n泡沫豐盈，用手洗臉時摩擦感較少，這點很喜歡。因為是弱酸性，沒有咕溜咕溜的乾淨感，但也不會滑膩。\n\n✨️效果 ✨️\n金盞荷荷芭裡看成分有泛醇、積雪草萃取物等，這些我知道都對皮膚屏障有幫助。洗臉的同時也能保護皮膚屏障，這點很不錯。特別是我有泛紅困擾，洗臉後也能確認泛紅逐漸有改善。而且柔軟的泡沫能直接使用，皮膚幾乎感覺不到刺激，很喜歡。洗完臉皮膚留有水分感，變得水潤。\n\n🧫 成分 🧫\n買化妝品時我一定會看成分。這款產品不含20種需注意的成分，能放心大膽使用，這點很棒。\n\n🤭 香味 🤭\n知道香料對人體有害，所以我偏好無香產品，這款荷荷芭潔顏乳是無香的，這點很喜歡。",ja:"😄肌タイプ😄赤みのある混合肌、肌バリアと水分値は正常値\n\n💧テクスチャー💧\n製品名の通りバブルクレンザーなので泡が豊かにできます。普通の洗顔フォームは手のひらでこすったり泡立てネットに入れたりしないと柔らかい泡ができなくて面倒ですが、バブルクレンザーは一度でそのまま洗顔できて楽です。驚いたのは界面活性剤が入っていないのに泡が豊かだという点でした。成分を考えて洗顔フォームを使うとき泡がないとどうしても使うときに物足りなさを感じることがあったんです。でもゴールデンホホバクレンザーは成分も優しいのに泡も豊かで、この点が満足でした。\n\n🤗使用感🤗\n泡が豊かなので手で顔を洗うとき摩擦感が少なく感じられて良かったです。弱酸性なのでキュッキュッとした感じはありませんが、ぬるぬるした感じもない方です。\n\n✨️効果✨️\nゴールデンホホバの成分を見るとパンテノール、ツボクサエキスなどが入っていますが、これらは全部肌バリアに役立つと知っています。クレンジングしながら肌バリアを守れるのが良い気がします。特に私は赤みのある肌なのですが、クレンジング後赤みも少しずつ改善されるのを確認できました。\nそして柔らかい泡がすぐ使えるので肌への刺激がほとんどなくて良かったです。洗顔後肌に水分感が残ってしっとりします。\n\n🧫成分🧫\n私はコスメを買うとき成分を必ず見ます。この製品には20種類の注意成分が入っていないので安心して思う存分使えて良いですね。\n\n🤭香り🤭\n香料が人体に有害だと知っているので無香製品を好みますが、ホホバクレンザーは無香で良かったです。",th:"😄 ประเภทผิว 😄 ผิวผสมที่มีผื่นแดง เกราะผิวและระดับความชุ่มชื้นอยู่ในเกณฑ์ปกติ\n\n💧 เนื้อสัมผัส 💧\nสมชื่อบับเบิลคลีนเซอร์ ฟองฟูมาก โฟมล้างหน้าทั่วไปต้องขยี้ด้วยฝ่ามือหรือใส่ที่ตีฟองถึงจะได้ฟองนุ่มๆ ยุ่งยาก แต่บับเบิลคลีนเซอร์ล้างหน้าได้ทันทีสะดวกมาก ที่น่าทึ่งคือไม่มีสารลดแรงตึงผิวแต่ฟองยังฟูมาก ปกติเลือกโฟมล้างหน้าโดยดูส่วนผสมเป็นหลัก แต่ถ้าไม่มีฟองก็มักจะรู้สึกไม่ค่อยพอใจตอนใช้ แต่โกลเด้นโฮโฮบาคลีนเซอร์ทั้งส่วนผสมดีและฟองก็ฟู พอใจจุดนี้มาก\n\n🤗 ความรู้สึกเมื่อใช้ 🤗\nฟองฟูเลยรู้สึกว่าแรงเสียดสีตอนล้างหน้าด้วยมือน้อยลง ชอบมาก เป็นกรดอ่อนเลยไม่สะอาดเอี๊ยดแต่ก็ไม่ลื่นเหนอะหนะเช่นกัน\n\n✨️ประสิทธิภาพ ✨️\nดูส่วนผสมของโกลเด้นโฮโฮบาแล้วมีแพนธีนอล สารสกัดใบบัวบก ซึ่งรู้ว่าดีต่อเกราะผิวทั้งหมด รู้สึกว่าปกป้องเกราะผิวได้ไปพร้อมกับล้างหน้า โดยเฉพาะฉันที่มีผื่นแดง หลังล้างหน้าก็รู้สึกได้ว่าผื่นแดงค่อยๆ ดีขึ้น\nแล้วใช้ฟองนุ่มได้ทันที แทบไม่ระคายเคืองผิวเลย ชอบมาก หลังล้างหน้าผิวยังคงความชุ่มชื้นไว้\n\n🧫 ส่วนผสม 🧫\nฉันเช็คส่วนผสมทุกครั้งตอนซื้อเครื่องสำอาง ผลิตภัณฑ์นี้ไม่มีส่วนผสมที่ต้องระวัง 20 ชนิด เลยใช้ได้อย่างอุ่นใจสบายใจ\n\n🤭 กลิ่น 🤭\nรู้ว่าน้ำหอมอาจเป็นอันตรายต่อร่างกาย เลยชอบผลิตภัณฑ์ไม่มีกลิ่น โฮโฮบาคลีนเซอร์นี้ไม่มีกลิ่นเลยชอบมาก"},images:[],video:null},
    {id:"qb2BDz6q",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"마스크 착용으로 인한 홍조·장벽손상+가려움 개선",en:"Improvement of mask-induced redness, barrier damage, and itchiness","zh-CN":"戴口罩导致的泛红·屏障受损+发痒得到改善","zh-TW":"因戴口罩導致的泛紅‧屏障受損+搔癢改善",ja:"マスク着用による赤み・バリア損傷+痒みの改善",th:"ผื่นแดง·เกราะผิวเสียหายจากการใส่หน้ากาก+อาการคันดีขึ้น"},date:"2026-05-24",
      quote:{ko:"폼클렌저를 다 썼을 때 마침 노마디아 호호바 오일 듀얼 마이크로 버블 클렌저로 꽉~찬 2주 사용하고 적는 후기 입니다:)\n\n*향: 무향입니다, 향에 민감하신 분들이 사용하시기에 좋습니다:)\n*제형: 버블 클랜저 답게 거품형입니다:) 쫀쫀 보다는 퐁신 퐁신한 느낌의 버블이고, 사용 전에 안에 오일층과 세안제 층이 따로 있기 때문에 흔들어서 사용해야 합니다:)\n*사용감: 폼클렌저를 사용할 떄 거품망을 꼭 사용하는 사람으로서 이런 버블형으로 된 제품을 굉장히 좋아합니다:)\n다만 버블 제형 중에서는 세정려깅 너무 강해서 세안 후에 얼굴이 쩍쩍 갈라지는 제품이 많아서 보통은 젤클렌저 혹은 약상성의 일반 반고체 제형의 폼클렌저를 사용했는데 노마디아 호호바 오일 버블 클렌저는 호호바 오일이 들어 있어서 그런지 세안 후에 얼굴 당김이 단 1도 없어서 애정하며 2주간 아낌 없이 밤 낮으로 사용할 수 있었습니다:)\n\n*후기 추가: 최근 몇주간 날씨는 건조한데 햇볕은 강한 날씨라 세안부터 얼굴에 화장품을 바르는 것까지 신경이 많이 쓰였습니다. 노마디아 호호바 오일 버블 클렌저를 사용한 덕분에 건조한 날씨에도 얼굴 당김 없이 편하게 세안 할 수 있었습니다:) 그리고 최근 마스크를 많이 쓰고 다니면서 홍조와 피부 장벽 무너짐이 자주 와서 고생했는데. 홍조 많이 줄어들었고 피부 가려움도 정말 많이 개선 되었습니다:)\n\n홍조와 피부 장벽 무너짐으로 고생중이신 분들이 있으시다면 꼭 사용해 보셨으면 좋겠습니다:) 저도 재구매해서 사용할 예정입니다:)\n\n제가 너무 자주 사용해서 그런지 벌써 반이나 사용해 버린 점... 이랄까요??:) 피부당김이 없어서 땀날 때마다 자주 사용했습니다:)",en:"Right when I finished up my foam cleanser, I happened to have NOMADIA's Jojoba Oil Dual Micro Bubble Cleanser, so here's my review after a full 2 weeks of use :)\n\n*Scent: fragrance-free, good for people sensitive to scents :)\n*Texture: true to a bubble cleanser, it's a foam type :) the bubbles are more fluffy than bouncy, and since there are separate oil and cleanser layers inside before use, you need to shake it :)\n*Feel: as someone who always uses a foaming net with regular foam cleansers, I really like this bubble-type product :)\nBut among bubble-type products, a lot have too-strong cleansing power that leaves your face cracking-dry after washing, so I usually used gel cleansers or mildly acidic regular semi-solid foam cleansers, but with NOMADIA's Jojoba Oil Bubble Cleanser, maybe because it has jojoba oil in it, there was not even a hint of tightness after washing, so I loved it and used it liberally, morning and night, for 2 weeks straight :)\n\n*Additional review: over the past few weeks the weather's been dry but sunny, so I've been extra careful about everything from cleansing to applying skincare. Thanks to using NOMADIA's Jojoba Oil Bubble Cleanser, I could wash comfortably without tightness even in the dry weather :) And since I've been wearing a mask a lot lately, I'd been struggling with frequent redness and a compromised skin barrier - but the redness has reduced a lot and my skin itchiness has really improved too :)\n\nIf anyone out there is struggling with redness and a broken skin barrier, I really hope you try this :) I'm planning to repurchase and keep using it too :)\n\nMaybe because I used it so often, I've already gone through half the bottle... :) Since there's no tightness on my skin, I used it often whenever I sweated :)","zh-CN":"洁面泡沫用完的时候刚好换上NOMADIA荷荷巴油双重微气泡洁面，整整用了两周，写下这篇测评:)\n\n*香味：无香，对香味敏感的人用起来很好:)\n*质地：不愧是气泡洁面，是泡沫型:)不是紧实型而是蓬松柔软的气泡感，使用前因为油层和洁面剂层是分开的，所以要摇匀之后再用:)\n*使用感：我是那种用洁面泡沫一定要用起泡网的人，特别喜欢这种气泡类型的产品:)\n不过气泡类产品中，很多清洁力太强以至于洗完脸后脸会裂开一样紧绷，所以我平时一般用凝胶洁面或弱酸性的一般半固态泡沫洁面，NOMADIA荷荷巴油气泡洁面可能是含荷荷巴油的缘故，洗后脸完全没有一点紧绷感，很喜欢，两周内早晚都毫不吝惜地用了:)\n\n*补充心得：最近几周天气干燥又阳光强烈，从洁面到涂抹护肤品都很费心。多亏用了NOMADIA荷荷巴油气泡洁面，就算天气干燥，脸也不紧绷，能舒适地洁面:)而且最近经常戴口罩，泛红和皮肤屏障崩溃经常发生让我很困扰。用了之后泛红明显减少了，皮肤发痒也真的改善了很多:)\n\n如果有正被泛红和皮肤屏障问题困扰的朋友，真心推荐试试:)我也打算回购继续用:)\n\n可能是我用得太频繁，已经用掉一半了……可以这么说吧？:)因为洗后不紧绷，只要出汗就会经常用。","zh-TW":"原本的洗面乳用完，剛好用NOMADIA荷荷芭油雙重微氣泡潔顏乳整整用了兩週，來寫心得:)\n\n*香味：無香，對香味敏感的人使用起來很不錯:)\n*質地：不愧是氣泡潔顏乳，是泡沫型:)不是紮實感，而是蓬鬆的氣泡感，使用前因為裡面油層和潔顏劑層是分開的，一定要搖勻使用:)\n*使用感：我是用洗面乳一定要用起泡網的人，非常喜歡這種氣泡型產品:)\n不過氣泡型產品中，有很多因為潔淨力太強，洗完臉臉會像要裂開一樣，所以我平常都用凝露型或弱酸性一般半固體型洗面乳，但NOMADIA荷荷芭油氣泡潔顏乳可能因為含有荷荷芭油，洗完臉完全不緊繃，讓我很喜愛，兩週內早晚都毫無保留地一直用:)\n\n*心得補充：最近幾週天氣乾燥但陽光又強，從洗臉到擦保養品我都特別在意。多虧用了NOMADIA荷荷芭油氣泡潔顏乳，就算天氣乾燥，也能舒服地洗臉不緊繃:)而且最近常常戴口罩，泛紅和皮膚屏障崩壞常常讓我很困擾，泛紅明顯減少，皮膚發癢也真的改善很多:)\n\n如果有正在為泛紅和皮膚屏障崩壞困擾的人，一定要試試看:)我也打算回購繼續使用:)\n\n因為我用得太頻繁，已經用掉一半了……算是這樣吧？:)因為不緊繃，流汗的時候就會很想常常用",ja:"洗顔フォームを使い切ったとき、ちょうどNOMADIAホホバオイルデュアルマイクロバブルクレンザーで丸々2週間使って書くレビューです:)\n\n*香り：無香です。香りに敏感な方が使うのに良いです:)\n*テクスチャー：バブルクレンザーらしく泡タイプです:)とろみというよりふわふわした感じのバブルで、使用前に中でオイル層と洗浄剤層が分かれているので振ってから使う必要があります:)\n*使用感：洗顔フォームを使うとき必ず泡立てネットを使う人として、こういうバブルタイプの製品がとても好きです:)\nただバブルタイプの中には洗浄力が強すぎて洗顔後に顔がパリパリする製品が多いので、普段はジェルクレンザーまたは弱酸性の普通の半固形フォームクレンザーを使っていたのですが、NOMADIAホホバオイルバブルクレンザーはホホバオイルが入っているからか、洗顔後に顔のつっぱりが1ミリもなくて気に入り、2週間存分に朝晩使うことができました:)\n\n*追加レビュー：最近数週間、天気は乾燥しているのに日差しは強い天気で、洗顔から顔にコスメを塗ることまでとても気を使いました。NOMADIAホホバオイルバブルクレンザーを使ったおかげで、乾燥した天気でも顔がつっぱらず快適に洗顔できました:)そして最近マスクをたくさんつけて過ごしていて赤みと肌バリアの崩れがよく来て苦労していたのですが、赤みがかなり減って肌の痒みも本当にかなり改善されました:)\n\n赤みと肌バリアの崩れで苦労中の方がいらっしゃれば、ぜひ使ってみてほしいです:)私もリピートして使う予定です:)\n\n私があまりに頻繁に使ったせいか、もう半分も使ってしまった点…と言いましょうか??:)肌のつっぱりがないので汗をかくたびによく使いました:)",th:"พอโฟมล้างหน้าที่ใช้อยู่หมดพอดี ก็เปลี่ยนมาใช้บับเบิลคลีนเซอร์โฮโฮบาออยล์ดูอัลไมโครของโนมาเดียเต็ม 2 สัปดาห์ มารีวิวค่ะ:)\n\n*กลิ่น: ไม่มีกลิ่น เหมาะกับคนที่แพ้กลิ่นง่าย:)\n*เนื้อสัมผัส: สมชื่อบับเบิลคลีนเซอร์ เป็นรูปแบบฟอง:) เป็นฟองฟูนุ่มมากกว่าหนึบ ก่อนใช้มีชั้นออยล์กับชั้นตัวล้างหน้าแยกกันอยู่ข้างใน ต้องเขย่าก่อนใช้:)\n*ความรู้สึกเมื่อใช้: ในฐานะคนที่ต้องใช้ตาข่ายตีฟองทุกครั้งตอนใช้โฟมล้างหน้า ชอบผลิตภัณฑ์แบบบับเบิลนี้มากๆ:)\nแต่ในบรรดาบับเบิลคลีนเซอร์ หลายตัวแรงทำความสะอาดแรงเกินจนหน้าแตกหลังล้างหน้า ปกติเลยใช้เจลคลีนเซอร์หรือโฟมกรดอ่อนเนื้อกึ่งแข็งทั่วไปแทน แต่บับเบิลคลีนเซอร์โฮโฮบาออยล์ของโนมาเดียอาจเพราะมีน้ำมันโฮโฮบา หลังล้างหน้าไม่ตึงเลยแม้แต่นิดเดียว เลยรักมากและใช้อย่างไม่ยั้งทั้งเช้าเย็นตลอด 2 สัปดาห์เลยค่ะ:)\n\n*รีวิวเพิ่มเติม: ช่วงหลายสัปดาห์ที่ผ่านมาอากาศแห้งแต่แดดแรงมาก เลยต้องระวังตั้งแต่ล้างหน้าจนถึงทาเครื่องสำอาง แต่พอใช้บับเบิลคลีนเซอร์โฮโฮบาออยล์ของโนมาเดีย ก็ล้างหน้าได้อย่างสบายโดยไม่ตึงแม้อากาศแห้ง:) แล้วช่วงนี้ใส่หน้ากากบ่อยจนมีผื่นแดงและเกราะผิวพังบ่อยๆ ทรมานมาก แต่ผื่นแดงลดลงเยอะและอาการคันก็ดีขึ้นมากจริงๆ:)\n\nถ้าใครกำลังทรมานกับผื่นแดงและเกราะผิวพัง อยากให้ลองใช้ดูจริงๆ ค่ะ:) ฉันเองก็ตั้งใจจะซื้อซ้ำมาใช้ต่อค่ะ:)\n\nเพราะใช้บ่อยเกินไป เลยใช้ไปครึ่งขวดแล้ว... ประมาณนั้นค่ะ??:) เพราะไม่ตึงหลังล้างหน้า เลยใช้บ่อยทุกครั้งที่เหงื่อออกเลยค่ะ:)"},images:[],video:null},
    {id:"AwewmlwZ",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"일반 피부",en:"Normal skin","zh-CN":"普通肌","zh-TW":"一般肌膚",ja:"普通肌",th:"ผิวปกติ"},highlight:{ko:"수영·운동 후 일시적으로 약해진 피부장벽에 사용 추천 (영상 첨부)",en:"Recommended for a temporarily weakened skin barrier after swimming or exercise (video attached)","zh-CN":"推荐用于游泳·运动后暂时变弱的皮肤屏障（附视频）","zh-TW":"推薦游泳‧運動後暫時變弱的皮膚屏障使用（附影片）",ja:"水泳・運動後に一時的に弱くなった肌バリアへの使用をおすすめ(動画添付)",th:"แนะนำใช้เมื่อเกราะผิวอ่อนแอชั่วคราวหลังว่ายน้ำ·ออกกำลังกาย (มีวิดีโอแนบ)"},date:"2026-06-13",
      quote:{ko:"세안 후에 당기지 않는 클렌저를 오래 찾고 있었어요. \n\n처음 받았을 때 용기가 생각보다 길어서 손으로 들고 짜기엔 좀 무거웠어요. 그래서 세면대에 올려두고 뚜껑만 눌러서 사용하고 있어요. 펌핑 방식이라 이게 오히려 편하더라고요. 두세 번만 눌러도 풍성한 거품이 바로 나와서 거품 만드는 시간도 따로 필요 없어요.\n\n가장 좋았던 건 세안 후 당김이 없다는 점이에요. 일반적인 폼 클렌저들은 깨끗하게 닦이는 대신 사용 후 피부가 빡빡한 느낌이 드는데, 이 제품은 그런 느낌이 거의 없어요. 세안 자체에서도 피부장벽을 생각한 처방이라는 브랜드 철학이 좋아서 시도해봤는데, 실제로 그 차이가 느껴져요.\n\n피부가 비교적 튼튼한 편이지만, 수영을 하거나 운동을 한 후에는 피부장벽이 일시적으로 약해지는 느낌이 들어요. 그럴 때 사용하면 특히 좋을 것 같아요. \n\n한 가지 제안하자면 — 본품 구매할 때 미니 사이즈를 함께 구매할 수 있으면 좋겠어요. 여행이나 휴가, 운동 가방에 챙기기 좋은 사이즈로요. 수영장이나 헬스장 락커에 두고 사용할 수 있게요.",en:"I'd been searching for a long time for a cleanser that doesn't leave tightness after washing.\n\nWhen I first got it, the bottle was longer than I expected so it was a bit heavy to hold and squeeze by hand. So I keep it standing on the sink and just press the cap down. It's a pump type, and that actually turned out to be convenient. Just two or three presses give you rich foam right away, so there's no need to spend time working up a lather.\n\nWhat I liked best was there's no tightness after washing. Regular foam cleansers clean thoroughly but leave your skin feeling tight and stiff afterward - this one barely has that feeling. I tried it because I liked the brand philosophy of formulating cleansing with the skin barrier in mind, and I could genuinely feel that difference.\n\nMy skin is relatively sturdy, but after swimming or exercising I feel like my skin barrier gets temporarily weaker. This seems especially good to use at those times.\n\nOne suggestion - I'd love if a mini size were available to buy alongside the full size. A size convenient to pack for travel, vacations, or a gym bag. So it could be kept in a pool or gym locker.","zh-CN":"我一直在找洗后不紧绷的洁面产品。\n\n刚拿到的时候瓶身比想象中长，用手拿着挤感觉有点重。所以我把它放在洗手台上，只按压瓶盖使用。是按压式设计，这样反而更方便。只按两三下蓬松的泡沫立刻就出来了，不用另外花时间打泡。\n\n最喜欢的是洗后不紧绷这点。一般洁面泡沫虽然能洗得干净，但用完之后皮肤会有僵硬的感觉，这款几乎没有这种感觉。看到品牌理念是从洁面这一步就考虑皮肤屏障的配方，就试了一下，实际上确实能感受到差别。\n\n我皮肤算比较强健的，但游泳或运动之后会感觉皮肤屏障暂时变弱。那种时候用这款应该会特别合适。\n\n有一点建议——买正装的时候如果能一起买到迷你装就好了。适合旅行、休假或运动包携带的尺寸，可以放在泳池或健身房储物柜里用。","zh-TW":"我一直在找洗完臉不緊繃的潔顏產品。\n\n剛收到時瓶身比想像中長，用手拿著擠壓有點重。所以我放在洗手台上，只按壓瓶蓋使用。是按壓式設計，反而覺得很方便。只按兩三次就能馬上出現豐盈泡沫，不需要另外花時間起泡。\n\n最喜歡的一點是洗完臉不緊繃。一般洗面乳雖然能洗得乾淨，但用完之後皮膚常有僵硬感，這款幾乎沒有這種感覺。品牌理念是連清潔這一步都考慮到皮膚屏障，我覺得這個理念很好才試用，實際用了之後真的能感受到差異。\n\n我皮膚算是比較強韌的類型，但游泳或運動之後，皮膚屏障會感覺暫時變弱。這種時候用這款應該特別合適。\n\n有個小建議——希望在購買正裝時能一起買到迷你尺寸。適合旅行、度假或放進運動包的尺寸。可以放在游泳池或健身房置物櫃使用。",ja:"洗顔後つっぱらないクレンザーを長い間探していました。 \n\n初めて受け取ったとき、容器が思ったより長くて手で持って出すには少し重かったです。それで洗面台に置いて蓋だけ押して使っています。ポンプ方式なのでこれがむしろ便利でした。2〜3回押すだけで豊かな泡がすぐ出てくるので、泡立てる時間も別にいりません。\n\n一番良かったのは洗顔後つっぱりがないという点です。一般的な洗顔フォームはきれいに落ちる代わりに使用後肌がこわばる感じがしますが、この製品はそういう感じがほとんどありません。洗顔自体に肌バリアを考えた処方だというブランド哲学が良くて試してみましたが、実際にその違いが感じられます。\n\n肌が比較的丈夫な方ですが、水泳をしたり運動をしたりした後は肌バリアが一時的に弱くなる感じがします。そういうときに使うと特に良さそうです。 \n\n一つ提案するなら—本品を購入するときミニサイズも一緒に購入できると良いですね。旅行や休暇、運動バッグに入れやすいサイズで。プールやジムのロッカーに置いて使えるように。",th:"หาคลีนเซอร์ที่ล้างหน้าแล้วไม่ตึงมานานแล้วค่ะ \n\nตอนได้รับมาครั้งแรก ขวดยาวกว่าที่คิด ถือแล้วบีบด้วยมือค่อนข้างหนัก เลยวางไว้บนอ่างล้างหน้าแล้วกดฝาปั๊มแทน เป็นแบบปั๊มเลยสะดวกกว่า แค่กดสองสามครั้งก็ได้ฟองฟูออกมาทันที ไม่ต้องเสียเวลาตีฟองแยก\n\nสิ่งที่ชอบที่สุดคือหลังล้างหน้าไม่ตึงเลย โฟมทั่วไปมักจะสะอาดหมดจดแต่หลังใช้ผิวจะรู้สึกแข็งกระด้าง แต่ผลิตภัณฑ์นี้แทบไม่มีความรู้สึกแบบนั้นเลย ลองใช้เพราะชอบปรัชญาแบรนด์ที่คิดถึงเกราะผิวตั้งแต่ขั้นตอนล้างหน้า แล้วก็รู้สึกได้ถึงความแตกต่างจริงๆ\n\nผิวค่อนข้างแข็งแรง แต่หลังว่ายน้ำหรือออกกำลังกายจะรู้สึกว่าเกราะผิวอ่อนแอลงชั่วคราว ช่วงนั้นใช้ผลิตภัณฑ์นี้น่าจะดีเป็นพิเศษ \n\nขอเสนอแนะอย่างหนึ่ง — อยากให้มีไซส์มินิให้ซื้อคู่กับตัวใหญ่ด้วย เป็นขนาดที่พกไปเที่ยว ไปพักผ่อน หรือใส่กระเป๋าออกกำลังกายได้ เพื่อวางไว้ในล็อกเกอร์สระว่ายน้ำหรือฟิตเนสได้ค่ะ"},images:[],video:null},
    {id:"JR7o1wzZ",rating:4,skinType:{ko:"지성",en:"Oily","zh-CN":"油皮","zh-TW":"油性肌膚",ja:"脂性肌",th:"ผิวมัน"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"지성, 건성·복합성 및 세안 후 건조함 고민에 추천",en:"Oily skin, recommended for dry/combination skin and post-wash dryness concerns","zh-CN":"油皮，推荐给干皮·混合肌及洗后干燥困扰的人","zh-TW":"油性肌，推薦給乾性‧混合性及洗完臉乾燥困擾的人",ja:"脂性肌、乾燥肌・混合肌や洗顔後の乾燥の悩みにおすすめ",th:"ผิวมัน แนะนำสำหรับผิวแห้ง·ผิวผสมและคนที่กังวลเรื่องแห้งหลังล้างหน้า"},date:"2026-06-11",
      quote:{ko:"평소 지성 피부라 세안 후 산뜻한 마무리감을 선호하는 편인데, 이번에 노마디아 골든 호호바 10% 듀얼 마이크로 버블 클렌저를 사용해볼 기회가 생겨 직접 사용해봤습니다.\n\n제품은 사용 전 가볍게 흔들어 내용물을 섞어준 뒤 펌핑하면 바로 풍성한 거품이 나오는 타입이에요. 별도로 거품을 낼 필요가 없어 바쁜 아침에도 간편하게 사용할 수 있었고, 거품 입자가 촘촘하고 부드러워 피부에 자극 없이 롤링하기 좋았습니다.\n\n호호바오일 10%와 판테놀, 세라마이드 NP, 베타인 등 보습 성분이 함유되어 있어서 그런지 세안 후에도 피부가 건조하거나 당기는 느낌은 거의 없었어요. 특히 평소 세안 후 바로 기초 제품을 바르지 않으면 피부가 땅기는 경우가 있었는데, 이 제품은 세안 직후에도 피부가 편안하게 유지되는 점이 인상적이었습니다.\n\n세정력도 무난한 편이었어요. 일상적인 노폐물이나 선크림 정도는 깔끔하게 세정되는 느낌이었고, 세안 후 피부가 과하게 건조해지지 않아 데일리 클렌저로 사용하기 좋았습니다.\n\n다만 개인적으로는 지성 피부라 그런지, 또는 보습 성분 때문인지 헹굴 때 약간의 보습막이 남아있는 듯한 사용감이 느껴졌어요. 피부가 촉촉하게 보호되는 느낌으로 받아들일 수도 있지만, 저처럼 뽀득하고 산뜻한 마무리감을 선호하는 분들은 처음 사용할 때 약간 잔여감처럼 느껴질 수도 있을 것 같습니다.\n\n전반적으로 세안 후 당김이 적고 부드러운 사용감을 가진 클렌저였으며, 건성·복합성 피부나 세안 후 건조함이 고민인 분들에게 특히 잘 맞을 것 같다는 생각이 들었습니다.\n\n✔ 좋았던 점\n\n● 풍성하고 부드러운 마이크로 버블 거품\n● 세안 후 당김이 적음\n● 사용이 간편한 펌프 타입\n● 자극 없이 부드러운 사용감",en:"My skin is usually oily so I prefer a fresh finish after washing, and I got the chance to try NOMADIA's Golden Jojoba 10% Dual Micro Bubble Cleanser myself this time.\n\nThe product is the type where you lightly shake it to mix the contents before pumping, and rich foam comes out right away. No need to lather separately, so it was easy to use even on busy mornings, and the foam particles were dense and soft, good for rolling on the skin without irritation.\n\nMaybe because it contains 10% jojoba oil, panthenol, ceramide NP, betaine and other moisturizing ingredients, there was barely any dryness or tightness even after washing. In particular, my skin usually feels tight if I don't apply skincare right after washing, but with this product I was impressed that my skin stayed comfortable right after cleansing too.\n\nThe cleansing power was also decent. It felt like everyday grime or sunscreen got cleaned off thoroughly, and my skin didn't get overly dry after washing, so it was good to use as a daily cleanser.\n\nHowever, personally - maybe because I have oily skin, or because of the moisturizing ingredients - I felt like a slight moisture film remained while rinsing. It could be taken as skin being protected and left moisturized, but people who prefer a squeaky, fresh finish like me might feel it as a bit of residue at first.\n\nOverall it was a cleanser with little tightness after washing and a gentle feel, and I think it would especially suit those with dry or combination skin, or anyone concerned about dryness after washing.\n\n✔ What I liked\n\n● Rich, soft micro-bubble foam\n● Little tightness after washing\n● Easy-to-use pump type\n● Gentle feel with no irritation","zh-CN":"我平时是油皮，偏好洗后清爽的收尾感，这次有机会亲自试用了NOMADIA金色荷荷巴10%双重微气泡洁面。\n\n产品是使用前轻轻摇匀混合内容物，按压后立刻出蓬松泡沫的类型。不用另外打泡，忙碌的早晨也能方便使用，泡沫颗粒细密柔软，无刺激地打圈很舒服。\n\n可能是含有10%荷荷巴油以及泛醇、神经酰胺NP、甜菜碱等保湿成分，洗后几乎不觉得干燥或紧绷。特别是我平时如果洗完不马上涂基础护肤品皮肤就会紧绷，但这款洗完之后皮肤依然保持舒适，这点印象深刻。\n\n清洁力也还不错。日常废物或防晒程度能干净清洁，洗后皮肤也不会过度干燥，当日常洁面产品很合适。\n\n不过个人感觉，可能是我是油皮，或者是保湿成分的关系，冲洗时感觉有一层淡淡的保湿膜残留。可以理解为皮肤被水润保护的感觉，但像我这样偏好清爽收尾感的人，第一次用可能会觉得有点像残留感。\n\n整体来说是洗后紧绷少、使用感柔和的洁面产品，感觉特别适合干性、混合性肌肤，或洗后干燥困扰的人。\n\n✔ 喜欢的地方\n\n● 蓬松柔软的微气泡\n● 洗后紧绷感少\n● 使用简便的泵头类型\n● 无刺激的柔和使用感","zh-TW":"我平常是油性肌，偏好洗完臉清爽的收尾感，這次剛好有機會試用NOMADIA金盞荷荷芭10%雙重微氣泡潔顏乳。\n\n使用前輕輕搖勻，按壓就會馬上出現豐盈泡沫的類型。不用另外起泡，忙碌的早晨也能簡單使用，泡沫顆粒細緻柔軟，在皮膚上打圈完全無刺激。\n\n可能因為含有10%荷荷芭油和泛醇、神經醯胺NP、甜菜鹼等保濕成分，洗完臉後幾乎感覺不到乾燥或緊繃。特別是我平常如果洗完臉不馬上擦保養品皮膚就會緊繃，但這款洗完臉後皮膚依然舒適，讓我印象深刻。\n\n潔淨力也還不錯。日常老廢物或防曬乳都能清潔得很乾淨，洗完臉後皮膚也不會過度乾燥，適合當日常潔顏產品。\n\n不過個人可能因為是油性肌，或因為保濕成分的關係，沖水時感覺留有一點點保濕膜的使用感。可以理解成皮膚被水潤保護著，但像我這種偏好咕溜咕溜清爽收尾的人，第一次用可能會覺得有點像殘留感。\n\n整體來說是洗完臉緊繃感少、使用感柔順的潔顏產品，我覺得特別適合乾性、混合性肌膚，或正被洗完臉乾燥困擾的人。\n\n✔ 喜歡的地方\n\n● 豐盈柔軟的微氣泡\n● 洗完臉緊繃感少\n● 使用簡便的按壓瓶\n● 無刺激柔順的使用感",ja:"普段脂性肌なので洗顔後のさっぱりした仕上がりを好む方ですが、今回NOMADIAゴールデンホホバ10%デュアルマイクロバブルクレンザーを使ってみる機会があったので実際に使ってみました。\n\n製品は使用前に軽く振って中身を混ぜた後ポンプするとすぐ豊かな泡が出てくるタイプです。別途泡立てる必要がなく忙しい朝でも簡単に使えて、泡の粒子がきめ細かく柔らかいので肌に刺激なくローリングしやすかったです。\n\nホホバオイル10%とパンテノール、セラミドNP、ベタインなど保湿成分が含まれているからか、洗顔後も肌が乾燥したりつっぱったりする感じがほとんどありませんでした。特に普段洗顔後すぐスキンケアをつけないと肌がつっぱることがあったのですが、この製品は洗顔直後も肌が快適に保たれる点が印象的でした。\n\n洗浄力も無難な方でした。日常的な老廃物や日焼け止め程度はすっきり洗浄される感じで、洗顔後肌が過度に乾燥しないのでデイリークレンザーとして使うのに良かったです。\n\nただ個人的には脂性肌だからか、または保湿成分のせいか、すすぐとき少し保湿膜が残っているような使用感を感じました。肌がしっとり守られている感じとして受け取ることもできますが、私のようにキュッキュッとさっぱりした仕上がりを好む方は、最初使うとき少し残留感のように感じるかもしれません。\n\n全体的に洗顔後のつっぱりが少なく柔らかい使用感を持つクレンザーで、乾燥肌・混合肌や洗顔後の乾燥が悩みの方に特に合いそうだと思いました。\n\n✔良かった点\n\n●豊かで柔らかいマイクロバブルの泡\n●洗顔後のつっぱりが少ない\n●使用が簡単なポンプタイプ\n●刺激なく柔らかい使用感",th:"ปกติเป็นผิวมัน เลยชอบความรู้สึกสดชื่นหลังล้างหน้า ครั้งนี้ได้โอกาสลองใช้โกลเด้นโฮโฮบา 10% ดูอัลไมโครบับเบิลคลีนเซอร์ของโนมาเดียโดยตรงค่ะ\n\nก่อนใช้เขย่าเบาๆ ให้เนื้อผสมกันแล้วกดปั๊ม ฟองฟูออกมาทันที ไม่ต้องตีฟองแยก ใช้งานสะดวกแม้ตอนเช้าที่วุ่นวาย ฟองละเอียดและนุ่มนวล นวดคลึงบนผิวได้ดีโดยไม่ระคายเคือง\n\nมีน้ำมันโฮโฮบา 10% แพนธีนอล เซราไมด์เอ็นพี เบทาอีน และส่วนผสมให้ความชุ่มชื้นอื่นๆ อาจเพราะแบบนั้นหลังล้างหน้าแทบไม่รู้สึกแห้งหรือตึงเลย โดยเฉพาะปกติถ้าไม่รีบทาสกินแคร์ทันทีหลังล้างหน้าจะรู้สึกตึง แต่ผลิตภัณฑ์นี้หลังล้างหน้าทันทีผิวยังคงสบายอยู่ ประทับใจมาก\n\nแรงทำความสะอาดก็โอเคดี รู้สึกว่าล้างสิ่งสกปรกประจำวันหรือครีมกันแดดออกได้หมดจด หลังล้างหน้าไม่แห้งเกินไป เหมาะเป็นคลีนเซอร์ประจำวัน\n\nแต่ส่วนตัวอาจเพราะเป็นผิวมัน หรือเพราะส่วนผสมให้ความชุ่มชื้น ตอนล้างออกรู้สึกเหมือนมีฟิล์มความชุ่มชื้นเหลืออยู่นิดหน่อย อาจมองว่าเป็นความรู้สึกที่ผิวได้รับการปกป้องอย่างชุ่มชื้น แต่คนที่ชอบความรู้สึกสะอาดเอี๊ยดสดชื่นแบบฉัน อาจรู้สึกเหมือนมีคราบตกค้างนิดหน่อยตอนใช้ครั้งแรก\n\nโดยรวมเป็นคลีนเซอร์ที่หลังล้างหน้าตึงน้อยและความรู้สึกเมื่อใช้นุ่มนวล คิดว่าน่าจะเหมาะเป็นพิเศษกับผิวแห้ง·ผิวผสม หรือคนที่กังวลเรื่องแห้งหลังล้างหน้า\n\n✔ จุดที่ชอบ\n\n● ฟองไมโครบับเบิลที่ฟูและนุ่มนวล\n● หลังล้างหน้าตึงน้อย\n● เป็นแบบปั๊มใช้งานง่าย\n● ความรู้สึกเมื่อใช้นุ่มนวลไม่ระคายเคือง"},images:[],video:null},
    {id:"Jk8nb5pZ",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"민감성 뾰루지 많은 피부, 촉촉하면서도 트러블 없음 강력 만족",en:"Sensitive skin prone to breakouts, super satisfied - moisturizing yet no breakouts","zh-CN":"敏感性痘痘多发肌肤，水润又不长痘，非常满意","zh-TW":"敏感肌痘痘多的膚質，水潤又不長痘，超級滿意",ja:"敏感肌でニキビが多い肌、しっとりしながらもトラブルなく大満足",th:"ผิวแพ้ง่ายที่มีสิวเยอะ ชุ่มชื้นและไม่เกิดสิว พอใจมากๆ"},date:"2026-06-18",
      quote:{ko:"이거 너어어무 좋아요 진짜 진심×100000\n\n❤️ 자극 없는 촉촉한 세정력\n호호바 오일 클렌징폼이라서 그런지 씻고나면 엄청 촉촉하고 피부가 편안한 느낌이에요..\n거품도 완전 몽글몽글 잘 나서 건성이신 분들은 완전 추천이고 지성분들도 세정력이 좋아서 피부 트러블 하나도 없이 사용할 수 있어요..\n(진짜 뜬금없지만 세수하다가 머리카락에 묻어서 같이 씻었는데 뻣뻣함 없이 매끄러워서 머리 감아봤는데 맨날 달고 살던 두피 트러블 다 없어져서..이거 샴푸로 대용량 만들어주면 좋겠어요..)\n\n❤️ 좋은 성분\n성분 자체가 좋아서 그런지 이거 쓰고 피부가 진짜 촉촉하고 차분해졌어요.. 민감성 피부라서 맨날 뾰루지 달고사는 저에게는 엄두도 못 냈던 촉촉한 폼클렌징인데 처음으로 촉촉한데도 좋다고 느꼈어요\n\n❤️ 사용하기 간편하고 청결\n흔들어서 누르기만 하면 거품이 몽글몽글 나오니까, 따로 손으로 거품 만들 필요가 없어서 엄청 편했고, 입구에 손이 잘 안 닿으니까 더 청결하게 사용할 수 있다고 생각합니다!!",en:"This is soooo good, genuinely ×100000\n\n❤️ Gentle, moisturizing cleansing power\nMaybe because it's a jojoba oil foam cleanser, my skin feels super moisturized and comfortable after washing..\nThe foam comes out really fluffy too, so it's a full recommend for anyone dry, and even oily-skinned people can use it with zero breakouts since the cleansing power is good..\n(Totally random but while washing my face some got on my hair and I washed it along with my face, and it wasn't stiff at all, it was smooth, so I tried washing my hair with it and all the scalp trouble I always had disappeared.. I wish they'd make a full-size shampoo version of this..)\n\n❤️ Good ingredients\nMaybe because the ingredients themselves are good, my skin got genuinely moisturized and calm after using this.. I have sensitive skin and always have breakouts, so a moisturizing foam cleanser was something I never even considered, but this is the first time I felt moisturized and satisfied at the same time\n\n❤️ Easy and hygienic to use\nJust shake and press and the foam comes out fluffy, so there's no need to work up a lather by hand separately, which was really convenient, and since your hand doesn't touch the opening much, I think it's more hygienic to use!!","zh-CN":"这个真的太好用了，真心×100000\n\n❤️ 无刺激的水润清洁力\n可能因为是荷荷巴油洁面泡沫，洗完之后皮肤超级水润舒适……\n泡沫也超级绵密，干皮的朋友们完全推荐，油皮用清洁力也不错，完全不长痘就能用……\n（虽然有点突兀，但洗脸的时候不小心弄到头发上一起洗了，结果头发不僵硬还很顺滑，就试着当洗发水用了一下，天天有的头皮问题全都消失了……真希望出个大容量当洗发水……）\n\n❤️ 好成分\n可能是成分本身就好，用完之后皮肤真的很水润平静……我是敏感肌，天天长痘痘，本来完全不敢想象水润的泡沫洁面，第一次觉得水润又好用\n\n❤️ 使用简便又干净\n摇一摇按一下泡沫就绵密地出来了，不用另外用手打泡，超级方便，而且手不用碰到出口，感觉能用得更干净!!","zh-TW":"這個真的超級好用，真心×100000\n\n❤️ 無刺激的水潤潔淨力\n可能因為是荷荷芭油洗面乳，洗完之後超級水潤、皮膚很舒服……\n泡沫也超級蓬鬆綿密，乾性肌完全推薦，油性肌潔淨力也很好，完全不長痘痘也能使用……\n（真的很突然但洗臉時不小心沾到頭髮一起洗了，結果頭髮沒有乾澀感反而很滑順，於是拿來洗頭，結果一直以來的頭皮困擾都消失了……希望能出大容量的洗髮版本……）\n\n❤️ 好成分\n可能因為成分本身好，用了之後皮膚真的變水潤又平靜……我是敏感肌，臉上常年掛著痘痘，本來想都不敢想能用水潤的洗面乳，第一次覺得水潤同時又好用\n\n❤️ 使用簡單又衛生\n只要搖一搖按壓，泡沫就會蓬鬆冒出來，不用另外用手起泡，超級方便，而且瓶口手不太會碰到，覺得能更衛生地使用!!",ja:"これめちゃくちゃ良いです本当に本気×100000\n\n❤️刺激のないしっとりした洗浄力\nホホバオイル洗顔フォームだからか、洗った後すごくしっとりして肌が快適な感じです…\n泡も完全にもこもこよく出るので、乾燥肌の方には完全におすすめで、脂性肌の方も洗浄力が良いので肌トラブル一つなく使えます…\n(本当に唐突ですが、洗顔中に髪の毛についてしまって一緒に洗ったのですが、ゴワゴワせず滑らかだったので髪を洗ってみたら、いつもつきまとっていた頭皮トラブルが全部なくなって…これシャンプーで大容量作ってほしいです…)\n\n❤️良い成分\n成分自体が良いからか、これを使って肌が本当にしっとりして落ち着きました…敏感肌でいつも吹き出物がある私には手が出せなかったしっとりした洗顔フォームですが、初めてしっとりしているのに良いと感じました\n\n❤️使いやすくて清潔\n振って押すだけで泡がもこもこ出てくるので、別に手で泡立てる必要がなくてすごく楽で、口の部分に手が触れにくいのでより清潔に使えると思います！！",th:"อันนี้ดีมากกกกจริงๆ จริงใจ×100000\n\n❤️ ทำความสะอาดชุ่มชื้นโดยไม่ระคายเคือง\nอาจเพราะเป็นโฟมล้างหน้าโฮโฮบาออยล์ พอล้างเสร็จแล้วชุ่มชื้นมากและผิวสบาย..\nฟองก็ฟูนุ่มออกมาดีมาก คนผิวแห้งแนะนำสุดๆ คนผิวมันก็แรงทำความสะอาดดี ใช้แล้วไม่มีสิวขึ้นเลย..\n(อันนี้แปลกดีแต่ตอนล้างหน้าเผลอโดนเส้นผมแล้วล้างไปด้วย ผมกลับลื่นเรียบไม่กระด้าง เลยลองสระผมดู ปัญหาหนังศีรษะที่มีอยู่ตลอดหายไปเลย..อยากให้ทำเป็นแชมพูขนาดใหญ่ด้วยจัง..)\n\n❤️ ส่วนผสมดี\nอาจเพราะส่วนผสมดีจริงๆ พอใช้แล้วผิวชุ่มชื้นและสงบลงมาก.. เป็นผิวแพ้ง่ายที่มีสิวขึ้นตลอด เลยไม่กล้าใช้โฟมล้างหน้าแบบชุ่มชื้นมาก่อน แต่ครั้งแรกที่รู้สึกว่าชุ่มชื้นแล้วก็ยังดีด้วย\n\n❤️ ใช้งานสะดวกและสะอาดถูกสุขอนามัย\nแค่เขย่าแล้วกดก็ได้ฟองฟูนุ่มออกมา ไม่ต้องตีฟองด้วยมือแยกเลยสะดวกมาก แล้วมือไม่ต้องสัมผัสปากขวดโดยตรง เลยคิดว่าใช้งานได้สะอาดถูกสุขอนามัยมากขึ้น!!"},images:[],video:null},
    {id:"A7wmjOPA",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"타 브랜드 폼클렌저 대비 - 장벽은 지키며 과피지만 제거되는 정돈감 (이미지 2장)",en:"Compared to other brands' foam cleansers - keeps the barrier intact while removing only excess sebum, leaving skin refined (2 images)","zh-CN":"对比其他品牌泡沫洁面 - 兼顾屏障保护和过多皮脂的清洁感（附2张图片）","zh-TW":"相較其他品牌洗面乳 - 守護屏障同時去除多餘皮脂的清爽整潔感（附圖2張）",ja:"他ブランドの洗顔フォームに比べて - バリアは守りながら過剰な皮脂だけ除去される整った感じ(画像2枚)",th:"เทียบกับโฟมล้างหน้ายี่ห้ออื่น - ปกป้องเกราะผิวแต่กำจัดไขมันส่วนเกิน ผิวดูเรียบเนียน (มีรูป 2 ภาพ)"},date:"2026-06-23",
      quote:{ko:"클렌징 밀크에 이어 버블 클렌저 후기도 남겨요! 저는 원래 다른 브랜드 포밍 클렌저를 쓰고 있어서 비교가 될 것 같아 써봤는데, 첫인상부터 달랐어요. 폼이 진짜 쫀쫀해요🫧 마이크로버블 이름답게 몇 초 지나도 안 꺼지고 손이랑 얼굴 위에서 탄성을 유지하더라고요. 덕분에 세안 중 마찰이나 자극이 확실히 덜했어요.\n\n가장 놀랐던 건 피부결 정돈효과였는데요, 쓰고 나면 묘하게 얼굴이 적당하게 뽀득해지는 느낌이 있어요. 속당김을 유발하는 뽀득함이 아니라, 피부 장벽은 지키면서 과한 피지만 제거해주는 그런 느낌이요. 민감성 피부한테 순하기만 한 게 아니라 좋은 스킨케어 한 것 같은 효과가 나서 진짜 감탄했어요ㅠㅠ\n\n무향 설계라 향에 예민해도 전혀 부담 없고, 디자인도 다른 더마 브랜드랑 달리 너무 예뻐서 욕실에 두기만 해도 인테리어 소품 같아요. 집에 놀러 오신 분들이 이게 뭐냐고 많이 물어보시더라고요ㅎㅎ 유일하게 아쉬운 점은 좋아서 헤프게 쓰게 된다는 것..! 대용량과 사우나 / 여행용 미니 사이즈 빨리 출시해주세요🙏",en:"Following my cleansing milk review, here's my review of the bubble cleanser too! I normally use another brand's foaming cleanser so I figured there'd be a comparison, and the first impression was already different. The foam is genuinely bouncy 🫧 true to the micro-bubble name, it didn't collapse even after a few seconds and kept its springiness on my hands and face. Thanks to that, there was definitely less friction and irritation while washing.\n\nWhat surprised me most was the skin-texture-refining effect - after using it, my face has this oddly-perfectly squeaky feel. Not the kind of squeaky that causes underlying tightness, but the kind that protects the skin barrier while only removing excess sebum. It's not just gentle for sensitive skin, it felt like it did actual good skincare, which genuinely impressed me ㅠㅠ\n\nSince it's fragrance-free, there's zero burden even if you're sensitive to scent, and the design is so pretty compared to other dermatology brands that it looks like an interior piece just sitting in the bathroom. People who visit my place ask what it is a lot lol The only downside is that I like it so much I end up using it generously..! Please release a large size and a mini sauna/travel size soon 🙏","zh-CN":"洁面乳之后再写一下气泡洁面的测评！我本来用的是其他品牌的起泡洁面，正好可以对比一下，一试就发现第一印象完全不同。泡沫真的很紧实🫧不愧是叫双重微气泡，过了几秒也不消，在手上和脸上都能保持弹性。多亏了这个，洁面时的摩擦和刺激明显更少。\n\n最让我惊讶的是皮肤纹理整理的效果，用完之后脸会有种奇妙的适度干净感。不是那种引起内干的干净感，而是保护皮肤屏障、只去除多余皮脂的那种感觉。对敏感肌来说不只是温和，还有种做了好的护肤的效果，真的让我很惊叹ㅠㅠ\n\n无香设计，对香味敏感的人也完全没有负担，设计也和其他药妆品牌不一样，特别好看，光放在浴室里就像个装饰品。来家里玩的朋友们经常问这是什么ㅎㅎ唯一遗憾的一点是因为太喜欢会用得比较费……！求求快点出大容量和适合桑拿/旅行用的迷你装🙏","zh-TW":"繼卸妝乳之後也來寫氣泡潔顏乳的心得！我原本用其他品牌的泡沫型洗面乳，覺得可以拿來比較就試用了，第一印象就不一樣。泡沫真的很紮實🫧不愧叫微氣泡，過了幾秒也不會消，在手上和臉上都能維持彈性。多虧如此，洗臉時的摩擦和刺激確實少很多。\n\n最驚訝的是膚質整理效果，用完之後臉會有種恰到好處的清爽感。不是那種會造成內在緊繃的乾爽感，而是守護皮膚屏障、只去除多餘皮脂的那種感覺。對敏感肌來說不只是溫和，還有種做了一次好保養的效果，真的讓我很讚嘆ㅠㅠ\n\n無香設計，就算對香味敏感也完全沒負擔，設計也和其他藥妝品牌不同，很好看，放在浴室裡就像個裝飾小物。來家裡玩的朋友常常問這是什麼ㅎㅎ唯一可惜的一點是因為太喜歡了會不小心用很多……!拜託快點推出大容量和三溫暖／旅行用迷你尺寸🙏",ja:"クレンジングミルクに続いてバブルクレンザーのレビューも残します!私はもともと他ブランドのフォーミングクレンザーを使っていて比較になりそうなので使ってみましたが、第一印象から違いました。泡が本当にとろみがあります🫧マイクロバブルという名前らしく数秒経ってもへたらず、手や顔の上で弾力を保っていました。おかげで洗顔中の摩擦や刺激が確実に少なかったです。\n\n一番驚いたのは肌のキメを整える効果でした。使うと妙に顔がほど良くキュッとする感じがあります。つっぱりを引き起こすキュッとした感じではなく、肌バリアは守りながら過剰な皮脂だけを除去してくれるそんな感じです。敏感肌にマイルドなだけでなく良いスキンケアをしたような効果が出て本当に感嘆しました、涙\n\n無香設計なので香りに敏感でも全く負担がなく、デザインも他のダーマブランドと違ってとてもきれいで浴室に置くだけでインテリア小物みたいです。家に遊びに来た方がこれ何?とよく聞いてきます(笑)唯一残念な点は気に入って気前よく使ってしまうこと…!大容量とサウナ/旅行用ミニサイズを早く発売してください🙏",th:"ต่อจากคลีนซิ่งมิลค์ ขอมารีวิวบับเบิลคลีนเซอร์ด้วยค่ะ! ปกติใช้โฟมล้างหน้าแบรนด์อื่นอยู่แล้วเลยลองเปรียบเทียบดู ความประทับใจแรกก็ต่างกันเลย ฟองหนึบมากจริงๆ🫧 สมชื่อไมโครบับเบิล ผ่านไปหลายวินาทีก็ยังไม่ยุบ คงความยืดหยุ่นอยู่ทั้งบนมือและใบหน้า ทำให้แรงเสียดสีระหว่างล้างหน้าน้อยลงชัดเจน\n\nสิ่งที่แปลกใจที่สุดคือประสิทธิภาพในการทำให้ผิวเรียบเนียน หลังใช้จะรู้สึกว่าหน้าสะอาดพอดีอย่างแปลกๆ ไม่ใช่ความสะอาดเอี๊ยดที่ทำให้ตึง แต่เป็นความรู้สึกที่ปกป้องเกราะผิวไปพร้อมกับกำจัดไขมันส่วนเกินเท่านั้น ไม่ใช่แค่อ่อนโยนสำหรับผิวแพ้ง่าย แต่รู้สึกเหมือนได้ทำสกินแคร์ดีๆ ด้วย ทึ่งมากจริงๆㅠㅠ\n\nออกแบบมาไม่มีกลิ่นเลยแม้แพ้กลิ่นง่ายก็ไม่มีภาระ ดีไซน์ก็สวยต่างจากแบรนด์ผลิตภัณฑ์ผิวหนังอื่นๆ แค่วางไว้ในห้องน้ำก็เหมือนของแต่งบ้านเลย เพื่อนที่มาเที่ยวบ้านถามบ่อยว่านี่คืออะไรฮ่าๆ จุดเดียวที่น่าเสียดายคือชอบเลยใช้เปลืองมาก..! อยากให้ออกไซส์ใหญ่และไซส์มินิสำหรับซาวน่า/เดินทางเร็วๆ นี้เลย🙏"},images:["thumbnail/reviews/A7wmjOPA_1.webp"],video:null},
    {id:"qPgb7DmZ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"건성+매일 메이크업, 1차 밀크+2차 버블 세안 후 개운함 (이미지 1장)",en:"Dry + daily makeup wearer, refreshed after first cleanse with milk + second cleanse with bubble (1 image)","zh-CN":"干皮+每天化妆，一次洁面乳+二次气泡洁面后清爽（附1张图片）","zh-TW":"乾性+每天化妝，一次卸妝乳+二次氣泡潔顏後的清爽感（附圖1張）",ja:"乾燥肌+毎日メイク、1回目ミルク+2回目バブルの洗顔後のすっきり感(画像1枚)",th:"ผิวแห้ง+แต่งหน้าทุกวัน ล้างหน้าครั้งแรกด้วยมิลค์+ครั้งที่สองด้วยบับเบิล สดชื่นหลังล้าง (มีรูป)"},date:"2026-07-04",
      quote:{ko:"피부에 자극이 덜하면서도 말끔한 세정력을 가진 클렌징 제품을 찾는 분들께 추천드려요‼️\n\n저는 거의 매일 메이크업을 하는 편이라 외출 후 세안하는 과정을 정말 중요하게 생각하는데요…🥹 특히 세안 후 개운한 느낌이 들어야 만족스럽더라구요. 그래서 예전에는 세정력에만 보고 클렌징 제품을 선택했었는데 사용하다 보니… 세안 후 피부 속 당김이 심하거나 피부가 예민해지는 날도 종종 있더라구요…😭 저처럼 건성 피부에는 “세정력뿐만 아니라 보습과 진정에 도움이 되는 성분이 들어있는 제품”을 사용하는 게 좋겠다는 생각이 들었습니다!\n\n그러던 중 노마디아의 <골든 호호바 10% 듀얼 마이크로 버블 클렌저>를 사용해보게 되었는데요! \n저는 <블루 진정 판테놀 1% 클렌징 밀크>로 1차 세안을 한 후에, 이 제품으로 2차 세안을 해주고 있어요. 버블 제형이라 간편하게 사용할 수 있고, 세안하는 동안 피부에 자극이 적게 느껴져 더욱 편안하게 사용할 수 있었어요.☺️\n\n가장 만족스러웠던 점은 세안 후의 마무리감이었어요! 기존에 사용하던 버블 클렌징 제품은 세안 후에도 개운한 느낌이 조금 아쉬웠는데, 노마디아의 제품은 말끔하고 개운하게 세안됐다는 느낌이 가장 크게 들더라구요! 그렇다고 피부가 당기거나 건조한 느낌은 없었고, 촉촉함이 남아 있어 건성인 저도 부담 없이 사용할 수 있었습니다. 또 호호바씨 오일이 들어있어 그런지 사용감이 한결 부드럽게 느껴졌어요.🌿\n\n만족스럽게 사용한 노마디아의 버블 클렌저의 장점을 정리해보면,\n✔️ 자극은 덜하면서도 말끔하고 개운한 세안이 가능해요.\n✔️ 세안 후에도 피부가 건조하지 않아 속 당김이 적어요.\n✔️ 버블 제형이라 간편하게 사용할 수 있고, 예민한 피부도 부담 없이 사용할 수 있어요.",en:"Recommend this to anyone looking for a cleansing product with less irritation but still thorough cleansing power‼️\n\nI wear makeup almost every day, so I really value the cleansing process after going out…🥹 Especially, I'm only satisfied if I feel refreshed after washing. So in the past I chose cleansing products based only on cleansing power, but as I used them… there were quite a few days where my skin felt severe underlying tightness or got sensitive after washing…😭 For dry skin like mine, I realized it's better to use a product with ingredients that help with moisture and soothing, not just cleansing power!\n\nThat's when I got to try NOMADIA's Golden Jojoba 10% Dual Micro Bubble Cleanser!\nI do a first cleanse with the Blue Calming 1% Panthenol Cleansing Milk, then a second cleanse with this product. It's a bubble formula so it's convenient to use, and I felt little irritation while washing, so it was even more comfortable to use.☺️\n\nWhat satisfied me most was the finish after washing! With bubble cleansing products I'd used before, the refreshed feeling after washing was a bit lacking, but with NOMADIA's product, I mostly felt that washing was thorough and refreshing! And yet there was no tightness or dryness, and moisture remained, so even I, being dry-skinned, could use it without worry. Also, maybe because it contains jojoba seed oil, the texture felt even softer.🌿\n\nTo sum up the strengths of NOMADIA's bubble cleanser that I used satisfyingly,\n✔️ Less irritating yet thorough and refreshing cleansing.\n✔️ Little underlying tightness since skin doesn't dry out after washing.\n✔️ Easy to use since it's a bubble formula, and gentle enough for sensitive skin too.","zh-CN":"想推荐给正在找刺激少又清洁干净的产品的人‼️\n\n我几乎每天都化妆，很重视外出回来之后的洁面过程…🥹特别是洗完脸要有清爽感才会满意。所以以前只看清洁力选清洁产品，结果用着用着…有时候洗后皮肤内干紧绷严重，或者皮肤变敏感…😭像我这种干皮，感觉应该用「不只清洁力好、还含有保湿舒缓成分」的产品比较好！\n\n后来用了NOMADIA的<金色荷荷巴10%双重微气泡洁面>！\n我先用<蓝色舒缓泛醇1%洁面乳>做一次清洁，再用这款做二次清洁。是气泡质地，用起来很方便，洁面过程中皮肤刺激感也少，用起来更舒适。☺️\n\n最满意的是洗后的收尾感！之前用的气泡洁面产品洗后清爽感总有点不够，但NOMADIA这款给我最大的感受就是干净清爽！但也不觉得紧绷或干燥，还留有水润感，我这种干皮用也没负担。含有荷荷巴籽油，使用感也更加柔和。🌿\n\n总结一下用得满意的NOMADIA气泡洁面的优点，\n✔️刺激少的同时能干净清爽地洁面。\n✔️洗后皮肤不干燥，内干紧绷少。\n✔️气泡质地使用方便，敏感肌也能没负担地使用。","zh-TW":"推薦給正在找刺激少又潔淨力乾淨的清潔產品的人‼️\n\n我幾乎每天都化妝，所以出門回來的洗臉步驟真的很重要……🥹特別是洗完臉一定要有清爽感才會滿意。以前我只看潔淨力挑清潔產品，用著用著……才發現洗完臉常常內在緊繃或皮膚變敏感……😭像我這種乾性肌，覺得「不只潔淨力，還要有助於保濕舒緩的成分」的產品比較好！\n\n後來用了NOMADIA的<金盞荷荷芭10%雙重微氣泡潔顏乳>！\n我用<藍色舒緩泛醇1%卸妝乳>做一次卸妝，再用這款做二次清潔。是氣泡型，使用方便，洗臉過程中皮膚刺激感較少，用起來更舒服。☺️\n\n最滿意的是洗完臉後的收尾感！以前用的氣泡型潔顏產品洗完臉清爽感有點不夠，但NOMADIA的產品讓我感覺洗得最乾淨清爽！但皮膚也不會緊繃或乾燥，還留有水潤感，我這種乾性肌用起來也毫無負擔。而且可能因為含有荷荷芭籽油，使用感更加柔順。🌿\n\n整理一下滿意的NOMADIA氣泡潔顏乳優點，\n✔️ 刺激少卻能乾淨清爽地洗臉。\n✔️ 洗完臉皮膚不乾燥，緊繃感少。\n✔️ 氣泡型使用簡便，敏感肌也能無負擔使用。",ja:"肌への刺激が少ないながらもすっきりした洗浄力を持つクレンジング製品を探している方におすすめします‼️\n\n私はほぼ毎日メイクをする方なので、外出後の洗顔プロセスを本当に重視しているのですが…🥹特に洗顔後にすっきりした感じがないと満足できません。それで以前は洗浄力だけを見てクレンジング製品を選んでいましたが、使っているうちに…洗顔後に肌のつっぱりがひどかったり、肌が敏感になったりする日もたまにありました…😭私のような乾燥肌には「洗浄力だけでなく保湿と鎮静に役立つ成分が入っている製品」を使う方が良いと思いました!\n\nそんな中NOMADIAの<ゴールデンホホバ10%デュアルマイクロバブルクレンザー>を使ってみることになりました!\n私は<ブルー鎮静パンテノール1%クレンジングミルク>で1回目の洗顔をした後、この製品で2回目の洗顔をしています。バブルタイプなので簡単に使え、洗顔中に肌への刺激が少なく感じられ、より快適に使うことができました。☺️\n\n一番満足だった点は洗顔後の仕上がりでした!今まで使っていたバブルクレンジング製品は洗顔後もすっきり感が少し物足りなかったのですが、NOMADIAの製品はすっきりさっぱり洗顔できたという感じが一番大きくしました!だからといって肌がつっぱったり乾燥したりする感じはなく、しっとり感が残っていて乾燥肌の私も気兼ねなく使うことができました。またホホバ種子油が入っているからか使用感がより一層柔らかく感じられました。🌿\n\n満足して使ったNOMADIAのバブルクレンザーの長所をまとめると、\n✔️刺激は少ないながらもすっきりさっぱり洗顔ができます。\n✔️洗顔後も肌が乾燥せずつっぱりが少ないです。\n✔️バブルタイプなので簡単に使え、敏感な肌も気兼ねなく使えます。",th:"อยากแนะนำผลิตภัณฑ์คลีนซิ่งที่ระคายเคืองน้อยแต่แรงทำความสะอาดดีให้ทุกคนค่ะ‼️\n\nฉันแต่งหน้าแทบทุกวัน เลยให้ความสำคัญกับขั้นตอนล้างหน้าหลังออกไปข้างนอกมาก…🥹 โดยเฉพาะต้องรู้สึกสดชื่นหลังล้างหน้าถึงจะพอใจ เมื่อก่อนเลยเลือกผลิตภัณฑ์คลีนซิ่งโดยดูแค่แรงทำความสะอาดเป็นหลัก แต่พอใช้ไปเรื่อยๆ… บางวันหลังล้างหน้าตึงมากหรือผิวไวต่อสิ่งเร้าขึ้น…😭 เลยคิดว่าผิวแห้งแบบฉันควรใช้ผลิตภัณฑ์ที่ \"มีทั้งแรงทำความสะอาดและส่วนผสมที่ช่วยเรื่องความชุ่มชื้นและปลอบประโลม\"!\n\nแล้วก็ได้ลองใช้ <โกลเด้นโฮโฮบา 10% ดูอัลไมโครบับเบิลคลีนเซอร์> ของโนมาเดีย! \nฉันล้างหน้าครั้งแรกด้วย <บลูซูทติ้งแพนธีนอล 1% คลีนซิ่งมิลค์> แล้วล้างหน้าครั้งที่สองด้วยผลิตภัณฑ์นี้ เป็นรูปแบบบับเบิลใช้งานง่าย ระหว่างล้างหน้าแทบไม่รู้สึกระคายเคือง ใช้ได้อย่างสบายมากขึ้น☺️\n\nสิ่งที่พอใจที่สุดคือความรู้สึกหลังล้างหน้า! บับเบิลคลีนซิ่งตัวอื่นที่เคยใช้หลังล้างหน้าไม่ค่อยรู้สึกสดชื่นเท่าไหร่ แต่ผลิตภัณฑ์ของโนมาเดียให้ความรู้สึกสะอาดหมดจดและสดชื่นมากที่สุด! แต่ก็ไม่ได้รู้สึกตึงหรือแห้งเลย ยังคงความชุ่มชื้นไว้ แม้เป็นผิวแห้งแบบฉันก็ใช้ได้อย่างไม่มีภาระ แถมมีน้ำมันเมล็ดโฮโฮบา เลยรู้สึกว่าความรู้สึกเมื่อใช้นุ่มนวลขึ้นอีก🌿\n\nสรุปข้อดีของบับเบิลคลีนเซอร์ของโนมาเดียที่ใช้แล้วพอใจ\n✔️ ระคายเคืองน้อยแต่ล้างหน้าได้สะอาดหมดจดและสดชื่น\n✔️ หลังล้างหน้าไม่แห้ง ตึงน้อย\n✔️ เป็นรูปแบบบับเบิลใช้งานง่าย แม้ผิวไวต่อสิ่งเร้าก็ใช้ได้ไม่มีภาระ"},images:["thumbnail/reviews/qPgb7DmZ.webp"],video:null},
    {id:"qW45ojpA",rating:5,skinType:{ko:"수부지",en:"Combination (oily-dehydrated)","zh-CN":"水油皮","zh-TW":"外油內乾",ja:"インナードライ肌",th:"ผิวมันขาดน้ำ"},sensitivity:{ko:"-",en:"-","zh-CN":"-","zh-TW":"-",ja:"-",th:"-"},highlight:{ko:"수부지+매일 메이크업, 눈 안따가운데 메이크업은 잘 지워짐 (이미지 1장)",en:"Combination (oily-dehydrated) + daily makeup wearer, doesn't sting the eyes yet removes makeup well (1 image)","zh-CN":"水油皮+每天化妆，不刺激眼睛但妆容卸得干净（附1张图片）","zh-TW":"外油內乾+每天化妝，眼睛不刺痛但妝卸得很乾淨（附圖1張）",ja:"インナードライ肌+毎日メイク、目にしみないのにメイクはよく落ちる(画像1枚)",th:"ผิวมันขาดน้ำ+แต่งหน้าทุกวัน ไม่แสบตาแต่ล้างเมคอัพออกได้ดี (มีรูป)"},date:"2026-07-06",
      quote:{ko:"저는 거의 매일 메이크업을 하기에 매일매일 클렌징 제품을 사용하는데요..! 그러다 보니 여러 종류의 클렌징 제품을 써봤지만 정착하지 못해 매번 다른 제품을 구입해서 사용하다가 우연히 노마디아 제품들을 접해서 사용해봤습니다😆\n\n“블루 진정 판테놀 1% 클렌징 밀크“ 와 함께 ”호호바 10% 듀얼 마이크로 버블 클렌저“를 사용했는데요, 다른 제품들은 세정력이 강하다 보니 세안을 하고 나오면 속당김이 심했는데 요 제품은 속당김이 적어 피부가 덜 예민해져서 상쾌하더라구요 😆\n눈에 들어가도 아프지 않을 만큼 순한데 메이크업은 너무 잘 지워져서 손이 많이 가는 제품이에요🤭\n\n✨골든 호호바 10% 듀얼 마이크로 버블 클렌저✨\n거품 타입이라 사용하기 정말 편하고 순한 제형이라 아침에 사용하기도 좋고!! 자극이 적어요\n\n크게 3가지 장점이 있는데요!!\n✔️순한 제형의 클렌징 제품이지만 메이크업 잔여물 없이 말끔하게 지워져요.\n✔️세안 후 속당김이 적어요.\n✔️아침에 사용하기에도 순해서 부담이 없어요.\n\n✨정말 순하고 자극이 최소화 되고 진정 효과까지 보고 싶으신 분들께 추천 드립니다✨",en:"I wear makeup almost every day, so I use a cleansing product every single day..! Because of that I've tried many kinds of cleansing products but never settled on one, buying a different product each time - then I happened to come across NOMADIA's products and tried them 😆\n\nI used the Blue Calming 1% Panthenol Cleansing Milk together with the Jojoba 10% Dual Micro Bubble Cleanser, and while other products had such strong cleansing power that my skin had severe underlying tightness after washing, this product has little underlying tightness so my skin gets less sensitive and feels refreshing 😆\nIt's gentle enough that it wouldn't hurt even if it got in my eyes, yet it removes makeup so well that I keep reaching for it 🤭\n\n✨Golden Jojoba 10% Dual Micro Bubble Cleanser✨\nIt's a foam type so it's really convenient to use, and being a gentle formula it's good for morning use too!! Low irritation\n\nThere are 3 main advantages!!\n✔️Even though it's a gentle cleansing product, it removes makeup residue cleanly with nothing left behind.\n✔️Little underlying tightness after washing.\n✔️Gentle enough for morning use too, no burden at all.\n\n✨Recommended for anyone who wants something truly gentle, minimal irritation, and even a soothing effect✨","zh-CN":"我几乎每天都化妆，所以每天都要用清洁产品……！用过很多种清洁产品但一直没定妆，每次都买不同产品用，偶然接触到NOMADIA的产品试用了一下😆\n\n我搭配「蓝色舒缓泛醇1%洁面乳」和「荷荷巴10%双重微气泡洁面」一起用，其他产品清洁力太强，洗完脸内干紧绷严重，这款紧绷感少，皮肤没那么敏感，感觉很清爽😆\n就算进眼睛也不痛这么温和，但妆容却能卸得很干净，会经常用🤭\n\n✨金色荷荷巴10%双重微气泡洁面✨\n是泡沫类型，使用真的很方便，质地温和，早上用也不错!!刺激也少\n\n有三大优点!!\n✔️虽是温和质地的清洁产品，但妆容残留能干净卸除。\n✔️洗后紧绷感少。\n✔️早上用也很温和，没有负担。\n\n✨想要温和、刺激最小化又想要舒缓效果的朋友，推荐这款✨","zh-TW":"我幾乎每天都化妝，所以每天都要用卸妝產品……！用過各種卸妝產品但都沒有定下來，每次都買不同產品，偶然接觸到NOMADIA的產品試用看看😆\n\n我搭配使用了「藍色舒緩泛醇1%卸妝乳」和「荷荷芭10%雙重微氣泡潔顏乳」，其他產品因為潔淨力強，洗完臉常常內在緊繃很嚴重，但這款內在緊繃感較少，皮膚比較不敏感，很舒爽😆\n溫和到連跑進眼睛都不會痛，但妝卻卸得很乾淨，是讓我很常用的產品🤭\n\n✨金盞荷荷芭10%雙重微氣泡潔顏乳✨\n是泡沫型，使用起來真的很方便，質地溫和，當早晨用也不錯！！刺激也少\n\n有三大優點!!\n✔️質地溫和的清潔產品，卻能把彩妝殘留卸得乾乾淨淨。\n✔️洗完臉內在緊繃感少。\n✔️早上用也很溫和，沒有負擔。\n\n✨真心推薦給想要溫和、刺激降到最低，還想兼顧舒緩效果的人✨",ja:"私はほぼ毎日メイクをするので毎日クレンジング製品を使っています…!それでいろいろな種類のクレンジング製品を試してきましたが定着できず、毎回違う製品を購入して使っていたところ、偶然NOMADIAの製品に出会って使ってみました😆\n\n「ブルー鎮静パンテノール1%クレンジングミルク」と一緒に「ホホバ10%デュアルマイクロバブルクレンザー」を使いましたが、他の製品は洗浄力が強いので洗顔した後つっぱりがひどかったのですが、この製品はつっぱりが少なく肌が敏感になりにくくて爽やかでした😆\n目に入っても痛くないくらいマイルドなのにメイクはとてもよく落ちるので、よく手が伸びる製品です🤭\n\n✨ゴールデンホホバ10%デュアルマイクロバブルクレンザー✨\n泡タイプなので使うのが本当に楽で、マイルドなテクスチャーなので朝使うのにも良く!!刺激が少ないです\n\n大きく3つの長所があります!!\n✔️マイルドなテクスチャーのクレンジング製品ですが、メイクの残留物なくすっきり落ちます。\n✔️洗顔後のつっぱりが少ないです。\n✔️朝使ってもマイルドで負担がありません。\n\n✨本当にマイルドで刺激が最小限に抑えられ、鎮静効果まで感じたい方におすすめします✨",th:"ฉันแต่งหน้าแทบทุกวัน เลยต้องใช้ผลิตภัณฑ์คลีนซิ่งทุกวันด้วย..! เลยลองใช้ผลิตภัณฑ์คลีนซิ่งหลายแบบแต่ก็หาตัวที่ลงตัวไม่ได้สักที ต้องซื้อผลิตภัณฑ์ใหม่มาลองเรื่อยๆ จนบังเอิญได้มาลองใช้ผลิตภัณฑ์ของโนมาเดียค่ะ😆\n\nใช้ “บลูซูทติ้งแพนธีนอล 1% คลีนซิ่งมิลค์” คู่กับ “โฮโฮบา 10% ดูอัลไมโครบับเบิลคลีนเซอร์” ผลิตภัณฑ์อื่นที่แรงทำความสะอาดสูง หลังล้างหน้ามักจะตึงมาก แต่ตัวนี้ตึงน้อย ผิวไม่ค่อยไวต่อสิ่งเร้า สดชื่นดีค่ะ 😆\nอ่อนโยนขนาดที่ว่าเข้าตาก็ไม่เจ็บ แต่ล้างเมคอัพออกได้ดีมาก เลยหยิบใช้บ่อยเลยค่ะ🤭\n\n✨โกลเด้นโฮโฮบา 10% ดูอัลไมโครบับเบิลคลีนเซอร์✨\nเป็นรูปแบบฟองใช้งานสะดวกมาก เนื้อสัมผัสอ่อนโยนเหมาะกับใช้ตอนเช้าด้วย!! ระคายเคืองน้อย\n\nมีข้อดีหลัก 3 อย่างค่ะ!!\n✔️เป็นผลิตภัณฑ์คลีนซิ่งเนื้อสัมผัสอ่อนโยนแต่ล้างเมคอัพออกได้หมดจดไม่มีคราบตกค้าง\n✔️หลังล้างหน้าตึงน้อย\n✔️ใช้ตอนเช้าก็อ่อนโยนไม่มีภาระ\n\n✨แนะนำสำหรับคนที่อยากได้ทั้งความอ่อนโยน ลดการระคายเคืองให้น้อยที่สุด และผลลัพธ์การปลอบประโลมด้วย✨"},images:["thumbnail/reviews/qW45ojpA.webp"],video:null},
    {id:"Aa25n3QJ",rating:5,skinType:{ko:"건성",en:"Dry","zh-CN":"干皮","zh-TW":"乾性肌膚",ja:"乾燥肌",th:"ผิวแห้ง"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"건성/민감, 세정력·보습 두 마리 토끼 잡은 사연 (이미지 1장)",en:"Dry/sensitive, the story of finally getting both cleansing power and moisture (1 image)","zh-CN":"干皮/敏感，同时抓住清洁力与保湿的经历（附1张图片）","zh-TW":"乾性/敏感，同時抓住潔淨力與保濕的心得（附圖1張）",ja:"乾燥肌/敏感肌、洗浄力と保湿の両方を手に入れたエピソード(画像1枚)",th:"ผิวแห้ง/แพ้ง่าย เรื่องราวที่ได้ทั้งแรงทำความสะอาดและความชุ่มชื้น (มีรูป)"},date:"2026-07-06",
      quote:{ko:"건성피부다 보니 세안 후 얼굴이 당기는 게 항상 신경 쓰였어요. 세정력 좋은 제품을 쓰면 꼭 그다음에 얼굴이 뻣뻣해지고, 순한 제품을 쓰면 화장이 덜 지워진 느낌이라 늘 갈등했는데, 두 가지를 한 번에 잡아준 제품이 골든 호호바 10% 듀얼 마이크로 버블클렌저였어요!🥰\n\n일반 클렌징 폼처럼 손으로 비벼서 거품을 만드는 과정이 없어요. 펌핑하자마자 이미 폭신한 거품 상태로 나와서 세안 시간이 훨씬 짧아지더라고요. 얼굴에 올려서 굴릴 때도 힘을 줄 필요 없이 사르르 퍼지고, 질감이 생크림처럼 폭신해서 문지르는 동안 자극이 전혀 느껴지지 않았어요. 헹굴 때도 뻑뻑하게 남지 않고 매끄럽게 씻겨나가서, 수건으로 닦기 전부터 얼굴이 유난히 부드럽다는 게 느껴졌습니다🥰\n\n건성피부는 세안하고 스킨케어를 바로 안 챙기면 금방 피부가 뻣뻣해지는데, 이 제품은 시간이 좀 지나도 그런 느낌이 안 왔어요. 호호바 오일 성분이 들어있어서인지 세안 직후에도 피부가 차분하게 가라앉아있는 느낌이었고, 붉어지거나 화끈거리는 자극도 없었습니다.\n\n이전에 쓰던 클렌징 폼은 자극도 있고 세정력도 애매했는데, 이 제품으로 바꾸면서 자극과 당김 둘 다 해결됐어요. 밀크와 버블을 같이 쓰면서 재구매를 고민할 필요가 없어졌습니다. 순하면서도 세정력까지 챙기고 싶은 건성·예민 피부라면 이 조합 추천드려요!👍🥰",en:"Being dry-skinned, the tightness on my face after washing always bothered me. Products with good cleansing power would leave my face stiff afterward, and gentle products would leave makeup not fully removed, so I always had this dilemma - until the Golden Jojoba 10% Dual Micro Bubble Cleanser solved both at once!🥰\n\nThere's no process of rubbing it in your hands to build lather like a regular foam cleanser. It comes out already in a fluffy foam state the moment you pump it, so my washing time got much shorter. When rolling it on my face, it spreads effortlessly with no need to apply pressure, and the texture is as fluffy as whipped cream, so I felt zero irritation while rubbing it in. It rinsed off smoothly too, without leaving a stiff residue, and I could tell my face was unusually soft even before drying it with a towel 🥰\n\nWith dry skin, if I don't do skincare right after washing my face gets stiff quickly, but with this product that feeling didn't come even after some time passed. Maybe because of the jojoba oil ingredient, my skin felt calm right after washing, and there was no redness or stinging irritation.\n\nThe foam cleanser I used before had some irritation and so-so cleansing power, but switching to this product solved both irritation and tightness. Using the milk and bubble together, I no longer have to worry about whether to repurchase. If you have dry, sensitive skin and want both gentleness and cleansing power, I recommend this combo!👍🥰","zh-CN":"我是干皮，洗后脸紧绷一直让我很在意。用清洁力好的产品脸就会僵硬，用温和产品又感觉妆卸得不干净，一直很纠结，而金色荷荷巴10%双重微气泡洁面同时解决了这两个问题！🥰\n\n不需要像一般洁面泡沫那样用手搓出泡沫。一按压就已经是蓬松的泡沫状态，洁面时间缩短了很多。放在脸上打圈也不用用力就能顺滑抹开，质地像鲜奶油一样蓬松，打圈过程中完全感觉不到刺激。冲洗时也不会僵硬地残留，滑顺地洗掉，擦干之前就已经感觉脸格外柔软🥰\n\n干皮如果洗后不马上做后续护肤，皮肤很快就会僵硬，但这款过了一段时间也没有这种感觉。可能是含荷荷巴油成分，洗后皮肤感觉很平静，也没有泛红或灼热的刺激。\n\n之前用的洁面泡沫有刺激也有清洁力不够的问题，换成这款之后刺激和紧绷都解决了。洁面乳和气泡洁面一起用之后，就不用再纠结回购哪款了。想同时兼顾温和与清洁力的干性、敏感肌，推荐这个组合！👍🥰","zh-TW":"因為是乾性肌，洗完臉緊繃這件事一直讓我很在意。用潔淨力好的產品，接下來臉一定會變僵硬；用溫和產品，又覺得妝卸得不夠乾淨，一直很兩難，而金盞荷荷芭10%雙重微氣泡潔顏乳同時解決了這兩個問題！🥰\n\n不需要像一般洗面乳那樣用手搓出泡沫。一按壓就已經是蓬鬆的泡沫狀態，洗臉時間縮短很多。放在臉上打圈也不用出力就能滑順地推開，質地像鮮奶油一樣蓬鬆，搓揉時完全感覺不到刺激。沖洗時也不會乾澀殘留，滑順地就洗掉了，還沒用毛巾擦乾就能感覺到臉特別柔軟🥰\n\n乾性肌洗完臉如果不馬上做保養，皮膚很快就會變僵硬，但這款過了一段時間也沒有這種感覺。可能因為含有荷荷芭油成分，洗完臉後皮膚感覺很平靜，也沒有泛紅或灼熱的刺激感。\n\n以前用的洗面乳有刺激感、潔淨力也不上不下，換成這款之後刺激和緊繃感都解決了。搭配卸妝乳和氣泡潔顏乳一起用，完全不用再猶豫要不要回購。想同時兼顧溫和與潔淨力的乾性‧敏感肌，推薦這個組合！👍🥰",ja:"乾燥肌なので洗顔後に顔がつっぱるのがいつも気になっていました。洗浄力の良い製品を使うと必ずその後顔がこわばり、マイルドな製品を使うとメイクが落ちきっていない感じがして、いつも葛藤していましたが、この2つを一度に解決してくれた製品がゴールデンホホバ10%デュアルマイクロバブルクレンザーでした!🥰\n\n普通の洗顔フォームのように手でこすって泡を作る過程がありません。ポンプするとすでにふわふわの泡状態で出てくるので洗顔時間がずっと短くなりました。顔にのせて転がすときも力を入れる必要なくすっとのび、質感が生クリームのようにふわふわしていてこすっている間刺激が全く感じられませんでした。すすぐときもゴワゴワ残らず滑らかに洗い流れて、タオルで拭く前から顔がひときわ柔らかいのが感じられました🥰\n\n乾燥肌は洗顔後すぐスキンケアをしないとすぐ肌がこわばりますが、この製品は少し時間が経ってもそういう感じがしませんでした。ホホバオイル成分が入っているからか、洗顔直後も肌が落ち着いている感じがして、赤くなったりヒリヒリしたりする刺激もありませんでした。\n\n以前使っていた洗顔フォームは刺激もあり洗浄力も微妙でしたが、この製品に変えてから刺激とつっぱり両方が解決しました。ミルクとバブルを一緒に使ってリピート購入を悩む必要がなくなりました。マイルドでありながら洗浄力まで求める乾燥肌・敏感肌ならこの組み合わせをおすすめします!👍🥰",th:"เป็นผิวแห้งเลยกังวลเรื่องหน้าตึงหลังล้างหน้าตลอด ถ้าใช้ผลิตภัณฑ์แรงทำความสะอาดดีก็ต้องมาแลกกับหน้าแข็งกระด้าง แต่ถ้าใช้ผลิตภัณฑ์อ่อนโยนก็รู้สึกว่าล้างเมคอัพไม่หมด ขัดแย้งกันตลอด แต่โกลเด้นโฮโฮบา 10% ดูอัลไมโครบับเบิลคลีนเซอร์ตอบโจทย์ทั้งสองอย่างพร้อมกันเลย!🥰\n\nไม่ต้องขยี้มือให้เกิดฟองแบบโฟมทั่วไป กดปั๊มแล้วออกมาเป็นฟองฟูทันที เวลาล้างหน้าเลยสั้นลงมาก พอวางบนหน้าแล้วนวดคลึงก็ไม่ต้องออกแรง ลื่นไหลไปเอง เนื้อสัมผัสฟูนุ่มเหมือนวิปครีม ตอนนวดคลึงแทบไม่รู้สึกระคายเคืองเลย ตอนล้างออกก็ไม่ฝืดแต่ลื่นเรียบ ก่อนซับด้วยผ้าขนหนูก็รู้สึกได้ว่าหน้านุ่มเป็นพิเศษแล้ว🥰\n\nผิวแห้งถ้าไม่รีบทาสกินแคร์ทันทีหลังล้างหน้าจะแข็งกระด้างเร็ว แต่ผลิตภัณฑ์นี้แม้ผ่านไปสักพักก็ไม่รู้สึกแบบนั้น อาจเพราะมีน้ำมันโฮโฮบา หลังล้างหน้าทันทีผิวก็ยังรู้สึกสงบนิ่งดี ไม่มีอาการแดงหรือแสบร้อนเลย\n\nโฟมล้างหน้าตัวเดิมที่ใช้ทั้งระคายเคืองและแรงทำความสะอาดก็ไม่ค่อยดี แต่พอเปลี่ยนมาใช้ตัวนี้ ทั้งการระคายเคืองและความตึงหายไปทั้งคู่ ใช้มิลค์คู่กับบับเบิลแล้วไม่ต้องกังวลเรื่องซื้อซ้ำอีกต่อไป ถ้าเป็นผิวแห้ง·แพ้ง่ายที่อยากได้ทั้งความอ่อนโยนและแรงทำความสะอาด แนะนำคอมโบนี้เลย!👍🥰"},images:["thumbnail/reviews/Aa25n3QJ.webp"],video:null},
    {id:"ALNlXzrZ",rating:5,skinType:{ko:"복합성",en:"Combination","zh-CN":"混合皮","zh-TW":"混合性肌膚",ja:"混合肌",th:"ผิวผสม"},sensitivity:{ko:"민감 피부",en:"Sensitive skin","zh-CN":"敏感肌","zh-TW":"敏感肌膚",ja:"敏感肌",th:"ผิวแพ้ง่าย"},highlight:{ko:"복합성/민감, 예민한 날에도 자극 없이 손이 가는 데일리 (영상+이미지 3장)",en:"Combination/sensitive, a daily go-to with no irritation even on sensitive days (video + 3 images)","zh-CN":"混合肌/敏感，敏感的日子也能无刺激地常用（视频+3张图片）","zh-TW":"混合性/敏感，敏感的日子也無刺激會想用的日常款（含影片+附圖3張）",ja:"混合肌/敏感肌、敏感な日でも刺激なく手が伸びるデイリー(動画+画像3枚)",th:"ผิวผสม/แพ้ง่าย หยิบใช้ได้ทุกวันโดยไม่ระคายเคืองแม้วันที่ผิวไวต่อสิ่งเร้า (มีวิดีโอ+รูป 3 ภาพ)"},date:"2026-07-16",
      quote:{ko:"클렌징 제품은 별로 신경 안 쓰는 편인데, 요즘은 “자극 없는 게 최고다”라는 생각이 들더라구요...!\n그런 기준에서 봤을 때, 골든 호호바 10% 듀얼 마이크로 버블 클렌저는 꽤 만족스러운 제품이었어요!\n\n처음 썼을 때 느낀 건 “되게 편안하다”는 느낌이었어요.\n향이 거의 없는 편이라서 사용하면서 신경 쓰이는 부분이 없고, 오히려 피부에 집중하게 되는 느낌? 🙌 인위적인 향이 없으니까 더 순하게 느껴지더라고요!!\n\n버블 타입이라 거품이 굉장히 부드럽게 올라오는데, 이게 생각보다 중요한 포인트였어요.\n거품이 조밀하고 부드러워서 피부에 닿는 느낌 자체가 되게 순해요 ☁️ 세안할 때 문지른다는 느낌보다, 그냥 얹어서 굴려준다는 느낌이라 부담이 없었어요!\n\n그리고 사용하면서 계속 느꼈던 건 “이거 진짜 자극 없다”는 점.\n세안 후에 당김이 심하거나, 미세하게 따끔거리는 제품들도 많은데 이건 그런 게 거의 없었어요. 오히려 세안하고 나서 피부 컨디션이 차분하게 정돈되는 느낌이라서 민감한 날에도 손이 가더라고요 👍\n\n디자인도 은근 만족스러웠어요.\n패키지가 깔끔하면서도 컬러감이 예뻐서, 세면대에 두면 전체적으로 분위기가 정돈되는 느낌이에요 🧴✨ 이런 소소한 부분이지만 매일 쓰는 제품이라 더 중요하게 느껴졌어요.\n\n전체적으로 보면\n자극 없이 부드럽게 세안하고 싶은 날,\n피부 컨디션이 예민하게 올라온 날,\n괜히 아무거나 쓰기 싫을 때\n\n이럴 때 자연스럽게 손이 가는 클렌저였어요 🙂",en:"I don't usually care much about cleansing products, but lately I've been feeling like no irritation is the best thing...!\nFrom that standpoint, the Golden Jojoba 10% Dual Micro Bubble Cleanser was quite a satisfying product!\n\nThe first thing I noticed using it was how really comfortable it felt.\nThere's barely any scent, so nothing bothers me while using it - if anything, I end up focusing more on my skin? 🙌 With no artificial scent, it felt even gentler!!\n\nBeing a bubble type, the foam rises very softly, which turned out to be a more important point than I expected.\nThe foam is dense and soft, so the feeling of it touching my skin is really gentle ☁️ While washing, it doesn't feel like scrubbing, more like laying it on and rolling it around, so there was no burden at all!\n\nAnd what I kept noticing throughout was this really has no irritation.\nA lot of products leave severe tightness after washing or a slight stinging, but this had almost none of that. If anything, my skin condition felt calmly settled after washing, so I reach for it even on sensitive days 👍\n\nThe design was quietly satisfying too.\nThe packaging is clean yet has a pretty color, so having it on the sink makes the whole space feel tidy 🧴✨ It's a small thing, but since it's something I use every day, it mattered more than I expected.\n\nOverall,\non days I want to wash gently without irritation,\non days my skin condition is sensitive,\nwhen I just don't want to use just anything\n\nthis was the cleanser I naturally reached for 🙂","zh-CN":"我平时不太在意洁面产品，但最近觉得「无刺激才是最好的」...！\n以这个标准来看，金色荷荷巴10%双重微气泡洁面是一款相当令人满意的产品！\n\n第一次用的感受是「真的很舒适」。\n几乎没有香味，用起来没什么需要在意的地方，反而更专注在皮肤上的感觉？🙌 没有人工香味，感觉更加温和!!\n\n是气泡类型，泡沫升起来非常柔软，这一点比想象中更重要。\n泡沫细密柔软，接触皮肤的感觉真的很温和 ☁️ 洗脸时不是搓的感觉，而是放上去打圈的感觉，没有负担！\n\n用的过程中一直感觉到的是「这个真的没有刺激」。\n很多产品洗后紧绷严重，或有轻微刺痛感，但这款几乎没有。反而洗完脸之后皮肤状态感觉被舒缓整理，敏感的日子也会想用👍\n\n设计也让人相当满意。\n包装简洁又配色好看，放在洗手台上整体氛围都变整洁了🧴✨ 虽是小细节，但因为是每天用的产品，感觉更重要。\n\n总的来说\n想无刺激柔和地洁面的日子，\n皮肤状态敏感的日子，\n不想随便用其他产品的时候\n\n这款是会自然而然伸手去拿的洁面产品 🙂","zh-TW":"我平常對清潔產品不太講究，但最近覺得「無刺激才是王道」……!\n以這個標準來看，金盞荷荷芭10%雙重微氣泡潔顏乳算是相當令人滿意的產品！\n\n第一次用的時候感受到的是「真的很舒服」。\n香味幾乎聞不到，使用時完全不會分心，反而更能專注在皮膚上的感覺？🙌 沒有人工香味，感覺更溫和!!\n\n因為是氣泡型，泡沫出來得非常柔軟，這一點比想像中重要。\n泡沫細緻柔軟，碰到皮膚的感覺本身就很溫和 ☁️ 洗臉時不是「搓揉」的感覺，而是「放上去滾動」的感覺，完全沒有負擔！\n\n而且用的過程中一直感覺到「這個真的不刺激」。\n很多產品洗完臉緊繃得厲害，或有輕微刺痛感，這款幾乎沒有這些問題。反而洗完臉後皮膚有種被平靜整理過的感覺，敏感的日子也會想用 👍\n\n設計也讓我頗滿意。\n包裝簡約又有好看的色調，放在洗手台上整體氛圍都變得整齊 🧴✨ 雖然是小細節，但因為是每天要用的產品，感覺更重要。\n\n整體來說，\n想無刺激溫和洗臉的日子，\n皮膚狀況敏感的日子，\n不想隨便用什麼產品的時候，\n\n這是會自然而然想拿起來用的潔顏產品 🙂",ja:"クレンジング製品はあまり気にしない方ですが、最近は「刺激がないのが一番」だと思うようになりました…!\nその基準で見たとき、ゴールデンホホバ10%デュアルマイクロバブルクレンザーはかなり満足のいく製品でした!\n\n最初に使ったとき感じたのは「すごく快適」という感じでした。\n香りがほとんどない方なので使っていて気になる部分がなく、むしろ肌に集中できる感じ?🙌人工的な香りがないのでよりマイルドに感じました!!\n\nバブルタイプなので泡がとても柔らかく立ち上がるのですが、これが思ったより重要なポイントでした。\n泡がきめ細かく柔らかいので肌に触れる感じ自体がとてもマイルドです☁️洗顔するときこするという感じより、ただのせて転がしてあげるという感じで負担がありませんでした!\n\nそして使っている間ずっと感じたのは「これ本当に刺激がない」という点。\n洗顔後につっぱりがひどかったり、微妙にピリピリしたりする製品も多いですが、これはそういうのがほとんどありませんでした。むしろ洗顔した後、肌コンディションが落ち着いて整う感じがして、敏感な日でも手が伸びました👍\n\nデザインもなかなか満足でした。\nパッケージがすっきりしながらもカラー感がきれいで、洗面台に置くと全体的に雰囲気が整う感じです🧴✨こういう些細な部分ですが毎日使う製品なのでより大事に感じました。\n\n全体的に見ると\n刺激なく優しく洗顔したい日、\n肌コンディションが敏感になった日、\nなんとなく適当なものを使いたくないとき\n\nこんなときに自然と手が伸びるクレンザーでした🙂",th:"ปกติไม่ค่อยใส่ใจเรื่องผลิตภัณฑ์คลีนซิ่งมากนัก แต่ช่วงนี้เริ่มคิดว่า \"ไม่ระคายเคืองคือดีที่สุด\" จริงๆ...!\nด้วยเกณฑ์นั้น โกลเด้นโฮโฮบา 10% ดูอัลไมโครบับเบิลคลีนเซอร์เป็นผลิตภัณฑ์ที่พอใจมากทีเดียว!\n\nสิ่งที่รู้สึกตอนใช้ครั้งแรกคือ \"สบายมากจริงๆ\"\nกลิ่นแทบไม่มีเลย เลยไม่มีอะไรกวนใจตอนใช้ กลับรู้สึกโฟกัสที่ผิวมากขึ้น? 🙌 ไม่มีกลิ่นสังเคราะห์เลยรู้สึกว่าอ่อนโยนมากขึ้นด้วย!!\n\nเป็นรูปแบบบับเบิล ฟองฟูขึ้นมานุ่มนวลมาก ซึ่งเป็นจุดสำคัญกว่าที่คิดไว้\nฟองละเอียดและนุ่มนวล สัมผัสบนผิวเลยอ่อนโยนมาก ☁️ ตอนล้างหน้าไม่รู้สึกเหมือนถูแรงๆ แต่เหมือนวางแล้วนวดคลึงเบาๆ ไม่มีภาระเลย!\n\nแล้วสิ่งที่รู้สึกตลอดการใช้คือ \"ไม่ระคายเคืองจริงๆ\"\nผลิตภัณฑ์หลายตัวหลังล้างหน้าจะตึงมากหรือแสบซ่านิดๆ แต่ตัวนี้แทบไม่มีอาการแบบนั้นเลย กลับรู้สึกว่าหลังล้างหน้าสภาพผิวสงบเรียบร้อยขึ้น เลยหยิบใช้แม้วันที่ผิวไวต่อสิ่งเร้า 👍\n\nดีไซน์ก็พอใจอยู่ไม่น้อยเหมือนกัน\nแพ็กเกจเรียบร้อยและสีสันสวยงาม วางไว้บนอ่างล้างหน้าแล้วดูเรียบร้อยไปทั้งหมด 🧴✨ แม้เป็นจุดเล็กๆ น้อยๆ แต่เพราะเป็นผลิตภัณฑ์ที่ใช้ทุกวัน เลยรู้สึกว่าสำคัญมากขึ้น\n\nโดยรวมแล้ว\nวันที่อยากล้างหน้าอย่างนุ่มนวลไม่ระคายเคือง\nวันที่ผิวไวต่อสิ่งเร้าขึ้นมา\nตอนที่ไม่อยากใช้อะไรมั่วๆ\n\nเป็นคลีนเซอร์ที่หยิบใช้ได้เองตามธรรมชาติในสถานการณ์แบบนี้ค่ะ 🙂"},images:[],video:"thumbnail/reviews/ALNlXzrZ.mp4"},

/* curated top-3 (proof carousel) vs. shuffled full list (bottom, all 50) — per product */
const BUBBLE_TOP_REVIEW_IDS=["A11oQOWA","qb2nRDaq","Z3mB7RKA"];
const MILK_TOP_REVIEW_IDS=["qQwWBzpJ","Zm2kR8Eq","Z04wvg4Z"];
const TOP_REVIEW_IDS_BY_KEY={milk:MILK_TOP_REVIEW_IDS,bubble:BUBBLE_TOP_REVIEW_IDS};
function pickTopReviews(reviews,ids){
  return ids.map(id=>reviews.find(r=>r.id===id)).filter(Boolean);
}
function shuffledBottomReviews(reviews,excludeIds){
  const arr=[...reviews];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  let swapFrom=3;
  for(let k=0;k<3&&k<arr.length;k++){
    while(excludeIds.includes(arr[k].id)&&swapFrom<arr.length){
      [arr[k],arr[swapFrom]]=[arr[swapFrom],arr[k]];
      swapFrom++;
    }
  }
  return arr;
}
function moreReviewsSlideHtml(ctx){
  return `<div class="review-slide"><div class="more-slide" onclick="goAllReviews('${ctx}')">

    <span class="more-arrow">↓</span>
  </div></div>`;
}
function goAllReviews(ctx){
  const el=$("sec-reviews-"+ctx);
  if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
}

/* shared mentions block — review list with load-more (product-agnostic) */
const reviewListState={};
const reviewSourceByCtx={};
function reviewItemHtml(r){
  const stars=r.rating?`<span class="review-stars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</span>`:"";
  const skinType=r.skinType?L(r.skinType):"";
  const sensitivity=r.sensitivity?L(r.sensitivity):"";
  const metaParts=[skinType,sensitivity].filter(v=>v&&v!=="-").join(" · ");
  const meta=metaParts?`<span class="review-meta">${metaParts}</span>`:"";
  const topRow=(stars||meta)?`<div class="review-top-row">${stars}${meta}</div>`:"";
  const highlight=r.highlight?`<div class="review-highlight">${L(r.highlight)}</div>`:"";
  const displayName=r.nick||r.id;
  const who=displayName?`<span class="who">${maskName(displayName)}</span>`:"";
  const media=((r.images&&r.images.length)||r.video)?`<div class="review-media">
    ${r.video?`<video class="review-video" src="${r.video}" controls playsinline preload="metadata"></video>`:""}
    ${(r.images||[]).map(src=>`<img class="review-img" src="${src}" alt="review photo" loading="lazy">`).join("")}
  </div>`:"";
  const translated=(state.lang!=="ko"&&r.quote&&r.quote[state.lang])?`<div class="review-mt-note">${T("자동 번역되었습니다 — 뉘앙스가 원문과 다를 수 있습니다.","Auto-translated - original nuances may be lost.")}</div>`:"";
  return `<div class="review-item">${topRow}${highlight}${media}<div class="quote">${L(r.quote)}${who}</div>${translated}</div>`;
}
function mentionsBlock(ctx,reviewsArr){
  reviewSourceByCtx[ctx]=reviewsArr;
  const visible=reviewListState[ctx]=reviewListState[ctx]||3;
  const items=reviewsArr.slice(0,visible);
  const hasMore=visible<reviewsArr.length;
  return `<div class="mentions">
    <div class="review-list" id="revlist-${ctx}">${items.map(reviewItemHtml).join("")}</div>
    ${hasMore?`<button class="load-more" id="loadmore-${ctx}" onclick="loadMoreReviews('${ctx}')">${T("더 보기","Load more")}</button>`:""}
  </div>`;
}
function loadMoreReviews(ctx){
  const arr=reviewSourceByCtx[ctx]||[];
  const cur=reviewListState[ctx]||3;
  const next=cur+3;
  const newItems=arr.slice(cur,next);
  $("revlist-"+ctx).insertAdjacentHTML("beforeend",newItems.map(reviewItemHtml).join(""));
  reviewListState[ctx]=next;
  if(next>=arr.length){
    const btn=$("loadmore-"+ctx);
    if(btn) btn.remove();
  }
}

      `}
    </div>

    <span class="label sub-label" style="margin-top:22px;">${T("임상 시험 결과","Clinical Study")}</span>
    <div class="stats">${DATA.clinicalStats.map(s=>`<div class="stat"><div class="v">${s.v}</div><div class="l">${L(s.l)}</div></div>`).join("")}</div>
    ${DATA.surveyStats?`
    <span class="label sub-label" style="margin-top:20px;">${T("소비자 만족도 조사","Consumer Study")}</span>
    <div class="survey-box">${DATA.surveyStats.map(s=>`<div class="survey-row"><div class="v">${s.v}</div><div class="l">${L(s.l)}</div></div>`).join("")}</div>
    `:""}
    <div class="note">${L(DATA.clinicalCombinedNote)}</div>
  `)}

  ${secBlock("howto",T("사용법","How to use"),`
    <div class="video-embed"><div style="padding:56.25% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/${DATA.videoId}?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479&amp;autoplay=1&amp;muted=1&amp;loop=1&amp;controls=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="${DATA.videoTitle}"></iframe></div></div>
    ${DATA.steps.map((s,i)=>`<div class="step"><div class="n">${i+1}</div><div class="s">${L(s)}</div></div>`).join("")}
  `)}

  ${secBlock("ingredients",T("핵심 성분","Key ingredients"),`
    ${DATA.ingredients.map(g=>`<div class="ingr"><div class="dot"></div><div><div class="n">${L(g.n)}</div><div class="d">${L(g.d)}</div></div></div>`).join("")}
    <div class="acc" onclick="toggleInci(this)"><span class="label-txt">${T("전체 성분 보기 (INCI)","See Full Ingredients")}</span><span class="plus">+</span></div>
    <div class="full-inci" id="fullInci">${L(DATA.fullInci)}<div class="note">${L(DATA.fullInciCaution)}</div></div>
  `)}

  ${secBlock("reviews-"+ctx,T("먼저 써본 고객들의 리뷰","What our customers are saying"),mentionsBlock(ctx,bottomReviews))}

  ${secBlock("routine",T("루틴을 완성해보세요","Complete Your Routine"),`
    <div class="cross">${productCard(other)}</div>
  `)}
  <div class="sec-acc-close"></div>

  <div class="sec">${footer()}</div>`;
  initHeroGallery();
  initReviewGallery();
  requestAnimationFrame(markScrollableReviewSlides);
}
function markScrollableReviewSlides(){
  document.querySelectorAll(".review-slide .review-item").forEach(el=>{
    const update=()=>{
      const atBottom=el.scrollTop+el.clientHeight>=el.scrollHeight-2;
      el.classList.toggle("has-more", el.scrollHeight>el.clientHeight+2 && !atBottom);
    };
    update();
    el.onscroll=update;
  });
}
function initHeroGallery(){
  const g=$("heroGallery"); if(!g) return;
  const dots=[...$("heroDots").querySelectorAll(".hero-dot")];
  g.scrollLeft=0;
  const setActive=idx=>dots.forEach((d,i)=>d.classList.toggle("active",i===idx));
  setActive(0);
  g.onscroll=()=>{ setActive(Math.min(dots.length-1,Math.round(g.scrollLeft/g.clientWidth))); };
}
function scrollHeroTo(idx){
  const g=$("heroGallery"); if(!g) return;
  g.scrollTo({left:g.clientWidth*idx,behavior:"smooth"});
}
function initReviewGallery(){
  const g=$("reviewGallery"); if(!g) return;
  const dotsWrap=$("reviewDots"); if(!dotsWrap) return;
  const dots=[...dotsWrap.querySelectorAll(".review-dot")];
  g.scrollLeft=0;
  const setActive=idx=>dots.forEach((d,i)=>d.classList.toggle("active",i===idx));
  setActive(0);
  g.onscroll=()=>{ setActive(Math.min(dots.length-1,Math.round(g.scrollLeft/g.clientWidth))); };
}
function scrollReviewTo(idx){
  const g=$("reviewGallery"); if(!g) return;
  g.scrollTo({left:g.clientWidth*idx,behavior:"smooth"});
}
function toggleInci(el){
  const box=$("fullInci");
  const open=box.classList.toggle("show");
  el.querySelector(".plus").textContent=open?"−":"+";
}
/* nav */
function updateGnbSolid(){
  const vp=document.querySelector(".viewport");
  $("gnb").classList.toggle("solid", vp.scrollTop>30);
}
function show(view){
  state.view=view;
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $(view).classList.add("active");
  $("gnb").style.display=view==="gate"?"none":"flex";
  $("btnBack").disabled=(view==="list");
  $("langLabel").textContent=LANGS.find(l=>l.code===state.lang).native;
  document.querySelector(".viewport").scrollTop=0;
  updateGnbSolid();
}
function pick(code){state.lang=code;renderGate();renderList();show("list");}
function goDetail(key){state.current=key;renderDetail();show("detail");}
function reset(){state.lang="ko";state.current=null;renderGate();show("gate");}

$("btnBack").onclick=()=>{ if(state.view==="detail")show("list"); };
$("btnHome").onclick=()=>$("homeNote").classList.add("show");
function closeNote(){$("homeNote").classList.remove("show");}
$("btnLang").onclick=()=>{
  $("sheetList").innerHTML=LANGS.map(l=>`<button class="gate-pill" onclick="pickSheet('${l.code}')"><span>${l.native}</span>${l.code===state.lang?checkIcon:''}</button>`).join("");
  $("langSheet").classList.add("show");
};
function pickSheet(code){state.lang=code;$("langSheet").classList.remove("show");renderGate();renderList();if(state.view==="detail")renderDetail();$("langLabel").textContent=LANGS.find(l=>l.code===code).label;}
$("langSheet").onclick=e=>{if(e.target.id==="langSheet")$("langSheet").classList.remove("show");};
$("homeNote").onclick=e=>{if(e.target.id==="homeNote")closeNote();};
document.querySelector(".viewport").addEventListener("scroll",updateGnbSolid);

renderGate();show("gate");
</script>
</body>
</html>
