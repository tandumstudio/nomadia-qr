name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .nojekyll
      - thumbnail/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage public site artifact
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          mkdir -p "$build_dir/thumbnail" "$build_dir/milk" "$build_dir/bubble"
          cp index.html .nojekyll "$build_dir/"
          cp -R thumbnail/. "$build_dir/thumbnail/"
          BUILD_DIR="$build_dir" node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const source = fs.readFileSync('index.html', 'utf8')
          const products = {
            milk: '블루 진정 판테놀 1% 클렌징 밀크',
            bubble: '골든 호호바 10% 듀얼 마이크로 버블 클렌저',
          }
          for (const [key, title] of Object.entries(products)) {
            const html = source
              .replace('<head>', '<head>\n<base href="../">')
              .replace('<title>NOMADIA</title>', `<title>${title}</title>`)
              .replace('<meta property="og:title" content="NOMADIA">', `<meta property="og:title" content="${title}">`)
              .replace('<meta name="twitter:title" content="NOMADIA">', `<meta name="twitter:title" content="${title}">`)
            fs.writeFileSync(path.join(process.env.BUILD_DIR, key, 'index.html'), html)
          }
          NODE
          echo "PAGES_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_BUILD_DIR }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
